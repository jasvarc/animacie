}
*{box-sizing:border-box}
[hidden]{display:none!important}

.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{margin:0;font-size:34px;line-height:1.15;color:var(--gold)}
.sub{color:var(--muted);margin:2px 0 0}

/* ===== Tlačidlá: aspoň 64 × 64 px, medzery aspoň 12 px ===== */
button{font:inherit;font-size:24px;color:var(--text);background:rgba(255,255,255,.08);border:2px solid var(--line);
  border-radius:20px;padding:8px 20px;min-height:64px;min-width:64px;cursor:pointer;touch-action:manipulation;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .15s,border-color .15s}
button:hover{background:rgba(255,255,255,.14);border-color:rgba(160,180,230,.45)}
button:focus-visible,[role="slider"]:focus-visible{outline:4px solid var(--gold2);outline-offset:3px}
button[aria-pressed="true"]{background:rgba(243,180,83,.22);border-color:var(--gold);color:var(--gold2)}
button.primary{background:linear-gradient(135deg,#f3b453,#d9772f);color:#1a0e02;border-color:transparent;font-weight:700}
button.primary:hover{filter:brightness(1.08)}
button:disabled{cursor:default;opacity:.5}
button svg{width:30px;height:30px;flex:none}

/* ===== Hlavička, hviezdičky a karty ===== */
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header .logo{width:64px;height:64px;flex:none}
header .logo svg{width:64px;height:64px;display:block}
header .reproduktor{margin-left:auto;flex:none}
header .reproduktor + .hviezdy{margin-left:0}
.hviezdy{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:64px;min-width:64px;padding:0 16px;
  border-radius:999px;background:var(--panel);border:2px solid var(--line);font-weight:800;font-size:28px;color:var(--gold2);flex:none}
.hviezdy .ikonaHviezdy{font-size:32px;line-height:1;color:var(--gold)}
@media (max-width:420px){header .titulky{display:none}}
/* záložky: jeden posuvný pás, vybraná karta sa vždy posunie do zorného poľa */
.karty{display:flex;gap:12px;margin-bottom:16px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;-webkit-overflow-scrolling:touch;
  scrollbar-color:rgba(160,180,230,.45) transparent}
.karty button{flex:1 0 150px;scroll-snap-align:start;flex-direction:row;min-height:72px;line-height:1.15;text-align:left;
  border-radius:22px;font-size:24px;gap:8px;padding:6px 12px}
.karty button svg{width:44px;height:44px}
.karty button[aria-selected="true"]{background:rgba(243,180,83,.22);border-color:var(--gold);color:var(--gold2)}
@media (max-width:520px){.karty button{flex-direction:column;text-align:center}}
.karta{background:var(--panel);border:1px solid var(--line);border-radius:26px;box-shadow:0 12px 40px rgba(0,0,0,.45);padding:12px;min-width:0}
@media (min-width:600px){.karta{padding:20px}}
footer{color:var(--muted);text-align:center;margin:18px 0 8px;font-size:24px}
.odkaz{display:flex;justify-content:center;margin-bottom:12px}

/* ===== Desiatko a bublina ===== */
.desiatko{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px}
.desiatkoPostava{flex:none}
.desiatkoPostava svg{display:block;width:84px;height:92px}
.desiatkoSvg .v-premysla,.desiatkoSvg .v-tesi,.desiatkoSvg .v-povzbudzuje{display:none}
.desiatkoSvg.vyraz-premysla .v-premysla,.desiatkoSvg.vyraz-tesi .v-tesi,.desiatkoSvg.vyraz-povzbudzuje .v-povzbudzuje{display:inline}
.bublina{position:relative;flex:1;min-width:0;min-height:92px;display:flex;align-items:center;
  background:#fdf8ec;color:#2a2318;border-radius:24px;padding:12px 18px;font-size:26px;line-height:1.3;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.bublina::before{content:"";position:absolute;left:-12px;bottom:22px;border:10px solid transparent;border-right:14px solid #fdf8ec;border-left:0}
@media (max-width:420px){.desiatkoPostava svg{width:64px;height:70px}.bublina{font-size:24px;padding:10px 14px;min-height:80px}}

/* ===== Režimy karty ===== */
.rezimy{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:12px}
.rezimy button{padding:6px 8px;line-height:1.1;min-height:72px;text-align:center}
@media (max-width:520px){.rezimy button:last-child:nth-child(odd){grid-column:1/-1}}

/* ===== Plocha: pod sebou, na šírku vedľa seba ===== */
.plocha,.lavo,.pravo{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.lavo,.pravo{width:100%}
.akcie{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;min-height:64px}
.akcie:empty{min-height:0}
.ovladanie{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.citac{min-width:120px;text-align:center;line-height:1.1}
.citac .cislo{display:block;font-size:64px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}
.citac .slovo{display:block;font-size:24px;color:var(--muted);min-height:32px}
button.znamienko{font-size:40px;font-weight:800;line-height:1;padding:0;width:72px;height:72px}

/* ===== Rámček: 2 riadky po 5 miest. Miesta sa dotýkajú, je to jeden rámček, medzery sú medzi žetónmi. ===== */
.ramcekObal{display:flex;flex-direction:column;align-items:center;gap:6px;margin-inline:-9px}
.ramcek{position:relative;display:grid;grid-template-columns:repeat(5,var(--bunka));grid-auto-rows:var(--bunka);
  background:#0b1020;border-radius:16px;box-shadow:0 0 0 3px var(--gold),0 8px 24px rgba(0,0,0,.4);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.miesto{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:0;margin:0;
  background:none;border:0;border-right:2px solid var(--line);border-radius:0}
.miesto:nth-child(5n+5){border-right:0}
.miesto:nth-child(1){border-top-left-radius:16px}.miesto:nth-child(5){border-top-right-radius:16px}
.miesto:nth-child(6){border-bottom-left-radius:16px}.miesto:nth-child(10){border-bottom-right-radius:16px}
.miesto:nth-child(n+6):nth-child(-n+10){border-top:4px solid rgba(243,180,83,.55)}
button.miesto:hover{background:rgba(255,255,255,.07)}
button.miesto:focus-visible{outline-offset:-5px}
.ramcek.prazdneSvieti .miesto.prazdne{background:rgba(255,216,138,.2);box-shadow:inset 0 0 0 3px var(--gold2)}
.miesto.riadokSvieti{background:rgba(255,216,138,.16)}
/* žetóny: prvé číslo = kruh, druhé číslo = zaoblený štvorec (iná farba aj iný tvar) */
.zeton{display:flex;align-items:center;justify-content:center;width:68%;height:68%;font-size:26px;font-weight:800;color:#0b1020;pointer-events:none}
.zeton.kruh{border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px #d9772f}
.zeton.stvorec{border-radius:22%;background:var(--blue);box-shadow:inset 0 0 0 3px #3f7fd0}
.zeton.duch{border-radius:22%;background:none;border:3px dashed var(--blue)}
.popisRiadku{min-height:34px;font-size:24px;font-weight:800;line-height:34px;color:var(--gold2);visibility:hidden}
.popisRiadku.ukaz{visibility:visible}
.ciara{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ciara path{fill:none;stroke:var(--gold2);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.ciara circle{fill:var(--gold2);stroke:#d9772f;stroke-width:5}
.ramcek.posuvny{touch-action:none;cursor:ew-resize}
@media (max-width:420px){.popisRiadku{min-height:32px}}

/* ===== Rovnica: číslice aspoň 56 px ===== */
.rovnica{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:0 12px;min-height:80px;font-size:56px;line-height:1.3;font-weight:800;font-variant-numeric:tabular-nums}
.rovnica .cA{color:var(--gold)}
.rovnica .cB{color:var(--blue)}
.rovnica .op{color:var(--muted);font-weight:700}
.rovnica .vysl{color:var(--text);border-radius:16px;padding:0 8px;transition:background .4s,color .4s}
.rovnica .vysl.svieti{background:rgba(255,216,138,.24);color:var(--gold2)}
.rovnica .otaznik{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:68px;border:3px dashed var(--blue);border-radius:16px;color:var(--blue)}

/* ===== Možnosti (4 čísla) ===== */
.moznosti{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:400px}
.moznosti button{position:relative;font:800 56px/1 system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;
  min-height:80px;padding:4px;border-radius:22px;background:#0b1020;color:var(--gold2)}
.moznosti .znacka{position:absolute;top:2px;right:6px;font-size:24px}
.moznosti button.dobre{background:rgba(127,220,143,.22);border:3px solid var(--green);color:#e9ffee}
.moznosti button.zle{border-style:dashed;color:var(--muted);text-decoration:line-through;opacity:.7}

/* ===== Číselnica ===== */
.klavesnica{display:flex;flex-direction:column;gap:12px;width:100%;max-width:400px}
.klavDispl{font:800 56px/1 ui-monospace,"Cascadia Mono",Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums;
  min-height:76px;display:flex;align-items:center;justify-content:center;background:#0b1020;border:3px solid var(--gold);border-radius:20px;color:var(--gold2)}
.klavMriezka{display:grid;grid-template-columns:repeat(4,minmax(64px,1fr));gap:12px}
.klavMriezka button{font-size:40px;font-weight:800;line-height:1;padding:0}

/* ===== Pyramída kamarátov: rady sa smerom nadol rozširujú, na telefóne sú rovnako široké ===== */
.pyramida{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.pyramida .rad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.pyramida .rad.jeden{grid-template-columns:minmax(0,1fr);max-width:calc(50% - 6px)}
@media (min-width:600px){
  .pyramida .rad.jeden{max-width:190px}
  .pyramida .rad:nth-child(2){max-width:392px}
  .pyramida .rad:nth-child(3){max-width:450px}
  .pyramida .rad:nth-child(4){max-width:510px}
  .pyramida .rad:nth-child(5){max-width:570px}
}
button.par{position:relative;font-size:56px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;
  min-height:84px;width:100%;min-width:0;padding:4px;background:#0b1020;color:var(--gold2)}
button.par.najdena{background:rgba(127,220,143,.22);border:3px solid var(--green);color:#e9ffee}
button.par.otoc{border:3px dashed var(--blue);color:var(--blue);font-size:30px;gap:6px}
button.par .znacka{position:absolute;top:0;left:6px;font-size:24px;line-height:1.3}
button.par .hviezdaParu{position:absolute;top:0;right:6px;font-size:24px;line-height:1.3;color:var(--gold)}

.letiacaHviezda{position:fixed;z-index:50;font-size:44px;line-height:1;color:var(--gold);pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.5)}

/* ===== Dva rámčeky, veta, prehrávač ===== */
select:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid var(--gold2);outline-offset:3px}
.scena{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.dvaRamceky{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.stlpRamceka{display:flex;flex-direction:column;align-items:center;gap:6px}
.popisRamceka{min-height:40px;font-size:28px;line-height:40px;font-weight:800;color:var(--gold2);text-align:center}
.ramcek.plny{box-shadow:0 0 0 5px var(--gold2),0 8px 24px rgba(0,0,0,.4)}
.ramcek.tahaci .miesto{touch-action:none;cursor:grab}
.letiaciZeton{position:fixed;left:0;top:0;z-index:40}
.veta{display:flex;flex-wrap:wrap;justify-content:center;gap:0 14px;font-size:56px;line-height:1.3;font-weight:800;font-variant-numeric:tabular-nums}
.castVety{white-space:nowrap}
.castVety.skryta{visibility:hidden}
.veta.bezMiesta .castVety.skryta{display:none}
.castVety.posledna{color:var(--gold2)}
.poznamkaDieta{color:var(--muted);text-align:center;margin:0}
.miniNapoveda{width:100%;border:2px dashed var(--gold);border-radius:18px;padding:8px}
.scena.mini .dvaRamceky{flex-direction:row;justify-content:center;gap:12px;--bunka:28px}
.scena.mini .ramcekObal{margin-inline:0}
.scena.mini .popisRamceka{font-size:24px;min-height:34px;line-height:34px}
/* na telefóne ostanú Späť a Ďalej vždy na obrazovke, aby dieťa pri ťukaní videlo rámčeky */
.prehravac{display:contents}
.tlacidlaPrehravaca{position:sticky;bottom:0;z-index:5;flex-wrap:nowrap;width:100%;padding:8px 0;border-radius:20px;background:#0b1020}
.tlacidlaPrehravaca button{padding:8px 10px}
.obalPosuvnika{display:flex;align-items:center;gap:12px;width:100%;max-width:400px}
.ikonaPosuvnika{flex:none;width:48px;height:48px}
.ikonaPosuvnika svg{width:100%;height:100%;display:block}
input.posuvnik{flex:1;min-width:0;height:64px;margin:0;accent-color:var(--gold);cursor:pointer;touch-action:pan-y}
input.posuvnik::-webkit-slider-thumb{width:48px;height:48px}
.vyber{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:12px;width:100%}
.vyber label{display:flex;flex-direction:column;align-items:center;gap:4px}
.vyber select{font:inherit;font-size:32px;font-weight:800;min-height:64px;min-width:96px;border-radius:12px;padding:4px 10px;background:#0b1020;color:var(--text);border:2px solid var(--line)}
.vyber .poznamkaDieta{width:100%}

/* ===== Číselná os ===== */
.osObal{width:100%;min-width:0}
.os{display:block;width:100%;overflow:visible;-webkit-user-select:none;user-select:none}
.os.tukacia{cursor:pointer}
.os line{stroke:var(--text);stroke-width:2;stroke-linecap:round}
.os line.hlavna{stroke-width:4}
.os line.desiat{stroke:var(--gold2);stroke-width:7}
.os text{font:600 24px system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--muted);text-anchor:middle}
.os text.hlavne{fill:var(--text);font-weight:800}
.os text.desiat{fill:var(--gold2);font-weight:800}
.os text.oblukText{font-size:30px;font-weight:800;paint-order:stroke;stroke:#0b1020;stroke-width:6px}
.os text.A{fill:var(--gold)}.os text.B{fill:var(--blue)}
.osObluk{fill:none;stroke-width:5;stroke-linecap:round}
.osObluk.A{stroke:var(--gold)}.osObluk.B{stroke:var(--blue)}.osObluk.C{stroke:var(--muted);stroke-width:3}
.pasCisel{display:flex;gap:12px;overflow-x:auto;width:100%;padding:4px 4px 10px;-webkit-overflow-scrolling:touch;scrollbar-color:rgba(160,180,230,.45) transparent}
.pasCisel button{flex:0 0 64px;font-size:32px;font-weight:800;padding:0}
.pasCisel button.desiat{border:3px solid var(--gold);color:var(--gold2)}

/* ===== Porovnanie ciest ===== */
.porovnanie{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;width:100%}
.cesta{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:8px;border:2px solid var(--line);border-radius:20px;background:rgba(255,255,255,.04)}
.cesta.kratsia{border:3px solid var(--green)}
.cesta .ramcekObal{margin-inline:0;--bunka:44px}
.cestaNadpis{font-size:26px;font-weight:800;color:var(--gold2);text-align:center}
.cestaZnacka{font-size:24px;font-weight:800;color:#c9f5d1;min-height:34px}
.vyberCesty{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:400px}
button.par.zle{border-style:dashed;color:var(--muted);opacity:.7}
details.sikovni{width:100%;background:rgba(255,255,255,.06);border:2px dashed var(--line);border-radius:18px;padding:0 14px}
details.sikovni summary{min-height:64px;display:flex;align-items:center;cursor:pointer;color:var(--gold2);font-weight:700}
.zvedavi{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0 0 12px}

@media (min-width:740px){
  .dvaRamceky{flex-direction:row;justify-content:center;gap:20px;--bunka:clamp(64px,calc((min(100vw,820px) - 110px) / 10),96px)}
  .dvaRamceky .ramcekObal{margin-inline:0}
  .porovnanie{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ===== Tyče a kocky ===== */
.tyce{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:8px;width:100%;min-height:150px}
.tyc{display:grid;grid-template-rows:repeat(10,1fr);width:22px;height:150px;gap:1px;padding:1px;border-radius:5px;background:#d9772f}
.tyc i{display:block;background:var(--gold);border-radius:2px}
.tyc.b{background:#3f7fd0}
.tyc.b i{background:var(--blue)}
.cifry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:400px;text-align:center}
.cifra{display:flex;flex-direction:column;background:#0b1020;border:2px solid var(--line);border-radius:16px;padding:2px 4px;color:var(--muted)}
.cifra b{font-size:56px;line-height:1.1;color:var(--gold2);font-variant-numeric:tabular-nums}
.cesta .dvaRamceky{flex-direction:column;--bunka:44px}
.cesta .tyce{min-height:100px}
.cesta .tyc{height:100px}
.cesta .cifra b{font-size:56px}
.stitokSikovni{font-weight:800;color:var(--gold2);border:2px dashed var(--gold);border-radius:999px;padding:2px 18px}
.klavHlaska{min-height:0;text-align:center;color:var(--gold2)}
.klavHlaska:empty{display:none}

/* ===== Rodina čísel a chýbajúce číslo ===== */
.trojuholnik{display:block;width:300px;max-width:100%;height:auto}
.trojuholnik line{stroke:var(--muted);stroke-width:4;stroke-linecap:round}
.trojuholnik circle{fill:#0b1020;stroke:var(--gold);stroke-width:4}
.trojuholnik circle.b{stroke:var(--blue)}
.trojuholnik circle.c{stroke:var(--gold2)}
.trojuholnik text{font:800 56px system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-anchor:middle;fill:var(--gold)}
.trojuholnik text.b{fill:var(--blue)}
.trojuholnik text.c{fill:var(--gold2)}
.vetyRodiny{display:flex;flex-direction:column;align-items:center;font-size:56px;line-height:1.25;font-weight:800;font-variant-numeric:tabular-nums}
.vetyRodiny .skryta{visibility:hidden}
.vybery{display:flex;flex-direction:column;gap:12px;width:100%;max-width:400px}
.lista{display:grid;grid-template-columns:repeat(4,minmax(64px,1fr));gap:12px;width:100%;max-width:400px}
.lista button{font-size:40px;font-weight:800;line-height:1;padding:0}
.lista button.zle{border-style:dashed;color:var(--muted);text-decoration:line-through;opacity:.7}
.lista button.dobre{background:rgba(127,220,143,.22);border:3px solid var(--green);color:#e9ffee}

/* ===== Slovné úlohy, Opravárik, Kvíz ===== */
.zadanieUlohy{margin:0;text-align:center;font-weight:600;max-width:640px}
.ramcek.sObrazkom .zeton{background:#fdf8ec}
.zeton svg{width:80%;height:80%;display:block}
button.par.opravit{border:3px dashed var(--gold);color:var(--gold2)}
button.par.slovne{font-size:24px;font-weight:700;white-space:normal}
.moznosti.tri{grid-template-columns:repeat(3,minmax(0,1fr))}
.kvizInfo{font-weight:700;color:var(--muted)}
.plaketaKonca{font-size:56px;font-weight:800;color:var(--gold2)}
.miniRiesenie{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.miniRiesenie:empty{display:none}

/* ===== Panel pre rodiča a učiteľa ===== */
header .ikonaRodic{margin-left:auto;flex:none}
header .reproduktor:not([hidden]) + .ikonaRodic{margin-left:0}
header .ikonaRodic + .hviezdy{margin-left:0}
details.rodic{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:0 16px}
details.rodic summary{min-height:64px;display:flex;align-items:center;cursor:pointer;color:var(--muted);font-weight:700}
details.rodic[open]{padding-bottom:16px}
details.rodic h2{font-size:26px;color:var(--gold2);margin:18px 0 6px}
details.rodic ul,details.rodic ol{margin:0;padding-left:30px}
details.rodic p{margin:6px 0}
.volba{display:flex;flex-wrap:wrap;align-items:center;gap:12px;min-height:64px;margin:6px 0;cursor:pointer}
.volba input{width:32px;height:32px;flex:none;accent-color:var(--gold)}
.volba select{font:inherit;min-height:64px;max-width:100%;border-radius:12px;padding:4px 10px;background:#0b1020;color:var(--text);border:2px solid var(--line)}
.poznamka{color:var(--muted);margin:8px 0 0}
.bezRozkladu .castVety:not(:first-child):not(.posledna){display:none}

/* ===== Pracovný list ===== */
.nahladListu{width:100%;background:#fff;border-radius:12px;padding:8px;overflow:hidden}
.listSvg{display:block;width:100%;height:auto}
.listRiesenia{margin-top:12px}
.listSvg text{font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#000}

/* ===== Tlač: len pracovný list, jedna strana A4, aj čiernobielo; riešenia na samostatnej strane ===== */
@media print{
  @page{size:A4 portrait;margin:12mm 10mm}
  html,body{background:#fff!important;color:#000}
  body{background-image:none!important}
  header,nav,.odkaz,details.rodic,footer,#testy,noscript{display:none!important}
  .wrap{max-width:none;padding:0;margin:0}
  main>.karta{display:none!important}
  #karta-list{display:block!important;background:none;border:0;box-shadow:none;padding:0}
  #karta-list .rezimy,#karta-list .desiatko,#karta-list .ovladanieListu{display:none!important}
  #karta-list .plocha{display:block}
  .nahladListu{margin:0;padding:0;border-radius:0;background:none;overflow:visible}
  .listSvg{width:190mm;height:270mm}
  .listRiesenia{margin:0;break-before:page}
}

/* ===== Na šírku (tablet, počítač): rámček vľavo, ovládanie vpravo ===== */
@media (min-width:760px) and (orientation:landscape){
  .wrap{max-width:1180px}
  header{margin-bottom:10px}
  .karty{margin-bottom:12px}
  .plocha.dvojstlpec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
  .dvaRamceky{--bunka:clamp(64px,calc((min(100vw,1180px) - 110px) / 10),96px)}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ----- výsledky testov (?test) ----- */
#testy{white-space:pre-wrap;font:24px/1.3 ui-monospace,Consolas,monospace;background:#0b1020;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px}

<script>
'use strict';
const T = TEXTY;

/* =====================================================================
   STAV (nič sa neukladá, hviezdičky platia len počas otvorenej stránky)
   ===================================================================== */
const STAV = {
  karta: null,
  hviezdy: 0,
  hlas: false,          // čítanie nahlas je predvolene vypnuté
  vynutPohyb: false,    // len pre testy

  // nastavenia panela pre rodiča: úroveň kvízu (1 až 3), pomôcka v ukážkach, vety s rozkladom
  nastavenia: { uroven: 1, pomocka: 'ramceky', rozklad: true },
  // štatistika len v relácii; zobrazí ju panel Pre rodiča a učiteľa, dieťaťu sa neukazuje
  statistika: { bezPomoci: 0, sPomocou: 0, chyby: { swappedDigits: 0, forgotTen: 0, forgotFiller: 0, offByOne: 0, forgotRegroup: 0, ine: 0 } }
};
const PORADIE_KARIET = ['ramcek', 'kamarati', 'cezDesiatku', 'os', 'poradie', 'tyce', 'balit', 'rodina', 'chybajuce', 'dveDesiatky', 'slovne', 'opravarik', 'kviz', 'list'];

/* =====================================================================
   MATEMATICKÝ MODUL – jediný, používajú ho všetky časti
   ===================================================================== */
const DESIAT = 10, MIEST = 10, V_RIADKU = 5;
const jeCele = (x, od, po) => Number.isInteger(x) && x >= od && x <= po;

// usporiadané dvojice (a, 10 − a) pre a od 1 do 9
function bondsOrdered() {
  const v = [];
  for (let a = 1; a <= 9; a++) v.push([a, DESIAT - a]);
  return v;
}
// dvojice bez ohľadu na poradie: 1+9, 2+8, 3+7, 4+6, 5+5
function bondsUnordered() { return bondsOrdered().filter(([a, b]) => a <= b); }
// doplnok do desiatky
function filler(a) {
  if (!jeCele(a, 1, 9)) throw new RangeError('filler: ' + a);
  return DESIAT - a;
}
// rozklad príkladu cez desiatku; pre a + b ≤ 10 vyhodí chybu
function crossInfo(a, b) {
  if (!jeCele(a, 1, 9) || !jeCele(b, 1, 9)) throw new RangeError('crossInfo: ' + a + ', ' + b);
  if (a + b <= DESIAT) throw new RangeError(T.matematika.neniCezDesiatku);
  const doplnok = filler(a), remainder = b - doplnok, result = a + b;
  return { a, b, filler: doplnok, remainder, result,
    sentence: `${a} + ${b} = ${a} + ${doplnok} + ${remainder} = ${DESIAT} + ${remainder} = ${result}` };
}
// výhodnejšie poradie: najprv väčšie číslo (kratší doplnok)
function bestOrder(a, b) { return a >= b ? [a, b] : [b, a]; }
// všetky usporiadané dvojice a, b od 2 do 9 so súčtom aspoň 11 (36 dvojíc)
function enumerateLevel1() {
  const v = [];
  for (let a = 2; a <= 9; a++) for (let b = 2; b <= 9; b++) if (a + b >= 11) v.push([a, b]);
  return v;
}
// posledný príklad podľa generátora, aby sa ten istý príklad neopakoval dvakrát po sebe
const POSLEDNY_PRIKLAD = new WeakMap();
// náhodný príklad; s generátorom so semienkom je postupnosť vždy rovnaká
function generateProblem(level, rng = Math.random) {
  const uroven = { 1: [enumerateLevel1, crossInfo], 2: [enumerateLevel2, crossInfo2], 3: [enumerateLevel3, crossInfo3] }[level];
  if (!uroven) throw new RangeError('generateProblem: úroveň ' + level);
  const posledny = POSLEDNY_PRIKLAD.get(rng);
  const zoznam = uroven[0]().filter(([a, b]) => !posledny || a !== posledny[0] || b !== posledny[1]);
  const vyber = zoznam[Math.floor(rng() * zoznam.length)];
  POSLEDNY_PRIKLAD.set(rng, vyber);
  return uroven[1](vyber[0], vyber[1]);
}
// najbližšia vyššia desiatka: 28 → 30, 30 → 40
function nextTen(n) { return (Math.floor(n / 10) + 1) * 10; }
function tensOnes(n) { return { tens: Math.floor(n / 10), ones: n % 10 }; }
// úroveň 2: a = 10k + u, b od 2 do 9, u + b ≥ 11 (288 príkladov)
function enumerateLevel2() {
  const v = [];
  for (let k = 1; k <= 8; k++) for (const [u, b] of enumerateLevel1()) v.push([10 * k + u, b]);
  return v;
}
function crossInfo2(a, b) {
  if (!jeCele(a, 2, 89) || !jeCele(b, 2, 9)) throw new RangeError('crossInfo2: ' + a + ', ' + b);
  if (a % 10 + b < 11) throw new RangeError(T.matematika.neniCezDesiatku);
  const n = nextTen(a), f = n - a, z = b - f, v = a + b;
  return { a, b, filler: f, remainder: z, result: v, steps: [`${a} + ${f} = ${n}`, `${n} + ${z} = ${v}`],
    sentence: `${a} + ${b} = ${a} + ${f} + ${z} = ${n} + ${z} = ${v}` };
}
// príklady úrovne 2 bez prechodu cez desiatku (23 + 4): len sa pridajú kocky
function enumerateBezPrechodu() {
  const v = [];
  for (let k = 1; k <= 8; k++) for (let u = 2; u <= 9; u++) for (let b = 2; b <= 9; b++) if (u + b <= 9) v.push([10 * k + u, b]);
  return v;
}
// úroveň 3: a = 10k + u, b = 10m + v, k + m ≤ 8, u + v ≥ 11 (1 008 príkladov)
function enumerateLevel3() {
  const zoznam = [];
  for (let k = 1; k <= 7; k++) for (let m = 1; k + m <= 8; m++) for (const [u, v] of enumerateLevel1()) zoznam.push([10 * k + u, 10 * m + v]);
  return zoznam;
}
// najprv desiatky b, potom doplnenie do desiatky a zvyšok
function crossInfo3(a, b) {
  const { tens: m, ones: v } = tensOnes(b);
  if (a % 10 + v < 11) throw new RangeError(T.matematika.neniCezDesiatku);
  const po = a + m * 10, n = nextTen(po), f = n - po, z = v - f, vysledok = a + b;
  return { a, b, filler: f, remainder: z, result: vysledok,
    steps: [`${a} + ${m * 10} = ${po}`, `${po} + ${f} = ${n}`, `${n} + ${z} = ${vysledok}`] };
}
// rodina čísel: štyri vety, pri a = b dve
function family(a, b) {
  const c = a + b;
  return [...new Set([`${a} + ${b} = ${c}`, `${b} + ${a} = ${c}`, `${c} − ${b} = ${a}`, `${c} − ${a} = ${b}`])];
}
// pravdivosť vety „13 − 5 = 8“ sa vždy počíta, nikdy sa neberie z textu
function platiVeta(veta) {
  const m = /^(\d+) ([+−]) (\d+) = (\d+)$/.exec(veta);
  if (!m) return false;
  const [x, y, z] = [Number(m[1]), Number(m[3]), Number(m[4])];
  return (m[2] === '+' ? x + y : x - y) === z;
}
const vysledokSuhlasi = (a, b, uvedene) => a + b === uvedene;
const skuskaOdcitanim = (uvedene, b) => uvedene - b;
// príklad na kontrolu; nesprávny má výsledok o 1 až 3 vedľa, vždy do 20 a tak, aby sa dalo odčítať
function prikladNaKontrolu(rng, spravny) {
  const zoznam = enumerateLevel1(), [a, b] = zoznam[Math.floor(rng() * zoznam.length)];
  if (spravny) return { a, b, uvedene: a + b };
  const posuny = [-3, -2, -1, 1, 2, 3].filter(d => a + b + d <= 20 && a + b + d > b);
  return { a, b, uvedene: a + b + posuny[Math.floor(rng() * posuny.length)] };
}
// □ + b = c alebo a + □ = c; miesto je 'prve' alebo 'druhe'
function zadanieChybajuce(a, b, miesto) {
  return { miesto, znamy: miesto === 'prve' ? b : a, c: a + b, riesenie: miesto === 'prve' ? a : b };
}
const zapisChybajuce = (z, x = '□') => (z.miesto === 'prve' ? `${x} + ${z.znamy} = ${z.c}` : `${z.znamy} + ${x} = ${z.c}`);
// všetky čísla, ktoré sedia na prázdne miesto
function rieseniaChybajuceho(znamy, c) {
  return Array.from({ length: c + 1 }, (_, x) => x).filter(x => x + znamy === c);
}
// stavy karty Tyče: hodnota (tyče a kocky spolu) je v každom kroku rovnaká
function stavTyci(krok, tyce, bTyce, kruhy, vlavo, vpravo, odkryte, zbalene = false) {
  return { krok, tyce, bTyce, kruhy, vlavo, vpravo, odkryte, zbalene, hodnota: 10 * (tyce + bTyce) + kruhy + vlavo + vpravo };
}
function stavyTyci(a, b) {
  const { tens, ones } = tensOnes(a);
  if (ones + b < 10) return [stavTyci(1, tens, 0, ones, 0, b, 1), stavTyci(2, tens, 0, ones, b, 0, 2)];
  const { filler: f, remainder: z } = crossInfo2(a, b);
  return [stavTyci(1, tens, 0, ones, 0, b, 1), stavTyci(2, tens, 0, ones, f, z, 2), stavTyci(3, tens + 1, 0, 0, 0, z, 2, true),
    stavTyci(4, tens + 1, 0, 0, z, 0, 3, true), stavTyci(5, tens + 1, 0, 0, z, 0, 4, true)];
}
const vetaTyci = (a, b) => (a % 10 + b >= 11 ? crossInfo2(a, b).sentence : `${a} + ${b} = ${a + b}`);
function stavyUroven3(a, b) {
  const { tens: k, ones: u } = tensOnes(a), { tens: m, ones: v } = tensOnes(b), { filler: f, remainder: z } = crossInfo3(a, b);
  return [stavTyci(1, k, m, u, 0, v, 1), stavTyci(2, k + m, 0, u, 0, v, 2), stavTyci(3, k + m, 0, u, f, z, 3),
    stavTyci(4, k + m + 1, 0, 0, 0, z, 3, true), stavTyci(5, k + m + 1, 0, 0, z, 0, 4, true)];
}
// generátor náhodných čísel so semienkom
function generatorSoSemienkom(semienko) {
  let a = semienko >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// slovenské číslovky 0 až 100; rod: null (abstraktné počítanie), 'm', 'f', 'n'
function numWords(n, gender = null) {
  if (!jeCele(n, 0, 100)) throw new RangeError('numWords: ' + n);
  if (gender !== null && !(gender in T.cislovky.jedna)) throw new RangeError('numWords: rod ' + gender);
  const c = T.cislovky;
  if (n === 100) return c.sto;
  if (n >= 10 && n < 20) return c.nascte[n - 10];
  const j = n % 10;
  // jednotky s rodom; v zloženinách bez rodu sa hovorí „jeden“ a „dva“
  const jednotka = zlozene => {
    if (j === 1) return gender ? c.jedna[gender] : zlozene ? c.jedna.m : c.jednotky[1];
    if (j === 2) return gender ? c.dva[gender] : c.jednotky[2];
    return c.jednotky[j];
  };
  if (n < 10) return jednotka(false);
  return c.desiatky[Math.floor(n / 10)] + (j ? jednotka(true) : '');
}
// poloha miesta i (0 až 9): 2 riadky po 5, zľava doprava, horný riadok najprv
function miestoRamceka(i) { return { riadok: Math.floor(i / V_RIADKU), stlpec: i % V_RIADKU }; }
// obsah rámčeka: najprv kruhy, potom štvorce; nikdy nepretečie cez 10 miest
function naplnRamcek(kruhy, stvorce = 0, duchovia = 0) {
  const k = Math.max(0, Math.min(MIEST, kruhy));
  const s = Math.max(0, Math.min(MIEST - k, stvorce));
  const d = Math.max(0, Math.min(MIEST - k - s, duchovia));
  return Array.from({ length: MIEST }, (_, i) => (i < k ? 'kruh' : i < k + s ? 'stvorec' : i < k + s + d ? 'duch' : null));
}
// štyri možnosti pre kamaráta čísla n: správna a tri blízke, vždy od 1 do 9
function moznostiKamarata(n, rng = Math.random) {
  const spravna = filler(n);
  const ine = [...new Set([n, spravna + 1, spravna - 1, spravna + 2, spravna - 2])].filter(x => x !== spravna && x >= 1 && x <= 9);
  return zamiesaj([spravna, ...ine.slice(0, 3)], rng);
}
// nasledujúce číslo od 1 do 9, nikdy nie to isté dvakrát po sebe
function dalsieCislo(rng, posledne) {
  const moznosti = [1, 2, 3, 4, 5, 6, 7, 8, 9].filter(x => x !== posledne);
  return moznosti[Math.floor(rng() * moznosti.length)];
}
// vstup číselnice: zo starého textu a stlačenej klávesy vyrobí nový text (najviac max číslic, bez núl na začiatku)
function vstupKlavesnice(text, klaves, max = 3) {
  if (klaves === '⌫') return text.slice(0, -1);
  if (!/^\d$/.test(klaves)) return text;
  if (text === '0') return klaves;
  return text.length >= max ? text : text + klaves;
}
// stavový stroj karty Cez desiatku: 5 krokov; súčet žetónov je v každom kroku a + b
function stavyCezDesiatku(a, b) {
  const c = crossInfo(a, b);
  const stav = (krok, presunute, odkryte, desiatka) => ({ krok, lavyKruhy: a, lavyStvorce: presunute, pravyStvorce: b - presunute,
    spolu: a + b, odkryte, desiatka, vysledok: krok === 5 ? c.result : null });
  return [stav(1, 0, 1, false), stav(2, c.filler, 2, false), stav(3, c.filler, 2, true), stav(4, c.filler, 3, true), stav(5, c.filler, 4, true)];
}
// medzistavy kroku 2: štvorce sa presúvajú po jednom
function medzistavyPresunu(a, b) {
  return Array.from({ length: filler(a) }, (_, i) => ({ lavyKruhy: a, lavyStvorce: i + 1, pravyStvorce: b - i - 1 }));
}
// dva skoky cez desiatku; prvé číslo je štart, nepočíta sa ako skok
function skokyNaOsi(a, b) {
  const n = nextTen(a), f = n - a;
  return [{ od: a, do: n, dlzka: f }, { od: n, do: a + b, dlzka: b - f }];
}
// počítanie po jednej: b malých skokov
function skokyPoJednej(a, b) {
  return Array.from({ length: b }, (_, i) => ({ od: a + i, do: a + i + 1, dlzka: 1 }));
}
// typ chyby pri odpovedi na a + b, alebo null (správne alebo bez typu)
function diagnoseError(a, b, odpoved) {
  const vysledok = a + b, { tens, ones } = tensOnes(a);
  if (odpoved === vysledok) return null;
  // zlúčené číslice bez zbalenia: 28 + 5 → 2 a 13 → 213
  if (tens > 0 && ones + b >= 10 && String(odpoved) === `${tens}${ones + b}`) return 'forgotRegroup';
  if (String(odpoved) === String(vysledok).split('').reverse().join('')) return 'swappedDigits';
  if (odpoved === vysledok - DESIAT) return 'forgotTen';
  if (odpoved === nextTen(a) + b) return 'forgotFiller';
  if (Math.abs(odpoved - vysledok) === 1) return 'offByOne';
  return null;
}
// obe poradia príkladu; kratsia = index kratšej cesty (podľa bestOrder), pri a = b null
function porovnajPoradia(a, b) {
  const [prve] = bestOrder(a, b);
  return { cesty: [{ a, b, filler: filler(a) }, { a: b, b: a, filler: filler(b) }], kratsia: a === b ? null : prve === a ? 0 : 1 };
}
// tvar slova podľa čísla: 1 → tvary[0], 2 až 4 → tvary[1], inak tvary[2]
const tvarPodlaCisla = (n, tvary) => tvary[n === 1 ? 0 : n >= 2 && n <= 4 ? 1 : 2];

/* ----- slovné úlohy: gramatika a zadania (čísla do 20) ----- */
const NOUNS = T.nouns;
// 1 → jablko, 2 až 4 → jablká, inak → jabĺk
function nounForm(n, noun) { return tvarPodlaCisla(n, [noun.j, noun.mn, noun.gen]); }
function verbForm(n) { return n >= 2 && n <= 4 ? 'sú' : 'je'; }
// sablona je 0 alebo 1; text sa skladá z číslic a tvarov podľa nounForm a verbForm
function slovnaUloha(a, b, noun, sablona) {
  const text = fmt(T.sablony[sablona], { je: verbForm(a), je2: verbForm(b), a, b, A: nounForm(a, noun), B: nounForm(b, noun) });
  return { a, b, noun, sablona, text, spravne: a + b };
}
// nikdy dvakrát po sebe to isté zadanie
function generujSlovnu(rng, posledna = null) {
  const zoznam = enumerateLevel1();
  for (;;) {
    const [a, b] = zoznam[Math.floor(rng() * zoznam.length)];
    const u = slovnaUloha(a, b, NOUNS[Math.floor(rng() * NOUNS.length)], Math.floor(rng() * T.sablony.length));
    if (!posledna || u.text !== posledna.text) return u;
  }
}
// text pre hlas: číslovky v rode podstatného mena
const hlasUlohy = u => u.text.replace(/\d+/g, n => numWords(Number(n), u.noun.rod));

/* ----- Opravárik: vyriešený príklad s jednou chybou; výsledok sa vždy počíta ----- */
const TYPY_OPRAV = ['forgotFiller', 'forgotTen', 'wrongFiller', 'offByOne'];
function opravarik(a, b, typ) {
  const { filler: f, remainder: r, result: v } = crossInfo(a, b), prvy = `${a} + ${b}`;
  const sablona = {
    forgotFiller: { kroky: [prvy, `${a} + ${f} + ${b}`, `${DESIAT} + ${b}`, `${DESIAT + b}`], chybny: 1 },
    forgotTen: { kroky: [prvy, `${a} + ${f} + ${r}`, `${DESIAT} + ${r}`, `${r}`], chybny: 3 },
    wrongFiller: { kroky: [prvy, `${a} + ${f + 1} + ${r - 1}`, `${DESIAT} + ${r - 1}`, `${v - 1}`], chybny: 1 },
    offByOne: { kroky: [prvy, `${a} + ${f} + ${r}`, `${DESIAT} + ${r}`, `${DESIAT + r + 1}`], chybny: 3 }
  }[typ];

// krok je chybný, ak nesedí jeho súčet, alebo ak po doplnení nevznikne desiatka
function krokJeChybny(o, i) {

  if (cisla.reduce((x, y) => x + y, 0) !== o.a + o.b) return true;
  return i === 1 && o.a + cisla[1] !== DESIAT;
}
// tri rôzne možnosti: správna, voliteľne daná nesprávna a blízke čísla
function moznosti3(spravna, rng, povinna = null) {
  const pevne = povinna !== null && povinna !== spravna ? [povinna] : [];
  const blizke = [spravna + 1, spravna - 1, spravna + 2, spravna - 2, spravna + 3].filter(x => x >= 0 && !pevne.includes(x));
  return zamiesaj([spravna, ...pevne, ...zamiesaj(blizke, rng)].slice(0, 3), rng);
}

/* ----- Kvíz: otázky sa skladajú z modulu, jeSpravna vždy počíta ----- */
const TYPY_KVIZU = ['sucet', 'dopln', 'zostalo', 'kamarat', 'cesta', 'os', 'kontrola', 'chybajuce', 'slovna', 'opravarik'];
const POCET_OTAZOK = 12;
function otazkaKvizu(typ, rng) {
  const Q = T.kartaKviz.otazky, c = generateProblem(1, rng), { a, b } = c, n = 1 + Math.floor(rng() * 9);
  const cisla = (spravna, povinna = null) => moznosti3(spravna, rng, povinna).map(String);
  const q = { sucet() { return { text: fmt(Q.sucet, { a, b }), rovnica: `${a} + ${b} = ?`, moznosti: cisla(a + b), jeSpravna: m => Number(m) === a + b, ukazka: { a, b }, diag: { a, b } }; },
    dopln() { return { text: Q.dopln, rovnica: `${n} + □ = ${DESIAT}`, moznosti: cisla(filler(n)), jeSpravna: m => n + Number(m) === DESIAT, ukazka: { n } }; },
    zostalo() { return { text: Q.zostalo, rovnica: `${a} + ${b}`, moznosti: cisla(c.remainder, c.filler), jeSpravna: m => Number(m) === a + b - DESIAT, ukazka: { a, b } }; },
    kamarat() { return { text: fmt(Q.kamarat, { n }), rovnica: `${n} + □ = ${DESIAT}`, moznosti: cisla(filler(n), n), jeSpravna: m => n + Number(m) === DESIAT, ukazka: { n } }; },
    cesta() {
      const rozne = enumerateLevel1().filter(([x, y]) => x !== y), [v, m] = bestOrder(...rozne[Math.floor(rng() * rozne.length)]);
      return { text: Q.cesta, moznosti: zamiesaj([`${v} + ${m}`, `${m} + ${v}`], rng), jeSpravna: t => filler(Number(t.split(' + ')[0])) === Math.min(filler(v), filler(m)), ukazka: { a: v, b: m } };
    },

    uroven2() {

    },

      return { text: Q.kontrola, rovnica: `${p.a} + ${p.b} = ${p.uvedene}`, moznosti: [suhlasi, nesuhlasi], jeSpravna: m => (m === suhlasi) === vysledokSuhlasi(p.a, p.b, p.uvedene), ukazka: { a: p.a, b: p.b } };
    },
    chybajuce() {
      const z = zadanieChybajuce(a, b, rng() < 0.5 ? 'prve' : 'druhe');
      return { text: Q.chybajuce, rovnica: zapisChybajuce(z), moznosti: cisla(z.riesenie), jeSpravna: m => Number(m) + z.znamy === z.c, ukazka: { a, b } };
    },
    slovna() {
      const u = generujSlovnu(rng);
      return { text: Q.slovna, zadanie: u.text, hlas: hlasUlohy(u), moznosti: cisla(u.a + u.b), jeSpravna: m => Number(m) === u.a + u.b, ukazka: { a: u.a, b: u.b }, diag: { a: u.a, b: u.b } };
    },
    opravarik() {
      const o = opravarik(a, b, TYPY_OPRAV[Math.floor(rng() * TYPY_OPRAV.length)]);
      return { text: Q.opravarik, rovnica: o.veta, moznosti: cisla(a + b, o.zobrazeny), jeSpravna: m => Number(m) === a + b, ukazka: { a, b } };
    } }[typ]();

}
// každý typ aspoň raz, zvyšok do 12 náhodne; typ úrovne 2 len ak je vybraná
function sadaKvizu(rng, uroven) {
  const typy = uroven >= 2 ? [...TYPY_KVIZU, 'uroven2'] : TYPY_KVIZU;
  const vyber = [...typy];
  while (vyber.length < POCET_OTAZOK) vyber.push(typy[Math.floor(rng() * typy.length)]);
  return zamiesaj(vyber, rng).map(t => otazkaKvizu(t, rng));
}

/* ----- Pracovný list ----- */
function pracovnyList(rng) {

// typy chýb od najčastejšej, len tie, ktoré nastali
function najcastejsieChyby(stat) {
  return Object.entries(stat.chyby).filter(([, n]) => n > 0).sort((x, y) => y[1] - x[1]);
}
// názvy kariet na precvičenie, bez opakovania
function odporucania(stat, slabiKamarati = 0) {

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => (k in o ? o[k] : m));
const velkym = t => t.charAt(0).toUpperCase() + t.slice(1);
const SVGNS = 'http://www.w3.org/2000/svg';
// vytvorenie prvku: h('div', {class: 'x', onclick: f}, deti…)
function h(tag, vlastnosti, ...deti) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(vlastnosti || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const d of deti.flat()) if (d != null && d !== false) e.append(d.nodeType ? d : document.createTextNode(String(d)));
  return e;
}
// SVG prvok
function s(tag, vlastnosti = {}) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(vlastnosti)) if (v != null) e.setAttribute(k, v);
  return e;
}
function zamiesaj(pole, rng = Math.random) {
  const a = [...pole];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// mriežka tlačidiel: Tab vojde dnu, šípky sa v nej pohybujú (roving tabindex)
function mriezkaSipky(obal, stlpce) {
  const polozky = () => $$('button', obal);
  polozky().forEach((b, i) => { b.tabIndex = i ? -1 : 0; });
  obal.addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: stlpce, ArrowUp: -stlpce }[e.key];
    if (!d) return;
    const p = polozky(), i = p.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    const ciel = p[i + d];
    if (ciel) { p.forEach(b => { b.tabIndex = -1; }); ciel.tabIndex = 0; ciel.focus(); }
  });
}

/* =====================================================================
   ANIMÁCIE – requestAnimationFrame, rešpektuje prefers-reduced-motion
   ===================================================================== */
const ease = {
  linear: p => p,
  inOut: p => (p < 0.5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2),
  out: p => 1 - (1 - p) ** 3
};
function smieHybat() {
  if (STAV.vynutPohyb) return true;
  return !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
}
// tween(ms, krok(p 0..1), hotovo) – bez pohybu sa hneď skončí
function tween(ms, krok, hotovo) {
  const a = { hotova: false };
  a.zrus = () => { a.hotova = true; };
  if (!smieHybat() || ms <= 0) { krok(1); a.hotova = true; if (hotovo) hotovo(); return a; }
  let t0 = null;
  krok(0);
  const tik = cas => {
    if (a.hotova) return;
    if (t0 === null) t0 = cas;
    const p = Math.min(1, (cas - t0) / ms);
    krok(p);
    if (p < 1) requestAnimationFrame(tik); else { a.hotova = true; if (hotovo) hotovo(); }
  };
  requestAnimationFrame(tik);
  return a;
}
// rozsah: animácie jedného režimu; pri prepnutí režimu sa všetky zrušia naraz
function vytvorRozsah() {
  const bezia = new Set();
  return {
    tween(ms, krok, hotovo) { const a = tween(ms, krok, hotovo); if (!a.hotova) bezia.add(a); return a; },
    pockaj(ms, f) { const id = setTimeout(f, ms); const a = { zrus: () => clearTimeout(id) }; bezia.add(a); return a; },
    zrus() { for (const a of bezia) a.zrus(); bezia.clear(); }
  };
}
// postupnosť krokov: s pohybom ide sama, bez pohybu ju vedie tlačidlo „Ďalší krok“
function krokuj(kroky, rs, miesto, hotovo, pauza = 700) {
  let i = 0;
  const tlacidlo = smieHybat() ? null : h('button', { type: 'button', onclick: () => dalsi() }, T.spolocne.dalsiKrok);
  function dalsi() {
    if (i >= kroky.length) { if (tlacidlo) tlacidlo.remove(); if (hotovo) hotovo(); return; }
    kroky[i++]();
    if (!tlacidlo) rs.pockaj(pauza, dalsi);
  }
  if (tlacidlo) miesto.append(tlacidlo);
  dalsi();
  if (tlacidlo) tlacidlo.focus();
}
// jemný odskok prvku
function odskok(e, vyska = 10) {
  if (!smieHybat() || !e) return;
  tween(420, p => {
    const y = -vyska * Math.abs(Math.sin(Math.PI * 2 * p)) * (1 - p * 0.6);
    e.style.transform = p >= 1 ? '' : `translateY(${y.toFixed(2)}px)`;
  });
}

   ===================================================================== */
const NAHLAS = { hlas: null };
// slovenský hlas z daného syntetizátora, inak null; nikdy nevyhodí chybu
function slovenskyHlas(ss) {
  try {
    if (!ss || typeof ss.getVoices !== 'function') return null;
    return (ss.getVoices() || []).find(v => /^sk/i.test(String(v && v.lang))) || null;
  } catch (_) { return null; }
}

function textNaHlas(text) {
  return String(text).replace(/[✔✘★]/g, '')
    .replace(/\+\s*\?/g, `+ ${T.hlas.kolko}`).replace(/□/g, ` ${T.hlas.kolko} `)
    .replace(/\d+/g, c => (Number(c) <= 100 ? numWords(Number(c)) : c))
    .replace(/\+/g, ` ${T.hlas.plus} `).replace(/−/g, ` ${T.hlas.minus} `).replace(/=/g, ` ${T.hlas.je} `)
    .replace(/\s+/g, ' ').trim();
}

  b.setAttribute('aria-pressed', String(!!NAHLAS.hlas && STAV.hlas));
  if (PANEL) {
    PANEL.riadokHlas.hidden = !NAHLAS.hlas;
    PANEL.bezHlasu.hidden = !!NAHLAS.hlas;

  }

    if (!NAHLAS.hlas || !STAV.hlas || !text) return;
    const u = new SpeechSynthesisUtterance(textNaHlas(text));
    u.voice = NAHLAS.hlas; u.lang = NAHLAS.hlas.lang; u.rate = 0.85;
    window.speechSynthesis.cancel();

  } catch (_) { /* tichý návrat */ }

/* =====================================================================
   RÁMČEK – spoločná súčasť, použijú ju aj ďalšie časti
   vytvorRamcek({ rs, tukaci, onTukni(i), popisy, obrazok })
   obrazok = kresba predmetu v žetóne (slovné úlohy); tvar žetónu ostáva
   nastav(kruhy, stvorce, { duchovia, cisla, animuj }), kruhy(), stvorce(), obsah()
   zvyrazniPrazdne(bool), zvyrazniRiadok(0 | 1 | null), deliaca(k | null), indexZBodu(x, y)
   ===================================================================== */
function vytvorRamcek({ rs, tukaci = false, onTukni = null, popisy = false, obrazok = null } = {}) {
  const stred = h('div', { class: 'ramcek' + (obrazok ? ' sObrazkom' : ''), role: tukaci ? 'group' : 'img' });
  const miesta = [];
  let stav = naplnRamcek(0), ciarova = null;
  for (let i = 0; i < MIEST; i++) {
    const el = tukaci
      ? h('button', { type: 'button', class: 'miesto prazdne', 'aria-label': fmt(T.ramcek.miesto, { i: i + 1 }), onclick: () => onTukni && onTukni(i) })
      : h('div', { class: 'miesto prazdne' });
    miesta.push(el); stred.append(el);
  }
  if (tukaci) mriezkaSipky(stred, V_RIADKU);
  const popisHore = popisy ? h('div', { class: 'popisRiadku' }, T.ramcek.popisRiadku) : null;
  const popisDole = popisy ? h('div', { class: 'popisRiadku' }, T.ramcek.popisRiadku) : null;
  const koren = h('div', { class: 'ramcekObal' }, popisHore, stred, popisDole);

  function opisAria(n) { stred.setAttribute('aria-label', fmt(T.ramcek.aria, { n, m: MIEST - n })); }
  // nový žetón jemne narastie; každý ďalší o chvíľu neskôr
  function narast(el, poradie) {
    if (!smieHybat() || !rs) return;
    const oneskorenie = poradie * 0.5;
    el.style.transform = 'scale(0)';
    const a = rs.tween(220 * (1 + oneskorenie), p => {
      const q = Math.max(0, (p * (1 + oneskorenie) - oneskorenie));
      el.style.transform = q >= 1 ? '' : `scale(${ease.out(q).toFixed(3)})`;
    }, () => { el.style.transform = ''; });
    // zrušený rast nesmie nechať žetón zmenšený
    const zrus = a.zrus;
    a.zrus = () => { zrus(); el.style.transform = ''; };
  }
  const r = {
    koren, stred, miesta,
    nastav(kruhy, stvorce = 0, { duchovia = 0, cisla = false, animuj = true } = {}) {
      const novy = naplnRamcek(kruhy, stvorce, duchovia);
      let poradie = 0;
      novy.forEach((typ, i) => {
        const el = miesta[i], cislo = cisla && typ === 'stvorec' ? String(i - novy.indexOf('stvorec') + 1) : '';
        if (typ !== stav[i]) {
          el.replaceChildren();
          if (typ) { const z = h('div', { class: 'zeton ' + typ, html: obrazok }); el.append(z); if (animuj) narast(z, poradie++); }
        }
        if (typ && !obrazok) el.firstElementChild.textContent = cislo;
        el.classList.toggle('prazdne', !typ || typ === 'duch');
      });
      stav = novy;
      opisAria(r.kruhy() + r.stvorce());
    },
    obsah: () => [...stav],
    kruhy: () => stav.filter(t => t === 'kruh').length,
    stvorce: () => stav.filter(t => t === 'stvorec').length,
    zvyrazniPrazdne(ano) { stred.classList.toggle('prazdneSvieti', !!ano); },
    zvyrazniRiadok(riadok) {
      miesta.forEach((el, i) => el.classList.toggle('riadokSvieti', miestoRamceka(i).riadok === riadok));
      if (popisHore) { popisHore.classList.toggle('ukaz', riadok === 0); popisDole.classList.toggle('ukaz', riadok === 1); }
    },
    // deliaca čiara za k-tym miestom v poradí plnenia (1 až 9): ide lomene cez oba riadky
    deliaca(k) {
      if (k == null) { if (ciarova) ciarova.remove(); ciarova = null; return; }
      if (!ciarova) {
        ciarova = s('svg', { class: 'ciara', viewBox: '0 0 500 200', 'aria-hidden': 'true' });
        ciarova.append(s('path'), s('circle', { r: 20 }));
        stred.append(ciarova);
      }
      const x = (k > V_RIADKU ? k - V_RIADKU : k) * 100;
      const d = k < V_RIADKU ? `M${x} 0V100H0` : k === V_RIADKU ? 'M500 100H0' : `M500 100H${x}V200`;
      ciarova.firstElementChild.setAttribute('d', d);
      ciarova.lastElementChild.setAttribute('cx', k === V_RIADKU ? 250 : x);
      ciarova.lastElementChild.setAttribute('cy', 100);
    },
    // k pre bod na obrazovke: ľavá polovica miesta = pred ním, pravá = za ním
    indexZBodu(x, y) {
      const b = stred.getBoundingClientRect();
      const stlpec = Math.max(0, Math.min(V_RIADKU - 1, Math.floor((x - b.left) / b.width * V_RIADKU)));
      const riadok = y - b.top < b.height / 2 ? 0 : 1;
      const zaPolovicou = (x - b.left) / b.width * V_RIADKU - stlpec >= 0.5;
      return riadok * V_RIADKU + stlpec + (zaPolovicou ? 1 : 0);
    }
  };
  opisAria(0);
  return r;
}

/* =====================================================================
   ROVNICA – číslice aspoň 56 px; b môže byť „?“
   ===================================================================== */
function vytvorRovnicu() {
  const koren = h('div', { class: 'rovnica', role: 'img' });
  const vysl = () => $('.vysl', koren);
  return {
    koren,
    ukaz(a, b, c, svieti = false) {
      const druhe = b === '?' ? '<span class="otaznik">?</span>' : `<span class="cB">${b}</span>`;
      koren.innerHTML = `<span class="cA">${a}</span><span class="op">+</span>${druhe}<span class="op">=</span><span class="vysl">${c}</span>`;
      koren.setAttribute('aria-label', `${a} + ${b} = ${c}`);
      vysl().classList.toggle('svieti', svieti);
    },
    // len zadanie bez výsledku: „8 + 5“
    ukazSucet(a, b) {
      koren.innerHTML = `<span class="cA">${a}</span><span class="op">+</span><span class="cB">${b}</span>`;
      koren.setAttribute('aria-label', `${a} + ${b}`);
    },
    // ľubovoľná veta: „□ + 8 = 13“, „13 − 8 = ?“; □ a ? sú prázdne políčko
    ukazRiadok(text) {
      koren.innerHTML = text.split(' ').map(t => (/[□?]/.test(t) ? `<span class="otaznik">${t === '□' ? '' : t}</span>` : /[+−=]/.test(t) ? `<span class="op">${t}</span>` : `<span>${t}</span>`)).join('');
      koren.setAttribute('aria-label', text);
    },
    skry() { koren.replaceChildren(); koren.removeAttribute('aria-label'); }
  };
}

/* =====================================================================
   ČÍSELNICA – spoločná súčasť, použijú ju aj ďalšie časti
   vytvorKlavesnicu({ onZmena(text), onPotvrd(cislo), povol(cislo) })
   Čísla nad 100 odmietne s láskavou hláškou; povol môže pustiť ďalej odpoveď,
   ktorú chceme rozpoznať ako typickú chybu (213 namiesto 33).
   hodnota(), nastav(text), zamkni(bool)
   ===================================================================== */
const KLAVESY = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '⌫', '✔'];
const NAJVIAC = 100;
const KLAVESNICE = new Set();   // fyzická klávesnica patrí tej, ktorá je práve viditeľná
function vytvorKlavesnicu({ max = 3, onZmena = null, onPotvrd = null, povol = null } = {}) {
  let text = '', zamknuta = false;
  const displej = h('div', { class: 'klavDispl', role: 'status', 'aria-label': T.klavesnica.zadane }, ' ');
  const hlaska = h('div', { class: 'klavHlaska', role: 'status' });
  const mriezka = h('div', { class: 'klavMriezka', role: 'group', 'aria-label': T.klavesnica.aria });
  const koren = h('div', { class: 'klavesnica' }, displej, hlaska, mriezka);
  const ukaz = () => { displej.textContent = text || ' '; };
  function stlac(k) {
    if (zamknuta) return;
    if (k === '✔') {
      if (text === '' || !onPotvrd) return;   // prázdny vstup nič nerobí
      const cislo = Number(text);
      if (cislo > NAJVIAC && !(povol && povol(cislo))) {
        text = ''; ukaz();
        hlaska.textContent = T.klavesnica.velke;
        return;
      }
      hlaska.textContent = '';
      onPotvrd(cislo);
      return;
    }
    const novy = vstupKlavesnice(text, k, max);
    if (novy === text) return;
    text = novy; ukaz();
    hlaska.textContent = '';
    if (onZmena) onZmena(text);
  }
  for (const k of KLAVESY) {
    mriezka.append(h('button', { type: 'button', class: k === '✔' ? 'primary' : null, 'data-klaves': k,
      'aria-label': k === '⌫' ? T.klavesnica.zmazat : k === '✔' ? T.klavesnica.potvrdit : null, onclick: () => stlac(k) }, k));
  }
  mriezkaSipky(mriezka, 4);
  const kl = {
    koren, stlac,
    hodnota: () => text,
    nastav(t) { text = String(t); ukaz(); },
    zamkni(ano) { zamknuta = !!ano; $$('button', mriezka).forEach(b => { b.disabled = zamknuta; }); }
  };
  KLAVESNICE.add(kl);
  return kl;
}
// fyzická klávesnica ovláda práve viditeľnú číselnicu (Enter na tlačidle necháme tlačidlu)
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || /^(SELECT|INPUT|SUMMARY)$/.test(e.target.tagName)) return;
  const kl = [...KLAVESNICE].find(k => k.koren.isConnected && k.koren.offsetParent !== null);
  if (!kl) return;
  if (/^\d$/.test(e.key)) { kl.stlac(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { kl.stlac('⌫'); e.preventDefault(); }
  else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { kl.stlac('✔'); e.preventDefault(); }
});

/* =====================================================================
   ÚLOHA „DOPLŇ DO 10“ – spoločná pre Koľko chýba?, Nájdi kamaráta a Pyramídu
   Vždy rovnaký priebeh: rámček s n kruhmi, odpoveď, tri stupne nápovedy,
   hviezdička za dokončenie bez ohľadu na nápovedy.
   ===================================================================== */
function ulohaDoplnku({ plocha, desiatko, rs, n, otazka, moznosti = false, sledujKamarata = false, textDalej, poKonci, rng = Math.random }) {
  const m = filler(n);
  let pokusy = 0, uroven = 0, hotovo = false, pocita = false, duchovia = 0;
  const ram = vytvorRamcek({ rs, tukaci: !moznosti, onTukni: tukniMiesto });
  const rov = vytvorRovnicu();
  const akcie = h('div', { class: 'akcie' });
  // po spočítaní nahlas ostanú vyplnené miesta viditeľné, kým dieťa zadáva číslo
  const klav = vytvorKlavesnicu({ onZmena: () => { if (uroven < 3) { duchovia = 0; ram.nastav(n, 0, { animuj: false }); } }, onPotvrd: skontroluj });
  const tlNapoveda = h('button', { type: 'button', onclick: dalsiaNapoveda }, T.spolocne.pomoc);
  akcie.append(tlNapoveda);

  // Ťuknutie na prázdne miesto ráta chýbajúce: plní sa v poradí a číslo sa prepíše do číselnice
  function tukniMiesto(i) {
    if (hotovo || pocita || uroven >= 3 || i < n) return;
    const novy = i - n + 1;
    duchovia = novy === duchovia ? novy - 1 : novy;
    ram.nastav(n, 0, { duchovia, animuj: false });
    klav.nastav(duchovia || '');
  }

  // možnosti (len v kartách s kamarátmi), číselnica je druhá cesta k odpovedi
  const mriezkaMoznosti = moznosti ? h('div', { class: 'moznosti', role: 'group', 'aria-label': T.hra.moznostiAria }) : null;
  const tlCiselnica = moznosti ? h('button', { type: 'button', 'aria-pressed': 'false', onclick: prepniCiselnicu }, T.hra.ciselnica) : null;
  if (moznosti) {
    for (const x of moznostiKamarata(n, rng)) {
      mriezkaMoznosti.append(h('button', { type: 'button', 'data-cislo': x, onclick: () => skontroluj(x) }, String(x)));
    }
    mriezkaSipky(mriezkaMoznosti, 4);
    klav.koren.hidden = true;
    akcie.append(tlCiselnica);
  }
  function prepniCiselnicu() {
    const zapni = klav.koren.hidden;
    klav.koren.hidden = !zapni;
    mriezkaMoznosti.hidden = zapni;
    tlCiselnica.setAttribute('aria-pressed', String(zapni));
  }

  plocha.classList.add('dvojstlpec');
  plocha.replaceChildren(h('div', { class: 'lavo' }, ram.koren, rov.koren),
    h('div', { class: 'pravo' }, mriezkaMoznosti, klav.koren, akcie));
  ram.nastav(n, 0, { animuj: false });
  rov.ukaz(n, '?', DESIAT);
  desiatko.povedz(otazka, 'premysla', `${n} + ? = ${DESIAT}`);

  function dalsiaNapoveda() {
    if (hotovo || uroven >= 3) return;
    uroven++;
    if (uroven === 1) { ram.zvyrazniPrazdne(true); desiatko.povedz(T.hra.napoveda1, 'povzbudzuje'); }
    else if (uroven === 2) { ram.zvyrazniPrazdne(true); desiatko.povedz(fmt(T.hra.napoveda2, { m }), 'povzbudzuje'); }
    else spocitajNahlas();
    if (uroven >= 3) tlNapoveda.remove();
  }
  // tretí stupeň: prázdne miesta sa postupne vyplnia a spočítajú
  function spocitajNahlas() {
    pocita = true;
    klav.zamkni(true);
    ram.zvyrazniPrazdne(false);
    const kroky = [];
    for (let j = 1; j <= m; j++) {
      kroky.push(() => { ram.nastav(n, j, { cisla: true }); desiatko.povedz(velkym(numWords(j, 'm')) + '.', 'povzbudzuje', '', false); });
    }
    krokuj(kroky, rs, akcie, () => {
      pocita = false;
      klav.zamkni(false);
      klav.nastav('');
      desiatko.povedz(fmt(T.hra.zadaj, { m }), 'povzbudzuje');
    });
  }
  function skontroluj(g) {
    if (hotovo || pocita) return;
    if (g === m) { dobre(); return; }
    pokusy++;
    // ukáž, čo sa stalo: odpoveď sa zakreslí do rámčeka (nikdy nepretečie cez 10)
    duchovia = 0;
    if (uroven < 3) ram.nastav(n, 0, { duchovia: g, animuj: false });
    klav.nastav('');
    if (mriezkaMoznosti) {
      const b = $(`[data-cislo="${g}"]`, mriezkaMoznosti);
      if (b) b.classList.add('zle');
    }
    if (pokusy === 1) {
      uroven = Math.max(uroven, 1);
      ram.zvyrazniPrazdne(true);
      desiatko.povedz(fmt(T.hra.skus, { a: n, b: g, s: n + g }), 'povzbudzuje');
    } else if (pokusy === 2 && uroven < 2) {
      uroven = 2;
      ram.zvyrazniPrazdne(true);
      desiatko.povedz(fmt(T.hra.skusChyba, { m }), 'povzbudzuje');
    } else if (uroven < 3) {
      dalsiaNapoveda();
    } else {
      desiatko.povedz(fmt(T.hra.zadaj, { m }), 'povzbudzuje');
    }
  }
  function dobre() {
    hotovo = true;
    klav.zamkni(true);
    ram.zvyrazniPrazdne(false);
    ram.nastav(n, m);
    rov.ukaz(n, m, DESIAT, true);
    if (mriezkaMoznosti) {
      const b = $(`[data-cislo="${m}"]`, mriezkaMoznosti);
      if (b) { b.classList.add('dobre'); b.append(h('span', { class: 'znacka', 'aria-hidden': 'true' }, '✔')); }
    }
    desiatko.povedz(fmt(T.hra.dobre[Math.floor(rng() * T.hra.dobre.length)], { a: n, b: m }), 'tesi');
    pridajHviezdu(rov.koren);
    if (sledujKamarata && (pokusy >= 2 || uroven >= 3)) STAV.slabiKamarati++;
    const dalej = h('button', { type: 'button', class: 'primary', 'data-dalej': '', html: IKONY.dalej, onclick: poKonci }, textDalej);
    akcie.replaceChildren(dalej);
    dalej.focus();
  }
  return { ram, rov, klav, m };
}

/* =====================================================================
   KARTY – každá má režimy, Desiatka a plochu, ktorá sa pri prepnutí prestavia
   ===================================================================== */
const KARTY = {};
function postavKartu(id, nazvyRezimov, rezimy) {
  const koren = h('section', { class: 'karta', id: 'karta-' + id, role: 'tabpanel', 'aria-labelledby': 'tab-' + id, hidden: true });
  const pas = h('div', { class: 'rezimy', role: 'group', 'aria-label': T.rezimyAria, hidden: Object.keys(rezimy).length < 2 });
  koren.append(pas);
  const desiatko = vytvorDesiatka(koren);
  const plocha = h('div', { class: 'plocha' });
  koren.append(plocha);
  const rs = vytvorRozsah();
  const tlacidla = {};
  function prepni(kluc) {
    rs.zrus();
    zastavCitanie();
    for (const [k, b] of Object.entries(tlacidla)) b.setAttribute('aria-pressed', String(k === kluc));
    plocha.className = 'plocha';
    plocha.replaceChildren();
    rezimy[kluc]({ plocha, desiatko, rs, prepni });
    karta.rezim = kluc;
  }
  for (const kluc of Object.keys(rezimy)) {
    tlacidla[kluc] = h('button', { type: 'button', 'aria-pressed': 'false', 'data-rezim': kluc, onclick: () => prepni(kluc) }, nazvyRezimov[kluc]);
    pas.append(tlacidla[kluc]);
  }
  $('#obsah').append(koren);
  const karta = { koren, desiatko, prepni, rezim: null };
  KARTY[id] = karta;
  prepni(Object.keys(rezimy)[0]);
  return karta;
}
// príbeh po krokoch: tempo vždy určuje dieťa tlačidlom „Ďalší krok“, na konci „Skús to“
function pribeh(plocha, kroky, naSkusanie, napln) {
  const ram = vytvorRamcek({ rs: napln.rs, popisy: true });
  const rov = vytvorRovnicu();
  const akcie = h('div', { class: 'akcie' });
  plocha.replaceChildren(ram.koren, rov.koren, akcie);
  let i = 0;
  function ukazKrok() {
    napln.rs.zrus();
    ram.zvyrazniPrazdne(false);
    ram.zvyrazniRiadok(null);
    kroky[i]({ ram, rov });
    const posledny = i === kroky.length - 1;
    const tlacidla = [
      posledny ? h('button', { type: 'button', html: IKONY.znova, onclick: () => { i = 0; ukazKrok(); } }, T.spolocne.znova)
        : h('button', { type: 'button', class: 'primary', 'data-krok': '', html: IKONY.dalej, onclick: () => { i++; ukazKrok(); } }, T.spolocne.dalsiKrok),
      posledny ? h('button', { type: 'button', class: 'primary', onclick: naSkusanie }, T.spolocne.skus) : null
    ];
    akcie.replaceChildren(...tlacidla.filter(Boolean));
  }
  ukazKrok();
}

/* ----- KARTA Desiatkový rámček ----- */
function postavRamcek() {
  const TX = T.kartaRamcek;
  let posledne = null;
  postavKartu('ramcek', TX.rezimy, {
    ako({ plocha, desiatko, rs, prepni }) {
      const povedz = (i, v = 'premysla') => desiatko.povedz(TX.ako[i], v);
      pribeh(plocha, [
        ({ ram, rov }) => { ram.nastav(0, 0, { animuj: false }); ram.zvyrazniPrazdne(true); rov.skry(); povedz(0); },
        ({ ram, rov }) => { ram.nastav(5, 0); ram.zvyrazniRiadok(0); rov.skry(); povedz(1); },
        ({ ram, rov }) => { ram.nastav(5, 5); ram.zvyrazniRiadok(1); rov.skry(); povedz(2); },
        ({ ram, rov }) => { ram.nastav(5, 5); rov.ukaz(5, 5, 10, true); povedz(3, 'tesi'); },
        ({ ram, rov }) => { ram.nastav(7, 0, { animuj: false }); ram.zvyrazniPrazdne(true); rov.ukaz(7, '?', 10); povedz(4); },
        ({ ram, rov }) => { ram.nastav(7, 3); rov.ukaz(7, 3, 10, true); povedz(5, 'tesi'); }
      ], () => prepni('napln'), { rs });
    },

    napln({ plocha, desiatko, rs }) {
      let n = 0;
      const ram = vytvorRamcek({ rs, tukaci: true, onTukni: i => zmen(i < n ? i : i + 1) });
      const rov = vytvorRovnicu();
      const cislo = h('span', { class: 'cislo' }), slovo = h('span', { class: 'slovo' });
      const citac = h('div', { class: 'citac', 'aria-hidden': 'true' }, cislo, slovo);
      const tlMenej = h('button', { type: 'button', class: 'znamienko', 'aria-label': T.spolocne.menej, onclick: () => zmen(n - 1) }, '−');
      const tlViac = h('button', { type: 'button', class: 'znamienko', 'aria-label': T.spolocne.viac, onclick: () => zmen(n + 1) }, '+');
      plocha.classList.add('dvojstlpec');
      plocha.append(h('div', { class: 'lavo' }, ram.koren), h('div', { class: 'pravo' },
        h('div', { class: 'ovladanie' }, tlMenej, citac, tlViac), rov.koren));
      function zmen(novy, prvy = false) {
        n = Math.max(0, Math.min(MIEST, novy));
        ram.nastav(n);
        cislo.textContent = n;
        slovo.textContent = numWords(n);
        rov.ukaz(n, MIEST - n, 10, n === MIEST);
        desiatko.povedz(n === MIEST ? TX.naplnPlny : n === 0 ? TX.naplnStart : fmt(TX.naplnStav, { n, m: MIEST - n }),
          n === MIEST ? 'tesi' : 'premysla', '', !prvy && n === MIEST);
      }
      zmen(0, true);
    },

    chyba({ plocha, desiatko, rs }) {
      const novy = () => {
        rs.zrus();
        posledne = dalsieCislo(Math.random, posledne);
        ulohaDoplnku({ plocha, desiatko, rs, n: posledne, otazka: TX.chybaOtazka, textDalej: T.spolocne.dalej, poKonci: novy });
      };
      novy();
    }
  });
}

/* ----- KARTA Kamaráti do 10 ----- */
const PYRAMIDA_RADY = [[5], [4, 6], [3, 7], [2, 8], [1, 9]];   // zhora nadol; vedľa seba stojí dvojica s vymeneným poradím
function postavKamaratov() {
  const TX = T.kartaKamarati;
  let posledne = null;
  postavKartu('kamarati', TX.rezimy, {
    ako({ plocha, desiatko, rs, prepni }) {
      const par = (a, b) => ({ ram, rov }) => {
        ram.nastav(a, b, { animuj: false });
        rov.ukaz(a, b, 10, true);
        desiatko.povedz(fmt(TX.ako[1], { a, b }), 'tesi', `${a} + ${b} = 10`);
      };
      pribeh(plocha, [
        ({ ram, rov }) => { ram.nastav(0, 0, { animuj: false }); ram.zvyrazniPrazdne(true); rov.skry(); desiatko.povedz(TX.ako[0]); },
        par(3, 7), par(4, 6), par(5, 5)
      ], () => prepni('rozdel'), { rs });
    },

    rozdel({ plocha, desiatko, rs }) {
      let k = 6, drzim = false;
      const ram = vytvorRamcek({ rs });
      const rov = vytvorRovnicu();
      const st = ram.stred;
      st.classList.add('posuvny');
      st.setAttribute('role', 'slider');
      st.setAttribute('tabindex', '0');
      st.setAttribute('aria-label', TX.ciaraAria);
      st.setAttribute('aria-valuemin', '1');
      st.setAttribute('aria-valuemax', '9');
      function zmen(novy, prvy = false) {
        novy = Math.max(1, Math.min(9, novy));
        if (novy === k && !prvy) return;
        k = novy;
        ram.nastav(k, MIEST - k, { animuj: false });
        ram.deliaca(k);
        rov.ukaz(k, MIEST - k, 10, true);
        st.setAttribute('aria-valuenow', k);
        st.setAttribute('aria-valuetext', fmt(TX.ciaraHodnota, { a: k, b: MIEST - k }));
        if (!prvy) desiatko.povedz(fmt(TX.rozdelStav, { a: k, b: MIEST - k }), 'tesi', `${k} + ${MIEST - k} = 10`, false);
      }
      st.addEventListener('pointerdown', e => { drzim = true; st.setPointerCapture(e.pointerId); zmen(ram.indexZBodu(e.clientX, e.clientY)); e.preventDefault(); st.focus(); });
      st.addEventListener('pointermove', e => { if (drzim) zmen(ram.indexZBodu(e.clientX, e.clientY)); });
      st.addEventListener('pointerup', () => { drzim = false; });
      st.addEventListener('pointercancel', () => { drzim = false; });
      st.addEventListener('keydown', e => {
        const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
        if (d) { zmen(k + d); e.preventDefault(); }
      });
      const tlMenej = h('button', { type: 'button', class: 'znamienko', 'aria-label': T.spolocne.menej, onclick: () => zmen(k - 1) }, '−');
      const tlViac = h('button', { type: 'button', class: 'znamienko', 'aria-label': T.spolocne.viac, onclick: () => zmen(k + 1) }, '+');
      plocha.classList.add('dvojstlpec');
      plocha.append(h('div', { class: 'lavo' }, ram.koren), h('div', { class: 'pravo' }, rov.koren, h('div', { class: 'ovladanie' }, tlMenej, tlViac)));
      zmen(6, true);
      desiatko.povedz(TX.rozdelStart, 'premysla', '', false);
    },

    najdi({ plocha, desiatko, rs }) {
      const novy = () => {
        rs.zrus();
        posledne = dalsieCislo(Math.random, posledne);
        ulohaDoplnku({ plocha, desiatko, rs, n: posledne, moznosti: true, sledujKamarata: true,
          otazka: fmt(TX.najdiOtazka, { n: posledne }), textDalej: T.spolocne.dalej, poKonci: novy });
      };
      novy();
    },

    pyramida({ plocha, desiatko, rs }) {
      const najdene = STAV.pyramida;
      // kartu s vymeneným poradím stačí otočiť, keď je jej dvojička nájdená
      const moznoOtocit = a => !najdene.has(a) && najdene.has(MIEST - a);
      function obsahKarty(b, a) {
        const druhe = MIEST - a;
        b.className = 'par';
        b.replaceChildren();
        if (najdene.has(a)) {
          b.classList.add('najdena');
          b.setAttribute('aria-label', fmt(TX.najdenaAria, { a, b: druhe }));
          b.append(h('span', { class: 'znacka', 'aria-hidden': 'true' }, '✔'), `${a} + ${druhe}`, h('span', { class: 'hviezdaParu', 'aria-hidden': 'true' }, '★'));
        } else if (moznoOtocit(a)) {
          b.classList.add('otoc');
          b.setAttribute('aria-label', fmt(TX.otocAria, { a: druhe, b: a }));
          b.innerHTML = IKONY.otoc;
          b.append(TX.otoc);
        } else {
          b.setAttribute('aria-label', fmt(TX.kartaAria, { a }));
          b.textContent = `${a} + ?`;
        }
      }
      function zobraz(naKartu = null) {
        rs.zrus();
        plocha.className = 'plocha';
        const rady = h('div', { class: 'pyramida' });
        for (const rad of PYRAMIDA_RADY) {
          const r = h('div', { class: 'rad' + (rad.length === 1 ? ' jeden' : '') });
          for (const a of rad) {
            const b = h('button', { type: 'button', 'data-par': a, onclick: () => tukni(a, b) });
            obsahKarty(b, a);
            r.append(b);
          }
          rady.append(r);
        }
        mriezkaSipky(rady, 2);
        const znova = h('button', { type: 'button', html: IKONY.znova, onclick: () => { najdene.clear(); zobraz(); } }, T.spolocne.znova);
        plocha.replaceChildren(rady, h('div', { class: 'akcie' }, znova));
        // po návrate pokračuje dieťa na tej istej karte
        if (naKartu !== null) $(`[data-par="${naKartu}"]`, plocha).focus();
        const otocit = [...Array(9).keys()].map(i => i + 1).find(moznoOtocit);
        if (najdene.size === 9) desiatko.povedz(TX.pyramidaHotovo, 'tesi');
        else if (otocit) desiatko.povedz(fmt(TX.pyramidaOtoc, { a: MIEST - otocit, b: otocit }), 'povzbudzuje');
        else desiatko.povedz(TX.pyramidaStart, 'premysla');
      }
      // otočenie karty: zúži sa, vymení obsah a znova sa rozšíri
      function otoc(a, b) {
        rs.tween(420, p => { b.style.transform = `scaleX(${Math.abs(1 - 2 * ease.inOut(p)).toFixed(3)})`; }, () => { b.style.transform = ''; });
        const nakoniec = () => {
          najdene.add(a);
          obsahKarty(b, a);
          pridajHviezdu(b);
          desiatko.povedz(najdene.size === 9 ? TX.pyramidaHotovo : fmt(TX.pyramidaOtocena, { a: MIEST - a, b: a }), 'tesi');
        };
        if (smieHybat()) rs.pockaj(210, nakoniec); else nakoniec();
      }
      function tukni(a, b) {
        if (najdene.has(a)) return;
        if (moznoOtocit(a)) { otoc(a, b); return; }
        rs.zrus();
        ulohaDoplnku({ plocha, desiatko, rs, n: a, moznosti: true, sledujKamarata: true,
          otazka: fmt(TX.najdiOtazka, { n: a }), textDalej: TX.spat, poKonci: () => { najdene.add(a); zobraz(a); } });
      }
      zobraz();
    }
  });
}

/* =====================================================================
   SPOLOČNÉ SÚČASTI: veta, presun žetónov, scéna, prehrávač, číselná os
   ===================================================================== */
const RNG = Math.random;   // jeden generátor pre karty, aby sa príklad neopakoval dvakrát po sebe

// veta z crossInfo: odkrýva sa po častiach, nikdy naraz
function vytvorVetu() {
  const koren = h('div', { class: 'veta', role: 'img' });
  let casti = [];
  return {
    koren,
    nastav(veta) {
      const c = veta.split(' = ');
      casti = c.map((t, i) => h('span', { class: 'castVety skryta' + (i === c.length - 1 ? ' posledna' : '') }, (i ? '= ' : '') + t));
      koren.replaceChildren(...casti);
    },
    // samostatné vety pod sebou (kroky úrovne 3)
    nastavCasti(riadky) {
      casti = riadky.map((t, i) => h('span', { class: 'castVety skryta' + (i === riadky.length - 1 ? ' posledna' : '') }, t));
      koren.replaceChildren(...casti);
    },
    ukaz(n) {
      casti.forEach((e, i) => e.classList.toggle('skryta', i >= n));
      koren.setAttribute('aria-label', casti.slice(0, n).map(e => e.textContent).join(' '));
    },
    odkryte: () => casti.filter(e => !e.classList.contains('skryta')).length
  };
}
// žetón preletí z jedného miesta na druhé; bez pohybu sa presun stane hneď
function letiZeton(rs, zEl, doEl, ms, hotovo) {
  if (!smieHybat() || !zEl.offsetParent) { hotovo(); return; }
  const a = zEl.getBoundingClientRect(), b = doEl.getBoundingClientRect(), v = a.width * 0.68;
  const z = h('div', { class: 'zeton stvorec letiaciZeton' });
  z.style.width = z.style.height = v + 'px';
  document.body.append(z);
  const stredX = r => r.left + r.width / 2 - v / 2, stredY = r => r.top + r.height / 2 - v / 2;
  const t = rs.tween(ms, p => {
    const q = ease.inOut(p), x = stredX(a) + (stredX(b) - stredX(a)) * q, y = stredY(a) + (stredY(b) - stredY(a)) * q;
    z.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
  }, () => { z.remove(); hotovo(); });
  const zrus = t.zrus;
  t.zrus = () => { zrus(); z.remove(); };
}
// ťahanie žetónu myšou aj prstom zo zdroja do cieľa; pustenie mimo cieľa nič nerobí
function pripravTahanie({ zdroj, ciel, smie, presun }) {
  zdroj.classList.add('tahaci');
  let tah = null;
  // počas ťahania počúvame celý dokument: prst aj myš odídu zo zdroja
  function skonci() {
    document.removeEventListener('pointermove', pohyb);
    document.removeEventListener('pointerup', pustenie);
    document.removeEventListener('pointercancel', skonci);
    if (tah && tah.klon) tah.klon.remove();
    tah = null;
  }
  function pohyb(e) {
    if (e.pointerId !== tah.id) return;
    if (!tah.klon && Math.hypot(e.clientX - tah.x, e.clientY - tah.y) > 8) {
      tah.klon = h('div', { class: 'zeton stvorec letiaciZeton' });
      tah.klon.style.width = tah.klon.style.height = '48px';
      document.body.append(tah.klon);
    }
    if (tah.klon) tah.klon.style.transform = `translate(${e.clientX - 24}px,${e.clientY - 24}px)`;
  }
  function pustenie(e) {
    if (e.pointerId !== tah.id) return;
    const pustil = !!tah.klon, b = ciel.getBoundingClientRect();
    skonci();
    if (pustil && e.clientX >= b.left - 12 && e.clientX <= b.right + 12 && e.clientY >= b.top - 12 && e.clientY <= b.bottom + 12) presun();
  }
  zdroj.addEventListener('pointerdown', e => {
    const miesto = e.target.closest('.miesto');
    if (tah || !smie() || !miesto || !miesto.firstElementChild) return;
    tah = { id: e.pointerId, x: e.clientX, y: e.clientY, klon: null };
    document.addEventListener('pointermove', pohyb);

// prehrávač krokov: Späť, Ďalej, Prehrať a rýchlosť; bez pohybu ostane len Späť a „Ďalší krok“
function vytvorPrehravac({ rs, pocet, ukaz }) {
  const TS = T.spolocne, pohyb = smieHybat(), RYCHLOSTI = [0.5, 1, 2];
  let i = 0, hra = false, rychlost = 1;
  const tlSpat = h('button', { type: 'button', 'data-spat': '', onclick: () => { hra = false; chod(i - 1, false); } }, TS.spat);
  const tlDalej = h('button', { type: 'button', class: 'primary', 'data-krok': '', onclick: () => { hra = false; chod(i + 1, true); } }, pohyb ? TS.dalej : TS.dalsiKrok);
  const tlHraj = pohyb ? h('button', { type: 'button', 'data-prehraj': '', onclick: prepniHru }) : null;
  const posuvnik = pohyb ? h('input', { type: 'range', class: 'posuvnik', min: 0, max: 2, step: 1, value: 1, 'aria-label': TS.rychlost,
    oninput: e => { rychlost = RYCHLOSTI[Number(e.target.value)]; } }) : null;
  const koren = h('div', { class: 'prehravac' }, h('div', { class: 'akcie tlacidlaPrehravaca' }, tlSpat, tlDalej, tlHraj),
    pohyb ? h('div', { class: 'obalPosuvnika' }, h('span', { class: 'ikonaPosuvnika', html: IKONY.korytnacka }), posuvnik, h('span', { class: 'ikonaPosuvnika', html: IKONY.zajac })) : null);
  function obnov() {

    if (i === pocet - 1) hra = false;
    if (hra) rs.pockaj(ms + 2200 / rychlost, () => chod(i + 1, true));

  function prepniHru() {
    if (hra) { hra = false; rs.zrus(); ukaz(i, false, rychlost); obnov(); return; }
