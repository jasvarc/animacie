/* ----- číselná os; rozsah je predvolene 0 až 20, desiatky = značky so slovom Desiatka
   os.nastav(poloha, oblúky), os.skok(oblúk, ms, hotovo)
   Oblúk: { od, do, text, trieda: 'A' | 'B' | 'C' }. Svg má mierku 1:1, aby popisky mali naozaj 24 px. */
function vytvorOs({ rs, popisy = 'vsetky', skokan = true, onTukni = null, rozsah = [0, 20], desiatky = [DESIAT] } = {}) {
  const TX = T.kartaOs, OKRAJ = 20, Y = skokan ? 136 : 96, [zaciatok, koniec] = rozsah, dielikov = koniec - zaciatok;
  const svg = s('svg', { class: 'os' + (onTukni ? ' tukacia' : ''), role: 'img', 'aria-label': TX.aria });
  const zaklad = s('g'), vrstvaOblukov = s('g'), postava = skokan ? s('g') : null;
  svg.append(zaklad, vrstvaOblukov);
  if (postava) {
    postava.innerHTML = desiatkoSVG(true);
    postava.firstElementChild.setAttribute('width', 44);
    postava.firstElementChild.setAttribute('height', 48);
    svg.append(postava);
  }
  const koren = h('div', { class: 'osObal' });
  koren.append(svg);
  let sirka = 320, obluky = [], poloha = 0;
  const x = n => OKRAJ + (sirka - 2 * OKRAJ) * (n - zaciatok) / dielikov;
  const vyska = e => (e.text ? Math.max(34, Math.min(84, 24 + (e.do - e.od) * 8)) : 22);
  function polozPostavu(n, nad = 0) {
    if (postava) postava.setAttribute('transform', `translate(${(x(n) - 22).toFixed(1)} ${(Y - 54 - nad).toFixed(1)})`);
  }
  function kresliObluk(e) {
    const x1 = x(e.od), x2 = x(e.do), v = vyska(e);
    e.cesta = s('path', { class: 'osObluk ' + e.trieda, d: `M${x1} ${Y}Q${(x1 + x2) / 2} ${Y - 2 * v} ${x2} ${Y}`, pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1 - e.p });
    vrstvaOblukov.append(e.cesta);
    if (!e.text) return;
    // popis nad Desiatkom; pri krátkych oblúkoch sa čísla od seba odsunú
    const kratky = e.do - e.od <= 2, posun = kratky ? (e.trieda === 'A' ? -6 : 6) : 0;
    e.popis = s('text', { class: 'oblukText ' + e.trieda, x: (x1 + x2) / 2 + posun, y: Math.min(Y - v - 8, Y - 62), style: `text-anchor:${kratky ? (e.trieda === 'A' ? 'end' : 'start') : 'middle'}`, visibility: e.p >= 1 ? 'visible' : 'hidden' });
    e.popis.textContent = e.text;
    vrstvaOblukov.append(e.popis);
  }
  function prekresli() {
    const husto = (sirka - 2 * OKRAJ) / dielikov < 32, vsetky = popisy === 'vsetky';
    const H = Y + (vsetky && husto ? 104 : 72);
    svg.setAttribute('viewBox', `0 0 ${sirka} ${H}`);
    svg.setAttribute('height', H);
    zaklad.replaceChildren(s('line', { x1: x(zaciatok) - 8, x2: x(koniec) + 8, y1: Y, y2: Y }));
    for (let n = zaciatok; n <= koniec; n++) {
      const hlavna = n % 5 === 0, desiat = desiatky.includes(n);
      zaklad.append(s('line', { class: desiat ? 'desiat' : hlavna ? 'hlavna' : null, x1: x(n), x2: x(n), y1: Y - (desiat ? 14 : hlavna ? 10 : 5), y2: Y + (desiat ? 14 : hlavna ? 10 : 5) }));
      if (!vsetky && !hlavna) continue;
      const t = s('text', { class: desiat ? 'desiat' : hlavna ? 'hlavne' : null, x: x(n), y: Y + 36 + (vsetky && husto && n % 2 ? 28 : 0) });
      t.textContent = n;
      zaklad.append(t);
    }
    for (const n of desiatky) {
      const slovo = s('text', { class: 'desiat', x: x(n), y: Y + (vsetky && husto ? 94 : 62) });
      slovo.textContent = TX.desiatka;
      zaklad.append(slovo);
    }
    vrstvaOblukov.replaceChildren();
    obluky.forEach(kresliObluk);
    polozPostavu(poloha);
  }
  if (onTukni) {
    svg.addEventListener('click', e => {
      const b = svg.getBoundingClientRect();
      onTukni(Math.max(zaciatok, Math.min(koniec, zaciatok + Math.round((e.clientX - b.left - OKRAJ) / (sirka - 2 * OKRAJ) * dielikov))));
    });
  }
  const zmeraj = () => {
    const w = Math.round(koren.getBoundingClientRect().width);
    if (w && w !== sirka) { sirka = w; prekresli(); }
  };
  new ResizeObserver(zmeraj).observe(koren);
  setTimeout(zmeraj);   // hneď po vložení do stránky, nech popisky majú skutočných 24 px
  prekresli();
  return {
    koren,
    obluky: () => obluky,
    poloha: () => poloha,
    nastav(n, zoznam = []) { poloha = n; obluky = zoznam.map(e => ({ ...e, p: 1 })); prekresli(); },
    skok(oblukNovy, ms, hotovo) {
      const e = { ...oblukNovy, p: 0 };
      obluky.push(e);
      kresliObluk(e);
      rs.tween(ms, p => {
        const q = ease.inOut(p);
        e.p = q;
        e.cesta.setAttribute('stroke-dashoffset', 1 - q);
        polozPostavu(e.od + (e.do - e.od) * q, 4 * vyska(e) * q * (1 - q));
      }, () => {
        e.p = 1;
        poloha = e.do;
        if (e.popis) e.popis.setAttribute('visibility', 'visible');
        polozPostavu(poloha);
        if (hotovo) hotovo();
      });
    }
  };
}

const KROK_CHYBY = { offByOne: 0, forgotFiller: 1, forgotTen: 2, swappedDigits: 4 };   // ktorý krok ukáže mini nápoveda
function postavCezDesiatku() {

// tyče a kocky: hore tyče, pod nimi rámčeky s voľnými kockami, dole číslice Desiatky a Jednotky
function vytvorScenuTyci({ rs, tukaci = false, onTukni = null }) {
  const TX = T.kartaTyce;
  const tyce = h('div', { class: 'tyce', 'aria-hidden': 'true' });
  const lavy = vytvorRamcek({ rs }), pravy = vytvorRamcek({ rs, tukaci, onTukni });
  const cifraD = h('b'), cifraJ = h('b');
  const cifry = h('div', { class: 'cifry' }, h('div', { class: 'cifra' }, TX.desiatky, cifraD), h('div', { class: 'cifra' }, TX.jednotky, cifraJ));
  const veta = vytvorVetu();
  const koren = h('div', { class: 'scena' }, tyce, h('div', { class: 'dvaRamceky' }, lavy.koren, pravy.koren), cifry, veta.koren);
  let stavy = [];
  const novaTyc = b => h('div', { class: 'tyc' + (b ? ' b' : ''), html: '<i></i>'.repeat(10) });
  function vykresli(st) {
    tyce.replaceChildren(...Array.from({ length: st.tyce }, () => novaTyc(false)), ...Array.from({ length: st.bTyce }, () => novaTyc(true)));
    lavy.nastav(st.kruhy, st.vlavo, { animuj: false });
    pravy.nastav(0, st.vpravo, { animuj: false });
    lavy.stred.classList.toggle('plny', st.kruhy + st.vlavo === MIEST);
    cifraD.textContent = st.tyce + st.bTyce;
    cifraJ.textContent = st.kruhy + st.vlavo;
    veta.ukaz(st.odkryte);
  }
  // 10 kociek sa stiahne do novej tyče; vráti čas animácie
  function zbal(rychlost, hotovo) {
    const trvanie = 800 / rychlost;
    if (!smieHybat() || !lavy.stred.offsetParent) { hotovo(); return 0; }
    const tyc = novaTyc(false);
    tyc.style.opacity = 0;
    tyce.append(tyc);
    const ciel = tyc.getBoundingClientRect(), zetony = $$('.zeton', lavy.stred);
    const posuny = zetony.map(z => { const r = z.getBoundingClientRect(); return [ciel.left + ciel.width / 2 - r.left - r.width / 2, ciel.top + ciel.height / 2 - r.top - r.height / 2]; });
    const t = rs.tween(trvanie, p => {
      const q = ease.inOut(p);
      zetony.forEach((z, i) => { z.style.transform = `translate(${(posuny[i][0] * q).toFixed(1)}px,${(posuny[i][1] * q).toFixed(1)}px) scale(${(1 - 0.75 * q).toFixed(3)})`; });
      tyc.style.opacity = q > 0.8 ? (q - 0.8) * 5 : 0;
    }, hotovo);
    const zrus = t.zrus;
    t.zrus = () => { zrus(); zetony.forEach(z => { z.style.transform = ''; }); tyc.remove(); };
    return trvanie;
  }
  return {
    koren, lavy, pravy, veta, cifry, zbal,
    nastavStav: vykresli,
    pocetTyci: () => $$('.tyc', tyce).length,
    nastavPriklad(a, b) { stavy = stavyTyci(a, b); veta.nastav(vetaTyci(a, b)); },
    nastavUroven3(a, b) { stavy = stavyUroven3(a, b); veta.nastavCasti([`${a} + ${b}`, ...crossInfo3(a, b).steps]); },
    // prechod medzi krokmi zistí zo stavov: kocky preletia alebo sa zbalia
    ukaz(i, animuj = false, rychlost = 1) {
      const st = stavy[i], pred = stavy[i - 1];
      if (!animuj || !pred || !smieHybat()) { vykresli(st); return 0; }
      vykresli(pred);
      veta.ukaz(st.odkryte);
      const pribudlo = st.vlavo - pred.vlavo, krok = 520 / rychlost;
      if (pribudlo > 0) {
        for (let j = 0; j < pribudlo; j++) {
          rs.pockaj(j * krok, () => {
            const zdroj = pravy.miesta[pred.vpravo - 1 - j], ciel = lavy.miesta[pred.kruhy + pred.vlavo + j];
            pravy.nastav(0, pred.vpravo - 1 - j, { animuj: false });
            letiZeton(rs, zdroj, ciel, krok * 0.85, () => lavy.nastav(pred.kruhy, pred.vlavo + j + 1, { animuj: false }));
          });
        }
        return pribudlo * krok;
      }
      if (st.zbalene && !pred.zbalene) return zbal(rychlost, () => vykresli(st));
      vykresli(st);
      return 0;
    }
  };
}
// ukážka príkladu po krokoch; používa ju Pozeraj aj tretí stupeň pomoci
function sekvenciaTyci({ plocha, desiatko, rs, a, b, dole }) {

/* ----- KARTA Desiatkové tyče a kocky ----- */
function postavTyce() {
  const TX = T.kartaTyce, TC = T.kartaCez, TS = T.spolocne;
  // povolené a: k od 1 do 8, u od 2 do 9
  const moznostiA = [];
  for (let k = 1; k <= 8; k++) for (let u = 2; u <= 9; u++) moznostiA.push(10 * k + u);
  postavKartu('tyce', TX.rezimy, {
    pozeraj({ plocha, desiatko, rs }) {
      const novy = () => {
        rs.zrus();
        const p = generateProblem(2, RNG);

      };
      novy();
    },

    skus({ plocha, desiatko, rs }) {
      let u = null, vyberOtvoreny = false;
      function novy(a, b) {
        rs.zrus();
        const bali = a % 10 + b >= 11;
        u = { a, b, v: a + b, bali, ciel: bali ? crossInfo2(a, b).filler : b, presunute: 0, zbalene: false, balim: false, faza: 'presun', uroven: 0, pomoc: false };
        zobraz();
      }
      function novyNahodny() { const p = generateProblem(2, RNG); novy(p.a, p.b); }
      const stavTeraz = () => {
        const { tens, ones } = tensOnes(u.a);
        return stavTyci(0, tens + (u.zbalene ? 1 : 0), 0, u.zbalene ? 0 : ones, u.zbalene ? 0 : u.presunute, u.b - u.presunute, u.faza === 'hotovo' ? 9 : 1);
      };
      // plocha sa kreslí zo stavu u, takže po ukážke sa dieťa vráti tam, kde skončilo
      function zobraz() {
        rs.zrus();
        const scena = vytvorScenuTyci({ rs, tukaci: true, onTukni: () => { if (u.faza === 'presun') presun(); } });
        scena.nastavPriklad(u.a, u.b);
        scena.veta.koren.classList.add('bezMiesta');
        scena.nastavStav(stavTeraz());
        scena.cifry.hidden = u.faza !== 'hotovo';
        u.scena = scena;
        pripravTahanie({ zdroj: scena.pravy.stred, ciel: scena.lavy.stred, smie: () => u.faza === 'presun', presun });
        const panel = h('div', { class: 'lavo' }), akcie = h('div', { class: 'akcie' });
        if (u.faza === 'spolu') {
          u.klav = vytvorKlavesnicu({ onPotvrd: skontroluj, povol: n => diagnoseError(u.a, u.b, n) === 'forgotRegroup' });
          panel.append(u.klav.koren);
        }
        const tlVyber = h('button', { type: 'button', 'data-vyber': '', 'aria-pressed': String(vyberOtvoreny), onclick: () => { vyberOtvoreny = !vyberOtvoreny; zobrazVyber(); tlVyber.setAttribute('aria-pressed', String(vyberOtvoreny)); } }, TC.vybrat);
        const koniec = u.faza === 'hotovo';
        akcie.append(
          !koniec && !u.zbalene ? h('button', { type: 'button', class: u.faza === 'bal' ? 'primary' : null, 'data-zbal': '', onclick: zbal }, TX.zbal) : null,
          koniec ? null : h('button', { type: 'button', 'data-pomoc': '', onclick: pomoc }, TS.pomoc),
          h('button', { type: 'button', class: koniec ? 'primary' : null, 'data-novy': '', onclick: novyNahodny }, TS.novyPriklad),
          tlVyber);
        u.vyber = h('div', { class: 'vyber' });
        plocha.className = 'plocha';
        plocha.replaceChildren(scena.koren, panel, akcie, u.vyber);
        zobrazVyber();
        povedzFazu();
        if (u.faza === 'bal') $('[data-zbal]', plocha).focus();
      }
      function povedzFazu() {
        const zvysne = u.ciel - u.presunute;
        if (u.faza === 'presun') {
          const prvy = u.bali ? TC.presunStart : TX.bezPrechodu;
          desiatko.povedz(u.presunute ? fmt(u.bali ? TC.presunEste : TX.presunEste, { n: zvysne }) : prvy, 'premysla', u.presunute ? '' : `${u.a} + ${u.b}`, false);
        } else if (u.faza === 'bal') desiatko.povedz(TX.zbalTeraz, 'premysla');
        else if (u.faza === 'spolu') desiatko.povedz(TC.spolu, 'premysla');
      }
      function presun() {
        const { a, b, ciel: kolko, scena } = u, { ones } = tensOnes(a);
        if (u.presunute >= kolko) return;
        const zdroj = scena.pravy.miesta[b - u.presunute - 1], ciel = scena.lavy.miesta[ones + u.presunute];
        const mal = document.activeElement === zdroj;
        u.presunute++;

        scena.pravy.nastav(0, b - pristal, { animuj: false });
        letiZeton(rs, zdroj, ciel, 320, () => {
          scena.lavy.nastav(ones, pristal, { animuj: false });
          if (koniec) { u.faza = u.bali ? 'bal' : 'spolu'; zobraz(); }
        });
        if (!koniec) {
          if (mal) scena.pravy.miesta[b - pristal - 1].focus();
          povedzFazu();
        }
      }
      // balí sa len pri presne 10 voľných kockách
      function zbal() {
        if (u.balim) return;
        if (tensOnes(u.a).ones + u.presunute !== MIEST) { desiatko.povedz(TX.potrebujes, 'povzbudzuje'); return; }
        u.balim = true;
        u.scena.zbal(1, () => { u.balim = false; u.zbalene = true; u.faza = 'spolu'; zobraz(); });
      }
      function pomoc() {
        u.pomoc = true;
        u.uroven = Math.min(3, u.uroven + 1);
        if (u.uroven === 3) {
          const spat = h('button', { type: 'button', class: 'primary', 'data-spat-priklad': '', onclick: zobraz }, TC.spatNaPriklad);
          sekvenciaTyci({ plocha, desiatko, rs, a: u.a, b: u.b, dole: spat });
        } else if (u.faza === 'presun') {
          u.scena.lavy.zvyrazniPrazdne(true);
          desiatko.povedz(u.uroven === 1 ? T.hra.napoveda1 : TC.pomoc2, 'povzbudzuje');
        } else desiatko.povedz(u.faza === 'bal' ? TX.pomocZbal : TX.pomocSpolu, 'povzbudzuje');
      }
      function skontroluj(g) {
        u.klav.nastav('');
        if (g === u.v) { hotovo(); return; }
        const typ = diagnoseError(u.a, u.b, g);
        zaznamenajChybu(typ);
        desiatko.povedz(TC.diagnoza[typ || 'nic'], 'povzbudzuje');
      }
      function hotovo() {
        u.faza = 'hotovo';
        zaznamenajPriklad(u.pomoc);
        zobraz();
        desiatko.povedz(fmt(TC.dobre[Math.floor(Math.random() * TC.dobre.length)], { a: u.a, b: u.b, v: u.v }), 'tesi', vetaTyci(u.a, u.b));
        pridajHviezdu(u.scena.veta.koren);
        $('[data-novy]', plocha).focus();
      }
      function zobrazVyber() {
        u.vyber.hidden = !vyberOtvoreny;
        if (!vyberOtvoreny) return;
        const selA = zoznamCisel(moznostiA, u.a, kontrola), selB = zoznamCisel([2, 3, 4, 5, 6, 7, 8, 9], u.b, kontrola);
        const sprava = h('p', { class: 'poznamkaDieta' }, TX.vyberInak);
        const tlZacat = h('button', { type: 'button', class: 'primary', 'data-zacat': '', onclick: () => {
          const a = Number(selA.value), b = Number(selB.value);
          POSLEDNY_PRIKLAD.set(RNG, [a, b]);
          novy(a, b);
        } }, TC.zacat);
        // u + b = 10 nie je ani jeden z dvoch prípadov karty, zvyšok do 0 by bol mätúci
        function kontrola() {
          const platne = Number(selA.value) % 10 + Number(selB.value) !== 10;
          tlZacat.disabled = !platne;
          sprava.hidden = platne;
        }
        u.vyber.replaceChildren(h('label', null, TC.prveCislo, selA), h('label', null, TC.druheCislo, selB), tlZacat, sprava);
        kontrola();
      }
      novyNahodny();
    },

    os({ plocha, desiatko, rs }) {
      const novy = () => {
        rs.zrus();
        const c = generateProblem(2, RNG), od = tensOnes(c.a).tens * 10;
        sekvenciaNaOsi({ plocha, desiatko, rs, c, rozsah: [od, od + 20], desiatky: [nextTen(c.a)],
          dole: h('button', { type: 'button', 'data-novy': '', onclick: novy }, TS.novyPriklad) });
      };
      novy();
    }
  });
}

        rs.zrus();
        const zoznam = enumerateBezPrechodu();
        const [a1, b1] = prvy ? [23, 4] : zoznam[Math.floor(RNG() * zoznam.length)];
        const p = prvy ? crossInfo2(28, 5) : generateProblem(2, RNG);
        prvy = false;
        let krok = 0;
        const panel = (a, b, nadpis) => {
          const sc = vytvorScenuTyci({ rs });
          sc.nastavPriklad(a, b);

// trojuholník: dve čísla dolu, súčet hore
function vytvorTrojuholnik(a, b, c) {
  const svg = s('svg', { class: 'trojuholnik', viewBox: '0 0 300 190', role: 'img', 'aria-label': `${a} + ${b} = ${c}` });
  svg.append(s('line', { x1: 150, y1: 46, x2: 60, y2: 142 }), s('line', { x1: 150, y1: 46, x2: 240, y2: 142 }), s('line', { x1: 60, y1: 142, x2: 240, y2: 142 }));
  for (const [x, y, n, trieda] of [[150, 46, c, 'c'], [60, 142, a, null], [240, 142, b, 'b']]) {
    const t = s('text', { class: trieda, x, y: y + 20 });
    t.textContent = n;
    svg.append(s('circle', { class: trieda, cx: x, cy: y, r: 44 }), t);
  }
  return svg;
}
// c žetónov v dvoch rámčekoch; kruhy idú pred štvorce a plní sa zľava
function rozlozDoRamcekov(lavy, pravy, kruhy, stvorce = 0) {
  const k1 = Math.min(kruhy, MIEST), s1 = Math.min(stvorce, MIEST - k1);
  lavy.nastav(k1, s1, { animuj: false });
  pravy.nastav(kruhy - k1, stvorce - s1, { animuj: false });
}
function postavRodinu() {
  const TX = T.kartaRodina, TS = T.spolocne;
  postavKartu('rodina', TX.rezimy, {
    ako({ plocha, desiatko, rs }) {
      const novy = () => {
        rs.zrus();
        const { a, b, result: c } = generateProblem(1, RNG), vety = family(a, b);
        let krok = 0;
        const riadky = vety.map(v => h('div', { class: 'skryta' }, v));
        const akcie = h('div', { class: 'akcie' });
        const tlDalej = h('button', { type: 'button', class: 'primary', 'data-krok': '', onclick: () => { krok++; ukaz(); } }, TS.dalsiKrok);
        const tlNovy = h('button', { type: 'button', 'data-novy': '', onclick: novy }, TS.novyPriklad);
        akcie.append(tlDalej, tlNovy);
        function ukaz() {
          vety.forEach((v, i) => riadky[i].classList.toggle('skryta', krok < 1 || (krok < 2 && v.includes('−'))));
          desiatko.povedz(TX.ako[krok], krok === 4 ? 'tesi' : 'premysla', '', false);

        ukaz();
      };
      novy();
    },

    ktora({ plocha, desiatko, rs }) {
      const novy = () => {
        rs.zrus();
        const { a, b, result: c } = generateProblem(1, RNG);
        const moznosti = zamiesaj([...family(a, b).filter(v => v.includes('−')), `${c} − ${b} = ${a + 1}`]);
        const rov = vytvorRovnicu(), akcie = h('div', { class: 'akcie' }), vyber = h('div', { class: 'vybery', role: 'group', 'aria-label': TX.moznostiAria });
        let hotovo = false;

        vyber.append(...tlacidla);
        mriezkaSipky(vyber, 1);
        function tukni(v, b2) {
          if (hotovo) return;
          if (!platiVeta(v)) { b2.classList.add('zle'); desiatko.povedz(TX.ktoraZle, 'povzbudzuje', v); return; }
          hotovo = true;
          b2.classList.add('najdena');
          b2.prepend(h('span', { class: 'znacka', 'aria-hidden': 'true' }, '✔'));
          desiatko.povedz(TX.ktoraDobre, 'tesi', v);
          pridajHviezdu(b2);
          const dalej = h('button', { type: 'button', class: 'primary', 'data-dalej': '', html: IKONY.dalej, onclick: novy }, TS.dalej);
          akcie.replaceChildren(dalej);
          dalej.focus();
        }
        rov.ukaz(a, b, c);
        plocha.className = 'plocha';
        plocha.replaceChildren(rov.koren, vyber, akcie);
        desiatko.povedz(TX.ktoraOtazka, 'premysla', `${a} + ${b} = ${c}`, false);
      };
      novy();
    },

    kontrola({ plocha, desiatko, rs }) {
      const novy = () => {
        rs.zrus();
        const { a, b, uvedene } = prikladNaKontrolu(RNG, RNG() < 0.5);
        const pravda = vysledokSuhlasi(a, b, uvedene), zostatok = skuskaOdcitanim(uvedene, b);
        const rov = vytvorRovnicu(), lavy = vytvorRamcek({ rs }), pravy = vytvorRamcek({ rs }), akcie = h('div', { class: 'akcie' });
        let hotovo = false;
        rov.ukaz(a, b, uvedene);
        rozlozDoRamcekov(lavy, pravy, uvedene);
        const tlSkuska = h('button', { type: 'button', class: 'primary', 'data-skuska': '', onclick: skuska }, TX.skuska);

        function skuska() {
          tlSkuska.remove();
          const kroky = [];
          for (let j = 1; j <= b; j++) {
            kroky.push(() => { rozlozDoRamcekov(lavy, pravy, uvedene - j); desiatko.povedz(fmt(TX.odoberame, { j }), 'premysla', '', false); });
          }
          krokuj(kroky, rs, akcie, () => {
            rov.ukazRiadok(`${uvedene} − ${b} = ${zostatok}`);
            desiatko.povedz(fmt(TX.zostatok, { z: zostatok, a }), 'premysla');

              h('button', { type: 'button', 'data-suhlasi': '1', onclick: () => rozhodni(true) }, TX.suhlasi),
              h('button', { type: 'button', 'data-suhlasi': '0', onclick: () => rozhodni(false) }, TX.nesuhlasi));
            $('button', akcie).focus();
          }, 450);
        }
        function rozhodni(odpoved) {
          if (hotovo) return;
          if (odpoved !== pravda) { desiatko.povedz(fmt(TX.skusPorovnaj, { z: zostatok, a }), 'povzbudzuje'); return; }
          hotovo = true;
          desiatko.povedz(pravda ? TX.dobreSuhlasi : fmt(TX.dobreNesuhlasi, { a, b, v: a + b }), 'tesi');
          pridajHviezdu(rov.koren);
          const dalej = h('button', { type: 'button', class: 'primary', 'data-dalej': '', html: IKONY.dalej, onclick: novy }, TS.dalej);
          akcie.replaceChildren(dalej);
          dalej.focus();
        }
        plocha.className = 'plocha';
        plocha.replaceChildren(rov.koren, h('div', { class: 'dvaRamceky' }, lavy.koren, pravy.koren), akcie);
        desiatko.povedz(TX.kontrolaStart, 'premysla', `${a} + ${b} = ${uvedene}`, false);
      };
      novy();
    }
  });
}

/* ----- KARTA Chýbajúce číslo ----- */
function postavChybajuce() {
  const TX = T.kartaChybajuce, TS = T.spolocne;
  // náhodné zadanie z 36 dvojíc; c je vždy od 11 do 18
  const noveZadanie = () => { const p = generateProblem(1, RNG); return zadanieChybajuce(p.a, p.b, RNG() < 0.5 ? 'prve' : 'druhe'); };
  postavKartu('chybajuce', TX.rezimy, {
    skusam({ plocha, desiatko, rs }) {
      const novy = () => {
        rs.zrus();
        const z = noveZadanie(), rov = vytvorRovnicu(), akcie = h('div', { class: 'akcie' });
        let x = 0, hotovo = false, tahane = false;
        const lavy = vytvorRamcek({ rs, tukaci: true, onTukni: i => tukni(i) }), pravy = vytvorRamcek({ rs, tukaci: true, onTukni: i => tukni(i + MIEST) });
        const lista = h('div', { class: 'lista', role: 'group', 'aria-label': TX.listaAria });
        for (let n = 1; n <= 9; n++) lista.append(h('button', { type: 'button', 'data-n': n, onclick: () => vyber(n) }, String(n)));
        mriezkaSipky(lista, 4);
        const prekresli = () => rozlozDoRamcekov(lavy, pravy, z.znamy, x);
        // ťuknutie na prázdne miesto pridá žetóny až po neho, na posledný žetón ho uberie
        function tukni(i) {
          if (tahane) { tahane = false; return; }
          if (hotovo || i < z.znamy) return;
          const novyX = i - z.znamy + 1;
          vyber(novyX === x ? x - 1 : novyX);
        }
        // okamžité vyhodnotenie výpočtom
        function vyber(n) {
          if (hotovo || n > 9) return;
          x = Math.max(0, n);
          prekresli();
          $$('button', lista).forEach(b => b.classList.remove('zle'));
          if (x === 0) { rov.ukazRiadok(zapisChybajuce(z)); desiatko.povedz(TX.skusamStart, 'premysla', '', false); return; }
          rov.ukazRiadok(`${zapisChybajuce(z, x).split(' = ')[0]} = ${x + z.znamy}`);
          if (!rieseniaChybajuceho(z.znamy, z.c).includes(x)) {
            $(`[data-n="${x}"]`, lista).classList.add('zle');
            desiatko.povedz(fmt(TX.skusamZle, { s: x + z.znamy, c: z.c }), 'povzbudzuje', '', false);
            return;
          }
          hotovo = true;
          $(`[data-n="${x}"]`, lista).classList.add('dobre');
          desiatko.povedz(fmt(TX.dobre, { zapis: zapisChybajuce(z, x) }), 'tesi');
          pridajHviezdu(rov.koren);
          const dalej = h('button', { type: 'button', class: 'primary', 'data-dalej': '', html: IKONY.dalej, onclick: novy }, TS.dalej);
          akcie.replaceChildren(dalej);
          dalej.focus();
        }
        // ťahanie prstom po miestach pridáva žetóny; nad 9 sa nedá
        function pripravPlnenie(ram, posun) {
          ram.stred.classList.add('tahaci');
          ram.stred.addEventListener('pointerdown', () => {
            tahane = false;
            const pohyb = e => {
              const el = document.elementFromPoint(e.clientX, e.clientY), m = el && el.closest('.miesto');
              const [r, p] = !m ? [] : lavy.miesta.includes(m) ? [lavy, 0] : pravy.miesta.includes(m) ? [pravy, MIEST] : [];
              if (!r) return;
              const n = r.miesta.indexOf(m) + p - z.znamy + 1;
              if (n !== x && n >= 1 && n <= 9) { tahane = true; vyber(n); }
            };
            const koniec = () => { document.removeEventListener('pointermove', pohyb); document.removeEventListener('pointerup', koniec); document.removeEventListener('pointercancel', koniec); };
            document.addEventListener('pointermove', pohyb);
            document.addEventListener('pointerup', koniec);
            document.addEventListener('pointercancel', koniec);
          });
        }
        pripravPlnenie(lavy, 0);
        pripravPlnenie(pravy, MIEST);
        prekresli();
        rov.ukazRiadok(zapisChybajuce(z));
        plocha.className = 'plocha';
        plocha.replaceChildren(rov.koren, h('div', { class: 'dvaRamceky' }, lavy.koren, pravy.koren), lista, akcie);
        desiatko.povedz(TX.skusamStart, 'premysla', zapisChybajuce(z), false);
      };
      novy();
    },

    odpocitam({ plocha, desiatko, rs }) {
      const novy = () => {
        rs.zrus();
        const z = noveZadanie(), rov = vytvorRovnicu(), rov2 = vytvorRovnicu(), akcie = h('div', { class: 'akcie' });
        const lavy = vytvorRamcek({ rs }), pravy = vytvorRamcek({ rs });
        const klav = vytvorKlavesnicu({ onPotvrd: skontroluj });
        const tlUkaz = h('button', { type: 'button', 'data-ukaz': '', onclick: ukaz }, TX.ukaz);
        akcie.append(tlUkaz);
        rozlozDoRamcekov(lavy, pravy, z.c);
        rov.ukazRiadok(zapisChybajuce(z));
        rov2.ukazRiadok(`${z.c} − ${z.znamy} = ?`);
        function ukaz() {
          tlUkaz.remove();
          klav.zamkni(true);
          const kroky = [];
          for (let j = 1; j <= z.znamy; j++) {
            kroky.push(() => { rozlozDoRamcekov(lavy, pravy, z.c - j); desiatko.povedz(fmt(T.kartaRodina.odoberame, { j }), 'premysla', '', false); });
          }
          krokuj(kroky, rs, akcie, () => {
            klav.zamkni(false);
            desiatko.povedz(fmt(TX.zadaj, { z: z.riesenie }), 'povzbudzuje');
          }, 450);
        }
        function skontroluj(g) {
          klav.nastav('');
          if (!rieseniaChybajuceho(z.znamy, z.c).includes(g)) { desiatko.povedz(T.kartaCez.diagnoza.nic, 'povzbudzuje'); return; }
          klav.zamkni(true);
          rov.ukazRiadok(zapisChybajuce(z, g));
          rov2.ukazRiadok(`${z.c} − ${z.znamy} = ${g}`);
          desiatko.povedz(fmt(TX.dobre, { zapis: zapisChybajuce(z, g) }), 'tesi');
          pridajHviezdu(rov.koren);
          const dalej = h('button', { type: 'button', class: 'primary', 'data-dalej': '', html: IKONY.dalej, onclick: novy }, TS.dalej);
          akcie.replaceChildren(dalej);
          dalej.focus();
        }
        plocha.className = 'plocha';
        plocha.replaceChildren(rov.koren, rov2.koren, h('div', { class: 'dvaRamceky' }, lavy.koren, pravy.koren), klav.koren, akcie);
        desiatko.povedz(TX.odpocitamStart, 'premysla', zapisChybajuce(z), false);
      };
      novy();
    }
  });
}

/* =====================================================================
   SPOLOČNÉ: štatistika a ukážka podľa predvolenej pomôcky
   ===================================================================== */
function zaznamenajChybu(typ) { STAV.statistika.chyby[typ || 'ine']++; obnovPrehlad(); }
function zaznamenajPriklad(sPomocou) { STAV.statistika[sPomocou ? 'sPomocou' : 'bezPomoci']++; obnovPrehlad(); }
// celá ukážka príkladu úrovne 1 pomôckou, ktorú vybral rodič
function ukazkaPomockou({ plocha, desiatko, rs, a, b, dole }) {
  const p = STAV.nastavenia.pomocka;
  if (p === 'os') sekvenciaNaOsi({ plocha, desiatko, rs, c: crossInfo(a, b), dole });
  else if (p === 'tyce') sekvenciaTyci({ plocha, desiatko, rs, a, b, dole });
  else sekvenciaCezDesiatku({ plocha, desiatko, rs, a, b, dole });
}

/* ----- KARTA Slovné úlohy ----- */
function postavSlovne() {
  const TX = T.kartaSlovne, TC = T.kartaCez, TS = T.spolocne;
  let posledna = null;
  postavKartu('slovne', TX.rezimy, {
    ulohy({ plocha, desiatko, rs }) {
      let u = null;
      function novy() {
        rs.zrus();
        posledna = generujSlovnu(RNG, posledna);
        u = { z: posledna, a: posledna.a, b: posledna.b, c: crossInfo(posledna.a, posledna.b), presunute: 0, uroven: 0, pomoc: false, hotovo: false };
        zobraz();
      }
      // rámčeky sú pomôcka: dieťa môže presúvať, alebo rovno zadať výsledok
      function zobraz() {
        const { z, a, b, c } = u;
        rs.zrus();
        const scena = vytvorScenu({ rs, tukaci: true, obrazok: IKONY_PREDMETOV[z.noun.id], onTukni: presun });
        scena.nastavPriklad(a, b);
        scena.lavy.nastav(a, u.presunute, { animuj: false });
        scena.pravy.nastav(0, b - u.presunute, { animuj: false });
        scena.veta.koren.classList.add('bezMiesta');
        scena.veta.ukaz(u.hotovo ? 4 : 0);
        const plny = u.presunute === c.filler;
        scena.lavy.stred.classList.toggle('plny', plny);
        scena.popisL.textContent = plny ? TC.znackaDesiatka : '';
        u.scena = scena;
        pripravTahanie({ zdroj: scena.pravy.stred, ciel: scena.lavy.stred, smie: () => !u.hotovo, presun });
        u.klav = u.hotovo ? null : vytvorKlavesnicu({ onPotvrd: skontroluj });
        const akcie = h('div', { class: 'akcie' },
          u.hotovo ? null : h('button', { type: 'button', 'data-pomoc': '', onclick: pomoc }, TS.pomoc),
          h('button', { type: 'button', class: u.hotovo ? 'primary' : null, 'data-novy': '', onclick: novy }, TS.novyPriklad));
        plocha.className = 'plocha';
        plocha.replaceChildren(...[h('p', { class: 'zadanieUlohy' }, z.text), scena.koren, u.klav && u.klav.koren, akcie].filter(Boolean));
        if (!u.hotovo) desiatko.povedz(TX.start, 'premysla', hlasUlohy(z), false);
      }
      function presun() {
        const { a, b, c, scena } = u;
        if (u.hotovo || u.presunute >= c.filler) return;
        const zdroj = scena.pravy.miesta[b - u.presunute - 1], ciel = scena.lavy.miesta[a + u.presunute];
        const mal = document.activeElement === zdroj;
        u.presunute++;
        const pristal = u.presunute;
        scena.pravy.nastav(0, b - pristal, { animuj: false });
        letiZeton(rs, zdroj, ciel, 320, () => scena.lavy.nastav(a, pristal, { animuj: false }));
        if (mal) scena.pravy.miesta[b - pristal - 1].focus();
        if (pristal === c.filler) {
          scena.lavy.stred.classList.add('plny');
          scena.lavy.zvyrazniPrazdne(false);
          scena.popisL.textContent = TC.znackaDesiatka;
        }
      }
      function pomoc() {
        u.pomoc = true;
        u.uroven = Math.min(3, u.uroven + 1);
        if (u.uroven === 3) {
          const spat = h('button', { type: 'button', class: 'primary', 'data-spat-priklad': '', onclick: zobraz }, TC.spatNaPriklad);
          ukazkaPomockou({ plocha, desiatko, rs, a: u.a, b: u.b, dole: spat });
        } else if (u.uroven === 1) {
          u.scena.lavy.zvyrazniPrazdne(true);
          u.scena.pravy.zvyrazniPrazdne(true);
          desiatko.povedz(TX.pomoc1, 'povzbudzuje');
        } else desiatko.povedz(TC.pomoc2, 'povzbudzuje');
      }
      function skontroluj(g) {
        const { z, a, b } = u;
        u.klav.nastav('');
        if (g !== z.spravne) {
          const typ = diagnoseError(a, b, g);
          zaznamenajChybu(typ);
          desiatko.povedz(TC.diagnoza[typ || 'nic'], 'povzbudzuje');
          return;
        }
        u.hotovo = true;
        zaznamenajPriklad(u.pomoc);
        zobraz();
        desiatko.povedz(fmt(TX.dobre, { je: verbForm(z.spravne), v: z.spravne, N: nounForm(z.spravne, z.noun) }), 'tesi', u.c.sentence);
        pridajHviezdu(u.scena.veta.koren);
        $('[data-novy]', plocha).focus();
      }
      novy();
    }
  });
}

  postavKartu('opravarik', TX.rezimy, {
    oprav({ plocha, desiatko, rs }) {
      const novy = () => {
        rs.zrus();
        const c = generateProblem(1, RNG), o = opravarik(c.a, c.b, TYPY_OPRAV[Math.floor(RNG() * TYPY_OPRAV.length)]);

        kroky.append(...tlacidla);

          const tl = moznosti3(o.spravne, RNG, o.zobrazeny).map(x => h('button', { type: 'button', 'data-cislo': x, onclick: () => tukniVysledok(x, tl.find(b => Number(b.dataset.cislo) === x)) }, String(x)));
          m.append(...tl);
          mriezkaSipky(m, 3);
          miestoMoznosti.append(m);
          tl[0].focus();
        }
        function tukniVysledok(x, b) {
          if (hotovo) return;
          if (x !== o.a + o.b) { b.classList.add('zle'); desiatko.povedz(TX.zleVysledok, 'povzbudzuje'); return; }
          hotovo = true;
          b.classList.add('dobre');
          b.append(h('span', { class: 'znacka', 'aria-hidden': 'true' }, '✔'));
          desiatko.povedz(fmt(TX.dobre, { a: o.a, b: o.b, v: o.a + o.b }), 'tesi', c.sentence);
          pridajHviezdu(b);
          const dalej = h('button', { type: 'button', class: 'primary', 'data-dalej': '', html: IKONY.dalej, onclick: novy }, TS.dalej);
          akcie.replaceChildren(dalej);

        plocha.replaceChildren(kroky, miestoMoznosti, akcie);
        desiatko.povedz(TX.start, 'premysla', o.veta, false);
      };
      novy();
    }
  });
}

// krátka ukážka riešenia po chybe: pomôcka podľa nastavenia, úroveň 2 vždy tyčami
function miniRiesenie(rs, miesto, u) {
  const obal = h('div', { class: 'cesta' }), p = STAV.nastavenia.pomocka;
  miesto.replaceChildren(obal);
  if (u.n) {
    const ram = vytvorRamcek({ rs });
    ram.nastav(u.n, 0, { animuj: false });
    obal.append(ram.koren);
    krokuj([() => ram.nastav(u.n, filler(u.n))], rs, miesto);
    return;
  }
  if (u.uroven2 || p === 'tyce') {
    const sc = vytvorScenuTyci({ rs });
    sc.nastavPriklad(u.a, u.b);
    sc.veta.koren.classList.add('bezMiesta');
    sc.ukaz(0);
    obal.append(sc.koren);
    krokuj(stavyTyci(u.a, u.b).map((_, i) => () => sc.ukaz(i, true)), rs, miesto, null, 1100);
  } else if (p === 'os') {
    const os = vytvorOs({ rs, popisy: 'hlavne' });
    os.nastav(u.a);
    obal.append(os.koren);
    krokuj(oblukyPrikladu(u.a, u.b).map(o => () => os.skok(o, 600)), rs, miesto, null, 900);
  } else {
    const sc = vytvorScenu({ rs });
    sc.nastavPriklad(u.a, u.b);
    sc.veta.koren.classList.add('bezMiesta');
    sc.ukaz(0);
    obal.append(sc.koren);
    krokuj([1, 2, 3, 4].map(i => () => sc.ukaz(i, true)), rs, miesto, null, 1300);
  }
}
function postavKviz() {
  const TX = T.kartaKviz, TS = T.spolocne;
  postavKartu('kviz', TX.rezimy, {
    kviz({ plocha, desiatko, rs }) {
      let sada = [], i = 0, hviezd = 0;
      function start() { sada = sadaKvizu(RNG, STAV.nastavenia.uroven); i = 0; hviezd = 0; otazka(); }
      function otazka() {
        rs.zrus();
        const q = sada[i], rov = vytvorRovnicu(), akcie = h('div', { class: 'akcie' }), riesenie = h('div', { class: 'miniRiesenie' });
        let hotovo = false, ukazane = false;
        if (q.rovnica) rov.ukazRiadok(q.rovnica);
        const ciselne = q.moznosti.every(m => /^\d+$/.test(m));
        const grid = h('div', { class: ciselne ? 'moznosti tri' : 'vyberCesty', role: 'group', 'aria-label': T.hra.moznostiAria });
        const tlacidla = q.moznosti.map(m => h('button', { type: 'button', class: ciselne ? null : 'par' + (/\+/.test(m) ? '' : ' slovne'), 'data-moznost': m, onclick: () => tukni(m) }, m));
        grid.append(...tlacidla);
        mriezkaSipky(grid, q.moznosti.length);
        function tukni(m) {
          if (hotovo) return;
          const b = tlacidla[q.moznosti.indexOf(m)];
          if (!q.jeSpravna(m)) {
            b.classList.add('zle');
            desiatko.povedz(TX.zle, 'povzbudzuje');
            if (q.diag) zaznamenajChybu(diagnoseError(q.diag.a, q.diag.b, Number(m)));
            if (!ukazane) { ukazane = true; miniRiesenie(rs, riesenie, q.ukazka); }
            return;
          }
          hotovo = true;
          b.classList.add(ciselne ? 'dobre' : 'najdena');
          b.append(h('span', { class: 'znacka', 'aria-hidden': 'true' }, '✔'));
          desiatko.povedz(TX.dobre[i % TX.dobre.length], 'tesi');
          hviezd++;
          pridajHviezdu(b);
          const dalej = h('button', { type: 'button', class: 'primary', 'data-dalej': '', html: IKONY.dalej, onclick: () => { i++; if (i < sada.length) otazka(); else koniec(); } }, TS.dalej);
          akcie.replaceChildren(dalej);
          dalej.focus();
        }
        plocha.className = 'plocha';
        plocha.replaceChildren(...[h('div', { class: 'kvizInfo' }, fmt(TX.otazkaN, { n: i + 1, spolu: sada.length })),
          q.zadanie ? h('p', { class: 'zadanieUlohy' }, q.zadanie) : null, q.rovnica ? rov.koren : null, grid, riesenie, akcie].filter(Boolean));
        desiatko.povedz(q.text, 'premysla', q.hlas || q.rovnica || '', false);
      }
      function koniec() {
        rs.zrus();
        const znova = h('button', { type: 'button', class: 'primary', 'data-znova': '', html: IKONY.znova, onclick: start }, TX.znova);
        plocha.className = 'plocha';
        plocha.replaceChildren(h('div', { class: 'plaketaKonca' }, fmt(TX.hviezdy, { n: hviezd })), h('div', { class: 'akcie' }, znova));
        desiatko.povedz(TX.koniec, 'tesi');
        znova.focus();
      }
      start();
    }
  });
}

// jeden hárok ako SVG 1900 × 2700 (0,1 mm na jednotku), kruhy a štvorce sa líšia tvarom a vzorom
function kresliList(d) {
  const TX = T.kartaList;
  const text = (x, y, t, velkost, tucne = false) => `<text x="${x}" y="${y}" font-size="${velkost}"${tucne ? ' font-weight="800"' : ''}>${t}</text>`;
  const ramcek = (x, y, tvar) => {
    const b = 80, miesta = Array.from({ length: MIEST }, (_, i) => {
      const { riadok, stlpec } = miestoRamceka(i), bx = x + stlpec * b, by = y + riadok * b;
      const znak = tvar === 'kruh' ? `<circle cx="${bx + 40}" cy="${by + 40}" r="26" fill="none" stroke="#888" stroke-width="2"/>`
        : `<rect x="${bx + 14}" y="${by + 14}" width="52" height="52" rx="8" fill="none" stroke="#888" stroke-width="2"/>`;
      return `<rect x="${bx}" y="${by}" width="${b}" height="${b}" fill="none" stroke="#000" stroke-width="3"/>${znak}`;
    }).join('');
    return `${miesta}<rect x="${x}" y="${y}" width="${5 * b}" height="${2 * b}" fill="none" stroke="#000" stroke-width="7"/>`;
  };
  const priklady = d.priklady.map((p, i) => {
    const x = i % 2 ? 980 : 20, y = 230 + Math.floor(i / 2) * 470;
    return text(x, y, `${p.a} + ${p.b} =`, 64, true) + ramcek(x, y + 40, 'kruh') + ramcek(x + 440, y + 40, 'stvorec') + text(x, y + 290, TX.rozklad, 44);
  }).join('');
  const kamarati = d.kamarati.map((k, i) => {
    const x = 20 + i * 470;
    return text(x, 1810, `${k.n} +`, 60, true) + `<rect x="${x + 120}" y="1755" width="90" height="70" rx="10" fill="none" stroke="#000" stroke-width="4"/>` + text(x + 225, 1810, '= 10', 60, true);
  }).join('');
  const slovne = d.slovne.map((u, i) => {
    const x = i ? 980 : 20, vety = u.text.split(/(?<=[.?]) /);
    return vety.map((v, j) => text(x, 2040 + j * 70, v, 44)).join('') + text(x, 2040 + vety.length * 80, TX.spolu, 48, true);
  }).join('');
  return `<svg class="listSvg" viewBox="0 0 1900 2700" role="img" aria-label="${TX.nazov}">
    <defs>
      <pattern id="vzorKruh" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="3" fill="#000"/></pattern>
      <pattern id="vzorStvorec" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 16L16 0" stroke="#000" stroke-width="3"/></pattern>
    </defs>
    ${text(20, 70, TX.nazov, 66, true)}${text(1240, 70, TX.meno, 50)}
    <circle cx="50" cy="130" r="30" fill="url(#vzorKruh)" stroke="#000" stroke-width="3"/>${text(100, 145, TX.legendaKruh, 44)}
    <rect x="440" y="100" width="60" height="60" rx="10" fill="url(#vzorStvorec)" stroke="#000" stroke-width="3"/>${text(520, 145, TX.legendaStvorec, 44)}
    ${priklady}
    ${text(20, 1730, TX.kamarati, 56, true)}${kamarati}
    ${text(20, 1960, TX.slovne, 56, true)}${slovne}
  </svg>`;
}
function kresliRiesenia(d) {
  const TX = T.kartaList;
  const riadok = (y, t, velkost = 50) => `<text x="20" y="${y}" font-size="${velkost}">${t}</text>`;
  let y = 170;
  const riadky = [];
  for (const p of d.priklady) { riadky.push(riadok(y, p.sentence)); y += 90; }
  y += 40;
  for (const k of d.kamarati) { riadky.push(riadok(y, `${k.n} + ${k.riesenie} = 10`)); y += 90; }
  y += 40;
  for (const u of d.slovne) { riadky.push(riadok(y, `${u.a} + ${u.b} = ${u.spravne}. Spolu ${verbForm(u.spravne)} ${u.spravne} ${nounForm(u.spravne, u.noun)}.`)); y += 90; }
  return `<svg class="listSvg" viewBox="0 0 1900 2700" role="img" aria-label="${TX.riesenia}"><text x="20" y="80" font-size="66" font-weight="800">${TX.riesenia}</text>${riadky.join('')}</svg>`;
}

// jemná ponuka v ostatných kartách, nikdy nič nezamyká
function obnovOdkaz() { $('#odkaz').hidden = !(STAV.slabiKamarati >= 2 && STAV.karta !== 'kamarati'); }
const viditelneKarty = () => PORADIE_KARIET.filter(k => k !== 'dveDesiatky' || STAV.uroven3);
// panel pre rodiča tým odomkne alebo skryje kartu úrovne 3
function nastavUroven3(ano) {
  STAV.uroven3 = !!ano;
  $('#tab-dveDesiatky').hidden = !STAV.uroven3;
  if (!STAV.uroven3 && STAV.karta === 'dveDesiatky') ukazKartu(PORADIE_KARIET[0]);
}
function ukazKartu(id, zapisHash = true) {
  if (!viditelneKarty().includes(id)) id = PORADIE_KARIET[0];
  if (id === STAV.karta) return;
  zastavCitanie();
  $$('.letiaciZeton').forEach(z => z.remove());   // letiaci žetón nesmie ostať nad inou kartou
  STAV.karta = id;
  if (id === 'kamarati') STAV.slabiKamarati = 0;
  for (const k of PORADIE_KARIET) {
    KARTY[k].koren.hidden = k !== id;
    const tab = $('#tab-' + k);
    tab.setAttribute('aria-selected', String(k === id));
    tab.tabIndex = k === id ? 0 : -1;
  }
  $('#tab-' + id).scrollIntoView({ inline: 'nearest', block: 'nearest' });
  if (zapisHash) history.replaceState(null, '', '#' + id);
  obnovOdkaz();
}

/* =====================================================================
   TESTY (spustia sa s ?test v adrese)
   ===================================================================== */
function spustiTesty() {
  let ok = 0, zle = 0;
  const vysledky = [];
  const over = (podmienka, popis) => { if (podmienka) ok++; else { zle++; vysledky.push('✘ ' + popis); } };
  const chyba = f => { try { f(); return null; } catch (e) { return e.message; } };
  const slov = t => t.replace(/[✔✘★:.,!?=+]/g, ' ').split(/\s+/).filter(Boolean).length;
  const povodnePohyb = smieHybat;
  smieHybat = () => false;   // logiku skúšame bez čakania na animácie

  // 1. numWords
  for (const [n, ocak] of [[0, 'nula'], [1, 'jedna'], [2, 'dva'], [5, 'päť'], [10, 'desať'], [13, 'trinásť'], [19, 'devätnásť'], [20, 'dvadsať'],

    over(numWords(n) === ocak, `numWords(${n}) = ${numWords(n)}`);

    [12, 'f', 'dvanásť'], [21, 'm', 'dvadsaťjeden'], [21, 'f', 'dvadsaťjedna'], [21, 'n', 'dvadsaťjedno'], [22, 'm', 'dvadsaťdva'], [22, 'n', 'dvadsaťdve'], [32, 'f', 'tridsaťdve']]) {
    over(numWords(n, r) === ocak, `numWords(${n}, ${r}) = ${numWords(n, r)}`);
  }
  over(numWords(22) === 'dvadsaťdva', 'numWords(22)');
  over(chyba(() => numWords(101)) && chyba(() => numWords(-1)) && chyba(() => numWords(1.5)), 'numWords mimo rozsahu vyhodí chybu');

  // 2. kamaráti
  over(bondsOrdered().length === 9 && bondsOrdered().every(([a, b]) => a + b === 10), 'bondsOrdered: 9 dvojíc so súčtom 10');
  over(bondsUnordered().length === 5 && JSON.stringify(bondsUnordered()) === '[[1,9],[2,8],[3,7],[4,6],[5,5]]', 'bondsUnordered: 5 dvojíc');
  for (let a = 1; a <= 9; a++) over(filler(a) === 10 - a, 'filler ' + a);

  // 3. crossInfo
  for (const [a, b, f, r, v, veta] of [[8, 5, 2, 3, 13, '8 + 5 = 8 + 2 + 3 = 10 + 3 = 13'], [9, 2, 1, 1, 11, '9 + 2 = 9 + 1 + 1 = 10 + 1 = 11'],
    [7, 6, 3, 3, 13, '7 + 6 = 7 + 3 + 3 = 10 + 3 = 13'], [5, 6, 5, 1, 11, '5 + 6 = 5 + 5 + 1 = 10 + 1 = 11'], [9, 9, 1, 8, 18, '9 + 9 = 9 + 1 + 8 = 10 + 8 = 18']]) {
    const c = crossInfo(a, b);
    over(c.filler === f && c.remainder === r && c.result === v && c.sentence === veta, `crossInfo(${a}, ${b}) = ${JSON.stringify(c)}`);
  }
  over(chyba(() => crossInfo(6, 4)) === 'Toto nie je cez desiatku', 'crossInfo(6, 4) vráti chybu');

  // 4. enumerateLevel1
  const uroven1 = enumerateLevel1();
  over(uroven1.length === 36, 'enumerateLevel1: 36 dvojíc, je ' + uroven1.length);
  over(new Set(uroven1.map(([a, b]) => [Math.min(a, b), Math.max(a, b)].join())).size === 20, 'enumerateLevel1: 20 neusporiadaných');
  over(uroven1.every(([a, b]) => a >= 2 && a <= 9 && b >= 2 && b <= 9 && a + b >= 11), 'enumerateLevel1: všetky platné');
  for (const [a, b] of uroven1) {
    const c = crossInfo(a, b);
    over(c.filler + c.remainder === b && 10 + c.remainder === a + b, `rozklad ${a} + ${b}`);
  }

  // 5. bestOrder
  for (const [a, b] of uroven1) {
    const [x, y] = bestOrder(a, b);
    over(filler(x) <= filler(y) && x + y === a + b, `bestOrder(${a}, ${b})`);
  }
  over(bestOrder(3, 9).join() === '9,3' && filler(bestOrder(3, 9)[0]) === 1, 'bestOrder(3, 9) = (9, 3) s doplnkom 1');

  // generateProblem: bez opakovania po sebe a so semienkom vždy rovnako
  const postupnost = sem => { const g = generatorSoSemienkom(sem); return Array.from({ length: 300 }, () => generateProblem(1, g)); };
  const p1 = postupnost(42), p2 = postupnost(42), p3 = postupnost(43);
  over(p1.every((x, i) => x.sentence === p2[i].sentence), 'generateProblem: deterministický so semienkom');
  over(p1.some((x, i) => x.sentence !== p3[i].sentence), 'generateProblem: iné semienko, iná postupnosť');
  over(p1.every((x, i) => !i || x.a !== p1[i - 1].a || x.b !== p1[i - 1].b), 'generateProblem: neopakuje sa po sebe');

  // 6. rámček
  for (let i = 0; i < 10; i++) { const m = miestoRamceka(i); over(m.riadok === (i < 5 ? 0 : 1) && m.stlpec === i % 5, 'poradie miesta ' + i); }
  for (let n = 0; n <= 10; n++) {
    const r = naplnRamcek(n);
    over(r.every((t, i) => (i < n ? t === 'kruh' : t === null)), 'plnenie v poradí, n = ' + n);
  }
  over(naplnRamcek(12).filter(Boolean).length === 10 && naplnRamcek(7, 9).filter(Boolean).length === 10 && naplnRamcek(4, 4, 9).filter(Boolean).length === 10, 'rámček sa nepreplní');
  const ramTest = vytvorRamcek({});

  over(ramTest.kruhy() === 8 && ramTest.stvorce() === 2 && $$('.zeton', ramTest.koren).length === 10, 'rámček na obrazovke sa nepreplní');
  over($$('.zeton.kruh', ramTest.koren).length === 8 && $$('.zeton.stvorec', ramTest.koren).length === 2, 'kruhy a štvorce sú rôzne tvary');

  // číselnica: najviac 3 číslice, prázdny vstup nič nerobí
  over(vstupKlavesnice('123', '4') === '123' && vstupKlavesnice('0', '7') === '7' && vstupKlavesnice('12', '⌫') === '1' && vstupKlavesnice('', '⌫') === '' && vstupKlavesnice('1', 'x') === '1', 'vstup číselnice');
  let potvrdene = [];
  const klTest = vytvorKlavesnicu({ onPotvrd: c => potvrdene.push(c) });

  for (const k of '1234') klTest.stlac(k);
  over(klTest.hodnota() === '123', 'číselnica: 4. číslica sa nezapíše');
  klTest.stlac('✔');
  over(potvrdene.length === 0 && /100/.test(klTest.koren.textContent), 'číselnica: 123 odmietne s hláškou, prázdny ✔ nič nerobí');

  klTest.stlac('✔');
  over(potvrdene.join() === '100' && !/Počítame/.test(klTest.koren.textContent), 'číselnica: 100 prijme a hlášku zmaže');

  // možnosti pre kamaráta
  for (let n = 1; n <= 9; n++) {
    const m = moznostiKamarata(n, generatorSoSemienkom(n));
    over(m.length === 4 && new Set(m).size === 4 && m.includes(10 - n) && m.every(x => x >= 1 && x <= 9), 'moznostiKamarata ' + n + ': ' + m);
  }
  over(PYRAMIDA_RADY.flat().sort().join() === bondsOrdered().map(b => b[0]).join(), 'pyramída má všetkých 9 dvojíc');

  // hlas: rovnica slovami, bez slovenského hlasu sa reproduktor neukáže
  over(textNaHlas('✔ Správne! 7 + 3 = 10.') === 'Správne! sedem plus tri je desať.', 'hlas: ' + textNaHlas('✔ Správne! 7 + 3 = 10.'));
  over(textNaHlas('7 + ? = 10') === 'sedem plus koľko je desať', 'hlas: ' + textNaHlas('7 + ? = 10'));
  over(slovenskyHlas(null) === null && slovenskyHlas({ getVoices: () => [{ lang: 'en-US' }] }) === null && slovenskyHlas({ getVoices: () => { throw 1; } }) === null, 'slovenský hlas: chýba = null');
  over(!!slovenskyHlas({ getVoices: () => [{ lang: 'sk-SK' }] }), 'slovenský hlas sa nájde');
  over(STAV.hlas === false, 'hlas je predvolene vypnutý');

  // všetky vety Desiatka: najviac 8 slov (rovnicu rátame po číslach)
  const vety = o => (typeof o === 'string' ? [o] : Object.entries(o).filter(([k]) => !/aria|Aria|pata|cislovky|sablony|rodic/.test(k)).flatMap(([, v]) => vety(v)));
  for (const v of vety(T)) over(slov(v) <= 8, 'viac ako 8 slov: ' + v);

  // úloha „Koľko chýba?“: chyba, tri nápovedy, hviezdička aj po nápovedách
  ukazKartu('ramcek');
  const kr = KARTY.ramcek;
  kr.prepni('chyba');
  const plochaR = $('#karta-ramcek .plocha');
  const hviezdyPred = STAV.hviezdy;

  klavesa(String(m === 2 ? 3 : 2)); klavesa('✔');
  over(new RegExp('Chýba ' + m).test(kr.desiatko.text()), 'druhý stupeň ukáže číslo: ' + kr.desiatko.text());

  for (let i = 0; i < 12 && $('#karta-ramcek .akcie button:not([data-dalej])'); i++) {

  over($$('#karta-ramcek .zeton.stvorec').every(z => z.textContent), 'vyplnené miesta sú očíslované');
  klavesa(String(m)); klavesa('✔');
  over(STAV.hviezdy === hviezdyPred + 1, 'hviezdička aj po troch nápovedách');
  over($$('#karta-ramcek .zeton').length === 10, 'po správnej odpovedi je rámček plný');

  // Napĺňaj: ťukanie aj plus a mínus

  const miesta = $$('#karta-ramcek .miesto');

  over($('#karta-ramcek .rovnica').getAttribute('aria-label') === '7 + 3 = 10', 'Napĺňaj: rovnica');

  // Rozdeľ desiatku: šípky a ťuknutie

  // Nájdi kamaráta: možnosti aj číselnica, sledovanie nezvládnutých príkladov
  kk.prepni('najdi');
  const najdiZle = () => {
    n = $$('#karta-kamarati .zeton.kruh').length;

  over(STAV.slabiKamarati === 2, 'dva nezvládnuté príklady sa zapísali');

  // Pyramída: 9 dvojíc, otočenie karty, 9 hviezdičiek

  $$('#karta-kamarati .akcie button').pop().click();
  STAV.hviezdy = 0; obnovHviezdy();

  /* ----- časť 2 ----- */
  // 1. stavový stroj: každý krok, každý medzistav, aj to, čo je naozaj na obrazovke
  for (const [a, b] of uroven1) {

    over(st[4].vysledok === a + b, `výsledok po kroku 5: ${a} + ${b}`);
    over(st.every((x, i) => (!i || x.odkryte >= st[i - 1].odkryte) && (i === 4 ? x.odkryte === 4 : x.odkryte < 4)), `veta sa odkrýva postupne: ${a} + ${b}`);

  // Skontroluj ma: rozhoduje výpočet, aj ked dieťa ťukne zle
  for (let i = 0; i < 6; i++) {
    kd.prepni('kontrola');
    const hvK = STAV.hviezdy;
    const [ka, kb2, kc2] = $(korD + ' .rovnica').getAttribute('aria-label').split(/ [+=] /).map(Number);
    const pravda = ka + kb2 === kc2;
    $(korD + ' [data-skuska]').click();
    for (let j = 0; j < 12; j++) { const t = [...$$(korD + ' .akcie button')].find(x => x.textContent === T.spolocne.dalsiKrok); if (t) t.click(); }
    over($(korD + ' .rovnica').getAttribute('aria-label') === `${kc2} − ${kb2} = ${kc2 - kb2}`, 'skúška ukáže odčítanie');
    $(`${korD} [data-suhlasi="${pravda ? 0 : 1}"]`).click();
    over(STAV.hviezdy === hvK, 'zlé rozhodnutie nedá hviezdičku');
    $(`${korD} [data-suhlasi="${pravda ? 1 : 0}"]`).click();
    over(STAV.hviezdy === hvK + 1, 'správne rozhodnutie dá hviezdičku');
  }

  // Chýbajúce číslo
  const kz = KARTY.chybajuce, korZ = '#karta-chybajuce';
  ukazKartu('chybajuce');
  kz.prepni('skusam');
  const rozlozeny = $(korZ + ' .rovnica').getAttribute('aria-label').replace(' = ', ' + ').split(' + ');
  const znamy = Number(rozlozeny.find(x => x !== '□' && x !== rozlozeny[2])), cZ = Number(rozlozeny[2]), riesZ = cZ - znamy;
  const hvZ = STAV.hviezdy;
  $(`${korZ} [data-n="${riesZ === 9 ? 8 : riesZ + 1}"]`).click();
  over(/Skús ešte raz/.test(kz.desiatko.text()) && STAV.hviezdy === hvZ, 'Skúšam: zlé číslo sa hneď ukáže');
  $(`${korZ} [data-n="${riesZ}"]`).click();
  over(STAV.hviezdy === hvZ + 1 && $$(korZ + ' .zeton').length === cZ, 'Skúšam: správne číslo, ' + cZ + ' žetónov');
  kz.prepni('odpocitam');
  const [cO, zO] = $$(korZ + ' .rovnica')[1].getAttribute('aria-label').split(' = ')[0].split(' − ').map(Number);
  const klZ = k => $(`${korZ} [data-klaves="${k}"]`).click();
  $(korZ + ' [data-ukaz]').click();
  for (let j = 0; j < 12; j++) { const t = [...$$(korZ + ' .akcie button')].find(x => x.textContent === T.spolocne.dalsiKrok); if (t) t.click(); }
  over($$(korZ + ' .zeton').length === cO - zO, 'Odpočítam: zostane c − b žetónov');
  const hvZ2 = STAV.hviezdy;
  klZ(String(cO - zO)); klZ('✔');
  over(STAV.hviezdy === hvZ2 + 1, 'Odpočítam: hviezdička');

  // Dve desiatky a jednotky: skrytá karta
  over($('#tab-dveDesiatky').hidden, 'úroveň 3 je predvolene skrytá');
  ukazKartu('dveDesiatky');
  over(STAV.karta !== 'dveDesiatky', 'skrytá karta sa nedá otvoriť');
  nastavUroven3(true);
  ukazKartu('dveDesiatky');
  over(STAV.karta === 'dveDesiatky' && /Pre šikovných/.test($('#karta-dveDesiatky').textContent), 'po odomknutí sa karta otvorí');
  KARTY.dveDesiatky.prepni('pozeraj');
  let krokyD = 0;
  while (!$('#karta-dveDesiatky [data-krok]').disabled && krokyD < 9) { $('#karta-dveDesiatky [data-krok]').click(); krokyD++; }
  over(krokyD === 4 && $$('#karta-dveDesiatky .castVety:not(.skryta)').length === 4, 'úroveň 3: všetky kroky');
  nastavUroven3(false);
  over(STAV.karta !== 'dveDesiatky' && $('#tab-dveDesiatky').hidden, 'po zamknutí sa karta skryje');
  over(textNaHlas('13 − 5 = 8') === 'trinásť mínus päť je osem' && textNaHlas('□ + 8 = 13') === 'koľko plus osem je trinásť', 'hlas: mínus a chýbajúce číslo: ' + textNaHlas('□ + 8 = 13'));
  STAV.hviezdy = 0; obnovHviezdy();

  /* ----- časť 4 ----- */
  const N = id => NOUNS.find(x => x.id === id);
  // 1. gramatika
  for (const [c, ocak] of [[1, 'jablko'], [2, 'jablká'], [4, 'jablká'], [5, 'jabĺk'], [9, 'jabĺk'], [11, 'jabĺk'], [13, 'jabĺk'], [18, 'jabĺk']]) over(nounForm(c, N('jablko')) === ocak, `nounForm(${c}, jablko)`);
  over(nounForm(2, N('knizka')) === 'knižky' && nounForm(5, N('knizka')) === 'knižiek', 'knižka');
  over(nounForm(5, N('ceruzka')) === 'ceruziek' && nounForm(5, N('auto')) === 'áut' && nounForm(5, N('lopta')) === 'lôpt', 'ceruzka, auto, lopta');
  for (const c of [2, 3, 4]) over(verbForm(c) === 'sú', 'verbForm ' + c);
  for (const c of [5, 9, 12, 18]) over(verbForm(c) === 'je', 'verbForm ' + c);
  over(NOUNS.length === 8 && NOUNS.every(x => IKONY_PREDMETOV[x.id]), '8 podstatných mien s obrázkom');

  // 2. zadania: 1 000 úloh
  over(slovnaUloha(8, 5, N('jablko'), 0).text === 'Na stole je 8 jabĺk. Pridáme ešte 5 jabĺk. Koľko ich je spolu?', 'šablóna 1, 8 + 5');
  over(slovnaUloha(3, 9, N('jablko'), 0).text === 'Na stole sú 3 jablká. Pridáme ešte 9 jabĺk. Koľko ich je spolu?', 'šablóna 1, 3 + 9');
  over(slovnaUloha(3, 9, N('ceruzka'), 1).text === 'V prvej škatuli sú 3 ceruzky. V druhej je 9 ceruziek. Koľko ich je spolu?', 'šablóna 2');
  const gu = generatorSoSemienkom(9);
  let ulohyDobre = true, predosla = null;
  for (let i = 0; i < 1000; i++) {
    const u = generujSlovnu(gu, predosla);
    const vetyU = u.text.split(/(?<=[.?]) /);
    const tvarA = `${verbForm(u.a)} ${u.a} ${nounForm(u.a, u.noun)}.`;
    if (u.a + u.b < 11 || u.a + u.b > 18 || u.spravne !== u.a + u.b || vetyU.length > 3 || vetyU.some(v => v.split(/\s+/).length > 12) || !u.text.includes(tvarA)
      || !u.text.includes(`${u.b} ${nounForm(u.b, u.noun)}.`) || (predosla && predosla.text === u.text)) ulohyDobre = false;
    predosla = u;
  }
  over(ulohyDobre, 'slovné úlohy: 1 000 zadaní');

  // 3. hlas podľa rodu
  over(numWords(2, N('ceruzka').rod) === 'dve' && numWords(2, N('kvet').rod) === 'dva' && numWords(2, N('jablko').rod) === 'dve', 'numWords podľa rodu');
  over(hlasUlohy(slovnaUloha(2, 9, N('kvet'), 0)).startsWith('Na stole sú dva kvety.') && hlasUlohy(slovnaUloha(2, 9, N('ceruzka'), 0)).startsWith('Na stole sú dve ceruzky.'), 'hlas zadania v rode');

  // 4. Opravárik: 36 príkladov × 4 šablóny
  for (const [a, b] of uroven1) for (const typ of TYPY_OPRAV) {
    const o = opravarik(a, b, typ);
    over(o.zobrazeny !== a + b && o.spravne === a + b, `Opravárik ${typ} ${a} + ${b}: výsledok`);
    over(krokJeChybny(o, o.chybny), `Opravárik ${typ} ${a} + ${b}: krok ${o.chybny} je chybný`);
    over(Array.from({ length: o.chybny }, (_, i) => i).every(i => !krokJeChybny(o, i)), `Opravárik ${typ} ${a} + ${b}: skoršie kroky sú dobré`);
  }
  over(opravarik(8, 5, 'forgotFiller').veta === '8 + 5 = 8 + 2 + 5 = 10 + 5 = 15', 'príklad zo zadania');

  // 5. kvíz: 1 000 sád pre úrovne 1 až 3
  const gq = generatorSoSemienkom(11);
  let kvizDobre = true;
  for (let i = 0; i < 1000; i++) {
    const uroven = i % 3 + 1, sada = sadaKvizu(gq, uroven), typyS = new Set(sada.map(q => q.typ));
    if (sada.length !== 12 || !TYPY_KVIZU.every(t => typyS.has(t)) || typyS.has('uroven2') !== (uroven >= 2)) kvizDobre = false;
    for (const q of sada) if (q.moznosti.filter(q.jeSpravna).length !== 1 || new Set(q.moznosti).size !== q.moznosti.length || q.moznosti.length < 2) { kvizDobre = false; window.ZLA_OTAZKA = [q.typ, q.moznosti, q.rovnica]; }
  }
  over(kvizDobre, 'kvíz: 1 000 sád ' + JSON.stringify(window.ZLA_OTAZKA || ''));

  // Slovné úlohy: rámčeky aj rovno výsledok, Pomoc, veta na konci
  const ks = KARTY.slovne, korS = '#karta-slovne';
  ukazKartu('slovne');
  ks.prepni('ulohy');
  const cislaS = () => $(korS + ' .zadanieUlohy').textContent.match(/\d+/g).map(Number);
  let [sa, sb] = cislaS();
  over($$(korS + ' .zeton svg').length === sa + sb && $$(korS + ' .zeton.kruh').length === sa, 'Slovné: obrázky v rámčekoch a kusov vľavo');
  const hvS = STAV.hviezdy;
  const klS = k => $(`${korS} [data-klaves="${k}"]`).click();
  const zadajS = t => { for (const c of String(t)) klS(c); klS('✔'); };
  zadajS(sa + sb + 1);
  over(STAV.hviezdy === hvS && /kocku|Skús|desiatku|vzal|vymenil/.test(ks.desiatko.text()), 'Slovné: chyba');
  zadajS(sa + sb);
  over(STAV.hviezdy === hvS + 1 && ks.desiatko.text().includes(`Spolu je ${sa + sb} `) && /[✔]/.test(ks.desiatko.text()), 'Slovné: veta Spolu je: ' + ks.desiatko.text());
  $(korS + ' [data-novy]').click();
  [sa, sb] = cislaS();
  $(korS + ' [data-pomoc]').click();
  over($$(korS + ' .ramcek.prazdneSvieti').length === 2, 'Slovné: Pomoc 1 zvýrazní rámčeky');
  $(korS + ' [data-pomoc]').click();
  over(ks.desiatko.text() === 'Doplň do 10.', 'Slovné: Pomoc 2');
  $(korS + ' [data-pomoc]').click();
  over(!!$(korS + ' [data-krok]') && !!$(korS + ' [data-spat-priklad]'), 'Slovné: Pomoc 3 ukáže animáciu');
  $(korS + ' [data-spat-priklad]').click();
  const pravoS = () => $$(korS + ' .stlpRamceka:nth-child(2) .miesto');
  pravoS()[0].click();
  over($$(korS + ' .stlpRamceka:nth-child(1) .zeton').length === sa + 1, 'Slovné: rámčeky sa dajú použiť');
  zadajS(sa + sb);
  over(STAV.statistika.sPomocou >= 1, 'Slovné: štatistika s pomocou');
  // pomôcka z panela sa použije v ukážke
  STAV.nastavenia.pomocka = 'os';
  $(korS + ' [data-novy]').click();
  for (let i = 0; i < 3; i++) $(korS + ' [data-pomoc]').click();
  over(!!$(korS + ' .os'), 'pomôcka: číselná os');
  STAV.nastavenia.pomocka = 'tyce';
  $(korS + ' [data-spat-priklad]').click();
  $(korS + ' [data-pomoc]').click();
  over(!!$(korS + ' .tyce'), 'pomôcka: tyče');
  STAV.nastavenia.pomocka = 'ramceky';

  // Opravárik v karte
  const kv = KARTY.opravarik, korV = '#karta-opravarik';
  ukazKartu('opravarik');
  kv.prepni('oprav');
  const hvV = STAV.hviezdy;
  $(korV + ' [data-krok-opravy="0"]').click();
  over(/Skús ešte raz/.test(kv.desiatko.text()), 'Opravárik: prvý krok je dobrý');
  const krokyV = $$(korV + ' [data-krok-opravy]').map(b => b.textContent.replace('= ', ''));
  const [va, vb] = krokyV[0].split(' + ').map(Number);
  const chybnyV = krokyV.findIndex((t, i) => i && (t.split(' + ').map(Number).reduce((x, y) => x + y, 0) !== va + vb || (i === 1 && va + Number(t.split(' + ')[1]) !== 10)));
  $(`${korV} [data-krok-opravy="${chybnyV}"]`).click();
  over($$(korV + ' .moznosti button').length === 3, 'Opravárik: tri možnosti');
  $$(korV + ' .moznosti button').find(b => Number(b.dataset.cislo) === va + vb).click();
  over(STAV.hviezdy === hvV + 1 && !!$(korV + ' [data-dalej]'), 'Opravárik: oprava a hviezdička');

  // Kvíz v karte: 12 otázok, chyba, ukážka, koniec, Hrať znova
  const kq = KARTY.kviz, korQ = '#karta-kviz';
  ukazKartu('kviz');
  kq.prepni('kviz');
  const hvQ = STAV.hviezdy;
  // správnu možnosť zistí test z toho, že po nej príde tlačidlo Ďalej
  for (let i = 0; i < 12; i++) {
    over($(korQ + ' .kvizInfo').textContent === `Otázka ${i + 1} z 12`, 'Kvíz: číslo otázky ' + (i + 1));
    for (const b of $$(korQ + ' [data-moznost]')) { if (!$(korQ + ' [data-dalej]')) b.click(); }
    for (let j = 0; j < 8; j++) { const t = [...$$(korQ + ' .miniRiesenie button')].find(x => x.textContent === T.spolocne.dalsiKrok); if (t) t.click(); }
    over(!!$(korQ + ' [data-dalej]'), 'Kvíz: otázka sa dá dokončiť ' + (i + 1));
    $(korQ + ' [data-dalej]').click();
  }
  over(STAV.hviezdy === hvQ + 12 && /★ 12/.test($(korQ + ' .plaketaKonca').textContent), 'Kvíz: 12 hviezdičiek na konci');
  $(korQ + ' [data-znova]').click();
  over($(korQ + ' .kvizInfo').textContent === 'Otázka 1 z 12', 'Kvíz: Hrať znova');

  // 6. pracovný list
  for (let i = 0; i < 200; i++) {
    const d = pracovnyList(generatorSoSemienkom(i));
    if (new Set(d.priklady.map(p => p.a + ',' + p.b)).size !== 6 || d.kamarati.length !== 4 || d.slovne.length !== 2 || !d.priklady.every(p => p.result === p.a + p.b) || !d.kamarati.every(k => k.n + k.riesenie === 10) || d.slovne[0].text === d.slovne[1].text) over(false, 'pracovný list ' + i);
  }
  ukazKartu('list');
  KARTY.list.prepni('list');
  const prvyList = $('#karta-list .nahladListu').innerHTML;
  $('#karta-list [data-nova-sada]').click();
  over($('#karta-list .nahladListu').innerHTML !== prvyList, 'Nová sada vygeneruje iné príklady');
  over($('#karta-list .listRiesenia').hidden, 'riešenia sú predvolene skryté');
  $('#karta-list [data-riesenia]').click();
  const dl = KARTY.list.data, txtR = $('#karta-list .listRiesenia').textContent;
  over(!$('#karta-list .listRiesenia').hidden && dl.priklady.every(p => txtR.includes(p.sentence)), 'riešenia súhlasia s výpočtom');
  $('#karta-list [data-riesenia]').click();

  // panel: nastavenia, prehľad, nič sa neukladá
  const pr = $('#rodic');
  over(!pr.open && !$('#karty button[id="tab-rodic"]'), 'panel je zbalený a mimo navigácie');
  over(T.rodic.navod.length <= 6 && T.rodic.aktivity.length === 3, 'návod najviac 6 viet, 3 aktivity');
  $('#tlRodic').click();
  over(pr.open && $('#tlRodic').getAttribute('aria-expanded') === 'true', 'ikona otvorí panel');
  zaznamenajChybu('forgotTen');
  over(/Zabudnuté pripočítanie desiatky/.test(pr.textContent) && /Cez desiatku/.test(pr.textContent), 'prehľad: chyba slovami a odporúčanie');
  PANEL.selUroven.value = '3'; PANEL.selUroven.dispatchEvent(new Event('change'));
  over(STAV.uroven3 && !$('#tab-dveDesiatky').hidden, 'úroveň 3 odomkne kartu');
  PANEL.selUroven.value = '2'; PANEL.selUroven.dispatchEvent(new Event('change'));
  over(!STAV.uroven3 && $('#tab-dveDesiatky').hidden && STAV.nastavenia.uroven === 2, 'úroveň 2 kartu skryje');
  over(sadaKvizu(generatorSoSemienkom(1), STAV.nastavenia.uroven).some(q => q.typ === 'uroven2'), 'kvíz pri úrovni 2');
  PANEL.selUroven.value = '1'; PANEL.selUroven.dispatchEvent(new Event('change'));
  PANEL.chRozklad.click();
  over(document.body.classList.contains('bezRozkladu'), 'vety s rozkladom sa dajú vypnúť');
  PANEL.chRozklad.click();
  over(!document.body.classList.contains('bezRozkladu'), 'vety s rozkladom sa dajú zapnúť');
  $('#tlRodic').click();
  over(odporucania({ bezPomoci: 1, sPomocou: 3, chyby: { forgotFiller: 2, ine: 1 } }).join() === 'Kamaráti do 10,Vymeň poradie', 'odporúčania');
  // 7. súkromie: v zdrojovom kóde nič neukladá ani neodosiela (slová sú rozdelené, aby nenašiel sám seba)
  const zdroj = [...document.scripts].map(x => x.textContent).join('\n');
  over(!new RegExp(['local' + 'Storage', 'session' + 'Storage', 'document' + '\\.cookie', 'indexed' + 'DB', 'fet' + 'ch\\(', 'XMLHttp' + 'Request', 'send' + 'Beacon'].join('|')).test(zdroj), 'nič neukladá ani neodosiela');
  STAV.hviezdy = 0; obnovHviezdy();

  // 9. externé adresy: len GoatCounter
  const html = document.documentElement.outerHTML;
  const adresy = (html.match(/(https?:)?\/\/[a-z0-9.-]+\.[a-z]{2,}[^\s"'<>)]*/gi) || []).filter(a => !/goatcounter\.com|gc\.zgo\.at|w3\.org\/2000\/svg/.test(a));
  over(adresy.length === 0, 'cudzie adresy: ' + adresy.join(', '));
  over(document.scripts.length >= 1 && [...document.scripts].filter(x => x.src).length <= 1, 'najviac jeden externý skript');
  over(!$('audio') && !$('video'), 'žiadny zvuk okrem hlasu');
  over([...document.scripts].pop().dataset.goatcounter === 'https://jasvarc.goatcounter.com/count', 'GoatCounter je posledný skript');
  over($('#repro').hidden === !NAHLAS.hlas, 'reproduktor je len so slovenským hlasom');

  smieHybat = povodnePohyb;
  kk.prepni('ako');
  kr.prepni('ako');
  kc.prepni('pozeraj');
  ko.prepni('pozeraj');
  kp.prepni('ako');
  kt.prepni('pozeraj');
  kb.prepni('porovnaj');
  kd.prepni('ako');
  kz.prepni('skusam');
  ks.prepni('ulohy');
  kv.prepni('oprav');
  kq.prepni('kviz');
  ukazKartu(PORADIE_KARIET[0]);
  const vystup = h('div', { id: 'testy' }, `Testy: ${ok} v poriadku, ${zle} zle\n` + vysledky.join('\n'));
  $('.wrap').prepend(vystup);
  window.VYSLEDOK_TESTOV = { ok, zle, vysledky };
}

init();
</script>
<script data-goatcounter="https://jasvarc.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
