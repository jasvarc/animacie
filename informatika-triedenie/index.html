/* =====================================================================
   JADRO – algoritmy a počítanie. Žiadna práca s obrazovkou.

function nahRozne(n, min, max) {   // n rôznych čísel; keď sa do rozsahu nezmestia, rozsah sa zväčší (žiadne zacyklenie)
  if (max - min + 1 < n) max = min + n - 1;

}

    yield { t: 'koloKoniec', kolo, line: 6, txt: 'naMieste', p: { k: kolo, a: a[koniec].v } };
    if (!vymena) { yield { t: 'ziadna', line: 7, txt: 'ziadna' }; return; }   // predčasné ukončenie

/* ---------- Triedenie výberom ---------- */
function* vyberom(S) {
  const a = S.a, n = a.length;

    let m = i;
    S.spec = { id: a[i].id, lbl: 'min' };

/* ---------- Triedenie vkladaním ---------- */
function* vkladanim(S) {

/* ---------- Triedenie zlučovaním ---------- */

    yield { t: 'info', line: 5, txt: 'doPom', p: { lo: lo + 1, hi: hi + 1, m: m + 1, m1: m + 2 } };

/* ---------- Rýchle triedenie (pivot = posledný prvok, Lomutovo rozdelenie) ---------- */

      if (mensi) {

function novyStav(hodnoty) {

  return vysl;
}
// rýchle spočítanie bez animácie (graf, súťaž, kvíz); naUdalost(ev, S, c) – voliteľné sledovanie
function spocitaj(key, hodnoty, naUdalost) {
  const S = novyStav(hodnoty), c = { p: 0, v: 0 };
  for (const ev of beh(key, S)) {
    const k = POCITANE[ev.t]; if (k) c[k]++;
    if (naUdalost) naUdalost(ev, S, c);
  }
  c.k = c.p + c.v; c.vysl = over(key, hodnoty, S);
  return c;
}
function textKroku(key, ev, c) {
  const T = TEXTY.alg[key], Sp = TEXTY.spolocne;
  if (ev.t === 'start') return fmt(Sp.start, { uvod: T.txt.start });
  if (ev.t === 'done') return fmt(Sp.done, { p: sklon(c.p, 'p'), v: sklon(c.v, ALG[key].druh), k: sklon(c.p + c.v, 'k') });
  return fmt(T.txt[ev.txt], ev.p);
}
// zaznamená všetky kroky pre animáciu a krok späť: snímka = poloha každého prvku + značky + text
// poloha: 0–99 = hlavné pole, 100+ = pomocné pole, 200+ = nadvihnutý prvok
function zaznamenaj(key, hodnoty) {
  const S = novyStav(hodnoty), n = hodnoty.length, kroky = [], c = { p: 0, v: 0 };
  for (const ev of beh(key, S)) {
    const k = POCITANE[ev.t]; if (k) c[k]++;
    const p = new Array(n);
    S.a.forEach((x, i) => { if (x) p[x.id] = i; });
    if (S.aux) S.aux.forEach((x, i) => { if (x) p[x.id] = 100 + i; });
    if (S.held) p[S.held.id] = 200 + S.held.pos;
    kroky.push({
      p, ev: ev.t, cmp: ev.t === 'cmp' ? ev.ids : [], swp: k === 'v' ? ev.ids : [],
      ok: [...S.ok], spec: S.spec ? { id: S.spec.id, lbl: S.spec.lbl } : null,
      range: S.range ? S.range.slice() : null, mid: S.mid, hr: S.hr,
      line: ev.line, txt: textKroku(key, ev, c), c: { p: c.p, v: c.v }, k: c.p + c.v
    });
  }
  over(key, hodnoty, S);
  return kroky;
}

/* ---------- Údaje ---------- */
const VSTUP = { min: 0, max: 99, maxN: 30 };
function generuj(typ, n) {
  const vzost = (x, y) => x - y, M = Math.max(50, 2 * n);   // pri malých poliach čísla 1 – 50
  let v;
  if (typ === 'uspor') v = nahRozne(n, 1, M).sort(vzost);
  else if (typ === 'opacne') v = nahRozne(n, 1, M).sort((x, y) => y - x);
  else if (typ === 'takmer') {
    v = nahRozne(n, 1, M).sort(vzost);
    const k = Math.max(1, Math.round(n / 10));
    for (let r = 0; r < k && n > 1; r++) { const i = randInt(0, n - 2); [v[i], v[i + 1]] = [v[i + 1], v[i]]; }
    if (n > 1 && isSorted(v)) { const i = randInt(0, n - 2); [v[i], v[i + 1]] = [v[i + 1], v[i]]; }
  } else if (typ === 'rovnake') {
    const z = nahRozne(3, 1, M);
    v = Array.from({ length: n }, () => z[randInt(0, 2)]);
  } else v = nahRozne(n, 1, M);
  return v;
}
// kontrola vlastného poľa od žiaka
function overVstup(text) {
  const casti = String(text).split(/[\s,;]+/).filter(Boolean), C = TEXTY.ui.chyby;
  if (!casti.length) return { chyba: C.prazdne };
  if (casti.length > VSTUP.maxN) return { chyba: fmt(C.vela, { max: VSTUP.maxN, n: casti.length }) };
  const h = [];
  for (const c of casti) {
    if (!/^[+-]?\d+$/.test(c)) return { chyba: fmt(C.necele, { x: esc(c.slice(0, 20)) }) };
    const x = parseInt(c, 10);
    if (x < VSTUP.min || x > VSTUP.max) return { chyba: fmt(C.rozsah, { x: esc(c.slice(0, 20)), min: VSTUP.min, max: VSTUP.max }) };
    h.push(x);
  }
  return { hodnoty: h };
}

<script>
'use strict';
/* =====================================================================
   ZOBRAZENIE A OVLÁDANIE
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const U = TEXTY.ui;
let AKT = null;                                   // práve zobrazená karta
function cesta(o, p) { return p.split('.').reduce((x, k) => (x == null ? x : x[k]), o); }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function cislo(x, d) { return x.toFixed(d).replace('.', ','); }
function tisic(x) { return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function fmtPole(v) { return '<span class="arr">' + v.map(x => `<b>${x}</b>`).join('') + '</span>'; }
function interval(r) { return 1400 * Math.pow(0.7, r - 1); }   // ms na jeden krok podľa posuvníka rýchlosti
const FARBY = { bub: '#ff7a6b', vyb: '#6fb4ff', vkl: '#7fdc8f', zl: '#f3b453', qs: '#b9a3ff' };
const NAZOV = k => TEXTY.alg[k].nazov;

/* ---------- Stĺpce (jedno pole na obrazovke) ---------- */
const POLIA = [];
function geometria(o) {
  const maly = window.innerWidth < 600;
  const Hm = o.mini ? 150 : (maly ? 240 : 300), num = 22, zn = 24, lift = o.mini ? 24 : 40;
  const maxBar = Hm - num - zn - lift - 4;
  return { Hm, lift, maxBar, auxH: o.aux ? maxBar + num + zn + 12 : 0, arc: o.mini ? 10 : 20 };
}
class Pole {
  constructor(host, o = {}) {
    this.o = o; this.el = document.createElement('div');
    this.el.className = 'pole' + (o.mini ? ' mini' : '');
    host.appendChild(this.el); this.it = []; this.n = 0; this.posl = null;
    POLIA.push(this);
  }
  nastav(hodnoty) {
    this.n = hodnoty.length; this.max = Math.max(1, ...hodnoty);
    this.el.innerHTML = (this.o.aux ? `<div class="auxPas"><span>${U.pomocne}</span></div>` : '') +
      `<div class="pasmo" hidden></div><div class="delic" hidden></div><div class="hranica" hidden><span>${U.hranica}</span></div>`;
    this.pasmo = $('.pasmo', this.el); this.delic = $('.delic', this.el); this.hran = $('.hranica', this.el); this.auxPas = $('.auxPas', this.el);
    this.it = hodnoty.map(v => {
      const d = document.createElement('div'); d.className = 'st';
      d.innerHTML = '<span class="num"></span><span class="tyc"></span><span class="zn"></span>';
      this.el.appendChild(d);
      return { d, num: d.children[0], tyc: d.children[1], zn: d.children[2], v, cls: '', znak: null, skr: null };
    });
    this.posl = null;
    this.rozmery();
  }
  rozmery() {
    const g = this.g = geometria(this.o), n = this.n || 1;
    this.el.style.height = (g.Hm + g.auxH) + 'px';
    if (!this.o.mini) this.el.style.minWidth = (n * 26 + 4) + 'px';
    if (this.auxPas) this.auxPas.style.height = g.auxH + 'px';
    for (const s of [this.pasmo, this.delic, this.hran]) if (s) s.style.bottom = g.auxH + 'px';
    const w = (100 / n * 0.78) + '%';
    this.it.forEach(it => { it.d.style.width = w; it.d.style.bottom = g.auxH + 'px'; it.skr = null; });
    const sir = this.el.clientWidth;
    this.el.classList.toggle('bezCisel', !!this.o.mini && sir > 0 && sir / n < 24);
    if (this.posl) this.kresli(...this.posl);
  }
  vyska(v) { return Math.max(4, Math.round(v / this.max * this.g.maxBar)); }
  // A = snímka, z ktorej sa ide, B = cieľová snímka, t = 0..1 priebeh pohybu
  kresli(A, B, t) {
    this.posl = [A, B, t];
    if (!this.n || !B) return;
    const n = this.n, slot = 100 / n, g = this.g, e = ease(t);
    const S = B._s || (B._s = { cmp: new Set(B.cmp), swp: new Set(B.swp), ok: new Set(B.ok) });
    const X = c => ((c % 100) + 0.11) * slot;
    const Y = c => (c >= 200 ? -g.lift : c >= 100 ? g.auxH : 0);
    for (let id = 0; id < n; id++) {
      const it = this.it[id], ca = A.p[id], cb = B.p[id];
      const xa = X(ca), xb = X(cb);
      const x = xa + (xb - xa) * e;
      let y = Y(ca) + (Y(cb) - Y(ca)) * e;
      if (B.ev === 'swap' && S.swp.has(id) && xa !== xb) y += (xb > xa ? -1 : 1) * Math.sin(Math.PI * e) * g.arc;   // oblúk pri výmene
      it.d.style.left = x.toFixed(3) + '%';
      it.d.style.transform = 'translateY(' + y.toFixed(1) + 'px)';
      // farba + tvar (pruhy, bodky, rámik) + značka pod stĺpcom
      let f = '', z = '';
      if (S.swp.has(id)) { f = 'f-swp'; z = B.ev === 'shift' ? '→' : B.ev === 'write' ? '↑' : '⇄'; }
      else if (B.spec && B.spec.id === id) { f = 'f-spec'; z = B.spec.lbl; }
      else if (S.cmp.has(id)) { f = 'f-cmp'; z = '?'; }
      else if (S.ok.has(id)) { f = 'f-ok'; z = '✓'; }
      let cls = 'st ' + f;
      if (S.cmp.has(id)) cls += ' r-cmp';
      if (B.range && cb < 200 && ((cb % 100) < B.range[0] || (cb % 100) > B.range[1])) cls += ' dim';
      const skr = !!this.o.skryte && !S.cmp.has(id);
      if (skr) cls += ' skr';
      if (cls !== it.cls) { it.d.className = cls; it.cls = cls; }
      if (z !== it.znak) { it.zn.textContent = z; it.znak = z; }
      if (skr !== it.skr) {
        it.skr = skr; it.num.textContent = skr ? '?' : it.v;
        it.tyc.style.height = (skr ? Math.round(g.maxBar * .45) : this.vyska(it.v)) + 'px';
      }
    }
    this.pasmo.hidden = !B.range;
    if (B.range) { this.pasmo.style.left = (B.range[0] * slot) + '%'; this.pasmo.style.width = ((B.range[1] - B.range[0] + 1) * slot) + '%'; }
    this.delic.hidden = B.mid == null;
    if (B.mid != null) this.delic.style.left = ((B.mid + 1) * slot) + '%';
    this.hran.hidden = B.hr == null;
    if (B.hr != null) this.hran.style.left = (B.hr * slot) + '%';
  }
}
window.addEventListener('resize', () => POLIA.forEach(p => p.rozmery()));

/* ---------- Prehrávač krokov (krok vpred, krok späť, plynulý pohyb) ---------- */
const HRACI = [];
class Hrac {
  constructor(pole, sek, naZmenu) {
    Object.assign(this, { pole, sek, naZmenu: naZmenu || (() => {}), kroky: [], i: 0, od: 0, t: 1, hra: false, acc: 0, rychlost: 4, slucka: null, auto: false, cakaj: 0 });
    HRACI.push(this);
  }
  get akt() { return this.kroky[this.i]; }
  nastavKroky(k) {
    this.kroky = k; this.i = this.od = 0; this.t = 1; this.acc = 0; this.cakaj = 0;
    this.pole.kresli(k[0], k[0], 1); this.naZmenu(this);
  }
  chod(i) {
    i = clamp(i, 0, this.kroky.length - 1);
    if (i === this.i) return;
    this.od = this.i; this.i = i; this.t = 0; this.naZmenu(this);
  }
  prepni() {
    if (this.hra) { this.hra = false; this.auto = false; }
    else {
      if (this.i >= this.kroky.length - 1) { this.i = this.od = 0; this.t = 1; this.pole.kresli(this.kroky[0], this.kroky[0], 1); }
      this.hra = true; this.auto = true; this.acc = interval(this.rychlost);   // prvý krok hneď
    }
    this.naZmenu(this);
  }
  tick(dt) {
    const ms = dt * 1000;
    if (this.hra) {
      this.acc += ms; const iv = interval(this.rychlost);
      while (this.acc >= iv && this.hra) {
        this.acc -= iv;
        if (this.i < this.kroky.length - 1) this.chod(this.i + 1);
        else { this.hra = false; this.cakaj = 0; this.naZmenu(this); }
      }
    } else if (this.slucka && this.auto && this.i >= this.kroky.length - 1) {   // omyly: po skončení začni znova
      this.cakaj += ms;
      if (this.cakaj > 2500) { this.slucka(); this.hra = true; this.acc = 0; this.naZmenu(this); }
    }
    if (this.t < 1) {
      this.t = Math.min(1, this.t + ms / Math.min(450, interval(this.rychlost) * 0.85));
      this.pole.kresli(this.kroky[this.od], this.kroky[this.i], this.t);
    }
  }
}

/* ---------- Ovládanie údajov (typ, počet, nové pole, vlastné pole) ---------- */
function ovladanieUdajov(host, o) {
  let typ = o.typ, n = o.n;
  host.innerHTML = `<h3>${U.udaje}</h3>
    <div class="mini" style="margin-top:0">${U.typUdajov}</div>
    <div class="pills">${Object.keys(TEXTY.data).map(k => `<button data-typ="${k}">${TEXTY.data[k]}</button>`).join('')}</div>
    <label class="sl"><span class="lbl"><span>${U.pocet}</span><b class="nVal"></b></span><input type="range" min="5" max="30" step="1" class="nIn" aria-label="${U.pocet}"></label>
    <div class="volby"><button class="noveBtn">${U.noveNahodne}</button></div>
    <div class="vlastne"><label>${U.vlastne}</label>
      <div class="vlRiadok"><input type="text" inputmode="text" autocomplete="off" placeholder="${U.vlastnePlaceholder}" aria-label="Vlastné pole"><button class="vlBtn">${U.pouzit}</button></div>
      <p class="hlaska" aria-live="polite"></p></div>`;
  const nIn = $('.nIn', host), nVal = $('.nVal', host), hl = $('.hlaska', host), vin = $('.vlRiadok input', host);
  const obnov = dlzka => {
    $$('[data-typ]', host).forEach(b => b.classList.toggle('on', b.dataset.typ === typ));
    nIn.value = clamp(dlzka, 5, 30); nVal.textContent = dlzka;
  };
  const nove = () => { if (!typ) typ = 'nahodne'; hl.textContent = ''; hl.classList.remove('chyba'); const h = generuj(typ, n); obnov(n); o.naZmenu(h); };
  $$('[data-typ]', host).forEach(b => { b.onclick = () => { typ = b.dataset.typ; nove(); }; });
  nIn.oninput = () => { n = +nIn.value; nove(); };
  $('.noveBtn', host).onclick = nove;
  const vlastne = () => {
    const r = overVstup(vin.value);
    if (r.chyba) { hl.innerHTML = r.chyba; hl.classList.add('chyba'); return; }
    typ = null; hl.classList.remove('chyba'); hl.textContent = fmt(U.vlastneOk, { n: sklon(r.hodnoty.length, 'prvok') });
    obnov(r.hodnoty.length); o.naZmenu(r.hodnoty);
  };
  $('.vlBtn', host).onclick = vlastne;
  vin.addEventListener('keydown', ev => { if (ev.key === 'Enter') vlastne(); });
  obnov(o.start ? o.start.length : n);
  if (o.start) o.naZmenu(o.start.slice()); else nove();
}

function legendaHTML(zoz) {
  const SW = {
    cmp: ['f-cmp r-cmp', '?'], swp: ['f-swp', '⇄'], posun: ['f-swp', '→'], presun: ['f-swp', '↑'], ok: ['f-ok', '✓'], okCast: ['f-ok', '✓'],
    min: ['f-spec', 'min'], pivot: ['f-spec', 'P'], vloz: ['f-spec', 'V'], dim: ['dim', '']
  };
  return zoz.map(k => {
    let sw;
    if (SW[k]) sw = `<span class="sw ${SW[k][0]}"><span class="tyc"></span><b>${SW[k][1]}</b></span>`;
    else sw = `<span class="${{ pasmo: 'swP', delic: 'swD', hranica: 'swH', pomocne: 'swA' }[k]}"></span>`;
    return `<span class="leg">${sw}<span>${TEXTY.legenda[k]}</span></span>`;
  }).join('');
}

/* =====================================================================
   KARTY ALGORITMOV – rovnaké rozloženie a ovládanie pre všetkých päť
   ===================================================================== */
let START;   // spoločné počiatočné pole, aby sa algoritmy dali porovnať
function initAlg(key) {
  const A = TEXTY.alg[key], druh = ALG[key].druh;
  const sek = document.createElement('section');
  sek.id = key; sek.className = 'sek'; sek.dataset.karta = ''; sek.hidden = true;
  sek.innerHTML = `
  <div class="stlpec">
    <div class="card">
      <div class="algHlava"><h2>${A.nazov} <span class="en">(${A.en})</span></h2>${A.doplnkova ? `<span class="stitok">${U.doplnkova}</span>` : ''}</div>
      <div class="stage"></div>
      <div class="krokNum"></div>
      <div class="krokText" aria-live="polite"></div>
      <div class="pocitadla">
        <div class="poc"><span>${U.porovnania}</span><b data-c="p">0</b></div>
        <div class="poc"><span>${TEXTY.druhyNazov[druh]}</span><b data-c="v">0</b></div>
        <div class="poc"><span>${U.kroky}</span><b data-c="k">0</b><small>${fmt(U.krokyPozn, { druh: TEXTY.druhyMale[druh] })}</small></div>
      </div>
      <div class="tlac">
        <button data-a="spat">${U.krokSpat}</button>
        <button data-a="hraj" class="primary">${U.spustit}</button>
        <button data-a="vpred">${U.krokVpred}</button>
        <button data-a="reset">${U.reset}</button>
      </div>
      <label class="sl"><span class="lbl"><span>${U.rychlost}</span><b data-v="r"></b></span><input type="range" min="1" max="10" step="1" data-i="r" aria-label="${U.rychlost}"></label>
    </div>
    <div class="card"><h3>${U.legenda}</h3><div class="legenda">${legendaHTML(A.legenda)}</div></div>
  </div>
  <div class="stlpec panel">
    <div class="card"><p>${A.popis}</p><h3>${U.pseudokod}</h3><ol class="kod">${A.kod.map(r => `<li>${esc(r)}</li>`).join('')}</ol><p class="mini">${U.pseudoPozn}</p></div>
    <div class="card udaje"></div>
  </div>`;
  $('#algKarty').appendChild(sek);
  const pole = new Pole($('.stage', sek), { aux: key === 'zl' });
  const kod = $$('.kod li', sek), txt = $('.krokText', sek), num = $('.krokNum', sek);
  const poc = { p: $('[data-c=p]', sek), v: $('[data-c=v]', sek), k: $('[data-c=k]', sek) };
  const b = a => $(`[data-a=${a}]`, sek);
  const hrac = new Hrac(pole, key, h => {

const HRA = { karty: [], vyb: [], p: 0, v: 0, koniec: false, log: [], vysl: null, anim: null, start: [] };
const TH = TEXTY.hra;
function novaHra() {

    const el = document.createElement('button'); el.className = 'hk';
    el.innerHTML = `<span class="poz"></span><span class="pism">${'ABCDEFGH'[i]}</span><span class="hod">?</span><span class="znak"></span>`;
    const k = { v: x, pism: 'ABCDEFGH'[i], el };
    el.onclick = () => hraKlik(k);
    el.setAttribute('aria-label', 'Karta ' + k.pism);

  });

  $('#hra_karty').replaceChildren(...HRA.karty.map(k => k.el));

}
function hraKlik(k) {

  else if (HRA.vyb.length !== 1) { HRA.vyb = [k]; HRA.vysl = null; $('#hra_stav').innerHTML = fmt(TH.vyber1, { a: `<b>${k.pism}</b>` }); }
  else {
    const a = HRA.vyb[0], b = k; HRA.vyb.push(k); HRA.p++;
    const men = a.v < b.v ? a : b, vac = men === a ? b : a;
    HRA.vysl = { men, vac };

  }

}
function hraVymen() {
  if (HRA.vyb.length !== 2 || HRA.koniec || HRA.anim) return;
  const [x, y] = HRA.vyb, K = HRA.karty, ix = K.indexOf(x), iy = K.indexOf(y);
  const r1 = x.el.getBoundingClientRect(), r2 = y.el.getBoundingClientRect();
  K[ix] = y; K[iy] = x; HRA.v++;
  $('#hra_karty').replaceChildren(...K.map(k => k.el));
  const n1 = x.el.getBoundingClientRect(), n2 = y.el.getBoundingClientRect();
  HRA.anim = { t: 0, it: [{ el: x.el, dx: r1.left - n1.left, dy: r1.top - n1.top, s: -1 }, { el: y.el, dx: r2.left - n2.left, dy: r2.top - n2.top, s: 1 }] };
  $('#hra_stav').innerHTML = fmt(TH.vymenene, { a: `<b>${x.pism}</b>`, b: `<b>${y.pism}</b>` });

}
function tickHra(dt) {   // plynulá výmena kariet (requestAnimationFrame)
  const A = HRA.anim; if (!A) return;
  A.t = Math.min(1, A.t + dt / 0.5); const e = ease(A.t);

function hraRender() {

/* =====================================================================
   7. SÚŤAŽ ALGORITMOV – počíta sa podľa krokov, nie podľa času

const SUT = { t: 0, max: 0, hra: false, acc: 0, rychlost: 6, drahy: [], hodnoty: [] };
const TS = TEXTY.sutaz;
function initSutaz() {
  const host = $('#sut_drahy');
  SUT.drahy = PORADIE.map(key => {
    const c = document.createElement('div'); c.className = 'card draha';
    c.innerHTML = `<div class="drHlava"><h3><span class="farba" style="background:${FARBY[key]}"></span>${NAZOV(key)}</h3><span class="miesto"></span></div><div class="stage"></div><div class="drPoc"></div>`;
    host.appendChild(c);
    return { key, el: c, pole: new Pole($('.stage', c), { mini: true, aux: key === 'zl' }), kroky: [], idx: [], total: 0, i: 0, od: 0, t: 1 };
  });
  $('#sut_spat').innerHTML = U.krokSpat; $('#sut_vpred').innerHTML = U.krokVpred; $('#sut_reset').innerHTML = U.reset;
  $('#sut_hraj').onclick = () => {
    if (SUT.hra) SUT.hra = false;
    else { if (SUT.t >= SUT.max) nastavSutT(0); SUT.hra = true; SUT.acc = interval(SUT.rychlost); }
    obnovSut();
  };
  $('#sut_vpred').onclick = () => { SUT.hra = false; nastavSutT(SUT.t + 1); };
  $('#sut_spat').onclick = () => { SUT.hra = false; nastavSutT(SUT.t - 1); };
  $('#sut_reset').onclick = () => { SUT.hra = false; nastavSutT(0); };
  const r = $('#sut_r'); r.value = SUT.rychlost; $('#sut_rv').textContent = SUT.rychlost;
  r.oninput = () => { SUT.rychlost = +r.value; $('#sut_rv').textContent = r.value; };
  $('#sut_prepocitat').onclick = () => prehladTypov(SUT.hodnoty.length, SUT.typ);
  ovladanieUdajov($('#sut_udaje'), { typ: 'nahodne', n: 12, naZmenu: h => nacitajSutaz(h) });
}
function nacitajSutaz(h) {
  SUT.hodnoty = h.slice(); SUT.hra = false; SUT.t = 0;
  const akt = $('#sut_udaje .pills .on'); SUT.typ = akt ? akt.dataset.typ : null;
  for (const d of SUT.drahy) {
    d.kroky = zaznamenaj(d.key, h); d.total = d.kroky[d.kroky.length - 1].k;
    d.idx = new Array(d.total + 1);
    d.kroky.forEach((s, i) => { d.idx[s.k] = i; });     // pre každý krok súťaže posledná snímka s týmto počtom krokov
    d.pole.nastav(h); d.i = d.od = d.idx[0]; d.t = 1;
    d.pole.kresli(d.kroky[d.i], d.kroky[d.i], 1);
  }
  SUT.max = Math.max(...SUT.drahy.map(d => d.total));
  obnovSut();
  prehladTypov(h.length, SUT.typ);
}
function nastavSutT(t) {
  SUT.t = clamp(t, 0, SUT.max);
  for (const d of SUT.drahy) {
    const ni = d.idx[Math.min(SUT.t, d.total)];
    if (ni !== d.i) { d.od = d.i; d.i = ni; d.t = 0; }
  }
  if (SUT.t >= SUT.max) SUT.hra = false;
  obnovSut();
}
function tickSut(dt) {
  if (SUT.hra) {
    SUT.acc += dt * 1000; const iv = interval(SUT.rychlost); let k = 0;
    while (SUT.acc >= iv) { SUT.acc -= iv; k++; }
    if (k) nastavSutT(SUT.t + k);
  }
  for (const d of SUT.drahy) if (d.t < 1) {
    d.t = Math.min(1, d.t + dt * 1000 / Math.min(400, interval(SUT.rychlost) * 0.85));
    d.pole.kresli(d.kroky[d.od], d.kroky[d.i], d.t);
  }
}
function miesta() {   // poradie podľa počtu krokov (rovnaký počet = rovnaké miesto)
  const m = {};
  for (const d of SUT.drahy) m[d.key] = 1 + SUT.drahy.filter(e => e.total < d.total).length;
  return m;
}
function obnovSut() {
  const m = miesta();
  for (const d of SUT.drahy) {

    $('.drPoc', d.el).innerHTML = `${U.porovnania}: <b>${s.c.p}</b> · ${TEXTY.druhyNazov[ALG[d.key].druh]}: <b>${s.c.v}</b> · ${U.kroky}: <b>${s.k}</b>`;
    $('.miesto', d.el).textContent = hotova ? fmt(TS.miesto, { m: m[d.key] }) : TS.bezi;

    const zor = SUT.drahy.slice().sort((a, b) => a.total - b.total);
    V.innerHTML = `<h2>${TS.vysledky}</h2><div class="tabWrap"><table class="tab"><tr>${TS.tab.map(t => `<th>${t}</th>`).join('')}</tr>
      ${zor.map(d => { const c = d.kroky[d.kroky.length - 1].c; return `<tr><td>${m[d.key]}.</td><td><span class="farba" style="background:${FARBY[d.key]}"></span>${NAZOV(d.key)}</td><td>${c.p}</td><td>${sklon(c.v, ALG[d.key].druh)}</td><td><b>${d.total}</b></td></tr>`; }).join('')}
      </table></div>`;

// priemerné kroky pre všetky typy údajov – ukáže, že poradie sa mení podľa údajov
function prehladTypov(n, aktTyp) {
  const POK = 20, riadky = [];
  for (const typ of Object.keys(TEXTY.data)) {
    const sum = {}; PORADIE.forEach(k => { sum[k] = 0; });
    for (let r = 0; r < POK; r++) { const v = generuj(typ, n); PORADIE.forEach(k => { sum[k] += spocitaj(k, v).k; }); }
    riadky.push({ typ, avg: PORADIE.map(k => sum[k] / POK) });
  }
  $('#sut_typyUvod').innerHTML = fmt(TS.typyUvod, { n });
  $('#sut_typy').innerHTML = `<table class="tab"><tr><th>${U.udaje}</th>${PORADIE.map(k => `<th><span class="farba" style="background:${FARBY[k]}"></span>${TEXTY.alg[k].kratko}</th>`).join('')}</tr>
    ${riadky.map(r => { const mn = Math.min(...r.avg.map(Math.round)); return `<tr class="${r.typ === aktTyp ? 'akt' : ''}"><td>${TEXTY.data[r.typ]}</td>${r.avg.map(a => Math.round(a) === mn ? `<td class="vit">★ ${Math.round(a)}</td>` : `<td>${Math.round(a)}</td>`).join('')}</tr>`; }).join('')}</table>`;
  $('#sut_vitazi').innerHTML = '<ul>' + riadky.map(r => {
    const mn = Math.min(...r.avg.map(Math.round));
    const v = PORADIE.filter((k, i) => Math.round(r.avg[i]) === mn).map(k => `<b>${NAZOV(k).toLowerCase()}</b>`);
    return `<li>${fmt(v.length > 1 ? TS.vitazViac : TS.vitaz, { typ: TEXTY.data[r.typ], alg: v.join(' a ') })}</li>`;
  }).join('') + '</ul>';

/* =====================================================================
   8. AKO RASTIE POČET KROKOV – graf bez animácie algoritmov
   ===================================================================== */
const VELKOSTI = [5, 10, 15, 20, 25, 30];
const TVARY = { bub: 'kruh', vyb: 'stvorec', vkl: 'trojuh', zl: 'koso', qs: 'krizik' };
const CIARY = { bub: '', vyb: '9 5', vkl: '2 5', zl: '14 6', qs: '10 4 2 4' };
const GRAF = { miera: 'p', typ: 'nahodne', data: null, anim: 1, pomer100: null, hotovo: false };
const TG = TEXTY.graf;
function znacka(tvar, x, y, f) {
  const s = `fill="${f}" stroke="#08101c" stroke-width="1.5"`;
  if (tvar === 'kruh') return `<circle cx="${x}" cy="${y}" r="6.5" ${s}/>`;
  if (tvar === 'stvorec') return `<rect x="${x - 6}" y="${y - 6}" width="12" height="12" ${s}/>`;
  if (tvar === 'trojuh') return `<path d="M${x} ${y - 8}L${x + 7.5} ${y + 6}L${x - 7.5} ${y + 6}Z" ${s}/>`;
  if (tvar === 'koso') return `<path d="M${x} ${y - 8}L${x + 8} ${y}L${x} ${y + 8}L${x - 8} ${y}Z" ${s}/>`;
  return `<path d="M${x - 6} ${y - 6}L${x + 6} ${y + 6}M${x + 6} ${y - 6}L${x - 6} ${y + 6}" stroke="${f}" stroke-width="4" stroke-linecap="round"/>`;
}
function vypocitajGraf() {
  const POK = 20, d = {};
  PORADIE.forEach(k => { d[k] = { p: [], k: [] }; });
  for (const n of VELKOSTI) {
    const s = {}; PORADIE.forEach(k => { s[k] = { p: 0, k: 0 }; });
    for (let r = 0; r < POK; r++) {
      const v = generuj(GRAF.typ, n);
      PORADIE.forEach(k => { const c = spocitaj(k, v); s[k].p += c.p; s[k].k += c.k; });
    }
    PORADIE.forEach(k => { d[k].p.push(s[k].p / POK); d[k].k.push(s[k].k / POK); });
  }
  GRAF.data = d;
  // pomer pri väčších poliach (100 → 200), priemer z 5 polí
  const pom = {};
  for (const k of PORADIE) {
    let a = 0, b = 0;
    for (let r = 0; r < 5; r++) { a += spocitaj(k, generuj(GRAF.typ, 100)).p; b += spocitaj(k, generuj(GRAF.typ, 200)).p; }
    pom[k] = b / a;
  }
  GRAF.pomer100 = pom;
}
function kresliGraf() {
  const W = 720, H = 440, L = 78, R = 24, T = 20, B = 64, d = GRAF.data, m = GRAF.miera;
  let mx = 0; PORADIE.forEach(k => d[k][m].forEach(v => { mx = Math.max(mx, v); }));
  const krok = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(s => mx / s <= 6) || 1000;
  const maxY = Math.max(krok, Math.ceil(mx / krok) * krok);
  const sx = i => L + (VELKOSTI[i] - 5) / 25 * (W - L - R), sy = v => H - B - v / maxY * (H - T - B);
  let s = `<defs><clipPath id="grafClip"><rect id="grafClipR" x="0" y="0" width="0" height="${H}"/></clipPath></defs>`;
  for (let v = 0; v <= maxY; v += krok) s += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="rgba(140,160,215,.18)"/><text x="${L - 10}" y="${sy(v) + 6}" fill="#a3adc6" font-size="16" text-anchor="end">${v}</text>`;
  VELKOSTI.forEach((n, i) => { s += `<line x1="${sx(i)}" x2="${sx(i)}" y1="${H - B}" y2="${H - B + 6}" stroke="#a3adc6"/><text x="${sx(i)}" y="${H - B + 26}" fill="#e2e8f5" font-size="17" text-anchor="middle">${n}</text>`; });
  s += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="#a3adc6" stroke-width="1.5"/><line x1="${L}" x2="${L}" y1="${T}" y2="${H - B}" stroke="#a3adc6" stroke-width="1.5"/>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 10}" fill="#a3adc6" font-size="16" text-anchor="middle">${TG.osX}</text>`;
  s += `<text transform="translate(18 ${(T + H - B) / 2}) rotate(-90)" fill="#a3adc6" font-size="16" text-anchor="middle">${TG.osY[m]}</text>`;
  s += '<g clip-path="url(#grafClip)">';
  PORADIE.forEach(k => {
    const body = d[k][m].map((v, i) => `${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(' ');
    s += `<polyline points="${body}" fill="none" stroke="${FARBY[k]}" stroke-width="3.5" stroke-linejoin="round" ${CIARY[k] ? `stroke-dasharray="${CIARY[k]}"` : ''}/>`;
    d[k][m].forEach((v, i) => { s += znacka(TVARY[k], sx(i), sy(v), FARBY[k]); });
  });
  s += '</g>';
  $('#graf_svg').innerHTML = s;
  $('#graf_svg').setAttribute('aria-label', TG.osY[m] + ' podľa počtu prvkov');
  GRAF.anim = 0;
  // tabuľka hodnôt
  $('#graf_tab').innerHTML = `<table class="tab"><tr><th></th>${VELKOSTI.map(n => `<th>${n}</th>`).join('')}</tr>
    ${PORADIE.map(k => `<tr><td><span class="farba" style="background:${FARBY[k]}"></span>${TEXTY.alg[k].kratko}</td>${d[k][m].map(v => `<td>${cislo(v, 1)}</td>`).join('')}</tr>`).join('')}</table>`;
  // pomery pri zdvojnásobení (vždy porovnania)
  const r = (k, a, b) => d[k].p[VELKOSTI.indexOf(b)] / d[k].p[VELKOSTI.indexOf(a)];
  $('#graf_pomer').innerHTML = `<table class="tab"><tr>${TG.pomerHlav.map(h => `<th>${h}</th>`).join('')}</tr>
    ${PORADIE.map(k => `<tr><td>${TEXTY.alg[k].kratko}</td><td>×${cislo(r(k, 5, 10), 1)}</td><td>×${cislo(r(k, 10, 20), 1)}</td><td>×${cislo(r(k, 15, 30), 1)}</td><td>×${cislo(GRAF.pomer100[k], 1)}</td></tr>`).join('')}</table>`;
  const iny = $('#graf_inyTyp');
  iny.hidden = GRAF.typ === 'nahodne'; iny.innerHTML = fmt(TG.inyTyp, { typ: TEXTY.data[GRAF.typ] });
}
function tickGraf(dt) {
  if (GRAF.anim >= 1) return;
  GRAF.anim = Math.min(1, GRAF.anim + dt / 1.4);
  const r = $('#grafClipR'); if (r) r.setAttribute('width', (720 * ease(GRAF.anim)).toFixed(1));
}
function prepocitajGraf() { vypocitajGraf(); kresliGraf(); }
function initGraf() {
  $('#graf_miera').innerHTML = `<button data-m="p">${TG.mP}</button><button data-m="k">${TG.mK}</button>`;
  $('#graf_typ').innerHTML = Object.keys(TEXTY.data).map(k => `<button data-typ="${k}">${TEXTY.data[k]}</button>`).join('');
  const obnov = () => {
    $$('#graf_miera button').forEach(b => b.classList.toggle('on', b.dataset.m === GRAF.miera));
    $$('#graf_typ button').forEach(b => b.classList.toggle('on', b.dataset.typ === GRAF.typ));
  };
  $$('#graf_miera button').forEach(b => { b.onclick = () => { GRAF.miera = b.dataset.m; obnov(); kresliGraf(); }; });
  $$('#graf_typ button').forEach(b => { b.onclick = () => { GRAF.typ = b.dataset.typ; obnov(); prepocitajGraf(); }; });
  $('#graf_prepocitat').onclick = prepocitajGraf;
  $('#graf_leg').innerHTML = PORADIE.map(k => `<span><svg width="44" height="20" aria-hidden="true"><line x1="2" x2="42" y1="10" y2="10" stroke="${FARBY[k]}" stroke-width="3.5" ${CIARY[k] ? `stroke-dasharray="${CIARY[k]}"` : ''}/>${znacka(TVARY[k], 22, 10, FARBY[k])}</svg>${NAZOV(k)}</span>`).join('');
  obnov();
}

/* =====================================================================
   9. ČASTÉ OMYLY
   ===================================================================== */
const OM = { o2: null, o2t: 1, o4hotovo: false };
const TO = TEXTY.omyly;
function omylHrac(stageId, key, gen, opt, naZmenu, btnHraj, btnZnova) {
  const pole = new Pole($(stageId), Object.assign({ mini: true }, opt));
  const h = new Hrac(pole, 'omyly', hh => { naZmenu(hh); $(btnHraj).innerHTML = hh.auto ? TO.pauza : TO.hraj; });
  h.rychlost = 4;
  h.slucka = () => { const v = gen(); pole.nastav(v); h.nastavKroky(zaznamenaj(key, v)); };
  h.slucka(); h.hra = true; h.auto = true; h.naZmenu(h);
  $(btnHraj).onclick = () => h.prepni();
  $(btnZnova).innerHTML = TO.znova;
  $(btnZnova).onclick = () => { h.slucka(); h.hra = true; h.auto = true; h.acc = 0; h.naZmenu(h); };
  return h;
}
function initOmyly() {
  omylHrac('#om1_stage', 'vyb', () => generuj('nahodne', 6), { skryte: true }, h => { $('#om1_txt').innerHTML = h.akt.txt; }, '#om1_hraj', '#om1_znova');
  omylHrac('#om3_stage', 'vyb', () => generuj('uspor', 8), {}, h => {
    const s = h.akt; $('#om3_txt').innerHTML = s.txt; $('#om3_p').textContent = s.c.p; $('#om3_v').textContent = s.c.v;
  }, '#om3_hraj', '#om3_znova');
  omylHrac('#om4_stage', 'bub', () => generuj('nahodne', 6), {}, h => { $('#om4_txt').innerHTML = h.akt.txt; }, '#om4_hraj', '#om4_znova');
  $('#om2_znova').innerHTML = TO.znova;
  $('#om2_znova').onclick = () => { pripravOm2(); };
}
// omyl 2: priemerné kroky vkladania, rýchleho, zlučovania a bublinového pri dvoch typoch údajov
function pripravOm2() {
  const algs = ['vkl', 'qs', 'zl', 'bub'], skup = ['takmer', 'nahodne'], N = 20, POK = 20, d = {};
  for (const t of skup) {
    d[t] = {}; algs.forEach(k => { d[t][k] = 0; });
    for (let r = 0; r < POK; r++) { const v = generuj(t, N); algs.forEach(k => { d[t][k] += spocitaj(k, v).k / POK; }); }
  }
  const mx = Math.max(...skup.flatMap(t => algs.map(k => d[t][k])));
  $('#om2_graf').innerHTML = skup.map(t => `<h4>${TO.o2.skup[t]}</h4>` + algs.map(k =>
    `<div class="sgRiadok"><span>${TEXTY.alg[k].kratko}</span><span class="sgPas"><i data-w="${(d[t][k] / mx * 100).toFixed(1)}" style="background:${FARBY[k]}"></i></span><b>${Math.round(d[t][k])}</b></div>`).join('')).join('');
  OM.o2t = 0;
}
function tickOm2(dt) {
  if (OM.o2t >= 1) return;
  OM.o2t = Math.min(1, OM.o2t + dt / 1.3); const e = ease(OM.o2t);
  $$('#om2_graf i').forEach(i => { i.style.width = (+i.dataset.w * e) + '%'; });
}
function omylyPrvyRaz() {
  if (!OM.o2) { OM.o2 = true; pripravOm2(); }
  if (!OM.o4hotovo) {
    OM.o4hotovo = true;
    $('#om4_100').textContent = TO.o4.pocitam; $('#om4_1000').textContent = '';
    setTimeout(() => {   // výpočet bez animácie, tou istou implementáciou
      for (const [n, id] of [[100, '#om4_100'], [1000, '#om4_1000']]) {
        const v = Array.from({ length: n }, () => randInt(1, 10000));
        $(id).innerHTML = fmt(TO.o4.vypocet, { n: tisic(n), b: tisic(spocitaj('bub', v).p), z: tisic(spocitaj('zl', v).p) });
      }
    }, 60);
  }
}

/* =====================================================================
   10. KVÍZ – odpovede vždy počíta tá istá implementácia algoritmov
   ===================================================================== */
const TK = TEXTY.kviz, Q = TK.q;
function stavy(key, v, test) { const out = []; spocitaj(key, v, (ev, S) => { if (test(ev)) out.push(S.a.map(x => x.v)); }); return out; }
function moznostiPoli(spravne, ine) {
  const kl = x => x.join(','), seen = new Set([kl(spravne)]), opt = [spravne];
  for (const x of ine) if (x && !seen.has(kl(x)) && opt.length < 4) { seen.add(kl(x)); opt.push(x); }
  for (let pokus = 0; opt.length < 4 && pokus < 300; pokus++) {
    const x = spravne.slice(), i = randInt(0, x.length - 2); [x[i], x[i + 1]] = [x[i + 1], x[i]];
    if (pokus > 100) { const j = randInt(0, x.length - 1); [x[0], x[j]] = [x[j], x[0]]; }
    if (!seen.has(kl(x))) { seen.add(kl(x)); opt.push(x); }
  }
  const z = zamiesaj(opt);
  return { moznosti: z.map(fmtPole), spravna: z.indexOf(spravne), spravnaText: fmtPole(spravne) };
}
function moznostiCisel(c, kand) {
  const s = [c];
  for (const x of kand) if (x >= 0 && !s.includes(x) && s.length < 4) s.push(x);
  for (let d = 1; s.length < 4; d++) { if (!s.includes(c + d)) s.push(c + d); }
  const z = zamiesaj(s);
  return { moznosti: z.map(String), spravna: z.indexOf(c), spravnaText: String(c) };
}
function moznostiAlg(keys, hodn) {    // hodn[k] – počet; správny je jediný najmenší
  const mn = Math.min(...keys.map(k => hodn[k]));
  if (keys.filter(k => hodn[k] === mn).length !== 1) return null;
  const z = zamiesaj(keys), vit = keys.find(k => hodn[k] === mn);
  return { moznosti: z.map(NAZOV), spravna: z.indexOf(vit), spravnaText: NAZOV(vit), vit };
}
const OTAZKY = {
  bubKolo() {
    for (let p = 0; p < 300; p++) {
      const k = randInt(1, 2), v = nahRozne(6, 1, 30), st = stavy('bub', v, ev => ev.t === 'koloKoniec');
      if (st.length < k || isSorted(st[k - 1])) continue;
      const m = moznostiPoli(st[k - 1], [st[k], k > 1 ? st[k - 2] : v, v.slice().sort((a, b) => a - b)]);
      return Object.assign(m, { q: fmt(Q.bubKolo.q, { pole: fmtPole(v), k }), vysv: fmt(Q.bubKolo.vysv, { postup: st.slice(0, k).map((s, i) => fmt(TK.poKole, { k: i + 1, pole: fmtPole(s) })).join(', ') }) });
    }
    return null;
  },
  vybKolo() {
    for (let p = 0; p < 300; p++) {
      const k = randInt(1, 2), v = nahRozne(6, 1, 30), st = stavy('vyb', v, ev => ev.t === 'naMieste');
      if (st.length < k || isSorted(st[k - 1]) || st[k - 1].join() === v.join()) continue;
      const m = moznostiPoli(st[k - 1], [st[k], k > 1 ? st[k - 2] : v, v.slice().sort((a, b) => a - b)]);
      return Object.assign(m, { q: fmt(Q.vybKolo.q, { pole: fmtPole(v), k }), vysv: fmt(Q.vybKolo.vysv, { postup: st.slice(0, k).map((s, i) => fmt(TK.poKole, { k: i + 1, pole: fmtPole(s) })).join(', ') }) });
    }
    return null;
  },
  najmenejVymen() {
    for (let p = 0; p < 300; p++) {
      const v = nahRozne(6, 1, 30), keys = ['bub', 'vyb', 'qs'], c = {};
      keys.forEach(k => { c[k] = spocitaj(k, v).v; });
      const m = moznostiAlg(keys, c); if (!m) continue;
      return Object.assign(m, { q: fmt(Q.najmenejVymen.q, { pole: fmtPole(v) }), vysv: fmt(Q.najmenejVymen.vysv, { zoznam: keys.map(k => `${TEXTY.alg[k].kratko}: ${sklon(c[k], 'swap')}`).join(', ') }) + (m.vit === 'vyb' ? Q.najmenejVymen.vyb : '') });
    }
    return null;
  },
  najmenejPorovnani() {
    for (let p = 0; p < 300; p++) {
      const v = generuj('takmer', 8), keys = ['bub', 'vyb', 'vkl'], c = {};
      keys.forEach(k => { c[k] = spocitaj(k, v).p; });
      const m = moznostiAlg(keys, c); if (!m) continue;
      return Object.assign(m, { q: fmt(Q.najmenejPorovnani.q, { pole: fmtPole(v) }), vysv: fmt(Q.najmenejPorovnani.vysv, { zoznam: keys.map(k => `${TEXTY.alg[k].kratko}: ${sklon(c[k], 'p')}`).join(', ') }) + (m.vit === 'vkl' ? Q.najmenejPorovnani.vkl : '') });
    }
    return null;
  },
  poradie() {
    for (let p = 0; p < 300; p++) {
      const key = ['bub', 'vyb', 'vkl'][randInt(0, 2)], v = nahRozne(4, 1, 20), ak = [], typy = [];
      spocitaj(key, v, ev => { if (POCITANE[ev.t] && ak.length < 4) { ak.push(fmt(TK.akcie[ev.t], ev.p)); typy.push(ev.t); } });
      if (ak.length < 4 || new Set(ak).size < 4 || typy.every(t => t === 'cmp')) continue;
      const por = zamiesaj([0, 1, 2, 3]); if (por.join() === '0,1,2,3') continue;
      return { poradie: por, kroky: por.map(i => ak[i]), q: fmt(Q.poradie.q, { pole: fmtPole(v), alg: TEXTY.alg[key].siedmy }), vysv: fmt(Q.poradie.vysv, { zoznam: ak.map((t, i) => `${i + 1}. ${t}`).join('<br>') }) };
    }
    return null;
  },
  vybPorovnania() {
    const n = randInt(5, 8), v = nahRozne(n, 1, 30), c = spocitaj('vyb', v).p;
    const m = moznostiCisel(c, [n - 1, n * (n - 1), n * n, c - n + 1]);
    return Object.assign(m, { q: fmt(Q.vybPorovnania.q, { pole: fmtPole(v) }), vysv: fmt(Q.vybPorovnania.vysv, { n1: n - 1, n, c, sucet: Array.from({ length: n - 1 }, (_, i) => n - 1 - i).join(' + ') }) });
  },
  bubVymeny() {
    for (let p = 0; p < 300; p++) {
      const v = nahRozne(5, 1, 20), c = spocitaj('bub', v).v; if (c < 2) continue;
      const m = moznostiCisel(c, zamiesaj([c + 1, c - 1, c + 2, c - 2]));
      return Object.assign(m, { q: fmt(Q.bubVymeny.q, { pole: fmtPole(v) }), vysv: fmt(Q.bubVymeny.vysv, { c: sklon(c, 'swap') }) });
    }
    return null;
  },
  vklPosuny() {
    for (let p = 0; p < 300; p++) {
      const v = nahRozne(5, 1, 20), c = spocitaj('vkl', v).v; if (c < 2) continue;
      const m = moznostiCisel(c, zamiesaj([c + 1, c - 1, c + 2, c - 2]));
      return Object.assign(m, { q: fmt(Q.vklPosuny.q, { pole: fmtPole(v) }), vysv: fmt(Q.vklPosuny.vysv, { c: sklon(c, 'shift') }) });
    }
    return null;
  },
  qsDelenie() {
    for (let p = 0; p < 300; p++) {
      const v = nahRozne(6, 1, 30), pv = v[5];
      if (pv === Math.min(...v) || pv === Math.max(...v)) continue;
      const st = stavy('qs', v, ev => ev.t === 'naMieste')[0];
      const stab = [...v.filter(x => x < pv), pv, ...v.filter(x => x > pv)];
      const m = moznostiPoli(st, [stab, v.slice().sort((a, b) => a - b), [pv, ...v.slice(0, 5)]]);
      return Object.assign(m, { q: fmt(Q.qsDelenie.q, { pole: fmtPole(v), p: pv }), vysv: fmt(Q.qsDelenie.vysv, { p: pv, vysl: fmtPole(st) }) });
    }
    return null;
  },
  bubKola() {
    const n = 6, v = Math.random() < .5 ? generuj('takmer', n) : nahRozne(n, 1, 30);
    let c = 0, bez = false;
    spocitaj('bub', v, ev => { if (ev.t === 'kolo') c++; if (ev.t === 'ziadna') bez = true; });
    const m = moznostiCisel(c, zamiesaj([c - 1, c + 1, n - 1, n]));
    return Object.assign(m, { q: fmt(Q.bubKola.q, { pole: fmtPole(v) }), vysv: fmt(Q.bubKola.vysv, { c: sklon(c, 'kolo') }) + (bez ? Q.bubKola.bezVymeny : fmt(Q.bubKola.vsetky, { n, m: n - 1 })) });
  }
};
const KV = { n: 0, b: 0, zodp: 0 };
function novyKviz() {
  const povinne = ['bubKolo', 'najmenejVymen', 'poradie'];
  const ostatne = zamiesaj(Object.keys(OTAZKY).filter(k => !povinne.includes(k)));
  const otazky = [];
  for (const k of povinne.concat(ostatne)) { if (otazky.length >= 8) break; const o = OTAZKY[k](); if (o) otazky.push(o); }
  const host = $('#kvizOtazky'); host.innerHTML = '';
  Object.assign(KV, { n: otazky.length, b: 0, zodp: 0 });
  zamiesaj(otazky).forEach((o, i) => host.appendChild(o.poradie ? otazkaPoradie(o, i) : otazkaVyber(o, i)));
  skoreKviz();
}
function skoreKviz() {
  let s = fmt(TK.skore, { b: KV.b, n: KV.n });
  if (KV.zodp === KV.n) s += KV.b >= KV.n - 1 ? TK.koniecDobre : TK.koniecSlabo;
  $('#kvizVysl').innerHTML = s;
}
function odpovedane(d, ok, o) {
  KV.zodp++; if (ok) KV.b++;
  const fb = $('.fb', d); fb.hidden = false; fb.className = 'fb ' + (ok ? 'ok' : 'zle');
  fb.innerHTML = `<b>${ok ? TK.spravne : TK.nespravne}</b> ${ok || o.poradie ? '' : fmt(TK.spravnaJe, { x: o.spravnaText })} ${o.vysv}`;
  skoreKviz();
}
function otazkaVyber(o, i) {
  const d = document.createElement('div'); d.className = 'otazka';
  d.innerHTML = `<div class="q"><span class="por">${i + 1}.</span> ${o.q}</div><div class="moznosti"></div><div class="fb" hidden></div>`;
  const mz = $('.moznosti', d);
  o.moznosti.forEach((t, j) => {
    const b = document.createElement('button'); b.innerHTML = t;
    b.onclick = () => {
      $$('button', mz).forEach((x, k) => { x.disabled = true; if (k === o.spravna) x.classList.add('ok'); });
      if (j !== o.spravna) b.classList.add('zle');
      odpovedane(d, j === o.spravna, o);
    };
    mz.appendChild(b);
  });
  return d;
}
function otazkaPoradie(o, i) {
  const d = document.createElement('div'); d.className = 'otazka';
  d.innerHTML = `<div class="q"><span class="por">${i + 1}.</span> ${o.q}</div><p class="mini">${TK.porPokyn}</p><div class="porKroky"></div>
    <div class="volby"><button class="porReset">${TK.porReset}</button></div><div class="fb" hidden></div>`;
  const host = $('.porKroky', d), vyb = [];
  const btns = o.kroky.map((t, j) => {
    const b = document.createElement('button'); b.innerHTML = `<span class="c"></span><span>${t}</span>`;
    b.onclick = () => {
      if (vyb.includes(j) || vyb.length >= 4) return;
      vyb.push(j); $('.c', b).textContent = vyb.length;
      if (vyb.length === 4) {
        const ok = vyb.every((x, pos) => o.poradie[x] === pos);
        btns.forEach((x, k) => { x.disabled = true; x.classList.add(o.poradie[k] === vyb.indexOf(k) ? 'ok' : 'zle'); });
        $('.porReset', d).disabled = true;
        odpovedane(d, ok, o);
      }
    };
    host.appendChild(b); return b;
  });
  $('.porReset', d).onclick = () => { vyb.length = 0; btns.forEach(b => { $('.c', b).textContent = ''; }); };
  return d;
}

/* =====================================================================
   PREPÍNANIE KARIET A ŠTART
   ===================================================================== */
function ukazKartu(id) {
  AKT = id;
  $$('[data-karta]').forEach(s => { s.hidden = s.id !== id; });
  $$('#karty button').forEach(b => { const on = b.dataset.k === id; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  POLIA.forEach(p => p.rozmery());   // skryté polia mali nulovú šírku
  if (id === 'graf' && !GRAF.hotovo) { GRAF.hotovo = true; prepocitajGraf(); }
  if (id === 'graf') GRAF.anim = 0;
  if (id === 'omyly') omylyPrvyRaz();
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* napr. pri otvorení zo súboru */ }
}
function init() {
  $$('[data-t]').forEach(el => { const v = cesta(TEXTY, el.dataset.t); if (typeof v === 'string') el.innerHTML = v; });
  const nav = $('#karty'); let i = 0;
  for (const k in TEXTY.karty) {
    const b = document.createElement('button'); b.dataset.k = k; b.setAttribute('role', 'tab');
    b.innerHTML = (k !== 'pozn' ? `<span class="cis">${i + 1}.</span> ` : '') + TEXTY.karty[k];
    b.onclick = () => ukazKartu(k); nav.appendChild(b); i++;
  }
  $('#poznList').innerHTML = TEXTY.pozn.polozky.map(t => `<li>${t}</li>`).join('');
  START = generuj('nahodne', 10);
  initHra();
  PORADIE.forEach(initAlg);
  initSutaz(); initGraf(); initOmyly();
  $('#kvizNovy').onclick = novyKviz; novyKviz();
  const h = (location.hash || '').slice(1);
  ukazKartu(TEXTY.karty[h] ? h : 'hra');
  let posl = performance.now();
  const snimka = now => {   // jedna slučka pre všetky animácie, časovanie podľa skutočného času
    const dt = Math.min(.1, Math.max(0, (now - posl) / 1000)); posl = now;
    for (const hr of HRACI) if (hr.sek === AKT) hr.tick(dt);
    if (AKT === 'sutaz') tickSut(dt);
    if (AKT === 'graf') tickGraf(dt);
    if (AKT === 'omyly') tickOm2(dt);
    if (AKT === 'hra') tickHra(dt);
    requestAnimationFrame(snimka);
  };
  requestAnimationFrame(snimka);
}
init();
