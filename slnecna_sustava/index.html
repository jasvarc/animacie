<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slnečná sústava</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#04060c;--panel:rgba(12,16,28,.84);--line:rgba(140,160,215,.18);
  --text:#dfe6f5;--muted:#8a96b2;--gold:#f3b453;--gold2:#ffd88a;--blue:#6fb4ff;--red:#ff7a6b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.45 system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}#c.hover{cursor:pointer}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
button{font:inherit;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:9px;padding:6px 11px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
button:hover{background:rgba(255,255,255,.12);border-color:rgba(160,180,230,.35)}
button.on{background:rgba(243,180,83,.18);border-color:rgba(243,180,83,.55);color:var(--gold2)}
button.primary{background:linear-gradient(135deg,#f3b453,#d9772f);color:#1a0e02;border:none;font-weight:650;
  padding:10px 14px;width:100%;box-shadow:0 4px 18px rgba(243,140,60,.3)}
button.primary:hover{filter:brightness(1.08)}
input{font:inherit;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:5px 8px;color-scheme:dark}

#top{left:16px;top:16px;padding:12px 18px 12px 16px;min-width:250px}
#top h1{margin:0 0 2px;font-size:13px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
#date{font-size:24px;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
#rel{color:var(--muted);font-size:12.5px}
#views{left:16px;top:118px;padding:6px;display:flex;gap:4px;flex-wrap:wrap;max-width:330px}
#views button{padding:4px 9px;font-size:12.5px}
#followChip{display:none;color:var(--blue);border-color:rgba(111,180,255,.4)}

#controls{left:50%;bottom:16px;transform:translateX(-50%);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px)}
#controls .grp{display:flex;gap:6px;align-items:center}
#controls .sep{width:1px;height:26px;background:var(--line)}
#play{width:42px;font-size:15px}
#speed{width:170px;accent-color:var(--gold)}
#speedLbl{min-width:118px;font-variant-numeric:tabular-nums;font-size:13px}
#speedLbl small{color:var(--muted)}
.presets button{padding:4px 8px;font-size:12px}

#card{left:16px;top:166px;width:320px;padding:16px;max-height:calc(100vh - 290px);overflow:auto;
  transition:opacity .2s,transform .2s}
#card.hidden{opacity:0;transform:translateX(-12px);pointer-events:none}
#card .x{position:absolute;right:10px;top:10px;width:30px;height:30px;padding:0;font-size:18px;line-height:1}
#cType{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#cName{margin:0 0 6px;font-size:22px}
#cArt{display:block;margin:4px auto;width:240px;height:240px}
.tabs{display:flex;gap:6px;justify-content:center;margin:4px 0}
.tabs button{padding:3px 12px;font-size:12.5px}
#cCap{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:8px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-size:13px}
dt{color:var(--muted)}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
#cLive{border-top:1px solid var(--line);padding-top:8px}
#cNote{font-size:13px;color:#c7d0e4;margin:10px 0}
#cFollow{width:100%}

#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);opacity:0;pointer-events:none;
  padding:10px 18px;border-radius:12px;background:rgba(243,180,83,.95);color:#1b0f02;font-weight:650;
  transition:opacity .3s,transform .3s;box-shadow:0 8px 30px rgba(243,150,60,.35);z-index:10}
#toast.show{opacity:1;transform:translate(-50%,0)}
#hint{position:fixed;right:16px;bottom:18px;font-size:11.5px;color:var(--muted);text-align:right;pointer-events:none}
@media (max-width:900px){
  #hint{display:none}
  #card{width:calc(100vw - 32px);max-height:calc(100vh - 340px)}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<header id="top" class="panel">
  <h1>Slnečná sústava</h1>
  <div id="date">—</div>
  <div id="rel">dnes</div>
</header>

<nav id="views" class="panel">
  <button data-view="inner">Vnútorné planéty</button>
  <button data-view="all">Celá sústava</button>
  <button data-view="earth">Zem + Mesiac</button>
  <button data-view="jupiter">Jupiter</button>
  <button data-view="helio">Heliosféra</button>
  <button id="followChip">Sledovanie: <span></span> ✕</button>
</nav>

<div id="card" class="panel hidden">
  <button class="x" id="cardClose" title="Zavrieť">×</button>
  <div id="cType"></div>
  <h2 id="cName"></h2>
  <canvas id="cArt" width="240" height="240"></canvas>
  <div class="tabs" id="venusTabs"><button data-m="surface" class="on">Povrch</button><button data-m="clouds">Oblačnosť</button></div>
  <div id="cCap"></div>
  <dl id="cFacts"></dl>
  <dl id="cLive"></dl>
  <p id="cNote"></p>
  <button id="cFollow">Sledovať</button>
</div>

<footer id="controls" class="panel">
  <div class="grp">
    <button id="rev" title="Smer času">⇄</button>
    <button id="play" title="Pauza (medzerník)">❚❚</button>
  </div>
  <div class="grp">
    <input type="range" id="speed" min="0" max="1000" value="0">
    <span id="speedLbl">1 deň/s</span>
  </div>
  <div class="grp presets">
    <button data-s="1">1 deň</button><button data-s="7">týždeň</button><button data-s="30.44">mesiac</button><button data-s="365.25">rok</button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <input type="date" id="jump">
    <button id="jumpBtn">Skoč</button>
    <button id="today">Dnes</button>
  </div>
</footer>

<div id="toast"></div>
<div id="hint">Koliesko: zoom (až po Oortov oblak) · Ťahanie: posun · Klik: karta telesa · Medzerník: pauza<br>Pohľad zhora na rovinu ekliptiky. Mesiace sú pri oddialení zobrazené ďalej od planét.</div>

<script>
'use strict';
/* ============ Konstanty a čas ============ */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const AU_KM = 149597870.7, K_GAUSS = 0.01720209895, MU = K_GAUSS * K_GAUSS; // AU^3/den^2
const J2000 = 2451545.0, AUD_KMS = AU_KM / 86400;
const jdFromMs = ms => ms / 864e5 + 2440587.5;
const msFromJd = jd => (jd - 2440587.5) * 864e5;
const TODAY = jdFromMs(Date.now());
const fmtDate = jd => new Date(msFromJd(jd)).toLocaleDateString('sk-SK', {day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC'});
const fmtShort = jd => new Date(msFromJd(jd)).toLocaleDateString('sk-SK', {day: 'numeric', month: 'numeric', year: 'numeric', timeZone: 'UTC'});
const dny = n => { n = Math.abs(n); return n === 1 ? 'deň' : (n >= 2 && n <= 4 ? 'dni' : 'dní'); };
const nf = (x, d = 0) => x.toLocaleString('sk-SK', {minimumFractionDigits: d, maximumFractionDigits: d});
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const wrapPi = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };

/* ============ Planety: JPL Keplerovy elementy (J2000, změna za století) ============
   a [AU], e, I [°], L [°], ϖ [°], Ω [°] — Standish, platné 1800–2050 */
const PLANETS = [
  {id:'mercury', name:'Merkúr',  color:'#b9b2a7', icon:3.2, R:2439.7,
   el:[0.38709927,0.00000037, 0.20563593,0.00001906, 7.00497902,-0.00594749, 252.25032350,149472.67411175, 77.45779628,0.16047689, 48.33076593,-0.12534081]},
  {id:'venus',   name:'Venuša',  color:'#f0c674', icon:5.2, R:6051.8,
   el:[0.72333566,0.00000390, 0.00677672,-0.00004107, 3.39467605,-0.00078890, 181.97909950,58517.81538729, 131.60246718,0.00268329, 76.67984255,-0.27769418]},
  {id:'earth',   name:'Zem',     color:'#5aa2ff', icon:5.4, R:6371.0,
   el:[1.00000261,0.00000562, 0.01671123,-0.00004392, -0.00001531,-0.01294668, 100.46457166,35999.37244981, 102.93768193,0.32327364, 0,0]},
  {id:'mars',    name:'Mars',    color:'#e0714a', icon:4.3, R:3389.5,
   el:[1.52371034,0.00001847, 0.09339410,0.00007882, 1.84969142,-0.00813131, -4.55343205,19140.30268499, -23.94362959,0.44441088, 49.55953891,-0.29257343]},
  {id:'jupiter', name:'Jupiter', color:'#d9b48c', icon:9,   R:69911,
   el:[5.20288700,-0.00011607, 0.04838624,-0.00013253, 1.30439695,-0.00183714, 34.39644051,3034.74612775, 14.72847983,0.21252668, 100.47390909,0.20469106]},
  {id:'saturn',  name:'Saturn',  color:'#e6cf96', icon:8,   R:58232,
   el:[9.53667594,-0.00125060, 0.05386179,-0.00050991, 2.48599187,0.00193609, 49.95424423,1222.49362201, 92.59887831,-0.41897216, 113.66242448,-0.28867794]},
  {id:'uranus',  name:'Urán',    color:'#9fe3e8', icon:6.2, R:25362,
   el:[19.18916464,-0.00196176, 0.04725744,-0.00004397, 0.77263783,-0.00242939, 313.23810451,428.48202785, 170.95427630,0.40805281, 74.01692503,0.04240589]},
  {id:'neptune', name:'Neptún',  color:'#5b7cff', icon:6.2, R:24622,
   el:[30.06992276,0.00026291, 0.00859048,0.00005105, 1.77004347,0.00035372, -55.12002969,218.45945325, 44.96476227,-0.32241464, 131.78422574,-0.00508664]},
  {id:'pluto',   name:'Pluto',   color:'#d9c2a2', icon:3.6, R:1188.3, dwarf:true,
   el:[39.48211675,-0.00031596, 0.24882730,0.00005170, 17.14001206,0.00004818, 238.92903833,145.20780515, 224.06891629,-0.04062942, 110.30393684,-0.01183482]},
];
const MOONS = [
  {id:'moon',     name:'Mesiac',    parent:'earth',   a:384400,  P:27.321661, R:1737.4, color:'#cfcac2', ph:0},
  {id:'charon',   name:'Cháron',   parent:'pluto',   a:19591,   P:6.387221,  R:606,    color:'#a9a39c', ph:2.7},
  {id:'phobos',   name:'Phobos',   parent:'mars',    a:9376,    P:0.31891,   R:11.3,   color:'#9a8b7c', ph:1.0},
  {id:'deimos',   name:'Deimos',   parent:'mars',    a:23463,   P:1.26244,   R:6.2,    color:'#b9a996', ph:4.0},
  {id:'io',       name:'Io',       parent:'jupiter', a:421700,  P:1.769138,  R:1821.6, color:'#efd760', ph:0.3},
  {id:'europa',   name:'Európa',   parent:'jupiter', a:671034,  P:3.551181,  R:1560.8, color:'#e3d6bd', ph:2.1},
  {id:'ganymede', name:'Ganymedes', parent:'jupiter', a:1070412, P:7.154553,  R:2634.1, color:'#a99d8e', ph:4.4},
  {id:'callisto', name:'Kallisto', parent:'jupiter', a:1882709, P:16.689018, R:2410.3, color:'#7f7569', ph:5.6},
];
const BY = {};
PLANETS.forEach(p => { BY[p.id] = p; p.kind = 'planet'; p.x = p.y = p.z = 0; });
{ const cnt = {}; MOONS.forEach(m => { BY[m.id] = m; m.kind = 'moon'; m.idx = cnt[m.parent] = (cnt[m.parent] ?? -1) + 1; }); }
const SUN = {id:'sun', name:'Slnko', kind:'star', color:'#ffd36b', R:696340, x:0, y:0};
BY.sun = SUN;
const EARTH = BY.earth, VENUS = BY.venus;

function elems(p, T) {
  const e = p.el;
  return {a:e[0]+e[1]*T, e:e[2]+e[3]*T, I:(e[4]+e[5]*T)*DEG, L:(e[6]+e[7]*T)*DEG, wb:(e[8]+e[9]*T)*DEG, O:(e[10]+e[11]*T)*DEG};
}
function solveKepler(M, e) {
  M = wrapPi(M);
  let E = e < 0.8 ? M : Math.PI;
  for (let i = 0; i < 12; i++) {
    const d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    E -= d; if (Math.abs(d) < 1e-12) break;
  }
  return E;
}
// orbitální rovina -> heliocentrická ekliptikální soustava
function toEcl(k, xp, yp, out) {
  const w = k.wb - k.O, cw = Math.cos(w), sw = Math.sin(w), cO = Math.cos(k.O), sO = Math.sin(k.O), cI = Math.cos(k.I), sI = Math.sin(k.I);
  out.x = (cw*cO - sw*sO*cI) * xp + (-sw*cO - cw*sO*cI) * yp;
  out.y = (cw*sO + sw*cO*cI) * xp + (-sw*sO + cw*cO*cI) * yp;
  out.z = (sw*sI) * xp + (cw*sI) * yp;
  return out;
}
function helio(p, jd, out = {}) {
  const k = elems(p, (jd - J2000) / 36525);
  const E = solveKepler(k.L - k.wb, k.e);
  return toEcl(k, k.a * (Math.cos(E) - k.e), k.a * Math.sqrt(1 - k.e*k.e) * Math.sin(E), out);
}
function moonAngle(m, jd) {
  const d = jd - J2000;
  if (m.id === 'moon') return (218.316 + 13.176396 * d) * DEG; // střední ekliptikální délka Měsíce
  return m.ph + TAU * d / m.P;
}

const LY = 63241.077; // AU ve světelném roce

/* ============ Stav simulace ============ */
let jd = TODAY, speed = 1, dir = 1, running = true;
let orbitJD = -1e9;
function buildOrbits() {
  const T = (jd - J2000) / 36525, N = 720, o = {};
  for (const p of PLANETS) {
    const k = elems(p, T), path = new Path2D(), b = k.a * Math.sqrt(1 - k.e*k.e);
    for (let i = 0; i <= N; i++) {
      const E = i / N * TAU;
      toEcl(k, k.a * (Math.cos(E) - k.e), b * Math.sin(E), o);
      i ? path.lineTo(o.x, o.y) : path.moveTo(o.x, o.y);
    }
    path.closePath(); p.path = path;
  }
  orbitJD = jd;
}
// pás planetek (jen dekorace)
const BELT = (() => { const r = mulberry(7), a = []; for (let i = 0; i < 1400; i++) { const ax = 2.15 + r() * 1.15 + (r() - .5) * .15; a.push({a: ax, ph: r() * TAU, n: Math.sqrt(MU / (ax*ax*ax)), e: r() * .12, w: r() * TAU}); } return a; })();
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ============ Plátno a kamera ============ */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, stars = null;
const cam = {x:0, y:0, log:0, tlog:0, s:1};
let anchor = null, follow = null, followTr = null, camGoal = null;
const S_MIN = 4e-4, S_MAX = 4e6;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  // hvězdné pozadí předkreslené do offscreen plátna
  stars = document.createElement('canvas'); stars.width = cv.width; stars.height = cv.height;
  const g = stars.getContext('2d'), r = mulberry(42), n = Math.round(W * H / 1400);
  const neb = g.createRadialGradient(cv.width*.75, cv.height*.25, 0, cv.width*.75, cv.height*.25, cv.width*.7);
  neb.addColorStop(0, 'rgba(60,50,110,.10)'); neb.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = neb; g.fillRect(0, 0, cv.width, cv.height);
  for (let i = 0; i < n; i++) {
    const s = r(), b = Math.pow(r(), 3);
    g.fillStyle = `rgba(${200 + 55*s|0},${210 + 40*r()|0},255,${.15 + .75*b})`;
    const sz = (b > .85 ? 1.6 : 1) * DPR;
    g.fillRect(r() * cv.width, r() * cv.height, sz, sz);
  }
}
addEventListener('resize', resize);
const vmin = () => Math.max(300, Math.min(W, H));
const fitScale = R => vmin() * 0.45 / R;
function setView(v) {
  camGoal = null;
  if (v === 'inner') { setFollow(null); camGoal = {x:0, y:0}; cam.tlog = Math.log(fitScale(1.65)); }
  else if (v === 'all') { setFollow(null); camGoal = {x:0, y:0}; cam.tlog = Math.log(fitScale(50)); }
  else if (v === 'helio') { setFollow(null); camGoal = {x:0, y:0}; cam.tlog = Math.log(fitScale(135)); }
  else if (v === 'earth') { setFollow(EARTH); cam.tlog = Math.log(vmin() * 0.32 / (384400 / AU_KM)); }
  else if (v === 'jupiter') { setFollow(BY.jupiter); cam.tlog = Math.log(vmin() * 0.33 / (1882709 / AU_KM)); }
  anchor = null;
}
function setFollow(o) {
  followTr = o ? {t: 0, dur: 1.1, x: cam.x, y: cam.y, log: cam.log} : null;
  if (o) { camGoal = null; anchor = null; }
  follow = o;
  const chip = document.getElementById('followChip');
  chip.style.display = o ? 'inline-block' : 'none';
  if (o) chip.querySelector('span').textContent = o.name;
}
function moonDisp(m, s) { // zobrazená vzdálenost měsíce v px (zvětšená, dokud není skutečná dost velká)
  const par = BY[m.parent], pr = Math.max(par.icon, par.R / AU_KM * s);
  return Math.max(m.a / AU_KM * s, pr + 7 + m.idx * 7);
}
function displayPos(o) {
  if (o.kind === 'moon') { const par = BY[o.parent], d = moonDisp(o, cam.s) / cam.s; return {x: par.x + Math.cos(o.ang) * d, y: par.y + Math.sin(o.ang) * d}; }
  return {x: o.x, y: o.y};
}
function zoomAt(factor, sx, sy) {
  cam.tlog = clamp(cam.tlog + Math.log(factor), Math.log(S_MIN), Math.log(S_MAX));
  if (follow) return;
  camGoal = null;
  anchor = {sx, sy, wx: cam.x + (sx - W/2) / cam.s, wy: cam.y - (sy - H/2) / cam.s};
}
function updateCamera(dt) {
  const k = 1 - Math.exp(-dt * 12);
  if (!isFinite(cam.tlog) || !isFinite(cam.log)) cam.log = cam.tlog = Math.log(fitScale(1.65));
  if (!isFinite(cam.x) || !isFinite(cam.y)) cam.x = cam.y = 0;
  if (follow && followTr) {
    // přelet k sledovanému tělesu: nejdřív poloha, zoom plynule dobíhá
    followTr.t += dt;
    const u = Math.min(1, followTr.t / followTr.dur), ease = v => v * v * (3 - 2 * v);
    cam.log = followTr.log + (cam.tlog - followTr.log) * ease(u); cam.s = Math.exp(cam.log);
    const p = displayPos(follow), pu = ease(Math.min(1, u * 1.7));
    cam.x = followTr.x + (p.x - followTr.x) * pu; cam.y = followTr.y + (p.y - followTr.y) * pu;
    if (u >= 1) followTr = null;
    return;
  }
  cam.log += (cam.tlog - cam.log) * k; cam.s = Math.exp(cam.log);
  if (follow) {
    const p = displayPos(follow);
    cam.x = p.x; cam.y = p.y;
  } else if (anchor) {
    cam.x = anchor.wx - (anchor.sx - W/2) / cam.s; cam.y = anchor.wy + (anchor.sy - H/2) / cam.s;
    if (Math.abs(cam.tlog - cam.log) < 1e-4) anchor = null;
  } else if (camGoal) {
    cam.x += (camGoal.x - cam.x) * k; cam.y += (camGoal.y - cam.y) * k;
    if (Math.hypot(camGoal.x - cam.x, camGoal.y - cam.y) * cam.s < .3) camGoal = null;
  }
}

/* ============ Ovládání myší / dotykem ============ */
const pointers = new Map(); let drag = null, pinch = null;
cv.addEventListener('wheel', e => { e.preventDefault(); const d = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY; zoomAt(Math.exp(-d * 0.0022), e.clientX, e.clientY); }, {passive: false});
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});

function drawBody(o, x, y, r) {

function draw() {

    const par = BY[m.parent]; m.d = moonDisp(m, s);
    m.sx = par.sx + Math.cos(m.ang) * m.d; m.sy = par.sy - Math.sin(m.ang) * m.d;
    m.r = Math.max(m.R > 100 ? 2.3 : 1.6, m.R / AU_KM * s); m.hidden = !moonsOn;

    ctx.save();

    drawBody(p, p.sx, p.sy, p.r);

      ctx.strokeStyle = 'rgba(150,165,200,.16)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(par.sx, par.sy, m.d, 0, TAU); ctx.stroke();

function drawOuter(s, placeLabel) {

  const lblAng = Math.atan2(70 - cy, W * .62 - cx); // popisky kružnic směrem k horní části obrazovky
  const ringLbl = (r, txt, col) => { const x = cx + Math.cos(lblAng) * r, y = cy + Math.sin(lblAng) * r; if (x > 10 && x < W - 120 && y > 10 && y < H - 90) placeLabel(txt, x + 5, y, f11, col); };
  ctx.lineWidth = 1;
  // Oortův oblak (2 000 – 100 000 AU)
  const oIn = 2000 * s, oOut = 100000 * s;
  if (oOut > 25 && oIn < lim && oOut < 1e7) {
    const g = ctx.createRadialGradient(cx, cy, oIn, cx, cy, oOut);
    g.addColorStop(0, 'rgba(140,160,230,0)'); g.addColorStop(.25, 'rgba(140,160,230,.09)'); g.addColorStop(1, 'rgba(140,160,230,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, oOut, 0, TAU); ctx.fill();
    if (oOut > 60) ringLbl(Math.max(oIn, 15000 * s), 'Oortov oblak', 'rgba(175,190,235,.75)');
  }
  // Kuiperův pás (30 – 50 AU)
  const k1 = 30 * s, k2 = 50 * s;

    ctx.fillStyle = 'rgba(150,170,220,.08)'; ctx.beginPath(); ctx.arc(cx, cy, k2, 0, TAU); ctx.arc(cx, cy, k1, 0, TAU, true); ctx.fill();
    if (k2 > 45) ringLbl((k1 + k2) / 2, 'Kuiperov pás', 'rgba(175,190,235,.75)');
  }
  // heliopauza (~120 AU)
  const hp = 120 * s;
  if (hp > 15 && hp < lim) {
    ctx.setLineDash([5, 6]); ctx.strokeStyle = 'rgba(110,185,255,.4)';
    ctx.beginPath(); ctx.arc(cx, cy, hp, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    if (hp > 45) ringLbl(hp, 'Heliopauza ~120 AU', 'rgba(130,195,255,.8)');
  }
  // vzdálenosti ve světelných letech

    const r = k * LY * s;

    ctx.strokeStyle = 'rgba(160,175,215,.15)'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();

  }
}
function drawScale() {

    g.addColorStop(0, 'rgba(255,255,255,.12)'); g.addColorStop(.5, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,8,.9)');
    actx.fillStyle = g; actx.fillRect(0, 0, S, S);
  }
  actx.restore();
  if (o.id === 'saturn') ring(false);
  function ring(back) {
    actx.save(); actx.translate(c, c); actx.rotate(-.35);
    for (let i = 0; i < 26; i++) {
      const rr = R * (1.3 + i * .035), gap = i === 15 || i === 16;
      actx.strokeStyle = gap ? 'rgba(0,0,0,0)' : `rgba(${215 + r()*30|0},${190 + r()*30|0},${140 + r()*30|0},${back ? .35 : .8})`;
      actx.lineWidth = R * .036; actx.beginPath();
      actx.ellipse(0, 0, rr, rr * .32, 0, back ? Math.PI : 0, back ? TAU : Math.PI); actx.stroke();
    }
    actx.restore();
  }
}

/* ============ Hlavní smyčka ============ */
let last = performance.now(), lastDateStr = '', artT = 0;
function updateUI() {
  const ds = fmtDate(jd);
  if (ds !== lastDateStr) {
    lastDateStr = ds; $('date').textContent = ds;
    const d = Math.round(jd - jdFromMs(Date.now()));
    $('rel').textContent = d === 0 ? 'dnes' : (d > 0 ? `o ${nf(d)} ${dny(d)} od dneška` : `pred ${nf(-d)} ${dny(d)}`);
  }
  updateLive(false);
}
function frame(now) {
  const dt = Math.min(.1, Math.max(0, (now - last) / 1000)); last = now;
  if (innerWidth !== W || innerHeight !== H) resize();
  if (running) jd += dir * speed * dt;
  computeState();
  updateCamera(dt);
  draw();
  updateUI();
  if (selected === VENUS && venusTex) {
    venusRot -= dt * .12; cloudRot -= dt * .5;
    artT += dt; if (artT > 1 / 30) { artT = 0; renderVenus(); }
  }
  requestAnimationFrame(frame);
}

resize();
computeState();
cam.log = cam.tlog = Math.log(fitScale(1.65)); cam.s = Math.exp(cam.log);
setSpeed(1);
$('jump').value = new Date(msFromJd(jd)).toISOString().slice(0, 10);
requestAnimationFrame(frame);
</script>
