/* ===== Farby a základ – rovnaká paleta ako predošlé animácie ===== */

<script>
/* =====================================================================
   POMOCNÉ FUNKCIE
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const T = TEXTY;
const MALO_POHYBU = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function cesta(o, p) { return p.split('.').reduce((x, k) => x == null ? x : x[k], o); }
function vypln(t, o) { return String(t).replace(/\{(\w+)\}/g, (x, k) => (o && o[k] !== undefined) ? o[k] : x); }
// slovenské tvary: 1 deliteľ, 2 – 4 delitele, 5 a viac deliteľov
function tvar(n, [jeden, dva, pat]) { return n === 1 ? jeden : n >= 2 && n <= 4 ? dva : pat; }
const nahoda = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const HORNE = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const horny = e => String(e).split('').map(c => HORNE[+c]).join('');

/* --- animácia cez requestAnimationFrame, časovaná podľa skutočného času ---
   animuj(trvanie_ms, krok(u ∈ [0,1]), hotovo) → funkcia na zrušenie */
function animuj(trvanie, krok, hotovo, linearne) {
  if (MALO_POHYBU || trvanie <= 0) { krok(1); if (hotovo) hotovo(); return () => {}; }
  const t0 = performance.now(); let id = 0, zrus = false;
  const f = now => {
    if (zrus) return;
    const u = Math.min(1, Math.max(0, (now - t0) / trvanie));
    krok(linearne ? u : 1 - Math.pow(1 - u, 3));       // lineárne = čas beží rovnomerne
    if (u < 1) id = requestAnimationFrame(f); else if (hotovo) hotovo();
  };
  id = requestAnimationFrame(f);
  return () => { zrus = true; cancelAnimationFrame(id); };
}
/* --- postupnosť krokov v rovnakých odstupoch (cez requestAnimationFrame) ---
   krok(i) vráti false → koniec. Pri obmedzenom pohybe sa všetko urobí naraz,
   iba ak vzdy = true, kroky idú ďalej po jednom (bez plynulých prechodov). */
function postupne(pocet, interval, krok, hotovo, vzdy) {
  let i = 0, zrus = false, id = 0, t0 = null;
  const koniec = () => { zrus = true; if (hotovo) hotovo(); };
  if (MALO_POHYBU && !vzdy) {
    while (i < pocet) if (krok(i++) === false) break;
    koniec(); return () => {};
  }
  const f = now => {
    if (zrus) return;
    if (t0 === null) t0 = now;
    while (i < pocet && now - t0 >= i * interval) { if (krok(i++) === false) { koniec(); return; } }
    if (i < pocet) id = requestAnimationFrame(f); else koniec();
  };
  id = requestAnimationFrame(f);
  return () => { zrus = true; cancelAnimationFrame(id); };
}
/* --- plynulé objavenie panelu --- */
function objav(el) {
  el.style.opacity = 0;
  animuj(260, u => { el.style.opacity = u; el.style.transform = `translateY(${(1 - u) * 8}px)`; },
    () => { el.style.opacity = ''; el.style.transform = ''; });
}
/* --- klávesnica v zozname záložiek: šípky vľavo/vpravo, Home, End --- */
function sipkyZaloziek(lista) {
  lista.addEventListener('keydown', e => {
    const bb = $$('[role=tab]', lista); const i = bb.indexOf(document.activeElement);
    if (i < 0) return;
    let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % bb.length;
    else if (e.key === 'ArrowLeft') j = (i - 1 + bb.length) % bb.length;
    else if (e.key === 'Home') j = 0; else if (e.key === 'End') j = bb.length - 1;
    if (j !== null) { e.preventDefault(); bb[j].focus(); bb[j].click(); }
  });
}

/* =====================================================================
   MATEMATICKÝ MODUL MAT – jediný, používajú ho všetky časti.
   Rozsah: prirodzené čísla 1 až 9 999. Súčin dvoch takých čísel je menší
   ako 10⁸, teda hlboko pod 2⁵³ – výpočty v Number sú presné.
   ===================================================================== */
/* MAT-START */
const MAT = (() => {
  const MAX = 9999;

  // zoradený zoznam všetkých deliteľov čísla n (hľadáme po dvojiciach d · n/d)
  function divisors(n) {
    const male = [], velke = [];
    for (let d = 1; d * d <= n; d++) {
      if (n % d === 0) { male.push(d); if (d * d !== n) velke.push(n / d); }
    }
    return male.concat(velke.reverse());
  }
  // prvočíslo = presne dva delitele; skúšame deliť číslami do √n
  function isPrime(n) {
    if (!Number.isInteger(n) || n < 2) return false;
    if (n % 2 === 0) return n === 2;
    for (let d = 3; d * d <= n; d += 2) if (n % d === 0) return false;
    return true;
  }
  const isComposite = n => Number.isInteger(n) && n > 1 && !isPrime(n);
  // rozklad na prvočísla: pole dvojíc [prvočíslo, exponent], napr. 360 → [[2,3],[3,2],[5,1]]
  function factorize(n) {
    const r = [];
    if (!Number.isInteger(n) || n < 2) return r;
    for (let p = 2; p * p <= n; p += (p === 2 ? 1 : 2)) {
      if (n % p === 0) { let e = 0; while (n % p === 0) { n /= p; e++; } r.push([p, e]); }
    }
    if (n > 1) r.push([n, 1]);
    return r;
  }
  // súčin rozkladu späť na číslo
  const product = f => f.reduce((s, [p, e]) => s * p ** e, 1);
  // najmenšie prvočíslo, ktoré delí n (n ≥ 2)
  const smallestPrime = n => factorize(n)[0][0];
  // NSD – Euklidov algoritmus, iteračne (zvyšky po delení)
  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { const r = a % b; a = b; b = r; }
    return a;
  }
  // NSN – najprv delíme, potom násobíme, aby medzivýsledok ostal malý
  const lcm = (a, b) => a / gcd(a, b) * b;
  const gcdMany = arr => arr.reduce((g, x) => gcd(g, x));
  const lcmMany = arr => arr.reduce((l, x) => lcm(l, x));
  // kroky Euklidovho algoritmu: a = q · b + r; väčšie číslo ide vždy prvé
  function euclidSteps(a, b) {
    if (a < b) [a, b] = [b, a];
    const kroky = [];
    while (b > 0) { const q = Math.floor(a / b), r = a % b; kroky.push({ a, b, q, r }); a = b; b = r; }
    return kroky;
  }
  // spoločné delitele = delitele NSD
  const commonDivisors = (a, b) => divisors(gcd(a, b));
  // násobky n, ktoré nie sú väčšie ako limit
  function multiples(n, limit) { const r = []; for (let m = n; m <= limit; m += n) r.push(m); return r; }
  const coprime = (a, b) => gcd(a, b) === 1;
  /* tri nezávislé spôsoby výpočtu NSD (časť 2) – testy ich porovnávajú */
  // A: výpis deliteľov – prienik dvoch zoznamov, najväčší prvok
  function gcdByDivisors(a, b) { const db = new Set(divisors(b)); return Math.max(...divisors(a).filter(d => db.has(d))); }
  // B: rozklad – súčin spoločných prvočísel s menším exponentom
  const gcdByFactors = (a, b) => product(multisetIntersect(factorize(a), factorize(b)));
  // C: Euklidov algoritmus – posledný nenulový zvyšok (= deliteľ v poslednom kroku)
  function gcdByEuclid(a, b) { const k = euclidSteps(a, b); return k[k.length - 1].b; }
  /* tri nezávislé spôsoby výpočtu NSN (časť 3) – testy ich porovnávajú */
  // A: výpis násobkov väčšieho čísla, kým nie je deliteľný menším
  function lcmByMultiples(a, b) { const M = Math.max(a, b), m = Math.min(a, b); let x = M; while (x % m) x += M; return x; }
  // B: rozklad – súčin všetkých prvočísel s väčším exponentom
  const lcmByFactors = (a, b) => product(multisetUnion(factorize(a), factorize(b)));
  // C: vzorec cez NSD – najprv deliť, potom násobiť
  const lcmByGcd = (a, b) => a / gcdByEuclid(a, b) * b;
  // rozklad ako zoznam prvočísel: 12 → [2, 2, 3]
  const flatFactors = f => f.flatMap(([p, e]) => Array(e).fill(p));
  // prienik rozkladov (spoločné prvočísla s menším exponentom) → rozklad NSD
  function multisetIntersect(f1, f2) {
    const m2 = new Map(f2);
    return f1.filter(([p]) => m2.has(p)).map(([p, e]) => [p, Math.min(e, m2.get(p))]);
  }
  // zjednotenie rozkladov (všetky prvočísla s väčším exponentom) → rozklad NSN
  function multisetUnion(f1, f2) {
    const m = new Map(f1);
    for (const [p, e] of f2) m.set(p, Math.max(e, m.get(p) || 0));
    return [...m].sort((x, y) => x[0] - y[0]);
  }
  // zápis rozkladu: 2³ · 3² · 5
  const formatFactors = f => f.map(([p, e]) => e > 1 ? p + horny(e) : String(p)).join(' · ');
  // rozpísaný zápis: 2 · 2 · 2 · 3 · 3 · 5
  const formatFlat = f => f.flatMap(([p, e]) => Array(e).fill(p)).join(' · ');

  /* --- Kritériá deliteľnosti – počítajú len s číslicami (ako žiak),
     nie priamym delením. Test ich porovná so zvyškom po delení. --- */
  const PARNE = [0, 2, 4, 6, 8];
  // opakovaný ciferný súčet: 7524 → [18, 9]
  function retazSuctov(n) {
    const r = []; let x = n;
    while (x >= 10) { x = String(x).split('').reduce((s, c) => s + +c, 0); r.push(x); }
    return r;
  }
  function criterion(d, n) {
    const s = String(n), c = +s[s.length - 1];
    switch (d) {
      case 2: return { plati: PARNE.includes(c), c };
      case 5: return { plati: c === 0 || c === 5, c };
      case 10: return { plati: c === 0, c };
      case 100: return { plati: s.length >= 3 && s.slice(-2) === '00', cc: s.slice(-2), kratke: s.length < 3 };
      case 3: case 9: {
        // zopakujeme ciferný súčet, kým nezostane jedna číslica; deliteľné 9 ⇔ výsledok 9, deliteľné 3 ⇔ 3, 6 alebo 9
        const ret = retazSuctov(n), x = ret.length ? ret[ret.length - 1] : n;
        return { plati: d === 9 ? x === 9 : [3, 6, 9].includes(x), cifry: s.split('').map(Number), ret, s: x };
      }
      case 4: { const t = +s.slice(-2); return { plati: t % 4 === 0, t, jedno: s.length === 1 }; }  // malé číslo do 99
      case 6: { const a = criterion(2, n).plati, b = criterion(3, n).plati; return { plati: a && b, a, b }; }
    }
    throw new RangeError('Pre ' + d + ' kritérium nemáme.');
  }
  const CRITERIA = [2, 3, 4, 5, 6, 9, 10, 100];

  /* --- Kontrola vstupu: len celé čísla od 1 do max. Vráti {ok, n} alebo {ok:false, sprava} --- */
  function parseInput(text, max = MAX) {
    const s = String(text == null ? '' : text).replace(/ /g, ' ').trim();
    if (s === '') return { ok: false, sprava: T.vstup.prazdne };
    const bez = s.replace(/\s+/g, '').replace(/^−/, '-');
    if (/^[+-]?(\d+[.,]\d*|[.,]\d+)$/.test(bez)) {                     // desatinné číslo
      const x = parseFloat(bez.replace(',', '.'));
      return { ok: false, sprava: x <= 0 ? T.vstup.nula : T.vstup.desatinne };
    }
    if (/^-\d+$/.test(bez)) return { ok: false, sprava: T.vstup.nula };  // záporné číslo
    if (!/^\+?\d+$/.test(bez) || (/\s/.test(s) && !/^\d{1,3}( \d{3})+$/.test(s))) return { ok: false, sprava: T.vstup.necislo };
    const n = parseInt(bez, 10);
    if (n === 0) return { ok: false, sprava: T.vstup.nula };
    if (n > max) return { ok: false, sprava: vypln(T.vstup.velke, { max }) };
    return { ok: true, n };
  }

  return { MAX, divisors, isPrime, isComposite, factorize, product, smallestPrime, gcd, lcm, gcdMany, lcmMany, euclidSteps,
    commonDivisors, multiples, coprime, gcdByDivisors, gcdByFactors, gcdByEuclid, lcmByMultiples, lcmByFactors, lcmByGcd, flatFactors, multisetIntersect, multisetUnion, formatFactors, formatFlat,
    criterion, CRITERIA, retazSuctov, parseInput };
})();
/* MAT-END */

/* --- vstup čísla: pole, tlačidlá − / +, náhodné číslo, láskavá hláška --- */
function vstupCisla(obal, nast) {
  const id = obal.id + '_in';
  obal.innerHTML = `<div class="vstupRiadok"><label class="lbl" for="${id}">${nast.popis || T.ui.cislo}</label>
    <button type="button" class="krok" data-k="-1" aria-label="${T.ui.menej}">−</button>
    <input id="${id}" class="num" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="${nast.hodnota}">
    <button type="button" class="krok" data-k="1" aria-label="${T.ui.viac}">+</button>
    <button type="button" class="nah">${T.ui.nahodne}</button></div>
    <p class="hlaska" role="status" aria-live="polite"></p>`;
  const inp = $('input', obal), hl = $('.hlaska', obal), [minus, plus] = $$('.krok', obal);
  let posl = nast.hodnota;
  // ticho = len nastaví hodnotu, nevolá zmena (keď sa nastavuje viac polí naraz)
  function nastav(n, zPola, ticho) {
    posl = n;
    if (!zPola) inp.value = n;
    inp.classList.remove('zle'); inp.removeAttribute('aria-invalid'); hl.textContent = '';
    minus.disabled = n <= 1; plus.disabled = n >= nast.max;
    if (!ticho) nast.zmena(n);
  }
  function precitaj() {
    const r = MAT.parseInput(inp.value, nast.max);
    if (r.ok) { nastav(r.n, true); return; }
    inp.classList.add('zle'); inp.setAttribute('aria-invalid', 'true'); hl.textContent = r.sprava;
    if (nast.chyba) nast.chyba(r.sprava);
  }
  inp.addEventListener('input', precitaj);
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault(); const n = posl + (e.key === 'ArrowUp' ? 1 : -1);
      if (n >= 1 && n <= nast.max) nastav(n);
    }
  });
  $$('.krok', obal).forEach(b => b.onclick = () => {
    const n = Math.min(nast.max, Math.max(1, posl + +b.dataset.k)); nastav(n);
  });
  $('.nah', obal).onclick = () => {
    let n; do { n = nast.nahodne ? nast.nahodne() : nahoda(2, nast.max); } while (n === posl);
    nastav(n);
  };
  minus.disabled = posl <= 1; plus.disabled = posl >= nast.max;
  return { nastav, hodnota: () => posl, input: inp, hlaska: hl, precitaj };
}

/* --- obdĺžnik a × b zo štvorčekov ako SVG; s = veľkosť štvorčeka --- */
function obdlznikSVG(a, b, s, farba) {
  farba = farba || '#6fb4ff';
  const w = b * s, h = a * s, sw = Math.max(.6, Math.min(1.5, s / 12));
  let bunky = '';
  if (s >= 4) {
    for (let r = 0; r < a; r++) for (let c = 0; c < b; c++)
      bunky += `<rect x="${c * s + sw / 2}" y="${r * s + sw / 2}" width="${s - sw}" height="${s - sw}" rx="${s / 6}" fill="${farba}" fill-opacity=".32" stroke="${farba}" stroke-width="${sw}"/>`;
  } else {
    // drobné štvorčeky: plocha a mriežka čiarami
    bunky = `<rect width="${w}" height="${h}" fill="${farba}" fill-opacity=".35" stroke="${farba}" stroke-width=".8"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${bunky}</svg>`;
}

// strany „Ako to funguje“: vlavo obrázok, vpravo najviac 4 vety (alebo 4 pravidlá)
function kresliAko(pod, strany, obrazky, bezAnimacie) {
  const art = $(`[data-pod="${pod}"]`), obal = $('[data-rezim="ako"]', art);
  const i = STAV.strana[pod], s = strany[i];
  const obr = obrazky[s.obr]();

    text = `<h3>${s.titul}</h3><div class="pravidla">` + s.pravidla.map(p =>
      `<div class="pravidlo"><span class="znak" ${p.znak ? '' : `aria-label="deliteľnosť ${p.d}"`}>${p.znak || '÷ ' + p.d}</span><div>${p.veta}<span class="pr">${p.pr}</span></div></div>`).join('') + '</div>';
  } else {

    (strany.length > 1 ? `<div class="strankovac"><button type="button" data-s="-1" ${i === 0 ? 'disabled' : ''}>${T.ui.spat}</button>` +
      `<span class="str">${vypln(T.ui.strana, { i: i + 1, n: strany.length })}</span>` +
      `<button type="button" class="primary" data-s="1" ${i === strany.length - 1 ? 'disabled' : ''}>${T.ui.dalej}</button></div>` : '');
  $$('.strankovac button', obal).forEach(b => b.onclick = () => {
    STAV.strana[pod] = Math.max(0, Math.min(strany.length - 1, i + +b.dataset.s));

    (dalsi && !dalsi.disabled ? dalsi : $('.strankovac button:not(:disabled)', obal)).focus();
  });
  if (!bezAnimacie) objav($('.ako', obal));
}

   KARTA 1: DELITEĽ A NÁSOBOK
   ===================================================================== */
const D = { n: 12, vyb: null, zrusSkok: () => {} };
function initDelitel() {
  vytvorRezim('delitel');
  $('#d_pojmy').innerHTML = T.delitel.pojmy.map(p => `<li>${p}</li>`).join('');
  // pás 1 – 100
  let pas = ''; for (let i = 1; i <= 100; i++) pas += `<span data-i="${i}">${i}</span>`;
  $('#d_pas').innerHTML = pas; $('#d_pas').setAttribute('aria-label', T.delitel.pasPopis);
  D.vstup = vstupCisla($('#d_vstup'), {
    max: 200, hodnota: 12, zmena: n => { D.n = n; D.vyb = null; kresliDelitel(); },
    // náhodne často vyberieme číslo s mnohými deliteľmi – je na ňom viac vidieť
    nahodne: () => Math.random() < .5 ? [12, 18, 24, 30, 36, 48, 60, 72, 84, 90, 96, 100, 120, 144, 180][nahoda(0, 14)] : nahoda(2, 200),
    chyba: () => { D.zrusSkok(); }
  });
  $('#d_skoc').onclick = () => skocNasobky(true);
  kresliDelitel();
}
function kresliDelitel() {
  const n = D.n, del = MAT.divisors(n), dt = T.delitel;
  const pary = del.filter(a => a * a <= n).map(a => [a, n / a]);
  $('#d_obd').innerHTML = pary.map(([a, b]) => {
    const s = Math.min(22, 280 / b);
    return `<button type="button" class="obd" data-a="${a}" data-b="${b}" aria-label="obdĺžnik ${a} krát ${b}">${obdlznikSVG(a, b, s)}<span class="cap">${a} × ${b}</span></button>`;
  }).join('');
  $('#d_del').innerHTML = del.map(d => `<button type="button" class="del" data-d="${d}">${d}</button>`).join('');
  $('#d_pocet').innerHTML = vypln(dt.pocet, { n, k: del.length, slovo: tvar(del.length, dt.tvaryDel) });
  let info = dt.tukni;
  if (n === 1) info = dt.jedna;
  else if (MAT.isPrime(n)) info = vypln(dt.prvo, { n });
  else if (Number.isInteger(Math.sqrt(n))) info = vypln(dt.stvorec, { n, a: Math.sqrt(n) }) + ' ' + dt.tukni;
  $('#d_info').innerHTML = info;
  $$('#d_obd .obd').forEach(b => b.onclick = () => vyberDelitel(+b.dataset.a));
  $$('#d_del .del').forEach(b => b.onclick = () => vyberDelitel(+b.dataset.d, true));
  skocNasobky(false);
}
// zvýrazní obdĺžnik a jeho dva delitele
function vyberDelitel(d, zDelitela) {
  const n = D.n, a = Math.min(d, n / d), b = n / a, dt = T.delitel;
  $$('#d_obd .obd').forEach(x => x.classList.toggle('vyb', +x.dataset.a === a));
  $$('#d_del .del').forEach(x => x.classList.toggle('vyb', +x.dataset.d === a || +x.dataset.d === b));
  $('#d_info').innerHTML = zDelitela ? vypln(dt.delKlik, { n, d, q: n / d }) :
    (a === b ? vypln(dt.stvKlik, { n, a }) : vypln(dt.obdKlik, { n, a, b }));
}
// násobky do 100 na páse; s animáciou sa rozsvecujú postupne („skáčeme po n“)
function skocNasobky(animuj) {
  D.zrusSkok();
  const n = D.n, dt = T.delitel, nas = MAT.multiples(n, 100);
  const bunky = $$('#d_pas span');
  bunky.forEach(b => b.classList.remove('m', 'ja'));
  bunky[n - 1] && bunky[n - 1].classList.add('ja');
  const zoznam = nas.length > 14 ? nas.slice(0, 6).join(', ') + ', …, ' + nas.slice(-2).join(', ') : nas.join(', ');
  $('#d_nasText').innerHTML = nas.length ? vypln(dt.nasText, { n, zoznam, k: nas.length }) :
    vypln(dt.nasVelke, { n, zoznam: [n, 2 * n, 3 * n].join(', ') });
  $('#d_skoc').disabled = !nas.length;
  const rozsviet = i => { bunky[nas[i] - 1].classList.add('m'); };
  if (animuj) D.zrusSkok = postupne(nas.length, Math.max(60, Math.min(260, 2600 / nas.length)), rozsviet);
  else nas.forEach((_, i) => rozsviet(i));
}

/* =====================================================================
   KARTA 2: KRITÉRIÁ DELITEĽNOSTI
   ===================================================================== */
const K = { n: 7524, zrus: () => {} };
function initKriteria() {
  vytvorRezim('kriteria');
  K.vstup = vstupCisla($('#k_vstup'), {
    max: MAT.MAX, hodnota: 7524, zmena: n => { K.n = n; overKriteria(true); },
    nahodne: () => Math.random() < .4 ? nahoda(1, 99) * [36, 60, 100, 18][nahoda(0, 3)] % 9999 || 7524 : nahoda(10, 9999),
    chyba: sprava => { K.zrus(); $('#k_riadky').innerHTML = ''; $('#k_zhrnutie').innerHTML = ''; }
  });
  $('#k_znova').onclick = () => overKriteria(true);
  $('#k_delenim').onchange = () => $$('#k_riadky .delenie').forEach(x => x.hidden = !$('#k_delenim').checked);
  overKriteria(false);
}
// text postupu pre jedno pravidlo – rovnaké výpočty, ako by robil žiak
function postupKriteria(d, n, r) {
  const kt = T.kriteria, je = ok => ok ? kt.jeKratko : kt.nieKratko;
  switch (d) {
    case 2: return vypln(kt.k2, { c: r.c, par: r.plati ? kt.parna : kt.neparna });
    case 5: return vypln(kt.k5, { c: r.c, ok: r.plati ? kt.k5ok : kt.k5nie });
    case 10: return vypln(kt.k10, { c: r.c, ok: r.plati ? kt.k10ok : kt.k10nie });
    case 100: return r.kratke ? kt.k100kratke : vypln(kt.k100, { cc: r.cc });
    case 3: case 9: {
      let t;
      if (!r.ret.length) t = vypln(kt.kSucetJedno, { s: n });
      else {
        let retaz = r.cifry.join(' + ') + ' = <b>' + r.ret[0] + '</b>';
        for (let i = 1; i < r.ret.length; i++) retaz += ' → ' + String(r.ret[i - 1]).split('').join(' + ') + ' = <b>' + r.ret[i] + '</b>';
        t = vypln(kt.kSucet, { retaz });
      }
      return t + vypln(kt.kSucetKoniec, { s: r.s, je: je(r.plati), d });
    }
    case 4: {
      const rozpis = r.t % 4 === 0 ? ` (${r.t} = ${r.t / 4} · 4)` : '';
      return vypln(r.jedno ? kt.k4jedno : kt.k4, { t: r.t, je: je(r.plati), rozpis });
    }
    case 6: return vypln(kt.k6, { a: r.a ? T.ui.ano : T.ui.nie, b: r.b ? T.ui.ano : T.ui.nie });
  }
}
function overKriteria(animovat) {
  K.zrus();
  const n = K.n, kt = T.kriteria, delenim = $('#k_delenim').checked;
  const vysl = MAT.CRITERIA.map(d => ({ d, r: MAT.criterion(d, n) }));
  $('#k_riadky').innerHTML = vysl.map(({ d }) =>
    `<div class="riadok caka" data-d="${d}"><span class="znak">÷ ${d}</span><span class="postup">${kt.caka}</span><span class="verdikt">…</span>` +
    `<span class="delenie" ${delenim ? '' : 'hidden'}></span></div>`).join('');
  $('#k_zhrnutie').innerHTML = '';
  const riadky = $$('#k_riadky .riadok');
  const zapni = i => {
    const { d, r } = vysl[i], el = riadky[i];
    el.classList.remove('caka'); el.classList.add(r.plati ? 'ano' : 'nie');
    $('.postup', el).innerHTML = postupKriteria(d, n, r);
    $('.verdikt', el).innerHTML = (r.plati ? '✓ ' : '✗ ') + (r.plati ? kt.je : kt.nieJe);
    const zv = n % d, ok = (zv === 0) === r.plati;
    $('.delenie', el).innerHTML = vypln(kt.delRiadok, { n, d, q: Math.floor(n / d), r: zv }) + (ok ? ` <span class="ok">✓ ${kt.zhoda}</span>` : ' <span class="zle">✗</span>');
  };
  const zhrn = () => {
    const ano = vysl.filter(x => x.r.plati).map(x => x.d);
    $('#k_zhrnutie').innerHTML = ano.length ? vypln(kt.zhrnutie, { n, zoznam: ano.join(', ') }) : vypln(kt.zhrnutieZiadne, { n });
  };
  if (animovat) K.zrus = postupne(vysl.length, 420, zapni, zhrn);
  else { vysl.forEach((_, i) => zapni(i)); zhrn(); }
  kresliRozpis();
}
// Pre zvedavých: 7524 = 7 · 1000 + … = (7 · 999 + …) + (7 + 5 + 2 + 4)
function kresliRozpis() {
  const n = K.n, kt = T.kriteria, s = String(n), c = s.split('').map(Number), L = s.length;
  if (L === 1) { $('#k_rozpis').innerHTML = kt.zvedJedno; return; }
  const rad = i => 10 ** (L - 1 - i);
  const r1 = c.map((d, i) => i < L - 1 ? `${d} · ${rad(i)}` : `${d}`).join(' + ');
  const r2a = c.slice(0, L - 1).map((d, i) => `${d} · ${rad(i) - 1}`).join(' + ');
  const sucet = c.reduce((a, b) => a + b, 0), A = n - sucet;
  $('#k_rozpis').innerHTML = `<div>${n} = ${r1}</div>` +
    `<div>${n} = <span class="z1">(${r2a})</span> + <span class="z2">(${c.join(' + ')})</span></div>` +
    `<div>${n} = <span class="z1">${A}</span> + <span class="z2">${sucet}</span></div>` +
    `<p style="margin:8px 0 0">${A ? vypln(kt.zvedA, { A, A9: A / 9 }) : kt.zvedA0}</p>`;
}

/* =====================================================================
   KARTA 3: PRVOČÍSLA – SITO
   stav[i]: 0 = ešte neviem, 1 = prvočíslo, 2 = zosvetlené (zložené), 3 = číslo 1
   ===================================================================== */
const SITO = { stav: [], kto: [], zrus: () => {}, bezi: false, fokus: 2 };
function initSito() {
  let h = ''; for (let i = 1; i <= 100; i++) h += `<button type="button" role="gridcell" data-i="${i}" tabindex="-1">${i}</button>`;
  $('#p_sito').innerHTML = h; $('#p_sito').setAttribute('aria-label', T.prvo.sitoPopis);
  $$('#p_sito button').forEach(b => b.onclick = () => { zastavSito(); sitoKlik(+b.dataset.i); });
  // šípky v mriežke (počet stĺpcov podľa šírky)
  $('#p_sito').addEventListener('keydown', e => {
    const st = getComputedStyle($('#p_sito')).gridTemplateColumns.split(' ').length;
    const posun = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: st, ArrowUp: -st, Home: -100, End: 100 }[e.key];
    if (!posun) return;
    e.preventDefault(); sitoFokus(Math.min(100, Math.max(1, SITO.fokus + posun)), true);
  });
  $('#p_prehraj').onclick = () => SITO.bezi ? zastavSito() : prehrajSito();
  $('#p_znova').onclick = () => { zastavSito(); resetSito(); };
  resetSito();
}
function sitoFokus(i, zamer) {
  SITO.fokus = i;
  $$('#p_sito button').forEach(b => b.tabIndex = +b.dataset.i === i ? 0 : -1);
  if (zamer) $(`#p_sito button[data-i="${i}"]`).focus();
}
function resetSito() {
  SITO.stav = Array(101).fill(0); SITO.kto = Array(101).fill(0); SITO.stav[1] = 3;
  $$('#p_sito button').forEach(b => kresliBunku(+b.dataset.i));
  $('#p_sitoInfo').innerHTML = T.prvo.sitoStart;
  sitoFokus(2); sitoPocty(); tlacidloSita();
}
function kresliBunku(i) {
  const b = $(`#p_sito button[data-i="${i}"]`), s = SITO.stav[i];
  b.className = ['', 'p', 'z', 'j'][s];
  b.setAttribute('aria-label', i + (s === 1 ? ', prvočíslo' : s === 2 ? ', zložené' : s === 3 ? ', ani prvočíslo, ani zložené' : ''));
}
const sitoOcakavane = () => { for (let i = 2; i <= 100; i++) if (SITO.stav[i] === 0) return i; return null; };
function sitoPocty() {
  const k = SITO.stav.filter(s => s === 1).length, z = SITO.stav.filter(s => s === 2).length;
  $('#p_sitoPocet').innerHTML = vypln(T.prvo.sitoPocet, { k, z, o: 99 - k - z });
}
/* logika jedného ťuknutia na prvočíslo p (bez animácie) – vráti zoznam nových zosvetlených
   a príznak, či sa už všetko dokončilo (p · p > 100) */
function sitoKrokLogika(p) {
  SITO.stav[p] = 1;
  if (p * p > 100) {
    const zvysok = [];
    for (let i = p + 1; i <= 100; i++) if (SITO.stav[i] === 0) { SITO.stav[i] = 1; zvysok.push(i); }
    return { nove: [], koniec: true, zvysok };
  }
  const nove = [];

   uzol = { v: číslo, deti: [ľavý, pravý] | null }

const novyUzol = v => ({ v, deti: null, novy: true });
function listy(u, acc = []) { if (!u.deti) acc.push(u); else { listy(u.deti[0], acc); listy(u.deti[1], acc); } return acc; }
function rozdel(u, a) { u.deti = [novyUzol(a), novyUzol(u.v / a)]; }
// rozloženie: listy idú zľava doprava, rodič je v strede nad deťmi
function rozlozStrom(k) {
  let poc = 0, hlbka = 0;
  (function f(u, h) {
    u.h = h; hlbka = Math.max(hlbka, h);
    if (u.deti) { f(u.deti[0], h + 1); f(u.deti[1], h + 1); u.x = (u.deti[0].x + u.deti[1].x) / 2; }
    else u.x = poc++;
  })(k, 0);
  return { listov: poc, hlbka };
}
// SVG stromu; prvočíslo = zelený krúžok, zložené číslo = modrý obdĺžnik
function stromSVG(k, o = {}) {
  const W = 76, H = 84, { listov, hlbka } = rozlozStrom(k);
  const sirka = listov * W, vyska = (hlbka + 1) * H - 20;
  const X = u => u.x * W + W / 2, Y = u => u.h * H + 32;
  let hrany = '', uzly = '';
  (function f(u) {
    if (u.deti) for (const d of u.deti) { hrany += `<line data-ciel="${d === u.deti[0] ? 'l' : 'p'}" x1="${X(u)}" y1="${Y(u) + 24}" x2="${X(d)}" y2="${Y(d) - 24}" stroke="#a3adc6" stroke-width="2.5" class="${d.novy && o.anim ? 'nova' : ''}"/>`; f(d); }
    const prv = MAT.isPrime(u.v), klik = o.klik && !u.deti && MAT.isComposite(u.v), vyb = o.vybrany === u;
    const tvar = prv
      ? `<circle class="tvar" r="25" fill="rgba(127,220,143,.25)" stroke="#7fdc8f" stroke-width="3"/>`
      : `<rect class="tvar" x="-31" y="-24" width="62" height="48" rx="10" fill="${vyb ? 'rgba(243,180,83,.35)' : 'rgba(111,180,255,.15)'}" stroke="${vyb ? '#ffd88a' : klik ? '#6fb4ff' : 'rgba(111,180,255,.7)'}" stroke-width="${vyb || klik ? 3 : 2}" ${klik ? 'stroke-dasharray="6 4"' : ''}/>`;
    uzly += `<g class="uzol${klik ? ' klik' : ''}" data-id="${u.id}" transform="translate(${X(u)} ${Y(u)})" ${klik ? `tabindex="0" role="button" aria-label="rozlož ${u.v}"` : `aria-label="${u.v}${prv ? ', prvočíslo' : ''}"`}>` +
      tvar + `<text y="8" text-anchor="middle" fill="${prv ? '#d7ffdf' : '#fff'}" font-size="22" font-weight="800">${u.v}</text></g>`;
  })(k);
  const m = o.mierka || 1;
  return { svg: `<svg viewBox="0 0 ${sirka} ${vyska}" width="${Math.round(sirka * m)}" height="${Math.round(vyska * m)}" style="max-width:${o.plna ? 'none' : '100%'};height:auto;display:block;margin:0 auto">${hrany}${uzly}</svg>`, X, Y };
}

const N = T.nsd;

// náhodné číslo, ktoré má často spoločný deliteľ s číslom ine (aby NSD nebolo stále 1)
function nahodneSpolocne(ine, max) {
  if (Math.random() < .7 && ine > 1) {
    const d = MAT.divisors(ine).filter(x => x > 1 && x <= max), g = d[nahoda(0, d.length - 1)];
    return g * nahoda(1, Math.floor(max / g));
  }
  return nahoda(2, max);
}
// dve čísla a, b; zmena(a, b) sa volá, len keď sú obe platné
function vstupDvojice(obal, nast) {
  obal.innerHTML = `<div class="dvaVstupy"><div id="${obal.id}_a"></div><div id="${obal.id}_b"></div></div>`;
  const st = { a: nast.a, b: nast.b }, ok = { a: true, b: true };
  const zmen = () => { if (ok.a && ok.b) nast.zmena(st.a, st.b); };
  const vytvor = (k, popis) => vstupCisla($(`#${obal.id}_${k}`), {
    max: nast.max, hodnota: st[k], popis,
    zmena: n => { st[k] = n; ok[k] = true; zmen(); },
    chyba: () => { ok[k] = false; if (nast.chyba) nast.chyba(); },
    nahodne: () => nahodneSpolocne(k === 'a' ? st.b : st.a, nast.max)
  });
  const va = vytvor('a', N.vstupA), vb = vytvor('b', N.vstupB);
  return {
    va, vb, hodnoty: () => [st.a, st.b],
    nastav(a, b) { st.a = a; st.b = b; ok.a = ok.b = true; va.nastav(a, false, true); vb.nastav(b, false, true); zmen(); }
  };
}
// dva stĺpce deliteľov; faza 1 = len a, 2 = aj b, 3 = zvýraznené spoločné, 4 = označený NSD
function porovnanieDeliteluHTML(a, b, faza = 4) {
  const da = MAT.divisors(a), db = MAT.divisors(b), sa = new Set(da), sb = new Set(db);
  const g = Math.max(...da.filter(d => sb.has(d)));               // spôsob A: prienik zoznamov
  const cip = (d, druhy) => {
    const spol = faza >= 3 && druhy.has(d), nsd = faza >= 4 && d === g;
    return `<span class="dch${spol ? ' spol' : ''}${nsd ? ' nsd' : ''}">${nsd ? '★ ' : ''}${d}</span>`;
  };
  const stlpec = (n, ds, druhy, vid) => `<div class="dStlpec"${vid ? '' : ' style="visibility:hidden"'}><div class="dHlav">${vypln(N.delitele, { n })}</div>` +
    `<div class="dZoznam">${ds.map(d => cip(d, druhy)).join('')}</div></div>`;
  return `<div class="dPorov">${stlpec(a, da, sb, faza >= 1)}${stlpec(b, db, sa, faza >= 2)}</div>`;
}
const legendaDeliteluHTML = () => `<span><i class="dIny"></i>${N.legIny}</span><span><i class="dSpol"></i>${N.legSpol}</span><span><i class="dNsd"></i>${N.legNsd}</span>`;
// zlomok nad sebou
const zlomokHTML = (c, m, tr) => `<span class="zlomok${tr ? ' ' + tr : ''}"><span>${c}</span><span>${m}</span></span>`;

/* --- krokovač: Späť / Ďalej / Prehrať; kresli(i, smer) nakreslí krok i (smer 1 = dopredu) --- */
function krokovac(obal, nast) {
  const t = N.sposoby;
  obal.innerHTML = `<div class="tlac"><button type="button" data-k="-1">${T.ui.spat}</button>` +
    `<span class="muted krokPoc"></span><button type="button" class="primary" data-k="1">${T.ui.dalej}</button>` +
    `<button type="button" class="prehr">${t.prehraj}</button></div>`;
  const [spat, dalej] = $$('[data-k]', obal), prehr = $('.prehr', obal), poc = $('.krokPoc', obal);
  let i = 0, zrus = null;
  const n = () => nast.pocet();
  function idi(j, smer) {
    i = Math.max(0, Math.min(n() - 1, j));
    nast.kresli(i, smer);
    spat.disabled = i === 0; dalej.disabled = i >= n() - 1;
    poc.textContent = vypln(t.krok, { i: i + 1, n: n() });
  }
  function stop() { if (zrus) zrus(); zrus = null; prehr.textContent = t.prehraj; }
  spat.onclick = () => { stop(); idi(i - 1, -1); };
  dalej.onclick = () => { stop(); idi(i + 1, 1); };
  prehr.onclick = () => {
    if (zrus) { stop(); return; }
    if (i >= n() - 1) idi(0, 0);
    prehr.textContent = t.stop;
    zrus = postupne(Infinity, 2000, k => {
      if (k === 0) return true;                    // prvý „tik“ je hneď – počkáme na ďalší
      idi(i + 1, 1);
      return i < n() - 1;
    }, () => { zrus = null; prehr.textContent = t.prehraj; }, true);
  };
  return { reset() { stop(); idi(0, 0); }, idi, stop, krok: () => i };
}

/* --- B: Vennov diagram prvočiniteľov --- */
const VENN = { L: { x: 175, y: 155 }, P: { x: 325, y: 155 }, R: 125, stred: { L: [118, 155], P: [382, 155], M: [250, 155] } };
// voľné miesta (body mriežky) v oblasti 'L' (len ľavý kruh), 'P' (len pravý) alebo 'M' (prienik)
function vennSloty(oblast, krok) {
  const { L, P, R } = VENN, m = krok * .5, c = VENN.stred[oblast];
  let naj = [];
  for (const ox of [0, krok / 2]) for (const oy of [0, krok / 2]) {
    const body = [];
    for (let x = 250 + ox - krok * 10; x <= 480; x += krok) for (let y = 155 + oy - krok * 6; y <= 285; y += krok) {
      if (x < 20 || y < 34) continue;
      const dL = Math.hypot(x - L.x, y - L.y), dP = Math.hypot(x - P.x, y - P.y);
      const vL = dL < R - m, vP = dP < R - m, mimoL = dL > R + m * .5, mimoP = dP > R + m * .5;
      if ((oblast === 'L' && vL && mimoP) || (oblast === 'P' && vP && mimoL) || (oblast === 'M' && vL && vP)) body.push({ x, y });
    }
    if (body.length > naj.length) naj = body;
  }
  return naj.sort((p, q) => Math.hypot(p.x - c[0], p.y - c[1]) - Math.hypot(q.x - c[0], q.y - c[1]));
}
function vennData(a, b) {
  const fa = MAT.factorize(a), fb = MAT.factorize(b);
  const La = MAT.flatFactors(fa), Lb = MAT.flatFactors(fb), M = MAT.flatFactors(MAT.multisetIntersect(fa, fb));
  // každý spoločný prvočiniteľ spáruje jeden prvok zľava s jedným sprava (multiset – minimum počtov)
  const uA = new Set(), uB = new Set(), pary = [];
  for (const p of M) {
    const i = La.findIndex((x, k) => x === p && !uA.has(k)), j = Lb.findIndex((x, k) => x === p && !uB.has(k));
    uA.add(i); uB.add(j); pary.push([i, j]);
  }
  let L;
  for (const krok of [38, 33, 29, 25, 22, 19]) {                 // najväčšie krúžky, ktoré sa zmestia
    L = { krok, sL: vennSloty('L', krok), sP: vennSloty('P', krok), sM: vennSloty('M', krok) };
    if (L.sL.length >= La.length && L.sP.length >= Lb.length && L.sM.length >= M.length) break;
  }
  return { a, b, fa, fb, La, Lb, M, pary, uA, uB, L };
}
// polohy krúžkov vo fáze f (1 = ľavé, 2 = aj pravé, 3 a 4 = spoločné v prieniku)
function vennPozicie(V, f) {
  const vezmi = (s, k) => s.slice(0, k).sort((p, q) => p.y - q.y || p.x - q.x);
  const A = [], B = [];
  if (f >= 3) {
    const sM = vezmi(V.L.sM, V.M.length);
    V.pary.forEach(([i, j], k) => { A[i] = { ...sM[k], o: 1, m: true }; B[j] = { ...sM[k], o: 0, m: true }; });
    const sL = vezmi(V.L.sL, V.La.length - V.M.length), sP = vezmi(V.L.sP, V.Lb.length - V.M.length);
    let k = 0; V.La.forEach((_, i) => { if (!V.uA.has(i)) A[i] = { ...sL[k++], o: 1 }; });
    k = 0; V.Lb.forEach((_, j) => { if (!V.uB.has(j)) B[j] = { ...sP[k++], o: 1 }; });
  } else {
    const sL = vezmi(V.L.sL, V.La.length), sP = vezmi(V.L.sP, V.Lb.length);
    V.La.forEach((_, i) => { A[i] = { ...sL[i], o: f >= 1 ? 1 : 0 }; });
    V.Lb.forEach((_, j) => { B[j] = { ...sP[j], o: f >= 2 ? 1 : 0 }; });
  }
  return { A, B };
}

/* --- C: Euklidov algoritmus – obdĺžnik, z ktorého odrezávame štvorce --- */
function euklidSVG(a, b, k) {
  const kroky = MAT.euclidSteps(a, b), A = kroky[0].a, B = kroky[0].b;
  const s = Math.min(560 / A, 300 / B), FARBY = ['#6fb4ff', '#7fdc8f', '#b9a3ff', '#ff9ad5', '#7fdcd8', '#ffb37a'];
  let x = 0, y = 0, w = A, h = B, g = '';
  for (let i = 0; i < k; i++) {
    const { q, b: d, r } = kroky[i], posl = i === kroky.length - 1, farba = posl ? '#f3b453' : FARBY[i % FARBY.length];
    const vodor = w >= h, px = d * s, sw = Math.min(2, Math.max(.4, px / 20));
    if (q <= 60) {
      for (let j = 0; j < q; j++) {
        const sx = (vodor ? x + j * d : x) * s, sy = (vodor ? y : y + j * d) * s;
        g += `<rect x="${sx}" y="${sy}" width="${px}" height="${px}" fill="${farba}" fill-opacity="${posl ? .5 : .25}" stroke="${farba}" stroke-width="${sw}"/>`;
        if (px >= 34) g += `<text x="${sx + px / 2}" y="${sy + px / 2 + 7}" text-anchor="middle" font-size="${Math.min(22, px / 3)}" fill="#fff" font-weight="700">${d}</text>`;
      }
    } else {
      // veľa malých štvorcov – nakreslíme ich ako jeden pás
      const bw = vodor ? q * d * s : px, bh = vodor ? px : q * d * s;
      g += `<rect x="${x * s}" y="${y * s}" width="${bw}" height="${bh}" fill="${farba}" fill-opacity=".3" stroke="${farba}" stroke-width="1"/>`;
    }
    if (vodor) { x += q * d; w = r; } else { y += q * d; h = r; }
  }
  if (k < kroky.length && w > 0 && h > 0)
    g += `<rect x="${x * s}" y="${y * s}" width="${w * s}" height="${h * s}" fill="none" stroke="#ffd88a" stroke-width="3" stroke-dasharray="8 5"/>`;
  const W = A * s, H = B * s;
  return `<svg viewBox="-62 -36 ${W + 72} ${H + 46}" class="euklid" role="img" aria-label="Obdĺžnik ${A} × ${B}">` +
    `<rect x="0" y="0" width="${W}" height="${H}" fill="rgba(255,255,255,.03)" stroke="#a3adc6" stroke-width="2"/>${g}` +
    `<text x="${W / 2}" y="-12" text-anchor="middle" fill="#a3adc6" font-size="20">${A}</text>` +
    `<text x="-10" y="${H / 2 + 7}" text-anchor="end" fill="#a3adc6" font-size="20">${B}</text></svg>`;
}
function kresliEuklid(i, smer) {

const SCENY = {
  dlazba(v, s) { const g = MAT.gcd(v, s); return { g, x: v / g, y: s / g, n: (v / g) * (s / g) }; },
  balicky(j, h) { const g = MAT.gcd(j, h); return { g, x: j / g, y: h / g }; },

   NSD: karta NSD troch čísel – tabuľka exponentov
   ===================================================================== */
// koľkokrát je každé prvočíslo v rozklade; v každom stĺpci minimum (NSD) a maximum (NSN)
function tabulkaTri(cisla) {
  const f = cisla.map(MAT.factorize);
  const prv = [...new Set(f.flatMap(x => x.map(([p]) => p)))].sort((x, y) => x - y);
  const exp = f.map(fi => { const m = new Map(fi); return prv.map(p => m.get(p) || 0); });
  const min = prv.map((_, j) => Math.min(...exp.map(r => r[j])));
  const spol = prv.map((p, j) => [p, min[j]]).filter(([, e]) => e > 0);
  const max = prv.map((_, j) => Math.max(...exp.map(r => r[j]))), vsetky = prv.map((p, j) => [p, max[j]]);
  return { f, prv, exp, min, spol, g: MAT.product(spol), max, vsetky, l: MAT.product(vsetky) };
}
const nsdZTabulky = cisla => tabulkaTri(cisla).g;
// typ 'min' = NSD (najmenší počet v stĺpci), 'max' = NSN (najväčší počet)
function tabulkaTriHTML(cisla, typ = 'min') {
  const t = N.tri, D = tabulkaTri(cisla), hod = typ === 'max' ? D.max : D.min, vys = typ === 'max' ? D.vsetky : D.spol;
  const riadky = cisla.map((n, i) => `<tr><th>${n}</th>${D.exp[i].map((e, j) => `<td class="${e === hod[j] ? 'min' : ''}">${e}</td>`).join('')}` +
    `<td class="roz">${n === 1 ? t.jedna : MAT.formatFactors(D.f[i])}</td></tr>`).join('');
  return `<div class="tabObal"><table class="exp"><thead><tr><th>${t.hlavicka}</th>${D.prv.map(p => `<th>${p}</th>`).join('')}<th>${t.rozklad}</th></tr></thead>` +
    `<tbody>${riadky}<tr class="minRiadok"><th>${typ === 'max' ? T.nsn.tri.maximum : t.minimum}</th>${hod.map(e => `<td>${e}</td>`).join('')}<td class="roz">${vys.length ? MAT.formatFactors(vys) : '1'}</td></tr></tbody></table></div>`;
}

function specialnePripady(a, b) {
  const r = [], m = Math.min(a, b), M = Math.max(a, b);
  if (m === 1) r.push('jedna');
  if (a === b) r.push('rovnake');
  else if (m > 1 && M % m === 0) r.push('deli');
  if (m > 1 && MAT.coprime(a, b)) r.push('nesud');
  return r;
}

function pasyNasobkovSVG(a, b, lim = 500) {
  const X = v => 46 + v * (530 / lim), yA = 74, yB = 150, l = MAT.lcm(a, b);

  let g = '';
  for (let v = 0; v <= lim; v += lim / 5) g += `<line x1="${X(v)}" y1="${yA - 6}" x2="${X(v)}" y2="${yB + 6}" class="pMr"/><text x="${X(v)}" y="${yB + 46}" text-anchor="middle" class="pSt">${v}</text>`;
  for (const [y, n] of [[yA, a], [yB, b]]) g += `<line x1="${X(0)}" y1="${y}" x2="${X(lim)}" y2="${y}" class="pOs"/><text x="${X(0) - 10}" y="${y + 6}" text-anchor="end" class="pLbl">${n}</text>`;
  nA.filter(v => sB.has(v)).forEach(v => { g += `<line x1="${X(v)}" y1="${yA}" x2="${X(v)}" y2="${yB}" class="pSpol${v === l ? ' nsn' : ''}"/>`; });
  nA.forEach(v => { g += `<circle cx="${X(v)}" cy="${yA}" r="${rA}" class="pA${sB.has(v) ? ' sp' : ''}"/>`; if (krokA >= 28) g += `<text x="${X(v)}" y="${yA - 12}" text-anchor="middle" class="pCis">${v}</text>`; });
  nB.forEach(v => { g += `<rect x="${X(v) - rB}" y="${yB - rB}" width="${2 * rB}" height="${2 * rB}" class="pB${v % a === 0 ? ' sp' : ''}"/>`; if (krokB >= 28) g += `<text x="${X(v)}" y="${yB + 24}" text-anchor="middle" class="pCis">${v}</text>`; });
  if (l <= lim) g += `<text x="${X(l)}" y="${yA - 34}" text-anchor="middle" class="pNsn">★ ${l}</text>`;
  return `<svg viewBox="0 0 600 206" class="pasy" role="img" aria-label="${vypln(NN.nasobky, { n: a })}, ${vypln(NN.nasobky, { n: b })}">${g}</svg>`;
}

  el.innerHTML = `<div class="card" style="margin-top:16px"><h2>Testy: ${v.filter(x => x.ok).length} / ${v.length} prešlo</h2><table>${v.map(x => `<tr><td class="${x.ok ? 'ok' : 'zle'}">${x.ok ? '✓' : '✗'}</td><td>${x.test}</td><td>${x.dostal}</td><td>${x.ok ? '' : 'čakal: ' + x.cakal}</td></tr>`).join('')}</table></div>`;
  console.table(v);
  window.VYSLEDKY_TESTOV = v;
  return v;
}

init();
</script>
