</style>

   VÝPOČTY – začiatok. Čistá fyzika bez kreslenia (dá sa testovať samostatne).
   Uhly sú v stupňoch, čas v hodinách.
   ===================================================================== */
const DEG = Math.PI / 180;
const SKLON_OSI = 23.44;                 // sklon zemskej osi (°)
const LAT_KOSICE = 48.7, LON_KOSICE = 21.26;

/* Deklinácia Slnka δ – zemepisná šírka, nad ktorou je Slnko na poludnie v nadhlavníku.
   N = poradové číslo dňa (1 = 1. január). Pri sklone 0° je δ stále 0. */
function deklinacia(N, sklon = SKLON_OSI) {
  return sklon * Math.sin(2 * Math.PI * (N - 81) / 365);
}

/* Výška Slnka nad obzorom na poludnie.
   Zo zadania: 90° − φ + δ. To platí, keď je Slnko na poludnie na juhu (φ ≥ δ).
   Medzi obratníkmi môže byť Slnko na severe, preto používame všeobecný tvar 90° − |φ − δ|
   (napr. na rovníku 21. 6.: 90 − |0 − 23,44| = 66,6°, nie 113,4°). */
function poludnajsiaVyska(fi, delta) {
  return 90 - Math.abs(fi - delta);
}

/* Dĺžka dňa = (2/15) · arccos(−tan φ · tan δ) hodín.
   Okrajové prípady: ak je −tan φ · tan δ ≥ 1, Slnko nevyjde (polárna noc, 0 h);
   ak je ≤ −1, Slnko nezapadne (polárny deň, 24 h). Na samotnom póle je tan φ nekonečno. */
function dlzkaDna(fi, delta) {
  if (Math.abs(fi) >= 89.99) {
    if (Math.abs(delta) < 1e-9) return { hodiny: 12, typ: 'obzor' };
    return Math.sign(fi) * delta > 0 ? { hodiny: 24, typ: 'polarnyDen' } : { hodiny: 0, typ: 'polarnaNoc' };
  }
  const x = -Math.tan(fi * DEG) * Math.tan(delta * DEG);
  if (x >= 1) return { hodiny: 0, typ: 'polarnaNoc' };
  if (x <= -1) return { hodiny: 24, typ: 'polarnyDen' };
  return { hodiny: (2 / 15) * Math.acos(x) / DEG, typ: 'bezny' };
}

/* Výška Slnka v ľubovoľnú hodinu (miestny slnečný čas). H = hodinový uhol. */
function vyskaSlnka(fi, delta, hod) {
  const H = (hod - 12) * 15 * DEG, f = fi * DEG, d = delta * DEG;
  const s = Math.sin(f) * Math.sin(d) + Math.cos(f) * Math.cos(d) * Math.cos(H);
  return Math.asin(Math.max(-1, Math.min(1, s))) / DEG;
}

/* Azimut Slnka (0° = sever, 90° = východ, 180° = juh, 270° = západ). */
function azimutSlnka(fi, delta, hod) {
  const H = (hod - 12) * 15 * DEG, f = fi * DEG, d = delta * DEG;
  const A = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(f) - Math.tan(d) * Math.cos(f)) / DEG + 180;
  return (A % 360 + 360) % 360;
}

/* Časová rovnica v minútach (približne) – o koľko sa slnečné hodiny líšia od stredného času. */
function casovaRovnica(N) {
  const B = 2 * Math.PI * (N - 81) / 364;
  return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
}

/* Vzdialenosť Zeme od Slnka v mil. km (eliptická dráha, perihélium okolo 3. januára). */
const DRAHA_A = 149.6, DRAHA_E = 0.0167, PERIHELIUM_N = 3;
function anomalia(N) {
  const M = 2 * Math.PI * (N - PERIHELIUM_N) / 365.25;
  return M + 2 * DRAHA_E * Math.sin(M) + 1.25 * DRAHA_E * DRAHA_E * Math.sin(2 * M);
}
function vzdialenostOdSlnka(N) {
  return DRAHA_A * (1 - DRAHA_E * DRAHA_E) / (1 + DRAHA_E * Math.cos(anomalia(N)));
}

const sablona = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => k in o ? o[k] : m);
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

/* Dátum z poradového čísla dňa: 172 → „21. júna“ */
function datum(N, kratko) {
  let n = Math.floor(N), m = 0;
  while (m < 11 && n > DLZKY_MES[m]) { n -= DLZKY_MES[m]; m++; }
  return kratko ? `${n}. ${m + 1}.` : `${n}. ${TEXTY.mesiace[m]}`;
}

function fmtTrvanie(h) {
  const m = Math.round(h * 60);

}
/* Hodiny → „4:02“ */
function fmtCas(h) {
  let m = Math.round(h * 60); m = ((m % 1440) + 1440) % 1440;

  return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;

/* Obdobie podľa dátumu (astronomické hranice). Na juhu sú opačné. */
function obdobie(N) {
  if (!S.sklonOn) return TEXTY.obdobia.ziadne;
  let k = N >= 80 && N < 172 ? 'jar' : N >= 172 && N < 266 ? 'leto' : N >= 266 && N < 355 ? 'jesen' : 'zima';

/* =====================================================================
   3D geometria. Súradnice ekliptiky: X → jarný bod, Z → kolmo na rovinu dráhy.
   Os Zeme (rovníkový sever) = (0, sin ε, cos ε) – stále rovnaký smer (k Polárke).
   ===================================================================== */
function stavZeme(Ng, hod) {
  const sk = sklon(), eps = sk * DEG;
  const lam = TAU * (Ng - 81) / 365;                 // ekliptikálna dĺžka Slnka
  const d = deklinacia(Ng, sk) * DEG;                // deklinácia podľa vzorca zo zadania
  const aS = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)); // rektascenzia Slnka
  const X = [1, 0, 0], Y = [0, Math.cos(eps), -Math.sin(eps)], Z = [0, Math.sin(eps), Math.cos(eps)];
  const cd = Math.cos(d);
  const s = norm(add(add(mul(X, cd * Math.cos(aS)), Y, cd * Math.sin(aS)), Z, Math.sin(d))); // smer k Slnku
  return { X, Y, Z, s, aS, aObs: aS + (hod - 12) * 15 * DEG };
}
/* Kamera pre scénu: azimut a výška pohľadu. r = doprava, u = hore, d = k divákovi. */
function kameraScena(az, el) {
  const ca = Math.cos(az), sa = Math.sin(az), ce = Math.cos(el), se = Math.sin(el);
  return { r: [ca, -sa, 0], u: [sa * se, ca * se, ce], d: [-sa * ce, -ca * ce, se] };
}
/* Kamera pre detail Zeme */
function kameraDetail(es) {
  if (S.mod === 'scena') return kameraScena(S.az, S.el);
  if (S.mod === 'pol') {                               // nad pólom, Slnko vľavo
    const d = S.juh ? mul(es.Z, -1) : es.Z;
    let r = add(es.s, d, -dot(es.s, d));
    if (Math.hypot(...r) < 1e-6) r = [1, 0, 0];
    r = norm(mul(r, -1));
    return { r, u: cross(d, r), d };
  }
  const Zg = [0, 0, 1], sh = norm([es.s[0], es.s[1], 0]);   // zboku, Slnko vľavo vpredu
  const w = cross(Zg, sh), b = 35 * DEG;
  const d0 = norm(add(mul(w, Math.cos(b)), sh, Math.sin(b)));
  const e2 = (S.juh ? -14 : 14) * DEG;
  const d = add(mul(d0, Math.cos(e2)), Zg, Math.sin(e2));
  const u = add(mul(Zg, Math.cos(e2)), d0, -Math.sin(e2));
  return { r: cross(u, d), u, d };
}

/* =====================================================================

/* Text s tmavým podkladom */
function stitok(ctx, t, x, y, farba) {
  const w = ctx.measureText(t).width, al = ctx.textAlign;

  ctx.fillRect(x0 - 5, y - 11, w + 10, 22);
  ctx.fillStyle = farba || '#e2e8f5'; ctx.fillText(t, x, y + 1);

/* ===== Plátna ===== */
let DPR = 1;
const cvScena = $('#cvScena'), cvZem = $('#cvZem'), cvPas = $('#cvPas'), cvObloha = $('#cvObloha'),
  cvLuce = $('#cvLuce'), cvDraha = $('#cvDraha'), cvGVzd = $('#cvGVzd'), cvGVys = $('#cvGVys'), cvGDen = $('#cvGDen'),
  cvZat = $('#cvZat'), cvNebo = $('#cvNebo'), cvUzol1 = $('#cvUzol1'), cvUzol2 = $('#cvUzol2');
function nastavPlatno(cv, h) {
  const w = cv.clientWidth || 300;
  cv.style.height = h + 'px';
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv._w = w; cv._h = h;
}
function zacni(cv) {
  const ctx = cv.getContext('2d');
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, cv._w, cv._h);
  return { ctx, W: cv._w, H: cv._h };
}
let poslednaSirka = 0;
function rozmery() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const ws = cvScena.clientWidth;
  nastavPlatno(cvScena, Math.round(clamp(ws * 0.66, ws < 600 ? 270 : 320, Math.min(640, window.innerHeight * 0.72))));
  nastavPlatno(cvZem, Math.round(clamp(cvZem.clientWidth * 0.85, 280, 400)));
  nastavPlatno(cvPas, 62);
  nastavPlatno(cvObloha, 210);
  nastavPlatno(cvLuce, cvLuce.clientWidth < 520 ? 270 : 330);
  nastavPlatno(cvDraha, Math.round(clamp(cvDraha.clientWidth * 0.82, 240, 320)));
  for (const c of [cvGVzd, cvGVys, cvGDen]) nastavPlatno(c, Math.round(clamp(cvDraha.clientWidth * 0.82, 240, 320)));
  nastavPlatno(cvZat, Math.round(clamp(cvZat.clientWidth * 0.5, 230, 420)));
  nastavPlatno(cvNebo, Math.round(clamp(cvNebo.clientWidth * 0.62, 200, 280)));
  nastavPlatno(cvUzol1, 190); nastavPlatno(cvUzol2, 190);
  S.dirty = true; Z.dirty = true; kresliUzly();
}

/* ===== Hlavná scéna: Slnko a Zem na dráhe ===== */
const HVIEZDY = (() => { let x = 12345; const r = () => (x = (x * 16807) % 2147483647) / 2147483647; return Array.from({ length: 170 }, () => [r(), r(), r() * 1.2 + .3, r() * .6 + .25]); })();
let hitsScena = [], hitsZem = [];

function kresliScenu() {
  const { ctx, W, H } = zacni(cvScena);
  hitsScena = [];
  for (const [x, y, r, a] of HVIEZDY) { ctx.fillStyle = `rgba(220,230,255,${a})`; ctx.fillRect(x * W, y * H, r, r); }
  const cam = kameraScena(S.az, S.el), se = Math.max(Math.sin(S.el), 0.02);
  const Ro = Math.max(60, Math.min((W - 90) / 2.25, (H - (W < 600 ? 100 : 150)) / (2 * se + 0.5)));
  const Re = clamp(Ro * 0.13, 13, 44), Rs = clamp(Ro * 0.14, 14, 48);
  const cx = W / 2, cy = H / 2 - 6;
  const PS = v => [cx + Ro * dot(v, cam.r), cy - Ro * dot(v, cam.u), dot(v, cam.d)];
  const hl = S.hl;

  /* dráha */
  ctx.strokeStyle = hl === 'draha' ? 'rgba(255,216,138,.9)' : 'rgba(150,170,225,.5)'; ctx.lineWidth = hl === 'draha' ? 3 : 1.5;
  ctx.beginPath(); const op = [];
  for (let i = 0; i <= 160; i++) { const L = TAU * i / 160, p = PS([Math.cos(L), Math.sin(L), 0]); op.push([p[0], p[1]]); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }

  ctx.fillStyle = ctx.strokeStyle;

    const a = PS([Math.cos(L), Math.sin(L), 0]), b = PS([Math.cos(L + .04), Math.sin(L + .04), 0]);
    const an = Math.atan2(b[1] - a[1], b[0] - a[0]);

  const Ng = S.den + (S.hod - 12) / 24, es = stavZeme(Ng, S.hod);

  veci.push({ z: 0, f: () => {
    const g = ctx.createRadialGradient(cx, cy, Rs * .3, cx, cy, Rs * 3);
    g.addColorStop(0, 'rgba(255,200,90,.55)'); g.addColorStop(1, 'rgba(255,150,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, Rs * 3, 0, TAU); ctx.fill();
    const g2 = ctx.createRadialGradient(cx - Rs * .3, cy - Rs * .3, Rs * .1, cx, cy, Rs);
    g2.addColorStop(0, '#fff6d0'); g2.addColorStop(.55, '#ffd25a'); g2.addColorStop(1, '#f39a2c');
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(cx, cy, Rs, 0, TAU); ctx.fill();
    if (hl === 'slnko') { ctx.strokeStyle = '#ffd88a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, Rs + 6, 0, TAU); ctx.stroke(); }
    ctx.font = FONT(16, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    stitok(ctx, 'Slnko', cx, cy + Rs + 18, '#ffd88a');
    hitsScena.push({ k: 'slnko', pr: 3, c: [cx, cy, Rs + 4] });
  } });
  /* štyri kľúčové polohy */
  const Nint = denInt();
  TEXTY.kluceveDni.forEach(kd => {
    const e = stavZeme(kd.N, 12), pz = polohaZeme(e), p = PS(pz), Rg = Re * 0.62;
    let dd = Math.abs(kd.N - Ng) % 365; dd = Math.min(dd, 365 - dd);
    const aktivny = Math.abs(kd.N - Nint) < 1;
    veci.push({ z: p[2], f: () => {
      if (dd > 14) kresliZem(ctx, p[0], p[1], Rg, cam, e, { alpha: .55, osL: 1.7, tuSme: false });
      const k = 'den:' + kd.N;
      ctx.strokeStyle = aktivny || hl === k ? '#ffd88a' : 'rgba(243,180,83,.55)'; ctx.lineWidth = aktivny || hl === k ? 2.5 : 1.5;
      ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(p[0], p[1], Rg + 6, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      const dx = p[0] - cx, dy = p[1] - cy, l = Math.hypot(dx, dy) || 1;
      const off = Rg + 22 + (Math.abs(dx / l) > .6 ? 16 : 0);
      ctx.font = FONT(16, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const tx = clamp(p[0] + dx / l * off, 34, W - 34), ty = clamp(p[1] + dy / l * off, 14, H - 70);
      stitok(ctx, kd.kratko, tx, ty, aktivny ? '#ffd88a' : '#e2e8f5');
      hitsScena.push({ k, pr: 1, c: [p[0], p[1], Math.max(Rg + 8, 22)] });
      hitsScena.push({ k, pr: 1, c: [tx, ty, 22] });
    } });
  });
  /* aktuálna Zem */
  const pz = PS(polohaZeme(es));
  veci.push({ z: pz[2] + 0.001, f: () => {
    kresliZem(ctx, pz[0], pz[1], Re, cam, es, { hits: hitsScena, osL: 1.75, popisPolov: Re > 20 });
    if (hl === 'zem') { ctx.strokeStyle = '#ffd88a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(pz[0], pz[1], Re + 6, 0, TAU); ctx.stroke(); }
  } });
  veci.sort((a, b) => a.z - b.z).forEach(v => v.f());

  /* ukazovateľ smeru osi k Polárke (vpravo hore) */
  const zc = [dot(es.Z, cam.r), dot(es.Z, cam.u)], zl = Math.hypot(zc[0], zc[1]);
  const bx = W - 46, by = 110;
  ctx.strokeStyle = hl === 'polarka' ? '#ffd88a' : 'rgba(226,232,245,.85)'; ctx.lineWidth = 2;
  if (zl > 0.15) {
    const ex = bx + zc[0] / zl * 42 * Math.min(1, zl + .2), ey = by - zc[1] / zl * 42 * Math.min(1, zl + .2);

  stitok(ctx, 'k Polárke', bx - 8, by + 24, '#fff3c4');
  hitsScena.push({ k: 'polarka', pr: 1, c: [bx, by - 10, 36] });

function hviezdicka(ctx, x, y, r, f) {
  ctx.fillStyle = f; ctx.beginPath();

  ctx.fill();
}

/* ===== Detail Zeme ===== */
function kresliDetail() {
  const { ctx, W, H } = zacni(cvZem);
  hitsZem = [];
  const Ng = S.den + (S.hod - 12) / 24, es = stavZeme(Ng, S.hod), cam = kameraDetail(es);
  const R = Math.min(W, H) * 0.33, cx = W / 2, cy = H / 2 + 4;
  const sc = [dot(es.s, cam.r), dot(es.s, cam.u), dot(es.s, cam.d)], k = Math.hypot(sc[0], sc[1]);
  /* slnečné lúče prichádzajúce zo strany Slnka */
  if (k > 0.25) {
    const ux = sc[0] / k, uy = -sc[1] / k, px = -uy, py = ux;
    ctx.strokeStyle = S.hl === 'luce' ? '#ffd88a' : 'rgba(243,180,83,.7)'; ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 2;
    const seg = [];
    for (const o of [-0.8, -0.4, 0, 0.4, 0.8]) {
      const ox = cx + px * o * R, oy = cy + py * o * R, dIn = Math.sqrt(1 - o * o) * R + 8;
      const x1 = ox + ux * (R * 1.48), y1 = oy + uy * (R * 1.48), x2 = ox + ux * dIn, y2 = oy + uy * dIn;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 + ux * 9 + px * 5, y2 + uy * 9 + py * 5); ctx.lineTo(x2 + ux * 9 - px * 5, y2 + uy * 9 - py * 5); ctx.fill();
      seg.push([x1, y1], [x2, y2]);
    }
    hitsZem.push({ k: 'luce', pr: 2, pts: seg.slice(0, 2) }, { k: 'luce', pr: 2, pts: seg.slice(4, 6) }, { k: 'luce', pr: 2, pts: seg.slice(8, 10) });
    ctx.font = FONT(16, 600); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    stitok(ctx, 'Slnko', clamp(cx + ux * R * 1.4, 34, W - 34), clamp(cy + uy * R * 1.4 - (Math.abs(uy) < .5 ? R * .95 : 0), 14, H - 14), '#ffd88a');
  }
  const r = kresliZem(ctx, cx, cy, R, cam, es, { detail: true, hits: hitsZem, osL: 1.32, popisPolov: true, sirka: W });
  setText($('#zadu'), r.tuSmeVidno ? '' : TEXTY.ui.zadu);
}

/* ===== Panel „tu sme“ ===== */
const cache = new Map();
function setText(el, s, html) { if (cache.get(el) === s) return; cache.set(el, s); if (html) el.innerHTML = s; else el.textContent = s; }

function aktualizujPanel() {
  const T = TEXTY.tuSme, N = denInt(), fi = fiPoz(), sk = sklon();

  setText($('#tsCas'), fmtCas(S.hod));

  setText($('#tsPoludnie'), pol, true);

  const kde = Math.abs(fi - d) < 0.05 ? T.nadHlavou : fi > d ? T.naJuhu : T.naSevere;
  setText($('#tsVyska'), hn > 0 ? `<b>${nf(hn, 1)}°</b> <small>(${kde})</small>` : `<b>${nf(hn, 1)}°</b> <small>(${T.polarnaNoc})</small>`, true);
  const dl = dlzkaDna(fi, d);
  setText($('#tsDlzka'), `<b>${fmtTrvanie(dl.hodiny)}</b>` + (dl.typ === 'polarnyDen' ? `<br><small>${T.polarnyDen}</small>` : dl.typ === 'polarnaNoc' ? `<br><small>${T.polarnaNoc}</small>` : ''), true);
  setText($('#tsVZ'), dl.typ === 'bezny' ? `${fmtCas(12 - dl.hodiny / 2)} / ${fmtCas(12 + dl.hodiny / 2)}` : '—');

    const den = dd.typ === 'polarnyDen' ? '24 h ☀️' : dd.typ === 'polarnaNoc' ? '0 h 🌙' : fmtTrvanie(dd.hodiny);
    html += `<tr class="${m.n === 'Košice' ? 'ja' : ''}"><td>${nazov}</td><td>${den}</td><td>${v > 0 ? nf(v, 1) + '°' : T.podObz}</td></tr>`;

/* 24-hodinový pás: deň a noc */
function kresliPas() {
  const { ctx, W, H } = zacni(cvPas);
  const fi = fiPoz(), d = deklinacia(denInt(), sklon()), dl = dlzkaDna(fi, d);
  const x0 = 10, x1 = W - 10, y0 = 6, h = 24, X = t => x0 + (x1 - x0) * t / 24;
  ctx.fillStyle = '#251d52'; ctx.fillRect(x0, y0, x1 - x0, h);
  ctx.fillStyle = '#f3b453';
  if (dl.typ === 'polarnyDen') ctx.fillRect(x0, y0, x1 - x0, h);
  else if (dl.typ !== 'polarnaNoc') ctx.fillRect(X(12 - dl.hodiny / 2), y0, X(12 + dl.hodiny / 2) - X(12 - dl.hodiny / 2), h);
  ctx.font = FONT(16, 500); ctx.fillStyle = '#a3adc6'; ctx.textBaseline = 'top';
  for (const t of [0, 6, 12, 18, 24]) { ctx.textAlign = t === 0 ? 'left' : t === 24 ? 'right' : 'center'; ctx.fillText(t + ':00', X(t), y0 + h + 6); ctx.fillRect(X(t) - .5, y0 + h, 1, 4); }

/* Dráha Slnka po oblohe (pohľad na juh; na južnej pologuli na sever) */
function kresliOblohu() {
  const { ctx, W, H } = zacni(cvObloha);
  const fi = fiPoz(), sk = sklon(), c = S.juh ? 0 : 180;
  const y0 = H - 38, top = 16, kY = (y0 - top) / 90;
  const X = az => { let w = ((az - c + 540) % 360) - 180; return W / 2 + w / 180 * (W / 2 - 12); };
  const Y = alt => y0 - alt * kY;
  /* obloha a mriežka */
  const g = ctx.createLinearGradient(0, top, 0, y0); g.addColorStop(0, '#0d1a3a'); g.addColorStop(1, '#1d3566');
  ctx.fillStyle = g; ctx.fillRect(0, top, W, y0 - top);
  ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 1;
  for (const a of [30, 60]) { ctx.beginPath(); ctx.moveTo(0, Y(a)); ctx.lineTo(W, Y(a)); ctx.stroke(); }
  ctx.font = FONT(16, 500); ctx.fillStyle = 'rgba(163,173,198,.85)'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('30°', 4, Y(30) - 1); ctx.fillText('60°', 4, Y(60) - 1);
  /* zem a svetové strany */
  ctx.fillStyle = '#1c3020'; ctx.fillRect(0, y0, W, H - y0);
  ctx.strokeStyle = '#7fdc8f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();
  ctx.font = FONT(16, 700); ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  const strany = [[90, 'východ'], [180, 'juh'], [270, 'západ'], [0, 'sever']];
  for (const [az, t] of strany) {
    const x = X(az);
    if (x < 30 || x > W - 30) continue;
    ctx.fillStyle = (az === c) ? '#ffd88a' : '#e2e8f5'; ctx.fillText(t, x, y0 + 19);
  }
  /* dráhy Slnka */
  const draha = (N, styl, sirka) => {
    const d = deklinacia(N, sk);
    ctx.strokeStyle = styl; ctx.lineWidth = sirka; ctx.beginPath();
    let pen = false, px = 0;
    for (let h = 0; h <= 24.001; h += 0.1) {
      const alt = vyskaSlnka(fi, d, h);
      if (alt < 0) { pen = false; continue; }
      const x = X(azimutSlnka(fi, d, h)), y = Y(alt);
      if (pen && Math.abs(x - px) < W / 2) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      pen = true; px = x;
    }
    ctx.stroke();
  };
  if (S.sklonOn) { draha(172, 'rgba(255,122,107,.55)', 2); draha(355, 'rgba(111,180,255,.6)', 2); }
  draha(denInt(), '#f3b453', 4);
  /* Slnko teraz */
  const d = deklinacia(denInt(), sk), alt = vyskaSlnka(fi, d, S.hod);
  if (alt > -2) {
    const x = X(azimutSlnka(fi, d, S.hod)), y = Y(Math.max(alt, 0));
    ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#f39a2c'; ctx.lineWidth = 2; ctx.stroke();
  } else {
    ctx.font = FONT(16, 600); ctx.fillStyle = '#b9a3ff'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('Slnko je pod obzorom', W / 2, top + 6);
  }
}

/* ===== Uhol dopadu lúčov ===== */
function kresliLuce() {
  const { ctx, W, H } = zacni(cvLuce);
  const fi = fiPoz(), sk = sklon(), N = denInt();
  const gy = H - 64, gx = W * 0.6, px = clamp(W / 7.5, 44, 86);
  /* zem s mriežkou po 1 m */
  ctx.fillStyle = '#1c3020'; ctx.fillRect(0, gy, W, H - gy);
  ctx.strokeStyle = '#7fdc8f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  ctx.strokeStyle = 'rgba(127,220,143,.4)'; ctx.lineWidth = 1;
  for (let x = gx % px; x < W; x += px) { ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, gy + 10); ctx.stroke(); }
  const zvazok = (a, farba, plny) => {
    if (a <= 0.3) return null;
    const ar = a * DEG, L = px / Math.sin(ar), dx = -Math.cos(ar), dy = -Math.sin(ar), far = 3 * Math.max(W, H);
    const x1 = gx - L / 2, x2 = gx + L / 2;
    if (plny) {
      const g = ctx.createLinearGradient(gx + dx * 300, gy + dy * 300, gx, gy);
      g.addColorStop(0, 'rgba(243,180,83,.08)'); g.addColorStop(1, 'rgba(243,180,83,.4)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x1, gy); ctx.lineTo(x1 + dx * far, gy + dy * far); ctx.lineTo(x2 + dx * far, gy + dy * far); ctx.lineTo(x2, gy); ctx.fill();
      ctx.strokeStyle = 'rgba(255,216,138,.85)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 5; i++) { const x = x1 + (i + .5) / 5 * L; ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + dx * far, gy + dy * far); ctx.stroke(); }
    } else {
      ctx.strokeStyle = farba; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
      for (const x of [x1, x2]) { ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + dx * far, gy + dy * far); ctx.stroke(); }
      ctx.setLineDash([]);
    }
    return { x1, x2, L, dx, dy };
  };
  const aLeto = S.sklonOn ? poludnajsiaVyska(fi, deklinacia(172, sk)) : null;
  const aZima = S.sklonOn ? poludnajsiaVyska(fi, deklinacia(355, sk)) : null;
  if (aLeto !== null) zvazok(aLeto, 'rgba(255,122,107,.8)', false);
  if (aZima !== null) zvazok(aZima, 'rgba(111,180,255,.85)', false);
  const a = poludnajsiaVyska(fi, deklinacia(N, sk));
  const z = zvazok(a, null, true);
  /* osvetlené pásy na zemi */
  const pas = (aa, farba, y) => { if (aa === null || aa <= 0.3) return; const L = px / Math.sin(aa * DEG); ctx.fillStyle = farba; ctx.fillRect(clamp(gx - L / 2, 0, W), y, clamp(gx + L / 2, 0, W) - clamp(gx - L / 2, 0, W), 6); };
  pas(aLeto, '#ff7a6b', gy + 16); pas(aZima, '#6fb4ff', gy + 26);
  if (z) {
    ctx.fillStyle = '#ffd88a'; ctx.fillRect(clamp(z.x1, 0, W), gy - 3, clamp(z.x2, 0, W) - clamp(z.x1, 0, W), 7);
    /* uhol */
    ctx.strokeStyle = '#ffd88a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(z.x2, gy, 40, -Math.PI + a * DEG, -Math.PI, true); ctx.stroke();
    ctx.font = FONT(17, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const am = -Math.PI + a * DEG / 2;
    stitok(ctx, nf(a, 0) + '°', z.x2 + 62 * Math.cos(am) - (a < 25 ? 0 : 0), gy + 62 * Math.sin(am) - (a < 12 ? 12 : 0), '#ffd88a');
    /* Slnko a šírka zväzku 1 m */
    const D = Math.min((gx - 34) / Math.max(-z.dx, .01), (gy - 34) / Math.max(-z.dy, .01));
    const sx = gx + z.dx * D, sy = gy + z.dy * D;
    const g = ctx.createRadialGradient(sx, sy, 2, sx, sy, 26); g.addColorStop(0, '#fff6d0'); g.addColorStop(.5, '#ffd25a'); g.addColorStop(1, 'rgba(243,154,44,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, 26, 0, TAU); ctx.fill();
    const mx = gx + z.dx * D * 0.55, my = gy + z.dy * D * 0.55, nx = z.dy, ny = -z.dx;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(mx - nx * px / 2, my - ny * px / 2); ctx.lineTo(mx + nx * px / 2, my + ny * px / 2); ctx.stroke();
    ctx.font = FONT(16, 700); ctx.textAlign = 'left';
    stitok(ctx, '1 m', mx + Math.abs(nx) * px / 2 + 10, my + 4, '#fff');
    ctx.textAlign = 'center';
    stitok(ctx, `${TEXTY.luce.pas}: ${nf(z.L / px, 1)} m`, clamp(gx, 110, W - 110), gy + 46, '#ffd88a');
  }
  /* texty pod obrázkom */
  const dTxt = datum(N);
  setText($('#luceText'), a > 0.3
    ? sablona(TEXTY.luce.vysledok, { d: dTxt, a: nf(a, 0), l: nf(1 / Math.sin(a * DEG), 2), p: nf(100 * Math.sin(a * DEG), 0) })
    : sablona(TEXTY.luce.podObzorom, { d: dTxt }), true);
  setText($('#luceRef'), S.sklonOn
    ? `21. 6.: ${nf(aLeto, 0)}° → ${nf(1 / Math.sin(aLeto * DEG), 2)} m · 21. 12.: ${nf(aZima, 0)}° → ${aZima > 0 ? nf(1 / Math.sin(aZima * DEG), 2) + ' m' : '—'}`
    : TEXTY.obdobia.ziadne);
}

/* ===== Časté omyly: skutočná dráha a grafy ===== */
function kresliOmyl() {
  const N = denInt(), Ng = S.den + (S.hod - 12) / 24;
  { /* dráha v správnom tvare (pohľad zhora) */
    const { ctx, W, H } = zacni(cvDraha);
    const Rp = Math.min(W, H) * 0.36, LP = 103 * DEG;
    const ecc = DRAHA_E, cx0 = W / 2, cy0 = H / 2 + 12;
    const smer = L => [-Math.sin(L), -Math.cos(L)];          // rovnaká orientácia ako scéna zhora
    const sp = smer(LP), fx = cx0 + sp[0] * ecc * Rp, fy = cy0 + sp[1] * ecc * Rp;   // Slnko v ohnisku
    const bod = nu => { const r = (1 - ecc * ecc) / (1 + ecc * Math.cos(nu)) * Rp, d = smer(LP + nu); return [fx + d[0] * r, fy + d[1] * r]; };
    ctx.setLineDash([5, 6]); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx0, cy0, Rp, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(111,180,255,.9)'; ctx.lineWidth = 2.5; ctx.beginPath();
    for (let i = 0; i <= 200; i++) { const p = bod(TAU * i / 200); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
    ctx.stroke();
    const g = ctx.createRadialGradient(fx, fy, 1, fx, fy, 16); g.addColorStop(0, '#fff6d0'); g.addColorStop(.5, '#ffd25a'); g.addColorStop(1, 'rgba(243,154,44,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy, 16, 0, TAU); ctx.fill();
    ctx.font = FONT(16, 600); ctx.textBaseline = 'middle';
    const pp = bod(0), pa = bod(Math.PI);
    /* značky perihélia a afélia + popisy vo vnútri dráhy */
    for (const [p, t] of [[pp, 'najbližšie'], [pa, 'najďalej']]) {

/* =====================================================================
   ZATMENIA – schematický bočný pohľad (nie v mierke).
   Geometria tieňa: dotyčnice zo Slnka k Mesiacu (resp. k Zemi).
   Typ zatmenia u pozorovateľa určujeme z uhlových polomerov Slnka a Mesiaca.

const Z = { mod: 'slnko', hraj: true, pol: -80, vzd: 20, poz: 0, dirty: true };

/* Prekryv dvoch kruhov (polomery r1, r2, vzdialenosť stredov d) – plocha */
function prekryv(r1, r2, d) {
  if (d >= r1 + r2) return 0;
  if (d <= Math.abs(r1 - r2)) return Math.PI * Math.min(r1, r2) ** 2;
  const a = r1 * r1 * Math.acos((d * d + r1 * r1 - r2 * r2) / (2 * d * r1)), b = r2 * r2 * Math.acos((d * d + r2 * r2 - r1 * r1) / (2 * d * r2));

  const typ = ab + as <= am ? 'uplne' : (ab + am <= as ? 'prstencove' : (ab < as + am ? 'ciastocne' : 'ziadne'));
  return { typ, as, am, b, kryt: prekryv(as, am, ab) / (Math.PI * as * as) };

/* Vyhľadanie objektu pod prstom/myšou */
function najdi(hits, x, y, tol) {
  let best = null, bs = 1e9;
  for (const h of hits) {
    let d;
    if (h.c) d = Math.max(0, Math.hypot(x - h.c[0], y - h.c[1]) - h.c[2]);
    else {
      d = 1e9; const p = h.pts;
      for (let i = 0; i < p.length - 1; i++) {
        const ax = p[i][0], ay = p[i][1], bx = p[i + 1][0], by = p[i + 1][1], dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
        const t = clamp(((x - ax) * dx + (y - ay) * dy) / l2, 0, 1);
        d = Math.min(d, Math.hypot(x - ax - t * dx, y - ay - t * dy));
      }
    }
    if (d > tol) continue;
    const sk = h.pr * 100 + d;
    if (sk < bs) { bs = sk; best = h; }
  }
  return best;
}
function interakcia(cv, getHits, otacaj) {
  let dole = null, tahal = false;
  cv.addEventListener('pointerdown', e => { dole = { x: e.clientX, y: e.clientY, az: S.azT, el: S.elT, typ: e.pointerType }; tahal = false; });
  cv.addEventListener('pointermove', e => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (dole && otacaj) {
      const dx = e.clientX - dole.x, dy = e.clientY - dole.y;
      if (!tahal && Math.hypot(dx, dy) > 7) { tahal = true; cv.classList.add('drag'); try { cv.setPointerCapture(e.pointerId); } catch (_) {} skryBublinu(true); }
      if (tahal) {
        S.azT = S.az = dole.az - dx * 0.007;
        if (dole.typ === 'mouse') S.elT = S.el = clamp(dole.el + dy * 0.006, 3 * DEG, 90 * DEG);
        nastavPohladTlacidla(null); S.dirty = true;
      }
      return;
    }
    if (e.pointerType === 'mouse') {
      const h = najdi(getHits(), x, y, 9);
      cv.style.cursor = h ? 'pointer' : (otacaj ? 'grab' : 'default');
      if (h) { if (S.hl !== h.k || bub.hidden) ukazBublinu(h.k, e.clientX, e.clientY, false); }
      else skryBublinu();
    }
  });
  const koniec = e => {
    if (dole && !tahal && e.type === 'pointerup') {
      const r = cv.getBoundingClientRect(), h = najdi(getHits(), e.clientX - r.left, e.clientY - r.top, e.pointerType === 'mouse' ? 9 : 20);
      if (h) {
        if (h.k.startsWith('den:')) skocNaDen(+h.k.slice(4));

      } else skryBublinu(true);
    }
    dole = null; tahal = false; cv.classList.remove('drag');
  };
  cv.addEventListener('pointerup', koniec);
  cv.addEventListener('pointercancel', koniec);
  cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !dole) skryBublinu(); });
}

  const kk = Math.min(1, dt * 6);
  if (Math.abs(S.azT - S.az) > 1e-4 || Math.abs(S.elT - S.el) > 1e-4) { S.az += (S.azT - S.az) * kk; S.el += (S.elT - S.el) * kk; S.dirty = true; }
  if (S.dirty) {
