function obnovHviezdy() {
  $('#pocetHviezd').textContent = STAV.hviezdy;
  $('#hviezdy').setAttribute('aria-label', fmt(T.hviezdy.aria, { n: STAV.hviezdy }));
}
// pridá hviezdičku; ak smie, hviezdička preletí od prvku `odkial` do rohu
function pridajHviezdu(odkial) {
  const ciel = $('#hviezdy');
  const hotovo = () => { STAV.hviezdy++; obnovHviezdy(); odskok(ciel, 12); };
  if (!smieHybat() || !odkial) { hotovo(); return; }
  const a = odkial.getBoundingClientRect(), b = ciel.getBoundingClientRect();
  const x0 = a.left + a.width / 2 - 22, y0 = a.top + a.height / 2 - 22;
  const x1 = b.left + 10, y1 = b.top + b.height / 2 - 22;
  const hv = h('span', { class: 'letiacaHviezda', 'aria-hidden': 'true' }, '★');
  document.body.append(hv);
  tween(750, p => {
    const q = ease.inOut(p);
    const x = x0 + (x1 - x0) * q, y = y0 + (y1 - y0) * q - 90 * Math.sin(Math.PI * q);
    hv.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(1 + 0.5 * Math.sin(Math.PI * p)).toFixed(2)})`;
    hv.style.left = '0'; hv.style.top = '0';
  }, () => { hv.remove(); hotovo(); });
}

/* =====================================================================
   CIFERNÍK – spoločný komponent celej aplikácie
   vytvorCifernik({ model, karta, onTukni(ruka), onZmena({delta, ruka}), onPustenie(), onCislo(h) })
   Nastavenie počas behu: c.nastav({ tahat: 'minuta' | 'hodina' | null, tukat: bool, cisla: bool })
   Ruky: 'hodina' (malá, krátka, hrubá, okrúhly koniec) a 'minuta' (veľká, dlhá, tenká, špicatá).
   Časť 2 pridala: tahat: 'obe', drzMinuty (malá ručička mení len hodinu), vysec, duchCasu,
   zamenené ručičky (zamen, animujZamenu), volna (priesvitná „chýbajúca“ ručička), farebný digitálny čas.
   Časť 4 pridala: sekundy(uhol) – tenká sekundová ručička.
   ===================================================================== */
function vytvorCifernik({ model, karta = null, krok = null, format12 = true, onTukni, onZmena, onPustenie, onCislo } = {}) {
  const nast = { tahat: null, tukat: false, cisla: false, drzMinuty: false };
  const dajKrok = () => (krok ? krok() : STAV.karty[karta].krok);
  // ručička sa dá ťahať, ak je zvolená ona alebo obe
  const jeTahatelna = meno => nast.tahat === meno || nast.tahat === 'obe';
  let animacia = null, tah = null;
  // plynulé zobrazenie: počas ťahania a dobiehania sa ručičky kreslia podľa prsta, nie podľa modelu
  let zobrazenie = null, dobeh = null, zobrazeneUhly = { um: 0, uh: 0 };
  let zamena = 0;   // 0 = ručičky na svojom mieste, 1 = zamenené (Hodinárova dielňa)

  const svg = s('svg', { viewBox: '0 0 400 400', class: 'cifernik', role: 'group', 'aria-label': T.cifernik.aria });
  // telo hodín
  svg.append(
    s('circle', { cx: 200, cy: 200, r: 196, fill: '#d9772f' }),
    s('circle', { cx: 200, cy: 200, r: 190, fill: '#f3b453' }),
    s('circle', { cx: 200, cy: 200, r: 177, fill: 'var(--cifernik)' })
  );
  // výseč koláča: koľko z kola prešla veľká ručička (Polhodina, Štvrťhodina)
  const vysecEl = s('path', { fill: '#9be3a8', opacity: 0, 'aria-hidden': 'true' });
  svg.append(vysecEl);
  // pás postupu „jedno kolo“ (karta Spoznaj hodiny)
  const OBVOD = 2 * Math.PI * 183;
  const pas = s('circle', { cx: 200, cy: 200, r: 183, fill: 'none', stroke: '#3fb85a', 'stroke-width': 12, 'stroke-linecap': 'round',
    transform: 'rotate(-90 200 200)', 'stroke-dasharray': `0 ${OBVOD}`, opacity: 0 });
  svg.append(pas);
  // minútové značky, výraznejšie pri 5-minútových polohách
  const znacky = s('g', { 'aria-hidden': 'true' });
  for (let i = 0; i < 60; i++) {
    const velka = i % 5 === 0;
    const [x1, y1] = bodNaKruhu(velka ? 156 : 165, i * 6), [x2, y2] = bodNaKruhu(173, i * 6);
    znacky.append(s('line', { x1: x1.toFixed(2), y1: y1.toFixed(2), x2: x2.toFixed(2), y2: y2.toFixed(2),
      stroke: velka ? '#3a3022' : '#9a8d74', 'stroke-width': velka ? 5 : 2, 'stroke-linecap': 'round' }));
  }
  svg.append(znacky);
  // šípka posunu malej ručičky o jednu číslicu
  const sipka = s('g', { 'aria-hidden': 'true', opacity: 0 });
  const sipkaObluk = s('path', { fill: 'none', stroke: '#c95d26', 'stroke-width': 8, 'stroke-linecap': 'round' });
  const sipkaHrot = s('path', { fill: '#c95d26' });
  sipka.append(sipkaObluk, sipkaHrot);
  // číslice 1 až 12 (+ zvýraznenie a ťukacia plocha)
  const cisla = s('g', { class: 'bezTukania' });
  const zvyraznenia = [], cislice = [];
  for (let n = 1; n <= 12; n++) {
    const [x, y] = bodNaKruhu(126, n * 30);
    const zv = s('circle', { cx: x.toFixed(2), cy: y.toFixed(2), r: 31, class: 'cisloZvyraznenie', opacity: 0 });
    const t = s('text', { x: x.toFixed(2), y: (y + 15).toFixed(2), 'text-anchor': 'middle', class: 'cislo', 'aria-hidden': 'true' });
    t.textContent = n;
    const hit = s('circle', { cx: x.toFixed(2), cy: y.toFixed(2), r: 32, class: 'cisloHit', 'data-cislo': n });
    hit.addEventListener('click', () => { if (nast.cisla && !animacia && onCislo) onCislo(n); });
    zvyraznenia[n] = zv; cislice[n] = t;
    cisla.append(zv, t, hit);
  }
  svg.append(cisla, sipka);
  // duch malej ručičky (nápoveda: „daj ručičku sem“)
  const duch = s('g', { opacity: 0, 'aria-hidden': 'true' });
  duch.append(
    s('line', { x1: 200, y1: 200, x2: 200, y2: 108, stroke: '#a8481a', 'stroke-width': 20, 'stroke-linecap': 'round', 'stroke-dasharray': '2 14', opacity: 0.55 }),
    s('circle', { cx: 200, cy: 108, r: 21, fill: 'none', stroke: '#a8481a', 'stroke-width': 4, 'stroke-dasharray': '6 6' })
  );
  // duch veľkej ručičky (nápoveda „daj ručičky sem“ pri hrách s minútami)
  const duchMin = s('g', { opacity: 0, 'aria-hidden': 'true' });
  duchMin.append(
    s('line', { x1: 200, y1: 200, x2: 200, y2: 34, stroke: '#2f6fc0', 'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-dasharray': '2 12', opacity: 0.6 }),
    s('circle', { cx: 200, cy: 42, r: 16, fill: 'none', stroke: '#2f6fc0', 'stroke-width': 4, 'stroke-dasharray': '6 6' })
  );
  svg.append(duchMin, duch);

  // ručičky: halo (zvýraznenie), telo, guľôčka, široká neviditeľná plocha na chytenie, rámik fokusu
  function ruka(meno) {
    const g = s('g', { class: 'ruc', 'data-ruka': meno, 'aria-label': meno === 'hodina' ? T.cifernik.hodinova : T.cifernik.minutova });
    if (meno === 'minuta') {
      const tvar = 'M200 226 L193 200 L196.5 60 L200 24 L203.5 60 L207 200 Z';
      g.append(
        s('path', { d: tvar, class: 'halo', fill: 'none', stroke: '#ffd88a', 'stroke-width': 14, 'stroke-linejoin': 'round' }),
        s('circle', { cx: 200, cy: 42, r: 20, class: 'halo', fill: '#ffd88a' }),
        s('path', { d: tvar, fill: 'var(--minutova)', stroke: '#1d4f8f', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }),
        s('circle', { cx: 200, cy: 42, r: 10.5, fill: '#1d4f8f', stroke: '#fff', 'stroke-width': 3 }),
        s('line', { x1: 200, y1: 150, x2: 200, y2: 30, class: 'hit', 'stroke-width': 62 }),
        s('circle', { cx: 200, cy: 42, r: 40, class: 'hit gula' }),
        s('circle', { cx: 200, cy: 42, r: 30, class: 'fokus', fill: 'none', stroke: '#d9772f', 'stroke-width': 4, 'stroke-dasharray': '7 5' })
      );
    } else {
      g.append(
        s('line', { x1: 200, y1: 214, x2: 200, y2: 108, class: 'halo', stroke: '#ffd88a', 'stroke-width': 36, 'stroke-linecap': 'round' }),
        s('line', { x1: 200, y1: 214, x2: 200, y2: 108, stroke: 'var(--hodinova)', 'stroke-width': 21, 'stroke-linecap': 'round' }),
        s('circle', { cx: 200, cy: 108, r: 16, fill: '#c95d26', stroke: '#7a3210', 'stroke-width': 2 }),
        s('line', { x1: 200, y1: 200, x2: 200, y2: 108, class: 'hit', 'stroke-width': 62 }),
        s('circle', { cx: 200, cy: 108, r: 40, class: 'hit gula' }),
        s('circle', { cx: 200, cy: 108, r: 31, class: 'fokus', fill: 'none', stroke: '#2f6fc0', 'stroke-width': 4, 'stroke-dasharray': '7 5' })
      );
    }
    return g;
  }
  const rMin = ruka('minuta'), rHod = ruka('hodina');
  // malá ručička je navrchu (je kratšia), aby sa dali chytiť obe
  svg.append(rMin, rHod,
    s('circle', { cx: 200, cy: 200, r: 13, fill: '#2a2318' }),
    s('circle', { cx: 200, cy: 200, r: 5, fill: '#f3b453' }));
  const ruky = { minuta: rMin, hodina: rHod };
  // sekundová ručička (časť 4): tenká, len ukazuje, nedá sa ťahať
  const sekEl = s('g', { opacity: 0, 'aria-hidden': 'true' });
  sekEl.append(s('line', { x1: 200, y1: 230, x2: 200, y2: 34, stroke: '#d23b3b', 'stroke-width': 3, 'stroke-linecap': 'round' }),
    s('circle', { cx: 200, cy: 200, r: 7, fill: '#d23b3b' }));
  svg.append(sekEl);

  // digitálny displej a legenda
  const digital = h('div', { class: 'digital', role: 'status', 'aria-label': T.cifernik.digitalAria });
  const legenda = h('div', { class: 'legenda' },
    h('span', { html: LEGENDA_KRATKA + `<span>${T.cifernik.kratka}</span>` }),
    h('span', { html: LEGENDA_DLHA + `<span>${T.cifernik.dlha}</span>` }));
  const el = h('div', { class: 'cifernikObal' }, svg, legenda, digital);

  // vykreslenie podľa času (aj necelé minúty počas animácie)
  // uhly ručičiek pre čas t (aj necelé minúty; pri zámene ručičky vymenené)
  function uhlyCasu(t) {
    let um = uholMinutovej(t), uh = uholHodinovej(t);
    if (zamena) { const a = um; um = medziUhlami(um, uh, zamena); uh = medziUhlami(uh, a, zamena); }
    return { um, uh };
  }
  function kresliUhly(um, uh) {
    zobrazeneUhly = { um, uh };
    rMin.setAttribute('transform', `rotate(${um.toFixed(2)} 200 200)`);
    rHod.setAttribute('transform', `rotate(${uh.toFixed(2)} 200 200)`);
  }
  function kresli(t) { const u = uhlyCasu(t); kresliUhly(u.um, u.uh); }
  // ručičky plynulo dobehnú z toho, kde sú nakreslené, na čas v modeli (po pustení alebo po šípke)
  function dobehni(ms = 220) {
    zastavDobeh();
    const od = { ...zobrazeneUhly }, ciel = uhlyCasu(model.getTime());
    zobrazenie = 'dobeh';
    dobeh = tween(ms, p => {
      const q = ease.out(p);
      kresliUhly(medziUhlami(od.um, ciel.um, q), medziUhlami(od.uh, ciel.uh, q));
    }, () => { dobeh = null; zobrazenie = null; kresli(model.getTime()); });
  }
  function zastavDobeh() {
    if (dobeh) { const d = dobeh; dobeh = null; d.zrus(); }
    zobrazenie = null;
  }
  function obnovPopisy() {
    const t = model.getTime();
    digital.innerHTML = digitalHTML(t, format12);
    for (const [meno, g] of Object.entries(ruky)) {
      if (g.getAttribute('role') === 'slider') {
        g.setAttribute('aria-valuenow', t);
        g.setAttribute('aria-valuetext', digitalny(t, format12) + (t % 60 === 0 ? ', ' + slovakFull(t) : ''));
      }
    }
  }
  model.subscribe(t => { if (!animacia && !zobrazenie) kresli(t); obnovPopisy(); });
  kresli(model.getTime()); obnovPopisy();

  // nastavenie, ktorá ručička sa ťahá, či sa dá ťukať a či sa dá ťuknúť na číslicu
  function nastav(o) {
    Object.assign(nast, o);
    for (const [meno, g] of Object.entries(ruky)) {
      const tahatelna = jeTahatelna(meno), tukacia = nast.tukat;
      g.classList.toggle('zamknuta', !tahatelna && !tukacia);
      g.classList.toggle('tukaci', tukacia && !tahatelna);
      if (tahatelna) {
        g.setAttribute('tabindex', '0'); g.setAttribute('role', 'slider');
        g.setAttribute('aria-valuemin', '0'); g.setAttribute('aria-valuemax', String(MIN_DNA - 1));
      } else if (tukacia) {
        g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button');
        ['aria-valuemin', 'aria-valuemax', 'aria-valuenow', 'aria-valuetext'].forEach(a => g.removeAttribute(a));
      } else {
        g.setAttribute('tabindex', '-1'); g.removeAttribute('role');
        ['aria-valuemin', 'aria-valuemax', 'aria-valuenow', 'aria-valuetext'].forEach(a => g.removeAttribute(a));
      }
    }
    cisla.classList.toggle('bezTukania', !nast.cisla);
    obnovPopisy();
  }

  // zmena času ťahaním alebo klávesnicou
  function zmen(novy, delta, meno) {
    if (!delta) return;
    model.setTime(novy);
    if (onZmena) onZmena({ delta, ruka: meno });
  }
  // plynulé ťahanie: ručička ide presne za prstom (tah.plynulo = necelý čas, bez skokov cez 12),
  // model času sa prichytí na najbližší povolený čas (krok); po pustení ručička dobehne na toto miesto
  function tahajPlynulo(a) {
    const meno = tah.meno, k = dajKrok();
    if (meno === 'minuta') {
      let d = a / 6 - (((tah.plynulo % 60) + 60) % 60);
      if (d > 30) d -= 60; else if (d <= -30) d += 60;
      tah.plynulo += d;
      prichyt(Math.round(tah.plynulo / k) * k, meno);
      const u = uhlyCasu(tah.plynulo);
      kresliUhly(u.um, u.uh);
    } else {
      // malá ručička: poloha v rámci 12 hodín (720 minút)
      let d = a * 2 - (((tah.plynulo % 720) + 720) % 720);
      if (d > 360) d -= 720; else if (d <= -360) d += 720;
      tah.plynulo += d;
      const m = ((tah.snap % 60) + 60) % 60;
      // drzMinuty: mení sa len hodina; inak prichytenie na krok (pri celých hodinách na číslice)
      prichyt(nast.drzMinuty ? Math.round((tah.plynulo - m) / 60) * 60 + m : Math.round(tah.plynulo / Math.max(k, 1)) * Math.max(k, 1), meno);
      kresliUhly(uhlyCasu(model.getTime()).um, ((tah.plynulo * 0.5) % 360 + 360) % 360);
    }
  }
  // nový prichytený čas → model (len keď sa zmení; delta sa ráta bez skoku cez polnoc)
  function prichyt(snap, meno) {
    if (snap === tah.snap) return;
    const d = snap - tah.snap;
    tah.snap = snap;
    zmen(model.getTime() + d, d, meno);
  }
  function uholBodu(e) {
    const r = svg.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    return (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
  }
  // ťahanie: Pointer Events (prst aj myš)
  for (const [meno, g] of Object.entries(ruky)) {
    g.addEventListener('pointerdown', e => {
      if (animacia || (!jeTahatelna(meno) && !nast.tukat)) return;
      e.preventDefault();
      zastavDobeh();
      kresli(model.getTime());
      const t = model.getTime();
      tah = { meno, id: e.pointerId, x0: e.clientX, y0: e.clientY, pohyb: false, plynulo: t, snap: t, svietila: g.classList.contains('svieti') };
      // ručička, ktorú dieťa drží, sa hneď zvýrazní
      if (jeTahatelna(meno)) { g.classList.add('svieti', 'drzana'); svg.classList.add('tahame'); }
      try { svg.setPointerCapture(e.pointerId); } catch (_) { /* syntetické udalosti */ }
    });
    // klávesnica: šípky menia čas o krok, Enter a medzera = ťuknutie
    g.addEventListener('keydown', e => {
      if (animacia) return;
      const vpred = ['ArrowRight', 'ArrowUp'].includes(e.key), vzad = ['ArrowLeft', 'ArrowDown'].includes(e.key);
      if ((vpred || vzad) && jeTahatelna(meno)) {
        e.preventDefault();
        const t = model.getTime(), k = meno === 'hodina' ? Math.max(dajKrok(), 60) : dajKrok();
        const novy = meno === 'hodina' && nast.drzMinuty ? t + (vpred ? 60 : -60)
          : vpred ? (Math.floor(t / k) + 1) * k : (Math.ceil(t / k) - 1) * k;
        zastavDobeh();
        zobrazenie = 'klaves';   // model sa zmení hneď, ručičky k nemu plynulo dobehnú
        zmen(novy, novy - t, meno);
        dobehni(260);
        if (onPustenie) onPustenie();
      } else if ((e.key === 'Enter' || e.key === ' ') && nast.tukat) {
        e.preventDefault();
        if (onTukni) onTukni(meno);
      }
    });
  }
  svg.addEventListener('pointermove', e => {
    if (!tah || e.pointerId !== tah.id) return;
    if (!tah.pohyb && Math.hypot(e.clientX - tah.x0, e.clientY - tah.y0) > 8) tah.pohyb = true;
    if (tah.pohyb && jeTahatelna(tah.meno) && !animacia) {
      zobrazenie = 'tah';
      tahajPlynulo(uholBodu(e));
    }
  });
  // po ťahaní: zvýraznenie späť, ako bolo, a ručičky dobehnú na prichytený čas
  function pustRucku(t) {
    const g = ruky[t.meno];
    g.classList.remove('drzana');
    if (!t.svietila) g.classList.remove('svieti');
    svg.classList.remove('tahame');
    if (zobrazenie === 'tah') dobehni();
  }
  const koniecTahu = e => {
    if (!tah || (e && e.pointerId !== tah.id)) return;
    const t = tah; tah = null;
    pustRucku(t);
    if (e && e.type === 'pointercancel') { if (t.pohyb && onPustenie) onPustenie(); return; }
    if (!t.pohyb) { if (nast.tukat && onTukni) onTukni(t.meno); }
    else if (onPustenie) onPustenie();
  };
  svg.addEventListener('pointerup', koniecTahu);
  svg.addEventListener('pointercancel', koniecTahu);
  svg.addEventListener('lostpointercapture', e => { if (tah && e.pointerId === tah.id) koniecTahu(null); });

  // plynulý posun času o delta minút; naKrok(p) sa volá počas animácie
  function animujO(delta, ms, { krivka = ease.inOut, naKrok = null, hotovo = null } = {}) {
    if (animacia) animacia.zrus();
    zastavDobeh();
    const od = model.getTime();
    let a;
    a = tween(ms, p => {
      const q = krivka(p);
      kresli(od + delta * q);
      if (naKrok) naKrok(q);
    }, () => {
      if (animacia === a) animacia = null;
      model.setTime(od + delta);
      kresli(model.getTime());
      if (hotovo) hotovo();
    });
    if (!a.hotova) animacia = a;
    return a;
  }
  // posun na celú hodinu h (1–12) najkratšou cestou
  function animujNaHodinu(hod, ms = 600, volby = {}) {
    const t = model.getTime();
    let d = (((hod % 12) * 60 - (t % 720)) % 720 + 720) % 720;
    if (d > 360) d -= 720;
    return animujO(d, ms, volby);
  }

  return {
    el, svg, digital, legenda,
    nastav,
    hit: meno => $('.gula', ruky[meno]),
    ruka: meno => ruky[meno],
    nastavDigital(v) { digital.hidden = !v; },
    nastavLegendu(v) { legenda.hidden = !v; },
    // zvýrazní ručičku ('hodina', 'minuta' alebo null)
    zvyrazni(meno) { for (const [m, g] of Object.entries(ruky)) g.classList.toggle('svieti', m === meno); },
    // zvýrazní číslice (zoznam čísel 1–12); zvýraznená číslica je viditeľná aj pri skrytých čísliciach
    zvyrazniCisla(zoznam = []) {
      for (let n = 1; n <= 12; n++) {
        const ano = zoznam.includes(n);
        zvyraznenia[n].setAttribute('opacity', ano ? 0.9 : 0);
        cislice[n].classList.toggle('ukaz', ano);
      }
    },
    // duch malej ručičky na hodine h (null = skryť)
    duch(hod) {
      if (hod == null) { duch.setAttribute('opacity', 0); return; }
      duch.setAttribute('transform', `rotate(${(hod % 12) * 30} 200 200)`);
      duch.setAttribute('opacity', 1);
    },
    // pás postupu jedného kola od uhla `od`: podiel 0..1 (null = skryť)
    pas(podiel, od = 0) {
      if (podiel == null || podiel <= 0) { pas.setAttribute('opacity', 0); return; }
      pas.setAttribute('opacity', 1);
      pas.setAttribute('transform', `rotate(${-90 + od} 200 200)`);
      pas.setAttribute('stroke-dasharray', `${(OBVOD * Math.min(1, podiel)).toFixed(1)} ${OBVOD.toFixed(1)}`);
    },
    // šípka od číslice h1 po číslicu h2 (v smere hodinových ručičiek); null = skryť
    sipka(h1, h2) {
      if (h1 == null) { sipka.setAttribute('opacity', 0); return; }
      const r = 166, a1 = (h1 % 12) * 30 + 4, a2 = (h2 % 12) * 30 - 3;
      const [x1, y1] = bodNaKruhu(r, a1), [x2, y2] = bodNaKruhu(r, a2 - 2);
      sipkaObluk.setAttribute('d', `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`);
      sipkaObluk.setAttribute('stroke-width', 9);
      const [hx, hy] = bodNaKruhu(r, a2 + 3), [lx, ly] = bodNaKruhu(r - 13, a2 - 3.5), [px, py] = bodNaKruhu(r + 13, a2 - 3.5);
      sipkaHrot.setAttribute('d', `M${hx.toFixed(1)} ${hy.toFixed(1)} L${lx.toFixed(1)} ${ly.toFixed(1)} L${px.toFixed(1)} ${py.toFixed(1)}Z`);
      sipka.setAttribute('opacity', 1);
    },
    nastavCislice(v) { svg.classList.toggle('bezCislic', !v); },
    // časť 4: sekundová ručička na uhle (0 až 360); null = skryť
    sekundy(uhol) {
      if (uhol == null) { sekEl.setAttribute('opacity', 0); return; }
      sekEl.setAttribute('transform', `rotate(${uhol.toFixed(1)} 200 200)`);
      sekEl.setAttribute('opacity', 1);
    },
    // časť 2: výseč koláča od–do v minútach (0–60); null = skryť
    vysec(od, po) {
      if (od == null || po - od <= 0) { vysecEl.setAttribute('opacity', 0); return; }
      const r = 177, rozsah = Math.min(60, po - od);
      if (rozsah >= 60) vysecEl.setAttribute('d', `M200 ${200 - r}A${r} ${r} 0 1 1 199.99 ${200 - r}Z`);
      else {
        const [x1, y1] = bodNaKruhu(r, od * 6), [x2, y2] = bodNaKruhu(r, (od + rozsah) * 6);
        vysecEl.setAttribute('d', `M200 200L${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 ${rozsah > 30 ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z`);
      }
      vysecEl.setAttribute('opacity', 0.75);
    },
    // duch oboch ručičiek na čase min (null = skryť)
    duchCasu(min) {
      if (min == null) { duch.setAttribute('opacity', 0); duchMin.setAttribute('opacity', 0); return; }
      duch.setAttribute('transform', `rotate(${uholHodinovej(min)} 200 200)`);
      duchMin.setAttribute('transform', `rotate(${uholMinutovej(min)} 200 200)`);
      duch.setAttribute('opacity', 1); duchMin.setAttribute('opacity', 1);
    },
    // zamenené ručičky: hneď (zamen) alebo plynulo (animujZamenu)
    zamen(v) { zastavDobeh(); zamena = v ? 1 : 0; kresli(model.getTime()); },
    zamenene: () => zamena === 1,
    animujZamenu(ciel, ms, hotovo) {
      if (animacia) animacia.zrus();
      const od = zamena;
      let a;
      a = tween(ms, p => { zamena = od + (ciel - od) * ease.inOut(p); kresli(model.getTime()); },
        () => { if (animacia === a) animacia = null; zamena = ciel; kresli(model.getTime()); if (hotovo) hotovo(); });
      if (!a.hotova) animacia = a;
    },
    // priesvitná ručička („chýba“) – po prvom potiahnutí sa ukáže celá
    volna(meno, v) { ruky[meno].classList.toggle('volna', !!v); },
    // farebné hodiny a minúty v digitálnom displeji; zvýraznenie časti 'h', 'k' (dvojbodka), 'm'
    farebnyDigital(v) { digital.classList.toggle('farebny', !!v); },
    zvyrazniDigital(cast) { for (const c of ['h', 'k', 'm']) { const e = $('.d' + c, digital); if (e) e.classList.toggle('zv', c === cast); } },
    animujO, animujNaHodinu,
    animuje: () => !!animacia,
    dokonciAnimaciu() { if (animacia) animacia.dokonci(); },
    zastavAnimaciu() { if (animacia) { const a = animacia; animacia = null; a.zrus(); } zastavDobeh(); kresli(model.getTime()); },
    ukonciTahanie() {
      if (tah) { const t = tah; tah = null; pustRucku(t); try { svg.releasePointerCapture(t.id); } catch (_) { /* nič */ } }
      zastavDobeh(); kresli(model.getTime());
    },
    kresli
  };
}

// uhol medzi a a b najkratšou cestou (p = 0 → a, p = 1 → b)
function medziUhlami(a, b, p) {
  const d = ((b - a) % 360 + 540) % 360 - 180;
  return ((a + d * p) % 360 + 360) % 360;
}

/* =====================================================================
   KARTY – kostra a prepínanie
   ===================================================================== */
const KARTY = {};
function kostraKarty(id) {
  const sekcia = h('section', { class: 'karta', id: 'karta-' + id, role: 'tabpanel', 'aria-labelledby': 'tab-' + id, hidden: true });
  $('#obsah').append(sekcia);
  return sekcia;
}
function tlacidlo(text, ikona, onclick, trieda = '') {
  return h('button', { type: 'button', class: trieda, onclick },
    ikona ? h('span', { html: IKONY[ikona], style: 'display:contents' }) : null, text);
}
// spoločné nastavenia ciferníka podľa panelu (číslice, digitálne hodiny)
function pouziPanel(id) {
  const k = KARTY[id];
  if (!k || !k.cifernik) return;
  k.cifernik.nastavCislice(STAV.cislice);
  k.cifernik.nastavDigital(STAV.karty[id].digital && !(k.skryDigital && k.skryDigital()));
}
function ukazKartu(id, zapisHash = true) {
  if (!KARTY[id]) id = PORADIE_KARIET[0];
  const zmena = STAV.karta !== id;
  if (zmena) zastavCitanie();
  if (STAV.karta && zmena && KARTY[STAV.karta].priSkryti) KARTY[STAV.karta].priSkryti();
  STAV.karta = id;
  for (const k of PORADIE_KARIET) {
    KARTY[k].sekcia.hidden = k !== id;
    const tab = $('#tab-' + k);
    tab.setAttribute('aria-selected', String(k === id));
    tab.tabIndex = k === id ? 0 : -1;
    if (k === id && zmena) try { tab.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (_) { /* staré prehliadače */ }
  }
  pouziPanel(id);
  synchronizujNahlas();
  if (zmena && KARTY[id].priZobrazeni) KARTY[id].priZobrazeni();
  obnovPanel();
  if (zmena && smieHybat()) {
    const sek = KARTY[id].sekcia;
    tween(260, p => {
      sek.style.transform = p >= 1 ? '' : `translateY(${(14 * (1 - ease.out(p))).toFixed(1)}px)`;
      sek.style.opacity = p >= 1 ? '' : Math.min(1, 0.2 + p).toFixed(2);
    });
  }
  if (zapisHash && location.hash !== '#/' + id) history.replaceState(null, '', '#/' + id);
}

/* =====================================================================
   KARTA 1: Spoznaj hodiny
   Fázy: pribeh1 → pribeh2 → malu → velku → tahaj → kolo
   ===================================================================== */
function postavSpoznaj() {
  const id = 'spoznaj', sekcia = kostraKarty(id), TX = T.spoznaj;
  const hodinko = vytvorHodinka(sekcia, id);
  let faza = null, posun = 0, startKola = 0;

  const cif = vytvorCifernik({
    model: HODINY, karta: id,
    onTukni: ruka => tukni(ruka),
    onZmena: ({ delta, ruka }) => { if (faza === 'tahaj' && ruka === 'minuta') pridajPosun(delta); }
  });
  const plaketa = h('div', { class: 'plaketa', hidden: true, 'aria-live': 'polite' },
    h('span', { html: IKONY.kolo, style: 'display:contents' }), TX.plaketa);
  const akcie = h('div', { class: 'akcie' });
  cif.el.append(plaketa);
  sekcia.append(cif.el, akcie);

  function nastavAkcie(...tlacidla) { akcie.replaceChildren(...tlacidla.filter(Boolean)); }
  // ťahať sa dá veľká ručička; pri kroku 60 (celé hodiny) malá
  const tahanaRuka = () => (STAV.karty[id].krok >= 60 ? 'hodina' : 'minuta');

  function nastavFazu(f) {
    faza = f;
    cif.zastavAnimaciu();
    cif.pas(null); cif.sipka(null); cif.zvyrazniCisla([]);
    plaketa.hidden = true;
    if (f === 'pribeh1') {
      cif.nastav({ tahat: null, tukat: false });
      HODINY.setTime(2 * 60);
      cif.zvyrazni('hodina');
      hodinko.povedz(TX.pribeh1, 'premysla');
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', () => nastavFazu('pribeh2'), 'primary'));
    } else if (f === 'pribeh2') {
      cif.zvyrazni('minuta');
      hodinko.povedz(TX.pribeh2, 'premysla');
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', () => nastavFazu('malu'), 'primary'));
    } else if (f === 'malu') {
      cif.zvyrazni(null);
      cif.nastav({ tahat: null, tukat: true });
      hodinko.povedz(TX.tukniMalu, 'premysla');
      nastavAkcie();
    } else if (f === 'velku') {
      cif.zvyrazni(null);
      hodinko.povedz(TX.malaDobre, 'tesi');
      nastavAkcie();
    } else if (f === 'tahaj') {
      // kolo začína na celej hodine, aby sa malá ručička posunula presne o jednu číslicu
      const t = HODINY.getTime();
      if (t % 60 !== 0) HODINY.setTime(Math.round(t / 60) * 60);
      startKola = HODINY.getTime(); posun = 0;
      cif.nastav({ tahat: tahanaRuka(), tukat: false });
      cif.zvyrazni('minuta');
      if (hodinko.text() !== TX.velkaDobre) hodinko.povedz(TX.velkaDobre, 'tesi');
      nastavAkcie(tlacidlo(TX.ukazMi, 'ukaz', ukazKolo));
    } else if (f === 'kolo') {
      cif.ukonciTahanie();
      cif.nastav({ tahat: null, tukat: false });
      cif.zvyrazni('hodina');
      cif.pas(1);
      const h1 = hodina12(startKola), h2 = hodina12(startKola + 60);
      cif.zvyrazniCisla([h1, h2]);
      cif.sipka(h1, h2);
      plaketa.hidden = false;
      odskok(plaketa, 14);
      hodinko.povedz(TX.kolo, 'tesi');
      nastavAkcie(
        tlacidlo(TX.esteKolo, 'kolo', () => nastavFazu('tahaj')),
        tlacidlo(TX.naCele, 'dalej', () => ukazKartu('cele'), 'primary'),
        tlacidlo(TX.znova, 'znova', () => nastavFazu('pribeh1')));
    }
  }
  // úloha 1: ťuknúť na malú, potom na veľkú ručičku
  function tukni(ruka) {
    if (faza === 'malu') {
      if (ruka === 'hodina') nastavFazu('velku');
      else { hodinko.povedz(TX.skusMalu, 'povzbudzuje'); cif.zvyrazni('hodina'); }
    } else if (faza === 'velku') {
      if (ruka === 'minuta') nastavFazu('tahaj');
      else { hodinko.povedz(TX.skusVelku, 'povzbudzuje'); cif.zvyrazni('minuta'); }
    }
  }
  // úloha 2: sčítame, o koľko minút sa veľká ručička posunula dopredu
  function pridajPosun(delta) {
    const pred = posun;
    posun += delta;
    cif.pas(Math.max(0, posun) / 60);
    if (pred < 15 && posun >= 15 && posun < 60) hodinko.povedz(TX.tahajDalej, 'povzbudzuje');
    if (posun >= 60) nastavFazu('kolo');
  }
  // „Ukáž mi“: veľká ručička sama obehne jedno kolo
  function ukazKolo() {
    if (cif.animuje()) return;
    cif.ukonciTahanie();
    cif.nastav({ tahat: null, tukat: false });
    const od = Math.max(0, posun);
    const ciel = startKola + 60 - HODINY.getTime();
    cif.animujO(ciel, 4200, {
      krivka: ease.linear,
      naKrok: q => cif.pas((od + (60 - od) * q) / 60),
      hotovo: () => { posun = 60; nastavFazu('kolo'); }
    });
  }

  KARTY[id] = {
    sekcia, cifernik: cif, hodinko,
    priZobrazeni() {
      cif.nastavLegendu(true);
      if (!faza) nastavFazu('pribeh1');
      else if (faza === 'tahaj' || faza === 'kolo') nastavFazu(faza === 'kolo' ? 'kolo' : 'tahaj');
      else hodinko.povedz(hodinko.text(), hodinko.vyraz(), false);
    },
    priSkryti() { cif.ukonciTahanie(); cif.zastavAnimaciu(); },
    // zmena kroku v paneli
    priZmeneKroku() { if (faza === 'tahaj') cif.nastav({ tahat: tahanaRuka() }); },
    faza: () => faza
  };
}

/* =====================================================================
   KARTA 2: Celé hodiny
   Režimy: skusaj (voľné ťahanie), nastav (hra Nastav hodiny), citaj (hra Čo ukazujú hodiny?)
   ===================================================================== */
function postavCele() {
  const id = 'cele', sekcia = kostraKarty(id), TX = T.cele;
  let rezim = null, ciel = null, predosly = null, pokusy = 0, vyriesene = false, prvyCitaj = true;

  // prepínač režimov – veľké ikony
  const rezimy = h('div', { class: 'rezimy', role: 'group', 'aria-label': TX.rezimyAria });
  const tlRezimov = {};
  for (const r of ['skusaj', 'nastav', 'citaj']) {
    tlRezimov[r] = h('button', { type: 'button', 'aria-pressed': 'false', onclick: () => nastavRezim(r) },
      h('span', { html: IKONY[r], style: 'display:contents' }), TX.rezimy[r]);
    rezimy.append(tlRezimov[r]);
  }
  sekcia.append(rezimy);
  const hodinko = vytvorHodinka(sekcia, id);
  const cif = vytvorCifernik({
    model: HODINY, karta: id,
    onCislo: n => { if (rezim === 'skusaj' || (rezim === 'nastav' && !vyriesene)) cif.animujNaHodinu(n, 500, { hotovo: povedzCas }); }
  });
  const moznosti = h('div', { class: 'moznosti', role: 'group', 'aria-label': TX.moznostiAria, hidden: true });
  const akcie = h('div', { class: 'akcie' });
  sekcia.append(cif.el, moznosti, akcie);
  function nastavAkcie(...tl) { akcie.replaceChildren(...tl.filter(Boolean)); }

  // pri každej zmene času v režime Skúšaj Hodinko povie slovné vyjadrenie
  HODINY.subscribe(t => {
    if (STAV.karta !== id || rezim !== 'skusaj' || cif.animuje()) return;
    hodinko.povedz(fmt(TX.vyjadrenie, { cas: slovakFull(t) }), 'tesi', false);
  });
  // po animácii (ťuknutie na číslicu) model ohlási zmenu až na konci – vtedy tiež povieme čas
  function povedzCas() { if (rezim === 'skusaj') hodinko.povedz(fmt(TX.vyjadrenie, { cas: slovakFull(HODINY.getTime()) }), 'tesi'); }

  function vynulujNapovedy() { cif.zvyrazniCisla([]); cif.duch(null); cif.zvyrazni(null); }
  function nahodnaHodina(okrem) {
    let n;
    do { n = 1 + nahodne(12); } while (okrem.includes(n));
    return n;
  }

  function nastavRezim(r) {
    rezim = r;
    for (const [k, b] of Object.entries(tlRezimov)) b.setAttribute('aria-pressed', String(k === r));
    cif.zastavAnimaciu();
    vynulujNapovedy();
    moznosti.hidden = r !== 'citaj';
    // veľká ručička stojí na 12
    const t = HODINY.getTime();
    if (t % 60 !== 0) HODINY.setTime(Math.round(t / 60) * 60);
    pouziPanel(id);
    if (r === 'skusaj') {
      cif.nastav({ tahat: 'hodina', tukat: false, cisla: true });
      hodinko.povedz(TX.skusaj, 'premysla');
      nastavAkcie();
    } else if (r === 'nastav') novaUlohaNastav();
    else novaUlohaCitaj();
  }

  /* ----- hra Nastav hodiny ----- */
  function novaUlohaNastav() {
    vynulujNapovedy();
    pokusy = 0; vyriesene = false;
    ciel = nahodnaHodina([hodina12(HODINY.getTime()), predosly]);
    predosly = ciel;
    cif.nastav({ tahat: 'hodina', tukat: false, cisla: true });
    hodinko.povedz(fmt(TX.nastavZadanie, { cas: slovakFull(ciel * 60) }), 'premysla');
    const bHotovo = tlacidlo(TX.hotovo, 'hotovo', () => skontrolujNastav(bHotovo), 'primary');
    nastavAkcie(bHotovo);
  }
  function skontrolujNastav(b) {
    if (vyriesene) return;
    cif.dokonciAnimaciu();   // ak sa ručička ešte dobieha po ťuknutí na číslicu
    const cas = slovakFull(ciel * 60);
    if (hodina12(HODINY.getTime()) === ciel) {
      vyriesene = true;
      vynulujNapovedy();
      cif.nastav({ tahat: null, cisla: false });
      hodinko.povedz(fmt(TX.dobre[nahodne(TX.dobre.length)], { cas }), 'tesi');
      pridajHviezdu(b);
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', novaUlohaNastav, 'primary'));
      return;
    }
    pokusy++;
    if (pokusy === 1) {
      // 1. nápoveda: ukáže číslicu
      cif.zvyrazniCisla([ciel]);
      hodinko.povedz(fmt(TX.napoveda1, { cislo: ciel }), 'povzbudzuje');
    } else if (pokusy === 2) {
      // 2. nápoveda: ukáže, kam patrí malá ručička
      cif.zvyrazniCisla([ciel]);
      cif.duch(ciel);
      hodinko.povedz(TX.napoveda2, 'povzbudzuje');
    } else {
      // 3. pokus: Hodinko ukáže riešenie, bez hviezdičky, ale bez „prehry“
      vyriesene = true;
      cif.nastav({ tahat: null, cisla: false });
      cif.duch(null);
      cif.animujNaHodinu(ciel, 900, { hotovo: () => cif.zvyrazni('hodina') });
      hodinko.povedz(fmt(TX.riesenie, { cas }), 'tesi');
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', novaUlohaNastav, 'primary'));
    }
  }

  /* ----- hra Čo ukazujú hodiny? ----- */
  function novaUlohaCitaj() {
    vynulujNapovedy();
    vyriesene = false;
    cif.nastav({ tahat: null, tukat: false, cisla: false });
    let volby;
    if (prvyCitaj) { ciel = 3; volby = [3, 12, 6]; prvyCitaj = false; }   // prvá úloha podľa zadania: 3:00, 12:00, 6:00
    else {
      ciel = nahodnaHodina([hodina12(HODINY.getTime()), predosly]);
      // častá chyba: dieťa prečíta veľkú ručičku (12) – preto 12:00 býva medzi možnosťami
      const druha = ciel !== 12 ? 12 : nahodnaHodina([12]);
      volby = zamiesaj([ciel, druha, nahodnaHodina([ciel, druha])]);
    }
    predosly = ciel;
    cif.animujNaHodinu(ciel, 700);
    hodinko.povedz(TX.citajOtazka, 'premysla');
    moznosti.replaceChildren(...volby.map(n => {
      const b = h('button', { type: 'button', 'data-hodina': n, 'aria-label': n + ':00' },
        h('span', { class: 'znacka', 'aria-hidden': 'true' }), n + ':00');
      b.addEventListener('click', () => odpovedzCitaj(b, n));
      return b;
    }));
    nastavAkcie();
  }
  function odpovedzCitaj(b, n) {
    if (vyriesene || b.disabled) return;
    cif.dokonciAnimaciu();
    const cas = slovakFull(ciel * 60);
    if (n === ciel) {
      vyriesene = true;
      cif.zvyrazni(null);
      b.classList.add('dobre');
      $('.znacka', b).textContent = '✔';
      b.setAttribute('aria-label', '✔ ' + n + ':00');
      for (const x of $$('button', moznosti)) if (x !== b) x.disabled = true;
      hodinko.povedz(fmt(TX.citajDobre, { cas }), 'tesi');
      pridajHviezdu(b);
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', novaUlohaCitaj, 'primary'));
    } else {
      b.classList.add('zle');
      b.disabled = true;
      $('.znacka', b).textContent = '✘';
      b.setAttribute('aria-label', '✘ ' + n + ':00');
      cif.zvyrazni('hodina');
      hodinko.povedz(TX.citajZle, 'povzbudzuje');
    }
  }

  KARTY[id] = {
    sekcia, cifernik: cif, hodinko,
    // v hre Čo ukazujú hodiny? by digitálne hodiny prezradili odpoveď
    skryDigital: () => rezim === 'citaj',
    priZobrazeni() {
      cif.nastavLegendu(true);
      if (!rezim) nastavRezim('skusaj');
      else nastavRezim(rezim);
    },
    priSkryti() { cif.ukonciTahanie(); cif.zastavAnimaciu(); },
    priZmeneKroku() {},
    rezim: () => rezim
  };
}

/* =====================================================================
   ČASŤ 2 – úrovne, generátory zadaní a spoločné časti hier
   ===================================================================== */
// úrovne podľa kroku veľkej ručičky; ukážka = čas na ikonke
const UROVNE = [
  { krok: 60, ukazka: 7 * 60 },
  { krok: 30, ukazka: 7 * 60 + 30 },
  { krok: 15, ukazka: 7 * 60 + 15 },
  { krok: 5, ukazka: 7 * 60 + 25, sikovni: true }
];
const cas12 = (hh, mm) => ((((hh % 12) + 12) % 12) * 60 + mm);   // čas v rámci 12 hodín (0 až 719)
// náhodný čas danej úrovne (minúty sú násobkom kroku), okrem zoznamu `okrem`
function nahodnyCasUrovne(u, rng = Math.random, okrem = []) {
  const k = UROVNE[u].krok;
  let c;
  do { c = Math.floor(rng() * 12) * 60 + Math.floor(rng() * (60 / k)) * k; } while (okrem.includes(c));
  return c;
}
// typické chyby detí pri čítaní času – z nich sú nesprávne možnosti
function chybneCasy(cas, u) {
  const hh = Math.floor(cas / 60) % 12, m = cas % 60, k = UROVNE[u].krok;
  const kand = [cas12(hh + 1, m), cas12(hh - 1, m)];          // zlá hodina (malá ručička je blízko ďalšej číslice)
  if (m === 0) kand.push(cas12(0, 0));                         // 12:00 – dieťa prečíta veľkú ručičku ako hodiny
  else {
    kand.push(cas12(hh, 0), cas12(hh + 1, 0));                // minúty prehliadne
    kand.push(cas12(hh, (60 - m) % 60));                      // zámena štvrť ↔ trištvrte (3 ↔ 9)
    if (m / 5 !== m) kand.push(cas12(hh, m / 5));             // číslica namiesto minút: 7:25 → 7:05
    kand.push(cas12(hh, (m + 5) % 60), cas12(hh, (m + 55) % 60));
  }
  // len časy, ktoré na danej úrovni dávajú zmysel, bez správneho a bez opakovania
  return [...new Set(kand)].filter(c => c !== cas && (c % 60) % k === 0);
}
// zadanie „ciferník → digitál“: čas a tri rôzne možnosti, práve jedna správna
function zadanieDigital(u, rng = Math.random, okrem = []) {
  const cas = nahodnyCasUrovne(u, rng, okrem);
  const vyber = zamiesaj(chybneCasy(cas, u), rng).slice(0, 2);
  while (vyber.length < 2) vyber.push(nahodnyCasUrovne(u, rng, [cas, ...vyber]));
  return { cas, moznosti: zamiesaj([cas, ...vyber], rng) };
}
// zadanie „Poznáš to?“: štvrťhodinová poloha a štyri slovné možnosti (časy; text je casSlovami)
function zadanieSlovne(rng = Math.random, okrem = []) {
  let cas;
  do { cas = Math.floor(rng() * 12) * 60 + [15, 30, 45][Math.floor(rng() * 3)]; } while (okrem.includes(cas));
  const hh = Math.floor(cas / 60), m = cas % 60, ine = [15, 30, 45].filter(x => x !== m);
  // najčastejšia chyba: hodina podľa malej ručičky („štvrť na sedem“ namiesto „štvrť na osem“)
  const hlavna = cas12(hh - 1, m);
  const ostatne = zamiesaj([cas12(hh + 1, m), cas12(hh, ine[0]), cas12(hh, ine[1]), cas12(hh - 1, ine[0]), cas12(hh - 1, ine[1])], rng);
  return { cas, moznosti: zamiesaj([cas, hlavna, ...ostatne.slice(0, 2)], rng) };
}
// rozdiel uhlov ručičiek (0 až 180°)
function rozdielRuciciek(cas) {
  const d = Math.abs(uholHodinovej(cas) - uholMinutovej(cas)) % 360;
  return Math.min(d, 360 - d);
}
// zadanie Hodinárovej dielne: typ, cieľový čas, začiatok (pre chýbajúcu ručičku), možnosti (pre zamenené)
function zadanieDielne(u, rng = Math.random, okrem = []) {
  const typy = u === 0 ? ['bezMalej', 'zamenene'] : ['bezMalej', 'bezVelkej', 'zamenene'];
  const typ = typy[Math.floor(rng() * typy.length)];
  let cas;
  // zámena musí byť vidieť (ručičky nie sú na sebe); pri chýbajúcej veľkej nie je cieľ na 12
  do { cas = nahodnyCasUrovne(u, rng, okrem); }
  while ((typ === 'zamenene' && rozdielRuciciek(cas) < 40) || (typ === 'bezVelkej' && cas % 60 === 0));
  const hh = Math.floor(cas / 60), m = cas % 60, k = UROVNE[u].krok;
  let start = cas, moznosti = null;
  if (typ === 'bezMalej') {
    let h2; do { h2 = Math.floor(rng() * 12); } while (h2 === hh);
    start = cas12(h2, m);
  } else if (typ === 'bezVelkej') {
    let m2; do { m2 = Math.floor(rng() * (60 / k)) * k; } while (m2 === m);
    start = cas12(hh, m2);
  } else {
    const vyber = zamiesaj(chybneCasy(cas, u), rng).slice(0, 2);
    while (vyber.length < 2) vyber.push(nahodnyCasUrovne(u, rng, [cas, ...vyber]));
    moznosti = zamiesaj([cas, ...vyber], rng);
  }
  return { typ, cas, start, moznosti };
}

// riadok režimov karty (veľké ikony); zoznam = [[kľúč, ikona], …]
function vytvorRezimy(zoznam, texty, priVybere) {
  const el = h('div', { class: 'rezimy', role: 'group', 'aria-label': T.hra.rezimyAria, style: `--stlpce:${zoznam.length}` });
  const tl = {};
  for (const [kluc, ikona] of zoznam) {
    tl[kluc] = h('button', { type: 'button', 'aria-pressed': 'false', onclick: () => priVybere(kluc) },
      h('span', { html: IKONY[ikona], style: 'display:contents' }), texty[kluc]);
    el.append(tl[kluc]);
  }
  return { el, oznac(r) { for (const [k, b] of Object.entries(tl)) b.setAttribute('aria-pressed', String(k === r)); } };
}
// výber úrovne – mení ho len dieťa alebo rodič, nikdy automaticky
function vytvorVyberUrovne(karta, priZmene) {
  const el = h('div', { class: 'urovne', role: 'group', 'aria-label': T.urovne.aria });
  const tl = UROVNE.map((u, i) => h('button', { type: 'button', 'aria-pressed': 'false',
    'aria-label': T.urovne.nazvy[i] + (u.sikovni ? ', ' + T.urovne.sikovni : ''),
    onclick: () => { nastav(i); priZmene(i); } },
  h('span', { html: ikonaHodin(u.ukazka), style: 'display:contents' }), h('span', {}, T.urovne.nazvy[i]),
  u.sikovni ? h('span', { class: 'sikovni', 'aria-hidden': 'true' }, T.urovne.sikovni) : null));
  el.append(...tl);
  function nastav(i) {
    STAV.karty[karta].uroven = i;
    STAV.karty[karta].krok = UROVNE[i].krok;
    tl.forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
    synchronizujNahlas();
  }
  nastav(STAV.karty[karta].uroven);
  return { el, nastav, uroven: () => STAV.karty[karta].uroven };
}
// zadanie (cieľový čas) vo veľkom digitálnom displeji, prípadne so slovným tvarom
function vyplnZadanie(el, cas, sTvarom) {
  const veta = sTvarom ? vetaCasu(cas) : null;
  el.hidden = false;
  el.replaceChildren(...[h('div', { class: 'velkyDigital', html: digitalHTML(cas), 'aria-label': digitalny(cas) }),
    veta ? h('div', { class: 'tvar' }, veta) : null].filter(Boolean));
}
// tlačidlá s možnosťami: správna ✔ a hviezdička, nesprávna ✘ a nápoveda (bez prehry)
function ukazMoznosti({ obal, casy, spravny, popis, cif, hodinko, textDobre, textZle, nastavAkcie, dalej }) {
  let hotovo = false;
  obal.hidden = false;
  obal.replaceChildren(...casy.map(c => {
    const b = h('button', { type: 'button', 'data-cas': c }, h('span', { class: 'znacka', 'aria-hidden': 'true' }), popis(c));
    b.addEventListener('click', () => {
      if (hotovo || b.disabled) return;
      cif.dokonciAnimaciu();
      if (c === spravny) {
        hotovo = true;
        cif.zvyrazni(null);
        b.classList.add('dobre');
        $('.znacka', b).textContent = '✔';
        for (const x of $$('button', obal)) if (x !== b) x.disabled = true;
        hodinko.povedz(textDobre, 'tesi');
        pridajHviezdu(b);
        nastavAkcie(tlacidlo(T.hra.dalej, 'dalej', dalej, 'primary'));
      } else {
        b.classList.add('zle');
        b.disabled = true;
        $('.znacka', b).textContent = '✘';
        cif.zvyrazni('hodina');
        hodinko.povedz(textZle, 'povzbudzuje');
      }
    });
    return b;
  }));
  nastavAkcie();
}
// spoločná hra „nastav čas“: 3 pokusy – 1. nápoveda číslice, 2. duch ručičiek, 3. riešenie (ako v časti 1)
function vytvorNastavovanie({ cif, hodinko, nastavAkcie, vyjadri = vyjadriCas, napoveda1 = null }) {
  let ciel = null, pokusy = 0, vyriesene = true, dalej = null;
  function start(c, poUspechu) {
    ciel = norm(c) % 720; pokusy = 0; vyriesene = false; dalej = poUspechu;
    cif.zvyrazniCisla([]); cif.duchCasu(null);
    const b = tlacidlo(T.hra.hotovo, 'hotovo', () => skontroluj(b), 'primary');
    nastavAkcie(b);
  }
  function skontroluj(b) {
    if (vyriesene) return;
    cif.dokonciAnimaciu();
    const t = HODINY.getTime() % 720, cas = vyjadri(ciel);
    if (t === ciel) {
      vyriesene = true;
      cif.zvyrazniCisla([]); cif.duchCasu(null);
      cif.nastav({ tahat: null });
      hodinko.povedz(fmt(T.hra.dobre[nahodne(T.hra.dobre.length)], { cas }), 'tesi');
      pridajHviezdu(b);
      nastavAkcie(tlacidlo(T.hra.dalej, 'dalej', dalej, 'primary'));
      return;
    }
    pokusy++;
    const hc = hodina12(ciel), m = ciel % 60, mc = Math.round(m / 5) || 12;
    if (pokusy === 1) {
      // 1. nápoveda: zvýrazní číslicu (najprv tú, ktorá je zle)
      if (napoveda1) { const n = napoveda1(ciel, t); cif.zvyrazniCisla(n.cisla); hodinko.povedz(n.text, 'povzbudzuje'); }
      else if (t % 60 !== m) { cif.zvyrazniCisla([mc]); hodinko.povedz(fmt(T.hra.napovedaVelka, { cislo: mc }), 'povzbudzuje'); }
      else { cif.zvyrazniCisla(m ? [hc, hc % 12 + 1] : [hc]); hodinko.povedz(fmt(T.hra.napovedaMala, { cislo: hc }), 'povzbudzuje'); }
    } else if (pokusy === 2) {
      // 2. nápoveda: duch ručičiek ukáže, kam patria
      cif.duchCasu(ciel);
      hodinko.povedz(T.hra.napoveda2, 'povzbudzuje');
    } else {
      // 3. pokus: Hodinko ukáže riešenie, bez hviezdičky a bez „prehry“
      vyriesene = true;
      cif.nastav({ tahat: null });
      cif.duchCasu(null);
      let d = ((ciel - t) % 720 + 720) % 720;
      if (d > 360) d -= 720;
      cif.animujO(d, 1100);
      hodinko.povedz(fmt(T.hra.riesenie, { cas }), 'tesi');
      nastavAkcie(tlacidlo(T.hra.dalej, 'dalej', dalej, 'primary'));
    }
  }
  return { start, aktivna: () => !vyriesene };
}
// najkratší posun ručičiek z aktuálneho času na čas c (v rámci 12 hodín)
function posunNa(c) {
  let d = ((norm(c) % 720 - HODINY.getTime() % 720) % 720 + 720) % 720;
  if (d > 360) d -= 720;
  return d;
}

/* =====================================================================
   KARTA 3: Polhodina
   Režimy: pozri (pol kola, malá ručička medzi číslicami), nastav (hra Nastav pol hodiny)
   ===================================================================== */
function postavPolhodina() {
  const id = 'polhodina', sekcia = kostraKarty(id), TX = T.polhodina;
  let rezim = null, krokPozri = 0, hodinaUkazky = 7, predosla = null;
  const rez = vytvorRezimy([['pozri', 'pozri'], ['nastav', 'nastav']], TX.rezimy, r => nastavRezim(r));
  sekcia.append(rez.el);
  const hodinko = vytvorHodinka(sekcia, id);
  const cif = vytvorCifernik({ model: HODINY, karta: id });
  const plakety = h('div', { class: 'plakety', hidden: true, 'aria-live': 'polite' });
  cif.el.append(plakety);
  const akcie = h('div', { class: 'akcie' });
  sekcia.append(cif.el, akcie);
  const nastavAkcie = (...tl) => akcie.replaceChildren(...tl.filter(Boolean));
  const hra = vytvorNastavovanie({ cif, hodinko, nastavAkcie,
    // 1. nápoveda: malá ručička bude medzi dvomi číslicami
    napoveda1: c => ({ cisla: [hodina12(c), nasledujucaHodina(c)], text: fmt(TX.napoveda1, { a: hodina12(c), b: nasledujucaHodina(c) }) }) });

  function vycisti() {
    cif.zastavAnimaciu(); cif.vysec(null); cif.zvyrazni(null); cif.zvyrazniCisla([]); cif.duchCasu(null);
    plakety.hidden = true;
  }
  function nastavRezim(r) {
    rezim = r; rez.oznac(r); vycisti();
    if (r === 'pozri') pozri(0); else novaUloha();
  }
  // animácia a vysvetlenie po krokoch
  function pozri(k) {
    krokPozri = k;
    const zaciatok = (hodinaUkazky % 12) * 60, pol = zaciatok + 30;
    const nasl = T.cislovky[nasledujucaHodina(pol)], tvar = halfSK(pol);
    cif.nastav({ tahat: null, tukat: false, cisla: false });
    if (k === 0) {
      vycisti();
      HODINY.setTime(zaciatok);
      hodinko.povedz(TX.start, 'premysla');
      nastavAkcie(tlacidlo(TX.ukazMi, 'ukaz', () => {
        nastavAkcie();
        cif.zvyrazni('minuta');
        // veľká ručička prejde pol kola, polovica ciferníka sa zafarbí
        cif.animujO(30, 2600, { krivka: ease.linear, naKrok: q => cif.vysec(0, 30 * q), hotovo: () => pozri(1) });
      }, 'primary'));
      return;
    }
    HODINY.setTime(pol);
    cif.vysec(0, 30);
    if (k === 1) {
      cif.zvyrazni('minuta');
      hodinko.povedz(TX.polKola, 'tesi');
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', () => pozri(2), 'primary'));
    } else if (k === 2) {
      // malá ručička stojí v polovici medzi dvomi číslicami
      cif.zvyrazni('hodina');
      cif.zvyrazniCisla([hodina12(pol), nasledujucaHodina(pol)]);
      hodinko.povedz(fmt(TX.medzi, { veta: vetaCasu(pol), nasl }), 'premysla');
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', () => pozri(3), 'primary'));
    } else {
      // 7:30 je „pol ôsmej“, nie „osem tridsať“
      cif.zvyrazni('hodina');
      cif.zvyrazniCisla([hodina12(pol), nasledujucaHodina(pol)]);
      plakety.replaceChildren(
        h('div', { class: 'plaketa' }, '✔ ' + fmt(TX.plaketa, { dig: digitalny(pol), tvar })),
        h('div', { class: 'plaketa nie' }, '✘ ' + fmt(TX.plaketaNie, { nasl })));
      plakety.hidden = false;
      odskok(plakety, 12);
      hodinko.povedz(fmt(TX.nie, { nasl, tvar }), 'tesi');
      nastavAkcie(
        tlacidlo(TX.znova, 'znova', () => { let n; do { n = 1 + nahodne(12); } while (n === hodinaUkazky); hodinaUkazky = n; pozri(0); }),
        tlacidlo(TX.naHru, 'dalej', () => nastavRezim('nastav'), 'primary'));
    }
  }
  // hra Nastav pol hodiny: veľká ručička sa prichytáva na 12 a 6, malá ide sama
  function novaUloha() {
    vycisti();
    let hh; do { hh = nahodne(12); } while (hh === predosla);
    predosla = hh;
    const ciel = hh * 60 + 30;
    // začíname celou hodinou pred alebo po – dieťa rozhodne, či ťahať dopredu alebo dozadu
    HODINY.setTime(nahodne(2) ? hh * 60 : (hh + 1) * 60);
    cif.nastav({ tahat: 'minuta', tukat: false, cisla: false });
    hodinko.povedz(fmt(TX.zadanie, { tvar: halfSK(ciel) }), 'premysla');
    hra.start(ciel, novaUloha);
  }

  KARTY[id] = {
    sekcia, cifernik: cif, hodinko,
    priZobrazeni() {
      cif.nastavLegendu(true);
      if (!rezim) nastavRezim('pozri');
      else if (rezim === 'pozri') pozri(krokPozri);
      else novaUloha();
    },
    priSkryti() { cif.ukonciTahanie(); cif.zastavAnimaciu(); },
    rezim: () => rezim
  };
}

/* =====================================================================
   KARTA 4: Štvrť a trištvrte
   Režimy: pozri (štvrť kola, tri štvrte kola), hra (Poznáš to?)
   ===================================================================== */
function postavStvrt() {
  const id = 'stvrt', sekcia = kostraKarty(id), TX = T.stvrt;
  let rezim = null, krokPozri = 0, hodinaUkazky = 7, predosly = null;
  const rez = vytvorRezimy([['pozri', 'pozri'], ['hra', 'citaj']], TX.rezimy, r => nastavRezim(r));
  sekcia.append(rez.el);
  const hodinko = vytvorHodinka(sekcia, id);
  const cif = vytvorCifernik({ model: HODINY, karta: id });
  const plakety = h('div', { class: 'plakety', hidden: true, 'aria-live': 'polite' });
  cif.el.append(plakety);
  const moznosti = h('div', { class: 'moznosti slovne', role: 'group', 'aria-label': T.hra.moznostiAria, hidden: true });
  const akcie = h('div', { class: 'akcie' });
  sekcia.append(cif.el, moznosti, akcie);
  const nastavAkcie = (...tl) => akcie.replaceChildren(...tl.filter(Boolean));

  function vycisti() {
    cif.zastavAnimaciu(); cif.vysec(null); cif.zvyrazni(null); cif.zvyrazniCisla([]);
    plakety.hidden = true; moznosti.hidden = true;
  }
  function nastavRezim(r) {
    rezim = r; rez.oznac(r); vycisti();
    if (r === 'pozri') pozri(0); else novaOtazka();
  }
  function ukazPlaketu(c) {
    plakety.replaceChildren(h('div', { class: 'plaketa' }, fmt(TX.plaketa, { dig: digitalny(c), tvar: casSlovami(c) })));
    plakety.hidden = false;
    odskok(plakety, 12);
  }
  // animácia a vysvetlenie po krokoch: 0 → 15 → 45 minút
  function pozri(k) {
    krokPozri = k;
    const z = (hodinaUkazky % 12) * 60, c15 = z + 15, c45 = z + 45;
    const okolo = [hodina12(z), nasledujucaHodina(z)];
    cif.nastav({ tahat: null, tukat: false, cisla: false });
    plakety.hidden = true;
    cif.zvyrazniCisla([]);
    if (k === 0) {
      vycisti();
      HODINY.setTime(z);
      hodinko.povedz(TX.start, 'premysla');
      nastavAkcie(tlacidlo(TX.ukazMi, 'ukaz', () => {
        nastavAkcie();
        cif.zvyrazni('minuta');
        cif.animujO(15, 1800, { krivka: ease.linear, naKrok: q => cif.vysec(0, 15 * q), hotovo: () => pozri(1) });
      }, 'primary'));
    } else if (k === 1) {
      HODINY.setTime(c15); cif.vysec(0, 15); cif.zvyrazni('minuta');
      hodinko.povedz(TX.stvrtKola, 'tesi');
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', () => pozri(2), 'primary'));
    } else if (k === 2) {
      // malá ručička je kúsok za číslicou, na ceste k nasledujúcej
      HODINY.setTime(c15); cif.vysec(0, 15); cif.zvyrazni('hodina'); cif.zvyrazniCisla(okolo);
      ukazPlaketu(c15);
      hodinko.povedz(fmt(TX.stvrtVeta, { veta: vetaCasu(c15), radove: T.radove[nasledujucaHodina(c15)] }), 'tesi');
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', () => {
        nastavAkcie();
        cif.zvyrazni('minuta'); cif.zvyrazniCisla([]); plakety.hidden = true;
        cif.animujO(30, 2400, { krivka: ease.linear, naKrok: q => cif.vysec(0, 15 + 30 * q), hotovo: () => pozri(3) });
      }, 'primary'));
    } else if (k === 3) {
      HODINY.setTime(c45); cif.vysec(0, 45); cif.zvyrazni('minuta');
      hodinko.povedz(TX.tristvrteKola, 'tesi');
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', () => pozri(4), 'primary'));
    } else {
      // trištvrte: malá ručička je skoro na nasledujúcej číslici
      HODINY.setTime(c45); cif.vysec(0, 45); cif.zvyrazni('hodina'); cif.zvyrazniCisla(okolo);
      ukazPlaketu(c45);
      hodinko.povedz(fmt(TX.tristvrteVeta, { veta: vetaCasu(c45), nasl: T.cislovky[nasledujucaHodina(c45)] }), 'tesi');
      nastavAkcie(
        tlacidlo(TX.znova, 'znova', () => { let n; do { n = 1 + nahodne(12); } while (n === hodinaUkazky); hodinaUkazky = n; pozri(0); }),
        tlacidlo(TX.naHru, 'dalej', () => nastavRezim('hra'), 'primary'));
    }
  }
  // hra Poznáš to?: hodiny ukážu štvrť, pol alebo trištvrte, dieťa vyberie zo štyroch slovných tvarov
  function novaOtazka() {
    vycisti();
    const z = zadanieSlovne(Math.random, predosly == null ? [] : [predosly]);
    predosly = z.cas;
    cif.nastav({ tahat: null, tukat: false, cisla: false });
    cif.animujO(posunNa(z.cas), 800);
    hodinko.povedz(TX.hraOtazka, 'premysla');
    ukazMoznosti({ obal: moznosti, casy: z.moznosti, spravny: z.cas, popis: casSlovami, cif, hodinko,
      textDobre: fmt(T.hra.dobreVyber, { cas: vetaCasu(z.cas) }), textZle: TX.hraZle, nastavAkcie, dalej: novaOtazka });
  }

  KARTY[id] = {
    sekcia, cifernik: cif, hodinko,
    priZobrazeni() {
      cif.nastavLegendu(true);
      if (!rezim) nastavRezim('pozri');
      else if (rezim === 'pozri') pozri(krokPozri);
      else novaOtazka();
    },
    priSkryti() { cif.ukonciTahanie(); cif.zastavAnimaciu(); },
    rezim: () => rezim
  };
}

/* =====================================================================
   KARTA 5: Digitálne hodiny
   Režimy: vysvetli (hodiny : minúty), naDigital (ciferník → digitál), naCifernik (digitál → ciferník)
   Úrovne: celé, pol, štvrť, po 5 minútach (pre šikovných – bez slov a bez hlasu)
   ===================================================================== */
function postavDigital() {
  const id = 'digital', sekcia = kostraKarty(id), TX = T.digital;
  let rezim = null, krokVysvetli = 0, casVysvetli = 7 * 60 + 30, predosly = null, prvyNaDigital = true;
  const rez = vytvorRezimy([['vysvetli', 'cisla'], ['naDigital', 'naDigital'], ['naCifernik', 'naCifernik']], TX.rezimy, r => nastavRezim(r));
  sekcia.append(rez.el);
  const urov = vytvorVyberUrovne(id, () => nastavRezim(rezim));
  sekcia.append(urov.el);
  const hodinko = vytvorHodinka(sekcia, id);
  const zadanie = h('div', { class: 'zadanie', hidden: true });
  sekcia.append(zadanie);
  const cif = vytvorCifernik({ model: HODINY, karta: id });
  cif.farebnyDigital(true);
  const moznosti = h('div', { class: 'moznosti', role: 'group', 'aria-label': T.hra.moznostiAria, hidden: true });
  const akcie = h('div', { class: 'akcie' });
  sekcia.append(cif.el, moznosti, akcie);
  const nastavAkcie = (...tl) => akcie.replaceChildren(...tl.filter(Boolean));
  const sikovni = () => UROVNE[urov.uroven()].sikovni;
  // pri úrovni po 5 minútach len digitálny čas, bez slov
  const vyjadri = c => (sikovni() ? digitalny(c) : vyjadriCas(c));
  const hra = vytvorNastavovanie({ cif, hodinko, nastavAkcie, vyjadri });
  // zvýraznenie v displeji sa po každej zmene času obnoví (displej sa prekresľuje)
  let zvyraznenaCast = null;
  HODINY.subscribe(() => { if (zvyraznenaCast) cif.zvyrazniDigital(zvyraznenaCast); });
  const zvyrazniCast = c => { zvyraznenaCast = c; cif.zvyrazniDigital(c); };

  function vycisti() {
    cif.zastavAnimaciu(); cif.zvyrazni(null); cif.zvyrazniCisla([]); cif.duchCasu(null); zvyrazniCast(null);
    zadanie.hidden = true; moznosti.hidden = true;
  }
  function nastavRezim(r) {
    rezim = r; rez.oznac(r); vycisti();
    pouziPanel(id);
    if (r === 'vysvetli') vysvetli(0);
    else if (r === 'naDigital') ulohaNaDigital();
    else ulohaNaCifernik();
  }
  // vysvetlenie: „7“ sú hodiny, „30“ sú minúty, dvojbodka ich oddeľuje
  function vysvetli(k) {
    krokVysvetli = k;
    const [hh, mm] = digitalny(casVysvetli).split(':');
    cif.nastav({ tahat: null, tukat: false, cisla: false, drzMinuty: true });
    if (k === 0) {
      HODINY.setTime(casVysvetli);
      zvyrazniCast('h'); cif.zvyrazni('hodina');
      hodinko.povedz(fmt(TX.hodiny, { h: hh }), 'premysla');
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', () => vysvetli(1), 'primary'));
    } else if (k === 1) {
      zvyrazniCast('m'); cif.zvyrazni('minuta');
      hodinko.povedz(fmt(TX.minuty, { m: mm }), 'premysla');
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', () => vysvetli(2), 'primary'));
    } else if (k === 2) {
      zvyrazniCast('k'); cif.zvyrazni(null);
      hodinko.povedz(TX.dvojbodka, 'tesi');
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', () => vysvetli(3), 'primary'));
    } else {
      // voľné skúšanie: obe ručičky (pri celých hodinách len malá), krok podľa úrovne
      zvyrazniCast(null); cif.zvyrazni(null);
      cif.nastav({ tahat: urov.uroven() === 0 ? 'hodina' : 'obe', drzMinuty: true });
      hodinko.povedz(TX.skusaj, 'tesi');
      nastavAkcie(tlacidlo(TX.znova, 'znova', () => {
        casVysvetli = nahodnyCasUrovne(Math.max(1, urov.uroven()), Math.random, [casVysvetli]);
        vysvetli(0);
      }));
    }
  }
  // ciferník → digitál: tri digitálne možnosti, práve jedna správna
  function ulohaNaDigital() {
    vycisti();
    cif.nastav({ tahat: null, tukat: false, cisla: false });
    let z;
    if (prvyNaDigital && urov.uroven() === 1) z = { cas: 7 * 60 + 30, moznosti: [7 * 60 + 30, 6 * 60 + 30, 7 * 60] };   // príklad zo zadania
    else z = zadanieDigital(urov.uroven(), Math.random, predosly == null ? [] : [predosly]);
    prvyNaDigital = false;
    predosly = z.cas;
    cif.animujO(posunNa(z.cas), 800);
    hodinko.povedz(T.hra.otazka, 'premysla');
    ukazMoznosti({ obal: moznosti, casy: z.moznosti, spravny: z.cas, popis: c => digitalny(c), cif, hodinko,
      textDobre: fmt(T.hra.dobreVyber, { cas: vyjadri(z.cas) }), textZle: T.hra.zleVyber, nastavAkcie, dalej: ulohaNaDigital });
  }
  // digitál → ciferník: dieťa nastaví ručičky podľa digitálneho času
  function ulohaNaCifernik() {
    vycisti();
    const ciel = nahodnyCasUrovne(urov.uroven(), Math.random, predosly == null ? [] : [predosly]);
    predosly = ciel;
    HODINY.setTime(nahodnyCasUrovne(urov.uroven(), Math.random, [ciel]));
    vyplnZadanie(zadanie, ciel, false);
    cif.nastav({ tahat: urov.uroven() === 0 ? 'hodina' : 'obe', tukat: false, cisla: false, drzMinuty: true });
    hodinko.povedz(sikovni() ? TX.nastav : fmt(TX.nastavSlovom, { cas: vetaCasu(ciel) }), 'premysla');
    hra.start(ciel, ulohaNaCifernik);
  }

  KARTY[id] = {
    sekcia, cifernik: cif, hodinko,
    // digitálne hodiny pri ciferníku by prezradili odpoveď – ukazujú sa len pri vysvetlení
    skryDigital: () => rezim !== 'vysvetli',
    bezHlasu: () => !!sikovni(),
    priZobrazeni() {
      cif.nastavLegendu(true);
      if (!rezim) nastavRezim('vysvetli');
      else if (rezim === 'vysvetli') vysvetli(krokVysvetli);
      else nastavRezim(rezim);
    },
    priSkryti() { cif.ukonciTahanie(); cif.zastavAnimaciu(); },
    rezim: () => rezim
  };
}

/* =====================================================================
   KARTA 6: Hodinárova dielňa (hra)
   Úlohy podľa úrovne: chýba malá ručička, chýba veľká ručička, ručičky sú zamenené
   ===================================================================== */
function postavDielna() {
  const id = 'dielna', sekcia = kostraKarty(id), TX = T.dielna;
  let uloha = null, predosly = null, opravene = false;
  const urov = vytvorVyberUrovne(id, () => novaUloha());
  sekcia.append(urov.el);
  const hodinko = vytvorHodinka(sekcia, id);
  const zadanie = h('div', { class: 'zadanie', hidden: true });
  sekcia.append(zadanie);
  const cif = vytvorCifernik({ model: HODINY, karta: id,
    // zamenené ručičky: ťuknutím sa vrátia na svoje miesto
    onTukni: () => {
      if (!uloha || uloha.typ !== 'zamenene' || opravene) return;
      opravene = true;
      cif.nastav({ tukat: false });
      cif.animujZamenu(0, 900, () => {
        hodinko.povedz(TX.opravene, 'tesi');
        ukazMoznosti({ obal: moznosti, casy: uloha.moznosti, spravny: uloha.cas, popis: c => digitalny(c), cif, hodinko,
          textDobre: fmt(T.hra.dobreVyber, { cas: vyjadri(uloha.cas) }), textZle: T.hra.zleVyber, nastavAkcie, dalej: novaUloha });
      });
    },
    // chýbajúca ručička sa po potiahnutí ukáže celá
    onZmena: ({ ruka }) => cif.volna(ruka, false)
  });
  const moznosti = h('div', { class: 'moznosti', role: 'group', 'aria-label': T.hra.moznostiAria, hidden: true });
  const akcie = h('div', { class: 'akcie' });
  sekcia.append(cif.el, moznosti, akcie);
  const nastavAkcie = (...tl) => akcie.replaceChildren(...tl.filter(Boolean));
  const sikovni = () => UROVNE[urov.uroven()].sikovni;
  const vyjadri = c => (sikovni() ? digitalny(c) : vyjadriCas(c));
  const hra = vytvorNastavovanie({ cif, hodinko, nastavAkcie, vyjadri });

  function novaUloha() {
    cif.zastavAnimaciu(); cif.zvyrazni(null); cif.zvyrazniCisla([]); cif.duchCasu(null);
    cif.volna('hodina', false); cif.volna('minuta', false); cif.zamen(false);
    moznosti.hidden = true; zadanie.hidden = true; opravene = false;
    uloha = zadanieDielne(urov.uroven(), Math.random, predosly == null ? [] : [predosly]);
    predosly = uloha.cas;
    HODINY.setTime(uloha.start);
    if (uloha.typ === 'zamenene') {
      cif.zamen(true);
      cif.nastav({ tahat: null, tukat: true, cisla: false });
      hodinko.povedz(TX.zamenene, 'premysla');
      nastavAkcie();
      return;
    }
    vyplnZadanie(zadanie, uloha.cas, !sikovni());
    if (uloha.typ === 'bezMalej') {
      cif.volna('hodina', true);
      cif.nastav({ tahat: 'hodina', tukat: false, cisla: false, drzMinuty: true });
      hodinko.povedz(TX.bezMalej, 'premysla');
    } else {
      cif.volna('minuta', true);
      cif.nastav({ tahat: 'minuta', tukat: false, cisla: false, drzMinuty: true });
      hodinko.povedz(TX.bezVelkej, 'premysla');
    }
    hra.start(uloha.cas, novaUloha);
  }

  KARTY[id] = {
    sekcia, cifernik: cif, hodinko,
    skryDigital: () => true,
    bezHlasu: () => !!sikovni(),
    priZobrazeni() { cif.nastavLegendu(true); novaUloha(); },
    priSkryti() { cif.ukonciTahanie(); cif.zastavAnimaciu(); cif.zamen(false); },
    uloha: () => uloha
  };
}
