  zubyVecer: KEFKA + '<path d="M12 4a8 8 0 1 0 6 12a7 7 0 0 1-6-12z" fill="#ffd88a"/>',
  rozpravka: '<path d="M24 12C18 8 10 8 4 10v28c6-2 14-2 20 2z" fill="#fdf8ec"/><path d="M24 12c6-4 14-4 20-2v28c-6-2-14-2-20 2z" fill="#f3e7c8"/><path d="M24 12v28" stroke="#a3adc6" stroke-width="2"/>',
  spime: '<path d="M30 6a17 17 0 1 0 13 27a15 15 0 0 1-13-27z" fill="#ffd88a"/><path d="M5 9h9l-9 9h9" stroke="#b9a3ff" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M15 25h6l-6 6h6" stroke="#b9a3ff" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>'
};
const ikonaCinnosti = id => `<svg viewBox="0 0 48 48" aria-hidden="true">${IKONY_CINNOSTI[id]}</svg>`;
// slnko, mesiac a hviezdy na oblohe
const SLNKO_SVG = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3v8M32 53v8M3 32h8M53 32h8M11.5 11.5l5.6 5.6M46.9 46.9l5.6 5.6M11.5 52.5l5.6-5.6M46.9 17.1l5.6-5.6" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="32" r="15" fill="currentColor"/></svg>';
const MESIAC_SVG = '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M30 4a20 20 0 1 0 14 32A17 17 0 0 1 30 4z" fill="#fdf3c4"/></svg>';
const HVIEZDY_SVG = '<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
  [[22, 18], [64, 46], [98, 14], [140, 34], [180, 10], [214, 52], [252, 22], [290, 44], [330, 12], [372, 36], [44, 80], [120, 70], [236, 84], [314, 72], [386, 92], [160, 96]]
    .map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 3 ? 1.6 : 2.4}" fill="#fff"/>`).join('') + '</svg>';
const KOPCE_SVG = '<svg viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 60V34Q60 6 130 30T260 26T400 20V60Z" fill="currentColor"/></svg>';

// obloha: farby, slnko, mesiac a hviezdy podľa času (skyState); kresli(min) ju prekreslí
function vytvorOblohu(trieda = '') {
  const slnko = h('div', { class: 'slnko', html: SLNKO_SVG });
  const mesiac = h('div', { class: 'mesiac', html: MESIAC_SVG });
  const hviezdy = h('div', { class: 'hviezdy', html: HVIEZDY_SVG });
  const kopce = h('div', { class: 'kopce', html: KOPCE_SVG });
  // slnko a mesiac sa pohybujú v dráhe – pruhu oblohy nad ciferníkom
  const draha = h('div', { class: 'draha' }, slnko, mesiac);
  const el = h('div', { class: ('obloha ' + trieda).trim(), 'aria-hidden': 'true' }, hviezdy, draha, kopce);
  function kresli(min) {
    const o = skyState(min);
    el.style.background = `linear-gradient(${o.horna}, ${o.dolna})`;
    Object.assign(slnko.style, { left: o.slnko.x.toFixed(1) + '%', top: o.slnko.y.toFixed(1) + '%', opacity: o.slnko.viditelnost.toFixed(2), color: o.slnko.farba });
    Object.assign(mesiac.style, { left: o.mesiac.x.toFixed(1) + '%', top: o.mesiac.y.toFixed(1) + '%', opacity: o.mesiac.viditelnost.toFixed(2) });
    hviezdy.style.opacity = o.hviezdy.toFixed(2);
    kopce.style.color = o.kopce;
    el.dataset.stav = o.stav;
  }
  return { el, kresli };
}
// scéna: obloha v pozadí, ciferník vpredu a slovo časti dňa (partOfDay)
function vytvorScenu(cif, model = HODINY) {
  const obloha = vytvorOblohu();
  const cast = h('div', { class: 'castDna' });
  const el = h('div', { class: 'scena' }, obloha.el, cast, cif.el);
  function kresli(t) { obloha.kresli(t); cast.textContent = partOfDay(t); }
  model.subscribe(t => kresli(t));
  kresli(model.getTime());
  return {
    el, kresli,
    // slovo časti dňa sa dá skryť (v hre Čo robíme sa ukáže až ako nápoveda)
    ukazCast(v) { cast.hidden = !v; },
    napoveda(v) { el.classList.toggle('napoveda', !!v); cast.classList.toggle('svieti', !!v); if (v) cast.hidden = false; }
  };
}
// poznámka na každej obrazovke s činnosťami
const poznamkaDna = () => h('p', { class: 'poznamkaDen' }, DEN.poznamka);
// tlačidlo s obrázkom činnosti
function obrazokCinnosti(id, { sNazvom = true, trieda = '' } = {}) {
  return h('button', { type: 'button', class: ('cinnost ' + trieda).trim(), 'data-id': id, 'aria-label': CINNOST[id].nazov },
    h('span', { class: 'ikonaCinnosti', html: ikonaCinnosti(id) }), sNazvom ? h('span', { class: 'nazovCinnosti' }, CINNOST[id].nazov) : null);
}

/* =====================================================================
   KARTA 7: Čo robíme o tejto hodine?
   Ciferník s oblohou, tri obrázky – Hodinko vždy pochváli, iná voľba nie je „zlá“
   ===================================================================== */
function postavTeraz() {
  const id = 'teraz', sekcia = kostraKarty(id), TX = T.teraz;
  let uloha = null, predosla = null, hotovo = false;
  const hodinko = vytvorHodinka(sekcia, id);
  const cif = vytvorCifernik({ model: HODINY, karta: id });
  cif.nastavLegendu(false);
  const scena = vytvorScenu(cif);
  const moznosti = h('div', { class: 'obrazkove', role: 'group', 'aria-label': TX.moznostiAria });
  const akcie = h('div', { class: 'akcie' });
  sekcia.append(scena.el, moznosti, akcie, poznamkaDna());
  const nastavAkcie = (...tl) => akcie.replaceChildren(...tl.filter(Boolean));

  function novaUloha() {
    hotovo = false;
    uloha = zadanieTeraz(Math.random, predosla ? [predosla] : []);
    predosla = uloha.spravna;
    cif.nastav({ tahat: null, tukat: false, cisla: false });
    scena.napoveda(false); scena.ukazCast(false);
    const od = HODINY.getTime();
    let d = ((uloha.cas - od) % MIN_DNA + MIN_DNA) % MIN_DNA;   // čas ide vždy dopredu, ako počas dňa
    cif.animujO(d, Math.min(2200, 500 + d * 1.2), { naKrok: q => scena.kresli(od + d * q) });
    // hlas prečíta čas, nie činnosť
    hodinko.povedz(fmt(TX.otazka, { kedy: velkym(eventTimeSK(uloha.cas)) }), 'premysla');
    moznosti.replaceChildren(...uloha.moznosti.map(c => {
      const b = obrazokCinnosti(c);
      b.addEventListener('click', () => vyber(b, c));
      return b;
    }));
    nastavAkcie();
  }
  function vyber(b, c) {
    if (hotovo || b.disabled) return;
    cif.dokonciAnimaciu();
    if (c === uloha.spravna) {
      hotovo = true;
      b.classList.add('vybrana');
      for (const x of $$('button', moznosti)) if (x !== b) x.disabled = true;
      scena.ukazCast(true);
      hodinko.povedz(fmt(TX.dobre, { kedy: eventTimeSK(uloha.cas) }), 'tesi');
      pridajHviezdu(b);
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', novaUloha, 'primary'));
    } else {
      // nikdy „zle“: možno aj to, skús ešte raz; nápoveda = obloha a časť dňa
      b.classList.add('skusena');
      b.disabled = true;
      scena.napoveda(true);
      hodinko.povedz(TX.inak, 'povzbudzuje');
    }
  }

  KARTY[id] = {
    sekcia, cifernik: cif, hodinko,
    priZobrazeni() { novaUloha(); },
    priSkryti() { cif.zastavAnimaciu(); },
    uloha: () => uloha
  };
}

/* =====================================================================
   KARTA 8: Poskladaj si deň
   Časová os od rána do večera, ciferník v rohu. Kontroluje sa len poradie a časové okná.
   Režim Môj deň: vlastné časy, kontroluje sa len poradie. Nič sa neukladá.
   ===================================================================== */
const OS_OD = 5 * 60, OS_DO = 23 * 60;   // čiara dňa od 5:00 do 23:00
function postavDen() {
  const id = 'den', sekcia = kostraKarty(id), TX = T.den;
  sekcia.classList.add('siroka');   // čiara dňa potrebuje celú šírku
  let rezim = 'hra', prvak = false, cinnosti = [], vybrana = null, hraSa = false, poskladany = false;
  const umiestnenie = new Map();   // id → čas v minútach
  const krok = () => (prvak ? 60 : 15);

  // režimy + prepínač zjednodušenej verzie pre 1. ročník
  const rez = vytvorRezimy([['hra', 'skladaj'], ['moj', 'mojDen']], TX.rezimy, r => { rezim = r; rez.oznac(r); novyDen(); });
  const tlPrvak = h('button', { type: 'button', 'aria-pressed': 'false', onclick: () => { prvak = !prvak; tlPrvak.setAttribute('aria-pressed', String(prvak)); novyDen(); } },
    h('span', { html: IKONY.prvak, style: 'display:contents' }), TX.prvak);
  rez.el.append(tlPrvak);
  rez.el.style.setProperty('--stlpce', 3);
  sekcia.append(rez.el);
  const hodinko = vytvorHodinka(sekcia, id);
  // ciferník v rohu a čas vybranej činnosti
  const cif = vytvorCifernik({ model: HODINY, karta: id });
  cif.nastavLegendu(false);
  cif.nastav({ tahat: null, tukat: false, cisla: false });   // ciferník v rohu len ukazuje čas
  cif.el.classList.add('maly');
  const casText = h('div', { class: 'denCas', 'aria-live': 'polite' });
  const horny = h('div', { class: 'denHorny' }, cif.el, casText);
  // čiara dňa: obloha podľa času, značky hodín, umiestnené obrázky a ukazovateľ
  const pozadie = h('div', { class: 'osPozadie' });
  const znacky = h('div', { class: 'osZnacky', 'aria-hidden': 'true' });
  const ukazovatel = h('div', { class: 'osUkazovatel', hidden: true });
  const os = h('div', { class: 'os', role: 'group', 'aria-label': TX.osAria }, pozadie, znacky, ukazovatel);
  const zasobnik = h('div', { class: 'zasobnik', role: 'group', 'aria-label': TX.zasobnikAria });
  const akcie = h('div', { class: 'akcie' });
  sekcia.append(horny, os, zasobnik, akcie, poznamkaDna());
  const nastavAkcie = (...tl) => akcie.replaceChildren(...tl.filter(Boolean));

  // pozadie čiary: farby oblohy od rána do večera; značky každé 3 hodiny (čísla ako na ciferníku)
  pozadie.style.background = 'linear-gradient(to right,' + Array.from({ length: 10 }, (_, i) => {
    const t = OS_OD + i * (OS_DO - OS_OD) / 9;
    return `${skyState(t).horna} ${(i / 9 * 100).toFixed(1)}%`;
  }).join(',') + ')';
  for (let t = 6 * 60; t <= 21 * 60; t += 180) {
    znacky.append(h('span', { style: `left:${xCasu(t)}%` }, String(hodina12(t))));
  }
  function xCasu(t) { return ((t - OS_OD) / (OS_DO - OS_OD)) * 100; }
  // čas z polohy prsta na čiare (prichytené na štvrťhodiny, v 1. ročníku na celé hodiny)
  function casZBodu(clientX) {
    const r = os.getBoundingClientRect(), okraj = 30;
    const p = medzi01((clientX - r.left - okraj) / (r.width - 2 * okraj));
    const t = OS_OD + p * (OS_DO - OS_OD);
    return Math.max(OS_OD, Math.min(OS_DO, Math.round(t / krok()) * krok()));
  }
  const naOsi = (x, y) => { const r = os.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top - 30 && y <= r.bottom + 30; };

  // obrázky činností – raz v zásobníku, raz na čiare
  const karticky = new Map();
  function vytvorKarticku(cid) {
    const b = obrazokCinnosti(cid, { trieda: 'karticka' });
    let tah = null, klon = null;
    b.addEventListener('pointerdown', e => {
      if (hraSa) return;
      e.preventDefault();
      tah = { x0: e.clientX, y0: e.clientY, pohyb: false };
      try { b.setPointerCapture(e.pointerId); } catch (_) { /* syntetické udalosti */ }
    });
    b.addEventListener('pointermove', e => {
      if (!tah) return;
      if (!tah.pohyb && Math.hypot(e.clientX - tah.x0, e.clientY - tah.y0) > 8) {
        tah.pohyb = true;
        klon = h('div', { class: 'letiacaKarticka', html: ikonaCinnosti(cid), 'aria-hidden': 'true' });
        document.body.append(klon);
        b.classList.add('tahana');
      }
      if (!tah.pohyb) return;
      klon.style.transform = `translate(${e.clientX - 32}px,${e.clientY - 32}px)`;
      if (naOsi(e.clientX, e.clientY)) ukazCas(cid, casZBodu(e.clientX)); else ukazovatel.hidden = true;
    });
    const pusti = e => {
      if (!tah) return;
      const t = tah; tah = null;
      if (klon) { klon.remove(); klon = null; }
      b.classList.remove('tahana');
      ukazovatel.hidden = true;
      if (!t.pohyb) { vyber(cid); return; }
      if (e && e.type !== 'pointercancel' && naOsi(e.clientX, e.clientY)) umiestni(cid, casZBodu(e.clientX));
      else if (umiestnenie.has(cid)) { umiestnenie.delete(cid); prekresli(); }   // späť do zásobníka
    };
    b.addEventListener('pointerup', pusti);
    b.addEventListener('pointercancel', pusti);
    // klávesnica: Enter položí obrázok na čiaru, šípky ho posúvajú
    b.addEventListener('keydown', e => {
      if (hraSa) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!umiestnenie.has(cid)) { umiestni(cid, 12 * 60); b.focus(); } }
      else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && umiestnenie.has(cid)) {
        e.preventDefault();
        const t = umiestnenie.get(cid) + (e.key === 'ArrowRight' ? krok() : -krok());
        umiestni(cid, Math.max(OS_OD, Math.min(OS_DO, t)));
        b.focus();
      }
    });
    karticky.set(cid, b);
    return b;
  }
  // ťuknutie na obrázok ho vyberie, ťuknutie na čiaru ho tam položí
  function vyber(cid) {
    vybrana = vybrana === cid ? null : cid;
    for (const [k, b] of karticky) b.setAttribute('aria-pressed', String(k === vybrana));
    if (vybrana) hodinko.povedz(TX.vyber, 'premysla', false);
  }
  os.addEventListener('click', e => {
    if (hraSa || !vybrana || e.target.closest('.karticka')) return;
    umiestni(vybrana, casZBodu(e.clientX));
  });
  function ukazCas(cid, t) {
    ukazovatel.hidden = false;
    ukazovatel.style.left = xCasu(t) + '%';
    HODINY.setTime(t);
    casText.replaceChildren(h('span', { class: 'ikonaCinnosti', html: ikonaCinnosti(cid) }),
      h('span', {}, velkym(eventTimeSK(t)) + ' ' + partOfDay(t)));
  }
  function umiestni(cid, t) {
    umiestnenie.set(cid, t);
    vybrana = null;
    for (const b of karticky.values()) b.setAttribute('aria-pressed', 'false');
    poskladany = false;
    prekresli();
    ukazCas(cid, t);
    ukazovatel.hidden = true;
    hodinko.povedz(fmt(TX.vybrana, { nazov: CINNOST[cid].nazov, kedy: eventTimeSK(t) }), 'tesi');
    ponukniHotovo();
  }
  // rozloženie obrázkov na čiare do pruhov, aby sa neprekrývali
  function prekresli() {
    for (const b of karticky.values()) b.classList.remove('zvyraznena');
    const sirka = os.getBoundingClientRect().width || 320, okraj = 30;
    const px = t => okraj + (xCasu(t) / 100) * (sirka - 2 * okraj);
    const pruhy = [];
    const polozene = [...umiestnenie].sort((a, b) => a[1] - b[1]);
    for (const [cid, t] of polozene) {
      const b = karticky.get(cid), x = px(t);
      let p = pruhy.findIndex(posl => x - posl >= 66);
      if (p < 0) { p = pruhy.length; pruhy.push(x); } else pruhy[p] = x;
      b.classList.add('naOsi');
      b.style.left = x + 'px';
      b.style.bottom = (40 + Math.min(p, 3) * 68) + 'px';
      if (b.parentNode !== os) os.append(b);
    }
    os.style.height = (44 + Math.max(1, Math.min(4, pruhy.length)) * 68 + 8) + 'px';
    for (const cid of cinnosti) {
      if (umiestnenie.has(cid)) continue;
      const b = karticky.get(cid);
      b.classList.remove('naOsi'); b.style.left = ''; b.style.bottom = '';
      if (b.parentNode !== zasobnik) zasobnik.append(b);
    }
    zasobnik.hidden = umiestnenie.size === cinnosti.length;
  }
  function ponukniHotovo() {
    if (umiestnenie.size < cinnosti.length) { nastavAkcie(); return; }
    nastavAkcie(tlacidlo(TX.hotovo, 'hotovo', skontroluj, 'primary'));
  }
  function zoznam() { return [...umiestnenie].map(([id, cas]) => ({ id, cas })); }
  // kontrola: len poradie (a v hre aj časové okno), nikdy „správna“ hodina
  function skontroluj() {
    const zle = skontrolujPoradie(zoznam());
    if (zle) {
      zle.forEach(c => karticky.get(c).classList.add('zvyraznena'));
      hodinko.povedz(TX.zlePoradie, 'povzbudzuje');
      return;
    }
    if (rezim === 'hra') {
      const mimo = mimoOkna(zoznam());
      if (mimo) { karticky.get(mimo).classList.add('zvyraznena'); hodinko.povedz(TX.mimoOkna, 'povzbudzuje'); return; }
    }
    poskladany = true;
    hodinko.povedz(rezim === 'hra' ? TX.dobre : TX.dobreMoj, 'tesi');
    if (rezim === 'hra') pridajHviezdu(akcie.firstElementChild);
    nastavAkcie(tlacidlo(rezim === 'hra' ? TX.zahraj : TX.zahrajMoj, 'ukaz', zahraj, 'primary'), tlacidlo(TX.novy, 'znova', novyDen));
  }
  // „Zahrať (môj) deň“: ukazovateľ prejde čiarou, ciferník beží a pri každej činnosti Hodinko povie čas
  function zahraj() {
    if (hraSa) return;
    hraSa = true;
    const postupnost = [...umiestnenie].sort((a, b) => a[1] - b[1]);
    let i = 0, cas = Math.max(OS_OD, postupnost[0][1] - 30);
    ukazovatel.hidden = false;
    nastavAkcie();
    const dalsi = () => {
      if (!KARTY[id] || STAV.karta !== id || !hraSa) { hraSa = false; return; }
      if (i >= postupnost.length) {
        hraSa = false; ukazovatel.hidden = true;
        hodinko.povedz(TX.koniec, 'tesi');
        nastavAkcie(tlacidlo(rezim === 'hra' ? TX.zahraj : TX.zahrajMoj, 'ukaz', zahraj), tlacidlo(TX.novy, 'znova', novyDen, 'primary'));
        return;
      }
      const [cid, t] = postupnost[i++], od = cas;
      tween(Math.max(500, (t - od) * 12), p => {
        const x = od + (t - od) * p;
        ukazovatel.style.left = xCasu(x) + '%';
        HODINY.setTime(Math.round(x));
      }, () => {
        cas = t;
        ukazCas(cid, t);
        odskok(karticky.get(cid), 14);
        hodinko.povedz(fmt(TX.vybrana, { nazov: CINNOST[cid].nazov, kedy: eventTimeSK(t) }), 'tesi');
        setTimeout(dalsi, 1700);
      });
    };
    dalsi();
  }
  function novyDen() {
    hraSa = false; poskladany = false; vybrana = null;
    umiestnenie.clear();
    // 1. ročník: 5 činností; inak 7 náhodných z údajov (poradie v zásobníku je náhodné)
    cinnosti = prvak ? [...DEN.prvak] : zamiesaj(CINNOSTI.map(c => c.id)).slice(0, 7);
    cinnosti = zamiesaj(cinnosti);
    karticky.clear();
    $$('.karticka', os).forEach(b => b.remove());
    zasobnik.replaceChildren(...cinnosti.map(vytvorKarticku));
    STAV.karty[id].krok = krok();
    HODINY.setTime(OS_OD + 60);
    casText.replaceChildren();
    prekresli();
    hodinko.povedz(rezim === 'hra' ? TX.start : TX.startMoj, 'premysla');
    nastavAkcie();
  }
  window.addEventListener('resize', () => { if (STAV.karta === id) prekresli(); });

  KARTY[id] = {
    sekcia, cifernik: cif, hodinko,
    skryDigital: () => true,
    priZobrazeni() {
      rez.oznac(rezim);
      if (!cinnosti.length) novyDen(); else { prekresli(); hodinko.povedz(hodinko.text(), hodinko.vyraz(), false); }
    },
    priSkryti() { hraSa = false; },
    // pre testy: priame položenie obrázka a kontrola
    _umiestni: umiestni, _skontroluj: skontroluj, cinnosti: () => cinnosti, nastavPrvak(v) { prvak = v; tlPrvak.setAttribute('aria-pressed', String(v)); novyDen(); },
    nastavRezim(r) { rezim = r; rez.oznac(r); novyDen(); }, poskladany: () => poskladany
  };
}

/* =====================================================================
   KARTA 9: Ráno, poobede, večer
   Režimy: skúšaj (obloha s posuvníkom času), hra Ráno alebo večer?
   ===================================================================== */
function postavObloha() {
  const id = 'obloha', sekcia = kostraKarty(id), TX = T.ranoVecer;
  let rezim = null, uloha = null, predosla = null, hotovo = false;
  const rez = vytvorRezimy([['skusaj', 'skusaj'], ['hra', 'slnkoMesiac']], TX.rezimy, r => nastavRezim(r));
  sekcia.append(rez.el);
  const hodinko = vytvorHodinka(sekcia, id);
  const cif = vytvorCifernik({ model: HODINY, karta: id, format12: false });
  cif.nastavLegendu(false);
  const scena = vytvorScenu(cif);
  // posuvník času dňa (po štvrťhodinách)
  const posuvnik = h('input', { type: 'range', class: 'posuvnik', min: 0, max: MIN_DNA - 15, step: 15, 'aria-label': TX.posuvnik });
  posuvnik.addEventListener('input', () => HODINY.setTime(Number(posuvnik.value)));
  HODINY.subscribe(t => { posuvnik.value = t; posuvnik.setAttribute('aria-valuetext', velkym(opis24(t))); });
  const obalPosuvnika = h('div', { class: 'obalPosuvnika' }, h('span', { class: 'ikonaPosuvnika', html: MESIAC_SVG }), posuvnik,
    h('span', { class: 'ikonaPosuvnika slnkova', html: SLNKO_SVG }));
  // doplnok pre zvedavých: 24-hodinový zápis, len po rozkliknutí
  const opis = h('p', { class: 'opis24' });
  const sikovni = h('details', { class: 'sikovni' }, h('summary', {}, TX.sikovni), opis);
  HODINY.subscribe(t => { opis.textContent = fmt(TX.opis, { dig: digitalny(t, false), opis: opis24(t) }); });
  const moznosti = h('div', { class: 'oblohy', role: 'group', 'aria-label': TX.moznostiAria, hidden: true });
  const akcie = h('div', { class: 'akcie' });
  sekcia.append(scena.el, obalPosuvnika, sikovni, moznosti, akcie, poznamkaDna());
  const nastavAkcie = (...tl) => akcie.replaceChildren(...tl.filter(Boolean));

  function nastavRezim(r) {
    rezim = r; rez.oznac(r);
    cif.zastavAnimaciu();
    const skusaj = r === 'skusaj';
    obalPosuvnika.hidden = !skusaj; sikovni.hidden = !skusaj; moznosti.hidden = skusaj;
    if (skusaj) {
      scena.ukazCast(true);
      cif.nastav({ tahat: 'minuta', tukat: false, cisla: false });
      HODINY.setTime(Math.round(HODINY.getTime() / 15) * 15);
      opis.textContent = fmt(TX.opis, { dig: digitalny(HODINY.getTime(), false), opis: opis24(HODINY.getTime()) });
      hodinko.povedz(TX.skusaj, 'premysla');
      nastavAkcie();
    } else novaUloha();
  }
  // hra: ciferník a činnosť; rovnaká poloha ručičiek je dvakrát za deň, rozhoduje obloha a činnosť
  function novaUloha() {
    hotovo = false;
    uloha = zadanieRanoVecer(Math.random, predosla ? [predosla] : []);
    predosla = uloha.id;
    cif.nastav({ tahat: null, tukat: false, cisla: false });
    // ručičky ukážu čas, obloha za ciferníkom je neutrálna (scéna ukazuje obe možnosti až v tlačidlách)
    scena.el.classList.add('neutralna');
    scena.ukazCast(false);
    HODINY.setTime(uloha.cas);
    hodinko.povedz(fmt(TX.otazka, { nazov: CINNOST[uloha.id].nazov }), 'premysla');
    moznosti.replaceChildren(h('div', { class: 'ulohaCinnost', html: ikonaCinnosti(uloha.id), 'aria-hidden': 'true' }), ...uloha.moznosti.map(t => {
      const o = vytvorOblohu('mala');
      o.kresli(t);
      const b = h('button', { type: 'button', class: 'moznostOblohy', 'aria-label': partOfDay(t) }, o.el, h('span', {}, partOfDay(t)));
      b.addEventListener('click', () => vyber(b, t));
      return b;
    }));
    nastavAkcie();
  }
  function vyber(b, t) {
    if (hotovo || b.disabled) return;
    if (t === uloha.cas) {
      hotovo = true;
      b.classList.add('vybrana');
      for (const x of $$('button', moznosti)) if (x !== b) x.disabled = true;
      scena.el.classList.remove('neutralna');
      scena.kresli(t); scena.ukazCast(true);
      hodinko.povedz(fmt(TX.dobre, { kedy: velkym(eventTimeSK(t)), cast: partOfDay(t) }), 'tesi');
      pridajHviezdu(b);
      nastavAkcie(tlacidlo(TX.dalej, 'dalej', novaUloha, 'primary'));
    } else {
      b.classList.add('skusena');
      b.disabled = true;
      hodinko.povedz(TX.inak, 'povzbudzuje');
    }
  }

  KARTY[id] = {
    sekcia, cifernik: cif, hodinko,
    skryDigital: () => true,
    priZobrazeni() {
      scena.el.classList.remove('neutralna');
      if (!rezim) nastavRezim('skusaj'); else nastavRezim(rezim);
    },
    priSkryti() { cif.zastavAnimaciu(); scena.el.classList.remove('neutralna'); },
    uloha: () => uloha
  };
}

/* =====================================================================
   KARTA 10: Deň v rýchlom behu
   Čas beží rýchlo (korytnačka až zajac), obloha sa mení, obrázky sa objavujú v typickom čase.
   Žiadne body, len pozorovanie.
   ===================================================================== */
const BEH_OD = 6 * 60, BEH_DO = 22 * 60;
const BEH_RYCHLOSTI = [10, 25, 50, 100, 180];   // minút dňa za sekundu
function postavBeh() {
  const id = 'beh', sekcia = kostraKarty(id), TX = T.beh;
  let bezi = false, cas = BEH_OD, posledny = null, casovac = null, rychlost = 2;
  const hodinko = vytvorHodinka(sekcia, id);
  const cif = vytvorCifernik({ model: HODINY, karta: id });
  cif.nastavLegendu(false);
  const scena = vytvorScenu(cif);
  const pas = h('div', { class: 'pasCinnosti', role: 'group', 'aria-label': TX.pasAria });
  const tlBeh = h('button', { type: 'button', class: 'primary', onclick: () => (bezi ? pauza() : spusti()) });
  const tlOdRana = tlacidlo(TX.odRana, 'znova', () => { pauza(); odRana(); });
  const vyberRychlosti = h('input', { type: 'range', class: 'posuvnik', min: 0, max: BEH_RYCHLOSTI.length - 1, step: 1, value: rychlost, 'aria-label': TX.rychlost });
  vyberRychlosti.addEventListener('input', () => { rychlost = Number(vyberRychlosti.value); vyberRychlosti.setAttribute('aria-valuetext', String(rychlost + 1)); });
  const obalRychlosti = h('div', { class: 'obalPosuvnika' },
    h('span', { class: 'ikonaPosuvnika', html: IKONY.korytnacka, title: TX.pomaly }), vyberRychlosti, h('span', { class: 'ikonaPosuvnika', html: IKONY.zajac, title: TX.rychlo }));
  const ovladanie = h('div', { class: 'akcie' }, tlBeh, tlOdRana);
  sekcia.append(scena.el, pas, ovladanie, obalRychlosti, poznamkaDna());

  function obnovTlacidlo() {
    tlBeh.replaceChildren(h('span', { html: bezi ? IKONY.pauza : IKONY.dalej, style: 'display:contents' }), bezi ? TX.pauza : TX.spustit);
  }
  function odRana() {
    cas = BEH_OD; posledny = BEH_OD - 1;
    pas.replaceChildren();
    HODINY.setTime(cas);
    hodinko.povedz(TX.start, 'premysla');
    obnovTlacidlo();
  }
  // obrázky činností, ktorých typický čas práve prešiel
  function objav(od, po) {
    for (const c of CINNOSTI) {
      if (c.typicky > od && c.typicky <= po) {
        const b = obrazokCinnosti(c.id, { sNazvom: false });
        b.addEventListener('click', () => hodinko.povedz(fmt(TX.oznam, { nazov: c.nazov, kedy: eventTimeSK(c.typicky) }), 'tesi'));
        pas.append(b);
        odskok(b, 12);
        hodinko.povedz(fmt(TX.oznam, { nazov: c.nazov, kedy: eventTimeSK(c.typicky) }), 'tesi');
      }
    }
  }
  function krok(dtSekundy) {
    const novy = Math.min(BEH_DO, cas + BEH_RYCHLOSTI[rychlost] * dtSekundy);
    objav(Math.floor(cas), Math.floor(novy));
    cas = novy;
    HODINY.setTime(Math.floor(cas));
    if (cas >= BEH_DO) { pauza(); hodinko.povedz(TX.koniec, 'tesi'); }
  }
  function spusti() {
    if (cas >= BEH_DO) odRana();
    bezi = true; obnovTlacidlo();
    if (posledny === null || cas === BEH_OD) hodinko.povedz(TX.bezi, 'tesi', false);
    if (smieHybat()) {
      let t0 = null;
      const tik = t => {
        if (!bezi) return;
        if (t0 !== null) krok(Math.min(0.1, (t - t0) / 1000));
        t0 = t;
        if (bezi) casovac = requestAnimationFrame(tik);
      };
      casovac = requestAnimationFrame(tik);
    } else {
      // bez plynulého pohybu: čas skáče raz za sekundu
      const skok = () => { if (!bezi) return; krok(1); if (bezi) casovac = setTimeout(skok, 1000); };
      casovac = setTimeout(skok, 1000);
    }
  }
  function pauza() {
    bezi = false;
    cancelAnimationFrame(casovac); clearTimeout(casovac);
    obnovTlacidlo();
  }

  KARTY[id] = {
    sekcia, cifernik: cif, hodinko,
    skryDigital: () => true,
    priZobrazeni() {
      cif.nastav({ tahat: null, tukat: false, cisla: false });
      if (posledny === null) odRana(); else { HODINY.setTime(Math.floor(cas)); obnovTlacidlo(); }
    },
    priSkryti() { pauza(); },
    // pre testy: posun času bez animácie
    _krok: krok, _odRana: odRana, bezi: () => bezi, cas: () => cas, pas: () => pas
  };
}

/* =====================================================================
   ČASŤ 4 – generátory úloh (trvanie, kvíz)
   ===================================================================== */
const DLZKY_VSETKY = [15, 30, 45, 60, 90, 120, 180, 240, 300];
// úroveň 0 = celé hodiny, 1 = aj polhodiny, 2 = aj štvrťhodiny
const dlzkaNaUrovni = (d, u) => d % [60, 30, 15][u] === 0;
// úloha „Koľko to trvá?“: činnosť, od, do a tri rôzne trvania (práve jedno správne)
function zadanieTrvania(rng = Math.random, u = 2, okrem = []) {
  const kand = CINNOSTI.filter(c => c.dlzky && c.dlzky.some(d => dlzkaNaUrovni(d, u)) && !okrem.includes(c.id));
  const c = kand[Math.floor(rng() * kand.length)];
  const dl = c.dlzky.filter(d => dlzkaNaUrovni(d, u));
  const d = dl[Math.floor(rng() * dl.length)];
  const od = c.typicky, po = od + d;
  // nesprávne možnosti: najbližšie trvania na danej úrovni
  const blizke = DLZKY_VSETKY.filter(x => x !== d && dlzkaNaUrovni(x, u)).sort((a, b) => Math.abs(a - d) - Math.abs(b - d)).slice(0, 4);
  return { id: c.id, od, po, trvanie: minutesBetween(od, po), moznosti: zamiesaj([d, ...zamiesaj(blizke, rng).slice(0, 2)], rng) };
}
// úloha „Koľko hodín je medzi…?“: celé hodiny v rámci jedného dňa (6:00 až 22:00), bez polnoci
function zadanieMedzi(rng = Math.random) {
  const od = (6 + Math.floor(rng() * 12)) * 60, k = 1 + Math.floor(rng() * 5), po = od + k * 60;
  const ine = zamiesaj([1, 2, 3, 4, 5, 6].filter(x => x !== k), rng).slice(0, 2);
  return { od, po, trvanie: minutesBetween(od, po), moznosti: zamiesaj([k, ...ine].map(x => x * 60), rng) };
}
// kvíz: typy otázok a nesprávne možnosti pre „koľko minút“ (typické omyly: 100 ako pri metroch, 12 a 24 ako pri hodinách, číslica na ciferníku namiesto minút)
const TYPY_KVIZU = ['citaj', 'nastav', 'slovom', 'teraz', 'trvanie', 'minuty', 'ranoVecer'];
const MINUTY_OMYLY = { 60: [100, 30, 24, 12], 30: [50, 60, 15, 6], 15: [25, 30, 45, 3], 45: [75, 30, 60, 9] };
// otázka kvízu; správna odpoveď sa vždy vypočíta z času (alebo z údajov), nikdy nie je zapísaná
// uroven 0 = celé hodiny, 1 = polhodiny, 2 = štvrťhodiny
function otazkaKvizu(typ, uroven, rng = Math.random) {
  const u = uroven;   // index do UROVNE (celé, pol, štvrť)
  if (typ === 'citaj') { const z = zadanieDigital(u, rng); return { typ, cas: z.cas, moznosti: z.moznosti, spravna: z.cas }; }
  if (typ === 'nastav') { const cas = nahodnyCasUrovne(u, rng); return { typ, cas, start: nahodnyCasUrovne(u, rng, [cas]), moznosti: null, spravna: cas }; }
  if (typ === 'slovom') {
    const cas = nahodnyCasUrovne(u, rng);
    const chyby = zamiesaj(chybneCasy(cas, u).filter(c => vetaCasu(c)), rng).slice(0, 2);
    while (chyby.length < 2) { const c = nahodnyCasUrovne(u, rng, [cas, ...chyby]); if (vetaCasu(c)) chyby.push(c); }
    return { typ, cas, moznosti: zamiesaj([cas, ...chyby], rng), spravna: cas };
  }
  if (typ === 'teraz') { const z = zadanieTeraz(rng); return { typ, cas: z.cas, moznosti: z.moznosti, spravna: z.spravna }; }
  if (typ === 'trvanie') { const z = zadanieTrvania(rng, u); return { typ, id: z.id, od: z.od, po: z.po, moznosti: z.moznosti, spravna: z.trvanie }; }
  if (typ === 'minuty') {
    const vyber = [[60, 30], [60, 30, 15], [60, 30, 15, 45]][u];
    const n = vyber[Math.floor(rng() * vyber.length)];
    return { typ, n, moznosti: zamiesaj([n, ...zamiesaj(MINUTY_OMYLY[n], rng).slice(0, 2)], rng), spravna: n };
  }
  const z = zadanieRanoVecer(rng);
  return { typ: 'ranoVecer', id: z.id, cas: z.cas, moznosti: z.moznosti, spravna: z.cas };
}
// sada 12 otázok: každý typ aspoň raz, ostatné náhodne, poradie zamiešané
function sadaKvizu(uroven, rng = Math.random, pocet = 12) {
  const typy = [...TYPY_KVIZU];
  while (typy.length < pocet) typy.push(TYPY_KVIZU[Math.floor(rng() * TYPY_KVIZU.length)]);
  return zamiesaj(typy, rng).map(t => otazkaKvizu(t, uroven, rng));
}
// slovo „hodina“ pre otázku „1 hodina je koľko minút?“
const nazovMinut = n => (n === 60 ? T.minuty.jednaHodina : durationSK(n));

/* =====================================================================
   KARTA 11: Ako dlho to trvá?
   Dva ciferníky (od, do) a farebný oblúk medzi časmi. Režimy: pozri, hra (Koľko to trvá?), medzi (Koľko hodín?)
   ===================================================================== */
function postavTrvanie() {
  const id = 'trvanie', sekcia = kostraKarty(id), TX = T.trvanieKarta;
  let rezim = null, priklad = 0, predosla = null;
  const rez = vytvorRezimy([['pozri', 'pozri'], ['hra', 'citaj'], ['medzi', 'dveHodiny']], TX.rezimy, r => nastavRezim(r));
  sekcia.append(rez.el);
  const hodinko = vytvorHodinka(sekcia, id);
  // ciferník „od“ má vlastný čas, ciferník „do“ ukazuje hlavné hodiny a oblúk
  const modelOd = vytvorCas(8 * 60);
  const cifOd = vytvorCifernik({ model: modelOd, krok: () => 15 });
  const cifDo = vytvorCifernik({ model: HODINY, karta: id });
  const stitokOd = h('div', { class: 'stitok' }), stitokDo = h('div', { class: 'stitok' });
  for (const [c, st] of [[cifOd, stitokOd], [cifDo, stitokDo]]) {
    c.nastavLegendu(false); c.nastavDigital(false); c.nastav({ tahat: null, tukat: false, cisla: false });
    c.el.classList.add('polovica'); c.el.append(st);
  }
  const dvojica = h('div', { class: 'dvojica' }, cifOd.el, cifDo.el);
  const moznosti = h('div', { class: 'moznosti slovne', role: 'group', 'aria-label': T.hra.moznostiAria, hidden: true });
  const akcie = h('div', { class: 'akcie' });
  sekcia.append(dvojica, moznosti, akcie, poznamkaDna());
  const nastavAkcie = (...tl) => akcie.replaceChildren(...tl.filter(Boolean));

  // oblúk na ciferníku „do“: pri menej ako hodine minútový koláč, inak oblúk malej ručičky; duch ukáže začiatok
  function oblukMedzi(od, po, t) {
    if (t <= od) { cifDo.vysec(null); return; }
    const d = t - od;
    if (po - od < 60) cifDo.vysec(od % 60, od % 60 + d);
    else cifDo.vysec(uholHodinovej(od) / 6, uholHodinovej(od) / 6 + d / 12);
  }
  function ukazCasy(od, po, animovat = true) {
    cifDo.zastavAnimaciu();
    modelOd.setTime(od);
    HODINY.setTime(od);
    stitokOd.textContent = fmt(TX.od, { cas: digitalny(od, false) });
    stitokDo.textContent = fmt(TX.do, { cas: digitalny(po, false) });
    cifDo.duchCasu(od);
    cifDo.animujO(po - od, animovat ? Math.min(2600, 600 + (po - od) * 8) : 0, { krivka: ease.linear, naKrok: q => oblukMedzi(od, po, od + (po - od) * q), hotovo: () => oblukMedzi(od, po, po) });
  }
  // príklady na pozeranie: z údajov o činnostiach, celé hodiny a vety najviac s 8 slovami
  const priklady = [];
  for (const c of CINNOSTI) for (const d of c.dlzky || []) {
    const veta = fmt(TX.pozri, { a: bezO(c.typicky), b: bezO(c.typicky + d), je: jeSu(d), d: durationSK(d) });
    if (veta.split(/\s+/).length <= 8) priklady.push({ id: c.id, od: c.typicky, po: c.typicky + d, veta });
  }
  priklady.sort((a, b) => (b.id === 'skola') - (a.id === 'skola'));   // prvý príklad: škola od 8:00 do 12:00

  function nastavRezim(r) {
    rezim = r; rez.oznac(r);
    moznosti.hidden = r === 'pozri';
    if (r === 'pozri') pozri();
    else if (r === 'hra') novaUloha();
    else novaMedzi();
  }
  function pozri() {
    const p = priklady[priklad % priklady.length];
    ukazCasy(p.od, p.po);
    hodinko.povedz(p.veta, 'tesi');
    nastavAkcie(tlacidlo(TX.dalsi, 'dalej', () => { priklad++; pozri(); }, 'primary'), tlacidlo(TX.naHru, 'citaj', () => nastavRezim('hra')));
  }
  function novaUloha() {
    const z = zadanieTrvania(Math.random, 2, predosla ? [predosla] : []);
    predosla = z.id;
    ukazCasy(z.od, z.po);
    hodinko.povedz(fmt(TX.otazka, { nazov: CINNOST[z.id].nazov }), 'premysla');
    ukazMoznosti({ obal: moznosti, casy: z.moznosti, spravny: z.trvanie, popis: durationSK, cif: cifDo, hodinko,
      textDobre: fmt(TX.dobre, { je: jeSu(z.trvanie), d: durationSK(z.trvanie) }), textZle: TX.inak, nastavAkcie, dalej: novaUloha });
  }
  function novaMedzi() {
    const z = zadanieMedzi();
    ukazCasy(z.od, z.po);
    hodinko.povedz(TX.medziOtazka, 'premysla');
    ukazMoznosti({ obal: moznosti, casy: z.moznosti, spravny: z.trvanie, popis: durationSK, cif: cifDo, hodinko,
      textDobre: fmt(TX.dobre, { je: jeSu(z.trvanie), d: durationSK(z.trvanie) }), textZle: TX.inak, nastavAkcie, dalej: novaMedzi });
  }

  KARTY[id] = {
    sekcia, cifernik: cifDo, hodinko,
    skryDigital: () => true,
    priZobrazeni() { pouziCislice(); if (!rezim) nastavRezim('pozri'); else nastavRezim(rezim); },
    priSkryti() { cifDo.zastavAnimaciu(); cifDo.vysec(null); cifDo.duchCasu(null); },
    rezim: () => rezim
  };
  // číslice z panelu platia aj pre druhý ciferník
  function pouziCislice() { cifOd.nastavCislice(STAV.cislice); }
}

/* =====================================================================
   KARTA 12: Hodina a minúty
   Režimy: pozri (štvrť, pol, trištvrte, celé kolo), ťahaj (koľko minút prešlo), sekundy (tenká ručička)
   ===================================================================== */
const SEKUNDY_RYCHLOSTI = [1, 3, 6, 12, 30];   // sekúnd za sekundu (zrýchlené)
function postavMinuty() {
  const id = 'minuty', sekcia = kostraKarty(id), TX = T.minuty;
  let rezim = null, krokPozri = 0, start = 7 * 60, preslo = 0, bezi = false, sekUhol = 0, casovac = null, rychlost = 2;
  const rez = vytvorRezimy([['pozri', 'pozri'], ['tahaj', 'skusaj'], ['sekundy', 'sekundy']], TX.rezimy, r => nastavRezim(r));
  sekcia.append(rez.el);
  const hodinko = vytvorHodinka(sekcia, id);
  const cif = vytvorCifernik({ model: HODINY, karta: id,
    onZmena: ({ delta, ruka }) => { if (rezim === 'tahaj' && ruka === 'minuta') pridaj(delta); } });
  const plakety = h('div', { class: 'plakety', 'aria-live': 'polite' });
  const stitokSek = h('div', { class: 'stitok sekundovy', hidden: true }, TX.tenka);
  cif.el.append(stitokSek, plakety);
  const tlBeh = h('button', { type: 'button', class: 'primary', onclick: () => (bezi ? pauza() : spusti()) });
  const vyberRychlosti = h('input', { type: 'range', class: 'posuvnik', min: 0, max: SEKUNDY_RYCHLOSTI.length - 1, step: 1, value: rychlost, 'aria-label': TX.rychlost });
  vyberRychlosti.addEventListener('input', () => { rychlost = Number(vyberRychlosti.value); });
  const obalRychlosti = h('div', { class: 'obalPosuvnika', hidden: true },
    h('span', { class: 'ikonaPosuvnika', html: IKONY.korytnacka }), vyberRychlosti, h('span', { class: 'ikonaPosuvnika', html: IKONY.zajac }));
  const akcie = h('div', { class: 'akcie' });
  sekcia.append(cif.el, akcie, obalRychlosti);
  const nastavAkcie = (...tl) => akcie.replaceChildren(...tl.filter(Boolean));
  const plaketa = text => { plakety.replaceChildren(h('div', { class: 'plaketa' }, text)); odskok(plakety, 10); };
  // „štvrť hodiny = 15 minút“, „1 hodina = 60 minút“
  const rovnost = n => fmt(TX.rovnost, { t: velkym(nazovMinut(n)), n });

  function vycisti() {
    pauza(); cif.zastavAnimaciu(); cif.vysec(null); cif.zvyrazni(null); cif.sekundy(null);
    plakety.replaceChildren(); stitokSek.hidden = true; obalRychlosti.hidden = true;
  }
  function nastavRezim(r) {
    rezim = r; rez.oznac(r); vycisti();
    if (r === 'pozri') pozri(0);
    else if (r === 'tahaj') tahaj();
    else sekundy();
  }
  // animácia po štvrtinách kola: 15, 30, 45, 60 minút
  const KROKY_POZRI = [15, 30, 45, 60];
  const VETY_POZRI = () => [TX.stvrt, TX.pol, TX.tristvrte, TX.kolo];
  function pozri(k) {
    krokPozri = k;
    cif.nastav({ tahat: null, tukat: false, cisla: false });
    if (k === 0) {
      HODINY.setTime(start); cif.vysec(null); plakety.replaceChildren();
      hodinko.povedz(TX.start, 'premysla');
      nastavAkcie(tlacidlo(TX.ukazMi, 'ukaz', () => posun(1), 'primary'));
      return;
    }
    const n = KROKY_POZRI[k - 1];
    HODINY.setTime(start + n); cif.vysec(0, n); cif.zvyrazni('minuta');
    plaketa(rovnost(n));
    hodinko.povedz(VETY_POZRI()[k - 1], 'tesi');
    if (k < 4) nastavAkcie(tlacidlo(TX.dalej, 'dalej', () => posun(k + 1), 'primary'));
    else nastavAkcie(tlacidlo(TX.znova, 'znova', () => pozri(0)), tlacidlo(TX.naTahaj, 'skusaj', () => nastavRezim('tahaj'), 'primary'));
  }
  function posun(k) {
    nastavAkcie();
    const od = k === 1 ? 0 : KROKY_POZRI[k - 2], po = KROKY_POZRI[k - 1];
    cif.zvyrazni('minuta');
    cif.animujO(po - od, 1600, { krivka: ease.linear, naKrok: q => cif.vysec(0, od + (po - od) * q), hotovo: () => pozri(k) });
  }
  // ťahanie: dieťa potiahne veľkú ručičku a vidí, koľko minút prešlo
  function tahaj() {
    HODINY.setTime(start); preslo = 0;
    cif.nastav({ tahat: 'minuta', tukat: false, cisla: false });
    cif.zvyrazni('minuta');
    plaketa(minutySK(0));
    hodinko.povedz(TX.tahaj, 'premysla');
    nastavAkcie(tlacidlo(TX.znova, 'znova', tahaj));
  }
  function pridaj(delta) {
    preslo = Math.max(0, preslo + delta);
    cif.vysec(0, Math.min(60, preslo));
    const pomenovane = T.dlzky[preslo] && preslo <= 60;
    plakety.replaceChildren(h('div', { class: 'plaketa' }, pomenovane ? rovnost(preslo) : minutySK(preslo)));
    // Hodinko hovorí len pri štvrtiach kola, aby nebol príliš uvravený
    if (pomenovane) hodinko.povedz(fmt(TX.preslo, { m: durationSK(preslo) }), 'tesi');
  }
  // sekundová ručička: tenká, obehne ciferník za minútu (zrýchlene); nič sa nemeria ani neodpočítava
  function sekundy() {
    HODINY.setTime(start); sekUhol = 0;
    cif.nastav({ tahat: null, tukat: false, cisla: false });
    cif.sekundy(0); stitokSek.hidden = false; obalRychlosti.hidden = false;
    plaketa(TX.sekundaRovnost);
    hodinko.povedz(TX.sekundy, 'premysla');
    obnovTlacidlo();
    nastavAkcie(tlBeh);
  }
  function obnovTlacidlo() {
    tlBeh.replaceChildren(h('span', { html: bezi ? IKONY.pauza : IKONY.dalej, style: 'display:contents' }), bezi ? TX.pauza : TX.spustit);
  }
  function krokSekund(dt) {
    sekUhol += 6 * SEKUNDY_RYCHLOSTI[rychlost] * dt;
    if (sekUhol >= 360) {
      // tenká ručička obehla kolo: prešla jedna minúta
      sekUhol -= 360;
      HODINY.setTime(HODINY.getTime() + 1);
      plaketa(TX.sekundaRovnost);
      hodinko.povedz(TX.sekundyKolo, 'tesi');
    }
    cif.sekundy(sekUhol);
  }
  function spusti() {
    bezi = true; obnovTlacidlo();
    if (smieHybat()) {
      let t0 = null;
      const tik = t => { if (!bezi) return; if (t0 !== null) krokSekund(Math.min(0.1, (t - t0) / 1000)); t0 = t; casovac = requestAnimationFrame(tik); };
      casovac = requestAnimationFrame(tik);
    } else {
      const skok = () => { if (!bezi) return; krokSekund(1); casovac = setTimeout(skok, 1000); };
      casovac = setTimeout(skok, 1000);
    }
  }
  function pauza() { bezi = false; cancelAnimationFrame(casovac); clearTimeout(casovac); obnovTlacidlo(); }

  KARTY[id] = {
    sekcia, cifernik: cif, hodinko,
    skryDigital: () => rezim !== 'tahaj',
    priZobrazeni() { cif.nastavLegendu(true); if (!rezim) nastavRezim('pozri'); else nastavRezim(rezim); },
    priSkryti() { vycisti(); },
    priZmeneKroku() {},
    rezim: () => rezim, _pridaj: pridaj, _krokSekund: krokSekund
  };
}

/* =====================================================================
   KARTA 13: Týždeň a rok
   Režimy: týždeň (poradie dní), dnes (včera, dnes, zajtra), rok (koleso mesiacov), koľko (deň, týždeň, rok)
   ===================================================================== */
// ročné obdobia: tvar aj farba (snehová vločka, kvet, slnko, list)
const OBDOBIA = {
  zima: { farba: '#d6e9ff', tmava: '#2f6fc0', ikona: '<path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>' },
  jar: { farba: '#d7f5dc', tmava: '#2f8f45', ikona: '<circle cx="12" cy="6" r="4" fill="currentColor"/><circle cx="18" cy="11" r="4" fill="currentColor"/><circle cx="6" cy="11" r="4" fill="currentColor"/><circle cx="12" cy="12" r="3" fill="#ffd23f"/>' },
  leto: { farba: '#fff1b8', tmava: '#9a6a00', ikona: '<circle cx="12" cy="12" r="5.5" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2 2M17.4 17.4l2 2M4.6 19.4l2-2M17.4 6.6l2-2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' },
  jesen: { farba: '#ffdcc7', tmava: '#b4521c', ikona: '<path d="M4 20C4 9 11 3 21 3c0 10-6 17-17 17z" fill="currentColor"/><path d="M4 20L15 9" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>' }
};
const OBDOBIE_MESIACA = ['zima', 'zima', 'jar', 'jar', 'jar', 'leto', 'leto', 'leto', 'jesen', 'jesen', 'jesen', 'zima'];
const ikonaObdobia = (o, velkost = 24) => `<svg viewBox="0 0 24 24" width="${velkost}" height="${velkost}" aria-hidden="true" style="color:${OBDOBIA[o].tmava}">${OBDOBIA[o].ikona}</svg>`;
function postavTyzden() {
  const id = 'tyzden', sekcia = kostraKarty(id), TX = T.tyzden;
  let rezim = null, poradie = [], vybrany = null, dnes = null, mesiac = null;
  const rez = vytvorRezimy([['tyzden', 'tyzden'], ['dnes', 'dnes'], ['rok', 'rok'], ['vztahy', 'kolko']], TX.rezimy, r => nastavRezim(r));
  rez.el.classList.add('styri');
  sekcia.append(rez.el);
  const hodinko = vytvorHodinka(sekcia, id);
  const akcie = h('div', { class: 'akcie' });
  const nastavAkcie = (...tl) => akcie.replaceChildren(...tl.filter(Boolean));
  const den = i => TX.dni[i];

  /* ----- týždeň: dni v rade, dieťa ich vymieňa (ťahaním alebo dvomi ťuknutiami) ----- */
  const dniObal = h('div', { class: 'dniTyzdna', role: 'group', 'aria-label': TX.tyzdenAria });
  function vykresliDni(hotovo = false) {
    dniObal.replaceChildren(...poradie.map((d, pozicia) => {
      const b = h('button', { type: 'button', class: 'denKarta' + (hotovo && d >= 5 ? ' vikend' : ''), 'data-den': d, 'aria-pressed': String(vybrany === pozicia) },
        h('span', { class: 'poradieDna', 'aria-hidden': 'true' }, String(pozicia + 1) + '.'), den(d),
        hotovo && d >= 5 ? h('span', { class: 'stitokVikend' }, h('span', { html: IKONY.domcek, style: 'display:contents' }), TX.vikend) : null);
      pridajTahanieDna(b, pozicia);
      b.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          e.preventDefault();
          const ina = pozicia + (e.key === 'ArrowRight' ? 1 : -1);
          if (ina >= 0 && ina < 7) { vymen(pozicia, ina); $$('.denKarta', dniObal)[ina].focus(); }
        } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tukni(pozicia); $$('.denKarta', dniObal)[pozicia].focus(); }
      });
      return b;
    }));
  }
  function tukni(pozicia) {
    if (vybrany === null) { vybrany = pozicia; vykresliDni(); return; }
    const a = vybrany; vybrany = null;
    if (a !== pozicia) vymen(a, pozicia); else vykresliDni();
  }
  function vymen(a, b) {
    [poradie[a], poradie[b]] = [poradie[b], poradie[a]];
    vybrany = null;
    vykresliDni();
  }
  // ťahanie dňa na iný deň ich vymení; ťuknutie bez pohybu deň vyberie
  function pridajTahanieDna(b, pozicia) {
    let tah = null, klon = null;
    b.addEventListener('pointerdown', e => { e.preventDefault(); tah = { x0: e.clientX, y0: e.clientY, pohyb: false }; try { b.setPointerCapture(e.pointerId); } catch (_) { /* nič */ } });
    b.addEventListener('pointermove', e => {
      if (!tah) return;
      if (!tah.pohyb && Math.hypot(e.clientX - tah.x0, e.clientY - tah.y0) > 8) {
        tah.pohyb = true;
        klon = h('div', { class: 'letiaciDen', 'aria-hidden': 'true' }, b.textContent.replace(/^\d+\./, ''));
        document.body.append(klon); b.classList.add('tahana');
      }
      if (klon) klon.style.transform = `translate(${e.clientX - 60}px,${e.clientY - 30}px)`;
    });
    const pusti = e => {
      if (!tah) return;
      const t = tah; tah = null;
      if (klon) { klon.remove(); klon = null; }
      b.classList.remove('tahana');
      if (!t.pohyb) { tukni(pozicia); return; }
      const ciel = e && document.elementFromPoint(e.clientX, e.clientY);
      const kam = ciel && ciel.closest && ciel.closest('.denKarta');
      if (kam && kam !== b) vymen(pozicia, $$('.denKarta', dniObal).indexOf(kam)); else vykresliDni();
    };
    b.addEventListener('pointerup', pusti);
    b.addEventListener('pointercancel', () => { tah = null; if (klon) { klon.remove(); klon = null; } b.classList.remove('tahana'); });
  }
  function skontrolujTyzden() {
    const zle = poradie.map((d, i) => d !== i);
    if (!zle.some(Boolean)) {
      vykresliDni(true);
      hodinko.povedz(TX.tyzdenDobre, 'tesi');
      pridajHviezdu(akcie.firstElementChild);
      nastavAkcie(tlacidlo(TX.znova, 'znova', novyTyzden));
      return;
    }
    vykresliDni();
    $$('.denKarta', dniObal).forEach((b, i) => b.classList.toggle('zvyraznena', zle[i]));
    hodinko.povedz(TX.tyzdenSkus, 'povzbudzuje');
  }
  function novyTyzden() {
    do { poradie = zamiesaj([0, 1, 2, 3, 4, 5, 6]); } while (poradie.every((d, i) => d === i));
    vybrany = null;
    vykresliDni();
    hodinko.povedz(TX.tyzdenStart, 'premysla');
    nastavAkcie(tlacidlo(TX.hotovo, 'hotovo', skontrolujTyzden, 'primary'));
  }

  /* ----- dnes: dieťa si vyberie dnešný deň, ukáže sa včera a zajtra ----- */
  const dnesObal = h('div', { class: 'dniTyzdna', role: 'group', 'aria-label': TX.dnesAria });
  const trojica = h('div', { class: 'trojica', 'aria-live': 'polite' });
  for (let i = 0; i < 7; i++) {
    const b = h('button', { type: 'button', class: 'denKarta', 'aria-pressed': 'false' }, den(i));
    b.addEventListener('click', () => vyberDnes(i));
    dnesObal.append(b);
  }
  function vyberDnes(i) {
    dnes = i;
    $$('.denKarta', dnesObal).forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
    const vcera = (i + 6) % 7, zajtra = (i + 1) % 7;
    trojica.replaceChildren(...[[TX.vcera, vcera], [TX.dnes, i], [TX.zajtra, zajtra]].map(([slovo, d]) =>
      h('div', { class: 'denChip' + (d === i ? ' dnes' : '') }, h('span', { class: 'kedyDen' }, slovo), h('span', {}, den(d)))));
    hodinko.povedz(fmt(TX.dnesVeta, { dnes: den(i), zajtra: den(zajtra) }), 'tesi');
  }

  /* ----- rok: koleso s 12 mesiacmi (január na mieste jednotky, ako na ciferníku) ----- */
  const koleso = s('svg', { viewBox: '0 0 400 400', class: 'koleso', role: 'group', 'aria-label': TX.rokAria });
  const detailMesiaca = h('div', { class: 'detailMesiaca', 'aria-live': 'polite' });
  const sektory = [];
  for (let i = 0; i < 12; i++) {
    const o = OBDOBIE_MESIACA[i], stred = (i + 1) * 30;
    const [x1, y1] = bodNaKruhu(194, stred - 15), [x2, y2] = bodNaKruhu(194, stred + 15);
    const [x3, y3] = bodNaKruhu(72, stred + 15), [x4, y4] = bodNaKruhu(72, stred - 15);
    const g = s('g', { class: 'sektor', tabindex: '0', role: 'button', 'aria-label': TX.mesiace[i] + ', ' + TX.obdobia[o] });
    g.append(s('path', { d: `M${x1} ${y1}A194 194 0 0 1 ${x2} ${y2}L${x3} ${y3}A72 72 0 0 0 ${x4} ${y4}Z`, fill: OBDOBIA[o].farba, stroke: '#0b1020', 'stroke-width': 3 }));
    const [tx, ty] = bodNaKruhu(160, stred), [ix, iy] = bodNaKruhu(108, stred);
    const cislo = s('text', { x: tx, y: ty + 12, 'text-anchor': 'middle', class: 'cisloMesiaca' });
    cislo.textContent = i + 1;
    const ik = s('g', { transform: `translate(${ix - 15} ${iy - 15}) scale(1.25)`, color: OBDOBIA[o].tmava });
    ik.innerHTML = OBDOBIA[o].ikona;
    g.append(cislo, ik);
    g.addEventListener('click', () => vyberMesiac(i));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); vyberMesiac(i); } });
    sektory.push(g); koleso.append(g);
  }
  const stredKolesa = s('g', { 'aria-hidden': 'true' });
  const kruhStredu = s('circle', { cx: 200, cy: 200, r: 66, fill: '#0b1020', stroke: '#f3b453', 'stroke-width': 4 });
  koleso.append(kruhStredu, stredKolesa);
  function vyberMesiac(i) {
    mesiac = i;
    const o = OBDOBIE_MESIACA[i];
    sektory.forEach((g, j) => g.classList.toggle('vybrany', j === i));
    koleso.insertBefore(sektory[i], kruhStredu);   // vybraný mesiac navrch, aby bol jeho rámik celý
    stredKolesa.innerHTML = `<g transform="translate(170 170) scale(2.5)" color="${OBDOBIA[o].farba}">${OBDOBIA[o].ikona}</g>`;
    detailMesiaca.replaceChildren(h('span', { html: ikonaObdobia(o, 40) }), h('span', { class: 'menoMesiaca' }, TX.mesiace[i]),
      h('span', { class: 'obdobie', style: `background:${OBDOBIA[o].farba};color:${OBDOBIA[o].tmava}` }, TX.obdobia[o]));
    hodinko.povedz(fmt(TX.mesiacVeta, { mesiac: velkym(TX.mesiace[i]), obdobie: TX.obdobia[o] }), 'tesi');
  }

  /* ----- koľko: deň má 24 hodín, týždeň 7 dní, rok 12 mesiacov ----- */
  const vztahyObal = h('div', { class: 'vztahy' });
  const IKONY_VZTAHOV = [IKONY.den24, IKONY.tyzden7, IKONY.rok12];
  TX.vztahy.forEach((veta, i) => {
    const b = h('button', { type: 'button', class: 'vztah' }, h('span', { html: IKONY_VZTAHOV[i], style: 'display:contents' }), TX.plakety[i]);
    b.addEventListener('click', () => { hodinko.povedz(veta, 'tesi'); odskok(b, 8); });
    vztahyObal.append(b);
  });

  sekcia.append(dniObal, dnesObal, trojica, koleso, detailMesiaca, vztahyObal, akcie, h('p', { class: 'poznamkaDen' }, TX.poznamka));
  function nastavRezim(r) {
    rezim = r; rez.oznac(r);
    dniObal.hidden = r !== 'tyzden';
    dnesObal.hidden = trojica.hidden = r !== 'dnes';
    koleso.style.display = r === 'rok' ? '' : 'none';
    detailMesiaca.hidden = r !== 'rok';
    vztahyObal.hidden = r !== 'vztahy';
    nastavAkcie();
    if (r === 'tyzden') novyTyzden();
    else if (r === 'dnes') { if (dnes === null) { trojica.replaceChildren(); hodinko.povedz(TX.dnesStart, 'premysla'); } else vyberDnes(dnes); }
    else if (r === 'rok') { if (mesiac === null) { detailMesiaca.replaceChildren(); hodinko.povedz(TX.rokStart, 'premysla'); } else vyberMesiac(mesiac); }
    else hodinko.povedz(TX.vztahyStart, 'premysla');
  }

  KARTY[id] = {
    sekcia, hodinko,
    priZobrazeni() { if (!rezim) nastavRezim('tyzden'); else nastavRezim(rezim); },
    rezim: () => rezim, poradie: () => poradie, _vymen: vymen, _skontroluj: skontrolujTyzden, _vyberDnes: vyberDnes, _vyberMesiac: vyberMesiac
  };
}

/* =====================================================================
   KARTA 14: Časté omyly – každý s krátkou animáciou a jednou vetou, opatrne a pozitívne
   ===================================================================== */
function postavOmyly() {
  const id = 'omyly', sekcia = kostraKarty(id), TX = T.omyly;
  let i = 0;
  const hodinko = vytvorHodinka(sekcia, id);
  const plakety = h('div', { class: 'plakety omylPlakety', 'aria-live': 'polite' });
  const cif = vytvorCifernik({ model: HODINY, karta: id });
  cif.nastavLegendu(true);
  const scena = vytvorScenu(cif);
  const pocitadlo = h('span', { class: 'pocitadlo' });
  const akcie = h('div', { class: 'akcie' });
  sekcia.append(plakety, scena.el, akcie);
  const nastavAkcie = (...tl) => akcie.replaceChildren(...tl.filter(Boolean));
  // údaje o omyloch: čas na začiatku, animácia a texty (časy a tvary z funkcií, nič nie je zapísané dvakrát)
  const OMYLY = [
    { start: 8 * 60 + 30, x: () => ({ tvar: velkym(halfSK(450)), nasl: T.cislovky[8], dig: digitalny(450) }),
      animuj: hotovo => { cif.zvyrazni('hodina'); cif.animujO(-60, 1600, { hotovo: () => { cif.zvyrazniCisla([7, 8]); hotovo(); } }); } },
    { start: 7 * 60, x: () => ({}),
      animuj: hotovo => { cif.zvyrazni('minuta'); cif.animujO(60, 2600, { krivka: ease.linear, naKrok: q => cif.vysec(0, 60 * q), hotovo }); } },
    { start: 7 * 60, x: () => ({}),
      animuj: hotovo => { cif.zvyrazni('hodina'); cif.zvyrazniCisla([7, 8]); cif.animujO(45, 3000, { krivka: ease.linear, hotovo }); } },
    { start: 8 * 60, x: () => ({}),
      animuj: hotovo => {
        // ručičky sa nepohnú, mení sa len obloha: 8:00 ráno a 20:00 večer
        cif.zvyrazni(null);
        tween(1600, p => scena.kresli(8 * 60 + 720 * ease.inOut(p)), () => { HODINY.setTime(20 * 60); hotovo(); });
      } },
    { start: 3 * 60 + 15, x: () => ({ tvar: velkym(quarterSK(135)), dig: digitalny(135), omyl: digitalny(195) }),
      animuj: hotovo => { cif.zvyrazni('hodina'); cif.animujO(-60, 1600, { hotovo: () => { cif.zvyrazniCisla([2, 3]); hotovo(); } }); } }
  ];
  function ukazOmyl(n) {
    i = n;
    const o = OMYLY[i], x = o.x(), texty = TX.zoznam[i];
    cif.zastavAnimaciu(); cif.vysec(null); cif.zvyrazni(null); cif.zvyrazniCisla([]);
    cif.nastav({ tahat: null, tukat: false, cisla: false });
    HODINY.setTime(o.start); scena.kresli(o.start);
    plakety.replaceChildren(h('div', { class: 'stitokOmylu' }, TX.omyl), h('div', { class: 'plaketa nie' }, '✘ ' + fmt(texty.mylne, x)));
    hodinko.povedz(fmt(texty.mylne, x), 'premysla');
    pocitadlo.textContent = fmt(TX.pocitadlo, { n: i + 1, spolu: OMYLY.length });
    nastavAkcie(tlacidlo(TX.ukaz, 'ukaz', () => {
      nastavAkcie(pocitadlo);
      o.animuj(() => {
        plakety.replaceChildren(h('div', { class: 'plaketa' }, '✔ ' + fmt(texty.spravne, x)));
        hodinko.povedz(fmt(texty.spravne, x), 'tesi');
        nastavAkcie(i < OMYLY.length - 1 ? tlacidlo(TX.dalej, 'dalej', () => ukazOmyl(i + 1), 'primary') : tlacidlo(TX.znova, 'znova', () => ukazOmyl(0), 'primary'), pocitadlo);
      });
    }, 'primary'), pocitadlo);
  }

  KARTY[id] = {
    sekcia, cifernik: cif, hodinko,
    skryDigital: () => true,
    priZobrazeni() { ukazOmyl(i); },
    priSkryti() { cif.zastavAnimaciu(); },
    _ukaz: ukazOmyl, OMYLY
  };
}

/* =====================================================================
   KARTA 15: Kvíz – 12 otázok, 3 úrovne, vždy pozitívna spätná väzba, žiadne „prehral“
   ===================================================================== */
function postavKviz() {
  const id = 'kviz', sekcia = kostraKarty(id), TX = T.kviz;
  let uroven = 0, sada = [], index = 0, hviezdyKvizu = 0, odpovedane = false;
  // výber úrovne
  const urovne = h('div', { class: 'urovne tri', role: 'group', 'aria-label': T.urovne.aria });
  const tlUrovne = [0, 1, 2].map(u => h('button', { type: 'button', 'aria-pressed': String(u === 0), onclick: () => { uroven = u; tlUrovne.forEach((b, j) => b.setAttribute('aria-pressed', String(j === u))); } },
    h('span', { html: ikonaHodin(UROVNE[u].ukazka), style: 'display:contents' }), h('span', {}, TX.urovne[u])));
  urovne.append(...tlUrovne);
  const info = h('div', { class: 'kvizInfo', 'aria-live': 'polite' });
  sekcia.append(urovne, info);
  const hodinko = vytvorHodinka(sekcia, id);
  const modelOd = vytvorCas(0);
  const cifOd = vytvorCifernik({ model: modelOd, krok: () => 15 });
  cifOd.nastavLegendu(false); cifOd.nastavDigital(false); cifOd.nastav({ tahat: null });
  cifOd.el.classList.add('polovica');
  const stitokOd = h('div', { class: 'stitok' });
  cifOd.el.append(stitokOd);
  const cif = vytvorCifernik({ model: HODINY, karta: id });
  cif.nastavLegendu(false);
  const scena = vytvorScenu(cif);
  const zadanie = h('div', { class: 'zadanie', hidden: true });
  const moznosti = h('div', { class: 'moznosti', role: 'group', 'aria-label': T.hra.moznostiAria });
  const akcie = h('div', { class: 'akcie' });
  sekcia.append(zadanie, cifOd.el, scena.el, moznosti, akcie);
  const nastavAkcie = (...tl) => akcie.replaceChildren(...tl.filter(Boolean));

  function uvod() {
    urovne.hidden = false; info.textContent = '';
    cifOd.el.hidden = true; zadanie.hidden = true; moznosti.replaceChildren();
    scena.el.classList.remove('neutralna'); scena.ukazCast(false);
    cif.vysec(null); cif.duchCasu(null); cif.nastav({ tahat: null, tukat: false, cisla: false });
    hodinko.povedz(TX.start, 'premysla');
    nastavAkcie(tlacidlo(TX.hraj, 'dalej', novaSada, 'primary'));
  }
  function novaSada() {
    sada = sadaKvizu(uroven); index = 0; hviezdyKvizu = 0;
    STAV.karty[id].krok = UROVNE[uroven].krok;
    urovne.hidden = true;
    zobraz();
  }
  function zobraz() {
    const o = sada[index];
    odpovedane = false;
    info.textContent = fmt(TX.otazkaN, { n: index + 1, spolu: sada.length });
    cif.zastavAnimaciu(); cif.vysec(null); cif.duchCasu(null); cif.zvyrazni(null); cif.zvyrazniCisla([]);
    cif.nastav({ tahat: null, tukat: false, cisla: false });
    cifOd.el.hidden = o.typ !== 'trvanie';
    zadanie.hidden = true;
    // obloha za ciferníkom pomáha len pri otázke Čo robíme; inde by mohla prezradiť odpoveď
    scena.el.classList.toggle('neutralna', o.typ !== 'teraz');
    scena.ukazCast(false);
    moznosti.className = 'moznosti' + ({ slovom: ' slovne', trvanie: ' slovne', minuty: ' slovne', teraz: ' obrazkove', ranoVecer: ' oblohy' }[o.typ] || '');
    const otazka = TX.otazky[o.typ];
    if (o.typ === 'citaj' || o.typ === 'slovom') { cif.animujO(posunNa(o.cas), 700); hodinko.povedz(otazka, 'premysla'); }
    else if (o.typ === 'nastav') {
      HODINY.setTime(o.start);
      vyplnZadanie(zadanie, o.cas, false);
      cif.nastav({ tahat: uroven === 0 ? 'hodina' : 'obe', drzMinuty: true });
      hodinko.povedz(otazka, 'premysla');
    } else if (o.typ === 'teraz') {
      HODINY.setTime(o.cas);
      hodinko.povedz(fmt(otazka, { kedy: velkym(eventTimeSK(o.cas)) }), 'premysla');
    } else if (o.typ === 'trvanie') {
      modelOd.setTime(o.od); HODINY.setTime(o.po);
      stitokOd.textContent = fmt(T.trvanieKarta.od, { cas: digitalny(o.od, false) });
      cif.duchCasu(o.od);
      if (o.po - o.od < 60) cif.vysec(o.od % 60, o.od % 60 + (o.po - o.od)); else cif.vysec(uholHodinovej(o.od) / 6, uholHodinovej(o.od) / 6 + (o.po - o.od) / 12);
      zadanie.hidden = false; zadanie.replaceChildren(h('div', { class: 'ulohaCinnost', html: ikonaCinnosti(o.id) }));
      hodinko.povedz(fmt(otazka, { nazov: CINNOST[o.id].nazov }), 'premysla');
    } else if (o.typ === 'minuty') {
      HODINY.setTime(12 * 60);
      hodinko.povedz(fmt(otazka, { trvanie: velkym(nazovMinut(o.n)) }), 'premysla');
    } else {
      HODINY.setTime(o.cas);
      zadanie.hidden = false; zadanie.replaceChildren(h('div', { class: 'ulohaCinnost', html: ikonaCinnosti(o.id) }));
      hodinko.povedz(fmt(otazka, { nazov: CINNOST[o.id].nazov }), 'premysla');
    }
    // možnosti
    moznosti.replaceChildren();
    if (o.moznosti) {
      for (const m of o.moznosti) {
        let b;
        if (o.typ === 'teraz') b = obrazokCinnosti(m);
        else if (o.typ === 'ranoVecer') {
          const ob = vytvorOblohu('mala'); ob.kresli(m);
          b = h('button', { type: 'button', class: 'moznostOblohy', 'aria-label': partOfDay(m) }, ob.el, h('span', {}, partOfDay(m)));
        } else b = h('button', { type: 'button' }, popisMoznosti(o, m));
        b.prepend(h('span', { class: 'znacka', 'aria-hidden': 'true' }));
        b.dataset.hodnota = m;
        b.addEventListener('click', () => odpovedz(b, m));
        moznosti.append(b);
      }
      nastavAkcie();
    } else {
      const bh = tlacidlo(TX.hotovo, 'hotovo', () => odpovedz(bh, HODINY.getTime() % 720), 'primary');
      nastavAkcie(bh);
    }
  }
  function popisMoznosti(o, m) {
    if (o.typ === 'citaj') return digitalny(m);
    if (o.typ === 'slovom') return vetaCasu(m);
    if (o.typ === 'trvanie') return durationSK(m);
    return minutySK(m);
  }
  // odpoveď: správna → hviezdička; iná → ukáže sa riešenie krátkou animáciou (bez „prehry“)
  function odpovedz(b, hodnota) {
    if (odpovedane) return;
    odpovedane = true;
    cif.dokonciAnimaciu();
    const o = sada[index], dobre = hodnota === o.spravna;
    const tlacidla = $$('button', moznosti);
    tlacidla.forEach(x => { x.disabled = true; });
    cif.nastav({ tahat: null });
    if (dobre) {
      hviezdyKvizu++;
      if (o.moznosti) { b.classList.add('dobre'); $('.znacka', b).textContent = '✔'; }
      hodinko.povedz(TX.dobre[nahodne(TX.dobre.length)], 'tesi');
      pridajHviezdu(b);
    } else {
      if (o.moznosti) {
        b.classList.add('zle'); $('.znacka', b).textContent = '✘';
        const spravne = tlacidla.find(x => String(x.dataset.hodnota) === String(o.spravna));
        if (spravne) { spravne.classList.add('dobre'); $('.znacka', spravne).textContent = '✔'; odskok(spravne, 12); }
      }
      // krátka animácia s riešením
      if (o.typ === 'nastav') cif.animujO(posunNa(o.cas), 1100);
      else if (o.typ === 'citaj' || o.typ === 'slovom') { cif.zvyrazni('hodina'); cif.duchCasu(null); }
      else if (o.typ === 'ranoVecer' || o.typ === 'teraz') { scena.el.classList.remove('neutralna'); scena.kresli(HODINY.getTime()); scena.ukazCast(true); }
      else if (o.typ === 'minuty') { HODINY.setTime(12 * 60); cif.animujO(o.n, 1400, { krivka: ease.linear, naKrok: q => cif.vysec(0, o.n * q) }); }
      hodinko.povedz(TX.riesenie, 'povzbudzuje');
    }
    const posledna = index === sada.length - 1;
    nastavAkcie(tlacidlo(posledna ? TX.koniecTl : TX.dalej, 'dalej', () => { if (posledna) koniec(); else { index++; zobraz(); } }, 'primary'));
  }
  // koniec: počet hviezdičiek a rovnaká povzbudivá správa bez ohľadu na výsledok
  function koniec() {
    info.textContent = '';
    cifOd.el.hidden = true; zadanie.hidden = false;
    zadanie.replaceChildren(h('div', { class: 'plaketa velka' }, fmt(TX.hviezdy, { n: hviezdyKvizu })));
    moznosti.replaceChildren();
    scena.el.classList.remove('neutralna');
    hodinko.povedz(TX.koniec, 'tesi');
    urovne.hidden = false;
    nastavAkcie(tlacidlo(TX.znova, 'znova', novaSada, 'primary'));
  }

  KARTY[id] = {
    sekcia, cifernik: cif, hodinko,
    skryDigital: () => true,
    priZobrazeni() { cifOd.nastavCislice(STAV.cislice); if (!sada.length) uvod(); else if (index < sada.length && !odpovedane) zobraz(); },
    priSkryti() { cif.zastavAnimaciu(); },
    _novaSada: novaSada, _odpovedz: odpovedz, sada: () => sada, index: () => index, _dalej: () => { if (index < sada.length - 1) { index++; zobraz(); } else koniec(); }
  };
}

/* =====================================================================
   KARTA 16: Vystrihni si hodiny – tlač na jednu stranu A4 (aj čiernobielo)
   ===================================================================== */
function listNaVystrihnutie() {
  const TX = T.tlac;
  const cx = 95, cy = 100;
  let znacky = '', cisla = '';
  for (let i = 0; i < 60; i++) {
    const a = i * 6 * Math.PI / 180, velka = i % 5 === 0, r1 = velka ? 61 : 65, r2 = 70;
    znacky += `<line x1="${(cx + r1 * Math.sin(a)).toFixed(2)}" y1="${(cy - r1 * Math.cos(a)).toFixed(2)}" x2="${(cx + r2 * Math.sin(a)).toFixed(2)}" y2="${(cy - r2 * Math.cos(a)).toFixed(2)}" stroke="#000" stroke-width="${velka ? 1.2 : 0.45}" stroke-linecap="round"/>`;
  }
  for (let n = 1; n <= 12; n++) {
    const a = n * 30 * Math.PI / 180;
    cisla += `<text x="${(cx + 50 * Math.sin(a)).toFixed(2)}" y="${(cy - 50 * Math.cos(a) + 5).toFixed(2)}" text-anchor="middle" font-size="15" font-weight="700">${n}</text>`;
  }
  const otvor = (x, y) => `<circle cx="${x}" cy="${y}" r="2.2" fill="#fff" stroke="#000" stroke-width="0.5"/><path d="M${x - 3.5} ${y}h7M${x} ${y - 3.5}v7" stroke="#000" stroke-width="0.35"/>`;
  return `<svg class="listSvg" viewBox="0 0 190 270" width="190mm" height="270mm" font-family="system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="${TX.nadpis}">
    <rect x="0" y="0" width="190" height="270" fill="#fff"/>
    <text x="95" y="12" text-anchor="middle" font-size="9" font-weight="800">${TX.nadpis}</text>
    <circle cx="${cx}" cy="${cy}" r="78" fill="none" stroke="#000" stroke-width="0.4" stroke-dasharray="2.2 1.6"/>
    <circle cx="${cx}" cy="${cy}" r="73" fill="#fff" stroke="#000" stroke-width="1.2"/>
    ${znacky}${cisla}
    ${otvor(cx, cy)}
    <text x="${cx}" y="${cy + 10}" text-anchor="middle" font-size="3.6">${TX.otvor}</text>
    <text x="95" y="188" text-anchor="middle" font-size="4.2">${TX.ruckyNadpis}</text>
    <path d="M17 197h45a6.5 6.5 0 0 1 0 13h-45a6.5 6.5 0 0 1 0-13z" fill="#e6e6e6" stroke="#000" stroke-width="0.9"/>
    ${otvor(20, 203.5)}
    <text x="40" y="219" text-anchor="middle" font-size="4.6" font-weight="700">${TX.kratka}</text>
    <path d="M100 200h58l14 3.5-14 3.5h-58a3.5 3.5 0 0 1 0-7z" fill="#fff" stroke="#000" stroke-width="0.9"/>
    ${otvor(102, 203.5)}
    <text x="135" y="219" text-anchor="middle" font-size="4.6" font-weight="700">${TX.dlha}</text>
    <text x="95" y="236" text-anchor="middle" font-size="5.2" font-weight="700">${TX.navod1}</text>
    <text x="95" y="244" text-anchor="middle" font-size="5.2" font-weight="700">${TX.navod2}</text>
    <text x="95" y="258" text-anchor="middle" font-size="4" font-style="italic">${TX.poznamka}</text>
  </svg>`;
}
function postavTlac() {
  const id = 'tlac', sekcia = kostraKarty(id), TX = T.tlac;
  const hodinko = vytvorHodinka(sekcia, id);
  const tl = tlacidlo(TX.vytlacit, 'tlaciaren', () => { try { window.print(); } catch (_) { /* tichý návrat */ } }, 'primary');
  const list = h('div', { class: 'list', html: listNaVystrihnutie() });
  sekcia.append(h('div', { class: 'akcie' }, tl), h('p', { class: 'poznamkaDen' }, TX.poznamka), h('div', { class: 'nahladListu' }, list));
  KARTY[id] = { sekcia, hodinko, priZobrazeni() { hodinko.povedz(TX.uvod, 'tesi'); } };
}


/* =====================================================================
   PANEL PRE RODIČA A UČITEĽA (zbalený, nič sa neukladá)
   ===================================================================== */
let panel = null;
function postavPanel() {
  const d = $('#rodic');
  const chHlas = h('input', { type: 'checkbox', id: 'volbaHlas' });
  const chCislice = h('input', { type: 'checkbox', id: 'volbaCislice' });
  const chDigital = h('input', { type: 'checkbox', id: 'volbaDigital' });
  const selKrok = h('select', { id: 'volbaKrok' }, ...KROKY.map(k => h('option', { value: k }, T.rodic.krokMoznosti[k])));
  const bezHlasu = h('p', { class: 'poznamka' }, T.rodic.bezHlasu);
  const krokPozn = h('p', { class: 'poznamka' }, T.rodic.krokZamknuty);
  const riadokHlas = h('label', { class: 'volba' }, chHlas, T.rodic.hlas);
  d.append(
    h('summary', {}, T.rodic.nadpis),
    riadokHlas, bezHlasu,
    h('label', { class: 'volba' }, chCislice, T.rodic.cislice),
    h('label', { class: 'volba' }, chDigital, T.rodic.digital),
    h('label', { class: 'volba' }, T.rodic.krok, selKrok), krokPozn,
    h('p', { class: 'poznamka' }, T.rodic.poznamka));
  chHlas.addEventListener('change', () => { STAV.hlas = chHlas.checked; if (!STAV.hlas) zastavCitanie(); synchronizujNahlas(); });
  chCislice.addEventListener('change', () => { STAV.cislice = chCislice.checked; for (const k of PORADIE_KARIET) pouziPanel(k); });
  chDigital.addEventListener('change', () => { STAV.karty[STAV.karta].digital = chDigital.checked; pouziPanel(STAV.karta); });
  selKrok.addEventListener('change', () => {
    const k = STAV.karty[STAV.karta];
    if (k.krokZamknuty) return;
    k.krok = Number(selKrok.value);
    if (KARTY[STAV.karta].priZmeneKroku) KARTY[STAV.karta].priZmeneKroku();
  });
  panel = { chHlas, chCislice, chDigital, selKrok, bezHlasu, krokPozn, riadokHlas };
}
function obnovPanel() {
  if (!panel || !STAV.karta) return;
  const k = STAV.karty[STAV.karta];
  panel.riadokHlas.hidden = !NAHLAS.hlas;
  panel.bezHlasu.hidden = !!NAHLAS.hlas;
  panel.chHlas.checked = STAV.hlas;
  panel.chCislice.checked = STAV.cislice;
  panel.chDigital.checked = k.digital;
  panel.selKrok.value = String(k.krok);
  panel.selKrok.disabled = k.krokZamknuty;
  panel.krokPozn.hidden = !k.krokZamknuty;
  panel.krokPozn.textContent = T.rodic.krokPoznamky[STAV.karta] || T.rodic.krokZamknuty;
}

/* =====================================================================
   ŠTART
   ===================================================================== */
function init() {
  document.title = T.titul;
  $('#titul').textContent = T.titul;
  $('#podtitul').textContent = T.podtitul;
  $('#pata').textContent = T.pata;
  $('#logo').innerHTML = hodinkoSVG(true);
  obnovHviezdy();
  // reproduktor: zobrazí sa len vtedy, keď prehliadač má slovenský hlas
  const repro = $('#repro');
  repro.innerHTML = IKONY.reproduktor;
  repro.setAttribute('aria-label', T.nahlas.tlacidlo);
  repro.addEventListener('click', () => {
    const k = STAV.karty[STAV.karta];
    k.hlasAuto = !k.hlasAuto;
    synchronizujNahlas();
    if (k.hlasAuto && KARTY[STAV.karta].hodinko) precitaj(KARTY[STAV.karta].hodinko.text(), STAV.karta);
    else zastavCitanie();
  });
  const nav = $('#karty');
  nav.setAttribute('aria-label', T.kartyAria);
  for (const id of PORADIE_KARIET) {
    nav.append(h('button', { type: 'button', role: 'tab', id: 'tab-' + id, 'aria-controls': 'karta-' + id, 'aria-selected': 'false',
      onclick: () => ukazKartu(id) }, h('span', { html: IKONY_KARIET[id], style: 'display:contents' }), T.karty[id].nazov));
  }
  // šípky vľavo/vpravo medzi záložkami
  nav.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = PORADIE_KARIET.indexOf(STAV.karta), n = PORADIE_KARIET.length;
    const nove = PORADIE_KARIET[(i + (e.key === 'ArrowRight' ? 1 : n - 1)) % n];
    ukazKartu(nove);
    $('#tab-' + nove).focus();
    e.preventDefault();
  });
  postavPanel();
  postavSpoznaj();
  postavCele();
  postavPolhodina();
  postavStvrt();
  postavDigital();
  postavDielna();
  postavTeraz();
  postavDen();
  postavObloha();
  postavBeh();
  postavTrvanie();
  postavMinuty();
  postavTyzden();
  postavOmyly();
  postavKviz();
  postavTlac();

  obnovHlas();
  try { if (window.speechSynthesis) window.speechSynthesis.addEventListener('voiceschanged', obnovHlas); } catch (_) { /* tichý návrat */ }

  const zHashu = () => ukazKartu(location.hash.replace(/^#\/?/, ''), false);
  window.addEventListener('hashchange', zHashu);
  zHashu();
  // testy až po načítaní celého dokumentu (aj posledného skriptu)
  if (/[?&]test\b/.test(location.search)) document.addEventListener('DOMContentLoaded', spustiTesty);
}

/* =====================================================================
   TESTY (spustia sa s ?test v adrese)
   ===================================================================== */
function spustiTesty() {
  let ok = 0, zle = 0;
  const vysledky = [];
  const over = (podmienka, popis) => { if (podmienka) ok++; else { zle++; vysledky.push('✘ ' + popis); } };
  // počet slov; čas „7:30“ je jedno slovo
  const slov = t => t.replace(/(\d):(\d)/g, '$1$2').replace(/[✔✘★:.,!?=]/g, ' ').split(/\s+/).filter(Boolean).length;

  // 1. uhly (hodinová, minútová)
  for (const [hh, mm, eh, em] of [[3, 0, 90, 0], [6, 30, 195, 180], [12, 0, 0, 0], [9, 45, 292.5, 270], [2, 15, 67.5, 90],
    [0, 0, 0, 0], [15, 0, 90, 0], [21, 45, 292.5, 270]]) {
    const t = hh * 60 + mm;
    over(uholHodinovej(t) === eh && uholMinutovej(t) === em, `uhly ${hh}:${mm}: ${uholHodinovej(t)}°, ${uholMinutovej(t)}°`);
  }
  // hodinová ručička sa pohybuje plynulo: každá minúta = 0,5°
