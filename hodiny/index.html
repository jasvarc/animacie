  over(JSON.stringify(skontrolujPoradie([{ id: 'vecera', cas: 20 * 60 }, { id: 'spime', cas: 19 * 60 }])) === '["spime","vecera"]', 'môj deň: spánok pred večerou sa nahlási');
  over(skontrolujPoradie([{ id: 'vstavame', cas: 6 * 60 }, { id: 'vecera', cas: 17 * 60 }, { id: 'spime', cas: 21 * 60 + 30 }]) === null, 'môj deň: správne poradie bez hlásenia');
  over(skontrolujPoradie([{ id: 'vecera', cas: 19 * 60 }, { id: 'kupanie', cas: 18 * 60 }]) === null, 'večerné zvyky (kúpanie, večera) môžu byť v hocijakom poradí');
  over(mimoOkna([{ id: 'ranajky', cas: 12 * 60 }]) === 'ranajky' && mimoOkna([{ id: 'ranajky', cas: 8 * 60 }]) === null, 'kontrola časového okna');
  // karta Poskladaj si deň: celý priebeh v režime Môj deň (bez kontroly okien)
  {
    const K = KARTY.den, predKarta = STAV.karta;
    ukazKartu('den', false);
    K.nastavRezim('moj'); K.nastavPrvak(true);
    const casy = { vstavame: 5 * 60 + 0, ranajky: 6 * 60, skola: 9 * 60, obed: 13 * 60, spime: 18 * 60 };   // nezvyčajné, ale v poriadku
    K._umiestni('spime', 18 * 60); K._umiestni('vstavame', 5 * 60); K._umiestni('ranajky', 6 * 60); K._umiestni('skola', 9 * 60); K._umiestni('obed', 19 * 60);
    K._skontroluj();
    const hlasenie = K.hodinko.text();
    K._umiestni('obed', casy.obed); K._skontroluj();
    over(hlasenie === T.den.zlePoradie && K.poskladany(), `Môj deň v karte: zlé poradie „${hlasenie}“, potom „${K.hodinko.text()}“`);
    K.nastavRezim('hra'); K.nastavPrvak(false);
    ukazKartu(predKarta, false);
  }

  // 5. náhodné úlohy Čo robíme o tejto hodine?
  const rng3 = generatorSoSemienkom(20261020);
  let ulohyOk = true, ukazkaU = '';
  for (let i = 0; i < 1000; i++) {
    const u = zadanieTeraz(rng3);
    const typicke = u.moznosti.filter(c => vOkne(CINNOST[c], u.cas));
    if (u.moznosti.length !== 3 || typicke.length !== 1 || typicke[0] !== u.spravna || new Set(u.moznosti).size !== 3) { ulohyOk = false; ukazkaU = JSON.stringify(u); }
  }
  over(ulohyOk, '1 000 úloh Čo robíme: práve jedna z troch sa hodí k času ' + ukazkaU);
  let rvOk = true;
  for (let i = 0; i < 1000; i++) {
    const u = zadanieRanoVecer(rng3);
    if (u.moznosti.length !== 2 || !u.moznosti.includes(u.cas) || uholHodinovej(u.moznosti[0]) !== uholHodinovej(u.moznosti[1])
      || partOfDay(u.moznosti[0]) === partOfDay(u.moznosti[1]) || DEN.bezRanaVecera.includes(u.id)) rvOk = false;
  }
  over(rvOk, '1 000 úloh Ráno alebo večer: rovnaké ručičky, iná časť dňa');

  // 6. texty: nikde „má ísť spať“, „musí“, „treba“ a nič nehodnotí čas dieťaťa ako zlý
  const vsetkyTexty = [];
  const zber = o => { if (typeof o === 'string') vsetkyTexty.push(o); else if (o && typeof o === 'object') Object.values(o).forEach(zber); };
  zber(TEXTY); zber(DEN);
  const zakazane = /(^|[^\p{L}])(má\s+(ísť|spať|jesť|vstávať|byť)|máš|máme|mám|musí|musíš|musíme|treba|mal by|mala by|neskoro|príliš|zle|zlý|zlá|zlé|chyba|chybne|prehral|zdrav\p{L}*|spánok|spánku)(?=$|[^\p{L}])/iu;
  const zakazaneTexty = vsetkyTexty.filter(t => zakazane.test(t));
  over(zakazaneTexty.length === 0, 'texty bez príkazov a hodnotenia: ' + zakazaneTexty.slice(0, 3).join(' / '));
  // texty časti 3 s dosadenými činnosťami a časmi: najviac 8 slov
  const dlhe3 = [];
  for (const c of CINNOSTI) for (const t of [c.typicky, c.od, c.po, norm(c.typicky + 720)]) {
    const x = { nazov: c.nazov, kedy: velkym(eventTimeSK(t)), cast: partOfDay(t) };
    for (const sk of [T.teraz, T.den, T.ranoVecer, T.beh]) for (const v of Object.values(sk)) {
      if (typeof v !== 'string') continue;
      const text = fmt(v, x);
      if (slov(text) > 8) dlhe3.push(text);
    }
  }
  over(dlhe3.length === 0, 'texty časti 3 najviac 8 slov: ' + [...new Set(dlhe3)].slice(0, 3).join(' / '));
  // rýchly beh: obrázky sa objavia v typickom čase
  {
    const K = KARTY.beh, predKarta = STAV.karta;
    ukazKartu('beh', false);
    K._odRana();
    for (let i = 0; i < 400; i++) K._krok(0.1);
    const pocet = K.pas().children.length, ocak = CINNOSTI.filter(c => c.typicky > BEH_OD && c.typicky <= Math.floor(K.cas())).length;
    over(pocet === ocak && pocet > 0, `rýchly beh: ${pocet} obrázkov do ${digitalny(K.cas(), false)} (čakám ${ocak})`);
    K._odRana();
    ukazKartu(predKarta, false);
  }

  /* ----- ČASŤ 4 ----- */
  // 1. durationSK
  for (const [n, ocak] of [[15, 'štvrť hodiny'], [30, 'pol hodiny'], [45, 'trištvrte hodiny'], [60, 'hodina'], [90, 'hodina a pol'], [120, 'dve hodiny'],
    [180, 'tri hodiny'], [240, 'štyri hodiny'], [300, 'päť hodín'], [1, '1 minúta'], [2, '2 minúty'], [4, '4 minúty'], [5, '5 minút'], [25, '25 minút'], [75, '75 minút']]) {
    over(durationSK(n) === ocak, `durationSK ${n} = „${durationSK(n)}“ (čakám „${ocak}“)`);
  }
  // 2. minutesBetween
  for (const [a, b, ocak] of [['7:30', '8:00', 30], ['8:00', '12:00', 240], ['12:00', '12:30', 30], ['7:45', '8:15', 30], ['14:00', '14:15', 15]]) {
    over(minutesBetween(casZTextu(a), casZTextu(b)) === ocak, `minutesBetween ${a} → ${b} = ${minutesBetween(casZTextu(a), casZTextu(b))}`);
  }
  let chyba = null;
  try { minutesBetween(casZTextu('12:00'), casZTextu('8:00')); } catch (e) { chyba = e; }
  over(chyba instanceof RangeError, 'minutesBetween: koniec pred začiatkom vráti chybu');

  // 3. kvíz: 1 000 otázok každého typu, práve jedna správna, bez opakovania, zhoda s nezávislým výpočtom
  // nezávislé slovenské tvary (vlastné tabuľky, nie funkcie aplikácie)
  const ZAK = ['jedna', 'dve', 'tri', 'štyri', 'päť', 'šesť', 'sedem', 'osem', 'deväť', 'desať', 'jedenásť', 'dvanásť'];
  const GEN = ['jednej', 'druhej', 'tretej', 'štvrtej', 'piatej', 'šiestej', 'siedmej', 'ôsmej', 'deviatej', 'desiatej', 'jedenástej', 'dvanástej'];
  const AKUZ = ['jednu', ...ZAK.slice(1)];
  const nezavislaVeta = t => {
    const hh = Math.floor(t / 60) % 12 || 12, m = t % 60, nasl = hh % 12 + 1;
    if (m === 0) return hh === 1 ? 'Je jedna hodina' : hh <= 4 ? `Sú ${ZAK[hh - 1]} hodiny` : `Je ${ZAK[hh - 1]} hodín`;
    return { 15: 'Je štvrť na ' + AKUZ[nasl - 1], 30: 'Je pol ' + GEN[nasl - 1], 45: 'Je trištvrte na ' + AKUZ[nasl - 1] }[m];
  };
  const nezavislyDigital = t => `${Math.floor(t / 60) % 12 || 12}:${String(t % 60).padStart(2, '0')}`;
  const nezavisleTrvanie = d => ({ 15: 'štvrť hodiny', 30: 'pol hodiny', 45: 'trištvrte hodiny', 60: 'hodina', 90: 'hodina a pol', 120: 'dve hodiny', 180: 'tri hodiny', 240: 'štyri hodiny', 300: 'päť hodín' }[d]);
  const MINUT_V = { 60: 60, 30: 30, 15: 15, 45: 45 };
  const surove = Object.fromEntries(DEN.cinnosti.map(c => [c.id, { cas: c.cas.split(':').map(Number), okno: c.okno.map(x => x.split(':').map(Number)) }]));
  const naMin = ([hh, mm]) => hh * 60 + mm;
  const rngK = generatorSoSemienkom(20261021);
  const chybyKvizu = [];
  for (const typ of TYPY_KVIZU) {
    for (let i = 0; i < 1000; i++) {
      const u = i % 3, o = otazkaKvizu(typ, u, rngK);
      let ok1 = true;
      if (o.moznosti) {
        const pocetSpravnych = o.moznosti.filter(m => m === o.spravna).length;
        if (pocetSpravnych !== 1 || new Set(o.moznosti.map(String)).size !== o.moznosti.length) ok1 = false;
      }
      if (typ === 'citaj') ok1 = ok1 && digitalny(o.spravna) === nezavislyDigital(o.cas) && new Set(o.moznosti.map(digitalny)).size === 3;
      else if (typ === 'nastav') ok1 = ok1 && o.spravna === o.cas && o.start !== o.cas && (o.cas % 60) % UROVNE[u].krok === 0;
      else if (typ === 'slovom') ok1 = ok1 && vetaCasu(o.spravna) === nezavislaVeta(o.cas) && new Set(o.moznosti.map(vetaCasu)).size === 3 && o.moznosti.every(m => vetaCasu(m));
      else if (typ === 'teraz') {
        const hodiaSa = o.moznosti.filter(id => naMin(surove[id].okno[0]) <= o.cas && o.cas <= naMin(surove[id].okno[1]));
        ok1 = ok1 && hodiaSa.length === 1 && hodiaSa[0] === o.spravna;
      } else if (typ === 'trvanie') ok1 = ok1 && o.spravna === o.po - o.od && durationSK(o.spravna) === nezavisleTrvanie(o.po - o.od) && o.po < MIN_DNA && new Set(o.moznosti.map(durationSK)).size === 3;
      else if (typ === 'minuty') ok1 = ok1 && o.spravna === MINUT_V[o.n];
      else ok1 = ok1 && o.spravna === naMin(surove[o.id].cas) && o.moznosti.length === 2 && partOfDay(o.moznosti[0]) !== partOfDay(o.moznosti[1]);
      if (!ok1 && chybyKvizu.length < 3) chybyKvizu.push(typ + ' ' + JSON.stringify(o));
    }
  }
  over(chybyKvizu.length === 0, `1 000 otázok kvízu z každého typu (${TYPY_KVIZU.length} typov) ` + chybyKvizu.join(' / '));
  const sada = sadaKvizu(1, generatorSoSemienkom(7));
  over(sada.length === 12 && TYPY_KVIZU.every(t => sada.some(o => o.typ === t)), 'sada kvízu: 12 otázok, všetky typy');
  // úlohy Ako dlho to trvá? a Koľko hodín je medzi…? – v rámci jedného dňa
  let trvOk = true;
  for (let i = 0; i < 1000; i++) {
    const a = zadanieTrvania(rngK, i % 3), b = zadanieMedzi(rngK);
    for (const z of [a, b]) if (z.po >= MIN_DNA || z.po <= z.od || z.moznosti.filter(m => m === z.trvanie).length !== 1 || new Set(z.moznosti).size !== 3) trvOk = false;
    if (b.od < 6 * 60 || b.po > 22 * 60 || b.trvanie % 60) trvOk = false;
  }
  over(trvOk, '1 000 úloh trvania: v rámci dňa, práve jedna správna');
  // týždeň: kontrola poradia v karte
  {
    const K = KARTY.tyzden, pred = STAV.karta;
    ukazKartu('tyzden', false);
    const p = K.poradie();
    for (let i = 0; i < 7; i++) { const j = p.indexOf(i); if (j !== i) K._vymen(i, j); }
    K._skontroluj();
    over(K.poradie().join('') === '0123456' && K.hodinko.text() === T.tyzden.tyzdenDobre && $$('#karta-tyzden .stitokVikend').length === 2, 'týždeň: správne poradie a víkend');
    K._vyberDnes(6);
    over(K.hodinko.text() === 'Dnes je nedeľa. Zajtra bude pondelok.' && $('#karta-tyzden .trojica').textContent.includes('sobota'), 'dnes nedeľa: včera sobota, zajtra pondelok');
    K._vyberMesiac(4);
    over(K.hodinko.text() === 'Máj. To je jar.', 'mesiac máj → jar');
    ukazKartu(pred, false);
  }
  // sekundová ručička: kolo tenkej ručičky = 1 minúta
  {
    const K = KARTY.minuty, pred = STAV.karta;
    ukazKartu('minuty', false);
    const t0 = HODINY.getTime();
    for (let i = 0; i < 360 / (6 * SEKUNDY_RYCHLOSTI[2]); i++) K._krokSekund(1);   // pri rýchlosti 6× je jedna sekunda reálneho času 36°
    over(HODINY.getTime() === t0 + 1, 'tenká ručička obehne kolo za 60 sekúnd = 1 minúta');
    ukazKartu(pred, false);
  }
  // 4. texty: nič „zle“, žiadne odpočítavanie ani časový tlak; zoznam viet maskota na kontrolu
  const tlak = /(^|[^\p{L}])(odpočít\p{L}*|zostáva\p{L}*|ponáhľaj\p{L}*|rýchlo!|čas vypršal|koniec času|urobil\p{L}* zle|nesprávne)(?=$|[^\p{L}])/iu;
  const tlakTexty = vsetkyTexty.filter(t => tlak.test(t));
  over(tlakTexty.length === 0, 'žiadne odpočítavanie ani časový tlak: ' + tlakTexty.slice(0, 3).join(' / '));
  const sekcieMaskota = ['spoznaj', 'cele', 'hra', 'polhodina', 'stvrt', 'digital', 'dielna', 'teraz', 'den', 'ranoVecer', 'beh', 'trvanieKarta', 'minuty', 'tyzden', 'omyly', 'kviz', 'tlac'];
  window.VETY_HODINKA = sekcieMaskota.map(k => { const v = []; const z = o => { if (typeof o === 'string') v.push(o); else if (o && typeof o === 'object') Object.values(o).forEach(z); }; z(T[k]); return [k, v]; });
  // texty časti 4 najviac 8 slov (s dosadenými hodnotami)
  const dlhe4 = [];
  const x4 = [];
  for (const c of CINNOSTI) x4.push({ nazov: c.nazov, kedy: velkym(eventTimeSK(c.typicky)) });
  for (const n of [15, 30, 45, 60]) x4.push({ trvanie: velkym(nazovMinut(n)), m: durationSK(n), t: velkym(nazovMinut(n)), n });
  for (const d of DLZKY_VSETKY) x4.push({ je: jeSu(d), d: durationSK(d) });
  for (let i = 0; i < 12; i++) x4.push({ mesiac: velkym(T.tyzden.mesiace[i]), obdobie: T.tyzden.obdobia[OBDOBIE_MESIACA[i]], dnes: T.tyzden.dni[i % 7], zajtra: T.tyzden.dni[(i + 1) % 7] });
  for (const o of KARTY.omyly.OMYLY) x4.push(o.x());
  for (const sk of ['trvanieKarta', 'minuty', 'tyzden', 'omyly', 'kviz']) {
    const v = []; const z = o => { if (typeof o === 'string') v.push(o); else if (o && typeof o === 'object') Object.values(o).forEach(z); }; z(T[sk]);
    for (const text of v) for (const x of x4) { const t = fmt(text, x); if (!/\{/.test(t) && slov(t) > 8) dlhe4.push(t); }
  }
  over(dlhe4.length === 0, 'texty časti 4 najviac 8 slov: ' + [...new Set(dlhe4)].slice(0, 3).join(' / '));

  // texty pre dieťa: najviac 8 slov
  const detske = [];
  for (const [k, v] of Object.entries(T.spoznaj)) if (typeof v === 'string') detske.push(v);
  for (const sk of [T.cele, T.hra, T.polhodina, T.stvrt, T.digital, T.dielna]) for (const v of Object.values(sk)) {
    if (typeof v === 'string') detske.push(v); else if (Array.isArray(v)) detske.push(...v); else detske.push(...Object.values(v));
  }
  const vyplnene = [];
  // všetky časy po 5 minútach, so všetkými slovnými tvarmi
  for (let t = 0; t < 720; t += 5) {
    const x = { cas: vyjadriCas(t), cislo: hodina12(t), veta: vyjadriCas(t), tvar: casSlovami(t) || digitalny(t), nasl: T.cislovky[nasledujucaHodina(t)],
      radove: T.radove[nasledujucaHodina(t)], dig: digitalny(t), a: hodina12(t), b: nasledujucaHodina(t), h: digitalny(t).split(':')[0], m: digitalny(t).split(':')[1] };
    for (const v of detske) vyplnene.push(fmt(v, x));
  }
  const dlhe = [...new Set(vyplnene)].filter(v => slov(v) > 8);
  over(dlhe.length === 0, 'texty najviac 8 slov: ' + dlhe.slice(0, 3).join(' / '));
  // 6. práve jeden externý skript, tesne pred </body>
  const externe = $$('script[src]');
  over(externe.length === 1 && /gc\.zgo\.at/.test(externe[0].getAttribute('src')), 'práve jeden externý skript (GoatCounter)');
  const html = document.documentElement.outerHTML;
  const adresy = (html.match(/(https?:)?\/\/[a-z0-9.-]+\.[a-z]{2,}[^\s"'<>)]*/gi) || []).filter(a => !/goatcounter\.com|gc\.zgo\.at|w3\.org\/2000\/svg/.test(a));
  over(adresy.length === 0, 'externé adresy: ' + adresy.slice(0, 3).join(' '));

  const suhrn = `TESTY: ${ok} v poriadku, ${zle} chýb\n` + vysledky.join('\n');
  console.log(suhrn);
  $('.wrap').prepend(h('pre', { id: 'testy' }, suhrn));
  window.VYSLEDOK_TESTOV = { ok, zle, chyby: vysledky };
}

// meranie pre test 5: tlačidlá (aspoň 64 px), koncové guľôčky ručičiek (aspoň 48 px), vodorovné posúvanie
window.zmerajCiele = function () {
  const male = [];
  for (const e of $$('button, summary, select')) {
    const r = e.getBoundingClientRect();
    if (!r.width && !r.height) continue;
    if (r.width < 63.5 || r.height < 63.5) male.push(`${e.tagName.toLowerCase()} „${e.textContent.trim().slice(0, 14)}“ ${Math.round(r.width)}×${Math.round(r.height)}`);
  }
  const gule = [];
  for (const e of $$('.cifernik .ruc:not(.zamknuta) .gula')) {   // len ručičky, ktoré sa dajú chytiť
    const r = e.getBoundingClientRect();
    if (!r.width && !r.height) continue;
    gule.push(`${Math.round(r.width)}×${Math.round(r.height)}`);
    if (r.width < 48 || r.height < 48) male.push(`guľôčka ${Math.round(r.width)}×${Math.round(r.height)}`);
  }
  const cislo = $$('.cifernik .cislo').map(e => e.getBoundingClientRect()).find(r => r.height > 0);
  return { sirka: innerWidth, posuvanie: document.documentElement.scrollWidth > document.documentElement.clientWidth,
    scrollWidth: document.documentElement.scrollWidth, gule, vyskaCislice: cislo ? Math.round(cislo.height) : null, male };
};

init();
