<style>
:root{
  --bg:#04060c;--panel:rgba(12,16,28,.86);--line:rgba(140,160,215,.22);

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);background:var(--bg);
  background-image:radial-gradient(ellipse at 50% -10%,#14204a 0%,#070b18 50%,#04060c 100%);background-attachment:fixed;

.wrap{max-width:820px;margin:0 auto;padding:16px}

/* ===== Tlačidlá: aspoň 64 × 64 px, medzery aspoň 12 px ===== */
button{font:inherit;font-size:24px;color:var(--text);background:rgba(255,255,255,.08);border:2px solid var(--line);
  border-radius:20px;padding:8px 20px;min-height:64px;min-width:64px;cursor:pointer;touch-action:manipulation;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .15s,border-color .15s}
button:hover{background:rgba(255,255,255,.14);border-color:rgba(160,180,230,.45)}

button[aria-pressed="true"]{background:rgba(243,180,83,.22);border-color:var(--gold);color:var(--gold2)}

button svg{width:30px;height:30px;flex:none}

/* ===== Hlavička, hviezdičky a karty ===== */
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}

/* záložky: 16 kariet – na každej šírke jeden posuvný pás (vybraná karta sa vždy posunie do zorného poľa) */
.karty{display:flex;gap:12px;margin-bottom:16px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;-webkit-overflow-scrolling:touch;

.urovne.tri{grid-template-columns:repeat(3,minmax(0,1fr))}
.urovne.tri button{font-size:20px}
.kvizInfo{text-align:center;font-weight:800;color:var(--gold2);min-height:8px;margin-bottom:8px}
.plaketa.velka{font-size:56px;padding:12px 32px;color:var(--gold2);border-color:var(--gold);background:rgba(243,180,83,.16)}
.nahladListu{margin-top:14px;background:#fff;border-radius:12px;padding:8px;overflow:hidden}
.nahladListu .listSvg{display:block;width:100%;height:auto}

/* ===== Tlač: len list na vystrihnutie, jedna strana A4, aj čiernobielo ===== */
@media print{
  @page{size:A4 portrait;margin:12mm 10mm}
  html,body{background:#fff!important;color:#000}
  body{background-image:none!important}
  header,nav,details.rodic,footer,#testy,noscript{display:none!important}
  .wrap{max-width:none;padding:0;margin:0}
  main>.karta{display:none!important}
  #karta-tlac{display:block!important;background:none;border:0;box-shadow:none;padding:0}
  #karta-tlac>*:not(.nahladListu){display:none!important}
  .nahladListu{margin:0;padding:0;border-radius:0;background:none}
  .nahladListu .listSvg{width:190mm;height:270mm}
}

/* ===== Na šírku (tablet, počítač): Hodinko a tlačidlá vľavo, ciferník vpravo ===== */
@media (min-width:760px) and (orientation:landscape){
  .wrap{max-width:1180px}
  header{margin-bottom:10px}
  .karty{margin-bottom:12px}
  .karta{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto auto auto 1fr;
    grid-template-areas:"rez cif" "urov cif" "hod cif" "zad cif" "moz cif" "akc cif";column-gap:24px;align-items:start}
  .rezimy{grid-area:rez}.urovne{grid-area:urov}.hodinko{grid-area:hod}.zadanie{grid-area:zad}.cifernikObal{grid-area:cif}.moznosti{grid-area:moz}
  .akcie{grid-area:akc;justify-content:flex-start;margin-top:4px}
  .cifernik{width:clamp(260px,calc(100vh - 310px),min(560px,52vw))}
  /* časť 3 */
  .scena{grid-area:cif;width:auto;min-width:min(560px,52vw)}
  .scena .cifernik{width:clamp(240px,calc(100vh - 470px),min(500px,46vw))}
  .obrazkove,.oblohy,.pasCinnosti{grid-area:moz}
  .obalPosuvnika{grid-area:zad}
  details.sikovni{grid-area:moz}
  .karta.siroka,#karta-tyzden,#karta-tlac{display:block}
  #karta-trvanie .dvojica,#karta-kviz .scena{grid-area:cif}
  #karta-trvanie .dvojica{width:min(560px,54vw)}
  #karta-trvanie .dvojica .cifernik{width:clamp(200px,calc(100vh - 380px),min(320px,26vw))}
  .dvojica>.cifernikObal{grid-area:auto}
  #karta-kviz .cifernikObal.polovica{grid-area:urov}
  #karta-kviz .cifernikObal.polovica .cifernik{width:min(200px,22vw)}
  .obrazkove{grid-template-columns:1fr}
  .obrazkove .cinnost{flex-direction:row;justify-content:flex-start}
}

<script>
'use strict';
const T = TEXTY;

/* =====================================================================
   STAV A NASTAVENIA (nič sa neukladá)
   ===================================================================== */
const KROKY = [60, 30, 15, 5, 1];   // možné kroky prichytávania veľkej ručičky v minútach
const STAV = {
  karta: null,
  hviezdy: 0,
  hlas: true,          // hlavný vypínač hlasu (panel pre rodiča)
  cislice: true,       // číslice 1 až 12 na ciferníku
  vynutPohyb: false,   // len pre testy
  // nastavenia jednotlivých kariet: digitálne hodiny, krok, automatické čítanie nahlas
  karty: {
    spoznaj: { digital: false, krok: 5, krokZamknuty: false, hlasAuto: true },
    cele: { digital: true, krok: 60, krokZamknuty: true, hlasAuto: false },
    polhodina: { digital: true, krok: 30, krokZamknuty: true, hlasAuto: true },
    stvrt: { digital: true, krok: 15, krokZamknuty: true, hlasAuto: true },
    digital: { digital: true, krok: 30, krokZamknuty: true, hlasAuto: false, uroven: 1 },
    dielna: { digital: false, krok: 60, krokZamknuty: true, hlasAuto: false, uroven: 0 },
    teraz: { digital: false, krok: 15, krokZamknuty: true, hlasAuto: true },
    den: { digital: false, krok: 15, krokZamknuty: true, hlasAuto: true },
    obloha: { digital: false, krok: 15, krokZamknuty: true, hlasAuto: false },
    beh: { digital: false, krok: 15, krokZamknuty: true, hlasAuto: false },
    trvanie: { digital: false, krok: 15, krokZamknuty: true, hlasAuto: true },
    minuty: { digital: true, krok: 5, krokZamknuty: false, hlasAuto: true },
    tyzden: { digital: false, krok: 60, krokZamknuty: true, hlasAuto: true },
    omyly: { digital: false, krok: 15, krokZamknuty: true, hlasAuto: true },
    kviz: { digital: false, krok: 60, krokZamknuty: true, hlasAuto: false },
    tlac: { digital: false, krok: 60, krokZamknuty: true, hlasAuto: false }
  }
};
const PORADIE_KARIET = ['spoznaj', 'cele', 'polhodina', 'stvrt', 'digital', 'dielna', 'teraz', 'den', 'obloha', 'beh',
  'trvanie', 'minuty', 'tyzden', 'omyly', 'kviz', 'tlac'];

/* =====================================================================
   JADRO – čas v minútach od polnoci (0 až 1439) je jediný zdroj pravdy
   ===================================================================== */
const MIN_DNA = 1440;
const norm = m => ((Math.round(m) % MIN_DNA) + MIN_DNA) % MIN_DNA;

// model času: setTime(min), getTime(), subscribe(callback) – callback(novy, stary)
function vytvorCas(zaciatok = 0) {
  let cas = norm(zaciatok);
  const odberatelia = new Set();
  return {
    setTime(m) {
      const novy = norm(m);
      if (novy === cas) return;
      const stary = cas;
      cas = novy;
      for (const f of [...odberatelia]) f(cas, stary);
    },
    getTime: () => cas,
    subscribe(f) { odberatelia.add(f); return () => odberatelia.delete(f); }
  };
}
// hlavné hodiny aplikácie; všetky karty ich zdieľajú
const HODINY = vytvorCas(7 * 60);
function setTime(min) { HODINY.setTime(min); }
function getTime() { return HODINY.getTime(); }
function subscribe(callback) { return HODINY.subscribe(callback); }

// uhly ručičiek v stupňoch (0° = 12, v smere hodinových ručičiek); funguje aj pre necelé minúty
function uholMinutovej(min) { return ((min % 60) + 60) % 60 * 6; }
function uholHodinovej(min) {
  const m = ((min % MIN_DNA) + MIN_DNA) % MIN_DNA;
  return ((Math.floor(m / 60) % 12) * 60 + (m % 60)) * 0.5;
}
// hodina na ciferníku 1 až 12 (0 a 12 = 12)
function hodina12(min) { return (Math.floor(norm(min) / 60) % 12) || 12; }
// digitálny zápis: 12-hodinový (7:00) alebo 24-hodinový (19:00)
function digitalny(min, format12 = true) {
  const m = norm(min), hh = Math.floor(m / 60), mm = m % 60;
  return (format12 ? (hh % 12 || 12) : hh) + ':' + String(mm).padStart(2, '0');
}
// slovné vyjadrenie celej hodiny podľa 12-hodinového čísla
function slovakFull(min) {
  const h12 = hodina12(min), slovo = T.cislovky[h12];
  const vzor = h12 === 1 ? T.celaHodina.jedna : h12 <= 4 ? T.celaHodina.dve : T.celaHodina.vela;
  return fmt(vzor, { slovo });
}
// tvar na otázku „kedy“: o jednej … o dvanástej
function atHourSK(h) { return T.kedy[(((Math.round(h) - 1) % 12) + 12) % 12 + 1]; }

/* ----- časť 2: slovenský spôsob čítania polhodín a štvrťhodín ----- */
// nasledujúca hodina na ciferníku: 7:30 → 8, 12:15 → 1, 11:45 → 12
function nasledujucaHodina(min) { return hodina12(min) % 12 + 1; }
// 7:30 → „pol ôsmej“ (pol hodiny smerom k nasledujúcej hodine)
function halfSK(min) { return fmt(T.tvary.pol, { radove: T.radove[nasledujucaHodina(min)] }); }
// 7:15 → „štvrť na osem“
function quarterSK(min) { return fmt(T.tvary.stvrt, { hodinu: T.naHodinu[nasledujucaHodina(min)] }); }
// 7:45 → „trištvrte na osem“
function threeQuartersSK(min) { return fmt(T.tvary.tristvrte, { hodinu: T.naHodinu[nasledujucaHodina(min)] }); }
// slovný tvar pre :15, :30 a :45, inak null
function casSlovami(min) {
  const m = norm(min) % 60;
  return m === 15 ? quarterSK(min) : m === 30 ? halfSK(min) : m === 45 ? threeQuartersSK(min) : null;
}
// celá veta: „Je sedem hodín“, „Je pol ôsmej“, „Je štvrť na osem“; pre iné minúty null
function vetaCasu(min) {
  if (norm(min) % 60 === 0) return slovakFull(min);
  const t = casSlovami(min);
  return t ? fmt(T.tvary.je, { tvar: t }) : null;
}
// tvar na otázku „kedy“: o siedmej, o pol ôsmej, o štvrť na osem, o trištvrte na osem (inak „o 7:05“)
function eventTimeSK(min) {
  if (norm(min) % 60 === 0) return atHourSK(hodina12(min));
  return fmt(T.tvary.o, { tvar: casSlovami(min) || digitalny(min) });
}
// text času do bubliny: veta, ak existuje, inak digitálny zápis
function vyjadriCas(min) { return vetaCasu(min) || digitalny(min); }
// spätný prepočet: uhly ručičiek → čas v rámci 12 hodín (0 až 719)
function casZUhlov(uholHod, uholMin) {
  const m = Math.round(uholMin / 6) % 60;
  const hh = Math.round((uholHod * 2 - m) / 60);
  return (((hh % 12) + 12) % 12) * 60 + m;
}
// digitálny čas ako HTML: hodiny, dvojbodka a minúty v samostatných častiach (na farby a zvýraznenie)
function digitalHTML(min, format12 = true) {
  const [hh, mm] = digitalny(min, format12).split(':');
  return `<span class="dh">${hh}</span><span class="dk">:</span><span class="dm">${mm}</span>`;
}

/* ----- časť 3: časti dňa, obloha a činnosti ----- */
// „7:30“ → 450 (minúty od polnoci)
function casZTextu(text) {
  const [hh, mm] = String(text).split(':').map(Number);
  return hh * 60 + (mm || 0);
}
// kľúč časti dňa: rano 5:00–8:59, dopoludnia 9:00–11:59, popoludni 12:00–17:59, vecer 18:00–21:59, noc 22:00–4:59
function castDnaKluc(min) {
  const m = norm(min);
  return m >= 300 && m < 540 ? 'rano' : m >= 540 && m < 720 ? 'dopoludnia' : m >= 720 && m < 1080 ? 'popoludni'
    : m >= 1080 && m < 1320 ? 'vecer' : 'noc';
}
// slovo časti dňa: „ráno“, „dopoludnia“, „popoludní“, „večer“, „v noci“ (rovnaké po celej aplikácii)
function partOfDay(min) { return T.castiDna[castDnaKluc(min)]; }
// 24-hodinový zápis s 12-hodinovým opisom: 15:00 → „3 hodiny popoludní“, 20:00 → „8 hodín večer“
function opis24(min) {
  const m = norm(min), h12 = hodina12(m);
  if (m % 60) return digitalny(m) + ' ' + partOfDay(m);
  const tvar = T.hodinyTvar[h12 === 1 ? 0 : h12 <= 4 ? 1 : 2];
  return fmt(T.opis24, { h: h12, tvar, cast: partOfDay(m) });
}
const velkym = t => t.charAt(0).toUpperCase() + t.slice(1);
// zmiešanie dvoch farieb #rrggbb (p = 0 → a, p = 1 → b)
function zmiesajFarby(a, b, p) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const c = [16, 8, 0].map(s => Math.round(((x >> s) & 255) + (((y >> s) & 255) - ((x >> s) & 255)) * p));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
const medzi01 = x => Math.max(0, Math.min(1, x));
// farby oblohy počas dňa [minúta, hore, dole] – medzi nimi sa plynulo prelievajú
const OBLOHA_FARBY = [
  [0, '#0b1438', '#1d2b5c'], [300, '#0b1438', '#1d2b5c'], [360, '#7aa7e0', '#ffcf9a'], [450, '#4aa3f0', '#bfe3ff'],
  [1050, '#4aa3f0', '#bfe3ff'], [1110, '#e07a4a', '#ffc27a'], [1170, '#6b4a8f', '#f0855a'], [1215, '#0b1438', '#1d2b5c'], [1440, '#0b1438', '#1d2b5c']
];
// stav oblohy: den 6:00–17:59 (slnko), sumrak 18:00–19:59 (oranžová obloha, nízke slnko), noc 20:00–5:59 (mesiac a hviezdy)
// k tomu plynulé hodnoty na kreslenie (farby, poloha a viditeľnosť slnka, mesiaca a hviezd)
function skyState(min) {
  const m = norm(min);
  const stav = m >= 360 && m < 1080 ? 'den' : m >= 1080 && m < 1200 ? 'sumrak' : 'noc';
  let i = 0;
  while (OBLOHA_FARBY[i + 1][0] <= m) i++;
  const [t0, h0, d0] = OBLOHA_FARBY[i], [t1, h1, d1] = OBLOHA_FARBY[i + 1], p = (m - t0) / (t1 - t0);
  // slnko ide oblúkom zľava (6:00) cez obed doprava (20:00)
  const ps = medzi01((m - 360) / 840), nizko = 1 - Math.sin(Math.PI * ps);
  const slnko = { x: 6 + 88 * ps, y: 40 - 30 * Math.sin(Math.PI * ps), viditelnost: medzi01(Math.min((m - 330) / 60, (1230 - m) / 45)),
    farba: zmiesajFarby('#ffd23f', '#ff8a3d', medzi01(nizko * 1.4)) };
  // noc: mesiac a hviezdy sa ukážu po 19:45 a zmiznú okolo 6:00
  const noc = m < 360 ? medzi01((360 - m) / 45) : medzi01((m - 1185) / 45);
  const q = medzi01(((m - 1185 + MIN_DNA) % MIN_DNA) / 660);
  const mesiac = { x: 8 + 84 * q, y: 34 - 22 * Math.sin(Math.PI * q), viditelnost: noc };
  return { stav, horna: zmiesajFarby(h0, h1, p), dolna: zmiesajFarby(d0, d1, p), slnko, mesiac, hviezdy: noc,
    kopce: zmiesajFarby('#1b3527', '#4f9a55', medzi01(1 - noc - nizko * 0.35)) };
}
// činnosti s časmi v minútach (odvodené z údajov DEN)
const CINNOSTI = DEN.cinnosti.map((c, poradie) => ({ ...c, poradie, typicky: casZTextu(c.cas), od: casZTextu(c.okno[0]), po: casZTextu(c.okno[1]) }));
const CINNOST = Object.fromEntries(CINNOSTI.map(c => [c.id, c]));
const vOkne = (c, min) => min >= c.od && min <= c.po;
// ktorá z dvoch činností je skôr podľa typického času (vráti id)
function skorsia(a, b) { return CINNOST[a].typicky <= CINNOST[b].typicky ? a : b; }
// poradie dvoch činností sa kontroluje, len ak nie sú v tej istej skupine (napr. večerné zvyky sú v rodinách rôzne)
function poradieZavazne(a, b) { const A = CINNOST[a], B = CINNOST[b]; return a !== b && !(A.skupina && A.skupina === B.skupina); }
// kontrola poradia: zoznam [{id, cas}] → null, ak je v poriadku, inak dvojica [id, id], ktorú treba vymeniť
function skontrolujPoradie(zoznam) {
  const z = [...zoznam].sort((x, y) => x.cas - y.cas);
  // najbližšie dvojice najprv, aby Hodinko ukázal tie, ktoré stoja vedľa seba
  for (let d = 1; d < z.length; d++) {
    for (let i = 0; i + d < z.length; i++) {
      const a = z[i], b = z[i + d];
      if (a.cas === b.cas || !poradieZavazne(a.id, b.id)) continue;
      if (skorsia(a.id, b.id) === b.id) return [a.id, b.id];
    }
  }
  return null;
}
// prvá činnosť, ktorej čas neleží v jej časovom okne (inak null)
function mimoOkna(zoznam) {
  const z = [...zoznam].sort((x, y) => x.cas - y.cas).find(x => !vOkne(CINNOST[x.id], x.cas));
  return z ? z.id : null;
}
// úloha „Čo robíme o tejto hodine?“: typický čas jednej činnosti a tri obrázky, práve jeden sa k času hodí
function zadanieTeraz(rng = Math.random, okrem = []) {
  const kandidati = CINNOSTI.filter(c => !okrem.includes(c.id));
  const spravna = kandidati[Math.floor(rng() * kandidati.length)];
  const cas = spravna.typicky;
  const ine = zamiesaj(CINNOSTI.filter(c => !vOkne(c, cas)), rng).slice(0, 2);
  return { cas, spravna: spravna.id, moznosti: zamiesaj([spravna.id, ...ine.map(c => c.id)], rng) };
}
/* ----- časť 4: trvanie ----- */
// tvar slova podľa čísla: 1 → tvary[0], 2 až 4 → tvary[1], inak tvary[2]
const tvarPodlaCisla = (n, tvary) => tvary[n === 1 ? 0 : n >= 2 && n <= 4 ? 1 : 2];
// „1 minúta“, „3 minúty“, „25 minút“
function minutySK(n) { return n + ' ' + tvarPodlaCisla(n, T.minutaTvar); }
// trvanie slovami: 15 „štvrť hodiny“, 30 „pol hodiny“, 90 „hodina a pol“, 120 „dve hodiny“ …, inak „25 minút“
function durationSK(min) {
  if (T.dlzky[min]) return T.dlzky[min];
  const h = min / 60;
  if (min > 0 && min % 60 === 0 && h <= 12) return T.cislovky[h] + ' ' + tvarPodlaCisla(h, T.hodinyTvar);
  return minutySK(min);
}
// „je“ alebo „sú“ pred trvaním: „To sú štyri hodiny“, „To je pol hodiny“
function jeSu(min) { const h = min / 60; return min % 60 === 0 && h >= 2 && h <= 4 ? 'sú' : 'je'; }
// počet minút od začiatku do konca v rámci jedného dňa; cez polnoc sa neráta
function minutesBetween(od, po) {
  if (!(po >= od)) throw new RangeError(T.chybaTrvania);
  return po - od;
}
// „o ôsmej“ → „ôsmej“ (do vety „od ôsmej do dvanástej“)
function bezO(min) { return eventTimeSK(min).replace(/^o /, ''); }

// úloha „Ráno alebo večer?“: činnosť a dva časy s rovnakou polohou ručičiek (o 12 hodín inak)
function zadanieRanoVecer(rng = Math.random, okrem = []) {
  const kandidati = CINNOSTI.filter(c => !DEN.bezRanaVecera.includes(c.id) && !okrem.includes(c.id));
  const c = kandidati[Math.floor(rng() * kandidati.length)];
  const cas = c.typicky, dvojca = norm(cas + 720);
  return { id: c.id, cas, moznosti: zamiesaj([cas, dvojca], rng) };
}

/* =====================================================================
   POMOCNÍCI
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => (k in o ? o[k] : m));
const SVGNS = 'http://www.w3.org/2000/svg';
// vytvorenie prvku: h('div', {class: 'x', onclick: f}, deti…)
function h(tag, vlastnosti, ...deti) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(vlastnosti || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;

// Hodinko s bublinou: povedz(text, výraz) – výrazy: premysla, tesi, povzbudzuje
function vytvorHodinka(miesto, karta) {
  const postava = h('div', { class: 'hodinkoPostava', html: hodinkoSVG(false) });
  const bublina = h('div', { class: 'bublina', 'aria-live': 'polite' });
  let text = '', vyraz = 'premysla';
  miesto.append(h('div', { class: 'hodinko' }, postava, bublina));
  const svg = postava.firstElementChild;
  return {
    povedz(t, v = 'premysla', skok = true) {
      text = t; vyraz = v;
      bublina.textContent = t;
      svg.setAttribute('class', 'hodinkoSvg vyraz-' + v);
      svg.setAttribute('aria-label', T.hodinko[v]);
      if (skok) odskok(postava);
      if (STAV.karta === karta) precitaj(t, karta);
    },
    text: () => text,
    vyraz: () => vyraz
  };
}
