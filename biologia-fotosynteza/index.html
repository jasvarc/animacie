<style>
/* ===== Farby a základ – rovnaká paleta ako predošlé animácie ===== */
:root{

button:hover{background:rgba(255,255,255,.13);border-color:rgba(160,180,230,.4)}

.bar .tr{height:16px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:8px}
.bar .tr i.fs{background:repeating-linear-gradient(45deg,#7fdc8f 0 8px,#5fb86f 8px 12px)}
.bar .tr i.dy{background:repeating-linear-gradient(-45deg,#e58fd9 0 8px,#b866ad 8px 12px)}
.bar b{text-align:right;font-variant-numeric:tabular-nums;font-size:16px}
.netto{margin-top:6px}
.netto b.ok{color:var(--green)}.netto b.zle{color:var(--red)}
.limit{margin-top:6px;color:var(--muted)}
.limit b{color:var(--gold2)}
#infoCard.flash{animation:flash .9s}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--gold2)}100%{box-shadow:0 12px 40px rgba(0,0,0,.45)}}
#infoNazov{font-size:22px;font-weight:750;margin:0 0 6px;display:flex;align-items:center;gap:8px}
#infoKde{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:16px}
details.pojmy{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.pojmy summary{cursor:pointer;color:var(--gold2);font-weight:650;min-height:32px}
.skup{margin-top:8px}
.skup>span{display:block;color:var(--muted);font-size:16px;margin-bottom:4px}
.skup .chips{display:flex;flex-wrap:wrap;gap:6px}
.skup .chips button{padding:5px 10px;min-height:40px}

/* Porovnanie */
.porovWrap{overflow-x:auto}
table.porov{width:100%;border-collapse:collapse;font-size:17px;min-width:560px}
table.porov th{text-align:left;padding:8px;border-bottom:2px solid var(--line);font-size:18px}
table.porov th:nth-child(2){color:var(--green)}
table.porov th:nth-child(3){color:var(--dych)}
table.porov td{padding:8px;border-bottom:1px solid rgba(140,160,215,.14);vertical-align:top}
table.porov td:first-child{color:var(--muted);font-weight:650;width:22%}
table.porov td svg.ic{width:20px;height:20px;margin-right:2px}
.dvoj{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px;align-items:start;margin-top:14px}
.box{margin:10px 0;padding:10px 13px;border-radius:10px;border:1px solid}
.box b.h{display:block;font-size:16px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.box.omyl{background:rgba(255,122,107,.09);border-color:rgba(255,122,107,.45)}.box.omyl b.h{color:var(--red)}
.box.pravda{background:rgba(127,220,143,.08);border-color:rgba(127,220,143,.4)}.box.pravda b.h{color:var(--green)}
.box.info{background:rgba(111,180,255,.08);border-color:rgba(111,180,255,.4)}

/* Omyly */
.omylyGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:16px}
.omylyGrid svg{display:block;width:100%;height:auto;background:#0b1626;border-radius:10px}
figure{margin:0}
figcaption{color:var(--muted);font-size:16px;margin:6px 0 0}

/* Kvíz */
.otazka{padding:12px 0;border-bottom:1px solid var(--line)}
.otazka .q{font-size:18px;margin-bottom:8px}
.moznosti{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.moznosti button{text-align:left}
.moznosti button:disabled{opacity:.8}
.otazka button.ok{background:rgba(127,220,143,.2);border-color:var(--green);color:#d7ffdf;opacity:1}
.otazka button.zle{background:rgba(255,122,107,.2);border-color:var(--red);color:#ffe0dc;opacity:1}
.otazka button.vyb{background:rgba(243,180,83,.2);border-color:var(--gold)}
.triedRow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.triedRow .nm{display:inline-flex;align-items:center;gap:7px;min-width:170px;font-weight:650}
.fb{margin-top:8px;font-size:16px}
.fb.ok b{color:var(--green)}.fb.zle b{color:var(--red)}
#kvizVysl{font-size:20px;font-weight:700;color:var(--gold2);margin:12px 0}
ul.poznList{margin:0;padding-left:22px}
ul.poznList li{margin:6px 0}
footer{color:var(--muted);text-align:center;font-size:16px;padding:20px 0 10px}
</style>

<body>
<div class="wrap">

<header class="top">
  <div><h1 data-t="titul"></h1><p class="sub" data-t="podtitul"></p></div>
  <nav class="skoky">
    <a href="#anim" data-t="nav.anim"></a><a href="#porov" data-t="nav.porov"></a><a href="#omyly" data-t="nav.omyly"></a>
    <a href="#kviz" data-t="nav.kviz"></a><a href="#pozn" data-t="nav.pozn"></a>

<!-- ============ HLAVNÁ ANIMÁCIA ============ -->
<section id="anim" class="hlavna">
  <div class="stlpec">
    <!-- Rovnica – prilepená hore, aby bola stále viditeľná -->
    <div class="card rovnica" id="rovCard">
      <div class="rovRiadok" id="rovSlovna"></div>
      <div class="rovRiadok chem" id="rovChem"></div>
      <p class="rovTip" data-t="rovnica.tip"></p>
    </div>

    <div class="card sceneCard" id="sceneCard">
      <svg id="scena" viewBox="0 0 800 520" role="img" aria-label="Animácia fotosyntézy">
        <defs id="defs"></defs>
        <g id="lv0"><g class="st"></g><g class="dy"></g></g>
        <g id="lv1"><g class="st"></g><g class="dy"></g></g>
        <g id="lv2"><g class="st"></g><g class="dy"></g></g>
      </svg>
      <div class="overlay"><b id="lvNazov"></b><span id="lvPopis"></span></div>
      <div class="chipy"><span id="chipDen"></span><span id="chipStav"></span></div>
      <div class="zoomBar">
        <button id="zoomOut" aria-label="Oddialiť">− <span data-t="ui.oddialit"></span></button>

    <div class="card ovl">

        <div class="seg"><button id="btnDen" data-t="ui.den"></button><button id="btnNoc" data-t="ui.noc"></button></div>
        <div class="seg" id="lvBtns"><span class="lbl0" data-t="ui.uroven"></span></div>
      </div>
      <div class="sliders">
        <label class="sl" id="slSvetlo">
          <span class="lbl"><span data-t="ui.svetlo"></span><b id="vSvetlo"></b></span>

        </label>
        <label class="sl">
          <span class="lbl"><span>CO₂ – <span data-t="ui.co2"></span></span><b id="vCo2"></b></span>
          <input type="range" id="inCo2" min="0" max="100" step="1" value="60" aria-label="Množstvo CO2">
          <span class="kraje"><span data-t="ui.kraje.co2.0"></span><span data-t="ui.kraje.co2.1"></span></span>
        </label>
        <label class="sl">
          <span class="lbl"><span data-t="ui.voda"></span><b id="vVoda"></b></span>

        <label class="sl">
          <span class="lbl"><span data-t="ui.rychlost"></span><b id="vRychl">1×</b></span>

        <div class="poc"><span id="icO2"></span><b id="cO2">0</b></div>
        <div class="poc"><span id="icGlu"></span><b id="cGlu">0</b></div>
        <div class="poc"><span id="icO2p"></span><b id="cO2p">0</b></div>
      </div>
      <div class="pocRow"><p class="mini" data-t="ui.pocPozn"></p><button id="btnNul" data-t="ui.nulovat"></button></div>

  <div class="stlpec">
    <div class="card" id="dejeCard">
      <h3 data-t="ui.deje"></h3>

      <div class="bary">
        <div class="bar"><span data-t="ui.fotoBar"></span><span class="tr"><i class="fs" id="barP"></i></span><b id="valP"></b></div>
        <div class="bar"><span data-t="ui.dychBar"></span><span class="tr"><i class="dy" id="barR"></i></span><b data-t="ui.dychStale"></b></div>
        <div class="netto"><span data-t="ui.navonok"></span> <span id="netto"></span></div>

    </div>
    <div class="card" id="infoCard">
      <h3 data-t="ui.popis"></h3>
      <div id="infoNazov"></div>
      <div id="infoText"></div>
      <div id="infoKde"></div>

<script>
/* =====================================================================
   POMOCNÉ FUNKCIE
   ===================================================================== */
const $ = s => document.querySelector(s);
const PI = Math.PI;
const cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;      // orezanie do intervalu
const lerp = (a, b, t) => a + (b - a) * t;                      // lineárny prechod
const ez = t => t * t * (3 - 2 * t);                            // plynulý nábeh a dobeh
const r1 = v => Math.round(v * 10) / 10;                        // zaokrúhlenie (kratšie SVG)
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }; // pevná „náhoda“ pre kresbu
const R = Math.random;                                          // skutočná náhoda pre častice
const pick = a => a[Math.floor(R() * a.length)];
const sablona = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
/* miešanie dvoch farieb #rrggbb */
function mix(a, b, t) {
  t = cl(t); const A = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16)), B = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
/* ikonka látky pre HTML (používa tie isté značky ako animácia) */
const ikona = k => `<svg class="ic" viewBox="-13 -13 26 26" aria-hidden="true"><use href="#p-${k}"/></svg>`;
const sIkonami = s => s.replace(/\[(co2|voda|svetlo|glukoza|kyslik|mineraly|dychanie|fotosynteza)\]/g, (_, k) => ikona(k));
/* popisok v SVG s tmavým podkladom (na malých obrazovkách sa skryje) */
function lab(x, y, t, anchor = 'start') {
  const w = t.length * 8.7 + 14, x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
  return `<g class="lab" pointer-events="none"><rect x="${r1(x0)}" y="${r1(y - 15)}" width="${r1(w)}" height="24" rx="7" fill="rgba(6,10,20,.78)"/>`
    + `<text x="${r1(x0 + 7)}" y="${r1(y + 3)}" font-size="17" fill="#e2e8f5">${t}</text></g>`;
}
/* lomená čiara ako „cesta“ častice; d = vzdialenosti od začiatku */
function cesta(pts) {
  const d = [0];
  for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, d, L: d[d.length - 1] };
}
function bodNa(c, s) {
  const { pts, d, L } = c;
  if (s <= 0) return pts[0];
  if (s >= L) return pts[pts.length - 1];
  let i = 1; while (d[i] < s) i++;
  const t = (s - d[i - 1]) / ((d[i] - d[i - 1]) || 1);
  return [lerp(pts[i - 1][0], pts[i][0], t), lerp(pts[i - 1][1], pts[i][1], t)];
}

/* =====================================================================
   ZNAČKY LÁTOK – kreslia sa raz do <defs>, potom sa len odkazujú (<use>).
   Každá látka má inú farbu AJ iný tvar (kvôli farboslepým žiakom).
   Priehľadný kruh okolo značky = väčšia plocha na kliknutie prstom.
   ===================================================================== */
function vytvorZnacky() {
  const c = k => DATA.latky[k].c;
  const hex = r => [30, 90, 150, 210, 270, 330].map(a => r1(r * Math.cos(a * PI / 180)) + ',' + r1(r * Math.sin(a * PI / 180))).join(' ');
  $('#defs').innerHTML =
    // CO₂: tri guľôčky v rade (O–C–O)
    `<g id="p-co2"><circle r="15" fill="transparent"/><circle cx="-8.5" r="5.6" fill="${c('co2')}" stroke="#151a26" stroke-width="1.2"/><circle cx="8.5" r="5.6" fill="${c('co2')}" stroke="#151a26" stroke-width="1.2"/><circle r="6.2" fill="#4a5163" stroke="${c('co2')}" stroke-width="1.8"/></g>`
    // voda: kvapka
    + `<g id="p-voda"><circle r="14" fill="transparent"/><path d="M0,-10 C4,-4 7.5,0 7.5,4 A7.5,7.5 0 0 1 -7.5,4 C-7.5,0 -4,-4 0,-10Z" fill="${c('voda')}" stroke="#0d2a4a" stroke-width="1.2"/><ellipse cx="-2.6" cy="3.5" rx="1.6" ry="2.6" fill="#e2f0ff" opacity=".8"/></g>`
    // kyslík: dve guľôčky
    + `<g id="p-kyslik"><circle r="14" fill="transparent"/><circle cx="-4.8" r="5.8" fill="${c('kyslik')}" stroke="#3a0d08" stroke-width="1.2"/><circle cx="4.8" r="5.8" fill="${c('kyslik')}" stroke="#3a0d08" stroke-width="1.2"/></g>`
    // glukóza: šesťuholník (ako kruh v molekule glukózy)
    + `<g id="p-glukoza"><circle r="14" fill="transparent"/><polygon points="${hex(9)}" fill="${c('glukoza')}" stroke="#3a2205" stroke-width="1.4"/><polygon points="${hex(4.2)}" fill="none" stroke="#3a2205" stroke-width="1.1" opacity=".6"/></g>`
    // svetlo: štvorcípa hviezdička
    + `<g id="p-svetlo"><circle r="13" fill="transparent"/><path d="M0,-10 L2.4,-2.4 L10,0 L2.4,2.4 L0,10 L-2.4,2.4 L-10,0 L-2.4,-2.4Z" fill="${c('svetlo')}" stroke="#6b5a10" stroke-width=".8"/><circle r="2.4" fill="#fff"/></g>`
    // minerálne látky: kosoštvorec
    + `<g id="p-mineraly"><circle r="12" fill="transparent"/><rect x="-4.8" y="-4.8" width="9.6" height="9.6" transform="rotate(45)" fill="${c('mineraly')}" stroke="#24183f" stroke-width="1.2"/></g>`
    // dýchanie: krúživá šípka
    + `<g id="p-dychanie"><circle r="12" fill="#2a1630" stroke="#e58fd9" stroke-width="2"/><path d="M6.5,0 A6.5,6.5 0 1 1 0,-6.5" fill="none" stroke="#e58fd9" stroke-width="2.4"/><path d="M-1,-10 L3.5,-6.5 L-1,-3Z" fill="#e58fd9"/></g>`
    // fotosyntéza: zelenkastá šesťramenná iskra (iný tvar ako svetlo)
    + `<g id="p-fotosynteza"><circle r="12" fill="transparent"/><path d="M0,-9 V9 M-7.8,-4.5 L7.8,4.5 M-7.8,4.5 L7.8,-4.5" stroke="#3d6a10" stroke-width="4.4" stroke-linecap="round"/><path d="M0,-9 V9 M-7.8,-4.5 L7.8,4.5 M-7.8,4.5 L7.8,-4.5" stroke="#d9ff8a" stroke-width="2.4" stroke-linecap="round"/></g>`;
}

/* =====================================================================
   STAV ANIMÁCIE A MODEL FOTOSYNTÉZY
   ===================================================================== */
const S = {
  beh: true, rychl: 1, t: 0,              // beží?, rýchlosť, čas animácie (s)
  svetlo: 70, co2: 60, voda: 80, den: true,
  lvPos: 0, lvCil: 0,                     // úroveň priblíženia (0 rastlina, 1 list, 2 bunka); lvPos sa plynulo blíži k lvCil
  open: 0.8,                              // otvorenie prieduchov 0..1
  vyber: null,                            // vybraný objekt (id z DATA.objekty)
  gluk: 0, o2uv: 0, o2pr: 0,              // počítadlá
  dirty: [true, true, true]               // treba prekresliť statickú časť úrovne?
};
const SAT = 65;     // od tejto intenzity svetla (%) sa už fotosyntéza nezrýchľuje – hodnota zvolená len pre názornosť
const RESP = 0.22;  // stála rýchlosť dýchania v modeli (v pomere k najvyššej rýchlosti fotosyntézy) – ilustračná hodnota

/* Rýchlosť fotosyntézy podľa „zákona minima“: rozhoduje činiteľ, ktorého je najmenej. */
function model() {
  const den = S.den, L = den ? S.svetlo : 0;
  const fL = L <= 0 ? 0 : 1 - Math.pow(1 - Math.min(1, L / SAT), 2); // svetlo: rastie a nad SAT sa už nemení (nasýtenie)
  const fC = Math.min(1, S.co2 / 75);                                 // CO₂
  const fW = Math.min(1, S.voda / 60);                                // voda (pri suchu sa privrú prieduchy)
  const P = Math.min(fL, fC, fW);
  let limit = null;
  if (!den) limit = 'noc';
  else if (L <= 0) limit = 'tma';
  else if (P < 0.97) limit = [['svetlo', fL], ['co2', fC], ['voda', fW]].sort((a, b) => a[1] - b[1])[0][0];
  // prieduchy: otvárajú sa na svetle, zatvárajú v tme a pri suchu
  const openCiel = (den ? Math.min(1, 0.2 + fL) : 0.12) * Math.max(0.05, Math.min(1, S.voda / 45));
  return { den, Lv: L, fL, fC, fW, P, R: RESP, limit, openCiel, nasyt: den && S.svetlo > SAT };
}

/* =====================================================================
   SYSTÉM ČASTÍC – každá častica ide po svojej ceste (lomenej čiare).
   ===================================================================== */
const SYS = [[], [], []];     // častice pre každú úroveň
const ACC = [{}, {}, {}];     // „zásobníky“ na rovnomerné vypúšťanie častíc
/* pridaj časticu: lv úroveň, k látka, pts body cesty, v rýchlosť (px/s), end = čo sa stane na konci, oneskor = s */
function pridaj(lv, k, pts, v, end, oneskor = 0, o = {}) {
  if (SYS[lv].length > 260) return;
  const c = cesta(pts);
  SYS[lv].push(Object.assign({ k, c, v, s: -oneskor * v, end, seed: R() * 10 }, o));
}
/* vypúšťaj časticu s priemernou frekvenciou rate (za s) */
function emit(lv, id, rate, dt, fn) {
  const A = ACC[lv]; A[id] = (A[id] || 0) + rate * dt;
  let n = 0; while (A[id] >= 1 && n < 4) { A[id] -= 1; n++; fn(); }
  if (A[id] > 1) A[id] = 1;
}
function posun(arr, dt) {
  for (let i = arr.length - 1; i >= 0; i--) {
    const p = arr[i]; p.s += p.v * dt;
    if (p.s >= p.c.L) { arr.splice(i, 1); if (p.end) p.end(); }
  }
}
/* kreslenie častíc; zvýraznená látka je väčšia a má krúžok, ostatné sa stlmia */
function kresliCastice(arr, sc) {
  const z = zvyrLatka(); let s = '';
  for (const p of arr) {
    if (p.s < 0) continue;
    let [x, y] = bodNa(p.c, p.s);
    if (p.wob) y += Math.sin(S.t * 3 + p.seed) * p.wob;

/* =====================================================================
   ÚROVEŇ 2 – BUNKA S CHLOROPLASTMI

const CEN = [330, 250];                    // stred hlavného chloroplastu
const SLOT_C = [[208, 212], [236, 193], [266, 182], [208, 288], [236, 307], [266, 318]];   // tu čakajú CO₂
const SLOT_W = [[394, 182], [424, 193], [452, 212], [394, 318], [424, 307], [452, 288]];   // tu čaká voda

const GRANA = [[240, 222], [300, 285], [358, 215], [418, 280], [262, 286], [412, 214]];
const MALE_CHL = [[185, 82, -15], [292, 64, 5], [420, 72, 10], [168, 432, 20], [300, 456, -5]];

function staticC() {

    + `<rect x="120" y="502" width="560" height="300" rx="40" fill="#1a3522" stroke="#7cc46a" stroke-width="6" opacity=".45"/>`;

  s += `<rect data-obj="bunka" x="110" y="28" width="580" height="464" rx="44" fill="#1d3a26"/>`

  // vakuola a jadro

  });
  // mitochondria (dýchanie)
  s += `<g data-obj="mitochondria" transform="translate(${MITO[0]} ${MITO[1]}) rotate(-15)"><ellipse rx="34" ry="17" fill="#3a2238" stroke="#e58fd9" stroke-width="2.5"/>`
    + `<path d="M-24,0 l5,-9 l5,16 l5,-16 l5,16 l5,-16 l5,16 l5,-16 l5,9" stroke="#e58fd9" stroke-width="1.6" fill="none"/></g>`;

    + `<ellipse cx="${CEN[0]}" cy="${CEN[1]}" rx="161" ry="89" fill="none" stroke="#a6e391" stroke-width="1.4" opacity=".7"/>`

const vzduchC = () => [-15, 60 + R() * 390];
function vyrobC() {   // v chloroplaste vznikla 1 glukóza a 6 O₂
  S.rovFlash = true;
  CS.fx.push({ x: CEN[0], y: CEN[1] - 30, t: S.t, txt: DATA.ui.fxGluk, col: '#ffd88a' });
  pridaj(2, 'glukoza', [CEN, [350, 330], [410, 400], [405, 470], [405, 540]], 70);
  for (let i = 0; i < 6; i++) {
    const y = 180 + R() * 140;
    pridaj(2, 'kyslik', [[CEN[0] + (R() - .5) * 50, CEN[1] + (R() - .5) * 40], [170, y], [112, y + (R() - .5) * 20], [-20, y + (R() - .5) * 60]], 95, null, i * 0.22);
  }
}
function krokC(dt, M) {
  // prísun CO₂ (zo vzduchu medzi bunkami) a vody (z ciev) – len kým v chloroplaste nie je 6 a 6
  if (CS.asm === 0) {
    if (M.den && CS.invC + CS.inC < 6) emit(2, 'co2', 6 * KC * M.fC * (.3 + .7 * S.open), dt, () => {
      const sl = SLOT_C[CS.invC + CS.inC], [x0, y0] = vzduchC(); CS.inC++;
      pridaj(2, 'co2', [[x0, y0], [70, y0 + (R() - .5) * 30], [116, lerp(y0, sl[1], .4)], [sl[0] - 40, sl[1] + (R() - .5) * 20], sl], 110, () => { CS.inC--; CS.invC++; });
    });
    if (CS.invW + CS.inW < 6) emit(2, 'voda', 6 * KC * M.fW, dt, () => {
      const sl = SLOT_W[CS.invW + CS.inW], x = 200 + R() * 260; CS.inW++;
      pridaj(2, 'voda', [[x, 540], [x + (R() - .5) * 20, 488], [lerp(x, sl[0], .5), 400], sl], 100, () => { CS.inW--; CS.invW++; });
    });
  }
  // svetlo dopadá na chloroplast
  if (M.Lv > 0) emit(2, 'svetlo', 6 * M.Lv / 100, dt, () => {
    const x = 190 + R() * 280, y = 172 + R() * 30;
    pridaj(2, 'svetlo', [[x, -12], [x + (R() - .5) * 30, y]], 300, () => CS.fx.push({ x, y, t: S.t, blesk: 1 }));
  });

  if (CS.asm === 0 && CS.invC >= 6 && CS.invW >= 6 && M.fL > 0) CS.asm = 1e-4;
  if (CS.asm > 0) { CS.asm += dt * M.fL / 1.3; if (CS.asm >= 1) { CS.asm = 0; CS.invC = 0; CS.invW = 0; vyrobC(); } }
  // dýchanie v mitochondrii: glukóza + 6 O₂ → 6 CO₂ + 6 H₂O + energia (prebieha stále)
  const m = CS.m;
  if (m.st === 'idle') {
    m.acc += dt * MITO_RATE;
    if (m.acc >= 1) {
      m.acc = 0; m.st = 'in'; m.n = 0;
      pridaj(2, 'glukoza', [[330, 330], [390, 380], MITO], 70, () => m.n++);
      const zChl = M.den && M.P > M.R;   // cez deň berie kyslík priamo z fotosyntézy
      for (let i = 0; i < 6; i++) {
        const ciel = [MITO[0] + (R() - .5) * 26, MITO[1] + (R() - .5) * 10];
        if (zChl) pridaj(2, 'kyslik', [[CEN[0] + (R() - .5) * 60, CEN[1] + 10 + (R() - .5) * 40], [400, 360], ciel], 90, () => m.n++, i * .3);
        else { const y = 300 + R() * 150; pridaj(2, 'kyslik', [[-15, y], [116, y], [300, lerp(y, MITO[1], .6)], ciel], 100, () => m.n++, i * .3); }
      }
    }
  } else if (m.st === 'in' && m.n >= 7) { m.st = 'horenie'; m.t = 0; }
  else if (m.st === 'horenie') {
    m.t += dt;
    if (m.t >= 1) {
      m.st = 'idle';
      CS.fx.push({ x: MITO[0], y: MITO[1] - 30, t: S.t, txt: DATA.ui.fxEnergia, col: '#e58fd9' });
      for (let i = 0; i < 6; i++) {
        if (M.den && M.P > 0.02 && CS.asm === 0 && CS.invC + CS.inC < 6) {   // cez deň CO₂ z dýchania hneď využije chloroplast
          const sl = SLOT_C[CS.invC + CS.inC]; CS.inC++;
          pridaj(2, 'co2', [MITO, [360, 372], sl], 90, () => { CS.inC--; CS.invC++; }, i * .2);
        } else { const y = 380 + R() * 80; pridaj(2, 'co2', [MITO, [300, y], [116, y], [-20, y + (R() - .5) * 40]], 95, null, i * .2); }
        pridaj(2, 'voda', [MITO, [540, 400], [585 + (R() - .5) * 60, 300 + (R() - .5) * 140]], 70, null, i * .2);
      }
    }
  }
  posun(SYS[2], dt);
}
function dynamicC(M) {
  let s = '';
  const a = CS.asm, z = zvyrLatka(), zb = ez(cl(a / 0.55)), sc = 1.6;
  // žiara chloroplastu počas premeny
  if (a > 0) { const g = Math.sin(PI * a); s += `<ellipse cx="${CEN[0]}" cy="${CEN[1]}" rx="${r1(40 + 60 * g)}" ry="${r1(30 + 40 * g)}" fill="#fff1a6" opacity="${(.12 + .3 * g).toFixed(2)}" pointer-events="none"/>`; }
  // žiara mitochondrie počas dýchania
  if (CS.m.st === 'horenie') s += `<ellipse cx="${MITO[0]}" cy="${MITO[1]}" rx="48" ry="28" fill="#e58fd9" opacity="${(.35 * Math.sin(PI * CS.m.t)).toFixed(2)}" pointer-events="none"/>`;
  // čakajúce molekuly v chloroplaste (pri premene sa zbiehajú do stredu)
  const park = (k, slots, n) => {
    for (let i = 0; i < n; i++) {
      const x = lerp(slots[i][0], CEN[0], zb), y = lerp(slots[i][1], CEN[1], zb);
      let op = a > 0.7 ? 1 - (a - 0.7) / 0.12 : 1, m = sc;
      if (op <= 0.02) continue;
      if (z) { if (z === k) m *= 1.45; else op *= .25; }
      if (z === k) s += `<circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(15 * m)}" fill="none" stroke="#ffd88a" stroke-width="2"/>`;
      s += `<use href="#p-${k}" data-obj="${k}" transform="translate(${r1(x)} ${r1(y)}) scale(${m.toFixed(2)})" opacity="${cl(op).toFixed(2)}"/>`;
    }
  };
  park('co2', SLOT_C, CS.invC); park('voda', SLOT_W, CS.invW);
  if (a > 0.72) s += `<use href="#p-glukoza" data-obj="glukoza" transform="translate(${CEN[0]} ${CEN[1]}) scale(${(ez(cl((a - .72) / .28)) * 1.8).toFixed(2)})"/>`;
  s += kresliCastice(SYS[2], sc);
  // efekty: záblesky svetla a plávajúce texty
  CS.fx = CS.fx.filter(f => S.t - f.t < (f.blesk ? .5 : 2.2));
  for (const f of CS.fx) {
    const age = S.t - f.t;
    if (f.blesk) s += `<circle cx="${r1(f.x)}" cy="${r1(f.y)}" r="${r1(4 + age * 36)}" fill="none" stroke="#fff1a6" stroke-width="2" opacity="${(1 - age / .5).toFixed(2)}" pointer-events="none"/>`;
    else s += `<g class="lab" pointer-events="none" opacity="${cl(1.4 - age / 1.6).toFixed(2)}"><text x="${f.x}" y="${r1(f.y - age * 22)}" text-anchor="middle" font-size="18" font-weight="700" fill="${f.col}" stroke="#08101c" stroke-width="4" paint-order="stroke">${f.txt}</text></g>`;
  }
  return s;
}

/* vyber objekt: zobrazí popis, zvýrazní ho v scéne aj v rovnici */

/* bublina pri ukázaní na objekt */
const tip = $('#tip'), karta = $('#sceneCard');
let tipCas = 0;
function ukazTip(id, ex, ey) {
  const O = DATA.objekty[id]; if (!O) return;
  tip.innerHTML = `<b>${O.n}</b>${O.k}`; tip.hidden = false;
  const r = karta.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ex - r.left + 14, y = ey - r.top + 16;
  if (x + w > r.width - 6) x = ex - r.left - w - 14;
  if (y + h > r.height - 6) y = ey - r.top - h - 12;
  tip.style.left = Math.max(6, x) + 'px'; tip.style.top = Math.max(6, y) + 'px';
}
function skryTip() { tip.hidden = true; }
const svg = $('#scena');
const objZ = t => { const el = t && t.closest ? t.closest('[data-obj]') : null; return el ? el.getAttribute('data-obj') : null; };
svg.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  const id = objZ(e.target);
  if (id) ukazTip(id, e.clientX, e.clientY); else skryTip();
});
svg.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') skryTip(); });
/* klik/ťuknutie: vyberie objekt pod prstom (zistí ho už pri dotyku – častice sa medzitým posunú) */
let dole = null;
svg.addEventListener('pointerdown', e => {
  const z = e.target.closest ? e.target.closest('[data-zoom]') : null;
  dole = { x: e.clientX, y: e.clientY, id: objZ(e.target), zoom: z ? +z.getAttribute('data-zoom') : null };
});
svg.addEventListener('pointerup', e => {
  if (!dole || Math.hypot(e.clientX - dole.x, e.clientY - dole.y) > 12) { dole = null; return; }
  if (dole.zoom != null) nastavUroven(dole.zoom);
  else if (dole.id) {
    vyber(dole.id);
    if (e.pointerType === 'touch') { ukazTip(dole.id, e.clientX, e.clientY); tipCas = performance.now() + 2500; }
  } else vyber(null);
  dole = null;
});

/* =====================================================================
   OVLÁDANIE
   ===================================================================== */
function nastavPlay() { $('#btnPlay').textContent = S.beh ? DATA.ui.pauza : DATA.ui.spustit; }
function nastavDen(d) {
  S.den = d; S.dirty = [true, true, true];
  $('#btnDen').classList.toggle('on', d); $('#btnNoc').classList.toggle('on', !d);
  $('#inSvetlo').disabled = !d; $('#slSvetlo').classList.toggle('vyp', !d); $('#notaNoc').hidden = d;
  $('#chipDen').textContent = d ? DATA.ui.den : DATA.ui.noc;
}
function popisSlidera() {
  const H = DATA.ui.hodnoty;
  $('#vSvetlo').textContent = H.svetlo(S.svetlo); $('#vCo2').textContent = H.co2(S.co2); $('#vVoda').textContent = H.voda(S.voda);
  $('#vRychl').textContent = String(S.rychl).replace('.', ',') + '×';
}
$('#btnPlay').addEventListener('click', () => { S.beh = !S.beh; nastavPlay(); });
$('#btnDen').addEventListener('click', () => nastavDen(true));
$('#btnNoc').addEventListener('click', () => nastavDen(false));
[['#inSvetlo', 'svetlo'], ['#inCo2', 'co2'], ['#inVoda', 'voda'], ['#inRychl', 'rychl']].forEach(([sel, k]) => {
  $(sel).addEventListener('input', e => { S[k] = +e.target.value; if (k !== 'rychl') S.dirty = [true, true, true]; popisSlidera(); });
});
$('#zoomIn').addEventListener('click', () => nastavUroven(S.lvCil + 1));
$('#zoomOut').addEventListener('click', () => nastavUroven(S.lvCil - 1));
$('#btnNul').addEventListener('click', () => { S.gluk = S.o2uv = S.o2pr = 0; });
function vytvorUrovneTlacidla() {
  DATA.urovne.forEach((u, i) => {
    const b = document.createElement('button'); b.dataset.lv = i; b.textContent = u.nazov;
    b.addEventListener('click', () => nastavUroven(i)); $('#lvBtns').appendChild(b);
  });
}

/* text „Čo sa práve deje“ + pruhy fotosyntéza / dýchanie */
let poslDeje = '';
function aktualizujDeje(M) {
  const D = DATA.deje, U = DATA.ui;
  let h;
  if (!M.den) h = D.noc;
  else if (M.Lv <= 0) h = D.tma;
  else {
    h = M.P < 0.01 ? D.stoj : sablona(D.beh, { p: Math.round(M.P * 100) });
    if (M.limit && D.limit[M.limit]) h += ' ' + D.limit[M.limit]; else h += ' ' + D.naplno;
    if (M.nasyt && M.limit !== 'svetlo') h += ' ' + D.nasyt;
    h += ' ' + (M.P > M.R ? D.prevlada : D.dychPrevlada);
  }
  if (S.voda < 20) h += ' ' + D.sucho;
  h += `<span class="ur">${D.uroven[Math.round(S.lvCil)]}</span>`;
  if (h !== poslDeje) { $('#deje').innerHTML = h; poslDeje = h; }
  $('#barP').style.width = Math.round(M.P * 100) + '%'; $('#valP').textContent = Math.round(M.P * 100) + ' %';
  $('#barR').style.width = Math.round(M.R * 100) + '%';
  $('#netto').innerHTML = M.P > M.R ? U.uvolnuje : U.prijima;
  $('#limit').innerHTML = `${U.obmedzuje} <b>${M.limit ? U.limitNazov[M.limit] : U.nic}</b>`;
  // počítadlá
  $('#cO2').textContent = Math.floor(S.o2uv); $('#cGlu').textContent = Math.floor(S.gluk); $('#cO2p').textContent = Math.floor(S.o2pr);
  // stav na úrovni listu / bunky
  const lv = Math.round(S.lvPos), st = $('#chipStav');
  if (lv === 1) { st.className = ''; st.textContent = U.stavB + ' ' + U.prieduchy(S.open); }
  else if (lv === 2) {
    let t = `${U.stavC} ${ikona('co2')} ${CS.invC}/6 ${ikona('voda')} ${CS.invW}/6`, warn = false;
    if (CS.asm > 0) t += ' · ' + U.stavVznika;
    else if (CS.invC >= 6 && CS.invW >= 6 && M.fL <= 0) { t += ' · ' + U.stavSvetloChyba; warn = true; }
    st.innerHTML = t; st.className = warn ? 'warn' : '';
  } else { st.textContent = ''; st.className = ''; }
}

/* =====================================================================
   POROVNANIE, OMYLY (krátke animácie), ZJEDNODUŠENIA
   ===================================================================== */
function vykresliPorovnanie() {
  const P = DATA.porov;
  $('#porovTab').innerHTML = `<thead><tr>${P.hlavicka.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`
    + P.riadky.map(r => `<tr>${r.map(c => `<td>${sIkonami(c)}</td>`).join('')}</tr>`).join('') + `</tbody>`;
}
function vykresliOmyly() {
  const O = DATA.omyly;
  $('#omylyGrid').innerHTML = O.polozky.map(p => `<div><figure><svg id="${p.id}" viewBox="0 0 400 230" role="img" aria-label="${p.fig}"></svg><figcaption>${p.fig}</figcaption></figure>`
    + `<div class="box omyl"><b class="h">${O.omylH}</b>${p.omyl}</div><div class="box pravda"><b class="h">${O.pravdaH}</b>${p.pravda}</div></div>`).join('');
  $('#poznList').innerHTML = DATA.pozn.body.map(b => `<li>${b}</li>`).join('');
}
const tx = (x, y, t, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs || 17}" fill="${o.c || '#e2e8f5'}" text-anchor="${o.a || 'start'}" font-weight="${o.w || 500}">${t}</text>`;
const uz = (k, x, y, m = 1, op = 1) => `<use href="#p-${k}" transform="translate(${r1(x)} ${r1(y)}) scale(${m})"${op < 1 ? ` opacity="${cl(op).toFixed(2)}"` : ''}/>`;
const iskra = (x, y, t, i) => uz('fotosynteza', x, y, .8, .3 + .7 * Math.max(0, Math.sin(t * 3 + i * 1.9)));
const MINI = {
  /* Omyl 1: strom v kvetináči rastie, pôdy neubúda */
  mPoda(t) {
    const T = (t % 12) / 12, g = ez(cl(T / .75)), h = 18 + 92 * g, Mt = DATA.omyly.mini;
    let s = `<path d="M138,168 L262,168 L250,224 L150,224Z" fill="#9a5a3a" stroke="#5e3420" stroke-width="2"/><rect x="141" y="160" width="118" height="10" fill="#4a3322"/>`;
    s += `<path d="M110,160 H290" stroke="#ffd88a" stroke-width="2" stroke-dasharray="6 5"/>` + tx(296, 165, Mt.uroven, { fs: 16, c: '#ffd88a' });
    s += `<path d="M200,162 L200,${r1(162 - h)}" stroke="#7a5233" stroke-width="${r1(3 + 8 * g)}" stroke-linecap="round"/>`
      + `<circle cx="200" cy="${r1(162 - h)}" r="${r1(10 + 42 * g)}" fill="#3f9a3c" stroke="#1f4d1f" stroke-width="2"/>`;
    for (let i = 0; i < 5; i++) {   // CO₂ zo vzduchu do koruny
      const ph = (t * .32 + i / 5) % 1, sx = i % 2 ? 380 : 20, sy = 30 + i * 22;
      s += uz('co2', lerp(sx, 200, ph), lerp(sy, 162 - h, ph), 1, Math.min(1, (1 - ph) * 4));
    }
    for (let i = 0; i < 2; i++) { const ph = (t * .5 + i / 2) % 1; s += uz('voda', 165 + i * 70, lerp(100, 160, ph), 1, Math.min(1, (1 - ph) * 3)); }
    s += tx(14, 26, T < .12 ? Mt.zaciatok : T > .75 ? Mt.neskor : Mt.rastie, { w: 700, c: '#ffd88a' });
    if (T > .75) s += tx(200, 212, Mt.takmer, { a: 'middle', fs: 16, c: '#fff' });
    return s;
  },
  /* Omyl 2: deň a noc – fotosyntéza len cez deň, dýchanie stále */
  mDych(t) {
    const ph = (t % 10) / 10, f = cl((0.5 + 0.5 * Math.cos(2 * PI * (ph - .25)) - .3) / .4), den = f > .5, Mt = DATA.omyly.mini;
    let s = `<rect width="400" height="185" rx="10" fill="${mix('#060b1c', '#2f6fb3', f)}"/><rect y="185" width="400" height="45" fill="#3a2818"/>`;
    s += f > .05 ? `<circle cx="40" cy="40" r="18" fill="#ffe27a" opacity="${f.toFixed(2)}"/>` : '';
    s += f < .95 ? `<circle cx="40" cy="40" r="14" fill="#e8ecf5" opacity="${(1 - f).toFixed(2)}"/>` : '';
    s += tx(70, 46, den ? Mt.den : Mt.noc, { w: 700, c: den ? '#1a0e02' : '#e2e8f5' });
    s += `<path d="M120,185 Q118,140 122,95" stroke="#56a844" stroke-width="7" fill="none"/><ellipse cx="92" cy="120" rx="32" ry="11" transform="rotate(-20 92 120)" fill="#3f9a3c"/><ellipse cx="150" cy="105" rx="32" ry="11" transform="rotate(20 150 105)" fill="#3f9a3c"/>`;
    for (let i = 0; i < 3; i++) {   // výmena kyslíka navonok
      const q = (t * .45 + i / 3) % 1, a = den ? q : 1 - q;
      s += uz('kyslik', lerp(150, 200 + i * 6, a), lerp(110, 40 + i * 30, a), 1, Math.min(1, q * 4, (1 - q) * 4));
    }
    s += `<rect x="226" y="72" width="164" height="96" rx="10" fill="rgba(6,10,20,.75)"/>`;
    s += uz('fotosynteza', 244, 98, 1, den ? 1 : .25) + tx(260, 96, Mt.foto, { fs: 16, w: 700 }) + tx(260, 114, den ? Mt.bezi : Mt.stoji, { fs: 16, c: den ? '#7fdc8f' : '#ff7a6b' });
    s += `<g transform="translate(244 146) rotate(${r1((t * 110) % 360)})"><use href="#p-dychanie"/></g>` + tx(260, 144, Mt.dych, { fs: 16, w: 700 }) + tx(260, 162, Mt.stale, { fs: 16, c: '#7fdc8f' });
    return s;
  },
  /* Omyl 3: fotosyntéza vo všetkých zelených častiach */
  mZelene(t) {
    const Mt = DATA.omyly.mini;
    let s = `<rect y="178" width="400" height="52" fill="#3a2818"/><path d="M0,178 H400" stroke="#5c8a3a" stroke-width="3"/>`;
    s += `<path d="M110,178 L110,40" stroke="#56a844" stroke-width="10"/><ellipse cx="70" cy="110" rx="40" ry="13" transform="rotate(-20 70 110)" fill="#3f9a3c"/><ellipse cx="150" cy="80" rx="40" ry="13" transform="rotate(20 150 80)" fill="#3f9a3c"/>`;
    s += `<path d="M110,178 L108,214 M110,186 L88,210 M110,190 L132,214" stroke="#e2cfa2" stroke-width="3.5" fill="none"/>`;
    [[70, 110], [150, 80], [110, 150], [110, 120], [110, 62]].forEach(([x, y], i) => s += iskra(x, y, t, i));
    s += `<rect x="285" y="70" width="44" height="108" rx="22" fill="#4a9a4a" stroke="#1f4d1f" stroke-width="2"/><rect x="255" y="110" width="30" height="16" rx="8" fill="#4a9a4a"/><rect x="255" y="88" width="16" height="38" rx="8" fill="#4a9a4a"/>`;
    s += `<path d="M300,74 V176 M314,74 V176" stroke="#2f6b28" stroke-width="1.5"/>`;
    [[307, 95], [307, 140], [262, 100]].forEach(([x, y], i) => s += iskra(x, y, t, i + 5));
    s += lab(118, 166, Mt.stonka) + lab(140, 222, Mt.koren) + lab(306, 52, Mt.kaktus, 'middle') + lab(40, 70, Mt.list);
    return s;
  },
  /* Omyl 4: kyslík je vedľajší produkt, časť spotrebuje rastlina sama */
  mKyslik(t) {
    const Mt = DATA.omyly.mini;
    let s = `<ellipse cx="120" cy="120" rx="100" ry="40" transform="rotate(-10 120 120)" fill="#3f9a3c" stroke="#1f4d1f" stroke-width="2"/><path d="M28,135 L212,103" stroke="#bfe6a0" stroke-width="2"/>`;
    s += `<g transform="translate(110 132) rotate(${r1((t * 110) % 360)})"><use href="#p-dychanie"/></g>`;
    for (let i = 0; i < 8; i++) {
      const q = (t * .3 + i / 8) % 1, x0 = 70 + (i * 37) % 110, y0 = 110 + (i * 13) % 20;
      if (i % 4 === 0) s += uz('kyslik', lerp(x0, 110, q), lerp(y0, 132, q), 1, Math.min(1, (1 - q) * 3));
      else s += uz('kyslik', lerp(x0, 380, q), lerp(y0, 40 + (i * 23) % 150, q), 1, Math.min(1, q * 5, (1 - q) * 3));
    }
    s += lab(392, 214, Mt.vedl, 'end') + lab(18, 196, Mt.sebe);
    return s;
  }
};
const VIDNO = {};

/* =====================================================================
   KVÍZ
   ===================================================================== */
function kviz() {
  const K = DATA.kviz, box = $('#kvizBox'); box.innerHTML = ''; $('#kvizVysl').textContent = '';
  let skore = 0, hotovo = 0; const n = K.otazky.length;
  const koniec = () => { if (hotovo === n) $('#kvizVysl').textContent = sablona(K.vysledok, { s: skore, n }); };
  K.otazky.forEach(q => {
    const div = document.createElement('div'); div.className = 'otazka';
    div.innerHTML = `<div class="q">${q.q}</div>`;
    const fb = document.createElement('div'); fb.className = 'fb';
    if (q.typ === 'triedenie') {   // priradiť látky k vstupom a výstupom
      const volby = {}, riadky = [];
      q.polozky.forEach(([l, nazov, ok]) => {
        const r = document.createElement('div'); r.className = 'triedRow';
        r.innerHTML = `<span class="nm">${ikona(l)}${nazov}</span>`;
        const bt = {};
        for (const v of ['vstup', 'vystup']) {
          const b = document.createElement('button'); b.textContent = q[v]; bt[v] = b;
          b.addEventListener('click', () => {
            if (div.dataset.hotovo) return;
            volby[l] = v; bt.vstup.classList.toggle('vyb', v === 'vstup'); bt.vystup.classList.toggle('vyb', v === 'vystup');
            if (Object.keys(volby).length === q.polozky.length) {   // všetko priradené → vyhodnotiť
              div.dataset.hotovo = 1; hotovo++;
              let vsetko = true;
              riadky.forEach(([ll, okk, btt]) => {
                const dobre = volby[ll] === okk; if (!dobre) vsetko = false;
                btt[volby[ll]].classList.remove('vyb'); btt[volby[ll]].classList.add(dobre ? 'ok' : 'zle'); btt[okk].classList.add('ok');
                btt.vstup.disabled = btt.vystup.disabled = true;
              });
              if (vsetko) skore++;
              fb.className = 'fb ' + (vsetko ? 'ok' : 'zle'); fb.innerHTML = `<b>${vsetko ? K.spravne : K.nespravne}</b> ${q.vysvetlenie}`;
              koniec();
            }
          });
          r.appendChild(b);
        }
        riadky.push([l, ok, bt]); div.appendChild(r);
      });
    } else {
      const opts = document.createElement('div'); opts.className = 'moznosti';
      const poradie = q.moznosti.map((_, i) => i).sort(() => R() - .5), tlac = [];
      poradie.forEach(j => {
        const b = document.createElement('button'); b.textContent = q.moznosti[j]; tlac[j] = b;
        b.addEventListener('click', () => {
          if (div.dataset.hotovo) return;
          div.dataset.hotovo = 1; hotovo++;
          const ok = j === q.spravna; if (ok) skore++;
          b.classList.add(ok ? 'ok' : 'zle'); tlac[q.spravna].classList.add('ok');
          [...opts.children].forEach(x => x.disabled = true);
          fb.className = 'fb ' + (ok ? 'ok' : 'zle'); fb.innerHTML = `<b>${ok ? K.spravne : K.nespravne}</b> ${q.vysvetlenie}`;
          koniec();
        });
        opts.appendChild(b);
      });
      div.appendChild(opts);
    }
    div.appendChild(fb); box.appendChild(div);
  });
}
$('#kvizZnova').addEventListener('click', kviz);

/* =====================================================================
   TEXTY Z OBJEKTU DATA → do stránky
   ===================================================================== */
function vyplnTexty() {
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = el.dataset.t.split('.').reduce((o, k) => o == null ? o : o[k], DATA);
    if (typeof v === 'string') el.innerHTML = v;
  });
  const U = DATA.ui;
  $('#icO2').innerHTML = ikona('kyslik') + U.pocO2; $('#icGlu').innerHTML = ikona('glukoza') + U.pocGlu; $('#icO2p').innerHTML = ikona('dychanie') + U.pocO2p;
}

/* =====================================================================
   ŠTART A HLAVNÁ SLUČKA (requestAnimationFrame, časovanie podľa skutočného času)
   ===================================================================== */
vytvorZnacky();
vyplnTexty();
vykresliRovnicu();
vykresliLegendu();
vykresliPojmy();
vykresliPorovnanie();
vykresliOmyly();
vytvorUrovneTlacidla();
kviz();
nastavDen(true);
nastavPlay();
popisSlidera();
nastavUroven(0);
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(e => VIDNO[e.target.id] = e.isIntersecting));
  Object.keys(MINI).forEach(id => { const el = document.getElementById(id); if (el) io.observe(el); });
} else Object.keys(MINI).forEach(id => VIDNO[id] = true);

let posledny = performance.now(), realny = 0, dejeCas = 0;
function snimka(now) {
  const dtR = Math.min(0.1, Math.max(0, (now - posledny) / 1000)); posledny = now; realny += dtR;
  const dt = S.beh ? dtR * S.rychl : 0;      // čas animácie (zastaví sa pri pauze, zrýchli posuvníkom)
  S.t += dt;
  const M = model();
  S.open += (M.openCiel - S.open) * Math.min(1, dt * 1.5);   // prieduchy sa otvárajú/zatvárajú postupne
  // počítadlá: 1 glukóza ↔ 6 O₂ (ako v rovnici); dýchanie kyslík spotrebúva
  S.gluk += M.P * dt;
  const netto = 6 * (M.P - M.R) * dt;
  if (netto > 0) S.o2uv += netto; else S.o2pr -= netto;
  // plynulé priblíženie (beží v skutočnom čase, aj počas pauzy)
  if (S.lvPos !== S.lvCil) {
    const smer = Math.sign(S.lvCil - S.lvPos), v = 0.9 * Math.max(1, Math.abs(S.lvCil - S.lvPos));
    S.lvPos += smer * dtR * v;
    if ((S.lvCil - S.lvPos) * smer <= 0) S.lvPos = S.lvCil;
  }
  const vid = viditelne();
  for (const i of vid) {
    if (S.dirty[i]) { LV[i].st.innerHTML = STAT[i](M); oznacStatic(i); S.dirty[i] = false; }
    if (dt > 0) KROK[i](dt, M);
    LV[i].dy.innerHTML = DYN[i](M);
  }
  transformuj(vid);
  if (S.rovFlash) {   // pri vzniku glukózy v bunke blikne šípka v rovnici
    S.rovFlash = false;
    document.querySelectorAll('.op.sipka').forEach(el => { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); });
  }
  if (tipCas && now > tipCas) { tipCas = 0; skryTip(); }
  dejeCas -= dtR;
  if (dejeCas <= 0) { dejeCas = 0.2; aktualizujDeje(M); }
  for (const id in MINI) if (VIDNO[id]) { const el = document.getElementById(id); if (el) el.innerHTML = MINI[id](realny); }
  requestAnimationFrame(snimka);
}
requestAnimationFrame(snimka);
</script>
