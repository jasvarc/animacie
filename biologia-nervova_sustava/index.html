/* =====================================================================
   ČASŤ 2 – SPOLOČNÉ KOMPONENTY: prieskum obrázka, krokovač, hra s voľbou
   ===================================================================== */
// body lomenej čiary: "x,y x,y" → [[x, y], …]
const bodyCesty = el => el.getAttribute('points').trim().split(/\s+/).map(p => p.split(',').map(Number));
// bod na lomenej čiare v pomere u ∈ [0, 1] (podľa dĺžky)
function naCeste(body, u) {
  const d = []; let spolu = 0;
  for (let i = 1; i < body.length; i++) { const l = Math.hypot(body[i][0] - body[i - 1][0], body[i][1] - body[i - 1][1]); d.push(l); spolu += l; }
  let zost = Math.max(0, Math.min(1, u)) * spolu;
  for (let i = 0; i < d.length; i++) {
    if (zost <= d[i] || i === d.length - 1) { const t = d[i] ? Math.min(1, zost / d[i]) : 1; return [body[i][0] + (body[i + 1][0] - body[i][0]) * t, body[i][1] + (body[i + 1][1] - body[i][1]) * t]; }
    zost -= d[i];
  }
  return body[0];
}
// obrázok s časťami [data-c] + tlačidlá + popis; kresli(vybrana) vráti SVG, polozky [{ id, nazov, popis }]
function prieskum(obr, tl, info, polozky, kresli, uvod) {
  tl.innerHTML = polozky.map(p => `<button type="button" data-c="${p.id}" aria-pressed="false">${p.nazov}</button>`).join('');
  const zvol = id => {
    obr.innerHTML = kresli(id);
    $$('button', tl).forEach(b => { const on = b.dataset.c === id; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    const p = polozky.find(x => x.id === id);
    info.innerHTML = p ? `<span class="nazovCasti"><b>${velke(p.nazov)}</b></span><br>${p.popis}` : uvod;
  };
  tl.onclick = e => { const b = e.target.closest('button[data-c]'); if (b) zvol(b.dataset.c); };
  obr.onclick = e => { const g = e.target.closest('[data-c]'); if (g) zvol(g.dataset.c); };
  zvol(null);
  return zvol;
}
/* krokovaná animácia vzruchu po cestách v SVG: prvky [data-cesta] (lomené čiary aj tvary),
   o: { obal, kroky [{ cesta, t }], text, trvanie: () => ms, hrajTl, uvod, naKrok(i) } */
function krokovac(o) {
  const n = o.kroky.length, S = { i: 0, hraj: null, zrus: null };
  const viditelne = () => o.obal.getClientRects().length > 0;
  function ukaz(i) {
    S.i = Math.max(0, Math.min(n, i));
    const svg = $('svg', o.obal), akt = S.i ? o.kroky[S.i - 1].cesta : null;
    const bolo = new Set(o.kroky.slice(0, Math.max(0, S.i - 1)).map(k => k.cesta));
    $$('[data-cesta]', svg).forEach(el => { const c = el.dataset.cesta; el.classList.toggle('akt', c === akt); el.classList.toggle('bol', c !== akt && bolo.has(c)); });
    if (S.zrus) { S.zrus(); S.zrus = null; }
    const bod = $('.bodCesta', svg), cesta = akt ? $(`polyline[data-cesta="${akt}"]`, svg) : null;
    if (bod) {
      if (cesta) {
        const body = bodyCesty(cesta), posun = u => { const [x, y] = naCeste(body, u); bod.setAttribute('cx', x); bod.setAttribute('cy', y); };
        bod.style.opacity = 1; posun(0);
        S.zrus = animuj(o.trvanie() * 0.7, posun);       // pri obmedzenom pohybe skočí rovno na koniec
      } else bod.style.opacity = 0;
    }
    if (o.text) o.text.innerHTML = S.i ? `<span class="kc">${vypln(NS.ui.krok, { i: S.i, n })}</span>${o.kroky[S.i - 1].t}` : (o.uvod || '');
    if (o.naKrok) o.naKrok(S.i);
  }
  function zastav() { clearTimeout(S.hraj); S.hraj = null; if (o.hrajTl) o.hrajTl.textContent = NS.ui.prehraj; }
  function hraj() {
    zastav();
    if (S.i >= n) ukaz(0);
    if (o.hrajTl) o.hrajTl.textContent = NS.ui.zastav;
    const dalej = () => { if (S.i >= n) { zastav(); return; } ukaz(S.i + 1); S.hraj = setTimeout(dalej, o.trvanie()); };
    S.hraj = setTimeout(dalej, S.i === 0 ? 0 : o.trvanie());
  }
  return { n, stav: S, ukaz, hraj, zastav, viditelne, prepni: () => S.hraj ? zastav() : hraj(), odZaciatku: () => { zastav(); ukaz(0); hraj(); } };
}
// hra: položky po jednej, pri každej tlačidlá s možnosťami; polozky [{ t, ok, vysv }], moznosti { id: text }
function dvojHra(el, polozky, moznosti, o = {}) {      // o.obr(polozka) – obrázok nad otázkou (od časti 4)
  const T = NS.ui.hra, n = polozky.length;
  const H = { poradie: [], i: 0, body: 0, prvy: true, hotovo: false, koniec: false };
  el.innerHTML = `<p class="kvStav" aria-live="polite"></p>${o.obr ? '<div class="stage dvojObr" aria-hidden="true"></div>' : ''}<p class="dvojT"></p><div class="moznosti"></div><div class="fb" aria-live="polite"></div><div class="tlac"><button type="button" class="primary" hidden></button></div>`;
  const stav = $('.kvStav', el), txt = $('.dvojT', el), moz = $('.moznosti', el), fb = $('.fb', el), dal = $('.tlac button', el);
  const kresliStav = () => stav.textContent = vypln(T.stav, { i: Math.min(H.i + 1, n), n, b: H.body });
  function kolo() {
    H.prvy = true; H.hotovo = false;
    txt.innerHTML = polozky[H.poradie[H.i]].t;
    if (o.obr) $('.dvojObr', el).innerHTML = o.obr(polozky[H.poradie[H.i]]);
    const mz = polozky[H.poradie[H.i]].moznosti || moznosti;      // vlastné možnosti položky (od časti 6)
    moz.innerHTML = Object.keys(mz).map(k => `<button type="button" data-k="${k}">${mz[k]}</button>`).join('');
    fb.className = 'fb'; fb.innerHTML = ''; dal.hidden = true; kresliStav();
  }
  function nova() { H.poradie = zamiesaj(polozky.map((_, i) => i)); H.i = 0; H.body = 0; H.koniec = false; kolo(); }
  function koniec() {
    H.koniec = true; txt.innerHTML = ''; moz.innerHTML = '';
    if (o.obr) $('.dvojObr', el).innerHTML = o.obrKoniec ? o.obrKoniec() : '';
    fb.className = 'fb ok'; fb.innerHTML = `<span class="h">✓ ${vypln(T.koniec, { b: H.body, n })}</span>`;
    dal.textContent = T.znova; dal.hidden = false; dal.focus();
  }
  moz.onclick = e => {
    const b = e.target.closest('button[data-k]'); if (!b || b.disabled || H.hotovo) return;
    const p = polozky[H.poradie[H.i]];
    if (b.dataset.k === p.ok) {
      H.hotovo = true; if (H.prvy) H.body++;
      b.classList.add('ok'); b.textContent = '✓ ' + b.textContent;
      $$('button', moz).forEach(x => { if (x !== b) x.disabled = true; });
      fb.className = 'fb ok'; fb.innerHTML = `<span class="h">✓ ${T.ok}</span> ${p.vysv}`;
      dal.textContent = H.i < n - 1 ? T.dalsia : T.vysledok; dal.hidden = false; dal.focus(); kresliStav();
    } else {
      H.prvy = false; b.classList.add('zle'); b.disabled = true; b.textContent = '✗ ' + b.textContent;
      fb.className = 'fb zle'; fb.innerHTML = `<span class="h">✗ ${T.zle}</span>`;
      const d = $('button:not(:disabled)', moz); if (d) d.focus();
    }
  };
  dal.onclick = () => { if (H.koniec) nova(); else if (H.i < n - 1) { H.i++; kolo(); $('button', moz).focus(); } else koniec(); };
  nova();
  return { H, nova, aktualna: () => polozky[H.poradie[H.i]], odpovedz: k => { const b = $(`button[data-k="${k}"]`, moz); if (b) b.click(); }, dalej: () => dal.click() };
}

/* =====================================================================
   ČASŤ 2 – MODEL: autonómna sústava (posuvník pokoj ↔ pripravenosť)
   ===================================================================== */
Object.assign(MODEL, {
  // x ∈ [0, 100] → pre každý ukazovateľ: uroven 0 … 1 (koľko ho je), stav pokoj / medzi / pripr a text
  autonom(x) {
    const O = NS.obvod, u = Math.max(0, Math.min(100, x)) / 100;
    const stav = x < O.hranice[0] ? 'pokoj' : x < O.hranice[1] ? 'medzi' : 'pripr';
    return O.ukazovatele.map(k => ({ id: k.id, uroven: k.smer > 0 ? u : 1 - u, stav, text: stav === 'pokoj' ? k.pokoj : stav === 'pripr' ? k.pripr : O.stredne }));
  },
  // tlkot srdca na obrázku (len na ukážku)
  srdceHz(x) { const [a, b] = NS.obvod.srdceHz; return a + (b - a) * Math.max(0, Math.min(100, x)) / 100; }
});

/* SPOLOČNÝ KOMPONENT (od časti 3): posuvník rýchlosti záberu (5 stupňov z NS.reflex).

function posuvnikRychlosti(p) {
  const R = NS.reflex, sl = $(`#${p}_rychlost`);

  sl.oninput = () => nastav(sl.value);
  $(`#${p}_pomalsie`).onclick = () => nastav(+sl.value - 1); $(`#${p}_rychlejsie`).onclick = () => nastav(+sl.value + 1);
  $(`#${p}_pomalsie`).setAttribute('aria-label', R.pomalsie); $(`#${p}_rychlejsie`).setAttribute('aria-label', R.rychlejsie);
  nastav(1);
  return () => R.rychlosti[+sl.value - 1];

      fb.innerHTML = Z.zostava.length ? `<span class="h">✓ ${NS.ui.spravne}.</span> ${vypln(R.zoradOk, { x: velke(Z.prik.casti[k]), c })}` : `<span class="h">✓ ${vypln(R.zoradHotovo, { c: Z.chyby })}</span>`;
      const ch = $('.chip', chipy); (ch || $('#rf_zoradNovy')).focus();
      return true;
    }
    Z.chyby++; kresli();
    fb.className = 'fb zle'; fb.innerHTML = `<span class="h">✗ ${vypln(R.zoradZle, { c })}</span>`;
    return false;
  }
  function novy(id) {
    Z.prik = id ? R.priklady.find(p => p.id === id) : vyber(R.priklady.filter(p => p !== Z.prik));
    Z.umiestnene = {}; Z.vybrany = null; Z.chyby = 0;
    do Z.zostava = zamiesaj([0, 1, 2, 3, 4]); while (Z.zostava.every((x, i) => x === i));
    $('#rf_zoradPrik').innerHTML = vypln(R.zoradPrik, { p: Z.prik.nazov });
    fb.className = 'fb'; fb.innerHTML = ''; kresli();
  }
  chipy.onclick = e => {
    const b = e.target.closest('.chip'); if (!b || performance.now() - Z.tah.poTahu < 400) return;
    const k = +b.dataset.k; Z.vybrany = Z.vybrany === k ? null : k; kresli();
    const nb = $(`.chip[data-k="${k}"]`, chipy); if (nb) nb.focus();
  };
  sloty.onclick = e => {
    const s = e.target.closest('.rSlot'); if (!s || Z.umiestnene[s.dataset.i] !== undefined) return;
    if (Z.vybrany === null) { fb.className = 'fb'; fb.textContent = R.zoradVyber; return; }
    umiestni(Z.vybrany, +s.dataset.i);
  };
  Z.tah = tahanie(chipy, '#rf_oblukSloty .rSlot', (b, s) => umiestni(+b.dataset.k, +s.dataset.i), s => Z.umiestnene[s.dataset.i] === undefined);
  $('#rf_zoradNovy').onclick = () => novy();
  REFLEX.zoradNovy = novy; REFLEX.zoradUmiestni = umiestni;
  novy();
}

const MIECHA = {};

  vytvorRezim('miecha');

  }

    S.vybrany = null;

      S.hotove[i] = true; kresli(); signal(k);
      const hotovo = Object.keys(S.hotove).length === M.situacie.length;
      fb.className = 'fb ok'; fb.innerHTML = hotovo ? `<span class="h">✓ ${vypln(M.smerHotovo, { c: S.chyby })}</span>` : `<span class="h">✓ ${vypln(M.smerOk, { v: x.vysv })}</span>`;
      return true;
    }

    fb.className = 'fb zle'; fb.innerHTML = `<span class="h">✗ ${M.smerZle}</span>`;
    return false;
  }
  function nova() { S.hotove = {}; S.vybrany = null; S.chyby = 0; fb.className = 'fb'; fb.innerHTML = ''; kresli(); }
  sip.onclick = e => {
    const b = e.target.closest('.chip'); if (!b || performance.now() - S.tah.poTahu < 400) return;

  };

    const s = e.target.closest('.rSlot'); if (!s || S.hotove[s.dataset.i]) return;

  $('#mi_smerZnova').onclick = nova;

}

// tlkot srdca: plynulé zväčšenie a zmenšenie (nie blikanie), frekvencia podľa posuvníka, najviac 2,2 Hz
function srdceSlucka(now) {
  requestAnimationFrame(srdceSlucka);
  const g = $('#ob_srdce'); if (!g || !g.getClientRects().length) { SRDCE.posl = null; return; }
  const dt = SRDCE.posl === null ? 0 : Math.min(0.1, (now - SRDCE.posl) / 1000); SRDCE.posl = now;
  SRDCE.faza = (SRDCE.faza + dt * MODEL.srdceHz(OBVOD.x)) % 1;
  const p = Math.pow(Math.max(0, Math.sin(SRDCE.faza * Math.PI * 2)), 6);
  g.setAttribute('transform', `translate(110 96) scale(${(1.7 * (1 + 0.1 * p)).toFixed(3)})`);
}

Object.assign(MODEL, {

  }
});

  const zap = id => t.odpovede.find(x => x.id === id).zap;
  let s = `<svg class="hyp obr" viewBox="0 0 300 300" aria-hidden="true">`;
  s += kon('M112 112 L84 186 L78 252', 22) + kon('M188 112 L216 186 L222 252', 22);
  s += `<path class="tv" d="M112 102 L188 102 Q200 106 198 126 L192 262 L108 262 L102 126 Q100 106 112 102 Z"/><circle class="tv" cx="150" cy="58" r="34"/>`;
  s += `<circle cx="150" cy="62" r="7" fill="#ffd88a"/>`;     // hypotalamus
  const sirka = zap('rozsirenie') ? 7 : zap('zuzenie') ? 1.5 : 3.5;
  s += `<path class="ceva" stroke-width="${sirka}" d="M86 140 C82 170 90 200 80 240 M214 140 C218 170 210 200 220 240 M130 130 C138 170 124 210 134 250"/>`;
  if (zap('potenie')) s += [[112, 46], [192, 64], [128, 160], [176, 190], [86, 214], [216, 214]].map(([x, y]) => `<path class="kvapka" transform="translate(${x} ${y})" d="M0 -11 C7 -2 8 4 0 9 C-8 4 -7 -2 0 -11 Z"/>`).join('');
  if (zap('trasenie')) s += `<path class="tras" d="M56 150 l-10 7 l10 7 l-10 7 l10 7 M244 150 l10 7 l-10 7 l10 7 l-10 7 M92 280 l8 -8 l8 8 l8 -8 l8 8 M180 280 l8 -8 l8 8 l8 -8 l8 8"/>`;
  if (zap('husia')) s += [[90, 160], [96, 176], [84, 196], [210, 160], [204, 178], [216, 198]].map(([x, y]) => `<circle class="husia" cx="${x}" cy="${y}" r="2.5"/>`).join('');
  return s + '</svg>';
}

  const L = NS.mcesta.lbl;

  s += `<ellipse data-cesta="talamus" class="talamus" cx="264" cy="182" rx="26" ry="15"/><text x="298" y="214" font-size="17">${L.talamus}</text>`;
  s += kon('M276 400 L180 412 L96 432', 22) + `<circle class="tv" cx="78" cy="438" r="14"/>`;
  s += `<ellipse data-cesta="sval" class="tvarC sval" cx="172" cy="412" rx="30" ry="10" transform="rotate(-6 172 412)"/>`;
  s += pl('dotyk', 'c-rec', '58,446 72,440') + pl('miecha', 'c-dostr', '72,440 180,416 270,404 282,396 284,312') + pl('predlzena', 'c-dostr', '284,312 280,262') +
    pl('talamus', 'c-dostr', '280,262 266,186') + pl('temenny', 'c-dostr', '266,186 246,140 240,112') + pl('celovy', 'c-vloz', '240,112 140,120') +
    pl('pohybova', 'c-vloz', '140,120 226,104') + pl('dole', 'c-odstr', '226,104 214,170 272,238 290,312 290,398') + pl('sval', 'c-odstr', '290,398 202,408 178,412');

Object.assign(OBR, {
  vrstvy() { return { svg: lebkaSVG(), popis: NS.lebka.popisVrstvy }; },
  energia() {
    const E = NS.lebka.energia;
    const pas = (y, t, podiel, lbl) => `<text x="20" y="${y - 12}" class="m" font-size="18">${t}</text><rect x="20" y="${y}" width="400" height="34" rx="6" fill="rgba(255,255,255,.08)" stroke="#6a7aa6" stroke-width="2"/>` +
      `<rect x="20" y="${y}" width="${400 * podiel}" height="34" rx="6" fill="#f3b453"/><text x="${28 + 400 * podiel}" y="${y + 24}" class="g bold">${lbl}</text>`;
    const g = pas(40, E.hm, 0.02, E.mozogHm) + pas(130, E.en, 0.2, E.mozogEn) + `<text x="20" y="206" class="m" font-size="17">${E.pozn}</text>`;

  mozogMedzi() { return { svg: mozogRezSVG({ zvyrazni: 'medzi', detail: true }), popis: NS.mozog.popisMedzi }; },
  hemisfery() { return { svg: hemisferySVG({ bezTela: true, mozolnate: true }), popis: NS.kora.popisHem }; },
  laloky() { return { svg: koraSVG({ popisy: true }), popis: NS.kora.popisLaloky }; },
  rec() { return { svg: koraSVG({ popisy: true, oblasti: true, rec: true }), popis: NS.kora.popisRec }; },
  skrizenie() { return { svg: hemisferySVG({ volba: 'rukaP' }), popis: NS.kora.popisSkriz }; },

    return { svg: `<svg class="obr" viewBox="0 0 420 300" aria-hidden="true">${g}</svg>`, popis: NS.hypo.popisSchema };

  teplomer() {
    const S = NS.hypo.schema;

   ===================================================================== */
const HYPO = { t: 21 };
function initHypo() {
  vytvorRezim('hypotalamus');
  const H = NS.hypo, sl = $('#hy_t');
  sl.min = H.min; sl.max = H.max;
  $('#hy_menej').setAttribute('aria-label', H.menej); $('#hy_viac').setAttribute('aria-label', H.viac);
  const nastav = t => {
    t = Math.max(H.min, Math.min(H.max, Math.round(+t || 0))); HYPO.t = t; sl.value = t;
    $('#hy_tHod').textContent = t + ' °C';
    const m = MODEL.termo(t), S = H.schema;
    $('#hy_obr').innerHTML = hypoSVG(m); $('#hy_obr').setAttribute('aria-label', H.popisTelo);
    const zap = H.odpovede.filter(o => m.odpovede.find(x => x.id === o.id).zap);
    $('#hy_schema').innerHTML =
      `<span class="st"><b>1. ${S.meranie}</b><br>${S.meranieT}. ${vypln(H.vonku, { t })}</span><span class="sip" aria-hidden="true">↓</span>` +
      `<span class="st centr"><b>2. ${S.hypo}</b><br>${S.hypoT}.<br><span class="hyStav">${H.stavy[m.stav]}</span></span><span class="sip" aria-hidden="true">↓</span>` +
      `<span class="st"><b>3. ${S.odpoved}</b><ul class="odpovede">` +
      H.odpovede.map(o => { const z = zap.includes(o); return `<li class="${z ? 'zap' : ''}" data-o="${o.id}"><span class="st">${z ? H.zap : H.vyp}</span>${o.nazov}</li>`; }).join('') +
      `</ul>${zap.length ? '' : `<p class="muted" style="margin:6px 0 0">${H.nic}</p>`}</span>`;
  };
  sl.oninput = () => nastav(sl.value);
  $('#hy_menej').onclick = () => nastav(HYPO.t - 1); $('#hy_viac').onclick = () => nastav(HYPO.t + 1);
  HYPO.nastav = nastav;
  nastav(H.start);
}

/* =====================================================================
   ČASŤ 4 – SPOLOČNÉ: schéma reťaze (zvislé políčka so šípkami)
   C [{ nazov, popis }], stred – index zvýrazneného políčka (napr. centrum)
   ===================================================================== */
function schemaSVG(C, stred = -1) {
  let g = '';
  C.forEach((c, i) => {
    const y = 8 + i * 86;
    g += `<rect x="16" y="${y}" width="368" height="62" rx="12" fill="${i === stred ? 'rgba(243,180,83,.14)' : 'rgba(255,255,255,.04)'}" stroke="${i === stred ? '#f3b453' : '#6a7aa6'}" stroke-width="2"/>`;
    g += `<text x="34" y="${y + 27}" class="bold"><tspan class="g">${i + 1}</tspan>  ${c.nazov}</text><text x="34" y="${y + 51}" class="m" font-size="17">${c.popis}</text>`;
    if (i < C.length - 1) g += sipkaV(200, y + 62, y + 86);
  });
  return `<svg class="obr" viewBox="0 0 400 ${C.length * 86 - 8}" aria-hidden="true">${g}</svg>`;
}

/* =====================================================================
   ČASŤ 4 – MODEL: zrenica, akomodácia, lúčový model oka (Zjednodušený model)
   ===================================================================== */
Object.assign(MODEL, {
  // osvetlenie 0 … 100 → polomer zrenice na obrázku (s rastúcim svetlom nikdy nerastie)
  zrenica(x) { const [rMax, rMin] = NS.okoR.zrenicaR, u = Math.max(0, Math.min(100, x)) / 100; return rMax - (rMax - rMin) * u; },
  // vzdialenosť predmetu 0 (blízko) … 100 (ďaleko) → hrúbka šošovky a jej zakrivenie (abstraktne)
  akomodacia(d) {
    const [hB, hD] = NS.okoR.sosovkaR, u = Math.max(0, Math.min(100, d)) / 100, hrubka = hB - (hB - hD) * u;
    return { hrubka, zakrivenie: hrubka / hD, stav: d < 34 ? 'blizko' : d < 67 ? 'stred' : 'daleko' };
  },
  // lúčový model: ohnisko f = 1 / (1/24 + sila/1000); posun = f − dĺžka (záporný = pred sietnicou)
  ohnisko(dlzka, sila = 0) { const f = 1 / (1 / NS.chyby.normalna + sila / 1000); return { f, posun: f - dlzka }; },
  // sila šošovky, ktorá vráti ohnisko na sietnicu
  spravnaSila(dlzka) { return (1 / dlzka - 1 / NS.chyby.normalna) * 1000; }
});

/* =====================================================================

// rez okom (svetlo prichádza zľava); o: { zvyrazni: id | [id], cisla, luce }

  ciliarny: [214, 244], sklovec: [320, 180], zlta: [466, 150, 423, 180], slepa: [470, 206, 419, 222], nerv: [520, 246] };
function okoSVG(o = {}) {

  s += g('sklovec', `<circle class="o-sklovec" cx="300" cy="180" r="118"/>`);
  s += g('cievovka', `<path class="hit" d="M186.6 114.5 A131 131 0 1 1 186.6 245.5"/><path class="o-cievovka" d="M186.6 114.5 A131 131 0 1 1 186.6 245.5"/>`);
  s += g('sietnica', `<path class="hit" d="M205.8 100.9 A123 123 0 1 1 205.8 259.1"/><path class="o-sietnica" d="M205.8 100.9 A123 123 0 1 1 205.8 259.1"/>`);
  s += g('bielko', `<path class="hit" d="M178.8 110 A140 140 0 1 1 178.8 250"/><path class="o-bielko" d="M178.8 110 A140 140 0 1 1 178.8 250"/>`);
  s += g('rohovka', `<path class="hit" d="M178.8 110 Q120 180 178.8 250"/><path class="o-rohovka" d="M178.8 110 Q120 180 178.8 250"/>`);
  s += g('ciliarny', `<line class="o-vlakna" x1="218" y1="124" x2="228" y2="144"/><line class="o-vlakna" x1="218" y1="236" x2="228" y2="216"/><ellipse class="o-ciliarny" cx="214" cy="118" rx="11" ry="8"/><ellipse class="o-ciliarny" cx="214" cy="242" rx="11" ry="8"/>`);
  s += g('duhovka', `<path class="hit" d="M200 128 L200 166 M200 194 L200 232"/><path class="o-duhovka" d="M200 128 L200 166 M200 194 L200 232"/>`);
  s += g('sosovka', `<ellipse class="o-sosovka" cx="228" cy="180" rx="16" ry="40"/>`);
  s += g('zrenica', `<rect class="o-zrenica" x="193" y="166" width="14" height="28" rx="3"/>`);
  s += g('zlta', `<circle class="hitF" cx="423" cy="180" r="14"/><circle class="o-zlta" cx="423" cy="180" r="7"/>`);
  s += g('slepa', `<circle class="hitF" cx="419" cy="222" r="14"/><circle class="o-slepa" cx="419" cy="222" r="7"/>`);

// oko spredu; r – polomer zrenice, o: { pomocne }
function okoPredSVG(r = 18, o = {}) {

// akomodácia: predmet vľavo, oko vpravo; d = vzdialenosť 0 … 100
function akomodSVG(d) {
  const a = MODEL.akomodacia(d), x0 = 300 - 260 * Math.max(0, Math.min(100, d)) / 100, L = NS.okoR.lbl;
  const sval = 6 + 8 * (1 - d / 100);
  let s = `<svg class="obr" viewBox="0 0 560 230" aria-hidden="true">`;
  s += `<circle cx="450" cy="110" r="92" fill="rgba(142,197,255,.08)" stroke="#e8eef8" stroke-width="6"/><path d="M528 60 A92 92 0 0 1 528 160" fill="none" stroke="#ff9fb0" stroke-width="5"/>`;
  s += `<ellipse cx="370" cy="110" rx="${a.hrubka.toFixed(1)}" ry="36" fill="rgba(255,255,255,.5)" stroke="#e2e8f5" stroke-width="2"/>`;
  s += `<ellipse cx="370" cy="66" rx="${sval.toFixed(1)}" ry="7" fill="#c97a5a"/><ellipse cx="370" cy="154" rx="${sval.toFixed(1)}" ry="7" fill="#c97a5a"/>`;
  // predmet (šípka) a lúče z jeho vrcholu, ktoré sa zbiehajú na sietnici – obraz je prevrátený
  s += `<line x1="${x0}" y1="110" x2="${x0}" y2="64" stroke="#7fdc8f" stroke-width="6"/><path d="M${x0 - 10} 70 L${x0} 52 L${x0 + 10} 70 Z" fill="#7fdc8f"/>`;
  s += `<polyline class="luc" points="${x0},56 370,80 538,140"/><polyline class="luc" points="${x0},56 370,140 538,140"/>`;
  s += `<line x1="538" y1="110" x2="538" y2="146" stroke="#7fdc8f" stroke-width="5"/><path d="M531 140 L538 154 L545 140 Z" fill="#7fdc8f"/>`;
  s += `<line x1="20" y1="110" x2="540" y2="110" stroke="rgba(163,173,198,.4)" stroke-dasharray="4 6"/>`;
  s += `<text x="20" y="222" class="m" font-size="17">${L.blizko} ◀ ▶ ${L.daleko}</text><text x="556" y="222" text-anchor="end" class="m" font-size="17">${L.obraz}</text>`;
  return s + '</svg>';
}
// lúčový diagram zrakovej chyby; dlzka 21 … 27, sila (jednotky modelu), okuliare
function chybySVG(dlzka, sila = 0, okuliare = false) {
  const C = NS.chyby, k = 12, xs = 160, ret = xs + dlzka * k, m = MODEL.ohnisko(dlzka, okuliare ? sila : 0), xf = xs + m.f * k, y0 = 120;
  let s = `<svg class="obr" viewBox="0 0 560 240" aria-hidden="true">`;
  s += `<ellipse cx="${(146 + ret) / 2}" cy="${y0}" rx="${(ret - 146) / 2}" ry="86" fill="rgba(142,197,255,.07)" stroke="#e8eef8" stroke-width="4"/>`;
  s += `<path d="M${ret - 6} ${y0 - 60} Q${ret + 6} ${y0} ${ret - 6} ${y0 + 60}" fill="none" stroke="#ff9fb0" stroke-width="6"/><text x="${ret - 6}" y="228" text-anchor="middle" class="m" font-size="16">${C.lbl.sietnica}</text>`;
  s += `<ellipse cx="${xs}" cy="${y0}" rx="9" ry="44" fill="rgba(255,255,255,.5)" stroke="#e2e8f5" stroke-width="2"/>`;
  if (okuliare) {
    const typ = sila < -0.05 ? 'r' : sila > 0.05 ? 's' : '0';
    s += typ === 's' ? `<ellipse cx="70" cy="${y0}" rx="12" ry="56" fill="rgba(127,220,143,.3)" stroke="#7fdc8f" stroke-width="3"/>`
      : typ === 'r' ? `<path d="M58 ${y0 - 56} Q74 ${y0} 58 ${y0 + 56} L84 ${y0 + 56} Q68 ${y0} 84 ${y0 - 56} Z" fill="rgba(185,163,255,.3)" stroke="#b9a3ff" stroke-width="3"/>`
      : `<rect x="64" y="${y0 - 56}" width="12" height="112" fill="rgba(255,255,255,.15)" stroke="#a3adc6" stroke-width="2"/>`;
  }
  for (const h of [-46, -24, 24, 46]) {
    const y = y0 + h, yr = y + (y0 - y) * (ret - xs) / (xf - xs);
    s += `<polyline class="luc" points="0,${y} ${xs},${y} ${ret},${yr.toFixed(1)}"/>`;
  }
  const xfz = Math.max(xs + 20, Math.min(552, xf));
  s += `<circle cx="${xfz.toFixed(1)}" cy="${y0}" r="7" fill="#ffd88a" stroke="#1a0e02" stroke-width="2"/><text x="${xfz.toFixed(1)}" y="${y0 - 14}" text-anchor="middle" class="g" font-size="16">${C.lbl.ohnisko}</text>`;
  return s + '</svg>';
}
// ucho (zvuk prichádza zľava); o: { zvyrazni: id | [id], cisla, cesta, otaznik }
const UCHO_ZN = { usnica: [42, 118], zvukovod: [150, 170], bubienok: [232, 214], kladivko: [246, 104], nakovka: [290, 98], strmienok: [326, 188], eustach: [262, 296],
  slimak: [446, 256], kanaliky: [372, 48], predsien: [344, 146], nerv: [510, 196] };
function uchoSVG(o = {}) {
  const zv = o.zvyrazni ? [].concat(o.zvyrazni) : [], cl = id => 'cast' + (zv.length ? (zv.includes(id) ? ' hl' : ' tlm') : '');
  const g = (id, x, extra = '') => `<g class="${cl(id)}${extra}" data-c="${id}">${x}</g>`;
  let s = `<svg class="ucho obr" viewBox="0 0 600 340" aria-hidden="true">`;
  NS.ucho.zony.forEach((z, i) => { const [a, b] = [[10, 230], [236, 334], [340, 470]][i];
    s += `<path class="zona" d="M${a} 30 L${a} 22 L${b} 22 L${b} 30"/><text x="${(a + b) / 2}" y="17" text-anchor="middle" font-size="16" class="m">${z.kratky}</text>`; });
  s += `<rect class="u-dutina" x="236" y="112" width="98" height="120" rx="12"/>`;
  s += g('usnica', `<path class="u-tvar u-usnica" d="M80 60 C30 60 10 120 18 180 C24 240 50 280 84 272 C96 268 90 240 80 222 L80 190 L80 150 C80 120 92 90 80 60 Z"/>`);
  s += g('zvukovod', `<rect class="u-tvar u-zvukovod" x="80" y="152" width="148" height="36" rx="6"/>`);
  s += g('bubienok', `<ellipse class="u-tvar u-bubienok" cx="232" cy="170" rx="5" ry="30"/>`, o.cesta ? ' bubienok" data-cesta="bubienok' : '');
  s += g('kladivko', `<path class="hit" d="M238 170 L254 130"/><path class="u-kostL" d="M238 170 L252 134"/><circle class="u-tvar u-kost" cx="256" cy="128" r="9"/>`);
  s += g('nakovka', `<path class="hit" d="M280 124 L286 150"/><circle class="u-tvar u-kost" cx="280" cy="124" r="10"/><path class="u-kostL" d="M280 132 L286 150"/>`);
  s += g('strmienok', `<path class="hit" d="M290 154 L328 162"/><path class="u-kostL" d="M290 152 L320 158 M290 152 L298 170 L322 166 M330 150 L330 176"/>`);
  s += g('eustach', `<path class="hit" d="M290 232 C280 270 250 300 220 320"/><path class="u-eustach" d="M290 232 C280 270 250 300 220 320"/>`);
  s += g('kanaliky', `<path class="hit" d="M360 140 C340 110 344 66 372 64 C400 62 404 104 384 140"/><ellipse class="u-kanal" cx="372" cy="98" rx="22" ry="34"/><ellipse class="u-kanal" cx="410" cy="116" rx="34" ry="16"/><ellipse class="u-kanal" cx="388" cy="132" rx="14" ry="24" transform="rotate(40 388 132)"/>`);
  s += g('predsien', `<ellipse class="u-tvar u-predsien" cx="350" cy="168" rx="16" ry="22"/>`);
  s += g('slimak', `<path class="hit" d="M362 200 C362 170 410 168 430 190 C450 214 430 252 402 248"/><path class="u-slimak" d="M362 200 C362 172 410 168 430 190 C450 214 430 252 402 248 C378 244 376 216 398 212 C412 210 418 224 408 230"/>`);
  s += g('nerv', `<path class="hit" d="M440 214 C480 210 520 170 532 130"/><path class="u-nerv" d="M440 214 C480 210 520 170 532 130"/>`);
  s += `<path d="M8 150 Q14 170 8 190 M18 144 Q26 170 18 196" fill="none" stroke="#a3adc6" stroke-width="2.5"/>`;
  if (o.cesta) {
    s += `<circle data-cesta="vlaskove" class="vlaskove" cx="398" cy="230" r="8" fill="none" stroke="#ffd88a" stroke-width="2.5"/>` +
      `<g data-cesta="lalok" class="tvarC">${mozogG(536, 96, .62)}</g><text x="596" y="40" text-anchor="end" font-size="16">${NS.ucho.lbl.lalok}</text>`;
    s += pl('vlna', 'c-rec', '30,170 226,170') + pl('bubienok', 'c-rec', '232,148 232,192') + pl('kosticky', 'c-vloz', '238,168 256,130 280,124 290,152 330,160') +
      pl('slimak', 'c-dostr', '336,170 362,196 392,174 428,188 434,222 404,246') + pl('vlaskove', 'c-dostr', '404,246 398,232') + pl('nerv', 'c-dostr', '440,214 480,210 518,170 530,132') +
      `<circle class="bodCesta" r="9" cx="-40" cy="-40"/>`;
  }
  if (o.cisla) NS.ucho.casti.forEach((c, i) => { const [x, y] = UCHO_ZN[c.id]; s += `<circle class="znC2" cx="${x}" cy="${y}" r="13"/><text class="znT2" x="${x}" y="${y + 6}" font-size="15">${i + 1}</text>`; });
  if (o.otaznik) { const [x, y] = UCHO_ZN[o.otaznik]; s += `<circle class="znC2" cx="${x}" cy="${y}" r="15"/><text class="znT2" x="${x}" y="${y + 6}">?</text>`; }
  return s + '</svg>';
}
// polkruhovitý kanálik: trieda k1 … k4 = krok (prvky .s1 … .s4 sa ukážu len v danom kroku)
function rovSVG(trieda = '') {
  const L = NS.ucho.lbl, St = NS.ucho.rovStav;
  const obl = (r, a1, a2) => { const P = a => `${(150 + r * Math.cos(a * Math.PI / 180)).toFixed(1)} ${(120 + r * Math.sin(a * Math.PI / 180)).toFixed(1)}`; return `M${P(a1)} A${r} ${r} 0 0 1 ${P(a2)}`; };
  const hrot = (r, a) => { const x = 150 + r * Math.cos(a * Math.PI / 180), y = 120 + r * Math.sin(a * Math.PI / 180), t = (a + 90) * Math.PI / 180;
    return `<path d="M${(x + 12 * Math.cos(t)).toFixed(1)} ${(y + 12 * Math.sin(t)).toFixed(1)} L${(x - 9 * Math.cos(t) + 8 * Math.cos(t - Math.PI / 2)).toFixed(1)} ${(y - 9 * Math.sin(t) + 8 * Math.sin(t - Math.PI / 2)).toFixed(1)} L${(x - 9 * Math.cos(t) - 8 * Math.cos(t - Math.PI / 2)).toFixed(1)} ${(y - 9 * Math.sin(t) - 8 * Math.sin(t - Math.PI / 2)).toFixed(1)} Z"/>`; };
  let s = `<svg class="rov obr ${trieda}" viewBox="0 0 300 270" aria-hidden="true">`;
  s += `<circle class="kanal" cx="150" cy="120" r="78"/>`;
  // receptor dole: rovný (pokoj) alebo ohnutý (pohyb tekutiny)
  s += `<g class="r s4"><line x1="150" y1="186" x2="150" y2="210" stroke="#ffd88a" stroke-width="7" stroke-linecap="round"/></g>`;
  s += `<g class="r s1 s2 s3"><path d="M150 210 Q150 196 162 188" fill="none" stroke="#ffd88a" stroke-width="7" stroke-linecap="round"/></g>`;
  // hlava (kanálik) sa točí – len v kroku 1
  s += `<g class="r s1"><path class="hlavaS" d="${obl(112, -150, -30)}"/><g fill="#ffd88a">${hrot(112, -30)}</g><text x="150" y="14" text-anchor="middle" font-size="16" class="g">${L.hlava} ↻</text></g>`;
  // tekutina: v kroku 1 zaostáva (krátka), v krokoch 2 a 3 sa točí ďalej (dlhá)
  s += `<g class="r s1"><path class="tek" d="${obl(78, 200, 240)}"/><g fill="#8ec5ff">${hrot(78, 240)}</g></g>`;
  s += `<g class="r s2 s3"><path class="tek" d="${obl(78, 150, 300)}"/><g fill="#8ec5ff">${hrot(78, 300)}</g></g>`;
  s += `<text x="150" y="126" text-anchor="middle" font-size="16" class="m">${L.kanalik}</text>`;
  for (const k of ['r1', 'r2', 'r3', 'r4']) s += `<text class="r s${k[1]}" x="150" y="252" text-anchor="middle" font-size="17">${St[k]}</text>`;
  return s + '</svg>';
}

const VNIM = {};
function initVnimanie() {
  vytvorRezim('vnimanie');
  const V = NS.vnim, Z = NS.zmysly;
  const tl = $('#vn_tl');
  tl.innerHTML = V.priklady.map(p => `<button type="button" data-p="${p.id}" aria-pressed="false">${p.tl}</button>`).join('');
  const zvol = id => {
    const p = V.priklady.find(x => x.id === id);
    $$('button', tl).forEach(b => { const on = b.dataset.p === id; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    $('#vn_retaz').innerHTML = V.retaz.map((r, i) => (i ? '<span class="sip" aria-hidden="true">↓</span>' : '') + `<span class="st${i === 3 ? ' centr' : ''}"><b>${velke(r)}:</b> ${p.kroky[i]}</span>`).join('');
  };
  tl.onclick = e => { const b = e.target.closest('button[data-p]'); if (b) zvol(b.dataset.p); };
  VNIM.zvol = zvol; zvol(V.priklady[0].id);
  // prehľadová tabuľka (spoločná funkcia, riadky z NS.zmysly.tabulka)
  $('#vn_tab').innerHTML = tabulkaZmyslovHTML();

// spoločný posuvník s tlačidlami −/+ (od časti 4): id posuvníka, min, max, krok tlačidiel, popisy tlačidiel, zmena(hodnota)
function posuvnik(id, min, max, krok, menej, viac, zmena) {
  const sl = $('#' + id);
  sl.min = min; sl.max = max;
  const nastav = v => { v = Math.max(min, Math.min(max, +v)); if (!isFinite(v)) v = min; sl.value = v; zmena(+sl.value); };
  sl.oninput = () => nastav(sl.value);
  $(`#${id}Menej`).onclick = () => nastav(+sl.value - krok); $(`#${id}Viac`).onclick = () => nastav(+sl.value + krok);
  $(`#${id}Menej`).setAttribute('aria-label', menej); $(`#${id}Viac`).setAttribute('aria-label', viac);
  return nastav;
}

// tabuľka zmyslov z NS.zmysly.tabulka (lalok null → len „kôra“ alebo text centra)
function tabulkaZmyslovHTML() {

/* SPOLOČNÝ KOMPONENT (od časti 5): kartičky (polozky [{ t, ciel }]) sa ťahajú alebo ťukajú k cieľom ([{ id, nazov }]).
   o: { chipy, sloty (s id), fb, znova, kolo: () => { polozky, ciele }, T: { prazdne, vyber, ok(p, c), zle(p, c), hotovo(chyby) } }, S = stavový objekt */
function priradHra(o, S) {
  Object.assign(S, { polozky: [], ciele: [], umiestnene: {}, zostava: [], vybrany: null, chyby: 0, tah: { poTahu: 0 } });
  function kresli() {
    o.sloty.innerHTML = S.ciele.map(c => {
      const tu = Object.keys(S.umiestnene).filter(i => S.umiestnene[i] === c.id).map(i => S.polozky[i].t);
      return `<button type="button" class="rSlot${tu.length ? ' plny' : ''}" data-c="${c.id}"><span><span class="sitT">${c.nazov}</span><span class="rMiesto">${tu.length ? tu.map(t => '✓ ' + t).join('<br>') : o.T.prazdne}</span></span></button>`;
    }).join('');
    o.chipy.innerHTML = S.zostava.map(i => `<button type="button" class="chip${S.vybrany === i ? ' on' : ''}" data-k="${i}" aria-pressed="${S.vybrany === i}">${S.polozky[i].t}</button>`).join('');
  }
  // položka i k cieľu c; vráti true, ak je to správne
  function poloz(i, c) {
    if (S.umiestnene[i] !== undefined) return false;
    const p = S.polozky[i], ciel = S.ciele.find(x => x.id === c);
    S.vybrany = null;
    if (p.ciel === c) {
      S.umiestnene[i] = c; S.zostava = S.zostava.filter(k => k !== i); kresli();
      o.fb.className = 'fb ok'; o.fb.innerHTML = S.zostava.length ? `<span class="h">✓ ${NS.ui.spravne}.</span> ${o.T.ok(p, ciel)}` : `<span class="h">✓ ${o.T.hotovo(S.chyby)}</span>`;
      const ch = $('.chip', o.chipy); (ch || o.znova).focus();
      return true;
    }
    S.chyby++; kresli();
    o.fb.className = 'fb zle'; o.fb.innerHTML = `<span class="h">✗ ${o.T.zle(p, ciel)}</span>`;
    return false;
  }
  function nova() {
    const k = o.kolo(); S.polozky = k.polozky; S.ciele = k.ciele;
    S.umiestnene = {}; S.vybrany = null; S.chyby = 0; S.zostava = zamiesaj(S.polozky.map((_, i) => i));
    o.fb.className = 'fb'; o.fb.innerHTML = ''; kresli();
  }
  o.chipy.onclick = e => {
    const b = e.target.closest('.chip'); if (!b || performance.now() - S.tah.poTahu < 400) return;
    const k = +b.dataset.k; S.vybrany = S.vybrany === k ? null : k; kresli();
    const nb = $(`.chip[data-k="${k}"]`, o.chipy); if (nb) nb.focus();
  };
  o.sloty.onclick = e => {
    const s = e.target.closest('.rSlot'); if (!s) return;
    if (S.vybrany === null) { o.fb.className = 'fb'; o.fb.textContent = o.T.vyber; return; }
    poloz(S.vybrany, s.dataset.c);
  };
  S.tah = tahanie(o.chipy, `#${o.sloty.id} .rSlot`, (b, s) => poloz(+b.dataset.k, s.dataset.c));
  o.znova.onclick = nova;
  S.nova = nova; S.poloz = poloz;
  nova();
  return S;
}

/* =====================================================================
   ČASŤ 5 – MODEL: adaptácia (Zjednodušený model)
   ===================================================================== */
Object.assign(MODEL, {
  // čas t → citlivosť 0 … 1 a či je podnet prítomný; kým podnet trvá, citlivosť klesá k „dnu“, potom sa vracia k 1
  adaptacia(t) {
    const A = NS.cuch.adapt, x = Math.max(0, Math.min(A.koniec, t));
    const cT = A.dno + (1 - A.dno) * Math.exp(-A.T / A.tau1);
    const c = x <= A.T ? A.dno + (1 - A.dno) * Math.exp(-x / A.tau1) : 1 - (1 - cT) * Math.exp(-(x - A.T) / A.tau2);
    return { c, podnet: x <= A.T };
  }
});

  s += `<rect x="${X(0)}" y="24" width="${X(A.T) - X(0)}" height="14" rx="5" fill="#b9a3ff"/><text x="${X(0)}" y="18" font-size="15" class="m">${L.podnet}</text><text x="${X(A.T) + 6}" y="36" font-size="15" class="m">${L.bezPodnetu}</text>`;

  s += `<polyline points="${body.join(' ')}" fill="none" stroke="#ffd88a" stroke-width="4" stroke-linejoin="round"/>`;
  if (t !== undefined) { const m = MODEL.adaptacia(t); s += `<line x1="${X(t)}" y1="44" x2="${X(t)}" y2="210" stroke="#e2e8f5" stroke-width="2" stroke-dasharray="4 4"/><circle cx="${X(t)}" cy="${Y(m.c)}" r="9" fill="#ffd88a" stroke="#1a0e02" stroke-width="2"/>`; }

// ilúzie: geometria (rovnaké dĺžky a polomery – test ich overuje)

/* =====================================================================
   ČASŤ 6 – MODEL: Pavlov, sieť, zabúdanie, pamäť čísel, Stroop (Zjednodušené modely)
   ===================================================================== */
Object.assign(MODEL, {
  // sila spojenia zvonček – potrava: 'par' = zvonček + potrava, 'sam' = zvonček sám; vždy v rozsahu min … max
  pavlov(sila, akcia) { const P = NS.pavlov; return Math.max(P.min, Math.min(P.max, sila + (akcia === 'par' ? P.plus : -P.minus))); },
  slinta: sila => sila >= NS.pavlov.prah,
  kolkoParovani(s) { let n = 0; while (!MODEL.slinta(s) && n < 20) { s = MODEL.pavlov(s, 'par'); n++; } return n; },
  kolkoZvoncekov(s) { let n = 0; while (MODEL.slinta(s) && n < 20) { s = MODEL.pavlov(s, 'sam'); n++; } return n; },
  // sieť: 'opakuj' posilní spojenie, 'den' (bez opakovania) ho oslabí
  spojenie(w, akcia) { const S = NS.ucenie.siet; return Math.max(S.min, Math.min(S.max, w + (akcia === 'opakuj' ? S.plus : -S.minus))); },
  // retencia v % v čase t (dni); učenie v deň 0, rozvrh = dni opakovaní
  retencia(rozvrh, t) {
    const Z = NS.ucenie.zabudanie; let S = Z.S0, tL = 0;
    for (const d of [...rozvrh].sort((a, b) => a - b)) { if (d > t) break; const Rb = Math.exp(-(d - tL) / S); S *= Z.a + Z.b * (1 - Rb); tL = d; }
    return Math.max(0, Math.min(100, 100 * Math.exp(-(t - tL) / S)));
  },
  rozvrh(n, sposob) { return sposob === 'naraz' ? Array(n).fill(0) : NS.ucenie.zabudanie.rozvrhy[n]; },
  // pamäť čísel: rad dĺžky n (prvá číslica nie je 0), porovnanie po číslach, zhluky po k
  radCisel(n, rnd = Math.random) { let s = String(1 + Math.floor(rnd() * 9)); while (s.length < n) s += Math.floor(rnd() * 10); return s; },
  porovnajRad(rad, odpoved) { const o = String(odpoved).replace(/\D/g, ''); return rad.split('').map((c, i) => ({ c, zadane: o[i] || '', ok: o[i] === c })); },
  zhluky(rad, k = 2) { const r = []; for (let i = 0; i < rad.length; i += k) r.push(rad.slice(i, i + k)); return r; },
  // Stroop: slovo a podnet (smer šípky alebo farba písma) sa vždy líšia; odpoveď = podnet
  stroop(verzia, n, rnd = Math.random) {
    const M = NS.myslenie, Z = verzia === 'farby' ? M.farby : M.smery, pick = a => a[Math.floor(rnd() * a.length)];

function pesSVG(o = {}) {
  let s = `<svg class="pv obr" viewBox="0 0 320 220" aria-hidden="true">`;
  s += `<path d="M250 120 Q290 96 296 70" fill="none" stroke="#c9a27a" stroke-width="10" stroke-linecap="round"/>`;
  s += [110, 140, 200, 230].map(x => `<rect class="telo" x="${x}" y="140" width="16" height="56" rx="6"/>`).join('');
  s += `<ellipse class="telo" cx="172" cy="128" rx="84" ry="36"/><circle class="telo" cx="88" cy="96" r="32"/><ellipse class="telo" cx="62" cy="110" rx="22" ry="14"/>`;
  s += `<path class="tmave" d="M96 66 Q118 70 112 108 Q100 96 96 66 Z"/><circle cx="46" cy="104" r="6" fill="#1a0e02"/><circle cx="84" cy="88" r="5" fill="#1a0e02"/>`;
  if (o.potrava) s += `<ellipse cx="60" cy="204" rx="40" ry="10" fill="#6a7aa6"/><path d="M30 200 Q40 186 50 198 Q58 184 68 198 Q78 186 88 200 Z" fill="#c97a5a"/>`;
  if (o.zvoncek) s += `<path d="M250 18 Q232 20 232 50 L226 62 L274 62 L268 50 Q268 20 250 18 Z" fill="#ffd88a" stroke="#1a0e02" stroke-width="2"/><circle cx="250" cy="66" r="5" fill="#ffd88a" stroke="#1a0e02"/>` +
    `<path d="M282 28 q8 10 0 20 M292 22 q12 16 0 32" fill="none" stroke="#ffd88a" stroke-width="3"/>`;
  if (o.slinta) s += `<path class="slina" d="M54 124 C60 134 60 142 54 146 C48 142 48 134 54 124 Z"/><path class="slina" d="M68 126 C72 134 72 140 68 143 C64 140 64 134 68 126 Z"/>`;
  return s + '</svg>';
}
const pesPanely = P => `<div class="pvPanely">${P.map(([o, t]) => `<div>${pesSVG(o)}<p>${t}</p></div>`).join('')}</div>`;
// sieť neurónov; w = sila spojení na ceste A → B → C → E
function sietSVG(w) {
  const U = { A: [50, 150], B: [160, 70], C: [280, 150], D: [160, 220], E: [390, 80] }, cesta = ['AB', 'BC', 'CE'], ine = ['AD', 'DC', 'BD'];
  const hr = (h, v, c) => { const [a, b] = [U[h[0]], U[h[1]]]; return `<line class="hrana${c ? ' cesta' : ''}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke-width="${(2 + v * 1.4).toFixed(1)}" opacity="${(0.35 + v * 0.065).toFixed(2)}"/>`; };
  let s = `<svg class="siet obr" viewBox="0 0 440 270" aria-hidden="true">` + ine.map(h => hr(h, 2, false)).join('') + cesta.map(h => hr(h, w, true)).join('');
  s += Object.entries(U).map(([k, [x, y]]) => `<circle class="uzol" cx="${x}" cy="${y}" r="20"/><text x="${x}" y="${y + 7}" text-anchor="middle" font-size="18" class="bold">${k}</text>`).join('');
  return s + '</svg>';
}
// krivky zabúdania pre n opakovaní; zvýrazní zvolený spôsob
function zabudSVG(n, sposob) {
  const U = NS.ucenie, L = U.lbl, D = U.zabudanie.dni, X = d => 50 + d * 52, Y = r => 220 - r * 1.7;
  const krivka = sp => { const b = []; for (let t = 0; t <= D + 1e-9; t += 0.05) b.push(`${X(t).toFixed(1)},${Y(MODEL.retencia(MODEL.rozvrh(n, sp), t)).toFixed(1)}`); return b.join(' '); };
  let s = `<svg class="obr" viewBox="0 0 440 270" aria-hidden="true"><line x1="50" y1="220" x2="420" y2="220" stroke="#a3adc6" stroke-width="2"/><line x1="50" y1="220" x2="50" y2="40" stroke="#a3adc6" stroke-width="2"/>`;
  for (let d = 0; d <= D; d++) s += `<text x="${X(d)}" y="240" text-anchor="middle" font-size="15" class="m">${d}</text>`;
  s += `<text x="420" y="262" text-anchor="end" font-size="15" class="m">${L.dni}</text><text x="56" y="34" font-size="15" class="m">${L.retencia}</text>`;
  for (const sp of ['naraz', 'rozlozene']) {
    const vyb = sp === sposob;
    s += `<polyline points="${krivka(sp)}" fill="none" stroke="${sp === 'naraz' ? '#b9a3ff' : '#ffd88a'}" stroke-width="${vyb ? 5 : 2.5}" ${sp === 'naraz' ? 'stroke-dasharray="8 5"' : ''} opacity="${vyb ? 1 : .6}"/>`;
  }
  s += MODEL.rozvrh(n, sposob).map(d => `<circle cx="${X(d)}" cy="${Y(MODEL.retencia(MODEL.rozvrh(n, sposob), d))}" r="6" fill="#e2e8f5" stroke="#1a0e02" stroke-width="2"/>`).join('');
  s += `<text x="420" y="16" text-anchor="end" font-size="15" fill="#ffd88a">━ ${L.rozlozene}</text><text x="420" y="34" text-anchor="end" font-size="15" fill="#b9a3ff">┅ ${L.naraz}</text>`;
  return s + '</svg>';
}

};
function recSVG(rezim) {

  over('č7: ťahák je mimo ovládacích prvkov (pri tlači sa skryje .wrap)', [!!$('#tahakTlac').closest('.wrap'), $$('#tahakTlac button, #tahakTlac input').length], [false, 0]);
  // 5. čísla na kontrolu (so zdrojom v kóde)
  const sucet = NS.nervy.miechove.reduce((a, m) => a + m.pocet, 0);
  [['časti neurónu', NS.casti.length, 'NS.casti'], ['typy neurónov', NS.typy.length, 'NS.typy'], ['časti reflexného oblúka', NS.reflex.oblukCasti.length, 'NS.reflex.oblukCasti'],
    ['neuróny v oblúku: stiahnutie ruky / kolenný reflex', NS.reflex.stiahnutie.neurony.length + ' / ' + NS.reflex.koleno.neurony.length, 'NS.reflex.stiahnutie, NS.reflex.koleno'],
    ['páry hlavových nervov', NS.nervy.pocetHlavovych + ' (zoznam: ' + NS.nervy.hlavove.length + ')', 'NS.nervy.pocetHlavovych, NS.nervy.hlavove'],
    ['páry miechových nervov', NS.nervy.miechove.map(m => `${m.nazov} ${m.pocet}`).join(', ') + ' = ' + sucet, 'NS.nervy.miechove'],
    ['časti mozgu / mozgový kmeň', NS.mozog.casti.length + ' / ' + NS.mozog.casti.filter(c => c.kmen).length, 'NS.mozog.casti'], ['laloky kôry', NS.kora.laloky.length, 'NS.kora.laloky'],
    ['mozgové plieny', NS.lebka.vrstvy.filter(v => v.plena).length, 'NS.lebka.vrstvy'], ['popísané časti oka', NS.oko.casti.length, 'NS.oko.casti'],
    ['sluchové kostičky', NS.ucho.casti.filter(c => c.kosticka).length, 'NS.ucho.casti'], ['základné chute', NS.chut.zakladne.length, 'NS.chut.zakladne'], ['zmysly v tabuľke', NS.zmysly.tabulka.length, 'NS.zmysly.tabulka'],
    ['model vzruchu: prah / základ / krok / strop', `${NS.vzruch.prah} / ${NS.vzruch.zakladna} / ${NS.vzruch.krok} / ${NS.vzruch.strop}`, 'NS.vzruch'],
    ['pretek: pomer rýchlostí (ilustračný)', NS.pretek.pomer, 'NS.pretek.pomer'], ['reakčný čas: náhodné čakanie (ms)', `${NS.reakcia.minCakanie} – ${NS.reakcia.maxCakanie}`, 'NS.reakcia'],
    ['pravítko: g (m/s²)', NS.reakcia.pravitko.g, 'NS.reakcia.pravitko'], ['autonómna sústava: hranice posuvníka', NS.obvod.hranice.join(' / '), 'NS.obvod.hranice'],
    ['tlkot srdca na obrázku (Hz)', NS.obvod.srdceHz.join(' – '), 'NS.obvod.srdceHz'], ['hypotalamus: hranice zima / teplo (°C)', NS.hypo.hranice.join(' / '), 'NS.hypo.hranice'],
    ['zrakové chyby: dĺžky oka', `${NS.chyby.dlzky[0]} / ${NS.chyby.normalna} / ${NS.chyby.dlzky[1]} (tolerancia ${NS.chyby.tolerancia})`, 'NS.chyby'],
    ['adaptácia: vôňa do / koniec', `${NS.cuch.adapt.T} / ${NS.cuch.adapt.koniec}`, 'NS.cuch.adapt'],
    ['Pavlov: +spárovanie / −zvonček / prah / rozsah', `+${NS.pavlov.plus} / −${NS.pavlov.minus} / ${NS.pavlov.prah} / ${NS.pavlov.min} – ${NS.pavlov.max}`, 'NS.pavlov'],
    ['zabúdanie: S0 / a / b, rozvrhy', `${NS.ucenie.zabudanie.S0} / ${NS.ucenie.zabudanie.a} / ${NS.ucenie.zabudanie.b}; ${JSON.stringify(NS.ucenie.zabudanie.rozvrhy)}`, 'NS.ucenie.zabudanie'],
    ['pamäť: dĺžky radov / čas ukázania', `${NS.pamat.urovne.join(', ')} / ${NS.pamat.ukazMs} ms`, 'NS.pamat'],
    ['hluk (orientačne, dB)', NS.ucho.hluk.map(h => `${h.t} ${h.db}`).join(', '), 'NS.ucho.hluk'],
    ['orientačné hodnoty v textoch', 'desiatky miliárd neurónov; reakcia na zrak okolo štvrť sekundy; mozog okolo 1,4 kg (asi 2 % hmotnosti), približne pätina energie; miecha 40 – 45 cm; telo okolo 37 °C; adaptácia na tmu desiatky minút; obalené vlákna desiatky m/s, neobalené rádovo m/s',
      'NS.stavba, NS.reakcia, NS.lebka, NS.miecha, NS.hypo, NS.okoR, NS.pretek'],
    ['kvíz', `${NS.kvizUI.pocet} otázok, ${NS.kvizUI.urovne.length} úrovne`, 'NS.kvizUI']
  ].forEach(([a, b, c]) => v.push({ test: 'číslo na kontrolu: ' + a, ok: true, dostal: `${b} (zdroj: ${c})`, cakal: '' }));
  // fakty na kontrolu (vypísané; overuje človek)
  REG.fakty.forEach((f, i) => v.push({ test: `fakt ${i + 1} na kontrolu (časť ${f.cast})`, ok: true, dostal: f.text, cakal: '' }));
  // 8. vzhľad: vodorovné posúvanie a veľkosť ovládacích prvkov na každej karte a v každom režime
  const zalS = { karta: STAV.karta, pod: { ...STAV.pod }, rezim: { ...STAV.rezim } };
  const male = []; let posuv = 0;
  for (const k in NS.podkarty) for (const p in NS.podkarty[k]) for (const r of ['ako', 'skus']) {
    ukazKartu(k, true); ukazPod(k, p, true); nastavRezim(p, r, true);
    if (document.documentElement.scrollWidth > window.innerWidth + 1) posuv++;
    $$('button, input[type=range], label.chk, summary').forEach(el => {
      if (!el.getClientRects().length) return;
      const b = el.getBoundingClientRect();
      if (b.width < 47.5 || b.height < 47.5) male.push(`${p}/${r}: ${el.textContent.trim().slice(0, 20)} ${Math.round(b.width)}×${Math.round(b.height)}`);
    });
  }
  for (const k in zalS.pod) ukazPod(k, zalS.pod[k], true);
  ukazKartu(zalS.karta, true); for (const p in zalS.rezim) nastavRezim(p, zalS.rezim[p], true);
  over(`vzhľad: bez vodorovného posúvania (šírka okna ${window.innerWidth} px)`, posuv, 0);
  over('vzhľad: ovládacie prvky aspoň 48 × 48 px', male.slice(0, 6), []);
  // blikanie: žiadne CSS animácie s periódou pod 1/3 s; bodky sa pohybujú, neblikajú
  const rychle = (document.getAnimations ? document.getAnimations() : []).filter(a => { const t = a.effect && a.effect.getComputedTiming(); return t && t.iterations > 1 && t.duration < 334; });
  over('nič nebliká nad 3 Hz (žiadne opakované animácie kratšie ako 1/3 s)', rychle.length, 0);
  // 9. externé skripty
  const skripty = $$('script[src]').map(s => s.getAttribute('src'));
  over('jediný externý skript je GoatCounter', skripty, ['//gc.zgo.at/count.js']);
  try {
    const zdroj = await (await fetch(location.pathname, { cache: 'no-store' })).text();
    over('GoatCounter je tesne pred </body>', /<script data-goatcounter="https:\/\/jasvarc\.goatcounter\.com\/count" async src="\/\/gc\.zgo\.at\/count\.js"><\/script>\n<\/body>/.test(zdroj), true);
    over('v súbore je práve jeden <script src>', (zdroj.match(/^<script[^>\n]*\ssrc=/gm) || []).length, 1);
    const adresy = (zdroj.match(/(https?:)?\/\/[a-z0-9.-]+\.[a-z]{2,}/gi) || []).filter(a => !/goatcounter\.com|gc\.zgo\.at/.test(a));
    over('v súbore nie sú externé adresy okrem GoatCounter', adresy, []);
    over('animácia nevolá žiadne funkcie GoatCounter', /window\.goatcounter|goatcounter\.count\(/.test(zdroj), false);
    over('v súbore nezostali značky TODO z jednotlivých častí', /TODO\u0020časť/.test(zdroj), false);
  } catch (e) { v.push({ test: 'zdrojový súbor sa nedal načítať (file://)', ok: true, dostal: '', cakal: '' }); }

  const el = $('#testy');
  el.innerHTML = `<div class="card" style="margin-top:16px"><h2>Testy: ${v.filter(x => x.ok).length} / ${v.length} prešlo</h2><table>${v.map(x => `<tr><td class="${x.ok ? 'ok' : 'zle'}">${x.ok ? '✓' : '✗'}</td><td>${x.test}</td><td>${x.dostal}</td><td>${x.ok ? '' : 'čakal: ' + x.cakal}</td></tr>`).join('')}</table></div>`;
  console.table(v);
  window.VYSLEDKY_TESTOV = v;
  return v;
}

init();
</script>
<script data-goatcounter="https://jasvarc.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
