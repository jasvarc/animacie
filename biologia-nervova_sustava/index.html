.tlac{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.muted{color:var(--muted)}

/* ===== Hlavička, karty, podkarty, režim ===== */
header.top{margin-bottom:12px}
nav.karty{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
nav.karty button{border-radius:999px;padding:8px 16px}
nav.karty button .cis{color:var(--muted);margin-right:4px}
nav.karty button.on .cis{color:var(--gold2)}
.podkarty{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 16px;padding:8px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.podkarty button .cis{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);margin-right:8px;font-weight:700;font-size:16px}
.podkarty button.on .cis{border-color:var(--gold);background:rgba(243,180,83,.25)}
.hlavaKarty{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.rezim{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;background:rgba(255,255,255,.03)}
.rezim button{border:none;border-radius:9px;background:transparent}
.rezim button.on{background:rgba(243,180,83,.22);color:var(--gold2)}
.rezim button .ik{margin-right:6px}

/* ===== Rozloženie ===== */
.dva{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:20px;align-items:start}
.blok{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}

/* ===== Ako to funguje ===== */
.ako{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:18px;align-items:center}
.ako figure{margin:0;padding:12px;border-radius:12px;background:#08101c;border:1px solid var(--line)}
.ako figure svg{display:block;width:100%;height:auto;max-height:460px}
.vety{margin:0;padding:0;list-style:none;counter-reset:v}
.vety li{position:relative;padding:6px 0 6px 40px;font-size:19px}
.vety li::before{counter-increment:v;content:counter(v);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--gold2);border:1px solid rgba(243,180,83,.5)}
.strankovac{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.strankovac .str{color:var(--muted);min-width:3.5em;text-align:center}
.legNeuron{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:17px;color:var(--text)}
.legNeuron li{display:inline-flex;align-items:center;gap:6px}
.legNeuron .c,.castiTl .c{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1a0e02;font-weight:800;font-size:15px;flex:none}

/* ===== Štítky: zjednodušený model, pre zvedavých ===== */
.zjednBox{margin:14px 0 0;padding:8px 12px;border-radius:10px;border:2px dashed rgba(185,163,255,.6);background:rgba(185,163,255,.07);font-size:17px}
.zjedn{display:inline-block;font-weight:800;color:var(--violet);margin-right:6px}
.zjedn::before{content:"⚙ "}
.zvedTag{display:inline-block;font-weight:700;font-size:16px;color:#160d2c;background:var(--violet);border-radius:999px;padding:3px 12px;margin-bottom:8px}
.zvedTag::before{content:"🔍 "}

/* ===== Boxy, spätná väzba ===== */
.box{margin:12px 0 0;padding:12px 14px;border-radius:10px;border:1px solid}
.box p:last-child{margin-bottom:0}
.box.info{background:rgba(111,180,255,.08);border-color:rgba(111,180,255,.4)}
.box.zlty{background:rgba(243,180,83,.09);border-color:rgba(243,180,83,.45)}
.nazovCasti{font-size:21px}
.moznosti{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.moznosti button{min-height:52px;font-weight:650}
.moznosti button.ok,.chip.ok{background:rgba(127,220,143,.22);border:2px solid var(--green);color:#d7ffdf;opacity:1}
.moznosti button.zle{background:rgba(255,122,107,.16);border:2px dashed var(--red);color:#ffe0dc;opacity:1}
.fb{margin-top:10px;min-height:1.6em}
.fb .h{font-weight:800}
.fb.ok .h{color:var(--green)}.fb.zle .h{color:#ffb3a8}
.kvStav{margin:4px 0 8px;color:var(--muted)}

/* ===== Neurón (SVG) ===== */
.neuronObal{border-radius:10px;background:#08101c;border:1px solid var(--line);padding:8px}
.neuronObal svg{display:block;width:100%;height:auto}
.neuronSvg .cast{transition:opacity .3s}
.neuronSvg .tlm{opacity:.25}
.neuronSvg .hit{fill:none;stroke:transparent;stroke-width:26;stroke-linecap:round;pointer-events:stroke}
.neuronSvg .hitF{fill:transparent;stroke:none}
.neuronSvg .dend,.neuronSvg .axon,.neuronSvg .term{fill:none;stroke:#6fb4ff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.neuronSvg .axon{stroke-width:7}
.neuronSvg .term{stroke:#7fdc8f;stroke-width:5}
.neuronSvg .bulb{fill:#7fdc8f;stroke:#0b1424;stroke-width:1.5}
.neuronSvg .soma{fill:#1f3866;stroke:#6fb4ff;stroke-width:3}
.neuronSvg .jadro{fill:#b9a3ff;stroke:#e2e8f5;stroke-width:1.5}
.neuronSvg .myel{fill:rgba(243,180,83,.5);stroke:#f3b453;stroke-width:2}
.neuronSvg .uzol{fill:transparent;stroke:none}
.neuronSvg .hl .dend,.neuronSvg .hl .axon,.neuronSvg .hl .term{stroke:#ffd88a}
.neuronSvg .hl .soma{stroke:#ffd88a;stroke-width:5}
.neuronSvg .hl .myel{stroke:#fff;stroke-width:3;fill:rgba(243,180,83,.75)}
.neuronSvg .hl .uzol{fill:rgba(255,216,138,.35);stroke:#ffd88a;stroke-width:2.5}
.neuronSvg .hl .bulb{fill:#ffd88a}
.neuronSvg .znL{stroke:#ffd88a;stroke-width:2.5}
.neuronSvg .znC{fill:#f3b453;stroke:#1a0e02;stroke-width:2}
.neuronSvg .znT{fill:#1a0e02;font-size:26px;font-weight:800;text-anchor:middle}
.klik .neuronSvg .cast{cursor:pointer}
.castiTl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.castiTl button{display:inline-flex;align-items:center;gap:8px}
#st_info{min-height:5.2em}

/* ===== Reťaz neurónov ===== */
.retaz{display:flex;flex-direction:column;gap:4px}
.rClanok{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);min-height:56px}
.rClanok .rN{font-weight:800}
.rClanok .rP{color:var(--muted);font-size:16px;display:block}
.rSlot{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:64px;border:2px dashed rgba(140,160,215,.55);background:rgba(255,255,255,.02)}
.rSlot svg{flex:none;width:76px;height:40px}
.rSlot .rMiesto{color:var(--muted)}
.rSlot .rCis{display:block;font-size:15px;color:var(--muted)}
.rSlot.plny{border:2px solid var(--green);background:rgba(127,220,143,.12)}
.rSlot.plny .rMiesto{color:#d7ffdf}
.rSlot.nad{border-color:var(--gold);border-style:solid;background:rgba(243,180,83,.15)}
.rSipka{align-self:center;font-size:24px;line-height:1;color:var(--muted)}
.centrum{border:2px dashed rgba(243,180,83,.55);border-radius:14px;padding:6px 8px 8px;background:rgba(243,180,83,.04)}
.centrum .cLbl{display:block;font-size:15px;color:var(--gold2);letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin:0 0 4px 4px}
.chipy{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:52px}
.chip{touch-action:none;border-radius:999px;font-weight:700;cursor:grab;user-select:none;-webkit-user-select:none}
.chip.on{background:rgba(243,180,83,.25);border:2px solid var(--gold);color:var(--gold2)}
.duch{position:fixed;left:0;top:0;pointer-events:none;z-index:50;margin:0;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.6)}

/* ===== Vzruch: posuvník, axón, záznam ===== */
.slRiadok{display:flex;align-items:center;gap:8px}
.slRiadok>button{font-size:24px;font-weight:700;padding:0;width:48px}
.rangeObal{flex:1;min-width:0;position:relative;padding-bottom:30px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y;display:block}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:rgba(255,255,255,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--gold);border:3px solid #1a0e02;box-shadow:0 0 0 2px var(--gold)}
input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--gold);border:3px solid #1a0e02}
.prahZnacka{position:absolute;top:36px;left:calc(15px + (100% - 30px) * var(--p));transform:translateX(-50%);font-size:15px;color:var(--gold2);white-space:nowrap;font-weight:700}
.prahZnacka::before{content:"";position:absolute;left:50%;top:-12px;width:2px;height:10px;background:var(--gold2)}
.silaRiadok{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.silaRiadok b{font-size:24px;font-variant-numeric:tabular-nums}
.pocitadlo{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.pocitadlo .cislo{font-size:46px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;min-width:1.2em;text-align:center;line-height:1}
.pocitadlo .lbl{font-size:19px}
.stage{border-radius:10px;background:#08101c;border:1px solid var(--line);padding:8px;margin-top:10px}
.stage svg{display:block;width:100%;height:auto}
.stage .cap{font-size:16px;color:var(--muted);margin:0 0 4px}
.imAxon .ax{stroke:#6fb4ff;stroke-width:8;stroke-linecap:round}
.imAxon .rec{fill:#1f3866;stroke:#6fb4ff;stroke-width:3}
.imAxon .bod{fill:#ffd88a;stroke:#1a0e02;stroke-width:2}
.imAxon .podnet{fill:#ff7a6b}
.imAxon .txt{fill:#a3adc6;font-size:26px}
.zaznam .os{stroke:#a3adc6;stroke-width:2}
.zaznam .sp{fill:none;stroke:#ffd88a;stroke-width:3;stroke-linejoin:round}
.zaznam .vod{stroke:rgba(255,216,138,.5);stroke-width:1.5;stroke-dasharray:6 5}
.zaznam text{fill:#a3adc6;font-size:24px}
#im_stav{font-size:20px;font-weight:700;min-height:1.6em}

/* ===== Pretek ===== */
.draha{margin-top:10px}
.drahaH{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-weight:700}
.drahaH .st{font-weight:600;color:var(--muted)}
.drahaH .st.hotovo{color:var(--green)}
.pretek .ax{stroke:#6fb4ff;stroke-width:6;stroke-linecap:round}
.pretek .myel{fill:rgba(243,180,83,.5);stroke:#f3b453;stroke-width:2}
.pretek .ciel{stroke:#e2e8f5;stroke-width:2;stroke-dasharray:6 5}
.pretek .bod{fill:#ffd88a;stroke:#1a0e02;stroke-width:2}
.pretek .skok{fill:none;stroke:#ffd88a;stroke-width:2.5;stroke-dasharray:5 4}
.pretek text{fill:#a3adc6;font-size:22px}
#pr_vysl{font-size:20px;font-weight:700;color:var(--gold2);min-height:1.5em;margin-top:8px}

/* ===== Synapsa ===== */
.syn .sEl{transition:transform .8s ease,opacity .6s ease}
.syn .pre{fill:#1f3866;stroke:#6fb4ff;stroke-width:3}
.syn .post{fill:#1b3328;stroke:#7fdc8f;stroke-width:3}
.syn .vez{fill:rgba(185,163,255,.22);stroke:#b9a3ff;stroke-width:2.5}
.syn .mol{fill:#ffd88a;stroke:#1a0e02;stroke-width:1.2}
.syn .rec path{fill:none;stroke:#7fdc8f;stroke-width:4;stroke-linejoin:round}
.syn .rec.akt path{stroke:#ffd88a;stroke-width:5}
.syn .imp{fill:#ffd88a}
.syn .impG{fill:rgba(255,216,138,.3)}
.syn .lbl{fill:#e2e8f5;font-size:22px}
.syn .ld{stroke:#a3adc6;stroke-width:1.5}
.syn .smer{fill:#ffd88a}
.krokText{font-size:20px;min-height:3.2em;margin-top:10px}
.krokText .kc{display:block;color:var(--muted);font-size:17px}
.zorad{margin:8px 0;padding:0;list-style:none;counter-reset:z}
.zorad li{padding:6px 10px 6px 44px;position:relative;border-radius:8px;margin:4px 0;background:rgba(127,220,143,.1);border:1px solid rgba(127,220,143,.45)}
.zorad li::before{counter-increment:z;content:"✓ " counter(z);position:absolute;left:8px;top:6px;font-weight:800;color:var(--green)}
.moznosti.stlpec{flex-direction:column;align-items:stretch}
.moznosti.stlpec button{text-align:left}

/* ===== Reakčný čas ===== */
.rkPlocha{width:100%;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;
  font-size:26px;font-weight:800;border-radius:16px;border:3px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:none}
.rkPlocha .ik2{font-size:42px;line-height:1}
.rkPlocha .pod{font-size:19px;font-weight:600;color:var(--muted)}
.rkPlocha .skoro{font-size:21px;color:#ffe0dc;border:2px dashed var(--red);border-radius:999px;padding:2px 14px}
.rkPlocha.start{background:rgba(111,180,255,.12);border-color:rgba(111,180,255,.6)}
.rkPlocha.cakaj{border-radius:2px;border-style:dashed;background:rgba(255,255,255,.04)}
.rkPlocha.teraz{border-radius:50%;background:rgba(127,220,143,.32);border:6px solid var(--green);color:#eafff0;font-size:34px}
.rkPlocha.vysledok{background:rgba(243,180,83,.14);border-color:var(--gold);font-size:40px}
.rkPlocha.vysledok .pod{font-size:19px}
.rkPlocha:hover{background-image:none}
#rk_pokusy{font-variant-numeric:tabular-nums}
.pravKroky{margin:6px 0 10px;padding-left:1.4em}
.pravKroky li{margin:4px 0}
table.prav{border-collapse:collapse;font-variant-numeric:tabular-nums;width:100%;max-width:460px}
table.prav th,table.prav td{padding:6px 10px;border:1px solid var(--line);text-align:center}
table.prav th{color:var(--muted);font-weight:650}

/* ===== Obrázky „Ako to funguje“ ===== */
/* atribúty fill a font-size v SVG majú prednosť (nízka špecifickosť cez :where) */
.obr :where(text:not([fill])){fill:#e2e8f5}
.obr :where(text:not([font-size])){font-size:20px}
.obr .m{fill:#a3adc6}
.obr .g{fill:#ffd88a}
.obr .bold{font-weight:800}

/* ===== Časť 2: Reflexy a nervy ===== */
.box .h{display:block;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;font-weight:700;color:var(--gold2)}
.box ol,.box ul{margin:4px 0 0;padding-left:1.3em}
.box li{margin:3px 0}
details.zved{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:2px 14px;background:rgba(255,255,255,.02)}
details.zved summary{cursor:pointer;font-weight:650;min-height:48px;display:flex;align-items:center;color:var(--violet)}
details.zved ol{margin:4px 0 10px;padding-left:1.6em;columns:2;column-gap:24px}
.klik svg [data-c]{cursor:pointer}
.kon-o{fill:none;stroke:#6a7aa6;stroke-linecap:round;stroke-linejoin:round}
.kon-i{fill:none;stroke:#1c2742;stroke-linecap:round;stroke-linejoin:round}
.tv{fill:#1c2742;stroke:#6a7aa6;stroke-width:2.5}
.hl .kon-o{stroke:#ffd88a}.hl .kon-i{stroke:#4d3f1c}.hl .tv{fill:#4d3f1c;stroke:#ffd88a;stroke-width:3.5}
.telo .tlm,.mie .tlm{opacity:.3}
.telo .obla,.mie .cast{transition:opacity .3s}
.hitF{fill:transparent;stroke:none}
.mozT{fill:rgba(185,163,255,.2);stroke:#b9a3ff;stroke-width:2.5}
.mozF{fill:none;stroke:#b9a3ff;stroke-width:2}
.cnsMoz .mozT{fill:rgba(255,216,138,.45);stroke:#ffd88a}.cnsMoz .mozF{stroke:#ffd88a}
.biela{fill:#dfe6f5;stroke:#a3adc6;stroke-width:3}
.siva{fill:#8a93a8;stroke:#5d6680;stroke-width:2}
.mie .koren{fill:none;stroke:#6fb4ff;stroke-width:7;stroke-linecap:round}
.mie .nerv{fill:none;stroke:#f3b453;stroke-width:12;stroke-linecap:round}
.mie .uzlina{fill:#1f3866;stroke:#6fb4ff;stroke-width:3}
.mie .hl .koren{stroke:#ffd88a;stroke-width:10}.mie .hl .nerv{stroke:#ffd88a;stroke-width:16}.mie .hl .uzlina{stroke:#ffd88a}
.mie .hl .biela{stroke:#ffd88a;stroke-width:7}.mie .hl .siva{fill:#c4a35c;stroke:#ffd88a;stroke-width:4}
.mie .hit,.telo .hit{fill:none;stroke:transparent;stroke-width:30;stroke-linecap:round;pointer-events:stroke}
.mie .ld,.obr .ld{stroke:#a3adc6;stroke-width:1.5}
.sipka2{fill:#ffd88a;stroke:#1a0e02;stroke-width:1.5}
.skryta{fill:none;stroke:none}
.kostT{fill:#e8dcc0;stroke:#a3906a;stroke-width:2}
.kostS{fill:none;stroke:#e8dcc0;stroke-width:26;stroke-linecap:round}
/* cesty vzruchu v krokovaných animáciách */
.cst{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.2;transition:opacity .3s,stroke-width .3s}
.c-rec{stroke:#ff7a6b}.c-dostr{stroke:#6fb4ff}.c-vloz{stroke:#b9a3ff}.c-odstr{stroke:#7fdc8f}.c-hore{stroke:#ffd88a;stroke-dasharray:9 7}
.cst.bol{opacity:.7}
.cst.akt{opacity:1;stroke-width:9}
.vsetko .cst{opacity:.9}
.sval{fill:rgba(255,122,107,.35);stroke:#ff7a6b;stroke-width:3}
.sval.akt{fill:rgba(255,122,107,.75);stroke:#ffd88a;stroke-width:5}
.tvarC.akt .mozT{fill:rgba(255,216,138,.35);stroke:#ffd88a;stroke-width:4}
.tvarC.akt .biela{stroke:#ffd88a;stroke-width:12}
.bodCesta{fill:#ffd88a;stroke:#1a0e02;stroke-width:2}
.svieca{fill:#e2e8f5}.plamen{fill:#ff7a6b;stroke:#ffd88a;stroke-width:2}
.dlan{fill:#1c2742;stroke:#6a7aa6;stroke-width:2.5}
.ruk .predlaktie{transition:transform .7s ease;transform-origin:180px 290px}
.ruk.uhla .predlaktie{transform:rotate(22deg)}
.ruk .au{opacity:0;transition:opacity .4s;font-size:34px;font-weight:800;fill:#ff7a6b}
.ruk.bolest .au{opacity:1}
.kol .predkolenie{transition:transform .5s ease;transform-origin:300px 186px}
.kol.kop .predkolenie{transform:rotate(-32deg)}
.kol .kladivo{transition:transform .25s ease}
.kol.uder .kladivo{transform:translate(-24px,-8px)}
.kol .kost{fill:#e2e8f5;stroke:#a3adc6;stroke-width:2}
.kol .vaz{stroke:#e2e8f5;stroke-width:5;stroke-linecap:round}
.kol .stolicka{fill:#3a3150;stroke:#6a7aa6;stroke-width:2}
.telo .org{fill:rgba(255,122,107,.25);stroke:#ff7a6b;stroke-width:2}
.telo .chrb{fill:#3a4566}
.telo .chrb.hl{fill:#ffd88a}
.telo .nervL{fill:none;stroke:#6fb4ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.telo .cnsL{fill:none;stroke:#ffd88a;stroke-width:9;stroke-linecap:round}
.telo .vagus{fill:none;stroke:#ffd88a;stroke-width:3;stroke-dasharray:6 5}
.stage.klik svg,.stage svg.telo{max-height:520px;margin:0 auto}
.leg2{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 0;padding:0;list-style:none;font-size:17px}
.leg2 i{display:inline-block;width:24px;height:8px;border-radius:4px;margin-right:6px;vertical-align:middle}
.cestaZoz{display:flex;flex-direction:column;gap:4px}
.cestaZoz .st{padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03)}
.cestaZoz .st.centr{border:2px solid var(--gold);background:rgba(243,180,83,.1)}
.cestaZoz .sip{align-self:center;color:var(--muted);line-height:1}
.tabObal{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px}
table.prav.por{max-width:none}
table.prav.por th:first-child,table.prav.por td:first-child{text-align:left;color:var(--muted)}
.priklady{display:flex;flex-wrap:wrap;gap:8px}

  /* záložky v jednom vodorovnom páse, posúva sa len pás, nie stránka */
  nav.karty,.podkarty{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  nav.karty button,.podkarty button{flex:none;white-space:nowrap}
  .rezim{width:100%}.rezim button{flex:1;padding:8px 6px}
  .pocitadlo .cislo{font-size:40px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><h1 data-t="titul"></h1><p class="sub" data-t="podtitul"></p></header>
<nav class="karty" id="karty" role="tablist" aria-label="Časti animácie"></nav>

<main>
<!-- =================================================================
     ZÁLOŽKA 1: NEURÓN A VZRUCH (časť 1)
     ================================================================= -->
<section id="neuron" data-karta>
  <div class="podkarty" data-podkarty="neuron" role="tablist" aria-label="Karty"></div>

  <!-- ===== KARTA: Neurón ===== -->
  <article class="card" id="k-stavba" data-pod="stavba">
    <div class="hlavaKarty"><h2 data-t="stavba.nadpis"></h2><div class="rezim" role="tablist"></div></div>
    <div data-rezim="ako"></div>
    <div data-rezim="skus" hidden>
      <div class="dva">
        <div>
          <h3 data-t="stavba.skumH"></h3>
          <p data-t="stavba.skumU"></p>
          <div class="neuronObal klik" id="st_neuron"></div>
          <div class="castiTl" id="st_tlacidla" aria-label="Časti neurónu"></div>
          <div class="box info" id="st_info" aria-live="polite"></div>
        </div>
        <div>
          <h3 data-t="stavba.hraH"></h3>
          <p data-t="stavba.hraU"></p>
          <p class="kvStav" id="st_hraStav" aria-live="polite"></p>
          <div class="neuronObal" id="st_hraObr"></div>
          <div class="moznosti" id="st_hraMoz"></div>
          <div class="fb" id="st_hraFb" aria-live="polite"></div>
          <div class="tlac"><button type="button" class="primary" id="st_hraDalej" hidden></button></div>
        </div>
      </div>
      <div class="dva blok">
        <div>
          <h3 data-t="stavba.typyH"></h3>
          <p data-t="stavba.typyU"></p>
          <div class="chipy" id="st_chipy" aria-label="Názvy neurónov"></div>
          <div class="fb" id="st_retazFb" aria-live="polite"></div>
          <div class="tlac"><button type="button" id="st_retazZnova" data-t="ui.znova"></button></div>
          <p class="zjednBox"><span class="zjedn" data-t="ui.zjednodusene"></span><span data-t="stavba.retazZjedn"></span></p>
        </div>
        <div class="retaz" id="st_retaz"></div>
      </div>
    </div>
  </article>

  <!-- ===== KARTA: Nervový impulz (vzruch) ===== -->
  <article class="card" id="k-impulz" data-pod="impulz" hidden>
    <div class="hlavaKarty"><h2 data-t="vzruch.nadpis"></h2><div class="rezim" role="tablist"></div></div>
    <div data-rezim="ako"></div>
    <div data-rezim="skus" hidden>
      <div class="dva">
        <div>
          <h3 data-t="vzruch.skusH"></h3>
          <p data-t="vzruch.skusU"></p>
          <div class="silaRiadok"><label for="im_sila" data-t="vzruch.silaLbl"></label><b id="im_silaHod">0</b></div>
          <div class="slRiadok">
            <button type="button" id="im_menej" aria-label="">−</button>
            <div class="rangeObal"><input type="range" id="im_sila" step="1"><span class="prahZnacka" id="im_prahZn"></span></div>
            <button type="button" id="im_viac" aria-label="">+</button>
          </div>
          <div class="pocitadlo" aria-live="polite"><span class="cislo" id="im_pocet">0</span><span class="lbl" data-t="vzruch.pocetLbl"></span></div>
          <p id="im_stav" aria-live="polite"></p>
          <p class="muted" data-t="vzruch.rovnake"></p>
        </div>
        <div>
          <div class="stage" id="im_axon"></div>
          <div class="stage"><p class="cap" data-t="vzruch.zaznam"></p><div id="im_zaznam"></div></div>
          <p class="muted" style="margin-top:10px" data-t="vzruch.pravidlo"></p>
          <p class="zjednBox"><span class="zjedn" data-t="ui.zjednodusene"></span><span data-t="vzruch.zjedn"></span></p>
        </div>
      </div>
      <div class="blok">
        <h3 data-t="pretek.h"></h3>
        <p data-t="pretek.u"></p>
        <div class="tlac" style="margin-top:0"><button type="button" class="primary" id="pr_start"></button></div>
        <div class="draha"><div class="drahaH"><span data-t="pretek.obal"></span><span class="st" id="pr_stA" aria-live="polite"></span></div>
          <div class="stage" style="margin-top:4px" id="pr_drahaA"></div></div>
        <div class="draha"><div class="drahaH"><span data-t="pretek.bez"></span><span class="st" id="pr_stB" aria-live="polite"></span></div>
          <div class="stage" style="margin-top:4px" id="pr_drahaB"></div></div>
        <p id="pr_vysl" aria-live="polite"></p>
        <div class="box info"><p data-t="pretek.naozaj"></p></div>
        <p class="zjednBox"><span class="zjedn" data-t="ui.zjednodusene"></span><span data-t="pretek.zjedn"></span></p>
      </div>
    </div>
  </article>

  <!-- ===== KARTA: Synapsa ===== -->
  <article class="card" id="k-synapsa" data-pod="synapsa" hidden>
    <div class="hlavaKarty"><h2 data-t="synapsa.nadpis"></h2><div class="rezim" role="tablist"></div></div>
    <div data-rezim="ako"></div>
    <div data-rezim="skus" hidden>
      <div class="dva">
        <div>
          <h3 data-t="synapsa.skusH"></h3>
          <p data-t="synapsa.skusU"></p>
          <div class="stage" id="sy_obr"></div>
        </div>
        <div>
          <p class="krokText" id="sy_text" aria-live="polite"></p>
          <div class="tlac">
            <button type="button" id="sy_spat" data-t="ui.spat"></button>
            <button type="button" class="primary" id="sy_dalej" data-t="ui.dalej"></button>
            <button type="button" id="sy_hraj"></button>
          </div>
          <p class="zjednBox"><span class="zjedn" data-t="ui.zjednodusene"></span><span data-t="synapsa.zjedn"></span></p>
        </div>
      </div>
      <div class="blok">
        <h3 data-t="synapsa.zoradH"></h3>
        <p data-t="synapsa.zoradU"></p>
        <div class="dva">
          <div><p class="muted" data-t="synapsa.zoradZoznam"></p><ol class="zorad" id="sy_hotove"></ol></div>
          <div>
            <div class="moznosti stlpec" id="sy_zostava"></div>
            <div class="fb" id="sy_zoradFb" aria-live="polite"></div>
            <div class="tlac"><button type="button" id="sy_zoradZnova" data-t="ui.znova"></button></div>
          </div>
        </div>
      </div>
    </div>
  </article>

  <!-- ===== KARTA: Ako rýchlo reaguješ? ===== -->
  <article class="card" id="k-reakcia" data-pod="reakcia" hidden>
    <div class="hlavaKarty"><h2 data-t="reakcia.nadpis"></h2><div class="rezim" role="tablist"></div></div>
    <div data-rezim="ako"></div>
    <div data-rezim="skus" hidden>
      <div class="dva">
        <div>
          <h3 data-t="reakcia.skusH"></h3>
          <p data-t="reakcia.skusU"></p>
          <button type="button" class="rkPlocha start" id="rk_plocha"></button>
          <p class="muted" id="rk_hlas" aria-live="assertive" style="position:absolute;left:-9999px"></p>
          <p id="rk_pokusy" style="margin-top:12px"></p>
          <p class="muted" data-t="reakcia.pozn"></p>
          <p class="muted" data-t="reakcia.nic"></p>
        </div>
        <div>
          <h3 data-t="reakcia.pravH"></h3>
          <ol class="pravKroky" id="rk_pravKroky"></ol>
          <table class="prav" id="rk_tab"></table>
          <p class="muted" style="margin-top:8px" data-t="reakcia.pravPozn"></p>
        </div>
      </div>
    </div>
  </article>
</section>

<!-- =================================================================
     ZÁLOŽKA 2: REFLEXY A NERVY (časť 2)
     ================================================================= -->
<section id="reflexy" data-karta hidden>
  <div class="podkarty" data-podkarty="reflexy" role="tablist" aria-label="Karty"></div>

  <!-- ===== KARTA: Reflex a reflexný oblúk ===== -->
  <article class="card" id="k-reflex" data-pod="reflex">
    <div class="hlavaKarty"><h2 data-t="reflex.nadpis"></h2><div class="rezim" role="tablist"></div></div>
    <div data-rezim="ako"></div>
    <div data-rezim="skus" hidden>
      <div class="dva">
        <div>
          <h3 data-t="reflex.rukaH"></h3>
          <p data-t="reflex.rukaU"></p>
          <div class="stage" id="rf_ruka" role="img"></div>
        </div>
        <div>
          <p class="krokText" id="rf_rukaText" aria-live="polite"></p>
          <div class="tlac">
            <button type="button" id="rf_spat" data-t="ui.spat"></button>
            <button type="button" class="primary" id="rf_dalej" data-t="ui.dalej"></button>
            <button type="button" id="rf_hraj"></button>
          </div>
          <div class="silaRiadok" style="margin-top:16px"><label for="rf_rychlost" data-t="reflex.rychlostLbl"></label><b id="rf_rychlostHod"></b></div>
          <div class="slRiadok">
            <button type="button" id="rf_pomalsie">−</button>
            <div class="rangeObal" style="padding-bottom:0"><input type="range" id="rf_rychlost" min="1" max="5" step="1"></div>
            <button type="button" id="rf_rychlejsie">+</button>
          </div>
          <p class="muted" style="margin-top:8px" data-t="reflex.rychlostPozn"></p>
          <p class="zjednBox"><span class="zjedn" data-t="ui.zjednodusene"></span><span data-t="reflex.ako.1.zjedn"></span></p>
        </div>
      </div>
      <div class="dva blok">
        <div>
          <h3 data-t="reflex.kolenoH"></h3>
          <p data-t="reflex.kolenoU"></p>
          <div class="stage klik" id="rf_koleno" role="img"></div>
          <div class="tlac"><button type="button" class="primary" id="rf_tukni" data-t="reflex.tukni"></button></div>
          <p class="krokText" id="rf_kolenoText" aria-live="polite"></p>
        </div>
        <div>
          <div class="box zlty"><span class="h" data-t="reflex.pokusH"></span><ol id="rf_pokus"></ol></div>
        </div>
      </div>
      <div class="blok">
        <h3 data-t="reflex.porH"></h3>
        <div class="dva" id="rf_porovnanie"></div>
        <div class="tabObal"><table class="prav por" id="rf_tab"></table></div>
        <h3 style="margin-top:18px" data-t="reflex.prikladyH"></h3>
        <div class="priklady" id="rf_priklady"></div>
        <p class="muted" style="margin-top:8px" data-t="reflex.prikladyPozn"></p>
      </div>
      <div class="dva blok">
        <div>
          <h3 data-t="reflex.zoradH"></h3>
          <p data-t="reflex.zoradU"></p>
          <p class="ulohaBox" id="rf_zoradPrik"></p>
          <div class="chipy" id="rf_chipy" aria-label="Položky oblúka"></div>
          <div class="fb" id="rf_zoradFb" aria-live="polite"></div>
          <div class="tlac"><button type="button" id="rf_zoradNovy" data-t="reflex.zoradNovy"></button></div>
        </div>
        <div class="retaz" id="rf_oblukSloty"></div>
      </div>
    </div>
  </article>

  <!-- ===== KARTA: Miecha ===== -->
  <article class="card" id="k-miecha" data-pod="miecha" hidden>
    <div class="hlavaKarty"><h2 data-t="miecha.nadpis"></h2><div class="rezim" role="tablist"></div></div>
    <div data-rezim="ako"></div>
    <div data-rezim="skus" hidden>
      <div class="dva">
        <div>
          <h3 data-t="miecha.skumH"></h3>
          <p data-t="miecha.skumU"></p>
          <div class="stage klik" id="mi_obr"></div>
        </div>
        <div>
          <div class="castiTl" id="mi_tl" aria-label="Časti miechy"></div>
          <div class="box info" id="mi_info" aria-live="polite"></div>
          <div class="box zlty"><span class="h" data-t="miecha.pozorH"></span><p data-t="miecha.pozor"></p></div>
        </div>
      </div>
      <div class="dva blok">
        <div>
          <h3 data-t="miecha.smerH"></h3>
          <p data-t="miecha.smerU"></p>
          <div class="chipy" id="mi_sipky" aria-label="Šípky"></div>
          <div class="fb" id="mi_smerFb" aria-live="polite"></div>
          <div class="tlac"><button type="button" id="mi_smerZnova" data-t="ui.znova"></button></div>
          <div class="stage" id="mi_smerObr"></div>
        </div>
        <div class="retaz" id="mi_situacie"></div>
      </div>
    </div>
  </article>

  <!-- ===== KARTA: Nervy ===== -->
  <article class="card" id="k-nervy" data-pod="nervy" hidden>
    <div class="hlavaKarty"><h2 data-t="nervy.nadpis"></h2><div class="rezim" role="tablist"></div></div>
    <div data-rezim="ako"></div>
    <div data-rezim="skus" hidden>
      <div class="dva">
        <div>
          <h3 data-t="nervy.teloH"></h3>
          <p data-t="nervy.teloU"></p>
          <div class="stage klik" id="ne_telo"></div>
        </div>
        <div>
          <div class="castiTl" id="ne_tl" aria-label="Časti tela"></div>
          <div class="box info" id="ne_info" aria-live="polite"></div>
          <p class="zjednBox"><span class="zjedn" data-t="ui.zjednodusene"></span><span data-t="nervy.teloZjedn"></span></p>
          <details class="zved"><summary data-t="nervy.hlavH"></summary><ol id="ne_hlavove"></ol></details>
        </div>
      </div>
      <div class="dva blok">
        <div>
          <h3 data-t="nervy.cestaH"></h3>
          <p data-t="nervy.cestaU"></p>
          <div class="stage" id="ne_cesta" role="img"></div>
        </div>
        <div>
          <p class="krokText" id="ne_cestaText" aria-live="polite"></p>
          <div class="tlac">
            <button type="button" id="ne_spat" data-t="ui.spat"></button>
            <button type="button" class="primary" id="ne_dalej" data-t="ui.dalej"></button>
            <button type="button" id="ne_hraj"></button>
          </div>
        </div>
      </div>
      <div class="blok">
        <h3 data-t="nervy.nnH"></h3>
        <p data-t="nervy.nnU"></p>
        <div id="ne_hra"></div>
      </div>
    </div>
  </article>

  <!-- ===== KARTA: Obvodová nervová sústava ===== -->
  <article class="card" id="k-obvod" data-pod="obvod" hidden>
    <div class="hlavaKarty"><h2 data-t="obvod.nadpis"></h2><div class="rezim" role="tablist"></div></div>
    <div data-rezim="ako"></div>
    <div data-rezim="skus" hidden>
      <div class="dva">
        <div>
          <h3 data-t="obvod.skusH"></h3>
          <p data-t="obvod.skusU"></p>
          <div class="silaRiadok"><label for="ob_x" data-t="obvod.xLbl"></label><b id="ob_xHod">0</b></div>
          <div class="slRiadok">
            <button type="button" id="ob_menej">−</button>
            <div class="rangeObal" style="padding-bottom:0"><input type="range" id="ob_x" min="0" max="100" step="1"></div>
            <button type="button" id="ob_viac">+</button>
          </div>
          <div class="kraje"><span data-t="obvod.kraj0"></span><span data-t="obvod.kraj1"></span></div>
          <div class="stage" id="ob_obr" role="img"></div>
          <p class="muted" style="margin-top:8px" data-t="obvod.srdcePozn"></p>
        </div>
        <div>
          <div class="ukazovatele" id="ob_ukaz" aria-live="polite"></div>
          <p class="zjednBox"><span class="zjedn" data-t="ui.zjednodusene"></span><span data-t="obvod.zjedn"></span></p>
        </div>
      </div>
      <div class="blok">
        <h3 data-t="obvod.hraH"></h3>
        <p data-t="obvod.hraU"></p>
        <div id="ob_hra"></div>
      </div>
    </div>
  </article>
</section>
<!-- =================================================================
     ZÁLOŽKA 3: MOZOG (časť 3)
     ================================================================= -->
<section id="mozog" data-karta hidden>
  <div class="podkarty" data-podkarty="mozog" role="tablist" aria-label="Karty"></div>

  <!-- ===== KARTA: Ochrana a stavba mozgu ===== -->
  <article class="card" id="k-ochrana" data-pod="ochrana">
    <div class="hlavaKarty"><h2 data-t="lebka.nadpis"></h2><div class="rezim" role="tablist"></div></div>
    <div data-rezim="ako"></div>
    <div data-rezim="skus" hidden>
      <div class="dva">
        <div>
          <h3 data-t="lebka.skumH"></h3>
          <p data-t="lebka.skumU"></p>
          <div class="stage klik" id="lb_obr"></div>
          <p class="zjednBox"><span class="zjedn" data-t="ui.zjednodusene"></span><span data-t="lebka.zjedn"></span></p>
        </div>
        <div>
          <div class="castiTl" id="lb_tl" aria-label="Vrstvy"></div>
          <div class="box info" id="lb_info" aria-live="polite"></div>
        </div>
      </div>
      <div class="blok">
        <h3 data-t="lebka.zoradH"></h3>
        <p data-t="lebka.zoradU"></p>
        <div class="dva">
          <div><p class="muted" data-t="lebka.zoradZoznam"></p><ol class="zorad" id="lb_hotove"></ol></div>
          <div>
            <div class="moznosti stlpec" id="lb_zostava"></div>
            <div class="fb" id="lb_zoradFb" aria-live="polite"></div>
            <div class="tlac"><button type="button" id="lb_zoradZnova" data-t="ui.znova"></button></div>
          </div>
        </div>
      </div>
    </div>
  </article>

  <!-- ===== KARTA: Časti mozgu ===== -->
  <article class="card" id="k-castiMozgu" data-pod="castiMozgu" hidden>
    <div class="hlavaKarty"><h2 data-t="mozog.nadpis"></h2><div class="rezim" role="tablist"></div></div>
    <div data-rezim="ako"></div>
    <div data-rezim="skus" hidden>
      <div class="dva">
        <div>
          <h3 data-t="mozog.skumH"></h3>
          <p data-t="mozog.skumU"></p>
          <div class="stage klik" id="mz_obr"></div>
          <p class="zjednBox"><span class="zjedn" data-t="ui.zjednodusene"></span><span data-t="mozog.zjedn"></span></p>
        </div>
        <div>
          <div class="castiTl" id="mz_tl" aria-label="Časti mozgu"></div>
          <div class="box info" id="mz_info" aria-live="polite"></div>
        </div>
      </div>
      <div class="dva blok">
        <div>
          <h3 data-t="mozog.ktoH"></h3>
          <p data-t="mozog.ktoU"></p>
          <div class="chipy" id="mz_chipy" aria-label="Situácie"></div>
          <div class="fb" id="mz_ktoFb" aria-live="polite"></div>
          <div class="tlac"><button type="button" id="mz_ktoZnova" data-t="ui.znova"></button></div>
          <p class="zjednBox"><span class="zjedn" data-t="ui.zjednodusene"></span><span data-t="mozog.ktoZjedn"></span></p>
        </div>
        <div class="retaz" id="mz_sloty"></div>
      </div>
    </div>
  </article>

  <!-- ===== KARTA: Koncový mozog a kôra ===== -->
  <article class="card" id="k-kora" data-pod="kora" hidden>
    <div class="hlavaKarty"><h2 data-t="kora.nadpis"></h2><div class="rezim" role="tablist"></div></div>
    <div data-rezim="ako"></div>
    <div data-rezim="skus" hidden>
      <div class="dva">
        <div>
          <h3 data-t="kora.skumH"></h3>
          <p data-t="kora.skumU"></p>
          <div class="stage klik" id="ko_obr"></div>
          <p class="zjednBox"><span class="zjedn" data-t="ui.zjednodusene"></span><span data-t="kora.recZjedn"></span></p>
        </div>
        <div>
          <div class="castiTl" id="ko_tl" aria-label="Laloky a oblasti"></div>
          <div class="box info" id="ko_info" aria-live="polite"></div>
        </div>
      </div>
      <div class="dva blok">
        <div>
          <h3 data-t="kora.stranyH"></h3>
          <p data-t="kora.stranyU"></p>
          <div class="stranyTl" id="ko_strany" aria-label="Voľby"></div>
          <p id="ko_veta" aria-live="polite"></p>
          <div class="box info"><p data-t="kora.pravidlo"></p><p class="muted" data-t="kora.zrakPozn"></p></div>
        </div>
        <div>
          <div class="stage" id="ko_hem" role="img"></div>
          <p class="muted" style="margin-top:8px" data-t="kora.stranyPozn"></p>
        </div>
      </div>
    </div>
  </article>

<!-- ťahák na tlač (mimo .wrap; pri tlači sa zobrazí len on) -->
<div class="tlacList" id="tahakTlac" aria-hidden="true"></div>

<script>
/* =====================================================================
   POMOCNÉ FUNKCIE
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const MALO_POHYBU = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function cesta(o, p) { return p.split('.').reduce((x, k) => x == null ? x : x[k], o); }
function vypln(t, o) { return String(t).replace(/\{(\w+)\}/g, (x, k) => (o && o[k] !== undefined) ? o[k] : x); }
// slovenské tvary: 1 vzruch, 2 – 4 vzruchy, 0 a 5+ vzruchov
function tvar(n, [jeden, dva, pat]) { return n === 1 ? jeden : n >= 2 && n <= 4 ? dva : pat; }
const nahoda = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const vyber = a => a[Math.floor(Math.random() * a.length)];
function zamiesaj(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const velke = s => s.charAt(0).toUpperCase() + s.slice(1);
const bezHtml = s => String(s).replace(/<[^>]+>/g, '');
const ciarka = x => String(x).replace('.', ',');

/* --- animácia cez requestAnimationFrame: animuj(trvanie_ms, krok(u ∈ [0,1]), hotovo) --- */
function animuj(trvanie, krok, hotovo) {
  if (MALO_POHYBU || trvanie <= 0) { krok(1); if (hotovo) hotovo(); return () => {}; }
  const t0 = performance.now(); let id = 0, zrus = false;
  const f = now => {
    if (zrus) return;
    const u = Math.min(1, Math.max(0, (now - t0) / trvanie));
    krok(1 - Math.pow(1 - u, 3));
    if (u < 1) id = requestAnimationFrame(f); else if (hotovo) hotovo();
  };
  id = requestAnimationFrame(f);
  return () => { zrus = true; cancelAnimationFrame(id); };
}
/* --- plynulé objavenie panelu --- */
function objav(el) {
  el.style.opacity = 0;
  animuj(260, u => { el.style.opacity = u; el.style.transform = `translateY(${(1 - u) * 8}px)`; },
    () => { el.style.opacity = ''; el.style.transform = ''; });
}
/* --- klávesnica v zozname záložiek: šípky vľavo/vpravo, Home, End --- */
function sipkyZaloziek(lista) {
  lista.addEventListener('keydown', e => {
    const bb = $$('[role=tab]', lista); const i = bb.indexOf(document.activeElement);
    if (i < 0) return;
    let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % bb.length;
    else if (e.key === 'ArrowLeft') j = (i - 1 + bb.length) % bb.length;
    else if (e.key === 'Home') j = 0; else if (e.key === 'End') j = bb.length - 1;
    if (j !== null) { e.preventDefault(); bb[j].focus(); bb[j].click(); }
  });
}
const castPodla = id => NS.casti.find(c => c.id === id);
const typPodla = id => NS.typy.find(t => t.id === id);
// „dostredivý (senzitívny)“
const typNazov = id => { const t = typPodla(id); return t.nazov + (t.inak ? ` (${t.inak})` : ''); };
// názov článku reťaze: receptor, dostredivý (senzitívny) neurón, …, sval
const clanokNazov = id => NS.retaz[id] ? NS.retaz[id].nazov : typNazov(id) + ' neurón';
const zjednBox = veta => `<p class="zjednBox"><span class="zjedn">${NS.ui.zjednodusene}</span>${veta}</p>`;

/* =====================================================================
   REGISTER REG – zbiera pojmy (slovník), kvízové otázky a fakty.
   Kvíz a slovník sa v časti 7 postavia výhradne odtiaľto.
   ===================================================================== */
const REG = { pojmy: [], kviz: [], fakty: [] };
function registerTerm(pojem, definicia, cast) {
  if (REG.pojmy.some(p => p.pojem === pojem)) return;            // pojem len raz
  REG.pojmy.push({ pojem, definicia, cast });
}
// generátor vráti { zadanie, moznosti: [4 texty], spravna: index, vysvetlenie }
function registerQuiz(id, cast, generator) {
  if (REG.kviz.some(q => q.id === id)) throw new Error('Kvízová otázka ' + id + ' už existuje.');
  REG.kviz.push({ id, cast, generator });
}
function registerFact(text, cast) { REG.fakty.push({ text, cast }); }
// pomocník pre generátory: zamieša 1 správnu a 3 nesprávne možnosti
function otazka(zadanie, spravna, nespravne, vysvetlenie) {
  const moznosti = zamiesaj([spravna, ...nespravne.slice(0, 3)]);
  return { zadanie, moznosti, spravna: moznosti.indexOf(spravna), vysvetlenie };
}

/* =====================================================================
   MODEL – výpočty z konštánt v NS (testy ich overujú)
   ===================================================================== */
const MODEL = {
  // počet vzruchov za sekundu pri danej sile podnetu (Zjednodušený model)
  frekvencia(sila) {
    const v = NS.vzruch;
    if (!(sila >= v.prah)) return 0;
    return Math.min(v.strop, v.zakladna + Math.floor((sila - v.prah) / v.krok));
  },
  // vzruchy za daný čas (s): rovnomerne rozložené, každý s rovnakou amplitúdou
  vzruchyZa(sila, trvanie = 1) {
    const f = this.frekvencia(sila), n = Math.round(f * trvanie);
    return Array.from({ length: n }, (_, k) => ({ t: (k + 0.5) / f, amplituda: NS.vzruch.amplituda }));
  },
  // pretek: čas v cieli (s) pre oba axóny
  casObal: () => NS.pretek.casBez / NS.pretek.pomer,
  // poloha 0 … 1 v čase t (s); obalený skáče po zárezoch (useky), neobalený ide plynulo
  pretekPoloha(t) {
    const P = NS.pretek, N = P.useky, tObal = this.casObal();
    const skoky = Math.floor(t / (tObal / N) + 1e-9);
    return { obal: Math.min(1, skoky / N), bez: Math.min(1, t / P.casBez), skoky: Math.min(N, skoky) };
  },
  // simulácia preteku s krokom dt – vráti časy dobehnutia (pre test)
  pretekSimuluj(dt = 0.001) {
    const ciel = { obal: null, bez: null };
    for (let i = 0; i < 1e6 && (ciel.obal === null || ciel.bez === null); i++) {
      const t = i * dt, p = this.pretekPoloha(t);
      if (ciel.obal === null && p.obal >= 1) ciel.obal = t;
      if (ciel.bez === null && p.bez >= 1) ciel.bez = t;
    }
    return ciel;
  },
  // náhodné čakanie na zmenu (ms) pre náhodné číslo r ∈ [0, 1)
  cakanie(r) { const R = NS.reakcia; return R.minCakanie + r * (R.maxCakanie - R.minCakanie); },
  // čas pádu pravítka (ms) pre dráhu v cm: t = √(2s / g)
  pravitkoMs(cm) { return Math.sqrt(2 * (cm / 100) / NS.reakcia.pravitko.g) * 1000; }
};

/* =====================================================================
   REGISTRÁCIA pojmov, faktov a kvízových otázok (časť 1)
   ===================================================================== */
const CAST = 1;
NS.pojmy.forEach(p => registerTerm(p.pojem, p.def, p.cast || CAST));      // cast chýba = časť 1
NS.fakty.forEach(f => registerFact(f.text, f.cast || CAST));
const K = NS.kviz;
// karta Neurón
registerQuiz('neuron-cast', CAST, () => {
  const c = vyber(NS.casti), ine = zamiesaj(NS.casti.filter(x => x !== c)).slice(0, 3);
  return otazka(vypln(K.cast, { uloha: c.uloha }), c.nazov, ine.map(x => x.nazov), `${velke(c.nazov)}: ${c.uloha}`);
});
registerQuiz('neuron-typ', CAST, () => {
  const t = vyber(NS.typy);
  return otazka(vypln(K.typ, { smer: t.smer }), typNazov(t.id), [...NS.typy.filter(x => x !== t).map(x => typNazov(x.id)), K.gliova],
    `${velke(typNazov(t.id))} neurón ${t.smer}.`);
});
registerQuiz('neuron-retaz', CAST, () => {
  const seq = [...NS.retaz.clanky, NS.retaz.ciel], i = nahoda(0, seq.length - 2);
  return otazka(vypln(K.retaz, { c: clanokNazov(seq[i]) }), clanokNazov(seq[i + 1]),
    seq.filter((x, j) => j !== i && j !== i + 1).map(clanokNazov), K.retazVysv);
});
// karta Vzruch
registerQuiz('vzruch-pocet', CAST, () => {
  const s = vyber([10, 20, 29, 30, 35, 41, 50, 64, 75, 88, 99, 100]), r = MODEL.frekvencia(s);
  const ine = zamiesaj([r + 1, r - 1, r + 2, r - 2, r + 3].filter(x => x >= 0 && x <= 10)).slice(0, 3);
  const k = Math.floor((s - 30) / 10);
  const vysv = r === 0 ? vypln(K.pocetPod, { s }) : vypln(K.pocetNad, { s, k, r: Math.min(2 + k, 9), strop: 2 + k > 9 ? ', ale najviac 9' : '' });
  return otazka(vypln(K.pocet, { s }), String(r), ine.map(String), vysv);
});
registerQuiz('vzruch-silnejsi', CAST, () => otazka(K.silnejsi.z, K.silnejsi.ok, K.silnejsi.zle, K.silnejsi.vysv));
registerQuiz('vzruch-myelin', CAST, () => otazka(K.myelin.z, K.myelin.ok, K.myelin.zle, K.myelin.vysv));
// karta Synapsa
registerQuiz('synapsa-poradie', CAST, () => {
  const kr = NS.synapsa.kroky, i = nahoda(0, kr.length - 2);
  return otazka(vypln(K.synKrok, { k: kr[i] }), kr[i + 1], kr.filter((x, j) => j !== i && j !== i + 1), K.synVysv);
});
registerQuiz('synapsa-latka', CAST, () => otazka(K.latka.z, K.latka.ok, K.latka.zle, K.latka.vysv));
// karta Reakcia
registerQuiz('reakcia-poradie', CAST, () => {
  const c = NS.reakcia.casti, i = nahoda(0, c.length - 2);
  return otazka(vypln(K.reakKrok, { k: c[i] }), c[i + 1], c.filter((x, j) => j !== i && j !== i + 1), K.reakVysv);
});
registerQuiz('reakcia-cas', CAST, () => otazka(K.reakCas.z, K.reakCas.ok, K.reakCas.zle, K.reakCas.vysv));
// ku ktorej karte patrí kvízová otázka (pre test „každá karta má otázku“)
const KVIZ_KARTA = { stavba: ['neuron-cast', 'neuron-typ', 'neuron-retaz'], impulz: ['vzruch-pocet', 'vzruch-silnejsi', 'vzruch-myelin'],
  synapsa: ['synapsa-poradie', 'synapsa-latka'], reakcia: ['reakcia-poradie', 'reakcia-cas'] };
/* ----- REGISTRÁCIA (časť 2): kvízové otázky ----- */
const CAST2 = 2;
// karta Reflex
registerQuiz('reflex-oblukPoradie', CAST2, () => {
  const c = NS.reflex.oblukCasti.map(x => x.nazov), i = nahoda(0, c.length - 2);
  return otazka(vypln(K.oblPoradie, { c: c[i] }), c[i + 1], c.filter((x, j) => j !== i && j !== i + 1), K.oblVysv);
});
registerQuiz('reflex-oblukCast', CAST2, () => {
  const p = vyber(NS.reflex.priklady), k = nahoda(0, 4), c = NS.reflex.oblukCasti.map(x => x.nazov);
  return otazka(vypln(K.oblCast, { p: p.nazov, x: p.casti[k] }), c[k], zamiesaj(c.filter((x, j) => j !== k)).slice(0, 3), vypln(K.oblCastVysv, { x: velke(p.casti[k]), c: c[k] }));
});
registerQuiz('reflex-ktory', CAST2, () => otazka(K.ktory, vyber(NS.reflex.prikladyR).n, zamiesaj(NS.reflex.volove).slice(0, 3), K.ktoryVysv));
registerQuiz('reflex-neurony', CAST2, () => {
  const [kl, txt] = vyber([['stiahnutie', K.neurRuka], ['koleno', K.neurKoleno]]), r = NS.reflex[kl].neurony.length;
  return otazka(vypln(K.neurony, { r: txt }), String(r), [1, 2, 3, 4].filter(x => x !== r).map(String), K.neurVysv);

/* =====================================================================
   SVG: NEURÓN – jedna kresba pre obrázok, preskúmanie aj hru
   ===================================================================== */
const NEURON_GEO = {
  dendrity: 'M86 104 L56 72 L30 60 M56 72 L50 42 M80 125 L42 125 L16 110 M42 125 L18 142 M86 148 L58 180 L34 194 M58 180 L64 212 M114 90 L108 56 L90 36 M108 56 L130 32',
  soma: 'M80 105 Q95 82 120 88 Q150 95 152 120 Q155 148 125 160 Q95 166 80 148 Q68 128 80 105 Z',
  myelin: [178, 252, 326, 400],     // začiatky úsekov (šírka 58)
  uzly: [236, 310, 384],            // Ranvierove zárezy (šírka 16)
  terminaly: 'M500 122 L540 76 L572 54 M540 76 L574 88 M500 122 L556 122 L586 110 M556 122 L586 136 M500 122 L540 168 L574 158 M540 168 L572 192',
  bulby: [[572, 54], [574, 88], [586, 110], [586, 136], [574, 158], [572, 192]],
  // značka: [kotva x, y, značka x, y]
  znacky: { telo: [128, 148, 160, 220], dendrity: [36, 58, 26, 26], axon: [478, 122, 478, 54],
    myelin: [281, 109, 281, 46], ranvier: [318, 134, 318, 210], zakoncenia: [566, 186, 520, 226] }
};
// o: { zvyrazni: id | [id], znacky: [id], otaznik: bool }
function neuronSVG(o = {}) {
  const G = NEURON_GEO, zv = o.zvyrazni ? [].concat(o.zvyrazni) : [];
  const cls = id => 'cast' + (zv.includes(id) ? ' hl' : zv.length ? ' tlm' : '');
  let s = `<svg class="neuronSvg" viewBox="0 0 600 250" aria-hidden="true">`;
  s += `<g class="${cls('dendrity')}" data-c="dendrity"><path class="hit" d="${G.dendrity}"/><path class="dend" d="${G.dendrity}"/></g>`;
  s += `<g class="${cls('axon')}" data-c="axon"><path class="hit" d="M152 122 L178 122 M458 122 L500 122"/><path class="axon" d="M150 122 L502 122"/></g>`;
  s += `<g class="${cls('myelin')}" data-c="myelin">` + G.myelin.map(x => `<rect class="myel" x="${x}" y="109" width="58" height="26" rx="12"/>`).join('') + '</g>';
  s += `<g class="${cls('ranvier')}" data-c="ranvier">` + G.uzly.map(x => `<rect class="hitF" x="${x - 6}" y="92" width="28" height="60"/><rect class="uzol" x="${x}" y="106" width="16" height="32" rx="4"/>`).join('') + '</g>';
  s += `<g class="${cls('zakoncenia')}" data-c="zakoncenia"><path class="hit" d="${G.terminaly}"/><path class="term" d="${G.terminaly}"/>` +
    G.bulby.map(([x, y]) => `<circle class="bulb" cx="${x}" cy="${y}" r="8"/>`).join('') + '</g>';
  s += `<g class="${cls('telo')}" data-c="telo"><path class="soma" d="${G.soma}"/><circle class="jadro" cx="114" cy="124" r="15"/></g>`;
  for (const id of (o.znacky || [])) {
    const [ax, ay, zx, zy] = G.znacky[id], cis = NS.casti.findIndex(c => c.id === id) + 1;
    s += `<g class="zn"><line class="znL" x1="${ax}" y1="${ay}" x2="${zx}" y2="${zy}"/><circle class="znC" cx="${zx}" cy="${zy}" r="22"/>` +
      `<text class="znT" x="${zx}" y="${zy + 9}">${o.otaznik ? '?' : cis}</text></g>`;
  }
  return s + '</svg>';
}
// malý neurón (ikonka) – telo vľavo, axón doprava
function miniNeuron(x, y, w, f = '#6fb4ff') {
  return `<g stroke="${f}" stroke-width="3" stroke-linecap="round" fill="none">` +
    `<path d="M${x + 6} ${y - 6} L${x - 6} ${y - 15} M${x + 6} ${y + 6} L${x - 6} ${y + 15} M${x + 2} ${y} L${x - 9} ${y}"/>` +
    `<path d="M${x + 26} ${y} L${x + w - 12} ${y} L${x + w} ${y - 9} M${x + w - 12} ${y} L${x + w} ${y + 9}"/></g>` +
    `<circle cx="${x + 14}" cy="${y}" r="12" fill="#1f3866" stroke="${f}" stroke-width="3"/>` +
    `<circle cx="${x + w + 2}" cy="${y - 10}" r="4.5" fill="#7fdc8f"/><circle cx="${x + w + 2}" cy="${y + 10}" r="4.5" fill="#7fdc8f"/>`;
}
// zvislá šípka nadol
const sipkaV = (x, y1, y2, f = '#a3adc6') => `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2 - 8}" stroke="${f}" stroke-width="3"/><path d="M${x - 8} ${y2 - 10} L${x} ${y2} L${x + 8} ${y2 - 10} Z" fill="${f}"/>`;
// tvar jedného vzruchu (rovnaká výška h pre všetky)
const spike = (x, base, h) => `M${x - 18} ${base} L${x - 6} ${base} L${x} ${base - h} L${x + 6} ${base + 8} L${x + 12} ${base} L${x + 18} ${base}`;

/* =====================================================================
   SVG: SYNAPSA – stav podľa kroku 0 (pokoj) až 5
   ===================================================================== */
const SYN = {
  domov: [[135, 115], [180, 145], [225, 95], [285, 125]],   // mechúriky v pokoji
  pristav: [140, 190, 240, 290],                         // x pri okraji = x receptorov
  mol: [[-8, -6], [8, -5], [0, 8]]                       // molekuly v mechúriku
};
function synStav(krok) {
  const vez = [], mol = [];
  SYN.domov.forEach(([hx, hy], j) => {
    const x = SYN.pristav[j];
    const v = krok >= 2 ? { x, y: 158, o: krok >= 3 ? 0 : 1 } : { x: hx, y: hy, o: 1 };
    vez.push(v);
    SYN.mol.forEach(([dx, dy], k) => {
      if (krok <= 2) mol.push({ x: v.x + dx, y: v.y + dy, o: 1 });
      else if (krok === 3) mol.push({ x: x + [-13, 12, 0][k], y: [191, 194, 201][k], o: 1 });
      else mol.push(k === 0 ? { x, y: 208, o: 1 } : { x: x + [0, -15, 14][k], y: [0, 190, 193][k], o: 1 });
    });
  });
  return { vez, mol, pre: krok === 1 ? { x: 210, y: 42, o: 1 } : { x: 210, y: krok === 0 ? -20 : 90, o: 0 },
    post: krok === 5 ? { x: 210, y: 285, o: 1 } : { x: 210, y: 240, o: 0 }, rec: krok >= 4 };
}
const synTr = p => `transform:translate(${p.x}px,${p.y}px);opacity:${p.o}`;
// popisy: zoznam kľúčov z NS.synapsa.lbl, smer: šípka smeru prenosu
function synapsaSVG(krok, popisy = [], smer = false) {
  const st = synStav(krok), L = NS.synapsa.lbl;
  let s = `<svg class="syn obr" viewBox="0 0 560 340" aria-hidden="true">`;
  s += `<path class="pre" d="M185 0 L185 30 C185 60 75 70 75 135 L75 165 Q75 180 90 180 L330 180 Q345 180 345 165 L345 135 C345 70 235 60 235 30 L235 0 Z"/>`;
  s += `<path class="post" d="M40 340 L40 230 Q40 215 55 215 L365 215 Q380 215 380 230 L380 340 Z"/>`;
  s += `<g class="rec${st.rec ? ' akt' : ''}">` + SYN.pristav.map(x => `<path d="M${x - 11} 202 L${x - 11} 215 L${x + 11} 215 L${x + 11} 202"/>`).join('') + '</g>';
  s += st.vez.map((v, j) => `<g class="sEl" data-v="${j}" style="${synTr(v)}"><circle class="vez" r="20"/></g>`).join('');
  s += st.mol.map((m, j) => `<g class="sEl" data-m="${j}" style="${synTr(m)}"><circle class="mol" r="5.5"/></g>`).join('');
  s += `<g class="sEl" data-i="pre" style="${synTr(st.pre)}"><circle class="impG" r="22"/><circle class="imp" r="11"/><text x="18" y="8" class="g" font-size="20">${L.vzruch}</text></g>`;
  s += `<g class="sEl" data-i="post" style="${synTr(st.post)}"><circle class="impG" r="22"/><circle class="imp" r="11"/><text x="28" y="8" class="g" font-size="20">${L.novy}</text></g>`;
  const pop = {
    zakoncenie: [400, 64, 340, 104], mechuriky: [400, 124, 306, 125], neurotransmiter: [400, 160, 290, 192],
    strbina: [400, 200, 362, 198], receptory: [400, 246, 302, 210], dalsia: [400, 300, 366, 300]
  };
  for (const k of popisy) {
    const [tx, ty, x2, y2] = pop[k];
    s += `<line class="ld" x1="${tx - 6}" y1="${ty - 7}" x2="${x2}" y2="${y2}"/><text class="lbl" x="${tx}" y="${ty}">${L[k]}</text>`;
  }
  if (smer) s += `<line x1="440" y1="40" x2="440" y2="280" stroke="#ffd88a" stroke-width="6"/><path class="smer" d="M424 276 L440 310 L456 276 Z"/>` +
    `<text class="lbl" x="458" y="160">${L.smer}</text><text class="lbl" x="458" y="188">${L.smer2}</text>`;
  return s + '</svg>';
}
// posun prvkov synapsy na nový krok (s prechodom cez CSS)
function nastavSynapsu(svg, krok) {
  const st = synStav(krok);
  $$('[data-v]', svg).forEach(g => g.setAttribute('style', synTr(st.vez[+g.dataset.v])));
  $$('[data-m]', svg).forEach(g => g.setAttribute('style', synTr(st.mol[+g.dataset.m])));
  $('[data-i="pre"]', svg).setAttribute('style', synTr(st.pre));
  $('[data-i="post"]', svg).setAttribute('style', synTr(st.post));
  $('.rec', svg).classList.toggle('akt', st.rec);
}

/* =====================================================================
   STAV, REŽIMY A STRANY „AKO TO FUNGUJE“
   ===================================================================== */
const STAV = { karta: 'neuron', pod: {}, rezim: {}, strana: {} };
function nastavRezim(pod, rezim, bezAnimacie) {
  STAV.rezim[pod] = rezim;
  const art = $(`[data-pod="${pod}"]`);
  $$('.hlavaKarty .rezim button', art).forEach(b => { const on = b.dataset.r === rezim; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  $$('[data-rezim]', art).forEach(d => { const on = d.dataset.rezim === rezim; d.hidden = !on; if (on && !bezAnimacie) objav(d); });
  priZmene();
  ulozAdresu();
}
function vytvorRezim(pod) {
  const art = $(`[data-pod="${pod}"]`), r = $('.hlavaKarty .rezim', art);
  r.innerHTML = `<button type="button" role="tab" data-r="ako"><span class="ik" aria-hidden="true">📖</span>${NS.rezim.ako}</button>` +
    `<button type="button" role="tab" data-r="skus"><span class="ik" aria-hidden="true">✋</span>${NS.rezim.skus}</button>`;
  $$('button', r).forEach(b => b.onclick = () => nastavRezim(pod, b.dataset.r));
  sipkyZaloziek(r);
}
// strana „Ako to funguje“: vľavo obrázok, vpravo najviac 4 vety
function kresliAko(pod, strany, bezAnimacie) {
  const art = $(`[data-pod="${pod}"]`), obal = $('[data-rezim="ako"]', art);
  const i = STAV.strana[pod], s = strany[i], obr = OBR[s.obr]();
  const text = (s.zved ? `<span class="zvedTag">${NS.ui.zvedavi}</span>` : '') +
    '<ol class="vety">' + s.vety.map(v => `<li>${v}</li>`).join('') + '</ol>' + (s.zjedn ? zjednBox(s.zjedn) : '') +
    (s.hist ? `<p class="zjednBox histBox"><span class="zjedn hist">${NS.ui.historicke}</span>${s.hist}</p>` : '');      // hist od časti 6
  obal.innerHTML = `<div class="ako"><figure role="img" aria-label="${obr.popis}">${obr.svg}</figure><div>${text}</div></div>` +
    (strany.length > 1 ? `<div class="strankovac"><button type="button" data-s="-1" ${i === 0 ? 'disabled' : ''}>${NS.ui.spat}</button>` +
      `<span class="str">${vypln(NS.ui.strana, { i: i + 1, n: strany.length })}</span>` +
      `<button type="button" class="primary" data-s="1" ${i === strany.length - 1 ? 'disabled' : ''}>${NS.ui.dalej}</button></div>` : '');
  $$('.strankovac button', obal).forEach(b => b.onclick = () => {
    STAV.strana[pod] = Math.max(0, Math.min(strany.length - 1, i + +b.dataset.s));
    kresliAko(pod, strany);
    const dalsi = $(`.strankovac button[data-s="${b.dataset.s}"]`, obal);
    (dalsi && !dalsi.disabled ? dalsi : $('.strankovac button:not(:disabled)', obal)).focus();
  });
  if (!bezAnimacie) objav($('.ako', obal));
}

/* =====================================================================
   SPOLOČNÝ KOMPONENT: ťahanie prstom alebo myšou (od časti 2)
   chipy – kontajner s .chip, ciel – selektor miest, polozit(chip, miesto),
   volny(miesto) – dá sa tam položiť? Vráti { poTahu } (čas posledného ťahu,
   aby sa ťuknutie hneď po ťahu nerátalo ako výber).
   ===================================================================== */
function tahanie(chipy, ciel, polozit, volny = () => true) {
  const st = { poTahu: 0 }; let tah = null;
  const cielPod = (x, y) => { const t = document.elementFromPoint(x, y); return t && t.closest ? t.closest(ciel) : null; };
  chipy.addEventListener('pointerdown', e => {
    const b = e.target.closest('.chip'); if (!b || (e.pointerType === 'mouse' && e.button !== 0)) return;
    tah = { b, x0: e.clientX, y0: e.clientY, duch: null, nad: null };
    try { b.setPointerCapture(e.pointerId); } catch (er) { /* nič */ }
  });
  chipy.addEventListener('pointermove', e => {
    if (!tah) return;
    if (!tah.duch && Math.hypot(e.clientX - tah.x0, e.clientY - tah.y0) > 8) {
      tah.duch = tah.b.cloneNode(true); tah.duch.classList.add('duch', 'on'); document.body.appendChild(tah.duch);
    }
    if (!tah.duch) return;
    e.preventDefault();
    tah.duch.style.transform = `translate(${e.clientX - tah.duch.offsetWidth / 2}px,${e.clientY - tah.duch.offsetHeight / 2}px)`;
    const m = cielPod(e.clientX, e.clientY);
    if (m !== tah.nad) { if (tah.nad) tah.nad.classList.remove('nad'); tah.nad = m && volny(m) ? m : null; if (tah.nad) tah.nad.classList.add('nad'); }
  });
  const pusti = e => {
    if (!tah) return;
    const t = tah; tah = null;
    if (!t.duch) return;                           // len ťuknutie – vyrieši click
    t.duch.remove(); if (t.nad) t.nad.classList.remove('nad');
    st.poTahu = performance.now();
    const m = e.type === 'pointerup' ? cielPod(e.clientX, e.clientY) : null;
    if (m && volny(m)) polozit(t.b, m);
  };
  chipy.addEventListener('pointerup', pusti);
  chipy.addEventListener('pointercancel', pusti);
  return st;
}

function initStavba() {

  const kresli = () => {
    obr.innerHTML = neuronSVG({ zvyrazni: vybrana, znacky: vybrana ? [vybrana] : [] });
    $$('button', tl).forEach(b => { const on = b.dataset.c === vybrana; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    const c = vybrana && castPodla(vybrana);
    info.innerHTML = c ? `<span class="nazovCasti"><b>${velke(c.nazov)}</b></span><br>${c.uloha}` : S.skumInfo;
  };

  obr.onclick = e => { const g = e.target.closest('[data-c]'); if (g) zvol(g.dataset.c); };

  const stav = () => hStav.textContent = vypln(S.hraStav, { i: Math.min(H.i + 1, n), n, b: H.body });
  function kolo() {
    H.prvy = true; H.hotovo = false;
    const id = H.poradie[H.i];
    hObr.innerHTML = neuronSVG({ zvyrazni: id, znacky: [id], otaznik: true });
    hMoz.innerHTML = NS.casti.map(c => `<button type="button" data-c="${c.id}">${c.kratky}</button>`).join('');
    hFb.className = 'fb'; hFb.innerHTML = ''; hDal.hidden = true;

  function nova() { H.poradie = zamiesaj(NS.casti.map(c => c.id)); H.i = 0; H.body = 0; H.koniec = false; kolo(); }
  function koniec() {
    H.koniec = true;
    hObr.innerHTML = neuronSVG({ znacky: NS.casti.map(c => c.id) });
    hMoz.innerHTML = '';
    hFb.className = 'fb ok'; hFb.innerHTML = `<span class="h">✓ ${vypln(S.hraKoniec, { b: H.body, n })}</span>`;
    hDal.textContent = S.hraZnova; hDal.hidden = false; hDal.focus();
  }
  hMoz.onclick = e => {
    const b = e.target.closest('button[data-c]'); if (!b || b.disabled || H.hotovo) return;
    const id = H.poradie[H.i], c = castPodla(id);
    if (b.dataset.c === id) {
      H.hotovo = true; if (H.prvy) H.body++;
      b.classList.add('ok'); b.textContent = '✓ ' + b.textContent;
      $$('button', hMoz).forEach(x => { if (x !== b) x.disabled = true; });
      hFb.className = 'fb ok'; hFb.innerHTML = `<span class="h">✓ ${S.hraOk}</span> <b>${velke(c.nazov)}</b>: ${c.uloha}`;
      hDal.textContent = H.i < n - 1 ? S.hraDalsia : S.hraVysledokTl; hDal.hidden = false; hDal.focus();
      stav();
    } else {
      H.prvy = false;
      const zla = castPodla(b.dataset.c);

      hFb.className = 'fb zle'; hFb.innerHTML = `<span class="h">✗ ${vypln(zla.id === 'dendrity' || zla.id === 'ranvier' || zla.id === 'zakoncenia' ? S.hraZle : S.hraZleJ, { n: zla.nazov })}</span>`;

  STAVBA.hraNova = nova; STAVBA.hraTlac = id => $(`button[data-c="${id}"]`, hMoz).click(); STAVBA.hraDalej = () => hDal.click();

  // --- 3. typy neurónov: reťaz ---
  initRetaz();
}
const STAVBA = { hra: { poradie: [], i: 0, body: 0, prvy: true, hotovo: false, koniec: false } };

function initRetaz() {
  const S = NS.stavba, R = NS.retaz, el = $('#st_retaz'), chipy = $('#st_chipy'), fb = $('#st_retazFb');
  const RZ = STAVBA.retaz = { umiestnene: {}, zostava: [], vybrany: null, chyby: 0, tah: { poTahu: 0 } };
  // reťaz: receptor → 3 miesta (neuróny) → sval; prostredné miesto je v centre
  const slot = i => `<button type="button" class="rSlot" data-i="${i}"><svg viewBox="-12 -22 100 44" aria-hidden="true">${miniNeuron(0, 0, 70)}</svg>` +
    `<span><span class="rCis">${vypln(R.slot, { i: i + 1 })}</span><span class="rMiesto"></span></span></button>`;
  const pevny = (k, ikona) => `<div class="rClanok"><span aria-hidden="true" style="font-size:26px">${ikona}</span><span><span class="rN">${R[k].nazov}</span><span class="rP">${R[k].popis}</span></span></div>`;
  const sip = '<span class="rSipka" aria-hidden="true">↓</span>';
  el.innerHTML = pevny('receptor', '◉') + sip + slot(0) + sip +
    `<div class="centrum"><span class="cLbl">${R.centrum}</span>${slot(1)}</div>` + sip + slot(2) + sip + pevny('sval', '💪');
  function kresli() {
    $$('.rSlot', el).forEach(s => {
      const typ = RZ.umiestnene[s.dataset.i];
      s.classList.toggle('plny', !!typ);
      $('.rMiesto', s).innerHTML = typ ? `✓ <b>${typNazov(typ)}</b>` : S.retazPrazdne;
      s.setAttribute('aria-label', vypln(R.slot, { i: +s.dataset.i + 1 }) + ': ' + (typ ? typNazov(typ) : S.retazPrazdne));
    });
    chipy.innerHTML = RZ.zostava.map(id => `<button type="button" class="chip${RZ.vybrany === id ? ' on' : ''}" data-typ="${id}" aria-pressed="${RZ.vybrany === id}">${typNazov(id)}</button>`).join('');
  }
  // položí názov typu na miesto i; vráti true, ak je to správne
  function umiestni(id, i) {
    if (RZ.umiestnene[i]) return false;
    const t = typPodla(id);
    if (R.clanky[i + 1] === id) {
      RZ.umiestnene[i] = id; RZ.zostava = RZ.zostava.filter(x => x !== id); RZ.vybrany = null;
      kresli();
      fb.className = 'fb ok';
      fb.innerHTML = RZ.zostava.length ? `<span class="h">✓ ${NS.ui.spravne}.</span> ${vypln(S.retazOk, { N: velke(typNazov(id)), smer: t.smer })}`
        : `<span class="h">✓ ${vypln(S.retazHotovo, { c: RZ.chyby })}</span>`;
      const ch = $('.chip', chipy); if (ch) ch.focus();
      return true;
    }
    RZ.chyby++; RZ.vybrany = null; kresli();
    fb.className = 'fb zle'; fb.innerHTML = `<span class="h">✗ ${vypln(S.retazZle, { N: velke(typNazov(id)), smer: t.smer })}</span>`;
    return false;
  }
  function nova() { RZ.umiestnene = {}; RZ.vybrany = null; RZ.chyby = 0; RZ.zostava = zamiesaj(R.clanky.slice(1)); fb.className = 'fb'; fb.innerHTML = ''; kresli(); }
  // ťuknutie: vyber názov, potom miesto
  chipy.onclick = e => {
    const b = e.target.closest('.chip'); if (!b || performance.now() - RZ.tah.poTahu < 400) return;
    RZ.vybrany = RZ.vybrany === b.dataset.typ ? null : b.dataset.typ; kresli();
    const nb = $(`.chip[data-typ="${b.dataset.typ}"]`, chipy); if (nb) nb.focus();
  };
  el.onclick = e => {
    const s = e.target.closest('.rSlot'); if (!s || RZ.umiestnene[s.dataset.i]) return;
    if (!RZ.vybrany) { fb.className = 'fb'; fb.textContent = S.retazVyber; return; }
    umiestni(RZ.vybrany, +s.dataset.i);
  };
  // ťahanie prstom alebo myšou (spoločný komponent tahanie)
  RZ.tah = tahanie(chipy, '.rSlot', (b, s) => umiestni(b.dataset.typ, +s.dataset.i), s => !RZ.umiestnene[s.dataset.i]);
  $('#st_retazZnova').onclick = nova;
  STAVBA.retazNova = nova; STAVBA.umiestni = umiestni;
  nova();
}

const IMP = { sila: 0, bodky: [], acc: 0, posl: null, X0: 92, X1: 566, Y: 82 };
function initImpulz() {
  vytvorRezim('impulz');
  const V = NS.vzruch, sl = $('#im_sila');
  sl.min = V.min; sl.max = V.max; sl.value = 0;
  $('#im_menej').setAttribute('aria-label', V.menej); $('#im_viac').setAttribute('aria-label', V.viac);
  const zn = $('#im_prahZn'); zn.style.setProperty('--p', (V.prah - V.min) / (V.max - V.min)); zn.textContent = `${V.prahSlovo} ${V.prah}`;
  $('#im_axon').innerHTML = `<svg class="imAxon" viewBox="0 0 600 130" role="img" aria-label="${V.popisAxon}">` +
    `<g id="im_podnet"></g><circle class="rec" cx="70" cy="${IMP.Y}" r="22"/>` +
    `<line class="ax" x1="${IMP.X0}" y1="${IMP.Y}" x2="${IMP.X1}" y2="${IMP.Y}"/>` +
    `<path d="M${IMP.X1} ${IMP.Y} L590 ${IMP.Y - 18} M${IMP.X1} ${IMP.Y} L590 ${IMP.Y + 18}" stroke="#7fdc8f" stroke-width="5" stroke-linecap="round"/>` +
    `<g id="im_bodky"></g></svg>`;
  sl.oninput = () => nastavSilu(sl.value);
  $('#im_menej').onclick = () => nastavSilu(IMP.sila - 1);
  $('#im_viac').onclick = () => nastavSilu(IMP.sila + 1);
  nastavSilu(0);
  if (!MALO_POHYBU) requestAnimationFrame(impSlucka);
  initPretek();
}
function nastavSilu(s) {
  const V = NS.vzruch;
  s = Math.max(V.min, Math.min(V.max, Math.round(+s || 0)));
  const predtym = MODEL.frekvencia(IMP.sila);
  IMP.sila = s; $('#im_sila').value = s;
  const f = MODEL.frekvencia(s);
  if (!predtym && f) IMP.acc = 1;                  // prvý vzruch hneď
  $('#im_silaHod').textContent = s;
  $('#im_pocet').textContent = f;
  $('#im_stav').innerHTML = f ? vypln(V.nadPrahom, { n: f, v: tvar(f, ['vzruch', 'vzruchy', 'vzruchov']) }) : V.podPrahom;
  $('#im_stav').style.color = f ? 'var(--green)' : '#ffb3a8';
  // šípka podnetu: hrúbka podľa sily
  const h = 4 + s / 100 * 14;
  $('#im_podnet').innerHTML = s ? `<rect class="podnet" x="${70 - h / 2}" y="18" width="${h}" height="30"/><path class="podnet" d="M${70 - h / 2 - 8} 46 L70 58 L${70 + h / 2 + 8} 46 Z"/><text class="txt" x="${86 + h / 2}" y="38">${V.podnet}</text>` : '';
  // záznam jednej sekundy
  const vz = MODEL.vzruchyZa(s, 1), b = 108, A = 80;
  $('#im_zaznam').innerHTML = `<svg class="zaznam" viewBox="0 0 560 140" aria-hidden="true"><line class="os" x1="20" y1="${b}" x2="540" y2="${b}"/>` +
    (vz.length ? `<line class="vod" x1="20" y1="${b - A}" x2="540" y2="${b - A}"/>` + vz.map(v => `<path class="sp" d="${spike(20 + v.t * 520, b, A * v.amplituda)}"/>`).join('')
      : `<text x="280" y="${b - 30}" text-anchor="middle" fill="#ffb3a8">✗ ${V.zaznamNic}</text>`) +
    `<text x="20" y="134">0 s</text><text x="540" y="134" text-anchor="end">1 s</text></svg>`;
  if (MALO_POHYBU) {                               // bez pohybu: bodky stoja rovnomerne na axóne
    $('#im_bodky').innerHTML = Array.from({ length: f }, (_, k) => `<circle class="bod" r="13" cy="${IMP.Y}" cx="${IMP.X0 + (k + .5) / f * (IMP.X1 - IMP.X0)}"/>`).join('');
  }
}
// bodky putujú po axóne; nové vznikajú f-krát za sekundu (nie blikanie, ale pohyb)
function impSlucka(now) {
  requestAnimationFrame(impSlucka);
  const g = $('#im_bodky');
  if (!g || !g.getClientRects().length) { IMP.posl = null; return; }   // karta nie je vidieť
  const dt = IMP.posl === null ? 0 : Math.min(0.1, (now - IMP.posl) / 1000);
  IMP.posl = now;
  const f = MODEL.frekvencia(IMP.sila);
  IMP.acc += dt * f;
  while (f && IMP.acc >= 1) { IMP.acc -= 1; IMP.bodky.push(now); }
  if (!f) IMP.acc = 0;
  IMP.bodky = IMP.bodky.filter(t0 => now - t0 < NS.vzruch.cestaMs);
  while (g.children.length < IMP.bodky.length) g.insertAdjacentHTML('beforeend', `<circle class="bod" r="13" cy="${IMP.Y}"/>`);
  $$('circle', g).forEach((c, i) => {
    if (i >= IMP.bodky.length) { c.setAttribute('cx', -50); return; }
    c.setAttribute('cx', IMP.X0 + (now - IMP.bodky[i]) / NS.vzruch.cestaMs * (IMP.X1 - IMP.X0));
  });
}

const PRE = { bezi: false, t0: 0, zrus: null, ciel: { obal: null, bez: null }, X0: 50, X1: 550 };
function initPretek() {
  const P = NS.pretek, N = P.useky, d = (PRE.X1 - PRE.X0) / N;
  let a = `<svg class="pretek" viewBox="0 0 600 92" aria-hidden="true"><line class="ax" x1="${PRE.X0}" y1="52" x2="${PRE.X1}" y2="52"/>`;
  for (let k = 0; k < N; k++) a += `<rect class="myel" x="${PRE.X0 + k * d + 8}" y="40" width="${d - 16}" height="24" rx="10"/>`;
  a += `<line class="ciel" x1="${PRE.X1}" y1="10" x2="${PRE.X1}" y2="80"/><text x="${PRE.X1 + 8}" y="86">${P.ciel}</text>`;
  a += `<path class="skok" id="pr_skok" d=""/><circle class="bod" id="pr_bodA" r="14" cy="52" cx="${PRE.X0}"/></svg>`;
  let b = `<svg class="pretek" viewBox="0 0 600 92" aria-hidden="true"><line class="ax" x1="${PRE.X0}" y1="52" x2="${PRE.X1}" y2="52"/>`;
  b += `<line class="ciel" x1="${PRE.X1}" y1="10" x2="${PRE.X1}" y2="80"/><text x="${PRE.X1 + 8}" y="86">${P.ciel}</text>`;
  b += `<circle class="bod" id="pr_bodB" r="14" cy="52" cx="${PRE.X0}"/></svg>`;
  $('#pr_drahaA').innerHTML = a; $('#pr_drahaB').innerHTML = b;
  $('#pr_start').textContent = P.start;
  $('#pr_start').onclick = pretekStart;
  pretekKresli(0);
}
function pretekKresli(t) {
  const P = NS.pretek, p = MODEL.pretekPoloha(t), d = (PRE.X1 - PRE.X0) / P.useky;
  const xa = PRE.X0 + p.obal * (PRE.X1 - PRE.X0);
  $('#pr_bodA').setAttribute('cx', xa);
  $('#pr_skok').setAttribute('d', p.skoky > 0 ? `M${xa - d} 40 Q${xa - d / 2} 4 ${xa} 40` : '');
  $('#pr_bodB').setAttribute('cx', PRE.X0 + p.bez * (PRE.X1 - PRE.X0));
  const st = (el, cas) => { el.textContent = cas !== null ? vypln(P.vCieli, { t: ciarka(cas.toFixed(1)) }) : (PRE.bezi ? P.bezi : P.caka); el.classList.toggle('hotovo', cas !== null); };
  if (PRE.bezi) {
    if (PRE.ciel.obal === null && p.obal >= 1) PRE.ciel.obal = MODEL.casObal();
    if (PRE.ciel.bez === null && p.bez >= 1) PRE.ciel.bez = P.casBez;
  }
  st($('#pr_stA'), PRE.ciel.obal); st($('#pr_stB'), PRE.ciel.bez);
  if (PRE.bezi && PRE.ciel.obal !== null && PRE.ciel.bez !== null) {
    pretekStop();
    $('#pr_vysl').textContent = vypln(P.vysledok, { p: ciarka(Math.round(PRE.ciel.bez / PRE.ciel.obal * 10) / 10) });
  }
}
function pretekStop() { PRE.bezi = false; if (PRE.zrus) PRE.zrus(); PRE.zrus = null; $('#pr_start').textContent = NS.pretek.znova; }
function pretekStart() {
  if (PRE.zrus) PRE.zrus();
  PRE.ciel = { obal: null, bez: null }; PRE.bezi = true; PRE.t0 = performance.now();
  $('#pr_vysl').textContent = ''; $('#pr_start').textContent = NS.pretek.znova;
  const krok = () => pretekKresli((performance.now() - PRE.t0) / 1000);
  if (MALO_POHYBU) {                                // bez plynulého pohybu: stav sa zmení 2-krát za sekundu
    const id = setInterval(krok, 500); PRE.zrus = () => clearInterval(id);
  } else {
    let id = 0, zrus = false;
    const f = () => { if (zrus) return; krok(); id = requestAnimationFrame(f); };
    id = requestAnimationFrame(f); PRE.zrus = () => { zrus = true; cancelAnimationFrame(id); };
  }
  krok();
}

/* =====================================================================
   KARTA „Synapsa“ – animácia po krokoch a „Zoraď kroky“
   ===================================================================== */
const SY = { krok: 1, hraj: null };
function initSynapsa() {
  vytvorRezim('synapsa');
  const Y = NS.synapsa;
  $('#sy_obr').innerHTML = synapsaSVG(1, ['zakoncenie', 'strbina', 'receptory', 'dalsia']);
  $('#sy_obr svg').setAttribute('role', 'img'); $('#sy_obr svg').setAttribute('aria-label', Y.popisSkus); $('#sy_obr svg').removeAttribute('aria-hidden');
  $('#sy_spat').onclick = () => { synZastav(); synKrok(SY.krok - 1); };
  $('#sy_dalej').onclick = () => { synZastav(); synKrok(SY.krok + 1); };
  $('#sy_hraj').onclick = () => SY.hraj ? synZastav() : synHraj();
  synZastav(); synKrok(1);
  initZorad();
}
function synKrok(k) {
  const Y = NS.synapsa, n = Y.kroky.length;
  SY.krok = Math.max(1, Math.min(n, k));
  nastavSynapsu($('#sy_obr svg'), SY.krok);
  $('#sy_text').innerHTML = `<span class="kc">${vypln(Y.krok, { i: SY.krok, n })}</span>${Y.kroky[SY.krok - 1]}`;
  $('#sy_spat').disabled = SY.krok === 1; $('#sy_dalej').disabled = SY.krok === n;
}
function synHraj() {
  const n = NS.synapsa.kroky.length;
  if (SY.krok >= n) synKrok(1);
  $('#sy_hraj').textContent = NS.synapsa.zastav;
  const dalej = () => { if (SY.krok >= n) { synZastav(); return; } synKrok(SY.krok + 1); SY.hraj = setTimeout(dalej, 1800); };
  SY.hraj = setTimeout(dalej, 1800);
}
function synZastav() { clearTimeout(SY.hraj); SY.hraj = null; $('#sy_hraj').textContent = NS.synapsa.prehraj; }

const ZOR = { zostava: [], hotove: [], chyby: 0 };
/* SPOLOČNÝ KOMPONENT (od časti 3): hra „ťukaj na položky v správnom poradí“.
   o: { hotove (ol), zostava, fb, znova, polozky [texty v správnom poradí], T: { ok, zle, hotovo } }, S = stavový objekt */
function poradieHra(o, S) {
  Object.assign(S, { zostava: [], hotove: [], chyby: 0 });
  function kresli() {
    o.hotove.innerHTML = S.hotove.map(i => `<li>${o.polozky[i]}</li>`).join('');
    o.zostava.innerHTML = S.zostava.map(i => `<button type="button" data-k="${i}">${o.polozky[i]}</button>`).join('');
  }
  function nova() {
    const idx = o.polozky.map((_, i) => i);
    do S.zostava = zamiesaj(idx); while (S.zostava.every((x, i) => x === i));
    S.hotove = []; S.chyby = 0; o.fb.className = 'fb'; o.fb.innerHTML = ''; kresli();

/* =====================================================================
   KARTA „Ako rýchlo reaguješ?“ – meranie reakčného času
   Časovače sú v RK.hodiny, aby sa dali v teste nahradiť.
   ===================================================================== */
const RK = {
  hodiny: {
    teraz: () => performance.now(),
    casovac: (f, ms) => setTimeout(f, ms),
    zrus: id => clearTimeout(id),
    nahoda: () => Math.random(),
    viditelne: () => { const p = $('#rk_plocha'); return !!(p && p.getClientRects().length); }
  },
  stav: 'start', id: null, tZmena: 0, posledny: null, pokusy: [], skoro: false,
  planuj() { this.hodiny.zrus(this.id); this.id = this.hodiny.casovac(() => this.zmena(), MODEL.cakanie(this.hodiny.nahoda())); },
  zmena() {
    this.id = null;
    if (!this.hodiny.viditelne()) { this.stav = 'start'; this.skoro = false; this.kresli(); return; }   // karta je skrytá
    this.stav = 'teraz'; this.skoro = false; this.kresli();
    this.tZmena = this.hodiny.teraz();
  },
  stisk() {
    if (this.stav === 'start' || this.stav === 'vysledok') { this.stav = 'cakaj'; this.skoro = false; this.planuj(); }
    else if (this.stav === 'cakaj') { this.skoro = true; this.planuj(); }            // predčasne: nič nemeriame, čakáme znova
    else if (this.stav === 'teraz') {
      const ms = Math.max(0, Math.round(this.hodiny.teraz() - this.tZmena));        // nikdy záporné
      this.posledny = ms; this.pokusy.push(ms);
      if (this.pokusy.length > NS.reakcia.pocetPokusov) this.pokusy.shift();
      this.stav = 'vysledok';
    }
    this.kresli();
  },
  zastav() { this.hodiny.zrus(this.id); this.id = null; if (this.stav === 'cakaj' || this.stav === 'teraz') { this.stav = 'start'; this.skoro = false; this.kresli(); } },
  kresli() {
    const R = NS.reakcia, p = $('#rk_plocha'); if (!p) return;
    const obsah = {
      start: ['▶', R.start, `<span class="pod">${R.startPod}</span>`],
      cakaj: ['⏳', R.cakaj, this.skoro ? `<span class="skoro">✋ ${R.skoro}</span>` : `<span class="pod">${R.cakajPod}</span>`],
      teraz: ['★', R.teraz, ''],
      vysledok: ['⏱', vypln(R.vysledok, { ms: this.posledny }), `<span class="pod">${R.vysledokPod}</span>`]
    }[this.stav];
    p.className = 'rkPlocha ' + this.stav;
    p.innerHTML = `<span class="ik2" aria-hidden="true">${obsah[0]}</span><span>${obsah[1]}</span>${obsah[2]}`;
    $('#rk_hlas').textContent = bezHtml(obsah[1] + ' ' + obsah[2]);
    $('#rk_pokusy').textContent = this.pokusy.length ? vypln(R.pokusy, { z: this.pokusy.map(x => x + ' ms').join(', ') }) : '';
  }
};
function initReakcia() {
  vytvorRezim('reakcia');
  const R = NS.reakcia, p = $('#rk_plocha');
  // stlačenie prstom alebo myšou meriame hneď pri dotyku; klávesnica (Enter, medzera) cez click s detail = 0
  p.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button !== 0) return; e.preventDefault(); RK.stisk(); });
  p.addEventListener('click', e => { if (e.detail === 0) RK.stisk(); });
  $('#rk_pravKroky').innerHTML = R.pravKroky.map(k => `<li>${k}</li>`).join('');
  $('#rk_tab').innerHTML = `<tr><th>${R.pravTabH[0]}</th><th>${R.pravTabH[1]}</th></tr>` +
