/* ===== Farby a základ – rovnaká paleta ako predošlé animácie ===== */
:root{
  --bg:#04060c;--panel:rgba(12,16,28,.86);--line:rgba(140,160,215,.22);
  --text:#e2e8f5;--muted:#a3adc6;--gold:#f3b453;--gold2:#ffd88a;--blue:#6fb4ff;--red:#ff7a6b;--green:#7fdc8f;--violet:#b9a3ff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);background:var(--bg);

.wrap{max-width:1440px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45);padding:16px}
h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h2{margin:0 0 10px;font-size:23px;line-height:1.25}
h3{margin:0 0 6px;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650}
p{margin:0 0 10px}
.sub{color:var(--muted);margin:4px 0 0;font-size:17px}
button{font:inherit;font-size:16px;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line);
  border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;touch-action:manipulation}
button:hover{background:rgba(255,255,255,.13);border-color:rgba(160,180,230,.4)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
button.on{background:rgba(243,180,83,.2);border-color:rgba(243,180,83,.65);color:var(--gold2)}
button.primary{background:linear-gradient(135deg,#f3b453,#d9772f);color:#1a0e02;border:none;font-weight:700;min-width:130px}
button.primary:hover{filter:brightness(1.08)}
button:disabled{cursor:default;opacity:.45}
.mini{color:var(--muted);font-size:16px;margin:10px 0 4px}
.tCit{color:var(--gold2)}.tMen{color:var(--blue)}

/* ===== Hlavička a karty ===== */
header.top{margin-bottom:12px}
nav.karty{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
nav.karty button{border-radius:999px;padding:8px 15px}
nav.karty button .cis{display:inline-block;min-width:1.4em;color:var(--muted)}
nav.karty button.on .cis{color:var(--gold2)}

/* ===== Rozloženie sekcie ===== */
.sek{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
.stlpec{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1000px){.sek{grid-template-columns:minmax(0,1fr)}.sek>.panel{order:-1}}

/* ===== Zlomok so zlomkovou čiarou ===== */
.zl{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em;font-weight:700;font-variant-numeric:tabular-nums}

.zl>.ciara{align-self:stretch;height:0;border-top:.09em solid currentColor;margin:.06em 0;padding:0;min-width:.8em}

.volby{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}

.hlaska{color:var(--gold2);font-size:16px;margin:8px 0 0}

/* ===== Popis po kliknutí ===== */
#info{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(580px,calc(100% - 24px));z-index:50;

#info button{position:absolute;right:10px;top:8px;min-height:40px}

.omylyGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:16px}

/* ===== Kvíz ===== */

.fb{margin-top:10px;font-size:17px}

ul.poznList{margin:0;padding-left:22px}

@media (max-width:600px){

</style>

    let a, b; do { a = { c: 0, m: nahoda(2, 12) }; b = { c: 0, m: nahoda(2, 12) }; a.c = nahoda(1, a.m - 1); b.c = nahoda(1, b.m - 1); } while (a.m === b.m || a.c === b.c || nsn(a.m, b.m) > 36);
    return porQ(a, b);
  },
  scRov() { const m = nahoda(3, 12), c1 = nahoda(1, m - 2), c2 = nahoda(1, m - 1 - c1); return scQ({ c: c1, m }, { c: c2, m }, '+'); },
  odRov() { const m = nahoda(3, 12), c1 = nahoda(2, m - 1), c2 = nahoda(1, c1 - 1); return scQ({ c: c1, m }, { c: c2, m }, '-'); },
  scRoz() { let a, b; do { a = { c: 0, m: nahoda(2, 12) }; b = { c: 0, m: nahoda(2, 12) }; a.c = nahoda(1, a.m - 1); b.c = nahoda(1, b.m - 1); } while (a.m === b.m || nsn(a.m, b.m) > 24 || porovnaj(scitaj(a, b), { c: 1, m: 1 }) >= 0); return scQ(a, b, '+'); },
  odRoz() { let a, b; do { a = { c: 0, m: nahoda(2, 12) }; b = { c: 0, m: nahoda(2, 12) }; a.c = nahoda(1, a.m - 1); b.c = nahoda(1, b.m - 1); } while (a.m === b.m || nsn(a.m, b.m) > 24 || porovnaj(a, b) <= 0); return scQ(a, b, '-'); },
  skrat1() { return skratQ(nahoda(2, 6), 3); },
  skrat2() { return skratQ(nahoda(2, 12), 4); },
  rozsir() {
    const m = nahoda(2, 6), c = nahoda(1, m - 1), k = nahoda(2, 4), M = m * k, C = c * k;
    return { typ: 'cislo', text: `${KZ.q.rozsir}&nbsp; [[${c}/${m}]] = ${zlHTML('?', M)}`, spravna: C, kand: [c + M - m, C + 1, C - 1, M - C, C + k],

    if (w < m) kand.push({ cele: r, c: w, m });
    return { typ: 'zmiesane', text: `${KZ.q.zmies}&nbsp; [[${c}/${m}]]`, spravna: { cele: w, c: r, m }, kand, vysv: () => T(KZ.v.zmies, { c, m, w, r }) };
  },
  scZm() {
    let a, b, v; do { a = { c: 0, m: nahoda(2, 12) }; b = { c: 0, m: nahoda(2, 12) }; a.c = nahoda(1, a.m - 1); b.c = nahoda(1, b.m - 1); v = scitaj(a, b); } while (nsn(a.m, b.m) > 24 || v.c <= v.m || v.c % v.m === 0);
    const sp = zmiesane(skrat(v)), M = v.m, C1 = a.c * M / a.m, C2 = b.c * M / b.m;

    return { typ: 'zmiesane', text: `${KZ.q.scZm}&nbsp; ${zlT(a)} + ${zlT(b)}`, spravna: sp, kand,
      vysv: () => T(KZ.v.sc, { c1: a.c, m1: a.m, c2: b.c, m2: b.m, M, C1, C2, S: v.c, op: '+', skr: '' }) + ' ' + T(KZ.v.zmies, { c: v.c, m: M, w: (v.c - v.c % M) / M, r: v.c % M }) };

const ZOSTAVY = { 1: ['citaj', 'porRovMen', 'porRovCit', 'scRov', 'odRov', 'skrat1', 'rozsir', 'zCisla1'],
                  2: ['os', 'porRoz', 'scRoz', 'odRoz', 'skrat2', 'zmies', 'scZm', 'zCisla2'] };
function hodnotaHTML(v, typ) {
  if (typ === 'znak') return v === '<' ? '&lt;' : v === '>' ? '&gt;' : '=';
  if (typ === 'cislo') return String(v);
  if (typ === 'zmiesane') return zmHTML(v.cele, v.c, v.m);
  return zlHTML(v.c, v.m);
}
function platne(v, typ) {
  if (typ === 'cislo') return Number.isInteger(v) && v >= 0;
  if (typ === 'zmiesane') return v.cele >= 1 && v.c >= 1 && v.c < v.m;
  return v.c >= 1 && v.m >= 1 && v.c <= v.m;
}
function kluc(q, v) {      // kľúč na odstránenie rovnakých možností (podľa hodnoty, pri krátení podľa zápisu)
  if (q.typ === 'cislo' || q.typ === 'znak') return String(v);
  const z = q.typ === 'zmiesane' ? zoZmiesaneho(v) : v;
  if (q.zaklad) return z.c + '/' + z.m;
  const s = skrat(z); return s.c + '/' + s.m;
}
function nahodnyDistraktor(q) {
  const s = q.spravna;
  if (q.typ === 'cislo') return s + nahoda(-4, 4);
  if (q.typ === 'zmiesane') return { cele: Math.max(1, s.cele + nahoda(-1, 1)), c: nahoda(1, Math.max(1, s.m - 1)), m: s.m + nahoda(0, 2) };
  return { c: Math.max(1, s.c + nahoda(-2, 2)), m: Math.max(2, s.m + nahoda(0, 3)) };
}
function moznosti(q) {
  const mn = [q.spravna], kl = new Set([kluc(q, q.spravna)]);
  const skus = v => { if (mn.length >= 4 || !platne(v, q.typ)) return; const k = kluc(q, v); if (kl.has(k)) return; kl.add(k); mn.push(v); };
  q.kand.forEach(skus);
  for (let i = 0; i < 80 && mn.length < 4; i++) skus(nahodnyDistraktor(q));
  return zamiesaj(mn);
}
function vyhodnot(q, odp) {
  const V = KZ.v;
  if (q.typ === 'znak' || q.typ === 'cislo') return { ok: odp === q.spravna };
  if (q.typ === 'zlomok') {
    if (!rovnake(odp, q.spravna)) return { ok: false };
    if (nsd(odp.c, odp.m) !== 1) {
      const s = skrat(odp);
      if (q.zaklad) return { ok: false, pozn: V.nieZaklad };
      if (q.poznSkrat) return { ok: true, pozn: T(V.daSaSkratit, { s: s.c, t: s.m }) };
    }
    return { ok: true };
  }
  // zmiešané číslo
  if (odp.c >= odp.m) return { ok: false, pozn: V.zmiesVacsi };
  if (!rovnake(zoZmiesaneho(odp), zoZmiesaneho(q.spravna))) return { ok: false };
  if (odp.c && nsd(odp.c, odp.m) !== 1) { const s = skrat({ c: odp.c, m: odp.m }); return { ok: true, pozn: T(V.daSaSkratit, { s: s.c, t: s.m }) }; }

}
function noveOtazky() {
  KV.otazky = zamiesaj(ZOSTAVY[KV.u]).map(t => { const q = GEN[t](); if (q.typ !== 'znak') q.mozn = moznosti(q); return q; });
  $('#kvizVysl').textContent = '';
  const box = $('#kv_otazky'); box.innerHTML = '';
  KV.otazky.forEach((q, i) => {
    const d = document.createElement('div'); d.className = 'otazka';
    d.innerHTML = `<div class="q"><span class="por">${i + 1}.</span> ${formatuj(q.text)}</div>${q.obr ? `<div class="obr">${q.obr}</div>` : ''}<div class="odp"></div><div class="fb" aria-live="polite"></div>`;
    box.appendChild(d); q.el = d; kresliOdpoved(q);

}
const cele = s => /^\s*\d{1,4}\s*$/.test(s) ? parseInt(s, 10) : NaN;
function kresliOdpoved(q) {
  if (q.hotovo) return;
  const el = $('.odp', q.el);
  if (q.typ === 'znak' || KV.sposob === 'vyber') {
    const mo = q.typ === 'znak' ? ['<', '=', '>'] : q.mozn;
    el.innerHTML = `<div class="moznosti">${mo.map((v, j) => `<button data-j="${j}">${hodnotaHTML(v, q.typ)}</button>`).join('')}</div>`;
    $$('button', el).forEach(b => { b.onclick = () => odpovedz(q, mo[+b.dataset.j], b); });
    return;
  }
  const zlI = `<span class="vstupZl"><input class="vc" inputmode="numeric" maxlength="3" aria-label="čitateľ"><span class="ciara"></span><input class="vm" inputmode="numeric" maxlength="3" aria-label="menovateľ"></span>`;
  const pole = q.typ === 'cislo' ? `<input class="vn" inputmode="numeric" maxlength="4" aria-label="odpoveď">` : q.typ === 'zmiesane' ? `<input class="vw cele" inputmode="numeric" maxlength="2" aria-label="celá časť">${zlI}` : zlI;
  el.innerHTML = `<div class="vstup">${pole}<button class="primary bOver">${KZ.over}</button></div><p class="mini chyba"></p>`;
  const over = () => {
    const v = c => { const i = $(c, el); return i ? cele(i.value) : NaN; };
    let odp, chyba = '';
    if (q.typ === 'cislo') { odp = v('.vn'); if (isNaN(odp)) chyba = KZ.vyplnCislo; }
    else if (q.typ === 'zlomok') { odp = { c: v('.vc'), m: v('.vm') }; if (isNaN(odp.c) || isNaN(odp.m) || odp.m === 0) chyba = KZ.vyplnZl; }
    else { odp = { cele: v('.vw'), c: v('.vc'), m: v('.vm') }; if (isNaN(odp.cele) || isNaN(odp.c) || isNaN(odp.m) || odp.m === 0) chyba = KZ.vyplnZm; }

function odpovedz(q, odp, btn) {
  if (q.hotovo) return;
  q.hotovo = true;
  const v = vyhodnot(q, odp); q.ok = v.ok;
  $$('.odp button, .odp input', q.el).forEach(x => { x.disabled = true; });
  if (btn) {
    btn.classList.add(v.ok ? 'ok' : 'zle');
    const mo = q.typ === 'znak' ? ['<', '=', '>'] : q.mozn;
    $$('.odp button', q.el).forEach(b => { if (mo[+b.dataset.j] === q.spravna) b.classList.add('ok'); });
  }
  const fb = $('.fb', q.el);
  fb.className = 'fb ' + (v.ok ? 'ok' : 'zle');
  fb.innerHTML = v.ok ? `<b>✔ ${KZ.dobre}</b> ${v.pozn || ''}`
    : `<b>✘ ${KZ.zle}</b> ${v.pozn ? v.pozn + ' ' : ''}${KZ.spravne} ${hodnotaHTML(q.spravna, q.typ)}<div style="margin-top:6px">${q.vysv(odp)}</div>`;
  if (KV.otazky.every(x => x.hotovo)) {
    const b = KV.otazky.filter(x => x.ok).length, n = KV.otazky.length;
    $('#kvizVysl').textContent = vypln(KZ.vysl, { b, n }) + (b >= n - 1 ? KZ.vyslDobre : KZ.vyslSkus);

}

  segment($('#kv_sposob'), [['vyber', KZ.vyber], ['pis', KZ.pis]], KV.sposob, k => { KV.sposob = k; KV.otazky.forEach(kresliOdpoved); });
