<style>
/* ===== Paleta – rovnaká ako v predošlých animáciách (nočná obloha + zlatá) ===== */

<script>
'use strict';
const T = TEXTY;

/* =====================================================================
   NASTAVENIA
   ===================================================================== */
const NASTAVENIE = {
  urovne: [39, 100, 1000, 3999],   // maximá úrovní Malý, Stredný, Veľký, Majster
  // maximum úrovne – najväčšie číslo, ktoré rozhranie práve ponúkne
  get maximum() { return this.urovne[STAV.uroven]; },
  trvaniePrechodu: 400    // dĺžka prechodu medzi krokmi v ms pri rýchlosti 1×
};
const STAV = { rychlost: 1, karta: null, vynutPohyb: false, uroven: 0 };
const PORADIE_KARIET = ['znaky', 'palice', 'lcdm', 'pravidla', 'sablona', 'prevod',
  'citanie', 'chyby', 'hodiny', 'kde', 'postav', 'kviz', 'tlac'];

/* =====================================================================
   JADRO – rímske čísla (vie celý rozsah 1 až 3999)
   ===================================================================== */
const HODNOTY = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
// znaky pre jednotlivé rády: [jedna, päť, desať] – jednotky, desiatky, stovky, tisíce
const ZNAKY_RADOV = [['I', 'V', 'X'], ['X', 'L', 'C'], ['C', 'D', 'M'], ['M', '', '']];
// vzor zápisu cifier 1 až 9: a = „jedna“, b = „päť“, c = „desať“ daného rádu
const VZOR = ['', 'a', 'aa', 'aaa', 'ab', 'b', 'ba', 'baa', 'baaa', 'ac'];

function overCislo(n) {
  if (!Number.isInteger(n) || n < 1 || n > 3999) throw new RangeError('Číslo musí byť celé od 1 do 3999: ' + n);
}
// zápis jednej cifry v danom ráde (0 = jednotky, 1 = desiatky, …)
function zapisRadu(cifra, rad) {
  const [a, b, c] = ZNAKY_RADOV[rad];
  return VZOR[cifra].replace(/[abc]/g, z => ({ a, b, c })[z]);
}
function toRoman(n) {
  overCislo(n);
  let s = '';
  for (let rad = 3; rad >= 0; rad--) s += zapisRadu(Math.floor(n / 10 ** rad) % 10, rad);
  return s;
}
// rozklad na rády bez nulových rádov: 26 → [20, 6], 30 → [30]
function decompose(n) {
  overCislo(n);
  const rady = [];
  for (let rad = 3; rad >= 0; rad--) {
    const c = Math.floor(n / 10 ** rad) % 10;
    if (c) rady.push(c * 10 ** rad);
  }
  return rady;
}
// informácie o jednom ráde, napr. 9 → {rad 0, cifra 9, zapis 'IX', odcitanie true}
function infoRadu(h) {
  const rad = String(h).length - 1;
  const cifra = h / 10 ** rad;
  const zapis = zapisRadu(cifra, rad);
  return { h, rad, cifra, zapis, hodnoty: [...zapis].map(z => HODNOTY[z]), odcitanie: cifra === 4 || cifra === 9 };
}
// krátky výpočet pod dlaždicami: „5 − 1 = 4“, „5 + 1 = 6“; pre jeden znak prázdny
function vypocet(h) {
  const r = infoRadu(h);
  if (r.odcitanie) return `${r.hodnoty[1]} − ${r.hodnoty[0]} = ${h}`;
  if (r.hodnoty.length > 1) return r.hodnoty.join(' + ') + ' = ' + h;
  return '';
}
// šablóna: zápis jednotiek preložený do iného rádu (I→X→C→M, V→L→D, X→C→M)
function vymenZnaky(zapisJednotiek, rad) {
  const [a, b, c] = ZNAKY_RADOV[rad];
  return zapisJednotiek.replace(/[IVX]/g, z => ({ I: a, V: b, X: c })[z]);
}
// hodnoty znakov so znamienkom: menšia pred väčšou je záporná (napr. IV → [−1, 5])
function znamienkaZapisu(zapis) {
  return [...zapis].map((z, j) => (HODNOTY[z] < (HODNOTY[zapis[j + 1]] || 0) ? -HODNOTY[z] : HODNOTY[z]));
}

/* ----- úrovne – zdieľané všetkými kartami ----- */
const posluchaciUrovne = new Set();
function nastavUroven(i) {
  STAV.uroven = Math.max(0, Math.min(NASTAVENIE.urovne.length - 1, i));
  for (const f of posluchaciUrovne) f(STAV.uroven);
}
// koliesko počítadla: pridá alebo uberie jednu jednotku rádu a oreže na 1 až maximum
function posunKoliesko(n, rad, smer, max) {
  return Math.max(1, Math.min(max, n + smer * 10 ** rad));
}

/* ----- čítanie rímskych čísel ----- */
// šesť povolených dvojíc „menšia pred väčšou“
const DVOJICE = ['IV', 'IX', 'XL', 'XC', 'CD', 'CM'];
// zoznam častých chýb (karta „Časté chyby“); opravu ponúkame len pre ne
const CASTE_CHYBY = ['IIII', 'VIIII', 'XXXX', 'IC', 'IL', 'MIM'];
// zľava doprava: povolená dvojica je jedna skupina, inak jeden znak (M | CM | XC | IV)
function skupinyZapisu(s) {
  const g = [];
  for (let i = 0; i < s.length;) {
    if (DVOJICE.includes(s.slice(i, i + 2))) { g.push(s.slice(i, i + 2)); i += 2; } else { g.push(s[i]); i++; }
  }
  return g;
}
function hodnotaSkupiny(g) { return g.length === 2 ? HODNOTY[g[1]] - HODNOTY[g[0]] : HODNOTY[g]; }
// čítanie zľava doprava, menšia pred väčšou sa odčíta – aj pri nesprávnom zápise (čo sme asi chceli)
function citajZlava(s) { return znamienkaZapisu(s).reduce((a, b) => a + b, 0); }
// ktoré pravidlá z karty „Päť pravidiel“ zápis porušuje (2, 3, 5)
function porusenePravidla(s) {
  const p = new Set();
  if (/([IVXLCDM])\1\1\1/.test(s)) p.add(2);
  if (/VV|LL|DD/.test(s)) p.add(3);
  for (let i = 0; i + 1 < s.length; i++) {
    if (HODNOTY[s[i]] >= HODNOTY[s[i + 1]]) continue;
    if (!DVOJICE.includes(s[i] + s[i + 1])) p.add(5);                       // IC, IL, XM, VX …
    else if (i > 0 && HODNOTY[s[i - 1]] <= HODNOTY[s[i]]) p.add(5);          // IIX: odčítajú sa dva znaky
  }
  return [...p].sort();
}
// fromRoman: {ok: true, hodnota} alebo {ok: false, chyba, pravidlo, sprava, oprava?}
function fromRoman(text) {
  const s = String(text == null ? '' : text).toUpperCase().replace(/\s+/g, '');
  if (!s) return { ok: false, text: s, chyba: 'prazdne', pravidlo: null, sprava: T.citanie.nepise };
  if (/[^IVXLCDM]/.test(s)) return { ok: false, text: s, chyba: 'znaky', pravidlo: null, sprava: T.citanie.nepise };
  const n = citajZlava(s);
  if (n >= 1 && n <= 3999 && toRoman(n) === s) return { ok: true, text: s, hodnota: n };
  const p = porusenePravidla(s);
  const vysledok = p.length === 1
    ? { ok: false, text: s, chyba: 'pravidlo', pravidlo: p[0], sprava: null }
    : { ok: false, text: s, chyba: 'nepise', pravidlo: null, sprava: T.citanie.nepise };

const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => (k in o ? o[k] : m));

// vytvorenie prvku: h('div', {class: 'x', onclick: f}, deti…)
function h(tag, vlastnosti, ...deti) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(vlastnosti || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const d of deti.flat()) if (d != null && d !== false) e.append(d.nodeType ? d : document.createTextNode(String(d)));

}
function tvarSlova(n, [jeden, dva, vela]) { return n === 1 ? jeden : n >= 2 && n <= 4 ? dva : vela; }
function zoznamSlovami(cisla) {
  return cisla.length < 2 ? String(cisla[0]) : cisla.slice(0, -1).join(', ') + T.prevod.a + cisla[cisla.length - 1];
}

/* =====================================================================
   ANIMÁCIE – requestAnimationFrame, časovanie podľa skutočného času
   ===================================================================== */
const ease = {
  inOut: p => (p < 0.5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2),
  out: p => 1 - (1 - p) ** 3,
  // jemný odskok na konci
  back: p => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * (p - 1) ** 3 + c1 * (p - 1) ** 2; }
};
const BEZIACE = new Set();
let pocetSpustenychAnimacii = 0;
function smieHybat() {
  if (STAV.vynutPohyb) return true;
  return !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
}
const trvanie = () => NASTAVENIE.trvaniePrechodu / STAV.rychlost;

// tween(ms, krok(p 0..1), hotovo) – vráti objekt s dokonci()
function tween(ms, krok, hotovo) {
  pocetSpustenychAnimacii++;
  const a = { hotova: false, t0: null };
  a.dokonci = () => {
    if (a.hotova) return;
    a.hotova = true; BEZIACE.delete(a);
    krok(1); if (hotovo) hotovo();
  };
  BEZIACE.add(a);
  krok(0);
  const tik = cas => {
    if (a.hotova) return;
    if (a.t0 === null) a.t0 = cas;
    const p = Math.min(1, (cas - a.t0) / ms);
    if (p >= 1) a.dokonci(); else { krok(p); requestAnimationFrame(tik); }
  };
  requestAnimationFrame(tik);
  return a;
}
function dokonciVsetky() { for (const a of [...BEZIACE]) a.dokonci(); }

// dočasne mení style prvku; na konci vráti presne pôvodný atribút style
function animujStyl(e, ms, fn) {
  const povodny = e.getAttribute('style');
  return tween(ms, p => {
    const s = fn(p);
    e.style.transform = s.transform || '';
    if (s.opacity != null) e.style.opacity = s.opacity;
  }, () => obnovStyl(e, povodny));
}
// Chromium zapisuje atribút style lenivo – najprv ho prečítame, až potom odstránime
function obnovStyl(e, povodny) {
  e.getAttribute('style');
  if (povodny === null) e.removeAttribute('style'); else e.setAttribute('style', povodny);
}
function odskok(e) {
  if (!smieHybat()) return;
  animujStyl(e, 380 / STAV.rychlost, p => ({ transform: `translateY(${(-8 * Math.sin(Math.PI * p)).toFixed(2)}px)` }));
}

/* Prekreslenie scény: nový obsah sa vždy postaví celý (čistá funkcia kroku).
   Ak sa animuje, prvky s rovnakým data-k sa plynulo presunú z pôvodného miesta
   a nové prvky jemne vyskočia. data-k dávame len „listom“ (nie vnoreným prvkom). */
function prekresli(scena, novy, animovat) {
  dokonciVsetky();
  const pohyb = animovat && smieHybat() && scena.offsetParent !== null;
  const stare = new Map();
  if (pohyb) for (const e of $$('[data-k]', scena)) stare.set(e.dataset.k, e.getBoundingClientRect());
  scena.replaceChildren(novy);
  if (!pohyb) return;
  const ms = trvanie();
  for (const e of $$('[data-k]', scena)) {
    const r1 = e.getBoundingClientRect(), r0 = stare.get(e.dataset.k);
    if (r0) {
      const dx = r0.left - r1.left, dy = r0.top - r1.top;
      if (Math.abs(dx) + Math.abs(dy) < 0.5) continue;
      animujStyl(e, ms, p => { const q = 1 - ease.inOut(p); return { transform: `translate(${(dx * q).toFixed(2)}px,${(dy * q).toFixed(2)}px)` }; });
    } else {
      animujStyl(e, ms, p => ({ transform: `scale(${(0.3 + 0.7 * ease.back(p)).toFixed(3)})`, opacity: Math.min(1, p * 2.5).toFixed(3) }));
    }
  }
}

function venecSVG() {
  // vavrínové listy po oblúku nad hlavou, dve vetvičky
  let s = '';
  const cx = 60, cy = 58, R = 35;
  for (const strana of [-1, 1]) {
    for (let k = 0; k < 6; k++) {
      const st = -90 + strana * (12 + k * 15);
      const u = st * Math.PI / 180;
      const x = (cx + R * Math.cos(u)).toFixed(1), y = (cy + R * Math.sin(u)).toFixed(1);
      const rot = (st + 90 + strana * 28).toFixed(1);
      s += `<ellipse cx="${x}" cy="${y}" rx="8.5" ry="4" fill="${k % 2 ? '#4f9e46' : '#76c463'}" transform="rotate(${rot} ${x} ${y})"/>`;
    }
  }
  return s;
}

// Rimko s bublinou: povedz(text, výraz) – výrazy: premysla, tesi, povzbudzuje
function vytvorRimka(miesto) {
  const postava = h('div', { class: 'rimkoPostava', html: rimkoSVG(false) });
  const bublina = h('div', { class: 'bublina', 'aria-live': 'polite' });
  // reproduktor: zobrazí sa len vtedy, keď prehliadač má slovenský hlas
  const repro = h('button', { type: 'button', class: 'reproduktor', 'aria-label': T.nahlas.tlacidlo, 'aria-pressed': 'false', hidden: true,
    onclick: () => { NAHLAS.zapnute = !NAHLAS.zapnute; synchronizujNahlas(); if (NAHLAS.zapnute) precitaj(text); else zastavCitanie(); } },
  h('span', { html: IKONY.reproduktor, style: 'display:contents' }));
  NAHLAS.tlacidla.add(repro);
  synchronizujNahlas();
  miesto.append(h('div', { class: 'rimko' }, h('div', { class: 'rimkoStlpec' }, postava, repro), bublina));
  const svg = postava.firstElementChild;
  let text = '', vyraz = '';
  return {
    povedz(t, v = 'premysla', skok = true) {
      text = t; vyraz = v;
      bublina.textContent = t;
      svg.setAttribute('class', 'rimkoSvg vyraz-' + v);
      svg.setAttribute('aria-label', T.rimko[v]);
      if (skok) odskok(postava);
      if (NAHLAS.zapnute && miesto.offsetParent !== null) precitaj(t);
    },
    text: () => text,
    vyraz: () => vyraz
  };
}

/* ----- voliteľné čítanie nahlas cez vstavané speechSynthesis (predvolene vypnuté) ----- */
const NAHLAS = { zapnute: false, hlas: null, tlacidla: new Set() };
// slovenský hlas z daného syntetizátora, inak null; nikdy nevyhodí chybu
function slovenskyHlas(ss) {
  try {
    if (!ss || typeof ss.getVoices !== 'function') return null;
    return (ss.getVoices() || []).find(v => /^sk/i.test(String(v && v.lang))) || null;
  } catch (_) { return null; }
}
function synchronizujNahlas() {
  for (const b of NAHLAS.tlacidla) {
    b.hidden = !NAHLAS.hlas;
    b.setAttribute('aria-pressed', String(NAHLAS.zapnute && !!NAHLAS.hlas));
  }
}
function obnovHlas() {
  try { NAHLAS.hlas = slovenskyHlas(window.speechSynthesis); } catch (_) { NAHLAS.hlas = null; }
  if (!NAHLAS.hlas) NAHLAS.zapnute = false;
  synchronizujNahlas();
}
function precitaj(text) {
  try {
    if (!NAHLAS.zapnute || !NAHLAS.hlas || !text) return;
    const u = new SpeechSynthesisUtterance(String(text).replace(/[✔✘★]/g, ''));
    u.voice = NAHLAS.hlas; u.lang = NAHLAS.hlas.lang; u.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (_) { /* tichý návrat */ }
}
function zastavCitanie() { try { window.speechSynthesis.cancel(); } catch (_) { /* tichý návrat */ } }

/* ----- stavebné kamene scén ----- */
// dlaždica so znakom; hodnota sa ukáže pod ňou (záporná = odoberáme)
function kamenEl(z, { kluc, maly = false, hodnota = null, preskrtnuty = false } = {}) {
  const obal = h('span', { class: 'kamenObal' + (maly ? ' maly' : '') + (preskrtnuty ? ' preskrtnuty' : ''), 'data-k': kluc });
  obal.append(h('span', { class: 'kamen rimske' }, z));
  if (hodnota != null) obal.append(h('span', { class: 'hodnota' + (String(hodnota).startsWith('−') ? ' minus' : '') }, hodnota));
  if (preskrtnuty) obal.append(h('span', { class: 'krizik', 'aria-hidden': 'true' }, '✘'));
  return obal;
}
// kocky po 5 v rade; posledných „ubrat“ kociek je vyznačených ako odobraté
function kockyEl(n, { kluc = 'k', ubrat = 0 } = {}) {
  const box = h('div', { class: 'kocky', 'aria-hidden': 'true' });
  for (let start = 0; start < n; start += 5) {
    const riadok = h('div', { class: 'riadokKociek' });
    for (let j = start; j < Math.min(n, start + 5); j++) {
      riadok.append(h('span', { class: 'kocka' + (j >= n - ubrat ? ' ubrata' : ''), 'data-k': kluc + j }));
    }
    box.append(riadok);
  }
  return box;
}
// tyč desiatky = 10 dielikov
function tycEl(kluc) {
  const t = h('span', { class: 'tyc', 'data-k': kluc });
  for (let j = 0; j < 10; j++) t.append(h('i'));
  return t;
}
// názorné bloky pre jeden rád: desiatky = tyče, jednotky = kocky
function blokyEl(hv) {
  const r = infoRadu(hv);
  if (r.rad === 0) return kockyEl(r.cifra, { kluc: `b${hv}-` });
  if (r.rad === 1) {
    const box = h('div', { class: 'tyce', 'aria-hidden': 'true' });
    for (let j = 0; j < r.cifra; j++) box.append(tycEl(`b${hv}-${j}`));
    return box;
  }
  // stovky = štvorce 10 × 10, tisíce = veľké kocky; po 5 v rade
  const box = h('div', { class: r.rad === 2 ? 'stvorce' : 'tisice', 'aria-hidden': 'true' });
  for (let start = 0; start < r.cifra; start += 5) {
    const riadok = h('div', { class: 'riadokKociek' });
    for (let j = start; j < Math.min(r.cifra, start + 5); j++) {
      riadok.append(r.rad === 2 ? h('span', { class: 'stvorec', 'data-k': `b${hv}-${j}` })
        : h('span', { class: 'tisic', 'data-k': `b${hv}-${j}`, html: IKONY.tisic }));
    }
    box.append(riadok);
  }
  return box;
}
// dlaždice zápisu jedného rádu (napr. 9 → malá I s −1 a X s 10)
function kameneRadu(hv, sHodnotou = true) {
  const r = infoRadu(hv);
  const box = h('div', { class: 'kamene' });
  [...r.zapis].forEach((z, j) => {
    const minus = r.odcitanie && j === 0;
    box.append(kamenEl(z, { kluc: `t${hv}-${j}`, maly: minus, hodnota: sHodnotou ? (minus ? '−' : '') + HODNOTY[z] : null }));
  });
  return box;
}

/* =====================================================================
   SPOLOČNÉ OVLÁDANIE (jeden komponent pre všetky karty)
   ===================================================================== */
const posluchaciRychlosti = new Set();
function nastavRychlost(v) {
  STAV.rychlost = Math.max(0.5, Math.min(2, +v || 1));
  for (const f of posluchaciRychlosti) f(STAV.rychlost);
}
function ikona(meno) { return h('span', { class: 'ik', html: IKONY[meno], style: 'display:contents' }); }

function vytvorOvladanie(koren, api) {
  const o = T.ovl;
  const bKroky = h('button', { type: 'button', 'aria-pressed': 'true', onclick: () => api.rezim('kroky') }, o.poKrokoch);
  const bSamo = h('button', { type: 'button', 'aria-pressed': 'false', onclick: () => api.rezim('samo') }, o.samo);
  const bSpat = h('button', { type: 'button', onclick: api.spat }, ikona('spat'), o.spat);
  const bDalej = h('button', { type: 'button', class: 'primary', onclick: api.dalej }, o.dalej, ikona('dalej'));
  const bHraj = h('button', { type: 'button', class: 'primary', onclick: api.prehrajPauza });
  const bZnova = h('button', { type: 'button', onclick: api.znova }, ikona('znova'), o.znova);
  const bodky = h('div', { class: 'bodky', role: 'group', 'aria-label': o.kroky });
  const range = h('input', { type: 'range', min: '0.5', max: '2', step: '0.1', value: STAV.rychlost, 'aria-label': o.rychlost,
    oninput: e => nastavRychlost(e.target.value) });
  const HODN = [0.5, 1, 2];
  const predvolby = HODN.map((v, i) => h('button', { type: 'button', 'aria-label': `${o.predvolby[i]} ${fmtDes(v)}×`,
    onclick: () => nastavRychlost(v) }, fmtDes(v) + '×'));
  const rychlost = h('div', { class: 'rychlost', role: 'group', 'aria-label': o.rychlost },
    h('div', { class: 'posuvnik' },
      h('span', { class: 'zviera', html: fmt(IKONY.korytnacka, { a: o.korytnacka }) }), range,
      h('span', { class: 'zviera', html: fmt(IKONY.zajac, { a: o.zajac }) })),
    h('div', { class: 'riadok' }, predvolby));
  koren.append(
    h('div', { class: 'riadok', role: 'group', 'aria-label': o.rezim }, bKroky, bSamo),
    h('div', { class: 'riadok' }, bSpat, bHraj, bDalej, bZnova),
    bodky, rychlost);

  const synchronizuj = v => {
    range.value = v;
    predvolby.forEach((b, i) => b.setAttribute('aria-pressed', String(Math.abs(HODN[i] - v) < 1e-9)));
  };
  posluchaciRychlosti.add(synchronizuj);
  synchronizuj(STAV.rychlost);

  let pocetBodiek = -1;
  return {
    aktualizuj({ index, pocet, hra, rezim }) {
      if (pocet !== pocetBodiek) {
        pocetBodiek = pocet;
        bodky.replaceChildren(...Array.from({ length: pocet }, (_, i) =>
          h('button', { type: 'button', class: 'bodka', 'aria-label': fmt(o.krok, { i: i + 1, n: pocet }), onclick: () => api.skoc(i) }, h('span'))));
      }
      $$('.bodka', bodky).forEach((b, i) => {
        b.classList.toggle('hotova', i < index);
        if (i === index) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
      });
      const samo = rezim === 'samo';
      bKroky.setAttribute('aria-pressed', String(!samo));
      bSamo.setAttribute('aria-pressed', String(samo));
      bSpat.hidden = samo; bDalej.hidden = samo; bHraj.hidden = !samo; rychlost.hidden = !samo;
      bSpat.disabled = index <= 0;
      bDalej.disabled = index >= pocet - 1;
      bHraj.replaceChildren(ikona(hra ? 'pauza' : 'prehraj'), hra ? o.pauza : o.prehraj);
    }
  };
}

/* =====================================================================
   ENGINE KROKOV – scenár = pole {text, data, vyraz}; render(i) je čistá funkcia
   ===================================================================== */
function vytvorPrehravac({ sekcia, kresli }) {
  const rimko = vytvorRimka($('.rimkoMiesto', sekcia));
  const scena = $('.scena', sekcia);
  let kroky = [], index = 0, rezim = 'kroky', hra = false, casovac = 0;

  const ovl = vytvorOvladanie($('.ovladanie', sekcia), {
    spat: () => { zastav(); if (index > 0) render(index - 1, true); },
    dalej: () => { zastav(); if (index < kroky.length - 1) render(index + 1, true); },
    prehrajPauza: () => (hra ? zastav() : spusti()),
    znova: () => { zastav(); render(0, false); if (rezim === 'samo') spusti(); },
    skoc: i => { zastav(); render(i, false); },
    rezim: r => { rezim = r; if (r === 'samo') spusti(); else zastav(); aktualizujOvl(); }
  });
  function aktualizujOvl() { ovl.aktualizuj({ index, pocet: kroky.length, hra, rezim }); }

  // vykreslí krok i; animuje len pri pohybe o jeden krok
  function render(i, animovat) {
    index = Math.max(0, Math.min(kroky.length - 1, i));
    const k = kroky[index];
    prekresli(scena, kresli(k, index, kroky), animovat);
    rimko.povedz(k.text, k.vyraz || 'premysla', animovat);
    aktualizujOvl();
  }
  // režim „Samo“: čakanie úmerné rýchlosti a dĺžke textu
  function cakanie() { return trvanie() + (1100 + 55 * kroky[index].text.length) / STAV.rychlost; }
  function naplanuj() {
    clearTimeout(casovac);
    casovac = setTimeout(() => {
      if (!hra) return;
      if (index < kroky.length - 1) render(index + 1, true);
      if (index >= kroky.length - 1) zastav(); else naplanuj();
    }, cakanie());
  }
  function spusti() {
    if (index >= kroky.length - 1) render(0, false);
    hra = true; aktualizujOvl(); naplanuj();
  }
  function zastav() { hra = false; clearTimeout(casovac); aktualizujOvl(); }

  return {
    rimko, scena,
    nastavKroky(nove) { zastav(); kroky = nove; render(0, false); },
    render, zastav,
    // prekreslí len scénu aktuálneho kroku (keď sa zmení stav mimo scenára, napr. odkryté hodnoty)
    obnov: animovat => prekresli(scena, kresli(kroky[index], index, kroky), animovat),
    dalej: () => { if (index < kroky.length - 1) render(index + 1, true); },
    spat: () => { if (index > 0) render(index - 1, true); },
    index: () => index,
    pocet: () => kroky.length,
    kroky: () => kroky,
    // serializovaný stav na porovnanie v testoch
    stav: () => JSON.stringify({
      i: index, text: rimko.text(), vyraz: rimko.vyraz(), scena: scena.innerHTML,
      bodky: $$('.bodka', sekcia).map(b => b.className + '|' + (b.getAttribute('aria-current') || '')).join(',')
    })
  };
}

/* =====================================================================
   KOSTRA KARIET A NAVIGÁCIA
   ===================================================================== */
const KARTY = {};   // id → { sekcia, prehravac? }
function kostraKarty(id) {
  return h('section', { class: 'karta', id: 'karta-' + id, role: 'tabpanel', 'aria-labelledby': 'tab-' + id, hidden: true },
    h('h2', { class: 'skryte' }, T.karty[id].nazov),
    h('div', { class: 'rimkoMiesto' }));
}
function zvedaveEl(texty, ...navyse) {
  return h('details', { class: 'zvedave' }, h('summary', {}, T.zvedave), texty.map(t => h('p', {}, t)), navyse);
}
function ukazKartu(id, zapisHash = true) {
  if (!KARTY[id]) id = PORADIE_KARIET[0];
  if (STAV.karta && STAV.karta !== id && KARTY[STAV.karta].prehravac) KARTY[STAV.karta].prehravac.zastav();
  const zmena = STAV.karta !== id;
  STAV.karta = id;
  for (const k of PORADIE_KARIET) {
    KARTY[k].sekcia.hidden = k !== id;
    const tab = $('#tab-' + k);
    tab.setAttribute('aria-selected', String(k === id));
    tab.tabIndex = k === id ? 0 : -1;
  }
  // menu na telefóne: ukáže názov karty a po výbere sa zavrie
  const menu = $('.menuKariet');
  if (menu) {
    $('.aktualnaKarta', menu).textContent = T.karty[id].nazov;
    menu.setAttribute('aria-expanded', 'false');
    $('#karty').classList.remove('otvorene');
  }
  if (KARTY[id].priZobrazeni) KARTY[id].priZobrazeni();
  // plynulý prechod medzi kartami
  if (zmena && smieHybat()) {
    const s = KARTY[id].sekcia;
    animujStyl(s, 260 / STAV.rychlost, p => ({ transform: `translateY(${(14 * (1 - ease.out(p))).toFixed(1)}px)`, opacity: Math.min(1, 0.2 + p).toFixed(2) }));
  }
  if (zapisHash && location.hash !== '#/' + id) history.replaceState(null, '', '#/' + id);
}

/* =====================================================================
   KARTA 1: Znaky I V X
   ===================================================================== */
function postavZnaky() {
  const t = T.znaky;
  const sekcia = kostraKarty('znaky');
  const rimko = vytvorRimka($('.rimkoMiesto', sekcia));
  const dlazdice = h('div', { class: 'dlazdice' });
  const kockyBox = h('div', { class: 'kockyZnaku', 'aria-live': 'polite' });
  const tlacidla = {};
  const mierka = { I: 1, V: 1, X: 1 };

  // zväčšenie vybranej dlaždice (jemný odskok)
  function zvacsi(z, ciel) {
    const b = tlacidla[z], od = mierka[z];
    mierka[z] = ciel;
    if (!smieHybat()) { b.style.transform = ciel === 1 ? '' : `scale(${ciel})`; return; }
    tween(320 / STAV.rychlost, p => {
      const s = od + (ciel - od) * ease.back(p);
      b.style.transform = `scale(${s.toFixed(3)})`;
    }, () => { if (ciel === 1) b.style.transform = ''; });
  }
  // kocky vyskakujú jedna po druhej
  function vyskocKocky() {
    const kocky = $$('.kocka', kockyBox);
    if (!smieHybat()) return;
    const ms = (260 + 45 * kocky.length) / STAV.rychlost, krok = 1 / (kocky.length + 4);
    tween(ms, p => kocky.forEach((k, j) => {
      const q = Math.max(0, Math.min(1, (p - j * krok) / (5 * krok)));
      k.style.transform = `scale(${(ease.back(q)).toFixed(3)})`;
      k.style.opacity = Math.min(1, q * 3).toFixed(2);
    }), () => kocky.forEach(k => obnovStyl(k, null)));
  }
  function vyber(z) {
    for (const k of Object.keys(tlacidla)) {
      tlacidla[k].setAttribute('aria-pressed', String(k === z));
      zvacsi(k, k === z ? 1.08 : 1);
    }
    rimko.povedz(t.vyber[z], 'tesi');
    const n = HODNOTY[z];
    kockyBox.replaceChildren(kockyEl(n, { kluc: 'z' }), h('div', { class: 'popisKociek' }, `${n} ${tvarSlova(n, t.kocky)}`));
    vyskocKocky();
  }
  for (const z of ['I', 'V', 'X']) {
    const b = h('button', { type: 'button', class: 'dlazdica', 'aria-pressed': 'false',
      'aria-label': fmt(t.aria, { z, n: HODNOTY[z], popis: t.popis[z] }), onclick: () => vyber(z) },
      h('span', { class: 'znak', 'aria-hidden': 'true' }, z),
      h('span', { class: 'obrazok', html: OBRAZKY[z] }),
      h('span', { class: 'hodnotaDl', 'aria-hidden': 'true' }, HODNOTY[z]));
    tlacidla[z] = b;
    dlazdice.append(b);
  }

  /* ----- mini hra „Ktorý znak je 5?“ ----- */
  const HRA_HODNOTY = [1, 1, 5, 5, 10, 10];
  const hra = { otazky: [], i: 0, prvy: true, spravne: 0, casovac: 0 };
  const hraObsah = h('div', { class: 'hraObsah' });
  function zamiesaj() {
    // náhodné poradie, rovnaká hodnota nesmie ísť dvakrát za sebou
    let a;
    do {
      a = HRA_HODNOTY.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    } while (a.some((v, i) => i > 0 && v === a[i - 1]));
    return a;
  }
  function startHry() {
    clearTimeout(hra.casovac);
    Object.assign(hra, { otazky: zamiesaj(), i: 0, spravne: 0 });
    ukazOtazku();
  }
  function ukazOtazku() {
    hra.prvy = true;
    const n = hra.otazky[hra.i];
    const odpovede = h('div', { class: 'odpovede' });
    for (const z of ['I', 'V', 'X']) {
      const b = h('button', { type: 'button', class: 'odpoved', 'aria-label': z, onclick: () => odpovedz(b, z) }, z, h('span', { class: 'znacka', hidden: true }));
      odpovede.append(b);
    }
    hraObsah.replaceChildren(
      h('p', { class: 'otazka' }, fmt(t.otazka, { n })),
      h('p', { class: 'poradie' }, fmt(t.poradie, { i: hra.i + 1, n: hra.otazky.length })),
      odpovede);
    rimko.povedz(t.hraUvod, 'premysla');
    $('.odpoved', odpovede).focus({ preventScroll: true });
  }
  function odpovedz(b, z) {
    const n = hra.otazky[hra.i];
    const znacka = $('.znacka', b);
    znacka.hidden = false;
    if (HODNOTY[z] === n) {
      if (hra.prvy) hra.spravne++;
      b.classList.add('ok'); znacka.textContent = '✔';
      b.setAttribute('aria-label', `${z}, ${t.znackaOk}`);
      $$('.odpoved', hraObsah).forEach(x => { x.disabled = true; });
      rimko.povedz(fmt(t.ok, { z, n }), 'tesi');
      odskok(b);
      hra.casovac = setTimeout(() => {
        hra.i++;
        if (hra.i < hra.otazky.length) ukazOtazku(); else koniecHry();
      }, 1500 / STAV.rychlost);
    } else {
      hra.prvy = false;
      b.classList.add('zle'); znacka.textContent = '✘';
      b.setAttribute('aria-label', `${z}, ${t.znackaZle}`);
      b.disabled = true;
      rimko.povedz(t.zle, 'povzbudzuje');
    }
  }
  function koniecHry() {
    const s = fmt(t.koniec, { s: hra.spravne, n: hra.otazky.length });
    hraObsah.replaceChildren(h('p', { class: 'otazka' }, '✔ ' + s),
      h('button', { type: 'button', class: 'primary', onclick: startHry }, ikona('znova'), t.hraZnova));
    rimko.povedz(s, 'tesi');
  }
  hraObsah.append(h('button', { type: 'button', class: 'primary', onclick: startHry }, ikona('prehraj'), t.hraStart));

  sekcia.append(
    h('div', { class: 'stredom' }, h('span', { class: 'stitokPomocka', html: IKONY.ziarovka }, t.pomocka)),
    dlazdice, kockyBox,
    h('div', { class: 'hra' }, h('h3', {}, t.hraNadpis), hraObsah),
    zvedaveEl(t.zvedaveText));
  rimko.povedz(t.uvod, 'premysla', false);
  KARTY.znaky = { sekcia, vyber, startHry };
  return sekcia;
}

/* =====================================================================
   KARTA 2: Palice a kocky (1 až 10)

function krokyPalice() {
  const t = T.palice.kroky;
  const data = [{ n: 1 }, { n: 2 }, { n: 3 }, { n: 4, typ: 'nepiseme' }, { n: 4 }, { n: 5 }, { n: 6 }, { n: 7 }, { n: 8 }, { n: 9 }, { n: 10 }];
  return data.map((d, i) => ({ text: t[i], data: { typ: 'zapis', ...d }, vyraz: i === data.length - 1 ? 'tesi' : 'premysla' }));

function kresliPalice(krok) {
  const { n, typ } = krok.data;
  const f = document.createDocumentFragment();
  const stavba = h('div', { class: 'stavba' });

    stavba.append(kamene, h('div', { class: 'rovnica' }, h('span', { class: 'stitok zle', 'data-k': 'nep' }, '✘ ' + T.palice.nepiseme)), kockyEl(4));
  } else {

      const minus = r.odcitanie && j === 0;
      kamene.append(kamenEl(z, { kluc: z + pocty[z], maly: minus, hodnota: (minus ? '−' : '') + HODNOTY[z] }));
    });
    const v = vypocet(n);
    stavba.append(kamene,
      h('div', { class: 'rovnica' }, v ? h('span', { 'data-k': 'rov' + n, style: 'display:inline-block' }, v) : null),

  const schody = h('div', { class: 'schody', role: 'img', 'aria-label': T.palice.schodyAria });
  for (let k = 1; k <= 10; k++) {
    const dosiahnuty = k < n || (k === n && typ !== 'nepiseme');
    schody.append(h('div', { class: 'stlpec' + (dosiahnuty ? ' hotovy' : '') + (k === n ? ' aktualny' : ''), style: `--k:${k};--kr:${(k - 1) % 5 + 1}` },
      h('div', { class: 'miestoRimka' }, k === n ? h('span', { 'data-k': 'rimko', style: 'display:block', html: rimkoSVG(true) }) : null),
      h('div', { class: 'schod' }, h('span', { class: 'rim' }, dosiahnuty ? toRoman(k) : '?'), h('span', { class: 'arab' }, k))));
  }
  f.append(stavba, schody);
  return f;
}
function postavPalice() {
  const sekcia = kostraKarty('palice');

}

/* =====================================================================
   KARTA 3: Prevod do maxima úrovne
   ===================================================================== */
function textRadu(hv) {
  const p = T.prevod, r = infoRadu(hv);
  const vzory = [p.jednotky, p.desiatky, p.stovky, p.tisice][r.rad] || [];
  return fmt(vzory[r.cifra] || p.vseobecne, { h: hv, r: r.zapis });
}
// scenár: úvod, rozklad (ak sú aspoň 2 rády), po kroku na rád, spojenie (ak sú aspoň 2 rády)
function krokyPrevodu(n) {
  const p = T.prevod, rady = decompose(n), viac = rady.length > 1;
  const kroky = [{ text: fmt(p.uvod, { n }), data: { typ: 'uvod', n, rady } }];
  if (viac) kroky.push({ text: fmt(p.rozklad, { zoznam: zoznamSlovami(rady) }), data: { typ: 'rozklad', n, rady } });
  rady.forEach((hv, k) => kroky.push({ text: textRadu(hv), data: { typ: 'rad', n, rady, hotovo: k + 1 }, vyraz: !viac ? 'tesi' : 'premysla' }));
  if (viac) kroky.push({ text: fmt(p.spoj, { r: toRoman(n) }), data: { typ: 'spoj', n, rady }, vyraz: 'tesi' });
  return kroky;
}
function ikonaRadu(rad) { return h('span', { html: IKONY[['kocka', 'tyc', 'stvorec', 'tisic'][rad]], style: 'display:contents' }); }
// približná šírka zápisu v em (patkové písmo + okraje dlaždíc), aby sa doska zmestila na riadok
function sirkaZapisu(zapis) {
  const W = { M: 0.95, D: 0.78, C: 0.72, L: 0.66, X: 0.76, V: 0.76, I: 0.42 };
  return [...zapis].reduce((s, z) => s + W[z] + 0.22, 0.5);
}
function kresliPrevod(krok) {
  const { typ, n, rady, hotovo = 0 } = krok.data;
  const f = document.createDocumentFragment();
  const horny = h('div', { class: 'hornyRiadok' }, h('span', { class: 'velkeCislo', 'data-k': 'n' }, n));
  f.append(horny);
  if (typ === 'uvod') {
    f.append(h('div', { class: 'cele' }, rady.map(blokyEl)));
    return f;
  }
  if (typ === 'spoj') {
    const doska = h('span', { class: 'doska', role: 'img', 'aria-label': toRoman(n), style: `--w:${sirkaZapisu(toRoman(n)).toFixed(2)}` });
    for (const hv of rady) [...infoRadu(hv).zapis].forEach((z, j) => doska.append(kamenEl(z, { kluc: `t${hv}-${j}` })));
    horny.append(h('span', { class: 'rovnaSa', 'data-k': 'rovna' }, '='), doska);
  }
  const skupiny = h('div', { class: 'skupiny' });
  rady.forEach((hv, k) => {
    const r = infoRadu(hv);
    const sk = h('div', { class: `skupina rad${r.rad}` + (typ === 'rad' && k === hotovo - 1 ? ' aktivna' : '') },
      h('div', { class: 'hlavicka', 'data-k': 'l' + hv }, ikonaRadu(r.rad), h('span', { class: 'cislo' }, hv), h('span', { class: 'nazovRadu' }, T.prevod.nazvyRadov[r.rad])),
      blokyEl(hv));
    if (typ === 'rad' && k < hotovo) {
      sk.append(kameneRadu(hv));
      const v = vypocet(hv);
      if (v) sk.append(h('span', { class: 'vypocet', 'data-k': 'v' + hv }, v));
    }
    skupiny.append(sk);
  });
  f.append(skupiny);
  return f;
}
function postavPrevod() {
  const p = T.prevod;
  const sekcia = kostraKarty('prevod');
  let cislo = 26, prehravac = null;
  // štyri kolieska ako na počítadle kilometrov: tisíce, stovky, desiatky, jednotky
  const kolieska = h('div', { class: 'kolieska', role: 'group', 'aria-label': p.cislo });
  const kol = [];
  for (let rad = 3; rad >= 0; rad--) {
    const cifra = h('span', { class: 'cifra' }, '0');
    const hore = h('button', { type: 'button', class: 'kolTl', 'aria-label': fmt(p.kolViac, { rad: p.nazvyRadov[rad] }), onclick: () => posun(rad, 1) }, '▲');
    const dole = h('button', { type: 'button', class: 'kolTl', 'aria-label': fmt(p.kolMenej, { rad: p.nazvyRadov[rad] }), onclick: () => posun(rad, -1) }, '▼');
    const el = h('div', { class: 'koliesko' },
      h('span', { class: 'kolSkratka', title: p.nazvyRadov[rad] }, ikonaRadu(rad), p.skratky[rad]),
      hore, h('div', { class: 'okienko', 'aria-hidden': 'true' }, cifra), dole);
    kol[rad] = { el, cifra, hore, dole };
    kolieska.append(el);
  }
  const vystup = h('output', { class: 'skryte', 'aria-live': 'polite' });
  const bNahodne = h('button', { type: 'button', onclick: () => {
    const max = NASTAVENIE.maximum;
    let m; do { m = 1 + Math.floor(Math.random() * max); } while (m === cislo && max > 1);
    nastavCislo(m);
  } }, ikona('kocka6'), p.nahodne);
  function posun(rad, smer) { nastavCislo(posunKoliesko(cislo, rad, smer, NASTAVENIE.maximum), smer); }
  function aktualizujKolieska(smer) {
    const max = NASTAVENIE.maximum, s = String(cislo).padStart(4, '0');
    for (let rad = 0; rad < 4; rad++) {
      const k = kol[rad], d = s[3 - rad], aktivne = 10 ** rad <= max;
      const zmena = k.cifra.textContent !== d;
      k.cifra.textContent = d;
      k.el.classList.toggle('vypnute', !aktivne);
      k.el.classList.toggle('nula', cislo < 10 ** rad);   // úvodná nula
      k.hore.disabled = !aktivne || cislo >= max;
      k.dole.disabled = !aktivne || cislo <= 1 || cislo < 10 ** rad;
      // koliesko sa pootočí
      if (zmena && smer && smieHybat()) {
        animujStyl(k.cifra, 240 / STAV.rychlost, q => ({ transform: `translateY(${(-smer * 30 * (1 - ease.out(q))).toFixed(1)}px)`, opacity: Math.min(1, 0.2 + q).toFixed(2) }));
      }
    }
    vystup.textContent = cislo;
  }
  // tabuľka čísel (v rozbaľovači) – najviac do 100
  const tabulka = h('div', { class: 'tabulka' });
  function postavTabulku() {
    tabulka.replaceChildren();
    for (let k = 1; k <= Math.min(100, NASTAVENIE.maximum); k++) {
      tabulka.append(h('button', { type: 'button', 'aria-label': `${k} = ${toRoman(k)}`, onclick: () => { nastavCislo(k); sekcia.scrollIntoView({ block: 'start' }); } },
        h('span', {}, k), h('span', { class: 'rimske' }, toRoman(k))));
    }
  }
  sekcia.append(vytvorVyberUrovne(),
    h('div', { class: 'vstupKoliesok' }, kolieska, vystup, bNahodne),
    h('div', { class: 'scena' }), h('div', { class: 'ovladanie' }), zvedaveEl(p.zvedaveText, tabulka));
  function nastavCislo(m, smer = 0) {
    cislo = Math.max(1, Math.min(NASTAVENIE.maximum, m));
    aktualizujKolieska(smer);
    if (prehravac) prehravac.nastavKroky(krokyPrevodu(cislo));
  }
  // pri zmene úrovne sa číslo oreže na nové maximum
  posluchaciUrovne.add(() => { postavTabulku(); nastavCislo(cislo); });
  postavTabulku();
  KARTY.prevod = { sekcia, nastavCislo, posun, cislo: () => cislo, kolieska: kol, init(pr) { prehravac = pr; nastavCislo(cislo); } };
  return sekcia;
}
// výber úrovne Malý / Stredný / Veľký / Majster (stav je spoločný pre všetky karty)
function vytvorVyberUrovne() {
  const u = T.urovne;
  const box = h('div', { class: 'urovne', role: 'group', 'aria-label': u.nadpis });
  const tl = NASTAVENIE.urovne.map((m, i) => h('button', { type: 'button', 'aria-pressed': 'false', onclick: () => nastavUroven(i) },
    h('span', {}, u.nazvy[i]), h('span', { class: 'urDo' }, fmt(u.do, { m }))));
  box.append(...tl);
  const sync = () => tl.forEach((b, i) => b.setAttribute('aria-pressed', String(i === STAV.uroven)));
  posluchaciUrovne.add(sync);
  sync();
  return box;
}

/* =====================================================================
   KARTA: Nové znaky L C D M
   ===================================================================== */
// dáta pomôcky LaCo DoMa: prvé písmeno slabiky = znak, poradie = od najmenšej hodnoty
const LACO = T.lcdm.slabiky.map(s => ({ slabika: s, znak: s[0], hodnota: HODNOTY[s[0]] }));
const lcdmStav = { ukazane: new Set() };   // tabule, ktoré už ukazujú hodnotu
function krokyLcdm() {
  return T.lcdm.kroky.map((text, i) => ({ text, data: { pocet: Math.min(i, LACO.length), sipka: i > LACO.length }, vyraz: i > LACO.length ? 'tesi' : 'premysla' }));
}
function kresliLcdm(krok) {
  const { pocet, sipka } = krok.data;
  const f = document.createDocumentFragment();
  // veta LaCo DoMa; vyskočené písmeno sa presunie nad svoju tabuľu
  const veta = h('div', { class: 'veta', role: 'img', 'aria-label': 'LaCo DoMa' });
  for (let w = 0; w < LACO.length; w += 2) {

        L.slabika.slice(1)));
    }

  }
  const tabule = h('div', { class: 'tabule' });
  LACO.forEach((L, j) => {
    const svieti = j < pocet;
    tabule.append(h('div', { class: 'stlpecTabule' },
      h('div', { class: 'miestoPismena' }, svieti ? h('span', { class: 'vyskocene', 'data-k': 'p' + L.znak }, L.znak) : null),

function postavHodiny() {
  const t = T.hodiny, sekcia = kostraKarty('hodiny');

  // ručička sa plynulo otočí najkratšou cestou

        .forEach(([k, v]) => ruka.setAttribute(k, v));

  rimko.povedz(t.uvod, 'premysla', false);
  const list = listEl();
  const nahlad = h('div', { class: 'nahladListu' }, list);
  sekcia.append(h('div', { class: 'akcie' }, h('button', { type: 'button', class: 'primary', onclick: () => { try { window.print(); } catch (_) { /* tlač nie je dostupná */ } } }, ikona('tlac'), t.tlacidlo)), nahlad);
  // náhľad: list A4 sa zmenší na šírku karty
  function prisposob() {
    if (sekcia.hidden) return;
    const f = Math.min(1, nahlad.clientWidth / (list.offsetWidth || 1));
    list.style.transform = `scale(${f.toFixed(4)})`;
    nahlad.style.height = Math.ceil(list.offsetHeight * f) + 'px';
  }
  window.addEventListener('resize', prisposob);
  KARTY.tlac = { sekcia, list, priZobrazeni: prisposob };
  return sekcia;
}

/* =====================================================================
   ŠTART
   ===================================================================== */
function init() {
  document.title = T.titul;
  $('#titul').textContent = T.titul;
  $('#podtitul').textContent = T.podtitul;
  $('#pata').textContent = T.pata;
  $('#logo').innerHTML = rimkoSVG(true);
  const nav = $('#karty');
  nav.setAttribute('aria-label', T.kartyAria);
  // na telefóne sa karty zbalia za tlačidlo „Témy“
  const menu = h('button', { type: 'button', class: 'menuKariet', 'aria-expanded': 'false', 'aria-controls': 'karty',
    onclick: () => { const o = nav.classList.toggle('otvorene'); menu.setAttribute('aria-expanded', String(o)); } },
    h('span', {}, T.menu.temy), h('span', { class: 'aktualnaKarta' }));
  nav.before(menu);
  for (const id of PORADIE_KARIET) {
    nav.append(h('button', { type: 'button', role: 'tab', id: 'tab-' + id, 'aria-controls': 'karta-' + id, 'aria-selected': 'false',
      onclick: () => ukazKartu(id) }, h('span', { html: IKONY_KARIET[id], style: 'display:contents' }), T.karty[id].nazov));
  }
  // šípky vľavo/vpravo medzi kartami v lište
  nav.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = PORADIE_KARIET.indexOf(STAV.karta), d = e.key === 'ArrowRight' ? 1 : -1;
    const id = PORADIE_KARIET[(i + d + PORADIE_KARIET.length) % PORADIE_KARIET.length];
    ukazKartu(id); $('#tab-' + id).focus(); e.preventDefault();
  });
  const obsah = $('#obsah');
  obsah.append(postavZnaky(), postavPalice(), postavLcdm(), postavPravidla(), postavSablona(), postavPrevod(),
    postavCitanie(), postavChyby(), postavHodiny(), postavKde(), postavPostav(), postavKviz(), postavTlac());
  // engine krokov pre karty so scenárom
  KARTY.palice.prehravac = vytvorPrehravac({ sekcia: KARTY.palice.sekcia, kresli: kresliPalice });
  KARTY.palice.prehravac.nastavKroky(krokyPalice());
  KARTY.lcdm.prehravac = vytvorPrehravac({ sekcia: KARTY.lcdm.sekcia, kresli: kresliLcdm });
  initLcdm(KARTY.lcdm.prehravac);
  KARTY.pravidla.prehravac = vytvorPrehravac({ sekcia: KARTY.pravidla.sekcia, kresli: kresliPravidlo });
  KARTY.pravidla.init(KARTY.pravidla.prehravac);
  KARTY.prevod.prehravac = vytvorPrehravac({ sekcia: KARTY.prevod.sekcia, kresli: kresliPrevod });
  KARTY.prevod.init(KARTY.prevod.prehravac);
  KARTY.citanie.prehravac = vytvorPrehravac({ sekcia: KARTY.citanie.sekcia, kresli: kresliCitanie });
  KARTY.citanie.init(KARTY.citanie.prehravac);
  KARTY.chyby.prehravac = vytvorPrehravac({ sekcia: KARTY.chyby.sekcia, kresli: kresliChyby });
  KARTY.chyby.init(KARTY.chyby.prehravac);
  // hra a kvíz: engine ukazuje riešenie (scenár z karty prevodu)
  KARTY.postav.prehravac = vytvorPrehravac({ sekcia: KARTY.postav.sekcia, kresli: kresliPrevod });
  KARTY.postav.init(KARTY.postav.prehravac);
  KARTY.kviz.prehravac = vytvorPrehravac({ sekcia: KARTY.kviz.sekcia, kresli: kresliRiesenia });
  KARTY.kviz.init(KARTY.kviz.prehravac);
  // písmená I V X L C D M a Backspace z fyzickej klávesnice (čítanie a hra)
  document.addEventListener('keydown', e => {
    const k = KARTY[STAV.karta];
    if (!k || !k.klaves || e.altKey || e.ctrlKey || e.metaKey || e.target.closest('input')) return;
    const z = e.key.toUpperCase();
    if (z.length === 1 && HODNOTY[z]) { k.klaves(z); e.preventDefault(); }
    else if (e.key === 'Backspace') { k.zmaz(); e.preventDefault(); }
  });
  // čítanie nahlas: tlačidlo sa ukáže, až keď prehliadač nahlási slovenský hlas
  try {
    if (window.speechSynthesis) {
      obnovHlas();
      if (typeof speechSynthesis.addEventListener === 'function') speechSynthesis.addEventListener('voiceschanged', obnovHlas);
    }
  } catch (_) { /* bez čítania nahlas */ }
  // šípky vľavo/vpravo v karte = Späť / Ďalej (mimo posuvníka a lišty)
  document.addEventListener('keydown', e => {
    const p = KARTY[STAV.karta] && KARTY[STAV.karta].prehravac;
    if (!p || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target.closest('input, #karty')) return;
    if (e.key === 'ArrowRight') { p.zastav(); p.dalej(); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { p.zastav(); p.spat(); e.preventDefault(); }
  });
  const zHashu = () => location.hash.replace(/^#\/?/, '');
  window.addEventListener('hashchange', () => ukazKartu(zHashu(), false));
  ukazKartu(zHashu(), false);
  if (new URLSearchParams(location.search).has('test')) spustiTesty();
}

/* =====================================================================
   TESTY – spustia sa s ?test v adrese
   ===================================================================== */
function spustiTesty() {
  const vysledky = [];
  let ok = 0, zle = 0;
  const over = (podmienka, popis) => { if (podmienka) ok++; else { zle++; vysledky.push('✘ ' + popis); } };
  const vety = s => s.split(/(?<=[.!?])\s+/).filter(x => x.trim());

  // 1. toRoman – presné hodnoty
  const OCAK = { 1: 'I', 2: 'II', 3: 'III', 4: 'IV', 5: 'V', 6: 'VI', 7: 'VII', 8: 'VIII', 9: 'IX', 10: 'X', 11: 'XI', 14: 'XIV', 15: 'XV', 19: 'XIX', 20: 'XX', 24: 'XXIV', 26: 'XXVI', 29: 'XXIX', 30: 'XXX', 34: 'XXXIV', 38: 'XXXVIII', 39: 'XXXIX' };
  for (const [n, r] of Object.entries(OCAK)) over(toRoman(+n) === r, `toRoman(${n}) = ${toRoman(+n)}, čakám ${r}`);
  // navyše: celý rozsah – spätné čítanie dá to isté číslo, chybné vstupy hodia chybu
  const precitaj = s => [...s].reduce((sum, z, i) => sum + (HODNOTY[z] < (HODNOTY[s[i + 1]] || 0) ? -HODNOTY[z] : HODNOTY[z]), 0);
  let rozsahOk = true;
  for (let n = 1; n <= 3999; n++) if (precitaj(toRoman(n)) !== n || /(.)\1\1\1/.test(toRoman(n))) rozsahOk = false;
  over(rozsahOk, 'toRoman 1 až 3999: spätné čítanie alebo štyri rovnaké znaky');
  over(toRoman(3999) === 'MMMCMXCIX' && toRoman(1994) === 'MCMXCIV' && toRoman(444) === 'CDXLIV', 'toRoman pre veľké čísla');
  for (const zly of [0, 4000, 2.5, -1, NaN]) { let hodil = false; try { toRoman(zly); } catch (e) { hodil = true; } over(hodil, `toRoman(${zly}) má hodiť chybu`); }

  // 2. decompose
  const rovnake = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  over(rovnake(decompose(26), [20, 6]), 'decompose(26)');
  over(rovnake(decompose(30), [30]), 'decompose(30)');
  over(rovnake(decompose(7), [7]), 'decompose(7)');
  over(rovnake(decompose(39), [30, 9]), 'decompose(39)');
  over(rovnake(decompose(1904), [1000, 900, 4]), 'decompose(1904)');
  for (let n = 1; n <= 39; n++) {
    const d = decompose(n);
    over(d.reduce((a, b) => a + b, 0) === n, `súčet rozkladu ${n}`);
    over(d.map(hv => infoRadu(hv).zapis).join('') === toRoman(n), `spojenie zápisov rádov ${n}`);
  }

  // 3. počet krokov a dĺžka textov
  over(krokyPrevodu(26).length === 5, 'kroky 26 = 5');
  over(krokyPrevodu(7).length === 2, 'kroky 7 = 2');
  over(krokyPrevodu(30).length === 2, 'kroky 30 = 2');
  over(krokyPrevodu(39).length === 5, 'kroky 39 = 5');
  const vsetkyTexty = [];
  for (let n = 1; n <= NASTAVENIE.maximum; n++) krokyPrevodu(n).forEach(k => vsetkyTexty.push(k.text));
  krokyPalice().forEach(k => vsetkyTexty.push(k.text));
  for (const s of vsetkyTexty) {
    over(s.length <= 80, `text dlhší ako 80 znakov: „${s}“`);
    over(vety(s).length <= 2, `viac ako 2 vety: „${s}“`);
    over(vety(s).every(v => v.split(/\s+/).length <= 12), `veta má viac ako 12 slov: „${s}“`);
  }
  over(krokyPrevodu(26).map(k => k.text).join(' | ') === 'Máme číslo 26. | Rozložíme ho: 20 a 6. | 20 je XX: dve desiatky. | 6 je VI: päť a jedna. | Spojíme: XXVI.', 'texty scenára pre 26');

  // 4. krokovanie: stav po pohybe = čerstvo vykreslený stav pre ten istý index
  const povodnaKarta = STAV.karta;
  STAV.vynutPohyb = true;
  let seed = 12345;
  const nahoda = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const animPred = pocetSpustenychAnimacii;
  let porovnani = 0, nezhody = 0;
  const skusaj = (idKarty, pripravy, sekvencie) => {
    ukazKartu(idKarty, false);
    const p = KARTY[idKarty].prehravac;
    for (let s = 0; s < sekvencie; s++) {
      pripravy();
      const dlzka = 5 + Math.floor(nahoda() * 15);
      for (let m = 0; m < dlzka; m++) {
        if (nahoda() < 0.6) p.dalej(); else p.spat();
        dokonciVsetky();
        const poPohybe = p.stav();
        p.render(p.index(), false);
        porovnani++;
        if (poPohybe !== p.stav()) nezhody++;
      }
    }
  };
  for (let u = 0; u < NASTAVENIE.urovne.length; u++) {
    nastavUroven(u);
    skusaj('prevod', () => KARTY.prevod.nastavCislo(1 + Math.floor(nahoda() * NASTAVENIE.maximum)), u === 0 ? 200 : 60);
  }
  nastavUroven(0);
  skusaj('palice', () => KARTY.palice.prehravac.render(Math.floor(nahoda() * 11), false), 50);
  skusaj('lcdm', () => {
    lcdmStav.ukazane = new Set(LACO.filter(() => nahoda() < 0.5).map(L => L.znak));
    KARTY.lcdm.prehravac.render(Math.floor(nahoda() * 7), false);
  }, 50);
  skusaj('pravidla', () => KARTY.pravidla.zvol(Math.floor(nahoda() * PRAVIDLA.length)), 80);
  over(nezhody === 0, `krokovanie: ${nezhody} nezhôd z ${porovnani}`);
  const animacie = pocetSpustenychAnimacii - animPred;
  over(animacie > 0, 'pri krokovaní sa spustili animácie');
  STAV.vynutPohyb = false;
  lcdmStav.ukazane = new Set();
  KARTY.lcdm.prehravac.render(0, false);
  KARTY.pravidla.zvol(0);
  KARTY.prevod.nastavCislo(26);
  KARTY.palice.prehravac.render(0, false);
  ukazKartu(povodnaKarta, false);

  /* ----- ČASŤ 2 ----- */
  // P2-1. toRoman – presné hodnoty
  const OCAK2 = { 40: 'XL', 49: 'XLIX', 50: 'L', 90: 'XC', 99: 'XCIX', 100: 'C', 400: 'CD', 444: 'CDXLIV', 500: 'D', 900: 'CM', 999: 'CMXCIX', 1000: 'M', 1666: 'MDCLXVI', 1994: 'MCMXCIV', 2026: 'MMXXVI', 3999: 'MMMCMXCIX' };
  for (const [n, r] of Object.entries(OCAK2)) over(toRoman(+n) === r, `toRoman(${n}) = ${toRoman(+n)}, čakám ${r}`);
  // P2-2. regulárny výraz, žiadne štyri rovnaké znaky, všetky výstupy rôzne
  const VZOR_RIMSKY = /^M{0,3}(CM|CD|D?C{0,3})(XC|XL|L?X{0,3})(IX|IV|V?I{0,3})$/;
  const vystupy = new Set();
  let zlyVzor = 0, styri = 0;
  for (let n = 1; n <= 3999; n++) {
    const r = toRoman(n);
    if (!VZOR_RIMSKY.test(r)) zlyVzor++;
    if (/(.)\1\1\1/.test(r)) styri++;
    vystupy.add(r);
  }
  over(zlyVzor === 0, `regulárny výraz: ${zlyVzor} zlých zápisov`);
  over(styri === 0, `štyri rovnaké znaky: ${styri}`);
  over(vystupy.size === 3999, `rôznych výstupov ${vystupy.size} z 3999`);
  // P2-3. nezávislý parser zľava doprava (menšia pred väčšou sa odčíta)
  const NEZAV = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
  function parser(s) {
    let sucet = 0;
    for (let i = 0; i < s.length; i++) {
      const a = NEZAV[s[i]], b = i + 1 < s.length ? NEZAV[s[i + 1]] : 0;
      sucet += a < b ? -a : a;
    }
    return sucet;
  }
  let zlyParser = 0;
  for (let n = 1; n <= 3999; n++) if (parser(toRoman(n)) !== n) zlyParser++;
  over(zlyParser === 0, `nezávislý parser: ${zlyParser} nezhôd`);
  // P2-4. LaCo DoMa
  over(LACO.map(L => L.znak).join('') === 'LCDM', 'LaCo DoMa: poradie L, C, D, M');
  over(rovnake(LACO.map(L => L.hodnota), [50, 100, 500, 1000]), 'LaCo DoMa: hodnoty 50, 100, 500, 1000');
  over(LACO.every((L, i) => i === 0 || L.hodnota > LACO[i - 1].hodnota), 'LaCo DoMa: hodnoty rastú');
  over(rovnake(LACO.map(L => L.slabika), ['La', 'Co', 'Do', 'Ma']) && LACO.map(L => L.slabika[0]).join('') === 'LCDM', 'LaCo DoMa: prvé písmená slabík');
  // P2-5. šablóna
  for (let rad = 0; rad <= 2; rad++) {
    for (let d = 1; d <= 9; d++) {
      over(zapisSablony(rad, d) === vymenZnaky(toRoman(d), rad), `šablóna rád ${rad}, cifra ${d}`);
      over(zapisRadu(d, rad) === vymenZnaky(VZOR[d].replace(/[abc]/g, z => ({ a: 'I', b: 'V', c: 'X' })[z]), rad), `vzor rád ${rad}, cifra ${d}`);
    }
  }
  over(rovnake([1, 2, 3].map(d => zapisSablony(3, d)), ['M', 'MM', 'MMM']), 'tisíce M, MM, MMM');
  over([4, 5, 6, 7, 8, 9].every(d => zapisSablony(3, d) === null), 'tisíce 4 až 9 sa nepíšu');
  over($$('#karta-sablona .bunka:not(.prazdna)').length === 30, 'šablóna má 30 vyplnených buniek');
  // P2-6. počet krokov pre všetky n a dĺžka textov
  let zlyPocet = 0, najviac = 0;
  const texty2 = [];
  for (let n = 1; n <= 3999; n++) {
    const k = decompose(n).length, kroky = krokyPrevodu(n);
    const ocak = 1 + (k > 1 ? 1 : 0) + k + (k > 1 ? 1 : 0);
    if (kroky.length !== ocak) zlyPocet++;
    najviac = Math.max(najviac, kroky.length);
    kroky.forEach(x => texty2.push(x.text));
  }
  over(zlyPocet === 0, `počet krokov: ${zlyPocet} nezhôd`);
  over(najviac <= 7, `najviac krokov ${najviac}`);
  over(krokyPrevodu(1994).map(x => x.text).join(' | ') === 'Máme číslo 1994. | Rozložíme ho: 1000, 900, 90 a 4. | 1000 je M: jedna tisícka. | 900 je CM: tisíc bez sto. | 90 je XC: sto bez desať. | 4 je IV: päť bez jednej. | Spojíme: MCMXCIV.', 'scenár 1994');
  krokyLcdm().forEach(x => texty2.push(x.text));
  PRAVIDLA.forEach((P, i) => krokyPravidla(i).forEach(x => texty2.push(x.text)));
  const zleTexty = [...new Set(texty2)].filter(s => s.length > 80 || vety(s).length > 2 || !vety(s).every(v => v.split(/\s+/).length <= 12));
  over(zleTexty.length === 0, 'texty krokov (80 znakov, 2 vety, 12 slov): ' + zleTexty.slice(0, 3).join(' / '));
  // pravidlá: príklady sedia s výpočtom a správne/nesprávne zápisy sú naozaj také
  const spocitaj = s => s.split('=')[0].replace(/−/g, '-').replace(/\s/g, '').split(/(?=[+-])/).reduce((a, x) => a + Number(x), 0);
  for (const P of PRAVIDLA) {
    for (const k of P.kroky) {
      if (k.rovnica) over(spocitaj(k.rovnica) === Number(k.rovnica.split('=')[1]), `pravidlo ${P.cislo}: rovnica ${k.rovnica}`);
      const spravny = z => toRoman(parser(z)) === z;
      if (k.typ === 'ok' || k.typ === 'zaujimavost') over(spravny(k.zapis) && (!k.rovnica || parser(k.zapis) === Number(k.rovnica.split('=')[1])), `pravidlo ${P.cislo}: ${k.zapis} má byť správne`);
      const zlyZamer = z => k.zamer && parser(z) !== k.zamer;   // správny zápis, ale iného čísla
      if (k.typ === 'zle') over(!spravny(k.zapis) || zlyZamer(k.zapis), `pravidlo ${P.cislo}: ${k.zapis} má byť nesprávne`);
      if (k.typ === 'oprava') over(k.zapisy.every(spravny) && (!spravny(k.zle) || zlyZamer(k.zle)) && (!k.zamer || k.zapisy.includes(toRoman(k.zamer))), `pravidlo ${P.cislo}: oprava ${k.zle} → ${k.zapisy}`);
    }
    over(P.kroky.some(k => k.typ === 'ok') && P.kroky.some(k => k.typ === 'zle') && P.kroky.some(k => k.typ === 'oprava'), `pravidlo ${P.cislo}: má ✔, ✘ aj opravu`);
  }
  over(PRAVIDLA.length === 5 && PRAVIDLA.every((P, i) => P.cislo === i + 1), 'pravidlá majú čísla 1 až 5');
  // P2-7. úrovne a kolieska
  over(rovnake(NASTAVENIE.urovne, [39, 100, 1000, 3999]), 'maximá úrovní 39, 100, 1000, 3999');
  let mimo = 0, zlyDisplej = 0;
  for (let u = 0; u < 4; u++) {
    nastavUroven(u);
    const max = NASTAVENIE.maximum;
    if (KARTY.prevod.cislo() > max) mimo++;
    for (let i = 0; i < 400; i++) {
      // čistá funkcia
      const n = 1 + Math.floor(nahoda() * max), rad = Math.floor(nahoda() * 4), smer = nahoda() < 0.5 ? 1 : -1;
      const m = posunKoliesko(n, rad, smer, max);
      if (m < 1 || m > max) mimo++;
      // skutočné tlačidlá
      const k = KARTY.prevod.kolieska[rad], b = smer > 0 ? k.hore : k.dole;
      if (!b.disabled) b.click();
      const c = KARTY.prevod.cislo();
      if (c < 1 || c > max) mimo++;
      const disp = KARTY.prevod.kolieska.map(x => x.cifra.textContent).reverse().join('');
      if (+disp !== c) zlyDisplej++;
    }
    for (let rad = 0; rad < 4; rad++) {
      const vyp = KARTY.prevod.kolieska[rad].el.classList.contains('vypnute');
      if (vyp !== (10 ** rad > max)) mimo++;
    }
  }
  dokonciVsetky();
  over(mimo === 0, `kolieska mimo rozsahu: ${mimo}`);
  over(zlyDisplej === 0, `kolieska ukazujú iné číslo: ${zlyDisplej}`);
  nastavUroven(3); KARTY.prevod.nastavCislo(3888); nastavUroven(0);
  over(KARTY.prevod.cislo() === 39, 'prepnutie úrovne oreže číslo na maximum');
  KARTY.prevod.nastavCislo(26);

  /* ----- ČASŤ 3 ----- */
  // P3-1. fromRoman
  for (const [z, n] of [['MCMXCIV', 1994], ['XLII', 42], ['MMXXVI', 2026], ['MMMCMXCIX', 3999], ['XIV', 14], ['xiv', 14], [' x i v ', 14]]) {
    const r = fromRoman(z);
    over(r.ok && r.hodnota === n, `fromRoman(${z}) = ${n}`);
  }
  let zlySpat = 0;
  for (let n = 1; n <= 3999; n++) { const r = fromRoman(toRoman(n)); if (!r.ok || r.hodnota !== n) zlySpat++; }
  over(zlySpat === 0, `fromRoman(toRoman(n)) = n: ${zlySpat} nezhôd`);
  // P3-2. neplatné zápisy a pravidlá
  const NEPLATNE = { IIII: 2, VV: 3, VX: 5, IC: 5, IL: 5, XM: 5, IIX: 5, MMMM: 2, VIIII: 2, MIM: 5, '': null, ABC: null };
  for (const [z, pr] of Object.entries(NEPLATNE)) {
    const r = fromRoman(z);
    over(!r.ok, `fromRoman(„${z}“) má byť neplatné`);
    over(r.pravidlo === pr, `fromRoman(„${z}“): pravidlo ${r.pravidlo}, čakám ${pr}`);
