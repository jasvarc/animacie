<script>
'use strict';
/* ===== Pomocné funkcie ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const U = TEXTY.ui;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const r1 = x => Math.round(x * 10) / 10;          // zaokrúhlenie súradníc pre SVG (len grafika)
const nahoda = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const vyber = p => p[Math.floor(Math.random() * p.length)];
function zamiesaj(p) { const a = p.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function cesta(o, p) { return p.split('.').reduce((x, k) => x == null ? x : x[k], o); }
function vypln(t, o) { return String(t).replace(/\{(\w+)\}/g, (x, k) => (o && o[k] !== undefined) ? o[k] : x); }
function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function tvar(n, t) { return n === 1 ? t[0] : (n >= 2 && n <= 4) ? t[1] : t[2]; }

/* =====================================================================
   MATEMATIKA
   - Rozhodnutia (je pravouhlý, je trojica, je odmocnina presná) robím s celými číslami.
   - Desatinné vstupy (najviac 2 miesta) prepočítam na celé stotiny → ich druhé mocniny sú presné.
   - Odmocninu zaokrúhľujem len pri zobrazení, nikdy nie vo výpočte.
   ===================================================================== */
/* MATEMATIKA START */
// slovenský zápis čísla s desatinnou čiarkou (d = najviac toľko desatinných miest)
function cis(x, d = 2) {
  const k = Math.pow(10, d);
  let s = (Math.round(x * k) / k).toFixed(d);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  if (s === '-0') s = '0';
  return s.replace('.', ',').replace('-', '−');
}
const JE_CELE = x => Math.abs(x - Math.round(x)) < 1e-9;
const sto = x => Math.round(x * 100);                                   // dĺžka → celé stotiny
function jeStvorec(n) { if (n < 0 || !Number.isInteger(n)) return false; const r = Math.round(Math.sqrt(n)); return r * r === n; }
// je √v presné desatinné číslo? (v má najviac 4 desatinné miesta, napr. druhá mocnina čísla s 2 miestami)
function presnaOdm(v) { return jeStvorec(Math.round(v * 10000)); }
// pravouhlý trojuholník – len celé čísla
function jePravouhly(a, b, c) { return a * a + b * b === c * c; }
// trojuholníková nerovnosť pre zoradené strany a ≤ b ≤ c
function vznikne(a, b, c) { return a + b > c; }
/* MATEMATIKA KONIEC */

const PR = '<b class="pr">≈</b>';
function odmH(v) { return `<span class="odm">√<span>${cis(v, 4)}</span></span>`; }
function odmS(t) { return `<span class="odm">√<span>${t}</span></span>`; }     // odmocnina z výrazu
// „= 5“ alebo „≈ 3,61“ (znak ≈ vždy čitateľne zvýraznený)
function odmVysl(v, d = 2, txt) { const p = presnaOdm(v); return (p ? '= ' : (txt ? '≈ ' : PR + ' ')) + cis(Math.sqrt(v), p ? 4 : d); }
function odmRov(v, d = 2) { return `${odmH(v)} ${odmVysl(v, d)}`; }
// prečítanie čísla zo vstupu: povolená desatinná čiarka aj bodka
function citaj(s) { s = String(s).trim().replace(/\s/g, '').replace(',', '.'); return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN; }
const maxDvaMiesta = x => Math.abs(x * 100 - Math.round(x * 100)) < 1e-6;

/* ===== Vektory a SVG ===== */
const V = {
  add: (p, q) => [p[0] + q[0], p[1] + q[1]], sub: (p, q) => [p[0] - q[0], p[1] - q[1]], mul: (p, k) => [p[0] * k, p[1] * k],
  len: p => Math.hypot(p[0], p[1]), unit: p => { const l = Math.hypot(p[0], p[1]) || 1; return [p[0] / l, p[1] / l]; },
  mid: (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2], lerp: (p, q, t) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t],
  dot: (p, q) => p[0] * q[0] + p[1] * q[1]
};
const stred = P => [P.reduce((s, p) => s + p[0], 0) / P.length, P.reduce((s, p) => s + p[1], 0) / P.length];
const plochaP = P => Math.abs(P.reduce((s, p, i) => { const q = P[(i + 1) % P.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0)) / 2;   // obsah mnohouholníka
const F = { a: '#ffd88a', b: '#6fb4ff', c: '#7fdc8f', red: '#ff7a6b', text: '#e2e8f5', muted: '#a3adc6' };
const VYPLN = { a: 'rgba(243,180,83,.18)', b: 'rgba(111,180,255,.18)', c: 'rgba(127,220,143,.16)' };
const SRAF = { a: 'url(#hA)', b: 'url(#hB)', c: 'url(#hC)' };
const pts = P => P.map(p => r1(p[0]) + ',' + r1(p[1])).join(' ');
function polyS(P, a) { return `<polygon points="${pts(P)}" ${a || ''}/>`; }
// plocha štvorca: farba + šrafovanie + obrys
function plochaS(P, k, op) { return `<g opacity="${op ?? 1}">${polyS(P, `fill="${VYPLN[k]}"`)}${polyS(P, `fill="${SRAF[k]}" stroke="${F[k]}" stroke-width="2.5" stroke-linejoin="round"`)}</g>`; }
function skryty(P) { return polyS(P, 'fill="rgba(255,255,255,.07)"') + polyS(P, 'fill="url(#hH)" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 4"'); }
function ciara(p, q, a) { return `<line x1="${r1(p[0])}" y1="${r1(p[1])}" x2="${r1(q[0])}" y2="${r1(q[1])}" ${a || ''}/>`; }
function popis(x, y, t, fs, fill, extra) {
  fs = fs || 20;
  return `<text x="${r1(x)}" y="${r1(y)}" font-size="${r1(fs)}" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="${fill || F.text}" stroke="#04060c" stroke-width="${fs > 18 ? 5 : 4}" stroke-linejoin="round" paint-order="stroke" ${extra || ''}>${t}</text>`;
}
function pravyUhol(V0, P, Q, s, farba, op) {
  const u = V.unit(V.sub(P, V0)), w = V.unit(V.sub(Q, V0));
  const p1 = V.add(V0, V.mul(u, s)), p3 = V.add(V0, V.mul(w, s)), p2 = V.add(p1, V.mul(w, s));
  return `<polyline points="${pts([p1, p2, p3])}" fill="none" stroke="${farba || F.text}" stroke-width="2.5" opacity="${op ?? 1}"/>`;
}
// oblúk uhla pri vrchole V0 medzi smermi k bodom P a Q (menší z uhlov); vráti aj smer na popis
function oblukS(V0, P, Q, r, farba, w, op) {
  const a1 = Math.atan2(P[1] - V0[1], P[0] - V0[0]), a2 = Math.atan2(Q[1] - V0[1], Q[0] - V0[0]);
  let d = a2 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
