.nast{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:16px}
nav.karty{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
nav.karty button{border-radius:999px;padding:8px 15px}
nav.karty button .cis{display:inline-block;min-width:1.4em;color:var(--muted)}
nav.karty button.on .cis{color:var(--gold2)}

/* ===== Rozloženie sekcie: graf + tabuľka vľavo, ovládanie vpravo ===== */
.sek{display:grid;grid-template-columns:minmax(0,1fr) 430px;grid-template-areas:"graf ovl" "tab ovl";gap:16px;align-items:start}
.sek>.gA{grid-area:graf;min-width:0}.sek>.tA{grid-area:tab;min-width:0}.sek>.oA{grid-area:ovl;min-width:0}
.stlpec{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1000px){.sek{grid-template-columns:minmax(0,1fr);grid-template-areas:"graf" "ovl" "tab"}}

/* ===== Graf ===== */
.stageCard{padding:10px}
.grafLista{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.grafLista .zoom{min-width:48px;font-size:22px;font-weight:700;padding:4px 10px}
.grafLista .chk{margin:0 0 0 auto}
.stage{border-radius:10px;background:#08101c;overflow:hidden;position:relative}
.stage canvas{display:block;width:100%;aspect-ratio:4/3;max-height:68vh;min-height:280px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage canvas.tahanie{cursor:grabbing}
.stage canvas.nadSondou{cursor:ew-resize}
.sondaInfo{font-size:17px;margin:8px 4px 2px;min-height:3.2em;font-variant-numeric:tabular-nums}
.sondaInfo b{color:var(--gold2)}
.sondaInfo button{margin:6px 6px 0 0;min-height:40px;padding:4px 12px}
.legenda{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;color:var(--muted);font-size:16px;margin:6px 4px 0}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda svg{flex:none}
.priblizne{font-size:16px;color:var(--muted);margin:8px 4px 0}

/* ===== Posuvníky s tlačidlami − / + ===== */
.sl{display:block;margin-top:8px}
.sl .lbl{display:flex;justify-content:space-between;gap:10px;font-size:18px}
.sl .lbl b{color:var(--gold2);font-variant-numeric:tabular-nums;font-size:20px}
.slRiadok{display:flex;align-items:center;gap:8px}
.slRiadok button{min-width:48px;font-size:20px;font-weight:700;padding:4px 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:rgba(255,255,255,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--gold);border:3px solid #1a0e02;box-shadow:0 0 0 2px var(--gold)}
input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--gold);border:3px solid #1a0e02}
.tlac{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.chk{display:flex;gap:10px;align-items:center;margin:10px 0;cursor:pointer;min-height:44px}
.chk input{width:24px;height:24px;accent-color:var(--gold)}

/* ===== Farebné boxy ===== */
.box{margin:12px 0 0;padding:10px 13px;border-radius:10px;border:1px solid}
.box p:last-child{margin-bottom:0}
.box b.h{display:block;font-size:16px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.box.omyl{background:rgba(255,122,107,.09);border-color:rgba(255,122,107,.45)}.box.omyl b.h{color:var(--red)}
.box.pravda{background:rgba(127,220,143,.08);border-color:rgba(127,220,143,.4)}.box.pravda b.h{color:var(--green)}
.box.info{background:rgba(111,180,255,.08);border-color:rgba(111,180,255,.4)}.box.info b.h{color:var(--blue)}
.box.zlty{background:rgba(243,180,83,.09);border-color:rgba(243,180,83,.45)}.box.zlty b.h{color:var(--gold2)}
ul.vl{margin:4px 0 0;padding-left:20px}
ul.vl li{margin:6px 0}

/* ===== Výpočet koreňa ===== */
.kroky{margin:8px 0;font-size:19px;font-variant-numeric:tabular-nums}
.kroky .r{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:5px 10px;border-radius:8px}
.kroky .r:nth-child(odd){background:rgba(255,255,255,.04)}
.kroky .op{color:var(--violet);font-size:17px}
.kroky .r.vys{color:var(--gold2);font-weight:700}
.zl{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.1;margin:0 .1em}
.zl>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}

/* ===== Tabuľka hodnôt ===== */
.vstupy{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 12px}
.vstupy label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:16px}
input.num{width:120px;height:48px;font:inherit;font-size:20px;font-weight:700;text-align:center;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px}
input.num.zle{border-color:var(--red)}
table.hodnoty{border-collapse:collapse;width:100%;max-width:520px;font-size:18px;font-variant-numeric:tabular-nums}
table.hodnoty th{color:var(--muted);font-weight:600;font-size:16px;text-align:right;padding:6px 12px;border-bottom:1px solid var(--line)}
table.hodnoty td{text-align:right;padding:0 12px;height:44px;border-bottom:1px solid rgba(140,160,215,.1)}
table.hodnoty tbody tr{cursor:pointer}
table.hodnoty tbody tr:hover td{background:rgba(255,255,255,.05)}
table.hodnoty tbody tr.vyb td{background:rgba(243,180,83,.16);color:var(--gold2)}
table.hodnoty td.d{color:var(--green);text-align:left;position:relative}
table.hodnoty td.d span{position:absolute;left:12px;top:0;transform:translateY(-50%);background:#0b1220;border:1px solid rgba(127,220,143,.45);border-radius:8px;padding:0 8px;font-size:16px;white-space:nowrap;line-height:1.6}
.hlaska{color:var(--red);font-size:16px;margin:6px 0 0;min-height:1.5em}

/* ===== Hra ===== */
.hraStav{font-size:17px;margin-top:10px;min-height:1.5em}
.hraStav p{margin:4px 0}
.skore{color:var(--muted)}

/* ===== Plynulý prechod medzi záložkami ===== */
@keyframes prechod{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
[data-karta]:not([hidden]),[data-pod]:not([hidden]){animation:prechod .28s ease-out}
@media (prefers-reduced-motion:reduce){[data-karta],[data-pod]{animation:none!important}}

/* ===== Podkarty ===== */
.podkarty{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 16px;padding:8px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.podkarty button{border-radius:10px}
.koefGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:16px;align-items:start}
.stage canvas.miniPl{aspect-ratio:1/1;min-height:220px;max-height:56vh;touch-action:auto;cursor:default}
.miniVzorec{font-size:18px;text-align:center;margin:8px 0 0;font-variant-numeric:tabular-nums;min-height:3em}
.miniVzorec b{color:var(--gold2)}
ol.vkroky{list-style:none;padding:0;margin:12px 0 4px;font-size:17px}
ol.vkroky li{padding:6px 10px;border-radius:8px;margin:3px 0;border-left:4px solid transparent}
ol.vkroky li.akt{background:rgba(243,180,83,.14);border-left-color:var(--gold)}
ol.vkroky li.bud{opacity:.45}
.vzorec.druhy{font-size:19px;font-weight:600;color:var(--text);margin-top:-4px}
details.zved{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
details.zved summary{cursor:pointer;font-weight:650;min-height:40px;display:flex;align-items:center;color:var(--violet)}
.kvStav{margin-top:10px}

/* ===== Kubická, vyššie stupne, porovnanie ===== */
.stage canvas.miniPl.maly{min-height:130px;max-height:34vh}
.typyGrid,.okrajeGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
button.typ,.okraj{display:block;width:100%;text-align:left;padding:8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03)}
button.typ.akt,.okraj.akt{border-color:var(--gold);background:rgba(243,180,83,.12)}
button.typ b,.okraj b{display:block;font-size:16px;margin-top:6px;color:var(--text)}
button.typ span,.okraj span{display:block;font-size:16px;color:var(--muted)}
button.typ .stage,.okraj .stage{display:block}
.tabWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.hodnoty.bez tbody tr{cursor:default}
table.hodnoty.volne{max-width:none}
table.hodnoty.volne td,table.hodnoty.volne th{text-align:left;height:auto;padding:8px 10px;font-size:16px}
table.porTab{min-width:680px}

/* ===== Kvíz ===== */
.otazka{padding:14px 0;border-bottom:1px solid var(--line)}
.otazka .q{font-size:19px;margin-bottom:8px}
.otazka .q .por{color:var(--muted)}
.otazka .obr{max-width:360px;margin:8px 0}
ol.chybaKroky{font-size:18px;margin:6px 0 10px;padding-left:28px;font-variant-numeric:tabular-nums}
ol.chybaKroky li{margin:3px 0}
.moznosti{display:flex;flex-wrap:wrap;gap:8px}
.moznosti button{min-height:52px;font-size:18px}
.otazka button.ok{background:rgba(127,220,143,.2);border-color:var(--green);color:#d7ffdf;opacity:1}
.otazka button.zle{background:rgba(255,122,107,.2);border-color:var(--red);color:#ffe0dc;opacity:1}
.vstup{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.fb{margin-top:10px;font-size:17px}
.fb.ok>b:first-child{color:var(--green)}.fb.zle>b:first-child{color:var(--red)}
#kvizVysl{font-size:21px;font-weight:700;color:var(--gold2);margin:14px 0 0}
footer{color:var(--muted);text-align:center;font-size:16px;padding:20px 0 10px}
@media (max-width:600px){
  .wrap{padding:10px}
  .card{padding:12px}
  h2{font-size:21px}
  .vzorec{font-size:24px}
  .grafLista .chk{margin-left:0}
  .grafLista button{flex:1 1 auto}
  .stage canvas{aspect-ratio:1/1}
  .kroky{font-size:18px}
}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="tx"><h1 data-t="titul"></h1><p class="sub" data-t="podtitul"></p></div>
  <label class="nast"><span data-t="ui.desatinne"></span>
    <select id="desMiesta" aria-label="Počet desatinných miest pri zaokrúhľovaní">
      <option value="0">0</option><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option>
    </select></label>
</header>
<nav class="karty" id="karty" role="tablist"></nav>

<!-- ============ 1. KONŠTANTNÁ FUNKCIA ============ -->
<section id="konst" class="sek" data-karta hidden>
  <div class="gA" id="konst_graf"></div>
  <div class="tA card" id="konst_tab"></div>
  <div class="oA stlpec">
    <div class="card">
      <h2 data-t="konst.nadpis"></h2>
      <p data-t="konst.uvod"></p>
      <div class="vzorec" id="konst_vzorec"></div>
      <div id="konst_slQ"></div>
      <div class="tlac"><button id="konst_anim"></button></div>
    </div>
    <div class="card">
      <h3 data-t="konst.vlastnosti"></h3>
      <ul class="vl" id="konst_vl"></ul>
    </div>
    <div class="card box info" style="margin:0">
      <b class="h" data-t="konst.funkcia"></b>
      <p data-t="konst.funkciaText"></p>
    </div>
  </div>
</section>

<!-- ============ 2. LINEÁRNA FUNKCIA ============ -->
<section id="lin" class="sek" data-karta hidden>
  <div class="gA" id="lin_graf"></div>
  <div class="tA card" id="lin_tab"></div>
  <div class="oA stlpec">
    <div class="card">
      <h2 data-t="lin.nadpis"></h2>
      <p data-t="lin.uvod"></p>
      <div class="vzorec" id="lin_vzorec"></div>
      <div id="lin_slK"></div>
      <div id="lin_slQ"></div>
      <div class="tlac"><button id="lin_anim"></button></div>
      <ul class="vl" id="lin_vl"></ul>
      <div id="lin_pozn"></div>
    </div>
    <div class="card">
      <h3 data-t="lin.korenNadpis"></h3>
      <p data-t="lin.korenUvod"></p>
      <div class="kroky" id="lin_kroky" aria-live="polite"></div>
      <p class="mini" data-t="lin.vseob"></p>
      <p class="mini" data-t="graf.priblizne"></p>
    </div>
    <div class="card">
      <h3 data-t="lin.hra.nadpis"></h3>
      <p data-t="lin.hra.uvod"></p>
      <div class="tlac" id="lin_hraTl"></div>
      <div class="hraStav" id="lin_hraStav" aria-live="polite"></div>
    </div>
  </div>
</section>

<!-- ============ 3. KVADRATICKÁ ============ -->
<!-- Časť 2: štyri podkarty, prepínajú sa tlačidlami v #kv_pod -->
<section id="kvad" data-karta hidden>
  <div class="podkarty" id="kv_pod" role="tablist"></div>

  <!-- 3a. Kvadratická funkcia y = ax² + bx + c (+ hra „Uhádni parabolu“) -->
  <div class="sek" data-pod="zaklad">
    <div class="gA" id="kvz_graf"></div>
    <div class="tA card" id="kvz_tab"></div>
    <div class="oA stlpec">
      <div class="card">
        <h2 data-t="kvad.nadpis"></h2>
        <p data-t="kvad.uvod"></p>
        <div class="vzorec" id="kvz_vzorec"></div>
        <div id="kvz_slA"></div><div id="kvz_slB"></div><div id="kvz_slC"></div>
        <label class="chk"><input type="checkbox" id="kvz_porov"> <span data-t="kvad.porovnaj"></span></label>
        <div id="kvz_pozn"></div>
        <ul class="vl" id="kvz_vl"></ul>
      </div>
      <div class="card">
        <h3 data-t="kvad.vrcholNadpis"></h3>
        <div class="kroky" id="kvz_kroky" aria-live="polite"></div>
      </div>
      <div class="card">
        <h3 data-t="kvad.hra.nadpis"></h3>
        <p data-t="kvad.hra.uvod"></p>
        <div class="tlac" id="kvz_hraTl"></div>
        <div class="hraStav" id="kvz_hraStav" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <!-- 3b. Čo robia koeficienty – tri mini scény -->
  <div data-pod="koef" hidden>
    <div class="card" style="margin-bottom:16px"><h2 data-t="kvad.koef.nadpis"></h2><p data-t="kvad.koef.uvod" style="margin:0"></p></div>
    <div class="koefGrid"><div class="card" id="kvf_a"></div><div class="card" id="kvf_b"></div><div class="card" id="kvf_c"></div></div>
  </div>

  <!-- 3c. Vrcholový tvar y = a(x − m)² + n -->
  <div class="sek" data-pod="vrch" hidden>
    <div class="gA" id="kvv_graf"></div>
    <div class="tA card">
      <h3 data-t="kvad.vrch.prepNadpis"></h3>
      <div class="tlac" style="margin:0 0 8px"><button id="kvv_prepni" data-t="kvad.vrch.prepni"></button></div>
      <div id="kvv_prep"></div>
    </div>
    <div class="oA stlpec">
      <div class="card">
        <h2 data-t="kvad.vrch.nadpis"></h2>
        <p data-t="kvad.vrch.uvod"></p>
        <div class="vzorec" id="kvv_vzorec"></div>
        <div id="kvv_slA"></div><div id="kvv_slM"></div><div id="kvv_slN"></div>
        <div class="tlac" id="kvv_tl"></div>
        <ol class="vkroky" id="kvv_kroky" aria-live="polite"></ol>
        <div id="kvv_pozn"></div>
      </div>
      <div class="card box omyl" style="margin:0"><b class="h" data-t="kvad.vrch.omylNadpis"></b><p data-t="kvad.vrch.omyl"></p></div>
    </div>
  </div>

  <!-- 3d. Korene kvadratickej funkcie -->
  <div class="sek" data-pod="korene" hidden>
    <div class="gA" id="kvk_graf"></div>
    <div class="tA card">
      <h3 data-t="kvad.kor.sucinNadpis"></h3>
      <div id="kvk_sucin"></div>
      <details class="zved"><summary data-t="kvad.kor.viete"></summary><div id="kvk_viete"></div></details>
    </div>
    <div class="oA stlpec">
      <div class="card">
        <h2 data-t="kvad.kor.nadpis"></h2>
        <p data-t="kvad.kor.uvod"></p>
        <div class="vzorec" id="kvk_vzorec"></div>
        <div id="kvk_slA"></div><div id="kvk_slB"></div><div id="kvk_slC"></div>
        <p id="kvk_graficky" style="margin-top:12px"></p>
        <p class="mini" data-t="graf.priblizne"></p>
      </div>
      <div class="card">
        <h3 data-t="kvad.kor.dNadpis"></h3>
        <div id="kvk_vypocet" aria-live="polite"></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ 4. KUBICKÁ (podkarty: Kubická funkcia, Delenie intervalu) ============ -->
<section id="kub" data-karta hidden>
  <div class="podkarty" role="tablist"></div>

  <!-- 4a. Kubická funkcia y = ax³ + bx² + cx + d -->
  <div class="sek" data-pod="funkcia">
    <div class="gA" id="kub_graf"></div>
    <div class="tA card">
      <h3 data-t="kub.typyNadpis"></h3>
      <p data-t="kub.typyUvod"></p>
      <div class="typyGrid" id="kub_typy"></div>
    </div>
    <div class="oA stlpec">
      <div class="card">
        <h2 data-t="kub.nadpis"></h2>
        <p data-t="kub.uvod"></p>
        <div class="vzorec" id="kub_vzorec"></div>
        <div id="kub_slA"></div><div id="kub_slB"></div><div id="kub_slC"></div><div id="kub_slD"></div>
        <label class="chk"><input type="checkbox" id="kub_konce" checked> <span data-t="okraje.ukaz"></span></label>
        <div id="kub_pozn"></div>
        <ul class="vl" id="kub_vl"></ul>
        <details class="zved"><summary data-t="kub.inflexZved"></summary><p data-t="kub.inflexText"></p></details>
      </div>
      <div class="card"><h3 data-t="kub.pocetNadpis"></h3><div id="kub_pocet" aria-live="polite"></div></div>
      <div class="card"><h3 data-t="kub.deltaNadpis"></h3><div id="kub_delta"></div></div>
      <div class="card"><h3 data-t="kub.sucinNadpis"></h3><div id="kub_sucin"></div></div>
    </div>
  </div>

  <!-- 4b. Delenie intervalu -->
  <div class="sek" data-pod="delenie" hidden>
    <div class="gA" id="del_graf"></div>
    <div class="tA card">
      <h3 data-t="del.tabNadpis"></h3>
      <div class="tabWrap"><table class="hodnoty bez volne" id="del_tab"></table></div>
    </div>
    <div class="oA stlpec">
      <div class="card">
        <h2 data-t="del.nadpis"></h2>
        <p data-t="del.uvod"></p>
        <p class="mini" data-t="del.funkcia"></p>
        <div class="tlac" id="del_fun" style="margin-top:0"></div>
        <div id="del_slL"></div><div id="del_slR"></div>
        <div class="tlac" id="del_tl"></div>
        <p id="del_stav" style="margin-top:12px"></p>
        <div id="del_box" aria-live="polite"></div>
      </div>
      <div class="card box info" style="margin:0"><p data-t="del.vysvetlenie"></p></div>
      <div class="card"><details class="zved" style="margin:0"><summary data-t="del.zvedNadpis"></summary><p data-t="del.zved"></p></details></div>
    </div>
  </div>
</section>

<!-- ============ 5. VYŠŠIE STUPNE ============ -->
<section id="vyssie" class="sek" data-karta hidden>
  <div class="gA" id="vys_graf"></div>
  <div class="tA card">
    <h3 data-t="vys.tabNadpis"></h3>
    <p data-t="vys.tabUvod"></p>
    <div class="okrajeGrid" id="vys_okraje"></div>
  </div>
  <div class="oA stlpec">
    <div class="card">
      <h2 data-t="vys.nadpis"></h2>
      <p data-t="vys.uvod"></p>
      <p class="mini" data-t="vys.stupen"></p>
      <div class="tlac" id="vys_st" style="margin-top:0"></div>
      <p class="mini" data-t="vys.priklady"></p>
      <div class="tlac" id="vys_pr" style="margin-top:0"></div>
      <div class="vzorec" id="vys_vzorec" style="margin-top:12px"></div>

<script>
'use strict';
/* =====================================================================
   POMOCNÉ FUNKCIE
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const U = TEXTY.ui;
const EPS = 1e-9;                                         // tolerancia pre rozhodnutia o rovnosti
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const nahoda = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const MALO_POHYBU = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function cesta(o, p) { return p.split('.').reduce((x, k) => x == null ? x : x[k], o); }
function vypln(t, o) { return String(t).replace(/\{(\w+)\}/g, (x, k) => (o && o[k] !== undefined) ? o[k] : x); }
const jeNula = x => Math.abs(x) < EPS;
const rovne = (a, b) => Math.abs(a - b) < EPS;
const JE_CELE = x => Math.abs(x - Math.round(x)) < 1e-9;
function nsd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }

/* ===== Čísla v slovenskom zápise ===== */
let DES = 2;                                              // počet desatinných miest (nastaviteľný v hlavičke)
const HORNE = '⁰¹²³⁴⁵⁶⁷⁸⁹⁻';
const hornyIndex = n => String(n).split('').map(z => z === '-' ? HORNE[10] : HORNE[+z]).join('');
// číslo → text: desatinná čiarka, mínus „−“, zaokrúhlenie na d miest, bez zbytočných núl, tenká medzera v tisícoch
function cis(x, d = DES) {
  if (typeof x !== 'number' || !isFinite(x)) return '—';
  if (Math.abs(x) >= 1e15) {                              // obrovské čísla: a · 10ⁿ
    const e = Math.floor(Math.log10(Math.abs(x)));
    return cis(x / Math.pow(10, e), 2) + '·10' + hornyIndex(e);
  }
  const m = Math.pow(10, d);
  let v = Math.round(x * m) / m;
  if (v === 0) v = 0;                                     // −0 → 0
  let s = v.toFixed(d);
  if (d > 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  const zap = s[0] === '-'; if (zap) s = s.slice(1);
  let [c, f] = s.split('.');
  if (c.length > 4) c = c.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (zap ? '−' : '') + c + (f ? ',' + f : '');
}
const cisK = x => cis(x, 4);                              // koeficienty a zadané čísla – zobraz presne
// dá sa x zapísať presne s d desatinnými miestami?
const presne = (x, d = DES) => Math.abs(x - Math.round(x * Math.pow(10, d)) / Math.pow(10, d)) < EPS * Math.max(1, Math.abs(x));
const rovZnak = (x, d = DES) => presne(x, d) ? '=' : '≈';
// záporné číslo do zátvorky (napr. pri delení): (−2)
const zatv = x => x < 0 ? '(' + cisK(x) + ')' : cisK(x);
// prečítanie čísla zo vstupu: povolená desatinná čiarka aj bodka, mínus aj „−“
function citaj(s) { s = String(s).trim().replace(/\s/g, '').replace(/[−–]/g, '-').replace(',', '.'); return /^-?(\d+(\.\d*)?|\.\d+)$/.test(s) ? parseFloat(s) : NaN; }

/* =====================================================================
   POLYNÓMY
   Polynóm je pole koeficientov c[0..n], kde c[i] je koeficient pri xⁱ.
   Napríklad y = 2x − 4  →  c = [−4, 2].
   ===================================================================== */
/* POLYNÓMY START */
// hodnota polynómu v bode x – Hornerova schéma: (…(cₙ·x + cₙ₋₁)·x + …)·x + c₀
function evalPoly(c, x) {
  let y = 0;
  for (let i = c.length - 1; i >= 0; i--) y = y * x + c[i];
  return y;
}
// derivácia: (cᵢ·xⁱ)' = i·cᵢ·xⁱ⁻¹
function derivative(c) {
  const d = [];
  for (let i = 1; i < c.length; i++) d.push(i * c[i]);
  return d.length ? d : [0];
}
// stupeň polynómu – nulové koeficienty vpredu sa ignorujú; −1 = nulový polynóm (stupeň nie je definovaný)
function degree(c) {
  for (let i = c.length - 1; i >= 0; i--) if (!jeNula(c[i])) return i;
  return -1;
}
// zápis polynómu: [−4, 2] → „2x − 4“
function polyText(c, x = 'x') {
  const st = degree(c);
  if (st < 0) return '0';
  let s = '';
  for (let i = st; i >= 0; i--) {
    const a = c[i]; if (jeNula(a)) continue;
    const abs = Math.abs(a);
    const clen = i === 0 ? cisK(abs) : (rovne(abs, 1) ? '' : cisK(abs)) + x + (i > 1 ? hornyIndex(i) : '');
    s += s === '' ? (a < 0 ? '−' : '') + clen : (a < 0 ? ' − ' : ' + ') + clen;
  }
  return s;
}
// presný zlomok čitateľ/menovateľ (pre desatinné čísla s najviac 3 miestami), zjednodušený
function zlomok(cit, men) {
  for (const M of [1, 2, 4, 5, 10, 20, 100, 1000]) {
    const a = cit * M, b = men * M;
    if (JE_CELE(a) && JE_CELE(b)) {
      let p = Math.round(a), q = Math.round(b);
      if (q === 0) return null;
      if (q < 0) { p = -p; q = -q; }
      const g = nsd(p, q);
      return { p: p / g, q: q / g };
    }
  }
  return null;
}
// koreň lineárnej funkcie y = kx + q
function korenLin(k, q) {
  if (jeNula(k)) return jeNula(q) ? { typ: 'vsetky' } : { typ: 'ziadny' };
  const x = -q / k;
  return { typ: 'jeden', x: jeNula(x) ? 0 : x, zl: zlomok(-q, k) };
}
/* POLYNÓMY KONIEC */

// číslo ako HTML: celé / presné desatinné / zlomok ≈ desatinné
function cisHTML(x, zl) {
  if (zl && zl.q !== 1 && !presne(x)) {
    return { rov: '=', html: (zl.p < 0 ? '−' : '') + `<span class="zl"><span>${Math.abs(zl.p)}</span><span>${zl.q}</span></span> ≈ ${cis(x)}` };
  }
  return { rov: rovZnak(x), html: cis(x) };
}

/* =====================================================================
   GRAF – kreslenie
   drawGraph(canvas, krivky, moznosti) – jeden opakovane použiteľný komponent.
   krivky:   [{ c: [koeficienty] alebo f: x => y, farba, styl: 'plna'|'ciarkovana'|'bodkovana', hrubka, popis }]
   moznosti: { view: {cx, cy, sx, sy}  – stred a mierka (pixely na jednotku),
               znacky: [{ x, y, typ: 'koren'|'prY'|'vrchol'|'extrem'|'inflex'|'zvyr'|'poc'|'bod', popis, farba }],
               sonda: { x, krivka } alebo null,
               navrch: (ctx, T, obsadene) => {}  – vlastné kreslenie (trojuholník sklonu …) }
   Vracia T – prepočty súradníc (px, py, wx, wy) a polohu sondy.
   ===================================================================== */
const FARBY = {
  f: '#f3b453', ciel: '#6fb4ff', sklon: '#7fdc8f', sklon2: '#b9a3ff', koren: '#ff7a6b', prY: '#7fdc8f', vrchol: '#b9a3ff',
  extrem: '#b9a3ff', inflex: '#6fb4ff', stred: '#ffffff',
  zvyr: '#ffffff', text: '#e2e8f5', muted: '#a3adc6', pozadie: '#08101c', siva: '#8d97ad',
  mriezka: 'rgba(140,160,215,.20)', mriezka2: 'rgba(140,160,215,.07)', os: 'rgba(226,232,245,.85)'
};
const STYLY = { plna: [], ciarkovana: [14, 9], bodkovana: [2, 7] };
const PISMO = '16px system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const PISMO_B = '700 16px system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

// pekný krok mriežky ≥ m: 1, 2, 5, 10, 20, 50 …
function peknyKrok(m) {
  if (!(m > 0) || !isFinite(m)) return 1;
  const z = Math.pow(10, Math.floor(Math.log10(m)));
  for (const k of [1, 2, 5, 10]) if (k * z >= m * (1 - 1e-12)) return k * z;
  return 10 * z;
}
function dalsiKrok(s) { const z = Math.pow(10, Math.floor(Math.log10(s) + 1e-9)); const m = Math.round(s / z); return (m < 2 ? 2 : m < 5 ? 5 : 10) * z; }
const mantisa = s => Math.round(s / Math.pow(10, Math.floor(Math.log10(s) + 1e-9)));
const desKroku = s => Math.max(0, -Math.floor(Math.log10(s) + 1e-9));
// hodnota krivky v bode x (polynóm alebo vlastná funkcia)
const hodnota = (k, x) => k.f ? k.f(x) : evalPoly(k.c, x);
const prekryv = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

// text s tmavým lemom – čitateľný aj nad mriežkou a krivkou
function textLem(ctx, t, x, y, farba) {
  ctx.lineJoin = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = FARBY.pozadie; ctx.strokeText(t, x, y);
  ctx.fillStyle = farba; ctx.fillText(t, x, y);
}
function kresliStitok(ctx, r, text, farba) {
  ctx.save();
  ctx.fillStyle = 'rgba(8,14,26,.92)'; ctx.strokeStyle = farba; ctx.lineWidth = 1.5;
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(r.x, r.y, r.w, r.h, 6); else ctx.rect(r.x, r.y, r.w, r.h);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = farba; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, r.x + 6, r.y + r.h / 2 + 1);
  ctx.restore();
}
// popisok k bodu (x, y) v pixeloch – skúsi niekoľko polôh, aby sa neprekryl s inými
function umiestniPopis(ctx, T, obsadene, text, x, y, farba, kandidati) {
  ctx.font = PISMO;
  const w = ctx.measureText(text).width + 12, h = 26;
  const k = kandidati || [[12, -12 - h], [12, 12], [-12 - w, -12 - h], [-12 - w, 12], [-w / 2, -18 - h], [-w / 2, 18], [14, -h / 2], [-14 - w, -h / 2]];
  for (const [dx, dy] of k) {
    const r = { x: x + dx, y: y + dy, w, h };
    if (r.x < 2 || r.y < 2 || r.x + w > T.W - 2 || r.y + h > T.H - 2) continue;
    if (obsadene.some(o => prekryv(o, r))) continue;
    obsadene.push(r); kresliStitok(ctx, r, text, farba); return r;
  }
  return null;                                            // nie je voľné miesto – popisok radšej vynecháme (text je aj pod grafom)
}
// značka bodu – tvar podľa typu (nerozlišujeme len farbou)
function kresliZnacku(ctx, typ, x, y, farba) {
  ctx.save(); ctx.setLineDash([]); ctx.lineWidth = 2.5; ctx.strokeStyle = '#04060c'; ctx.fillStyle = farba;
  ctx.beginPath();
  if (typ === 'koren') { ctx.arc(x, y, 8, 0, 7); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fillStyle = '#04060c'; ctx.fill(); }
  else if (typ === 'prY') { ctx.rect(x - 7, y - 7, 14, 14); ctx.fill(); ctx.stroke(); }
  else if (typ === 'vrchol' || typ === 'extrem') { ctx.moveTo(x, y - 10); ctx.lineTo(x + 10, y); ctx.lineTo(x, y + 10); ctx.lineTo(x - 10, y); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (typ === 'zvyr' || typ === 'stred') { ctx.arc(x, y, 12, 0, 7); ctx.strokeStyle = farba; ctx.lineWidth = 3; ctx.stroke(); ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fill(); }
  else if (typ === 'poc') { ctx.arc(x, y, 6, 0, 7); ctx.strokeStyle = farba; ctx.lineWidth = 2.5; ctx.stroke(); }
  else if (typ === 'inflex') { ctx.moveTo(x, y - 9); ctx.lineTo(x + 9, y + 7); ctx.lineTo(x - 9, y + 7); ctx.closePath(); ctx.fillStyle = FARBY.pozadie; ctx.fill(); ctx.strokeStyle = farba; ctx.lineWidth = 3; ctx.stroke(); }
  else { ctx.arc(x, y, 5.5, 0, 7); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}

function drawGraph(platno, krivky, moz) {
  const W = platno.clientWidth, H = platno.clientHeight;
  if (W < 20 || H < 20 || !moz || !moz.view) return null;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const bw = Math.round(W * dpr), bh = Math.round(H * dpr);
  if (platno.width !== bw || platno.height !== bh) { platno.width = bw; platno.height = bh; }
  const ctx = platno.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const v = moz.view;
  // prepočty: svet (x, y) ↔ pixely (px, py)
  const T = {
    W, H, dpr, sx: v.sx, sy: v.sy,
    px: x => W / 2 + (x - v.cx) * v.sx, py: y => H / 2 - (y - v.cy) * v.sy,
    wx: p => v.cx + (p - W / 2) / v.sx, wy: p => v.cy - (p - H / 2) / v.sy
  };
  T.x0 = T.wx(0); T.x1 = T.wx(W); T.yHore = T.wy(0); T.yDole = T.wy(H);
  const obsadene = [];                                    // obdĺžniky popiskov – aby sa neprekrývali
  // miesta značiek – čísla na osiach sa im vyhnú
  const miestaZnaciek = (moz.znacky || []).filter(z => isFinite(z.x) && isFinite(z.y)).map(z => ({ x: T.px(z.x) - 12, y: T.py(z.y) - 12, w: 24, h: 24 }));
  const podZnackou = r => miestaZnaciek.some(o => prekryv(o, r));

  ctx.fillStyle = FARBY.pozadie; ctx.fillRect(0, 0, W, H);
  ctx.font = PISMO;

  /* --- krok mriežky: 1, 2, 5, 10 …, aby sa popisky na osi x neprekrývali --- */
  let kx = peknyKrok(64 / v.sx);
  for (let i = 0; i < 30; i++) {
    const d = desKroku(kx);
    const w = Math.max(ctx.measureText(cis(Math.ceil(T.x0 / kx) * kx, d)).width, ctx.measureText(cis(Math.floor(T.x1 / kx) * kx, d)).width);
    if (kx * v.sx >= w + 18) break;
    kx = dalsiKrok(kx);
  }
  let ky = peknyKrok(40 / v.sy);
  if (Math.abs(v.sx / v.sy - 1) < 1e-6) kx = ky = Math.max(kx, ky);   // rovnaká mierka → rovnaký krok na oboch osiach
  const dX = desKroku(kx), dY = desKroku(ky);

  const ciara = (x1, y1, x2, y2) => { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); };
  // jemná (vedľajšia) a hlavná mriežka
  const mriezka = (krok, farba) => {
    ctx.beginPath(); ctx.strokeStyle = farba; ctx.lineWidth = 1;
    const a = Math.ceil(T.x0 / krok), b = Math.floor(T.x1 / krok);
    if (b - a < 2000) for (let i = a; i <= b; i++) { const p = Math.round(T.px(i * krok)) + .5; ciara(p, 0, p, H); }
    const c = Math.ceil(T.yDole / krok), e = Math.floor(T.yHore / krok);
    if (e - c < 2000) for (let i = c; i <= e; i++) { const p = Math.round(T.py(i * krok)) + .5; ciara(0, p, W, p); }
    ctx.stroke();
  };
  const sub = kx / (mantisa(kx) === 2 ? 4 : 5);
  if (sub * Math.min(v.sx, v.sy) >= 9) mriezka(sub, FARBY.mriezka2);
  mriezka(kx === ky ? kx : Math.max(kx, ky), FARBY.mriezka);

  /* --- osi --- */
  const osX = T.py(0), osY = T.px(0);                     // os x leží na py(0), os y na px(0)
  const vidX = osX >= 0 && osX <= H, vidY = osY >= 0 && osY <= W;
  ctx.strokeStyle = FARBY.os; ctx.fillStyle = FARBY.os; ctx.lineWidth = 2;
  if (vidX) {
    const p = Math.round(osX) + .5;
    ctx.beginPath(); ciara(0, p, W - 2, p); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W - 1, p); ctx.lineTo(W - 13, p - 6); ctx.lineTo(W - 13, p + 6); ctx.closePath(); ctx.fill();
  }
  if (vidY) {
    const p = Math.round(osY) + .5;
    ctx.beginPath(); ciara(p, H, p, 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p, 1); ctx.lineTo(p - 6, 13); ctx.lineTo(p + 6, 13); ctx.closePath(); ctx.fill();
  }

  /* --- čísla na osi x --- */
  ctx.font = PISMO;
  let lyX, zarX;                                          // poloha popiskov osi x (aj keď je os mimo plátna)
  if (osX < 0) { lyX = 4; zarX = 'top'; }
  else if (osX > H) { lyX = H - 4; zarX = 'bottom'; }
  else if (osX > H - 30) { lyX = osX - 6; zarX = 'bottom'; }
  else { lyX = osX + 6; zarX = 'top'; }
  ctx.textBaseline = zarX; ctx.textAlign = 'center';
  {
    const a = Math.ceil(T.x0 / kx), b = Math.floor(T.x1 / kx);
    if (b - a < 1000) for (let i = a; i <= b; i++) {
      if (i === 0 && vidY) continue;                      // 0 kreslíme raz pri počiatku
      const p = T.px(i * kx), t = cis(i * kx, dX), w = ctx.measureText(t).width;
      if (p - w / 2 < 2 || p + w / 2 > W - 2) continue;
      if (vidX && p + w / 2 > W - 26) continue;           // miesto pre názov osi „x“
      if (vidY && Math.abs(p - osY) < w / 2 + 8) continue;
      if (podZnackou({ x: p - w / 2, y: zarX === 'top' ? lyX : lyX - 18, w, h: 18 })) continue;
      textLem(ctx, t, p, lyX, FARBY.muted);
      obsadene.push({ x: p - w / 2, y: zarX === 'top' ? lyX : lyX - 18, w, h: 18 });
    }
  }
  /* --- čísla na osi y --- */
  let lxY, zarY;
  if (osY < 0) { lxY = 6; zarY = 'left'; }
  else if (osY > W) { lxY = W - 6; zarY = 'right'; }
  else if (osY < 60) { lxY = osY + 8; zarY = 'left'; }
  else { lxY = osY - 8; zarY = 'right'; }
  ctx.textAlign = zarY; ctx.textBaseline = 'middle';
  {
    const a = Math.ceil(T.yDole / ky), b = Math.floor(T.yHore / ky);
    if (b - a < 1000) for (let i = a; i <= b; i++) {
      if (i === 0 && vidX) continue;
      const p = T.py(i * ky), t = cis(i * ky, dY), w = ctx.measureText(t).width;
      if (p < 12 || p > H - 12) continue;
      if (vidY && p < 30) continue;                       // miesto pre názov osi „y“
      if (Math.abs(p - (zarX === 'top' ? lyX + 9 : lyX - 9)) < 20) continue;  // nie cez čísla osi x
      if (podZnackou({ x: zarY === 'left' ? lxY : lxY - w, y: p - 9, w, h: 18 })) continue;
      textLem(ctx, t, lxY, p, FARBY.muted);
      obsadene.push({ x: zarY === 'left' ? lxY : lxY - w, y: p - 9, w, h: 18 });
    }
  }
  if (vidX && vidY) { ctx.textAlign = 'right'; ctx.textBaseline = 'top'; textLem(ctx, '0', osY - 6, osX + 5, FARBY.muted); }
  // názvy osí
  ctx.font = PISMO_B;
  if (vidX) { ctx.textAlign = 'right'; ctx.textBaseline = osX > 30 ? 'bottom' : 'top'; textLem(ctx, TEXTY.graf.osX, W - 6, osX > 30 ? osX - 8 : osX + 10, FARBY.text); }
  if (vidY) { ctx.textAlign = 'left'; ctx.textBaseline = 'top'; textLem(ctx, TEXTY.graf.osY, osY + 12, 2, FARBY.text); }

  /* --- krivky: hodnota pre každý pixel šírky plátna --- */
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  const n = Math.ceil(W * dpr);
  for (const k of krivky) {
    ctx.beginPath(); ctx.setLineDash(STYLY[k.styl] || []); ctx.lineWidth = k.hrubka || 3.5; ctx.strokeStyle = k.farba || FARBY.f;
    ctx.lineJoin = 'round'; ctx.lineCap = k.styl === 'bodkovana' ? 'round' : 'butt';
    let pero = false;
    for (let i = 0; i <= n; i++) {
      const p = i / dpr, y = hodnota(k, T.wx(p));
      let q = T.py(y);
      if (!isFinite(q)) { pero = false; continue; }       // NaN / Infinity → prerušíme čiaru
      q = clamp(q, -4 * H, 5 * H);                        // ďaleko mimo plátna orežeme (bez obrovských súradníc)
      if (pero) ctx.lineTo(p, q); else ctx.moveTo(p, q);
      pero = true;
    }
    ctx.stroke();
  }
  ctx.restore(); ctx.setLineDash([]);
  // názvy kriviek (f, cieľ …) – pri pravom okraji, kde je krivka viditeľná
  for (const k of krivky) {
    if (!k.popis) continue;
    for (let p = W - 40; p > 30; p -= 24) {
      const q = T.py(hodnota(k, T.wx(p)));
      if (isFinite(q) && q > 30 && q < H - 30) { ctx.font = PISMO_B; umiestniPopis(ctx, T, obsadene, k.popis, p, q, k.farba || FARBY.f); break; }
    }
  }

  /* --- vlastné kreslenie karty (trojuholník sklonu, šípky …) --- */
  if (moz.navrch) { ctx.save(); moz.navrch(ctx, T, obsadene); ctx.restore(); ctx.setLineDash([]); }

  /* --- značky bodov --- */
  const zn = (moz.znacky || []).filter(z => isFinite(z.x) && isFinite(z.y));
  for (const z of zn) {
    const x = T.px(z.x), y = T.py(z.y);
    if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
    obsadene.push({ x: x - 11, y: y - 11, w: 22, h: 22 });
  }
  for (const z of zn) {
    const x = T.px(z.x), y = T.py(z.y);
    if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
    const farba = z.farba || FARBY[z.typ] || FARBY.text;
    kresliZnacku(ctx, z.typ, x, y, farba);
    if (z.popis) umiestniPopis(ctx, T, obsadene, z.popis, x, y, farba);
  }

  /* --- sonda: jazdec na osi x, zvislá čiarkovaná čiara a bod na krivke --- */
  T.sonda = null;
  if (moz.sonda && krivky[moz.sonda.krivka || 0]) {
    const k = krivky[moz.sonda.krivka || 0];
    const sx = moz.sonda.x, sy = hodnota(k, sx);
    const hx = T.px(sx), hy = clamp(vidX ? osX : (osX < 0 ? 0 : H), 18, H - 18);
    if (hx >= -2 && hx <= W + 2) {
      const yy = T.py(sy), by = isFinite(yy) ? clamp(yy, -2, H + 2) : hy;
      ctx.save();
      ctx.strokeStyle = FARBY.f; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, by); ctx.stroke(); ctx.setLineDash([]);
      // jazdec
      ctx.fillStyle = FARBY.f; ctx.strokeStyle = '#1a0e02'; ctx.lineWidth = 2;
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(hx - 22, hy - 14, 44, 28, 14); else ctx.rect(hx - 22, hy - 14, 44, 28);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#1a0e02';
      ctx.beginPath(); ctx.moveTo(hx - 16, hy); ctx.lineTo(hx - 7, hy - 7); ctx.lineTo(hx - 7, hy + 7); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(hx + 16, hy); ctx.lineTo(hx + 7, hy - 7); ctx.lineTo(hx + 7, hy + 7); ctx.closePath(); ctx.fill();
      // bod na krivke
      if (isFinite(yy) && yy >= -8 && yy <= H + 8) {
        ctx.beginPath(); ctx.arc(hx, yy, 8, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = FARBY.f; ctx.stroke();
        umiestniPopis(ctx, T, obsadene, `(${cis(sx)}; ${cis(sy)})`, hx, yy, FARBY.f);
      }
      ctx.restore();
      T.sonda = { hx, hy, by };
    }
  }
  return T;
}

/* =====================================================================
   GRAF – ovládanie (posúvanie, priblíženie, sonda, prispôsobenie)
   novyGraf(kontajner, nastavenia) postaví plátno, tlačidlá a riadok sondy.
   G.nastav(krivky, moznosti) – nové krivky a značky; moznosti navyše:
     korene: [x …] (sonda sa k nim prichytáva), vsetkoKorene: true (nulová funkcia),
     dolezite: [x …] (body, ktoré má „Prispôsob“ ukázať), rovnakaMierka (predvolene true)
   ===================================================================== */
const VIEW_MIN = 1e-3, VIEW_MAX = 1e6, STRED_MAX = 1e6;   // hranice mierky a posunu – pri extrémoch sa nič nerozbije
function orezView(v) {
  return { cx: clamp(v.cx, -STRED_MAX, STRED_MAX), cy: clamp(v.cy, -STRED_MAX, STRED_MAX), sx: clamp(v.sx, VIEW_MIN, VIEW_MAX), sy: clamp(v.sy, VIEW_MIN, VIEW_MAX) };
}
const VSETKY_GRAFY = [];

function novyGraf(kontajner, nast = {}) {
  kontajner.innerHTML = `
    <div class="card stageCard">
      <div class="grafLista">
        <button class="zoom" data-a="plus" aria-label="${U.plusAria}">${U.plus}</button>
        <button class="zoom" data-a="minus" aria-label="${U.minusAria}">${U.minus}</button>
        <button data-a="povodny">${U.povodny}</button>
        <button data-a="prisposob">${U.prisposob}</button>
        <label class="chk"><input type="checkbox" checked data-a="sonda"> ${U.sonda}</label>
      </div>
      <div class="stage"><canvas tabindex="0" role="img" aria-label="${U.grafAria}"></canvas></div>
      <div class="sondaInfo" aria-live="polite"></div>
      <div class="legenda"></div>
      <p class="priblizne">${U.ovladanie}</p>
    </div>`;
  const platno = $('canvas', kontajner), info = $('.sondaInfo', kontajner), leg = $('.legenda', kontajner);
  const G = { platno, krivky: [], moz: {}, view: null, sonda: { zap: true, x: nast.sondaX ?? 1 }, T: null, anim: 0 };
  VSETKY_GRAFY.push(G);

  G.povodnyPohlad = () => {
    const W = platno.clientWidth || 600, H = platno.clientHeight || 450;
    const s = Math.min(W / 16, H / 12);
    return orezView({ cx: 0, cy: 0, sx: s, sy: s });
  };
  G.nastav = (krivky, moz) => { G.krivky = krivky; G.moz = moz || {}; G.legenda(); G.kresli(); };
  let caka = false;
  G.kresli = () => { if (caka) return; caka = true; requestAnimationFrame(() => { caka = false; G.hned(); }); };
  G.hned = () => {
    if (platno.clientWidth < 20) return;                  // skrytá karta – nekreslíme
    if (!G.view) G.view = G.povodnyPohlad();
    G.T = drawGraph(platno, G.krivky, Object.assign({}, G.moz, { view: G.view, sonda: G.sonda.zap ? { x: G.sonda.x, krivka: 0 } : null }));
    G.infoSonda();
  };

  /* --- prechod pohľadu animovaný cez requestAnimationFrame podľa skutočného času --- */
  G.animujNa = (ciel, ms = 380) => {
    ciel = orezView(ciel);
    cancelAnimationFrame(G.anim);
    if (MALO_POHYBU || !G.view) { G.view = ciel; G.kresli(); return; }
    const z = Object.assign({}, G.view), t0 = performance.now();
    const krok = t => {
      const p = clamp((t - t0) / ms, 0, 1), e = ease(p);
      G.view = {
        cx: z.cx + (ciel.cx - z.cx) * e, cy: z.cy + (ciel.cy - z.cy) * e,
        sx: z.sx * Math.pow(ciel.sx / z.sx, e), sy: z.sy * Math.pow(ciel.sy / z.sy, e)   // mierka sa mení logaritmicky
      };
      G.hned();
      G.anim = p < 1 ? requestAnimationFrame(krok) : 0;
    };
    G.anim = requestAnimationFrame(krok);
  };
  G.zoom = f => { const v = G.view || G.povodnyPohlad(); G.animujNa({ cx: v.cx, cy: v.cy, sx: v.sx * f, sy: v.sy * f }); };
  // priblíženie okolo bodu (px, py) – bod pod prstom/kurzorom ostane na mieste
  G.zoomOkolo = (px, py, f, z = G.view) => {
    const W = platno.clientWidth, H = platno.clientHeight;
    const wx = z.cx + (px - W / 2) / z.sx, wy = z.cy - (py - H / 2) / z.sy;
    const sx = clamp(z.sx * f, VIEW_MIN, VIEW_MAX), sy = clamp(z.sy * f, VIEW_MIN, VIEW_MAX);
    return orezView({ sx, sy, cx: wx - (px - W / 2) / sx, cy: wy + (py - H / 2) / sy });
  };
  // „Prispôsob graf funkcii“: ukáž korene, priesečník s osou y a dôležité body
  G.prisposob = () => {
    const W = platno.clientWidth, H = platno.clientHeight; if (W < 20) return;
    const xs = [0, ...(G.moz.korene || []), ...(G.moz.dolezite || [])].filter(x => isFinite(x));
    for (const z of G.moz.znacky || []) if (isFinite(z.x)) xs.push(z.x);
    let a = Math.min(...xs) - 2, b = Math.max(...xs) + 2;
    if (b - a < 8) { const m = (a + b) / 2; a = m - 4; b = m + 4; }
    let lo = 0, hi = 0;
    for (const k of G.krivky) for (let i = 0; i <= 200; i++) {
      const y = hodnota(k, a + (b - a) * i / 200);
      if (isFinite(y)) { lo = Math.min(lo, y); hi = Math.max(hi, y); }
    }
    for (const z of G.moz.znacky || []) if (isFinite(z.y)) { lo = Math.min(lo, z.y); hi = Math.max(hi, z.y); }
    if (hi - lo < 4) { const m = (hi + lo) / 2; lo = m - 2; hi = m + 2; }
    const pad = (hi - lo) * .12; lo -= pad; hi += pad;
    let sx = W / (b - a), sy = H / (hi - lo);
    if (G.moz.rovnakaMierka !== false) sx = sy = Math.min(sx, sy);
    G.animujNa({ cx: (a + b) / 2, cy: (lo + hi) / 2, sx, sy });
  };

  /* --- korene a prichytenie sondy --- */
  const PRICHYT = 10, BLIZKO = 32;                        // v pixeloch
  G.najblizsiKoren = x => {
    let best = null;
    for (const r of G.moz.korene || []) {
      if (!isFinite(r)) continue;
      const d = Math.abs((r - x) * (G.view ? G.view.sx : 1));
      if (!best || d < best.d) best = { r, d };
    }
    return best;
  };
  G.nastavSondu = (x, magnet) => {
    if (!isFinite(x)) return;
    x = clamp(x, -STRED_MAX, STRED_MAX);
    const k = G.najblizsiKoren(x);
    if (magnet && k && k.d < PRICHYT) x = k.r;
    G.sonda.x = x; G.kresli();
  };
  G.infoSonda = () => {
    if (!G.sonda.zap) { info.innerHTML = TEXTY.graf.vypnuta; return; }
    const k = G.krivky[0]; if (!k) { info.innerHTML = ''; return; }
    const x = G.sonda.x, y = hodnota(k, x);
    let h = vypln(TEXTY.graf.sondaInfo, { x: cis(x), y: cis(y), rov: jeNula(y) ? '=' : rovZnak(y) });
    const kr = G.najblizsiKoren(x);
    if (G.moz.vsetkoKorene) h += '<br>' + TEXTY.graf.vsade;
    else if (kr && rovne(kr.r, x)) h += '<br>' + vypln(TEXTY.graf.naKoreni, { x: cis(x) });
    else if (kr && kr.d < BLIZKO && Math.abs(y) * (G.view ? G.view.sy : 1) < 24) h +=   // blízko koreňa aj na grafe (bod je pri osi x)
      '<br>' + TEXTY.graf.blizko + ` <button data-a="prichyt">${U.prichytit}</button>`;
    if (G.T && !G.T.sonda) h += '<br>' + TEXTY.graf.mimo + ` <button data-a="stred">${U.sondaStred}</button>`;
    if (info.innerHTML !== h) info.innerHTML = h;
  };
  // legenda: štýl čiary + názov krivky, tvary značiek
  G.legenda = () => {
    const casti = [];
    for (const k of G.krivky) {
      if (!k.popis) continue;
      const d = (STYLY[k.styl] || []).join(' ');
      casti.push(`<span><svg width="44" height="14" aria-hidden="true"><line x1="2" y1="7" x2="42" y2="7" stroke="${k.farba || FARBY.f}" stroke-width="3.5" stroke-dasharray="${d}" stroke-linecap="${k.styl === 'bodkovana' ? 'round' : 'butt'}"/></svg>${k.popis} (${TEXTY.styly[k.styl || 'plna']})</span>`);
    }
    const typy = [...new Set((G.moz.znacky || []).map(z => z.typ))];
    const tvar = { koren: c => `<circle cx="10" cy="10" r="7" fill="${c}" stroke="#04060c" stroke-width="2"/><circle cx="10" cy="10" r="2.6" fill="#04060c"/>`,
      prY: c => `<rect x="3.5" y="3.5" width="13" height="13" fill="${c}" stroke="#04060c" stroke-width="2"/>`,
      vrchol: c => `<path d="M10 1 L19 10 L10 19 L1 10Z" fill="${c}" stroke="#04060c" stroke-width="2"/>`,
      extrem: c => `<path d="M10 1 L19 10 L10 19 L1 10Z" fill="${c}" stroke="#04060c" stroke-width="2"/>`,
      inflex: c => `<path d="M10 2 L18 16 L2 16Z" fill="none" stroke="${c}" stroke-width="2.5"/>`,
      stred: c => `<circle cx="10" cy="10" r="8" fill="none" stroke="${c}" stroke-width="2.5"/><circle cx="10" cy="10" r="3.5" fill="${c}"/>`,
      zvyr: c => `<circle cx="10" cy="10" r="8" fill="none" stroke="${c}" stroke-width="2.5"/><circle cx="10" cy="10" r="3.5" fill="${c}"/>`,
      poc: c => `<circle cx="10" cy="10" r="6" fill="none" stroke="${c}" stroke-width="2.5"/>` };
    for (const t of typy) if (tvar[t] && TEXTY.znacky[t]) casti.push(`<span><svg width="20" height="20" aria-hidden="true">${tvar[t](FARBY[t])}</svg>${TEXTY.znacky[t]}</span>`);
    leg.innerHTML = casti.length ? `<span>${TEXTY.graf.legenda}</span>` + casti.join('') : '';
  };

  /* --- tlačidlá --- */
  kontajner.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b || b.tagName === 'INPUT') return;
    const a = b.dataset.a;
    if (a === 'plus') G.zoom(1.5);
    else if (a === 'minus') G.zoom(1 / 1.5);
    else if (a === 'povodny') G.animujNa(G.povodnyPohlad());
    else if (a === 'prisposob') G.prisposob();
    else if (a === 'prichyt') { const k = G.najblizsiKoren(G.sonda.x); if (k) G.nastavSondu(k.r); }
    else if (a === 'stred') G.nastavSondu(G.view.cx);
  });
  $('[data-a="sonda"]', kontajner).addEventListener('change', e => {
    G.sonda.zap = e.target.checked;
    if (G.sonda.zap && G.T && !G.T.sonda && G.view) G.sonda.x = G.view.cx;
    G.kresli();
  });

  /* --- myš a prsty: ťah = posun alebo sonda, dva prsty = priblíženie, koliesko = priblíženie --- */
  const prsty = new Map();
  let rezim = null, start = null;
  const poloha = e => { const r = platno.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const naSonde = p => {
    const s = G.T && G.T.sonda; if (!s) return false;
    if (Math.abs(p.x - s.hx) < 28 && Math.abs(p.y - s.hy) < 26) return true;         // jazdec
    if (Math.abs(p.x - s.hx) < 22 && Math.abs(p.y - s.by) < 22) return true;         // bod na krivke
    return Math.abs(p.x - s.hx) < 12 && p.y > Math.min(s.hy, s.by) && p.y < Math.max(s.hy, s.by);  // čiara
  };
  const zacniPinch = () => {
    const [a, b] = [...prsty.values()];
    start = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, m: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, v: Object.assign({}, G.view) };
    rezim = 'pinch';
  };
  platno.addEventListener('pointerdown', e => {
    if (!G.view) return;
    cancelAnimationFrame(G.anim); G.anim = 0;
    try { platno.setPointerCapture(e.pointerId); } catch (x) { /* nič */ }
    const p = poloha(e); prsty.set(e.pointerId, p);
    if (prsty.size === 1) {
      if (G.sonda.zap && naSonde(p)) rezim = 'sonda';
      else { rezim = 'pan'; start = { p, v: Object.assign({}, G.view) }; platno.classList.add('tahanie'); }
    } else if (prsty.size === 2) zacniPinch();
    e.preventDefault();
  });
  platno.addEventListener('pointermove', e => {
    const p = poloha(e);
    if (!prsty.has(e.pointerId)) {                        // len kurzor nad grafom
      platno.classList.toggle('nadSondou', G.sonda.zap && naSonde(p)); return;
    }
    prsty.set(e.pointerId, p);
    if (rezim === 'sonda' && G.T) G.nastavSondu(G.T.wx(p.x), true);
    else if (rezim === 'pan') {
      G.view = orezView({ cx: start.v.cx - (p.x - start.p.x) / start.v.sx, cy: start.v.cy + (p.y - start.p.y) / start.v.sy, sx: start.v.sx, sy: start.v.sy });
      G.kresli();
    } else if (rezim === 'pinch' && prsty.size >= 2) {
      const [a, b] = [...prsty.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const v = G.zoomOkolo(start.m.x, start.m.y, d / start.d, start.v);   // priblíž okolo pôvodného stredu prstov …
      v.cx -= (m.x - start.m.x) / v.sx; v.cy += (m.y - start.m.y) / v.sy;  // … a posuň podľa pohybu stredu
      G.view = orezView(v); G.kresli();
    }
  });
  const pusti = e => {
    if (!prsty.has(e.pointerId)) return;
    prsty.delete(e.pointerId);
    if (prsty.size === 1) { const p = [...prsty.values()][0]; rezim = 'pan'; start = { p, v: Object.assign({}, G.view) }; }
    else if (prsty.size === 0) { rezim = null; platno.classList.remove('tahanie'); }
  };
  platno.addEventListener('pointerup', pusti);
  platno.addEventListener('pointercancel', pusti);
  platno.addEventListener('wheel', e => {
    if (!G.view) return;
    e.preventDefault(); cancelAnimationFrame(G.anim); G.anim = 0;
    const p = poloha(e), dy = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
    G.view = G.zoomOkolo(p.x, p.y, Math.exp(-clamp(dy, -300, 300) * .0015)); G.kresli();
  }, { passive: false });
  // klávesnica: šípky posúvajú sondu, + a − približujú
  platno.addEventListener('keydown', e => {
    if (!G.view) return;
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight') {
      const d = peknyKrok(8 / G.view.sx) * (k === 'ArrowLeft' ? -1 : 1);
      G.sonda.zap = true; $('[data-a="sonda"]', kontajner).checked = true;
      G.nastavSondu(Math.round((G.sonda.x + d) / Math.abs(d)) * Math.abs(d), true);
    } else if (k === '+' || k === '=') G.zoom(1.5);
    else if (k === '-' || k === '_') G.zoom(1 / 1.5);
    else return;
    e.preventDefault();
  });
  if (window.ResizeObserver) new ResizeObserver(() => G.kresli()).observe(platno);
  return G;
}

/* =====================================================================
   POSUVNÍK s tlačidlami − a + (presné nastavenie aj na dotykovej obrazovke)
   ===================================================================== */
function posuvnik(el, { nazov, min, max, krok, hodnota: h0, zmena }) {
  el.innerHTML = `<label class="sl"><span class="lbl"><span>${nazov}</span><b></b></span>
    <span class="slRiadok"><button type="button" aria-label="${nazov} menej">−</button>
    <input type="range" min="${min}" max="${max}" step="${krok}" value="${h0}" aria-label="${nazov}">
    <button type="button" aria-label="${nazov} viac">+</button></span></label>`;
  const inp = $('input', el), out = $('b', el), [bm, bp] = $$('button', el);
  const P = {
    get: () => +inp.value,
    set: v => { inp.value = clamp(v, min, max); P.ukaz(); },
    ukaz: () => { out.textContent = nazov.split(' ')[0] + ' = ' + cisK(+inp.value); }
  };
  inp.addEventListener('input', () => { P.ukaz(); zmena(+inp.value); });
  const pridaj = d => { const v = clamp(Math.round((+inp.value + d) / krok) * krok, min, max); inp.value = v; P.ukaz(); zmena(v); };
  bm.onclick = () => pridaj(-krok); bp.onclick = () => pridaj(krok);
  P.ukaz();
  return P;
}

/* =====================================================================
   TABUĽKA HODNÔT – 7 hodnôt x, nastaviteľný začiatok a krok, prírastky medzi riadkami
   vytvorTabulku(el, { poly: () => c, prirastky: true, zhrnutie: (prírastky, krok) => html, zmena: () => {} })
   ===================================================================== */
const POCET_RIADKOV = 7;
function vytvorTabulku(el, cfg) {
  const TT = TEXTY.tab;
  el.innerHTML = `<h3>${TT.nadpis}</h3>
    <div class="vstupy">
      <label>${TT.zaciatok}<input class="num" data-v="start" inputmode="decimal" autocomplete="off" value="−3"></label>
      <label>${TT.krok}<input class="num" data-v="krok" inputmode="decimal" autocomplete="off" value="1"></label>
    </div>
    <table class="hodnoty"><thead><tr><th>${TT.hlX}</th><th>${TT.hlY}</th>${cfg.prirastky ? `<th style="text-align:left">${TT.hlD}</th>` : ''}</tr></thead><tbody></tbody></table>
    <p class="hlaska" aria-live="polite"></p>
    <p class="mini zhrn"></p>
    <p class="mini">${TT.klik}</p>`;
  const tb = $('tbody', el), hl = $('.hlaska', el), zh = $('.zhrn', el);
  const iS = $('[data-v="start"]', el), iK = $('[data-v="krok"]', el);
  const Tb = { start: -3, krok: 1, vyb: null, xs: [], ys: [] };
  const fix = x => Math.round(x * 1e10) / 1e10;           // odstráni chyby typu 0,1 + 0,2 = 0,30000000000000004
  Tb.obnov = () => {
    const c = cfg.poly();
    Tb.xs = []; Tb.ys = [];
    for (let i = 0; i < POCET_RIADKOV; i++) { const x = fix(Tb.start + i * Tb.krok); Tb.xs.push(x); Tb.ys.push(evalPoly(c, x)); }
    const d = Tb.ys.slice(1).map((y, i) => y - Tb.ys[i]);
    tb.innerHTML = Tb.xs.map((x, i) => `<tr tabindex="0" data-i="${i}" class="${Tb.vyb === i ? 'vyb' : ''}" aria-label="x = ${cisK(x)}, y = ${cis(Tb.ys[i])}">
      <td>${cisK(x)}</td><td>${cis(Tb.ys[i])}</td>${cfg.prirastky ? `<td class="d">${i ? `<span aria-label="prírastok">${d[i - 1] > EPS ? '+' : ''}${cis(d[i - 1])}</span>` : ''}</td>` : ''}</tr>`).join('');
    zh.innerHTML = cfg.zhrnutie ? cfg.zhrnutie(d, Tb.krok) : '';
  };
  // vybraný bod (riadok) pre zvýraznenie na grafe
  Tb.bod = () => Tb.vyb === null ? null : { x: Tb.xs[Tb.vyb], y: Tb.ys[Tb.vyb] };
  const nacitaj = () => {
    const s = citaj(iS.value), k = citaj(iK.value);
    const okS = isFinite(s) && Math.abs(s) <= 1e6, okK = isFinite(k) && !jeNula(k) && Math.abs(k) <= 1e5;
    iS.classList.toggle('zle', !okS); iK.classList.toggle('zle', !okK);
    hl.textContent = okS && okK ? '' : TT.chyba;
    if (!okS || !okK) return;
    Tb.start = s; Tb.krok = k; Tb.obnov(); cfg.zmena();
  };
  iS.addEventListener('input', nacitaj); iK.addEventListener('input', nacitaj);
  const vyber = tr => { const i = +tr.dataset.i; Tb.vyb = Tb.vyb === i ? null : i; Tb.obnov(); cfg.zmena(); const n = $(`tr[data-i="${i}"]`, tb); if (n) n.focus(); };
  tb.addEventListener('click', e => { const tr = e.target.closest('tr'); if (tr) vyber(tr); });
  tb.addEventListener('keydown', e => { const tr = e.target.closest('tr'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); vyber(tr); } });
  return Tb;
}
// spoločné: zvýraznený bod z tabuľky ako značka grafu
const znackaTab = Tb => { const b = Tb.bod(); return b ? [{ x: b.x, y: b.y, typ: 'zvyr', popis: `(${cis(b.x)}; ${cis(b.y)})` }] : []; };

/* =====================================================================
   PODKARTY – tlačidlá v .podkarty prepínajú bloky [data-pod] v rámci karty
   stav.pod = aktívna podkarta, stav.ukaz(p) ju zobrazí; adresa: #karta/podkarta
   ===================================================================== */
function vytvorPodkarty(id, texty, stav) {
  const nav = $(`#${id} .podkarty`);
  for (const [k, t] of Object.entries(texty)) {
    const b = document.createElement('button'); b.dataset.p = k; b.setAttribute('role', 'tab'); b.textContent = t;
    b.onclick = () => stav.ukaz(k); nav.appendChild(b);
  }
  stav.ukaz = (p, ticho) => {
    stav.pod = p;
    $$(`#${id} [data-pod]`).forEach(e => { e.hidden = e.dataset.pod !== p; });
    $$('button', nav).forEach(b => { const on = b.dataset.p === p; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    if (!ticho && AKT === id) { try { history.replaceState(null, '', '#' + id + '/' + p); } catch (e) { /* nič */ } }
    VSETKY_GRAFY.forEach(G => G.kresli());
  };
  const m = new RegExp('^#' + id + '/([a-z]+)').exec(location.hash);
  stav.ukaz(m && texty[m[1]] ? m[1] : Object.keys(texty)[0], true);
  PODKARTA[id] = () => stav.pod;
}

/* =====================================================================
   KARTA 1: KONŠTANTNÁ FUNKCIA y = q
   ===================================================================== */
const KON = { q: 2, anim: null, G: null, Tb: null, sl: null };
function initKonst() {
  const TK = TEXTY.konst;
  KON.G = novyGraf($('#konst_graf'), { sondaX: 1 });
  KON.Tb = vytvorTabulku($('#konst_tab'), { poly: () => [KON.q], prirastky: true, zhrnutie: () => TK.zhrnutie, zmena: obnovKonst });
  KON.sl = posuvnik($('#konst_slQ'), { nazov: TK.slQ, min: -6, max: 6, krok: .5, hodnota: KON.q, zmena: v => { KON.q = v; obnovKonst(); } });
  $('#konst_anim').onclick = () => {
    KON.anim = KON.anim ? null : { t0: performance.now() };
    if (KON.anim) { const slucka = () => { if (!KON.anim) return; KON.G.hned(); if (performance.now() - KON.anim.t0 < 4000) requestAnimationFrame(slucka); }; requestAnimationFrame(slucka); }
    obnovKonst();
  };
  KON.Tb.obnov(); obnovKonst();
}
// šípky „x → y“: z niekoľkých bodov na osi x vystúpia na priamku – všetky do rovnakej výšky q
function kresliPriradenie(ctx, T, obsadene) {
  if (!KON.anim) return;
  const t = MALO_POHYBU ? 99 : (performance.now() - KON.anim.t0) / 1000;
  const xs = [-6, -4, -2, 0, 2, 4, 6], q = KON.q;
  ctx.strokeStyle = FARBY.sklon2; ctx.fillStyle = FARBY.sklon2; ctx.lineWidth = 2.5;
  xs.forEach((x, j) => {
    const p = ease(clamp((t - j * .35) / .7, 0, 1));
    if (p <= 0) return;
    const X = T.px(x), Y0 = T.py(0), Y1 = T.py(q * p);
    ctx.setLineDash([2, 6]); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X, Y0); ctx.lineTo(X, Y1); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(X, Y0, 5, 0, 7); ctx.fill();
    if (Math.abs(Y1 - Y0) > 14) {                         // hrot šípky
      const s = Y1 < Y0 ? 1 : -1;
      ctx.beginPath(); ctx.moveTo(X, Y1); ctx.lineTo(X - 7, Y1 + 12 * s); ctx.lineTo(X + 7, Y1 + 12 * s); ctx.closePath(); ctx.fill();
    }
  });
  if (t > xs.length * .35 + .4) {
    const X = T.px(-5), Y = T.py(q);
    umiestniPopis(ctx, T, obsadene, vypln(TEXTY.konst.animPopis, { q: cisK(q) }), X, Y, FARBY.sklon2, [[-40, q >= 0 ? -44 : 18], [-40, q >= 0 ? 18 : -44], [0, -44], [0, 18]]);
  }
}
function obnovKonst() {
  const TK = TEXTY.konst, q = KON.q, c = [q];
  $('#konst_vzorec').textContent = 'f(x) = ' + polyText(c);
  $('#konst_anim').textContent = KON.anim ? TK.animSkry : TK.anim;
  const st = degree(c);
  const vl = [TK.defObor, vypln(TK.oborH, { q: cisK(q) }), jeNula(q) ? TK.korenVsetky : vypln(TK.korenNie, { q: cisK(q) }),
    st === 0 ? vypln(TK.stupen, { q: cisK(q) }) : TK.nulova];
  $('#konst_vl').innerHTML = vl.map(t => `<li>${t}</li>`).join('');
  KON.Tb.obnov();
  KON.G.nastav([{ c, farba: FARBY.f, styl: 'plna', popis: 'f', hrubka: jeNula(q) ? 5 : 3.5 }], {
    znacky: [{ x: 0, y: q, typ: 'prY', popis: `(0; ${cisK(q)})` }, ...znackaTab(KON.Tb)],
    korene: [], vsetkoKorene: jeNula(q), navrch: kresliPriradenie
  });
}

/* =====================================================================
   KARTA 2: LINEÁRNA FUNKCIA y = kx + q
   ===================================================================== */
const LIN = { k: 2, q: -4, G: null, Tb: null, slK: null, slQ: null, kroky: null, hra: null, skore: 0 };
function initLin() {
  const TL = TEXTY.lin;
  LIN.G = novyGraf($('#lin_graf'), { sondaX: 1 });
  LIN.Tb = vytvorTabulku($('#lin_tab'), {
    poly: () => [LIN.q, LIN.k], prirastky: true, zmena: obnovLin,
    zhrnutie: (d, krok) => d.every(x => Math.abs(x - d[0]) < 1e-6 * Math.max(1, Math.abs(d[0])))
      ? vypln(TL.zhrnutie, { krok: cisK(krok), krokZ: zatv(krok), k: cisK(LIN.k), d: cis(LIN.k * krok) }) : TL.zhrnutieNie
  });
  LIN.slK = posuvnik($('#lin_slK'), { nazov: TL.slK, min: -6, max: 6, krok: .5, hodnota: LIN.k, zmena: v => { LIN.k = v; LIN.kroky = null; obnovLin(); } });
  LIN.slQ = posuvnik($('#lin_slQ'), { nazov: TL.slQ, min: -6, max: 6, krok: .5, hodnota: LIN.q, zmena: v => { LIN.q = v; LIN.kroky = null; obnovLin(); } });
  $('#lin_anim').onclick = () => {
    LIN.kroky = LIN.kroky ? null : { t0: performance.now() };
    if (LIN.kroky) { const z = LIN.kroky; const slucka = () => { if (LIN.kroky !== z) return; LIN.G.hned(); if (performance.now() - z.t0 < 6000) requestAnimationFrame(slucka); }; requestAnimationFrame(slucka); }
    obnovLin();
  };
  initHra();
  LIN.Tb.obnov(); obnovLin();
}
const kxText = k => rovne(k, 1) ? 'x' : rovne(k, -1) ? '−x' : cisK(k) + 'x';

// trojuholník sklonu z bodu (0; q): o 1 doprava (čiarkovane), o k nahor/nadol (bodkovane)
function kresliSklon(ctx, T, obsadene) {
  const k = LIN.k, q = LIN.q;
  if (LIN.kroky) return kresliKroky(ctx, T, obsadene);
  if (jeNula(k)) return;
  const A = [T.px(0), T.py(q)], B = [T.px(1), T.py(q)], C = [T.px(1), T.py(q + k)];
  if (B[0] - A[0] < 18) return;                           // príliš oddialené – trojuholník by bol bod
  ctx.fillStyle = 'rgba(127,220,143,.13)';
  ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(...B); ctx.lineTo(...C); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = FARBY.sklon; ctx.setLineDash([10, 6]);
  ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(...B); ctx.stroke();
  ctx.strokeStyle = FARBY.sklon2; ctx.setLineDash([2, 6]); ctx.lineCap = 'round'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(...B); ctx.lineTo(...C); ctx.stroke();
  ctx.setLineDash([]);
  const hore = k > 0;
  umiestniPopis(ctx, T, obsadene, '+1', (A[0] + B[0]) / 2, A[1], FARBY.sklon, hore ? [[-16, 6], [-16, -32]] : [[-16, -32], [-16, 6]]);
  umiestniPopis(ctx, T, obsadene, (hore ? '↑ ' : '↓ ') + (hore ? '+' : '') + cisK(k), B[0], (B[1] + C[1]) / 2, FARBY.sklon2, [[8, -13], [-90, -13]]);
}
// animácia „Krokuj po priamke“: bod kráča po 1 doprava a o k nahor/nadol, kroky zostávajú nakreslené
function kresliKroky(ctx, T, obsadene) {
  const k = LIN.k, q = LIN.q, f = x => k * x + q;
  const t = MALO_POHYBU ? 99 : (performance.now() - LIN.kroky.t0) / 1000, DUR = .9, X0 = -3, N = 6;
  const vel = T.px(1) - T.px(0) >= 34;                    // popisky len ak je dosť miesta
  let bod = null;
  for (let j = 0; j < N; j++) {
    const p = clamp((t - j * DUR) / DUR, 0, 1); if (p <= 0) break;
    const x = X0 + j, ph = ease(clamp(p * 2, 0, 1)), pv = ease(clamp(p * 2 - 1, 0, 1));
    const A = [T.px(x), T.py(f(x))], B = [T.px(x + ph), T.py(f(x))], C = [T.px(x + 1), T.py(f(x) + k * pv)];
    ctx.lineWidth = 3; ctx.strokeStyle = FARBY.sklon; ctx.setLineDash([10, 6]); ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(...B); ctx.stroke();
    bod = B;
    if (pv > 0) {
      ctx.strokeStyle = FARBY.sklon2; ctx.setLineDash([2, 6]); ctx.lineCap = 'round'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(T.px(x + 1), T.py(f(x))); ctx.lineTo(...C); ctx.stroke();
      bod = C;
      if (p >= 1 && vel && !jeNula(k)) umiestniPopis(ctx, T, obsadene, (k > 0 ? '+' : '') + cisK(k), C[0], (T.py(f(x)) + C[1]) / 2, FARBY.sklon2, [[6, -13], [-60, -13]]);
    }
  }
  ctx.setLineDash([]);
  if (bod) { ctx.beginPath(); ctx.arc(bod[0], bod[1], 7, 0, 7); ctx.fillStyle = FARBY.sklon; ctx.fill(); ctx.strokeStyle = '#04060c'; ctx.lineWidth = 2; ctx.stroke(); }
}

// výpočet koreňa po krokoch: kx + q = 0 → kx = −q → x = −q : k
function krokyKorena(k, q) {
  const TL = TEXTY.lin, r = korenLin(k, q);
  const riadok = (rov, op, vys) => `<div class="r${vys ? ' vys' : ''}"><span>${rov}</span>${op ? `<span class="op">| ${op}</span>` : ''}</div>`;
  const qT = jeNula(q) ? '' : (q > 0 ? ' + ' : ' − ') + cisK(Math.abs(q));
  let h = '';
  if (r.typ === 'jeden') {
    h += riadok(`${kxText(k)}${qT} = 0`, jeNula(q) ? (rovne(k, 1) ? '' : ': ' + zatv(k)) : (q > 0 ? '− ' : '+ ') + cisK(Math.abs(q)));
    if (!jeNula(q)) h += riadok(`${kxText(k)} = ${cisK(-q)}`, rovne(k, 1) ? '' : ': ' + zatv(k));
    if (!rovne(k, 1)) h += riadok(`x = ${cisK(-q)} : ${zatv(k)}`);
    const c = cisHTML(r.x, r.zl);
    h += riadok(`x ${c.rov} ${c.html}`, '', true);
    h += `<p style="margin:8px 0 0">${vypln(TL.korenVys, { rov: c.rov, x: c.html, xd: cis(r.x) })}</p>`;
  } else {
    h += riadok(`0 · x${qT} = 0`, '');
    h += riadok(`${cisK(q)} = 0`, '', true);
    h += `<p style="margin:8px 0 0">${r.typ === 'ziadny' ? vypln(TL.korenZiadny, { q: cisK(q) }) : TL.korenVsetky}</p>`;
  }
  return h;
}

function obnovLin() {
  const TL = TEXTY.lin, k = LIN.k, q = LIN.q, c = [q, k];
  $('#lin_vzorec').textContent = 'f(x) = ' + polyText(c);
  $('#lin_anim').textContent = LIN.kroky ? TL.sklonSkry : TL.sklonAnim;
  const st = degree(c);
  const vl = [
    jeNula(k) ? TL.konstantna : vypln(k > 0 ? TL.rastuca : TL.klesajuca, { k: cisK(k), ka: cisK(Math.abs(k)) }),
    vypln(TL.prY, { q: cisK(q) }),
    vypln(TL.defObor, { h: jeNula(k) ? '{' + cisK(q) + '}' : 'ℝ' }),
    st >= 0 ? vypln(TL.stupen, { st }) : TEXTY.konst.nulova
  ];
  $('#lin_vl').innerHTML = vl.map(t => `<li>${t}</li>`).join('');
  let pozn = '';
  if (jeNula(k)) pozn += `<div class="box zlty">${vypln(TL.k0, { q: cisK(q), st: st >= 0 ? st : '– (nulová funkcia)' })}</div>`;
  else if (jeNula(q)) pozn += `<div class="box info">${vypln(TL.q0, { k: rovne(k, 1) ? '' : rovne(k, -1) ? '−' : cisK(k) })}</div>`;
  $('#lin_pozn').innerHTML = pozn;
  $('#lin_kroky').innerHTML = krokyKorena(k, q);

  const r = korenLin(k, q);
  const zn = [];
  if (r.typ === 'jeden' && jeNula(r.x)) zn.push({ x: 0, y: 0, typ: 'koren', popis: `${TEXTY.znacky.koren} (0; 0) = ${TEXTY.znacky.poc}` });
  else {
    zn.push({ x: 0, y: q, typ: 'prY', popis: `(0; ${cisK(q)})` });
    if (r.typ === 'jeden') zn.push({ x: r.x, y: 0, typ: 'koren', popis: `${TEXTY.znacky.koren} x ${rovZnak(r.x)} ${cis(r.x)}` });
  }
  LIN.Tb.obnov();
  zn.push(...znackaTab(LIN.Tb));
  const krivky = [{ c, farba: FARBY.f, styl: 'plna', popis: 'f', hrubka: r.typ === 'vsetky' ? 5 : 3.5 }];
  if (LIN.hra) krivky.push({ c: [LIN.hra.q, LIN.hra.k], farba: FARBY.ciel, styl: 'ciarkovana', popis: LIN.hra.hotovo ? 'cieľ ✔' : 'cieľ', hrubka: 3 });
  LIN.G.nastav(krivky, { znacky: zn, korene: r.typ === 'jeden' ? [r.x] : [], vsetkoKorene: r.typ === 'vsetky', navrch: kresliSklon });
  hraKontrola();
}

/* ----- Hra „Nastav priamku“: úspech sa rozhoduje porovnaním koeficientov, nie pixelov ----- */
function initHra() {
  const TH = TEXTY.lin.hra;
  $('#lin_hraTl').innerHTML = `<button class="primary" data-h="start">${TH.start}</button>
    <button data-h="napoveda" hidden>${TH.napoveda}</button><button data-h="nova" hidden>${TH.nova}</button>`;
  $('#lin_hraTl').addEventListener('click', e => {
    const b = e.target.closest('[data-h]'); if (!b) return;
    const a = b.dataset.h;
    if (a === 'start') { if (LIN.hra) { LIN.hra = null; obnovLin(); } else novaPriamka(); }
    else if (a === 'nova') novaPriamka();
    else if (a === 'napoveda' && LIN.hra) { LIN.hra.nap = Math.min(LIN.hra.nap + 1, TH.napovedy.length); hraKontrola(); }
  });
}
function novaPriamka() {
  // cieľ: k a q sú násobky 0,5; k ≠ 0, aby nebola vodorovná; nie totožná s aktuálnou priamkou
  let k, q;
  do { k = nahoda(-6, 6) / 2; q = nahoda(-8, 8) / 2; } while (jeNula(k) || (rovne(k, LIN.k) && rovne(q, LIN.q)));
  LIN.hra = { k, q, nap: 0, hotovo: false };
  LIN.kroky = null;
  obnovLin();
}
function hraKontrola() {
  const TH = TEXTY.lin.hra, H = LIN.hra, st = $('#lin_hraStav');
  $('[data-h="start"]').textContent = H ? TH.koniec : TH.start;
  $('[data-h="start"]').classList.toggle('primary', !H);
  $('[data-h="napoveda"]').hidden = !H; $('[data-h="nova"]').hidden = !H;
  if (!H) { st.innerHTML = LIN.skore ? `<p class="skore">${vypln(TH.skore, { n: LIN.skore })}</p>` : ''; return; }
  const okK = rovne(LIN.k, H.k), okQ = rovne(LIN.q, H.q);
  if (okK && okQ && !H.hotovo) { H.hotovo = true; LIN.skore++; LIN.G.nastav(LIN.G.krivky.map((x, i) => i === 1 ? Object.assign({}, x, { popis: 'cieľ ✔' }) : x), LIN.G.moz); }
  if (!(okK && okQ)) H.hotovo = false;
  let h = '';
  if (H.hotovo) h += `<p>${vypln(TH.uspech, { f: polyText([LIN.q, LIN.k]) })}</p>`;
  else {
    h += okQ ? `<p>${TH.qOk}</p>` : '';
    h += okK ? `<p>${TH.kOk}</p>` : '';
    if (!okQ && !okK) h += `<p>${TH.stav}</p>`;
  }
  for (let i = 0; i < H.nap && !H.hotovo; i++) h += `<p class="box zlty" style="margin:6px 0">💡 ${vypln(TH.napovedy[i], { q: cisK(H.q), k: (H.k > 0 ? '+' : '') + cisK(H.k) })}</p>`;
  h += `<p class="skore">${vypln(TH.skore, { n: LIN.skore })}</p>`;
  st.innerHTML = h;
  $('[data-h="napoveda"]').disabled = H.hotovo || H.nap >= TH.napovedy.length;
}

/* =====================================================================
   KARTA 3: KVADRATICKÁ FUNKCIA y = ax² + bx + c
   Polynóm p = [c, b, a] (rovnaká architektúra: p[i] je koeficient pri xⁱ).
   Podkarty: Kvadratická funkcia (+ hra), Čo robia koeficienty, Vrcholový tvar, Korene.
   ===================================================================== */
/* KVADRATICKÁ MATEMATIKA START */
const kvKoef = p => ({ a: p[2] || 0, b: p[1] || 0, c: p[0] || 0 });
// vrchol: x_v je koreň derivácie f'(x) = 2ax + b, teda x_v = −b/(2a); y_v = c − b²/(4a). Pri a = 0 vrchol nie je.
function vrcholKvad(p) {
  const { a, b, c } = kvKoef(p);
  if (jeNula(a)) return null;
  const d = derivative(p);                                // [b, 2a]
  const x = korenLin(d[1], d[0]).x;
  const y = c - b * b / (4 * a);

// korene; pri a = 0 sa funkcia správa ako lineárna (použije korenLin)
function korenKvad(p) {

  if (jeNula(D)) { const x = jeNula(b) ? 0 : -b / (2 * a); return { typ: 'jeden', D: 0, x1: x, x2: x, korene: [x] }; }   // rovnosť D = 0 s toleranciou 1e-9

// vrcholový tvar a(x − m)² + n → všeobecný: b = −2am, c = am² + n
const vrcholNaVseob = (a, m, n) => [a * m * m + n, -2 * a * m, a];

/* KVADRATICKÁ MATEMATIKA KONIEC */

/* ----- zápisy ----- */
const aPred = a => rovne(a, 1) ? '' : rovne(a, -1) ? '−' : cisK(a);                // 1 a −1 pred zátvorkou nepíšeme
const cinitel = (r, d = DES) => jeNula(r) ? 'x' : `(x ${r > 0 ? '−' : '+'} ${cis(Math.abs(r), d)})`;   // (x − r)
function vrcholText(a, m, n, d = 4) {
  if (jeNula(a)) return cis(n, d);
  let s = aPred(a) + (jeNula(m) ? 'x²' : cinitel(m, d) + '²');
  if (!jeNula(n)) s += (n > 0 ? ' + ' : ' − ') + cis(Math.abs(n), d);
  return s;
}
const sucinText = (a, R) => aPred(a) + (R.typ === 'jeden' ? cinitel(R.x1) + '²' : cinitel(R.x1) + cinitel(R.x2));
const zatvC = x => x < 0 ? '(' + cis(x) + ')' : cis(x);                 // zaokrúhlené záporné číslo do zátvorky
const zlHTML = (cit, men) => `<span class="zl"><span>${cit}</span><span>${men}</span></span>`;
const XV = 'x<sub>v</sub>', YV = 'y<sub>v</sub>';
const riadokK = (t, vys, op) => `<div class="r${vys ? ' vys' : ''}"><span>${t}</span>${op ? `<span class="op">${op}</span>` : ''}</div>`;
const bodText = (x, y) => `(${cis(x)}; ${cis(y)})`;
// korene → text „x₁ ≈ 1,38“ a zoznam pre sondu
function koreneZoznam(R) { return R.typ === 'jeden' || R.typ === 'dva' ? R.korene : []; }
function znackyKvad(p, R, V) {
  const zn = [{ x: 0, y: p[0], typ: 'prY', popis: `(0; ${cisK(p[0])})` }];
  if (V) zn.push({ x: V.x, y: V.y, typ: 'vrchol', popis: 'V' + bodText(V.x, V.y) });
  for (const x of koreneZoznam(R)) {
    if (V && R.typ === 'jeden') continue;                 // dvojnásobný koreň = vrchol, nekreslíme dve značky na sebe
    zn.push({ x, y: 0, typ: 'koren', popis: `x ${rovZnak(x)} ${cis(x)}` });
  }
  if (V && R.typ === 'jeden') zn[1].typ = 'koren', zn[1].popis = `V = ${TEXTY.znacky.koren} ${bodText(V.x, 0)}`;
  return zn;
}

/* ----- kreslenie: zvislá čiara (os súmernosti) a šípka ----- */
function kresliZvislu(ctx, T, obsadene, x, farba, popis) {
  const X = T.px(x); if (X < -5 || X > T.W + 5) return;
  ctx.save(); ctx.strokeStyle = farba; ctx.lineWidth = 2; ctx.setLineDash([10, 7]);
  ctx.beginPath(); ctx.moveTo(X, 0); ctx.lineTo(X, T.H); ctx.stroke(); ctx.restore();
  if (popis) umiestniPopis(ctx, T, obsadene, popis, X, 36, farba, [[8, -10], [-8 - ctx.measureText(popis).width - 12, -10], [8, 30]]);
}
function kresliSipku(ctx, T, obsadene, x1, y1, x2, y2, farba, popis) {
  const A = [T.px(x1), T.py(y1)], B = [T.px(x2), T.py(y2)];
  const d = Math.hypot(B[0] - A[0], B[1] - A[1]); if (!(d > 6) || d > 1e5) return;
  const ux = (B[0] - A[0]) / d, uy = (B[1] - A[1]) / d;
  ctx.save(); ctx.strokeStyle = farba; ctx.fillStyle = farba; ctx.lineWidth = 3.5; ctx.setLineDash([]); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0] - ux * 10, B[1] - uy * 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(B[0], B[1]); ctx.lineTo(B[0] - ux * 14 - uy * 7, B[1] - uy * 14 + ux * 7); ctx.lineTo(B[0] - ux * 14 + uy * 7, B[1] - uy * 14 - ux * 7); ctx.closePath(); ctx.fill();
  ctx.restore();
  if (popis) umiestniPopis(ctx, T, obsadene, popis, (A[0] + B[0]) / 2, (A[1] + B[1]) / 2, farba);
}

/* ---------- 3a. Kvadratická funkcia ---------- */
function initKvZaklad() {

// výpočet vrcholu po krokoch
function krokyVrcholu(a, b, c) {
  const p = [c, b, a], V = vrcholKvad(p);
  const xz = cisHTML(V.x, zlomok(-b, 2 * a)), yz = cisHTML(V.y, zlomok(4 * a * c - b * b, 4 * a));
  let h = riadokK(`${XV} = −b / (2a)`);
  h += riadokK(`${XV} = −${zatv(b)} / (2 · ${zatv(a)}) = ${cisK(-b)} / ${zatv(2 * a)}`);
  h += riadokK(`${XV} ${xz.rov} ${xz.html}`, true);
  h += riadokK(`${YV} = c − b² / (4a)`);
  h += riadokK(`${YV} = ${cisK(c)} − ${zatv(b)}² / (4 · ${zatv(a)}) = ${cisK(c)} − ${cisK(b * b)} / ${zatv(4 * a)}`);
  h += riadokK(`${YV} ${yz.rov} ${yz.html}`, true);
  const fx = evalPoly(p, V.x);
  return h + `<p style="margin:8px 0 0">${vypln(TEXTY.kvad.vrcholVys, { xv: cis(V.x), yv: cis(V.y), rov: rovZnak(fx), fx: cis(fx) })}</p>`;
}
function obnovKvZaklad() {
  const TQ = TEXTY.kvad, Z = KV.Z, p = [Z.c, Z.b, Z.a], V = vrcholKvad(p), R = korenKvad(p);

  // pri a = 0 namiesto vrcholu ukážeme výpočet koreňa lineárnej funkcie (z karty Lineárna)
  $('#kvz_kroky').innerHTML = V ? krokyVrcholu(Z.a, Z.b, Z.c) : `<p>${TQ.vrcholA0}</p>` + krokyKorena(Z.b, Z.c);
  Z.Tb.obnov();
  const zn = V ? znackyKvad(p, R, V) : [{ x: 0, y: Z.c, typ: 'prY', popis: `(0; ${cisK(Z.c)})` }, ...(R.typ === 'jeden' ? [{ x: R.x, y: 0, typ: 'koren', popis: `x ${rovZnak(R.x)} ${cis(R.x)}` }] : [])];
  zn.push(...znackaTab(Z.Tb));
  const krivky = [{ c: p, farba: FARBY.f, styl: 'plna', popis: 'f', hrubka: R.typ === 'vsetky' ? 5 : 3.5 }];

  if (Z.hra) krivky.push({ c: Z.hra.p, farba: FARBY.ciel, styl: 'ciarkovana', popis: Z.hra.hotovo ? 'cieľ ✔' : 'cieľ', hrubka: 3 });
  Z.G.nastav(krivky, {

    navrch: V ? (ctx, T, ob) => kresliZvislu(ctx, T, ob, V.x, FARBY.vrchol, vypln(TQ.osPopis, { xv: cis(V.x) })) : null

/* ----- Hra „Uhádni parabolu“: cieľ zo zadaného vrcholového tvaru, úspech = zhoda koeficientov (tolerancia 1e-9) ----- */
function initKvHra() {
  const TH = TEXTY.kvad.hra, box = $('#kvz_hraTl');
  box.innerHTML = `<button class="primary" data-kh="start">${TH.start}</button>
    <button data-kh="napoveda" hidden>${TH.napoveda}</button><button data-kh="nova" hidden>${TH.nova}</button>`;
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-kh]'); if (!b) return;
    const a = b.dataset.kh, H = KV.Z.hra;
    if (a === 'start') { if (H) { KV.Z.hra = null; obnovKvZaklad(); } else novaParabola(); }
    else if (a === 'nova') novaParabola();
    else if (a === 'napoveda' && H) { H.nap = Math.min(H.nap + 1, TH.napovedy.length); kvHraKontrola(); }
  });
}
function novaParabola() {
  // a je násobok 0,5 (a ≠ 0), m a n sú celé čísla; b a c musia byť dosiahnuteľné posuvníkmi (−6 až 6)
  const Z = KV.Z; let a, m, n, p;
  do { a = nahoda(-4, 4) / 2; m = nahoda(-3, 3); n = nahoda(-4, 4); p = vrcholNaVseob(a, m, n); }
  while (jeNula(a) || Math.abs(p[1]) > 6 || Math.abs(p[0]) > 6 || (rovne(p[2], Z.a) && rovne(p[1], Z.b) && rovne(p[0], Z.c)));
  Z.hra = { a, m, n, p, nap: 0, hotovo: false };
  obnovKvZaklad();
}
function kvHraKontrola() {

  const bStart = $('[data-kh="start"]', box), bNap = $('[data-kh="napoveda"]', box), bNova = $('[data-kh="nova"]', box);
  bStart.textContent = H ? TH.koniec : TH.start; bStart.classList.toggle('primary', !H);
  bNap.hidden = !H; bNova.hidden = !H;
  if (!H) { st.innerHTML = Z.skore ? `<p class="skore">${vypln(TH.skore, { n: Z.skore })}</p>` : ''; return; }
  const ok = { a: rovne(Z.a, H.p[2]), b: rovne(Z.b, H.p[1]), c: rovne(Z.c, H.p[0]) };
  const vsetko = ok.a && ok.b && ok.c;
  if (vsetko && !H.hotovo) { H.hotovo = true; Z.skore++; Z.G.nastav(Z.G.krivky.map(k => k.c === H.p ? Object.assign({}, k, { popis: 'cieľ ✔' }) : k), Z.G.moz); }
  if (!vsetko) H.hotovo = false;
  let h = '';
  if (H.hotovo) h += `<p>${vypln(TH.uspech, { f: polyText(H.p), v: vrcholText(H.a, H.m, H.n) })}</p>`;
  else {
    const sedi = ['a', 'b', 'c'].filter(k => ok[k]);
    h += sedi.length ? sedi.map(k => `<p>${vypln(TH.ok, { k })}</p>`).join('') : `<p>${TH.stav}</p>`;
  }
  const V = vrcholKvad([Z.c, Z.b, Z.a]), aa = Math.abs(H.a);
  const dosad = {
    m: cisK(H.m), n: cisK(H.n), mz: zatv(H.m), c: cisK(H.p[0]), a: cisK(H.a),
    tv: V ? 'V' + bodText(V.x, V.y) : '– (a = 0)',
    smer: H.a > 0 ? TH.smer.hore : TH.smer.dole, sirka: rovne(aa, 1) ? TH.sirka.rovnaky : aa > 1 ? TH.sirka.uzsi : TH.sirka.sirsi
  };
  for (let i = 0; i < H.nap && !H.hotovo; i++) h += `<p class="box zlty" style="margin:6px 0">💡 ${vypln(TH.napovedy[i], dosad)}</p>`;
  h += `<p class="skore">${vypln(TH.skore, { n: Z.skore })}</p>`;
