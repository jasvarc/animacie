/* ---------- 3b. Čo robia koeficienty: mini scény (drawGraph bez posúvania) ---------- */
// cfg: { nadpis, koef: 'a'|'b'|'c', zaklad: {a, b, c}, zaver, pevne, extra, scena: (aktuálne, pôvodné) => { krivky, znacky, navrch, text } }
function miniScena(el, cfg) {
  const TKo = TEXTY.kvad.koef;
  el.innerHTML = `<h3>${cfg.nadpis}</h3>
    <div class="stage"><canvas class="miniPl" role="img" aria-label="${cfg.nadpis}"></canvas></div>
    <p class="miniVzorec" aria-live="polite"></p>
    <div class="slm"></div>
    <p class="mini pevne"></p>${cfg.extra || ''}
    <div class="tlac"><button data-m="hraj">${TKo.prehraj}</button><button data-m="spat">${TKo.spat}</button></div>
    <p class="box pravda">${cfg.zaver}</p>`;
  const pl = $('canvas', el), out = $('.miniVzorec', el);
  const S = { k: Object.assign({}, cfg.zaklad), v0: cfg.zaklad[cfg.koef], hodn: cfg.zaklad[cfg.koef], anim: null, el };
  S.sl = posuvnik($('.slm', el), { nazov: cfg.koef, min: -6, max: 6, krok: .5, hodnota: S.hodn, zmena: v => { S.stop(); S.hodn = v; S.kresli(); } });
  let caka = false;
  S.kresli = () => { if (caka) return; caka = true; requestAnimationFrame(() => { caka = false; S.hned(); }); };
  S.hned = () => {
    const W = pl.clientWidth; if (W < 20) return;
    const s = W / 12;                                      // x od −6 po 6, rovnaká mierka
    const pov = Object.assign({}, S.k, { [cfg.koef]: S.v0 }), akt = Object.assign({}, S.k, { [cfg.koef]: S.hodn });
    const o = cfg.scena(akt, pov);
    drawGraph(pl, o.krivky, { view: { cx: 0, cy: 0, sx: s, sy: s }, znacky: o.znacky, navrch: o.navrch });
    out.innerHTML = o.text;
    $('.pevne', el).textContent = vypln(cfg.pevne, { a: cisK(S.k.a), b: cisK(S.k.b), c: cisK(S.k.c) });
  };
  // „Prehraj“: koeficient sa plynulo kýve okolo pôvodnej hodnoty (4 s, časovanie podľa skutočného času)
  S.stop = () => { S.anim = null; $('[data-m="hraj"]', el).textContent = TKo.prehraj; };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-m]'); if (!b || b.tagName === 'INPUT') return;
    if (b.dataset.m === 'spat') { S.stop(); S.hodn = S.v0; S.sl.set(S.v0); S.kresli(); return; }
    if (b.dataset.m !== 'hraj') return;
    if (S.anim) { S.stop(); return; }
    const a0 = { t0: performance.now() }; S.anim = a0; b.textContent = TKo.zastav;
    const DUR = 4000, A = cfg.koef === 'a' ? 2.5 : 4;
    const slucka = t => {
      if (S.anim !== a0) return;
      const u = MALO_POHYBU ? 1 : (t - a0.t0) / DUR;
      if (u >= 1) { S.hodn = S.v0; S.sl.set(S.v0); S.stop(); S.hned(); return; }
      S.hodn = clamp(S.v0 + A * Math.sin(2 * Math.PI * u), -6, 6); S.sl.set(S.hodn); S.hned();
      requestAnimationFrame(slucka);
    };
    requestAnimationFrame(slucka);
  });
  VSETKY_GRAFY.push(S); KV.sceny.push(S);
  return S;
}
// spoločný popis pod scénou: vzorec a vrchol
function textSceny(p, V) {
  const TKo = TEXTY.kvad.koef;
  return V ? `y = <b>${polyText(p)}</b><br>${vypln(TKo.vrchol, { x: cis(V.x), y: cis(V.y) })}` : `y = <b>${polyText(p)}</b><br>${vypln(TKo.priamka, { f: polyText(p) })}`;
}
// spoločné krivky: aktuálna (plná) a pôvodná (sivá bodkovaná)
const kvKrivky = (p, p0) => [{ c: p, farba: FARBY.f, styl: 'plna', popis: 'f' }, { c: p0, farba: FARBY.siva, styl: 'bodkovana', popis: TEXTY.kvad.povodna, hrubka: 3 }];
const kvVrcholZn = (V, V0) => [...(V0 ? [{ x: V0.x, y: V0.y, typ: 'bod', farba: FARBY.siva }] : []), ...(V ? [{ x: V.x, y: V.y, typ: 'vrchol' }] : [])];
// scéna a: vrchol sa pohybuje po priamke y = c + b·x/2 (pre b ≠ 0)
function scenaA(k, z) {
  const p = [k.c, k.b, k.a], p0 = [z.c, z.b, z.a], V = vrcholKvad(p), V0 = vrcholKvad(p0), kr = kvKrivky(p, p0);
  if (!jeNula(k.b)) { const hr = Math.abs(k.b) / 12; kr.push({ f: x => Math.abs(x) >= hr - 1e-9 ? k.c + k.b * x / 2 : NaN, farba: FARBY.vrchol, styl: 'ciarkovana', hrubka: 2, popis: TEXTY.kvad.koef.drahaV }); }

// scéna b: dotyčnica v (0; c) má sklon f'(0) = b; vrchol sa pohybuje po parabole y = c − a·x²
function scenaB(k, z) {

/* =====================================================================
   ČASŤ 3 – SPOLOČNÁ MATEMATIKA PRE STUPNE 1 AŽ 5
   ===================================================================== */
/* REÁLNE KORENE START */
const TOL_KOREN = 1e-9;
// realRoots(c): všetky reálne korene polynómu, zoradené, s násobnosťou: [{ x, nas }]
//  1. Korene derivácie (rekurzívne tou istou funkciou) rozdelia os x na intervaly, kde je f monotónna.
//  2. V každom takom intervale je najviac jeden jednoduchý koreň – nájde ho delenie intervalu (ak sa mení znamienko).
//  3. Ak je v koreni derivácie |f| ≤ 1e-9, graf sa osi x dotýka → viacnásobný koreň (násobnosť = násobnosť v derivácii + 1).
//  Počiatočný interval (−B; B) dáva Cauchyho odhad B = 1 + max |cᵢ / cₙ|. Nulový polynóm → null (koreňom je každé x).
function realRoots(c) {
  const st = degree(c);
  if (st < 0) return null;
  if (st === 0) return [];
  const p = c.slice(0, st + 1);
  if (st === 1) { const x = -p[0] / p[1]; return [{ x: jeNula(x) ? 0 : x, nas: 1 }]; }
  let B = 0;
  for (let i = 0; i < st; i++) B = Math.max(B, Math.abs(p[i] / p[st]));
  B += 1;
  const f = x => evalPoly(p, x), vysl = [], body = [-B];
  for (const r of realRoots(derivative(p)) || []) {
    if (r.x <= -B || r.x >= B) continue;
    if (Math.abs(f(r.x)) <= TOL_KOREN) vysl.push({ x: jeNula(r.x) ? 0 : r.x, nas: r.nas + 1 });   // dotyk osi x
    body.push(r.x);
  }
  body.push(B);
  for (let i = 0; i + 1 < body.length; i++) {
    let a = body[i], b = body[i + 1], fa = f(a);
    const fb = f(b);
    if (Math.abs(fa) <= TOL_KOREN || Math.abs(fb) <= TOL_KOREN || fa * fb > 0) continue;   // bez zmeny znamienka (koreň v kraji je už zapísaný)
    for (let k = 0; k < 200; k++) {                       // delenie intervalu až po presnosť čísel v počítači
      const s = (a + b) / 2; if (s <= a || s >= b) break;
      const fs = f(s);
      if (fs === 0) { a = b = s; break; }
      if ((fs < 0) === (fa < 0)) { a = s; fa = fs; } else b = s;
    }
    const x = (a + b) / 2;
    vysl.push({ x: jeNula(x) ? 0 : x, nas: 1 });
  }
  return vysl.sort((u, v) => u.x - v.x);
}
/* REÁLNE KORENE KONIEC */

// súčin polynómov (roznásobenie zátvoriek)
function polyMul(p, q) {
  const r = new Array(p.length + q.length - 1).fill(0);
  for (let i = 0; i < p.length; i++) for (let j = 0; j < q.length; j++) r[i + j] += p[i] * q[j];
  return r;
}
// správanie na okrajoch: kam ide ľavý a pravý koniec grafu (+1 nahor, −1 nadol)
function konce(p) {
  const st = degree(p); if (st < 1) return null;
  const pravy = Math.sign(p[st]), lavy = st % 2 ? -pravy : pravy;
  return { lavy, pravy, kluc: `${lavy > 0 ? 'hore' : 'dole'},${pravy > 0 ? 'hore' : 'dole'}` };
}
// analýza polynómu: korene, lokálne extrémy (korene f′ nepárnej násobnosti), inflexné body (korene f″ nepárnej násobnosti)
function analyzaPoly(c) {
  const st = degree(c), p = c.slice(0, Math.max(st, 0) + 1);
  if (st < 0) return { st, p: [0], korene: null, extremy: [], inflexie: [] };
  const korene = realRoots(p), d1 = derivative(p), d2 = derivative(d1), extremy = [], inflexie = [];
  if (st >= 2) for (const r of realRoots(d1)) if (r.nas % 2 === 1) {
    const y = evalPoly(p, r.x);
    let s = evalPoly(d2, r.x);
    if (Math.abs(s) < 1e-9) s = evalPoly(p, r.x + 1e-3) + evalPoly(p, r.x - 1e-3) - 2 * y;   // vyšší rád – rozhodne okolie
    extremy.push({ x: r.x, y, typ: s < 0 ? 'max' : 'min' });
  }
  if (st >= 3) for (const r of realRoots(d2)) if (r.nas % 2 === 1) inflexie.push({ x: r.x, y: evalPoly(p, r.x) });

// diskriminant kubickej funkcie p = [d, c, b, a]
function diskriminantKub(p) {
  const d = p[0] || 0, c = p[1] || 0, b = p[2] || 0, a = p[3] || 0;
  return 18 * a * b * c * d - 4 * b * b * b * d + b * b * c * c - 4 * a * c * c * c - 27 * a * a * d * d;
}
// jeden krok delenia intervalu; st = { l, r, fl, fr }
function krokBisekcie(p, st) {
  const s = (st.l + st.r) / 2, fs = evalPoly(p, s);
  if (fs === 0) return { l: s, r: s, fl: 0, fr: 0, s, fs, pon: 'presne' };
  if ((fs < 0) === (st.fl < 0)) return { l: s, r: st.r, fl: fs, fr: st.fr, s, fs, pon: 'r' };   // znamienko sa mení v [s; r]
  return { l: st.l, r: s, fl: st.fl, fr: fs, s, fs, pon: 'l' };                                 // znamienko sa mení v [l; s]

// celé delenie intervalu, kým je šírka ≥ tol
function bisekcia(p, l, r, tol = 0.001) {
  const fl = evalPoly(p, l), fr = evalPoly(p, r);
  if (fl === 0 || fr === 0) return { stav: 'kraj', x: fl === 0 ? l : r, fl, fr, kroky: [] };
  if (fl * fr > 0) return { stav: 'rovnake', fl, fr, kroky: [] };
  let st = { l, r, fl, fr };
  const kroky = [];
  while (st.r - st.l >= tol) { st = krokBisekcie(p, st); kroky.push(st); if (st.pon === 'presne') break; }
  const x = (st.l + st.r) / 2;
  return { stav: 'ok', kroky, x, fx: evalPoly(p, x), fl, fr };
}

/* ----- spoločné zápisy a kreslenie pre stupne 3 až 5 ----- */
const SPODNE = '₀₁₂₃₄₅₆₇₈₉';
const korenText = r => `x ${rovZnak(r.x)} ${cis(r.x)}` + (r.nas > 1 ? ` (${r.nas}×)` : '');

function znackyPoly(A) {
  const zn = [], K = A.korene || [];
  const naKoreni = (x, y) => Math.abs(y) < 1e-9 && K.some(r => Math.abs(r.x - x) < 1e-6);

  for (const e of A.extremy) if (!naKoreni(e.x, e.y)) zn.push({ x: e.x, y: e.y, typ: 'extrem', popis: (e.typ === 'max' ? 'max ' : 'min ') + bodText(e.x, e.y) });
  for (const i of A.inflexie) if (!naKoreni(i.x, i.y)) zn.push({ x: i.x, y: i.y, typ: 'inflex', popis: 'I' + bodText(i.x, i.y) });
  for (const r of K) zn.push({ x: r.x, y: 0, typ: 'koren', popis: korenText(r) });

// šípky pri okrajoch plátna: kam idú konce grafu (ob = null → bez popiskov, pre malé grafy)
function kresliKonce(ctx, T, ob, p) {

// súčinový tvar a jeho overenie postupným roznásobením (ak má polynóm stupňa n práve n reálnych koreňov s násobnosťou)
function sucinHTML(A) {
  const P = TEXTY.poly;
  if (A.st < 1) return `<p>${A.st < 0 ? P.nulovy : P.sucinNie.replace('{st}', 0)}</p>`;
  if (sumaNas(A.korene) !== A.st) return `<p>${vypln(P.sucin, { st: A.st })}</p><p class="box omyl">${vypln(P.sucinNie, { st: A.st })}</p>`;
  const lead = A.p[A.st], pr = A.korene.every(r => presne(r.x)), zn = pr ? '=' : '≈';
  const K = A.korene.slice().sort((u, v) => (jeNula(u.x) ? -1 : 0) - (jeNula(v.x) ? -1 : 0));   // činiteľ x píšeme prvý: x(x + 2)(x − 2)
  const zapis = aPred(lead) + K.map(r => cinitel(r.x) + (r.nas > 1 ? hornyIndex(r.nas) : '')).join('');
  const vsetky = []; K.forEach(r => { for (let j = 0; j < r.nas; j++) vsetky.push(r.x); });
  let h = `<p>${vypln(P.sucin, { st: A.st })}</p><div class="vzorec">y ${zn} ${zapis}</div><p class="mini">${P.overenie}</p><div class="kroky">`;
  let suc = [-vsetky[0], 1];
  for (let i = 1; i < vsetky.length; i++) {
    suc = polyMul(suc, [-vsetky[i], 1]);
    // medzivýsledky; posledný súčin (už aj s a) je v zvýraznenom riadku nižšie
    if (i < vsetky.length - 1 || !rovne(lead, 1)) h += riadokK(`${vsetky.slice(0, i + 1).map(x => cinitel(x)).join('')} ${zn} ${polyText(suc.map(v => Math.round(v * 1e4) / 1e4))}`);
  }

  h += riadokK(`${aPred(lead)}${vsetky.map(x => cinitel(x)).join('')} ${zn} ${polyText(rozv.map(v => Math.round(v * 1e4) / 1e4))} ${ok ? '✔' : ''}`, true);

// malý graf bez posúvania (typy, okraje, omyly, kvíz); data() → { krivky, znacky, navrch, rozsah, cx, cy, ypol }

    DL.kroky.map((s, i) => `<tr><td>${i + 1}</td><td>${cis(s.s, 5)}</td><td>${cis(s.fs, 4)} (${znak(s.fs)})</td><td>${TD.ponechaj[s.pon]}</td><td>${cis(s.l, 5)}</td><td>${cis(s.r, 5)}</td><td>${cis(s.r - s.l, 5)}</td></tr>`).join('') + '</tbody>';
  // graf: pás intervalu, kraje so znamienkami, posledný stred

  DL.G.nastav([{ c: p, farba: FARBY.f, styl: 'plna', popis: 'f' }], {
    znacky: zn, korene: (A.korene || []).map(r => r.x), rovnakaMierka: false, dolezite: [DL.l, DL.r],
    navrch: (ctx, T) => {
      let l = DL.st.l, r = DL.st.r;
      if (DL.anim) { const t = ease(clamp((performance.now() - DL.anim.t0) / 500, 0, 1)); l = DL.anim.od.l + (l - DL.anim.od.l) * t; r = DL.anim.od.r + (r - DL.anim.od.r) * t; }
      if (delStav() === 'zle') return;
      const X1 = T.px(l), X2 = T.px(r), cerv = delStav() === 'rovnake';

      ctx.beginPath(); ctx.moveTo(X1, 0); ctx.lineTo(X1, T.H); ctx.moveTo(X2, 0); ctx.lineTo(X2, T.H); ctx.stroke();
    }

}

/* ---------- 6c. Kvíz: otázky sa generujú náhodne, správna odpoveď sa vždy vypočíta ---------- */
const KZ = { u: 1, otazky: [], mini: [], body: 0, zodp: 0 };
const vyberZ = a => a[Math.floor(Math.random() * a.length)];
function zamiesaj(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
const nenula = (a, b) => { let x; do { x = nahoda(a, b); } while (x === 0); return x; };
const vzorkyX = [-2.3, -0.7, 0.4, 1.9, 3.1];
const rozne = (p, q) => vzorkyX.some(x => Math.abs(evalPoly(p, x) - evalPoly(q, x)) > 1e-6);
// prvý chybný krok: kroky majú buď sol (riešenie rovnice v tom kroku), alebo ok (kontrola dosadením)
function prvaChyba(kroky) {
  for (let i = 1; i < kroky.length; i++) {
    const k = kroky[i];
    if ('ok' in k ? !k.ok : Math.abs(k.sol - kroky[i - 1].sol) > 1e-9) return i;
  }
  return 0;
}
// ako sa zmenil graf p0 → p1 (vypočíta sa z polynómov, nie je zapísané pri otázke)
function klasifikujZmenu(p0, p1) {
  const n = Math.max(p0.length, p1.length), d = [];
  for (let i = 0; i < n; i++) d.push((p1[i] || 0) - (p0[i] || 0));
  if (degree(d) === 0) return { k: d[0] > 0 ? 'hore' : 'dole', d: Math.abs(d[0]) };
  if (degree(p0) === 1 && degree(p1) === 1) return { k: 'sklon', a0: p0[1], a1: p1[1] };
  const V0 = vrcholKvad(p0), V1 = vrcholKvad(p1);
  if (V0 && V1) {
    if (rovne(p0[2], p1[2]) && rovne(V0.y, V1.y)) return { k: V1.x > V0.x ? 'doprava' : 'dolava', d: Math.abs(V1.x - V0.x), x0: V0.x, x1: V1.x };
    if (rovne(V0.x, V1.x) && rovne(V0.y, V1.y)) return { k: p0[2] * p1[2] < 0 ? 'preklopi' : Math.abs(p1[2]) > Math.abs(p0[2]) ? 'uzsia' : 'sirsia', a0: p0[2], a1: p1[2] };
  }
  return { k: 'ine' };
}
// nezávislá kontrola zmeny dosadzovaním
function overZmenu(p0, p1, Z) {
  const f0 = x => evalPoly(p0, x), f1 = x => evalPoly(p1, x);
  if (Z.k === 'hore' || Z.k === 'dole') { const d = Z.k === 'hore' ? Z.d : -Z.d; return vzorkyX.every(x => Math.abs(f1(x) - f0(x) - d) < 1e-9); }
  if (Z.k === 'doprava' || Z.k === 'dolava') { const h = Z.k === 'doprava' ? Z.d : -Z.d; return vzorkyX.every(x => Math.abs(f1(x) - f0(x - h)) < 1e-9); }
  if (Z.k === 'sklon') return degree(p0) === 1 && degree(p1) === 1 && rovne(p0[0], p1[0]) && !rovne(p0[1], p1[1]);
  const V = vrcholKvad(p0), r = vzorkyX.filter(x => Math.abs(x - V.x) > .1).map(x => (f1(x) - V.y) / (f0(x) - V.y));
  if (!r.every(q => Math.abs(q - r[0]) < 1e-9)) return false;
  return Z.k === 'uzsia' ? r[0] > 1 : Z.k === 'sirsia' ? r[0] > 0 && r[0] < 1 : Z.k === 'preklopi' ? r[0] < 0 : false;
}
// parabolu s celočíselným vrcholom zapíšeme vo vrcholovom tvare (zmena m alebo n je tak viditeľná), inak všeobecne
function textFunkcie(p) {
  if (degree(p) !== 2) return polyText(p);
  const W = vseobNaVrchol(p);
  return JE_CELE(W.m) && JE_CELE(W.n) ? vrcholText(W.a, W.m, W.n) : polyText(p);
}

const GEN_KVIZ = {
  // koreň lineárnej funkcie (číslo)
  korenLin(u) {
    const TQ = TEXTY.kviz.q; let k, q;
