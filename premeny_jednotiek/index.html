input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:rgba(255,255,255,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--gold);border:3px solid #1a0e02;box-shadow:0 0 0 2px var(--gold)}
input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--gold);border:3px solid #1a0e02}
.skPasObal{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 6px;margin:6px 0}
.skPas{display:flex;gap:3px;min-width:max-content}
.skPas .bk{width:44px;min-height:64px;border-radius:8px;border:2px dashed rgba(140,160,215,.25);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 0;font-size:16px;color:var(--muted);cursor:pointer;background:transparent}
.skPas .bk.ma{border-style:solid;border-color:rgba(111,180,255,.5);color:var(--text);background:rgba(111,180,255,.08)}
.skPas .bk .z{font-size:19px;font-weight:700;color:var(--blue)}
.skPas .bk.akt{border:3px solid var(--gold);background:rgba(243,180,83,.22);color:var(--gold2)}
.skPas .bk.akt .z{color:var(--gold2)}
.skInfo{min-height:7.2em;font-size:18px}
.skInfo .velke{font-size:30px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* ===== Veľké a malé písmená ===== */
.pary{display:grid;gap:10px;margin:8px 0}
.par{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.par>div{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:16px}
.par .pz{font-size:30px;line-height:1;color:var(--gold2);min-width:1.6em;text-align:center}
@media (max-width:520px){.par{grid-template-columns:1fr}}
.demo{padding:12px;border-radius:12px;border:1px solid rgba(243,180,83,.4);background:rgba(243,180,83,.06);margin-top:10px}
.demo .vel{font-size:26px;font-weight:700;text-align:center;margin:8px 0;overflow-wrap:anywhere;transition:transform .25s}
.demo .vel.skok{transform:scale(1.08)}
.demo .vel b{color:var(--gold2)}
.demo .pom{text-align:center;font-size:17px}

/* ===== Pravidlá zápisu ===== */
.prav{display:grid;gap:8px;margin:8px 0}
.prav .r{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center;font-size:16px}
.prav .ok,.prav .zl{font-size:19px;padding:4px 10px;border-radius:8px;white-space:nowrap;min-width:6.5em}
.prav .ok{background:rgba(127,220,143,.12);border:2px solid var(--green)}
.prav .zl{background:rgba(255,122,107,.1);border:2px dashed var(--red);text-decoration:line-through;text-decoration-color:var(--red)}
.prav .ok::before{content:'✓ ';color:var(--green);font-weight:800;font-family:system-ui,sans-serif}
.prav .zl::before{content:'✗ ';color:var(--red);font-weight:800;font-family:system-ui,sans-serif;display:inline-block;text-decoration:none}
@media (max-width:560px){.prav .r{grid-template-columns:1fr 1fr}.prav .r span:last-child{grid-column:1/-1}}
ul.zvedL{margin:6px 0 10px;padding-left:22px}
ul.zvedL li{margin:3px 0}

/* ===== Kvízové otázky ===== */
.otazka{padding:12px 0}
.otazka .q{font-size:20px;margin-bottom:10px}
.otazka .por{color:var(--muted);font-size:16px}
.moznosti{display:flex;flex-wrap:wrap;gap:8px}
.moznosti button{min-height:52px;font-size:19px;min-width:110px;flex:1 1 120px}
.moznosti button.ok{background:rgba(127,220,143,.2);border-color:var(--green);color:#d7ffdf;opacity:1}
.moznosti button.ok::before{content:'✓ '}
.moznosti button.zle{background:rgba(255,122,107,.2);border-color:var(--red);color:#ffe0dc;opacity:1}
.moznosti button.zle::before{content:'✗ '}
.fb{margin-top:10px;font-size:17px;min-height:1.5em}
.fb.ok>b:first-child{color:var(--green)}.fb.zle>b:first-child{color:var(--red)}
.skore{font-size:19px;margin:12px 0 0}
.skore b{color:var(--gold2)}
.pokrok{height:12px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0}
.pokrok>div{height:100%;background:linear-gradient(90deg,#f3b453,#ffd88a);width:0;transition:width .4s}

/* ===== Rebríky ===== */
.rebriky{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}
.rebrik{display:flex;flex-direction:column;align-items:stretch}
.pricka{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;text-align:left;border-radius:12px;border:2px solid rgba(140,160,215,.3);background:rgba(255,255,255,.05);position:relative}
.pricka svg{flex:none}
.pricka .jed{font-size:22px;min-width:2.2em}
.pricka .nazov{color:var(--muted);font-size:16px}
.pricka .znak{margin-left:auto;font-size:16px;font-weight:800;border-radius:6px;padding:0 8px}
.pricka.z{border-color:var(--gold);background:rgba(243,180,83,.18)}
.pricka.z .znak{background:var(--gold);color:#1a0e02}
.pricka.na{border:2px dashed var(--blue);background:rgba(111,180,255,.16)}
.pricka.na .znak{background:var(--blue);color:#061224}
.pricka.cesta:not(.z):not(.na){border-color:rgba(243,180,83,.5)}
.pricka.nove{animation:vlet .4s ease-out}
@keyframes vlet{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
.krok{display:flex;justify-content:space-between;align-items:center;padding:2px 10px;font-size:16px;font-variant-numeric:tabular-nums;position:relative;min-height:38px}
.krok::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:rgba(140,160,215,.3)}
.krok span{background:#0c1322;padding:0 4px;position:relative;border-radius:6px}
.krok .hore{color:var(--blue)}
.krok .dole{color:var(--gold2)}
.krok.cesta::before{background:var(--gold)}
.krok.cesta.dolu .dole,.krok.cesta.hor .hore{font-weight:800;outline:2px solid currentColor;outline-offset:1px}

/* ===== Prevodník ===== */
.pz{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.pz label{display:flex;flex-direction:column;gap:4px;font-size:16px;color:var(--muted)}
input.txt{height:50px;font:inherit;font-size:21px;font-weight:700;padding:0 12px;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;width:100%;max-width:230px;font-variant-numeric:tabular-nums}
input.txt.zle{border-color:var(--red)}
select{height:50px;font:inherit;font-size:18px;color:var(--text);background:#121a2e;border:1px solid var(--line);border-radius:10px;padding:0 10px;max-width:100%;min-width:9em}
select option,select optgroup{background:#121a2e;color:var(--text)}
.hlaska{color:var(--red);font-size:17px;margin:8px 0 0;min-height:1.5em}
.retaz{font-size:24px;font-weight:700;margin:10px 0 6px;line-height:1.45;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.retaz b{color:var(--gold2)}
.intu{font-size:17px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.04);border-left:4px solid var(--gold);margin:6px 0}
.intu .op{display:inline-block;font-weight:800;border-radius:6px;padding:0 8px;margin-right:8px;font-size:16px}
.intu .op.nas{background:var(--gold);color:#1a0e02}
.intu .op.del{background:var(--blue);color:#061224}
.cestaTxt{font-size:17px;overflow-wrap:anywhere}
.cestaTxt .s{color:var(--muted);white-space:nowrap}
.radyObal{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;background:#08101c;padding:8px 6px;margin:6px 0}
.rady{position:relative;height:118px;margin:0 auto}
.rady .rk{position:absolute;top:0;bottom:0;border-left:1px solid rgba(140,160,215,.12)}
.rady .rk.j{background:rgba(243,180,83,.08)}
.rady .rh{position:absolute;top:2px;font-size:16px;color:var(--muted);text-align:center}
.rady .rjed{position:absolute;bottom:2px;font-size:16px;color:var(--gold);text-align:center}
.rady .cf,.rady .nl{position:absolute;top:36px;font-size:36px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;will-change:transform,opacity;line-height:1.2}
.rady .cf{color:var(--text)}
.rady .nl{color:var(--muted)}
.rady .ci{position:absolute;top:36px;font-size:36px;font-weight:800;color:var(--gold2);line-height:1.2}
.rady .zn{position:absolute;top:36px;font-size:36px;font-weight:800;line-height:1.2}
.stage{border-radius:10px;background:#08101c;overflow:hidden;position:relative}
.stage canvas{display:block;width:100%;touch-action:manipulation}
.info{font-size:17px;margin:8px 2px 0;min-height:1.6em;font-variant-numeric:tabular-nums}
.info b{color:var(--gold2)}

/* ===== Malé dĺžky: stupnica rádov ===== */
.stup{display:grid;grid-template-columns:auto 1fr;gap:0 12px;margin:8px 0}
.stup .t{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;min-height:30px}
.stup .t::after{content:'';width:18px;height:3px;background:var(--muted);border-radius:2px}
.stup .os{border-left:3px solid rgba(140,160,215,.35);margin-left:4px;min-height:30px;padding:4px 0 4px 12px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stup .os .del{color:var(--muted)}
.stup .vec{padding:4px 10px;border-radius:8px;border:2px solid var(--violet);background:rgba(185,163,255,.12)}
.stup .t .vec{font-weight:400;white-space:normal}
.stup .t .lbl{min-width:4.5em;text-align:right}

/* ===== Hra Prevod ===== */
.uloha{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:24px;font-weight:700;margin:10px 0}
.uloha input.txt{max-width:260px}
.fb .post{display:block;margin-top:6px;font-size:17px;font-weight:400;overflow-wrap:anywhere}

/* ===== Zarovnané rebríky: jedna mriežka, rovnaký rád = rovnaký riadok ===== */
.zarovnane{display:grid;column-gap:14px;margin:6px 0}
.zarovnane .rebrik{display:contents}
.zarovnane h3{margin:0 0 6px;align-self:end}
.zarovnane .pricka{align-self:center;flex-wrap:wrap;row-gap:0}
.zarovnane .pricka.nove{animation:vsun .45s ease-out}
@keyframes vsun{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.zarovnane .krok{min-height:30px}
.zarovnane .krok span{white-space:nowrap}
.zarovnane .hKr{display:none}
.zrStitok{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right;color:var(--muted);font-size:16px;line-height:1.15;padding-right:2px}
.zrStitok b{font-size:20px;color:var(--violet)}
@media (max-width:560px){
  .zarovnane{column-gap:8px}
  .zrStitok small{display:none}
  .zarovnane .pricka{padding:6px 8px;gap:6px}
  .zarovnane .krok{flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:2px 0}
}
@media (max-width:760px){
  .zarovnane.uzke .pricka .nazov,.zarovnane.uzke .pricka svg,.zarovnane.uzke h3 .hDl:not(:only-child){display:none}
  .zarovnane.uzke .hKr{display:block;text-align:center;font-size:20px;color:var(--text);letter-spacing:0;text-transform:none}
  .zarovnane.uzke .pricka{padding:6px;gap:4px;justify-content:center}
  .zarovnane.uzke .pricka .jed{font-size:19px;min-width:0}
  .zarovnane.uzke .pricka .znak{margin-left:0;padding:0 4px}
  .zarovnane.uzke .krok{flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:2px 0}
}

/* ===== Časť 2: plocha, objem, neštandardné jednotky, prax ===== */
.pricka .rov{font-size:16px;color:var(--violet);white-space:nowrap}
.vysv{font-size:17px;padding:8px 12px;border-radius:10px;background:rgba(185,163,255,.08);border-left:4px solid var(--violet);margin:6px 0;overflow-wrap:anywhere}
.viz{display:block;width:100%;max-width:360px;height:auto;margin:8px auto}
.viz text{font:16px system-ui,sans-serif;fill:var(--text)}
.viz text.m{fill:var(--muted)}
.viz text.g{fill:var(--gold2)}
ul.vztahy{list-style:none;padding:0;margin:6px 0}
ul.vztahy li{padding:4px 10px;margin:4px 0;border-radius:8px;background:rgba(255,255,255,.04);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
dl.popis{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px;margin:10px 0}
dl.popis dt{color:var(--muted)}
dl.popis dd{margin:0}
.card h2 svg{vertical-align:middle}
.vypocet{margin:8px 0;font-size:18px;font-variant-numeric:tabular-nums}
.vypocet>div{padding:5px 10px;border-radius:8px;overflow-wrap:anywhere}
.vypocet>div:nth-child(odd){background:rgba(255,255,255,.04)}
.vypocet b{color:var(--gold2)}
.posuvniky .seg .mini{margin:0 6px 0 0}
@media (max-width:520px){dl.popis{grid-template-columns:1fr}dl.popis dd{margin-bottom:6px}}

/* ===== Časť 3: čas, rýchlosť, hustota, energia, elektrina, teplota ===== */
.hms{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:6px 0}
.hms label,.hmsR{display:flex;align-items:center;gap:6px;font-size:20px}
.hms label:has(#desLbl){flex-direction:column;align-items:flex-start;gap:4px}
input.txt.kr{max-width:96px;text-align:center}
.retazZl{font-size:22px;line-height:2.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;padding:8px 10px;border-radius:10px;background:#08101c}
.retazZl .zlomok{font-weight:600;margin:0 .15em}
.retazZl .ru{display:inline-block;font-family:Verdana,"DejaVu Sans","Segoe UI",sans-serif;font-weight:700;transition:opacity .35s,color .35s}
.retazZl .ru.skrt{color:var(--red);text-decoration:line-through;text-decoration-thickness:3px;opacity:.55}
.retazZl .rkon{transition:opacity .3s}
.retazZl .rkon b{color:var(--gold2)}
.priklady{display:flex;flex-direction:column;gap:8px}
.priklady button{text-align:left;display:flex;flex-direction:column;gap:2px;font-size:18px;font-variant-numeric:tabular-nums}
.priklady button b{color:var(--gold2)}
.priklady button small{font-size:16px;color:var(--muted)}
table.husTab td.pas{width:40%;min-width:90px}
table.husTab td.pas i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,#6fb4ff,#b9a3ff)}
table.husTab tbody tr{cursor:default}
.viz.tepl{max-width:340px}

/* ===== Časť 4: kalkulačka, omyly, kvíz ===== */
.omylyKarty{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:12px}
.omylK{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.omylHl{display:flex;gap:8px;font-size:19px;font-weight:700}
.omylHl .cis{color:var(--muted)}
.omylK .zleC{color:var(--red);transition:opacity .3s}
.omylK .zleC.pre{text-decoration:line-through;text-decoration-thickness:3px;opacity:.6}
.omylK .oprava{opacity:0;max-height:0;overflow:hidden}
.omylK .oprava .spr{color:var(--green);font-weight:700;font-size:18px;margin:4px 0}
.omylK .omB{align-self:flex-start}
.kvVstup{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:20px}
.kvVstup input{max-width:240px}
.moznosti.stlp{flex-direction:column}
.moznosti.stlp button{text-align:left;flex:none}

footer{color:var(--muted);text-align:center;font-size:16px;padding:20px 0 10px}
#testy{margin-top:16px;font-size:16px}
#testy table{border-collapse:collapse;width:100%}
#testy td{border-bottom:1px solid var(--line);padding:4px 8px;vertical-align:top;overflow-wrap:anywhere}
#testy td.ok{color:var(--green)}#testy td.zle{color:var(--red)}

<body>
<div class="wrap">
<header class="top"><h1 data-t="titul"></h1><p class="sub" data-t="podtitul"></p></header>
<div class="lista"><button id="menuBtn" aria-expanded="false" aria-controls="menuPanel"></button><span class="akt" id="aktNazov"></span></div>
<nav id="menuPanel" hidden></nav>

<!-- =================== KARTA: PREDPONY (časť 1) =================== -->
<section id="predpony" data-karta hidden>
  <div class="mriezka">
    <div class="card">
        <h2 data-t="pred.nadpis"></h2>
        <p data-t="pred.uvod"></p>
        <div class="tabObal"><table class="pred"><thead><tr id="predHlav"></tr></thead><tbody id="predTab"></tbody></table></div>
        <p class="mini" data-t="pred.tabPozn"></p>
        <div class="box omyl"><b class="h" data-t="pred.teraNadpis"></b><p data-t="pred.tera"></p></div>
    </div>
    <div class="dva">
        <div class="card">
          <h2 data-t="pred.skNadpis"></h2>
          <p data-t="pred.skUvod"></p>
          <div class="sl"><div class="lbl"><span data-t="pred.skLbl"></span><b id="skE"></b></div>
            <div class="slRiadok"><button id="skMinus" aria-label="menej">−</button><input type="range" id="skR" min="-9" max="9" step="1" value="3" aria-label="mocnina desiatky"><button id="skPlus" aria-label="viac">+</button></div></div>
          <div class="skPasObal"><div class="skPas" id="skPas"></div></div>
          <div class="skInfo" id="skInfo" aria-live="polite"></div>
        </div>
        <div class="card">
          <h2 data-t="pred.pisNadpis"></h2>
          <p data-t="pred.pisUvod"></p>
          <div class="pary" id="pisPary"></div>
          <div class="demo">
            <b data-t="pred.demoNadpis"></b>
            <div class="seg"><button id="demoM" class="on"></button><button id="demoMM"></button></div>
            <div class="vel" id="demoVel" aria-live="polite"></div>
            <div class="pom" id="demoPom"></div>
          </div>
        </div>
    </div>
    <div class="dva">
      <div class="card">
        <h2 data-t="pred.pravNadpis"></h2>
        <div class="prav" id="pravidla"></div>
        <div class="box info"><b class="h" data-t="pred.litNadpis"></b><p data-t="pred.lit"></p></div>
      </div>
      <div class="card">
        <h2 data-t="pred.hraNadpis"></h2>
        <p data-t="pred.hraUvod"></p>
        <div class="pokrok"><div id="phPokrok"></div></div>
        <div id="phOtazka" class="otazka"></div>
        <div class="tlac"><button id="phNova"></button></div>
      </div>
    </div>
    <details class="zved"><summary data-t="pred.zvedNadpis"></summary><p data-t="pred.zvedUvod"></p><ul class="zvedL" id="zvedL"></ul></details>
  </div>
</section>

<!-- =================== KARTA: DĹŽKA A HMOTNOSŤ (časť 1) =================== -->
<section id="dlzka" data-karta hidden>
  <div class="mriezka">
    <div class="dva">
      <div class="card">
        <h2 data-t="dlz.nadpis"></h2>
        <p data-t="dlz.uvod"></p>
        <p class="mini" data-t="dlz.rebrikKlik"></p>
        <p class="mini" data-t="dlz.zarovnanie"></p>
        <div class="zarovnane" id="rbDlzHm"></div>
        <div class="tlac"><button id="rbRozsir" aria-expanded="false"></button></div>
        <p class="mini" id="rbRozsirPozn" data-t="dlz.rozsirPozn" hidden></p>
      </div>
      <div class="card">
        <h2 data-t="dlz.pzNadpis"></h2>
        <div class="pz">
          <label><span data-t="dlz.pzHodnota"></span><input class="txt" id="pzH" value="3,5" autocomplete="off" spellcheck="false" enterkeyhint="go"></label>
          <label><span data-t="dlz.pzZ"></span><select id="pzZ"></select></label>
          <button id="pzVymen"></button>
          <label><span data-t="dlz.pzNa"></span><select id="pzNa"></select></label>
          <button id="pzGo" class="primary"></button>
        </div>
        <p class="hlaska" id="pzChyba" aria-live="polite"></p>
        <div id="pzVys" aria-live="polite"></div>
        <div id="pzAnim">
          <h3 data-t="dlz.radyNadpis"></h3>
          <div class="radyObal"><div class="rady" id="pzRady"></div></div>
          <p class="mini" id="pzRadyTxt"></p>
          <div class="tlac"><button id="pzRadyZnova"></button></div>

const cesta = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const velkePrve = s => s.charAt(0).toUpperCase() + s.slice(1);
const nahoda = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const vyber = a => a[Math.floor(Math.random() * a.length)];
const zamiesaj = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const bezPohybu = matchMedia('(prefers-reduced-motion: reduce)');
const NBSP = ' ';
const HORNE_IND = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻', '+': '⁺' };

/* Animácia podľa skutočného času: krok(p) dostane p od 0 do 1. */
function animuj(trvanie, krok, hotovo) {

/* =====================================================================

    const s = N.toString().padStart(k + 1, '0');
    const cel = s.slice(0, s.length - k), des = s.slice(s.length - k);
    return (a.n < 0n ? '−' : '') + zoskup(cel) + (des ? ',' + des : '');
  }
  // obyčajné desatinné číslo, najviac maxSig platných číslic, nuly na konci odstránené
  function toDecimalString(a, maxSig = 12) {
    if (a.n === 0n) return { text: '0', presne: true };
    const r = roundSig(a, maxSig);
    const s = r.m.toString().replace(/0+$/, ''), p = r.e + 1;
    let cel, des;
    if (p <= 0) { cel = '0'; des = '0'.repeat(-p) + s; }
    else if (p >= s.length) { cel = s + '0'.repeat(p - s.length); des = ''; }
    else { cel = s.slice(0, p); des = s.slice(p); }
    return { text: (r.zap ? '−' : '') + zoskup(cel) + (des ? ',' + des : ''), presne: r.presne };
  }
  // vedecký zápis 4,5 · 10⁻⁷
  function toScientific(a, maxSig = 12) {
    if (a.n === 0n) return { text: '0', presne: true };
    const r = roundSig(a, maxSig);
    const s = r.m.toString().replace(/0+$/, '');
    const mant = s[0] + (s.length > 1 ? ',' + s.slice(1) : '');
    return { text: `${r.zap ? '−' : ''}${mant} · 10${sup(r.e)}`, presne: r.presne };
  }
  // čítanie vstupu: "1 234,5", "1234.5", "-2", "1,5e3", "4,5 · 10^-7", "4,5 · 10⁻⁷"
  const HORNE_SPAT = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-', '⁺': '+' };
  function parse(vstup) {
    let s = String(vstup == null ? '' : vstup).replace(/[\s   ]+/g, ' ').trim();
    if (!s) return { prazdne: true };
    s = s.replace(/[−–]/g, '-');
    s = s.replace(/[⁻⁺]?[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, m => '^' + [...m].map(c => HORNE_SPAT[c]).join(''));
    let m = s.match(/^(.*?)\s*[·*×xX]\s*10\s*\^\s*\(?\s*([+-]?\d+)\s*\)?$/);
    if (m && m[1].trim()) s = m[1].trim() + 'e' + m[2];
    else if ((m = s.match(/^([+-]?)\s*10\s*\^\s*\(?\s*([+-]?\d+)\s*\)?$/))) s = m[1] + '1e' + m[2];
    s = s.replace(/ /g, '');
    const bezExp = s.replace(/[eE][+-]?\d+$/, '');
    if (/[^\d.,+\-]/.test(bezExp)) return { chyba: /[a-zA-ZÀ-ɏ]/.test(bezExp) ? T.chyby.pismena : T.chyby.zle };
    if (s.includes(',') && s.includes('.')) return { chyba: T.chyby.obaZnaky };
    if ((s.match(/[.,]/g) || []).length > 1) return { chyba: T.chyby.viacCiarok };
    m = s.match(/^([+-]?)(\d*)(?:[.,](\d*))?(?:[eE]([+-]?\d+))?$/);
    if (!m || !(m[2] + (m[3] || ''))) return { chyba: T.chyby.zle };
    const des = m[3] || '', cifry = m[2] + des;
    if (cifry.length > 40) return { chyba: T.chyby.dlhe };
    const exp = m[4] ? parseInt(m[4], 10) : 0;
    if (Math.abs(exp) > 30) return { chyba: T.chyby.exponent };
    const mierka = des.length - exp, c = BigInt(cifry);
    let q = mierka >= 0 ? z(c, p10(mierka)) : z(c * p10(-mierka));
    if (m[1] === '-') q = z(-q.n, q.d);
    return { q };
  }
  return { z, JEDNA, NULA, mul, div, add, sub: subt, compare, eq, absQ, pow10, log10Presne, exp10, roundSig, konecne, presneDesatinne, toDecimalString, toScientific, parse, zoskup };
})();
const q = s => { const r = Q.parse(s); if (!r.q) throw new Error('zlé číslo v dátach: ' + s); return r.q; };   // pre dáta v kóde

/* ===== Výstup v slovenskom zápise ===== */
const DESAT_OD = -6, DESAT_DO = 15;   // od 10⁻⁶ do 10¹⁵ obyčajné desatinné číslo, mimo toho vedecký zápis
function fmt(a) {
  if (a.n === 0n) return { text: '0', presne: true };
  const e = Q.exp10(a);
  const desat = e >= DESAT_OD && (e < DESAT_DO || (e === DESAT_DO && Q.compare(Q.absQ(a), Q.pow10(DESAT_DO)) === 0));
  // celé čísla v tomto rozsahu sa píšu presne, aj keď majú viac ako 12 číslic (napr. 1 234 567 890 123)
  if (desat && a.d === 1n) return { text: Q.presneDesatinne(a), presne: true };
  return desat ? Q.toDecimalString(a, 12) : Q.toScientific(a, 12);
}
const fmtText = a => { const f = fmt(a); return (f.presne ? '' : '≈ ') + f.text; };
const bezNbsp = s => s.replace(/ /g, ' ');
const zlomokHTML = a => `<span class="zlomok"><span>${a.n < 0n ? '−' : ''}${Q.zoskup((a.n < 0n ? -a.n : a.n).toString())}</span><span>${Q.zoskup(a.d.toString())}</span></span>`;
// HTML: pri zaokrúhlení „≈“ a presná hodnota v rozbaľovacom detaile
function fmtHTML(a) {
  const f = fmt(a);
  if (f.presne) return `<span class="cislo">${f.text}</span>`;
  const pd = Q.presneDesatinne(a);
  const obsah = pd ? `${T.ui.dlhePozn} <b>${pd}</b>` : `${T.ui.zlomokPozn} ${zlomokHTML(a)}`;
  return `<span class="cislo">≈ ${f.text}</span><details class="presne"><summary>${T.ui.presne}</summary><span class="obsah">${obsah}</span></details>`;
}

/* =====================================================================
   ROZMEROVÁ ANALÝZA A REGISTER JEDNOTIEK
   ===================================================================== */
const ROZMERY = ['L', 'M', 'T', 'I', 'Θ', 'D'];
const rozmerKluc = r => ROZMERY.map(k => r[k] || 0).join(',');
const velicina = r => T.veliciny.find(v => v.kluc === rozmerKluc(r)) || { id: '', nom: T.rozmer.neznamaVel, aku: T.rozmer.neznamaVel };
const mocninaQ = (a, n) => { let r = Q.JEDNA; for (let i = 0; i < n; i++) r = Q.mul(r, a); return r; };

const PRED = new Map();   // značka → predpona (s presným faktorom)
R.predpony.forEach(p => PRED.set(p.zn, { ...p, faktor: q(p.cislo) }));
const JED = new Map();    // značka → jednotka (len povolené kombinácie predpona + jednotka)
R.jednotky.forEach(u => {
  let f = q(u.faktor), rozmer = u.rozmer;
  const pos = u.posun ? q(u.posun) : null;
  // odvodená jednotka (časť 2): rozmer a faktor sa vypočítajú zo základných jednotiek, napr. Pa = kg · m⁻¹ · s⁻²
  if (u.odvodena) {
    rozmer = {};
    for (const [id, e] of Object.entries(u.odvodena)) {
      const b = JED.get(id);
      for (const k in b.rozmer) rozmer[k] = (rozmer[k] || 0) + b.rozmer[k] * e;
      const m = mocninaQ(b.faktor, Math.abs(e));
      f = e > 0 ? Q.mul(f, m) : Q.div(f, m);
    }
  }
  const pridaj = p => {
    const id = (p ? p.zn : '') + u.zn;
    if (JED.has(id)) throw new Error('dvakrát tá istá značka: ' + id);
    JED.set(id, { id, zn: id, nazov: (p ? p.nazov : '') + u.nazov, nazovAku: (p ? p.nazov : '') + (u.aku || u.nazov), rozmer, faktor: p ? Q.mul(p.faktor, f) : f, posun: pos, zaklad: u.zn, predpona: p ? p.zn : null });
  };
  pridaj(null);
  u.predpony.forEach(zn => pridaj(PRED.get(zn)));
});
R.aliasy.forEach(a => { const c = JED.get(a.za); JED.set(a.zn, { ...c, id: a.zn, zn: a.zn, nazov: a.nazov, alias: a.za }); });
// časť 2: m², dm³ … – mocniny dĺžkových jednotiek (faktor aj rozmer dĺžky sa umocnia)
R.mocniny.forEach(m => {
  const ind = sup(m.exp);
  m.predpony.forEach(p => {
    const d = JED.get(p + m.zaklad), id = d.id + ind;
    if (JED.has(id)) throw new Error('dvakrát tá istá značka: ' + id);
    const rozmer = {}; for (const k in d.rozmer) rozmer[k] = d.rozmer[k] * m.exp;
    JED.set(id, { id, zn: id, nazov: m.slovo + ' ' + d.nazov, rozmer, faktor: mocninaQ(d.faktor, m.exp), posun: null, zaklad: m.zaklad + ind, predpona: p || null, mocnina: { d: d.id, exp: m.exp, id } });
  });
});
// časť 3: ak značka nie je v registri, skúsi sa ako zložená jednotka (km/h, g/cm³ …)
const ZLOZENE = new Map();
const jednotka = id => JED.get(id) || zlozenaJednotka(id) || null;
const ROVNAKE = new Map();   // ha → hm², l → dm³ … (aj naopak)
R.rovnake.forEach(([a, b]) => { ROVNAKE.set(a, b); if (!ROVNAKE.has(b)) ROVNAKE.set(b, a); });

/* Prevod hodnoty (zlomok) z jednotky z na jednotku na. Vráti výsledok alebo vysvetlenie, prečo sa nedá. */
function prevod(hodnota, zId, naId) {
  const z = jednotka(zId), na = jednotka(naId);
  if (!z || !na) return { chyba: T.rozmer.neznama };
  if (rozmerKluc(z.rozmer) !== rozmerKluc(na.rozmer)) {
    const vz = velicina(z.rozmer), vna = velicina(na.rozmer);
    return {
      zlyRozmer: true, z, na,
      chyba: sub(T.rozmer.rozne, { Z: velkePrve(vz.aku), na: vna.aku }),
      detail: sub(T.rozmer.rozneDetail, { z: jedHTML(z.zn), na: jedHTML(na.zn), vz: vz.nom, vna: vna.nom })
    };
  }
  // časť 3: teplota (°C ↔ K) je posun, nie násobenie – rieši ju samostatná funkcia
  if (z.posun || na.posun) return prevodTeploty(hodnota, z, na);
  return { vysl: Q.div(Q.mul(hodnota, z.faktor), na.faktor), z, na, hodnota, pomer: Q.div(z.faktor, na.faktor) };
}
// reťazec postupu: "3,5 km = 3,5 · 1000 m = 3500 m"
function retazec(P, html) {
  if (P.teplota) return retazecTeploty(P, html);   // časť 3
  const J = html ? jedHTML : x => x, F = html ? (a => `<b>${fmtHTML(a)}</b>`) : fmtText;
  const v = fmtText(P.hodnota), zz = J(P.z.zn), nz = J(P.na.zn), r = P.pomer;
  if (!r || Q.eq(r, Q.JEDNA)) return `${v} ${zz} = ${F(P.vysl)} ${nz}`;
  if (r.d === 1n) return `${v} ${zz} = ${v} · ${fmtText(r)} ${nz} = ${F(P.vysl)} ${nz}`;
  if (r.n === 1n) return `${v} ${zz} = ${v} : ${fmtText(Q.z(r.d))} ${nz} = ${F(P.vysl)} ${nz}`;
  // časť 3: napr. km/h → m/s má pomer 5/18 (nekonečný rozvoj) – píšeme radšej „: 3,6“
  const obr = Q.div(Q.JEDNA, r);
  if (!(Q.konecne(r) && fmt(r).presne) && Q.konecne(obr) && fmt(obr).presne) return `${v} ${zz} = ${v} : ${fmtText(obr)} ${nz} = ${F(P.vysl)} ${nz}`;
  if (!(Q.konecne(r) && fmt(r).presne)) return `${v} ${zz} = ${v} · ${fmtText(Q.z(r.n))} : ${fmtText(Q.z(r.d))} ${nz} = ${F(P.vysl)} ${nz}`;
  return `${v} ${zz} = ${v} · ${fmtText(r)} ${nz} = ${F(P.vysl)} ${nz}`;
}
// veta „menšia jednotka → viac → násobíme“
function intuiciaHTML(P) {
  if (P.teplota) return `<div class="intu">${T.tep.intu}</div>`;   // časť 3
  const c = Q.compare(P.z.faktor, P.na.faktor);
  if (c === 0) return `<div class="intu">${T.dlz.pzRovnake}</div>`;
  const r = c > 0 ? P.pomer : Q.div(Q.JEDNA, P.pomer);
  return `<div class="intu"><span class="op ${c > 0 ? 'nas' : 'del'}">${c > 0 ? T.dlz.znakNas : T.dlz.znakDel}</span>` +
    sub(c > 0 ? T.dlz.intMensia : T.dlz.intVacsia, { z: esc(P.z.zn), na: esc(P.na.zn), r: fmtText(r) }) + '</div>';
}

const PORADIE_KARIET = [];   // všetky karty v poradí menu
T.menu.skupiny.forEach(s => { for (const k in s.karty) PORADIE_KARIET.push({ k, nazov: s.karty[k] }); });
const PRI_ZOBRAZENI = [];    // funkcie, ktoré prekreslia canvas po zobrazení karty alebo zmene veľkosti

function prepniMenu(otvor) {
  const p = $('#menuPanel'), b = $('#menuBtn');

  p.hidden = !o; b.setAttribute('aria-expanded', o); b.textContent = o ? T.menu.zavriet : T.menu.tlacidlo;

function initMenu() {
  const p = $('#menuPanel');

  document.addEventListener('pointerdown', e => { if (!sirokaObrazovka() && !$('#menuPanel').hidden && !e.target.closest('#menuPanel, #menuBtn')) prepniMenu(false); });

}
function ukazKartu(k) {

  $$('[data-karta]').forEach(s => { s.hidden = s.id !== k; });

/* ----- Mini hra „Uhádni predponu“: otázky sa generujú z dát ----- */
const HRA_PRED_TYPY = ['slovo', 'mocnina', 'znacka', 'zMocniny'];
function generujOtazkyPredpon(pocet = 8) {
  const zaklad = [...PRED.values()].filter(p => !p.rozsirenie);
  const out = [], pouzite = new Set();
  let poistka = 0;
  while (out.length < pocet && poistka++ < 1000) {
    const typ = vyber(HRA_PRED_TYPY), p = vyber(zaklad), kl = typ + p.zn;
    if (pouzite.has(kl) || out.some(o => o.p === p && out.length < zaklad.length)) continue;
    pouzite.add(kl);
    // medzi nesprávnymi možnosťami je, ak existuje, „zrkadlová“ predpona (kilo ↔ mili, mega ↔ mikro …)
    const zrk = zaklad.find(x => x.e === -p.e);
    const ine = zamiesaj(zaklad.filter(x => x !== p && x !== zrk));
    const zle = (zrk ? [zrk, ...ine] : ine).slice(0, 3);
    out.push({ typ, p, moz: zamiesaj([p, ...zle]) });
  }
  return out;
}

/* Zarovnané rebríky: jednotky s rovnakou predponou (rovnakým rádom) stoja v jednom riadku,
   napr. km vedľa kg, mm vedľa mg, l vedľa dm³, kΩ vedľa kV. Všetky stĺpce zdieľajú jednu mriežku.
   stlpce: [{ nazov, ids, ref }] – ref = jednotka, voči ktorej sa počíta rád (m, g, m³, A …)
   opt: { klik, rovne, stitok(rad) – popis riadku vľavo (napr. „k kilo“) } */
function postavZarovnane(el, stlpce, opt = {}) {
  const rad = (id, ref) => Q.log10Presne(Q.div(jednotka(id).faktor, jednotka(ref).faktor));
  const rady = [...new Set(stlpce.flatMap(s => s.ids.map(id => rad(id, s.ref))))].sort((a, b) => b - a);
  const riadok = r => 2 + 2 * rady.indexOf(r);   // riadok 1 = nadpisy; medzi priečkami sú riadky so šípkami
  const st = opt.stitok ? 1 : 0;
  const stare = new Set($$('.pricka', el).map(b => b.dataset.id));
  let h = '';
  if (st) rady.forEach(r => { h += `<div class="zrStitok" style="grid-row:${riadok(r)};grid-column:1">${opt.stitok(r)}</div>`; });
  stlpce.forEach((s, k) => {
    const col = k + 1 + st;
    // s.skratka: krátky nadpis pre úzku obrazovku (napr. značka základnej jednotky)
    h += `<h3 style="grid-row:1;grid-column:${col}"><span class="hDl">${s.nazov}</span>${s.skratka ? `<span class="hKr jed" title="${esc(s.nazov)}">${esc(s.skratka)}</span>` : ''}</h3><div class="rebrik">`;
    s.ids.forEach((id, i) => {
      const u = jednotka(id), rov = opt.rovne && ROVNAKE.get(id), r1 = riadok(rad(id, s.ref));
      h += `<button class="pricka${stare.size && !stare.has(id) ? ' nove' : ''}" data-id="${esc(id)}" style="grid-row:${r1};grid-column:${col}">${ikonaPre(u)}<b class="jed">${esc(u.zn)}</b><span class="nazov">${u.nazov}${rov ? ` <span class="rov">= ${jedHTML(rov)}</span>` : ''}</span><span class="znak"></span></button>`;
      if (i < s.ids.length - 1) {
        const r2 = riadok(rad(s.ids[i + 1], s.ref)), f = fmtText(Q.div(u.faktor, jednotka(s.ids[i + 1]).faktor));
        h += `<div class="krok" style="grid-row:${r1 + 1} / ${r2};grid-column:${col}"><span class="hore">↑ : ${f}</span><span class="dole">· ${f} ↓</span></div>`;
      }
    });
    h += '</div>';
  });
  el.style.gridTemplateColumns = (st ? 'auto ' : '') + `repeat(${stlpce.length}, minmax(0, 1fr))`;
  el.classList.toggle('uzke', stlpce.length >= 3);
  el.innerHTML = h;
  $$('.pricka', el).forEach(b => b.onclick = () => (opt.klik || klikPricka)(b.dataset.id));
}
// popis riadku: predpona, ktorej rád zodpovedá riadku (k – kilo, m – mili …)

// to isté pre ľubovoľnú časť stránky (časť 2: každá karta má svoje rebríky)
function vyznacRebrikyV(koren, zU, naU) {
  const zId = (jednotka(zU) || {}).alias || zU, naId = naU ? ((jednotka(naU) || {}).alias || naU) : null;
  $$('.rebrik', koren).forEach(rb => {

      const jeZ = i === iz, jeNa = i === ina;
      b.classList.toggle('z', jeZ); b.classList.toggle('na', jeNa);

      $('.znak', b).textContent = jeZ ? 'z' : jeNa ? 'na' : '';
    });
    $$('.krok', rb).forEach((k, i) => {
      const v = iz >= 0 && ina >= 0 && i >= Math.min(iz, ina) && i < Math.max(iz, ina);
      k.classList.toggle('cesta', v); k.classList.toggle('dolu', v && ina > iz); k.classList.toggle('hor', v && ina < iz);
    });

}
// text „po rebríku“: km → m → dm → cm: · 1000 · 10 · 10 = · 100 000
function cestaPoRebriku(zId, naId) {
  const z = jednotka(zId), na = jednotka(naId);
  const a = z.alias || zId, b = na.alias || naId;
  const cely = (R.rebriky.retaze[velicina(z.rozmer).id] || []).find(r => r.includes(a) && r.includes(b));
  if (!cely) return '';
  const retaz = cely.filter(id => id === a || id === b || ROZSIR || !R.rebriky.rozsirenie.includes(id));
  let i = retaz.indexOf(a), j = retaz.indexOf(b);
  if (i < 0 || j < 0 || i === j) return '';
  // jednotky mimo bežného rebríka (Gm, Mm, µm, nm…) berieme, len ak sú na začiatku alebo konci cesty
  const krok = i < j ? 1 : -1, cast = [];
  for (let k = i; k !== j + krok; k += krok) cast.push(retaz[k]);
  const dolu = krok > 0;
  let s = jedHTML(cast[0]);
  for (let k = 1; k < cast.length; k++) {
    const r = Q.div(jednotka(cast[dolu ? k - 1 : k]).faktor, jednotka(cast[dolu ? k : k - 1]).faktor);
    s += ` <span class="s">${dolu ? '·' : ':'} ${fmtText(r)} →</span> ${jedHTML(cast[k])}`;
  }
  const spolu = Q.div(z.faktor, na.faktor), r = dolu ? spolu : Q.div(Q.JEDNA, spolu);
  return T.dlz.cesta + s + (cast.length > 2 ? sub(T.dlz.cestaSpolu, { op: dolu ? '·' : ':', r: fmtText(r) }) : '');
}

/* ----- Číslice a rády: číslice sa posúvajú, čiarka stojí za jednotkami ----- */
const RADY = { anim: null, posledny: null };
// číslice čísla (konečný desatinný rozvoj) s ich rádmi; nuly na konci (pred čiarkou) sa nepočítajú
function cifryRady(a) {
  const pd = Q.presneDesatinne(Q.absQ(a)).replace(/ /g, '');
  const [cel, des = ''] = pd.split(',');
  const vs = [];
  [...cel].forEach((c, i) => vs.push({ c, e: cel.length - 1 - i }));
  [...des].forEach((c, i) => vs.push({ c, e: -1 - i }));
  while (vs.length && vs[0].c === '0') vs.shift();
  while (vs.length && vs[vs.length - 1].c === '0') vs.pop();
  return vs;
}
// nuly potrebné na zápis čísla s číslicami v rádoch hi … lo (vodiace nuly 0,0… a nuly pred čiarkou)
function vyplnNuly(hi, lo) {
  const n = [];
  if (hi < 0) for (let e = 0; e > hi; e--) n.push(e);
  if (lo > 0) for (let e = lo - 1; e >= 0; e--) n.push(e);
  return n;
}
function radyAnim(a, s, sAnimaciou) {
  const el = $('#pzRady'), txt = $('#pzRadyTxt');
  if (RADY.anim) RADY.anim.stop();
  RADY.posledny = { a, s };
  $('#pzRadyZnova').hidden = true;
  if (s == null) { el.innerHTML = ''; txt.textContent = ''; return; }
  if (a.n === 0n) { el.innerHTML = ''; el.style.width = '0'; txt.textContent = T.dlz.radyNula; return; }
  const cif = cifryRady(a), hi = cif[0].e, lo = cif[cif.length - 1].e;
  const Emax = Math.max(hi, hi + s, 0), Emin = Math.min(lo, lo + s, 0), pocet = Emax - Emin + 1;
  const k = Math.abs(s), r = fmtText(Q.pow10(k));
  txt.innerHTML = s === 0 ? T.dlz.radyRovnake : sub(s > 0 ? T.dlz.radyNas : T.dlz.radyDel, { r, e: sup(k), k, rad: sklonRad(k) });
  if (pocet > 30) { el.innerHTML = ''; el.style.width = '0'; txt.innerHTML = sub(T.dlz.radyVela, { k }); return; }
  const W = 46, CW = 16, OKRAJ = a.n < 0n ? 26 : 4;
  const x = e => OKRAJ + (Emax - e) * W + (e < 0 ? CW : 0);
  el.style.width = (OKRAJ + pocet * W + CW + 4) + 'px';
  let h = '';
  for (let e = Emax; e >= Emin; e--) {
    h += `<span class="rk${e === 0 ? ' j' : ''}" style="left:${x(e)}px;width:${W}px"></span><span class="rh" style="left:${x(e)}px;width:${W}px">10${sup(e)}</span>`;
  }
  h += `<span class="rjed" style="left:${x(0) - W}px;width:${3 * W}px">${T.dlz.jednotky}</span>`;
  h += `<span class="ci" style="left:${x(0) + W - 4}px">,</span>`;
  if (a.n < 0n) h += `<span class="zn" style="left:2px">−</span>`;
  const nulyPred = vyplnNuly(hi, lo), nulyPo = vyplnNuly(hi + s, lo + s);
  h += nulyPred.map(e => `<span class="nl pred" style="left:${x(e)}px;width:${W}px">0</span>`).join('');
  h += nulyPo.map(e => `<span class="nl po" style="left:${x(e)}px;width:${W}px;opacity:0">0</span>`).join('');
  h += cif.map(c => `<span class="cf" data-e="${c.e}" style="left:${x(c.e)}px;width:${W}px">${c.c}</span>`).join('');
  el.innerHTML = h;
  // posuň okno tak, aby bolo vidieť čiarku
  const obal = el.parentElement; obal.scrollLeft = Math.max(0, x(0) - obal.clientWidth / 2);
  const cfs = $$('.cf', el), pred = $$('.nl.pred', el), po = $$('.nl.po', el);
  const krok = p => {
    const a1 = cast(p, 0, .2), a2 = hladko(cast(p, .2, .8)), a3 = cast(p, .8, 1);
    pred.forEach(n => { n.style.opacity = 1 - a1; });
    cfs.forEach(c => { const e = +c.dataset.e; c.style.transform = `translateX(${(x(e + s) - x(e)) * a2}px)`; });
    po.forEach(n => { n.style.opacity = a3; });
  };
  const hotovo = () => { $('#pzRadyZnova').hidden = s === 0; };
  if (!sAnimaciou || s === 0) { krok(s === 0 ? 0 : 1); if (s === 0) pred.forEach(n => n.style.opacity = 1); hotovo(); return; }
  krok(0);
  RADY.anim = animuj(1800, krok, hotovo);
}

/* ----- Malé dĺžky: stupnica rádov (len overené orientačné údaje) ----- */
function najlepsiZapis(e) {   // 10^e m zapíš v mm, µm alebo nm tak, aby číslo bolo aspoň 1 (inak nm)
  const a = Q.pow10(e);
  for (const id of ['mm', 'µm', 'nm']) { const v = Q.div(a, jednotka(id).faktor); if (Q.compare(v, Q.JEDNA) >= 0 || id === 'nm') return fmtText(v) + ' ' + jedHTML(id); }
}

/* ----- Hra „Prevod“: zadanie aj správna odpoveď sa generujú v kóde ----- */
const HPR = { u: 1, ul: null, s: 0, n: 0, vyriesene: false };
function nahodneDesatinne(maxCel, maxDes) {   // napr. 3,5 alebo 0,25 (presne, ako zlomok)
  const d = nahoda(1, maxDes), c = nahoda(1, maxCel * 10 ** d - 1);
  return Q.z(BigInt(c), 10n ** BigInt(d));
}
function generujPrevod(u) {
  const D = R.hraPrevod[u - 1];
  for (let pokus = 0; pokus < 500; pokus++) {
    let z, na, v;
    if (u === 1) {
      const [a, b] = vyber(D.pary); const dolu = Math.random() < .5;
      z = dolu ? a : b; na = dolu ? b : a;
      const r = Q.div(jednotka(z).faktor, jednotka(na).faktor), c = Q.z(BigInt(nahoda(1, 40)));
      v = r.d === 1n ? c : Q.div(c, r);   // z menšej jednotky: násobok 1000, aby vyšlo celé číslo
    } else {
      const sk = vyber(D.skupiny); z = vyber(sk); na = vyber(sk.filter(x => x !== z));
      v = u === 2 ? (Math.random() < .3 ? Q.z(BigInt(nahoda(2, 99))) : nahodneDesatinne(99, 2)) : (Math.random() < .5 ? Q.z(BigInt(nahoda(1, 900))) : nahodneDesatinne(50, 2));
    }
    const P = prevod(v, z, na), f = fmt(P.vysl);
    if (!f.presne) continue;
    const e = Q.exp10(P.vysl);
    if (u === 1 && P.vysl.d !== 1n) continue;
    if (u === 2 && (e < -4 || e > 7 || Q.roundSig(P.vysl, 8).presne === false)) continue;
    if (u === 3 && (e < -10 || e > 10)) continue;
    return P;
  }
  return prevod(Q.z(3n), 'km', 'm');
}

}

function overPrevod() {

  const P = HPR.ul, inp = $('#hpVstup'), fb = $('#hpFb'), r = Q.parse(inp.value);

/* =====================================================================
   ČASŤ 2 – SPOLOČNÉ: prevodník ako komponent, vysvetlenie mocnín, posuvník, kreslenie
   ===================================================================== */
// ponuka jednotiek v skupinách: [[názov skupiny, [id…]], …]
function moznostiHTML(skupiny) {
  return skupiny.map(([nazov, ids]) => `<optgroup label="${esc(nazov)}">${ids.map(id => { const u = jednotka(id); return `<option value="${esc(id)}">${esc(u.zn)} – ${u.nazov}</option>`; }).join('')}</optgroup>`).join('');
}
// m², ha (= hm²), l (= dm³) … → ktorá dĺžková jednotka a aká mocnina
function mocninaJednotky(u) {
  if (u.mocnina) return { ...u.mocnina, cez: null };
  const e = ROVNAKE.get(u.id), eu = e && jednotka(e);
  return eu && eu.mocnina ? { ...eu.mocnina, cez: e } : null;
}
// „Prečo: 1 m = 100 cm, teda 1 m² = 100 · 100 cm² = 10 000 cm².“
function vysvetlenieMocnin(P) {
  const z = P.z, na = P.na;
  if (z.id === na.id || !P.pomer) return '';
  // jednotky s predponou k tomu istému základu (hl a ml, kPa a hPa): stačí ich porovnať so základom
  if (z.zaklad === na.zaklad && !z.mocnina && !na.mocnina) {
    const zak = jednotka(z.zaklad);
    if (!zak) return '';
    const casti = [z, na].filter(u => u.id !== zak.id).map(u => `1 ${jedHTML(u.zn)} = ${fmtText(Q.div(u.faktor, zak.faktor))} ${jedHTML(zak.zn)}`);
    return sub(T.pz2.rodina, { casti: casti.join(T.pz2.rodinaA) });
  }
  const a = mocninaJednotky(z), b = mocninaJednotky(na);
  if (!a || !b || a.exp !== b.exp) return '';
  if (a.id === b.id) return sub(T.pz2.rovnake, { u: jedHTML(z.zn), ekv: jedHTML(na.zn) });
  const cez = [];
  if (a.cez) cez.push(sub(T.pz2.cez, { u: jedHTML(z.zn), ekv: jedHTML(a.cez) }));
  if (b.cez) cez.push(sub(T.pz2.cez, { u: jedHTML(na.zn), ekv: jedHTML(b.cez) }));
  const r = Q.div(jednotka(a.d).faktor, jednotka(b.d).faktor);
  return sub(T.pz2.vysvet, {
    d1: jedHTML(a.d), d2: jedHTML(b.d), r: fmtText(r), m1: jedHTML(a.id), m2: jedHTML(b.id),
    krat: Array(a.exp).fill(fmtText(r)).join(' · '), R: fmtText(mocninaQ(r, a.exp))
  }) + cez.join('');
}

/* Prevodník ako komponent (karty Plocha, Objem, Neštandardné jednotky).
   o = { skupiny, z, na, h, koren (kde sú jeho rebríky), poVypocte(P) } */
function vytvorPrevodnik(el, o) {
  el.innerHTML = `<div class="pz">
      <label><span>${T.dlz.pzHodnota}</span><input class="txt" value="${esc(o.h)}" autocomplete="off" spellcheck="false" enterkeyhint="go"></label>
      <label><span>${T.dlz.pzZ}</span><select class="sz">${moznostiHTML(o.skupiny)}</select></label>
      <button class="vym">${T.dlz.pzVymen}</button>
      <label><span>${T.dlz.pzNa}</span><select class="sna">${moznostiHTML(o.skupiny)}</select></label>
    </div><p class="hlaska" aria-live="polite"></p><div class="vys" aria-live="polite"></div>`;
  const S = { z: o.z, na: o.na, klikZ: null };
  const inp = $('input', el), sz = $('.sz', el), sna = $('.sna', el), vys = $('.vys', el);
  function pocitaj() {
    // časť 4 (kalkulačka): v ponuke „na“ len jednotky s rovnakým rozmerom ako „z“
    if (o.kompatibilne) {
      const kl = rozmerKluc(jednotka(S.z).rozmer);
      const sk = o.skupiny.map(([n, ids]) => [n, ids.filter(id => rozmerKluc(jednotka(id).rozmer) === kl)]).filter(([, ids]) => ids.length);
      sna.innerHTML = moznostiHTML(sk);
      const ok = sk.flatMap(([, ids]) => ids);
      if (!ok.includes(S.na)) S.na = ok.find(id => id !== S.z) || S.z;
    }
    sz.value = S.z; sna.value = S.na;
    if (o.koren) vyznacRebrikyV(o.koren, S.z, S.klikZ ? null : S.na);
    const r = Q.parse(inp.value);
    inp.classList.toggle('zle', !!r.chyba); $('.hlaska', el).textContent = r.chyba || '';
    if (r.prazdne || r.chyba) { vys.innerHTML = ''; if (o.poVypocte) o.poVypocte(null); return null; }   // prázdny vstup nič nerobí
    const P = prevod(r.q, S.z, S.na);
    if (P.zlyRozmer) { vys.innerHTML = `<div class="box omyl"><b class="h">✗ ${P.chyba}</b><p>${P.detail}</p></div>`; if (o.poVypocte) o.poVypocte(P); return P; }
    let h = `<div class="retaz">${retazec(P, true)}</div>`;
    if (!fmt(P.vysl).presne) h += `<p class="mini">${sub(T.pz3.zaokr, { v: fmtZaokr(P.vysl, 2) })}</p>`;   // časť 3
    if (o.zlomok && P.vysl.d !== 1n) h += `<details class="presne"><summary>${T.kalk.zlomok}</summary><span class="obsah">${zlomokHTML(P.vysl)}</span></details>`;   // časť 4
    const vy = vysvetlenieMocnin(P);
    if (vy) h += `<p class="vysv">${vy}</p>`;
    h += intuiciaHTML(P);
    const c = cestaPoRebriku(S.z, S.na);
    if (c) h += `<p class="cestaTxt">${c}</p>`;
    vys.innerHTML = h;
    if (o.poVypocte) o.poVypocte(P);
    return P;
  }
  let caka = 0;
  inp.addEventListener('input', () => { clearTimeout(caka); caka = setTimeout(pocitaj, 350); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(caka); pocitaj(); } });
  sz.onchange = () => { S.z = sz.value; S.klikZ = null; pocitaj(); };
  sna.onchange = () => { S.na = sna.value; S.klikZ = null; pocitaj(); };
  $('.vym', el).onclick = () => { [S.z, S.na] = [S.na, S.z]; S.klikZ = null; pocitaj(); };
  const api = {
    S, pocitaj,
    nastav(z, na, h) { S.z = z; S.na = na; S.klikZ = null; if (h != null) inp.value = h; return pocitaj(); },
    // ťuknutie na priečku rebríka: prvá = z, druhá = na
    klik(id) {
      if (!S.klikZ) { S.klikZ = id; S.z = id; if (o.koren) vyznacRebrikyV(o.koren, id, null); return; }
      const z = S.klikZ; S.klikZ = null; api.nastav(z, id);
    }
  };
  pocitaj();
  return api;
}

/* Posuvník s presnou hodnotou: od, do, krok sú texty ("0,1"), hodnota je zlomok. */
function posuvnik(el, o) {
  const od = q(o.od), krok = q(o.krok);
  const N = Number(Q.div(Q.sub(q(o.do), od), krok).n), i0 = Number(Q.div(Q.sub(q(o.h), od), krok).n);
  el.classList.add('sl');
  el.innerHTML = `<div class="lbl"><span>${o.lbl}</span><b></b></div><div class="slRiadok"><button aria-label="menej">−</button><input type="range" min="0" max="${N}" step="1" value="${i0}" aria-label="${esc(o.lbl)}"><button aria-label="viac">+</button></div>`;
  const inp = $('input', el), [bm, bp] = $$('button', el);
  const hodnota = () => Q.add(od, Q.mul(krok, Q.z(BigInt(inp.value))));
  const ukaz = () => { $('b', el).innerHTML = fmtText(hodnota()) + ' ' + jedHTML(o.jed); o.zmena(); };
  inp.oninput = ukaz;
  bm.onclick = () => { inp.value = Math.max(0, +inp.value - 1); ukaz(); };
  bp.onclick = () => { inp.value = Math.min(N, +inp.value + 1); ukaz(); };
  return { hodnota, ukaz };
}

// pripraví canvas na ostré kreslenie; vráti kontext a šírku (0 = karta je skrytá)
function pripravCanvas(cv, H) {
  const W = cv.clientWidth; if (!W) return { W: 0 };
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  cv.style.height = H + 'px';
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
  return { c, W };
}
// krokovacia animácia (Ďalší krok / Prehraj všetko / Od začiatku) – spoločná pre plochu a objem
function krokovac(st, max, trvanie, kresli) {
  st.krok = 0; st.p = 0; st.anim = null; st.auto = false;
  const dalej = () => {
    if (st.anim || st.krok >= max) return;
    st.anim = animuj(trvanie(st.krok), p => { st.p = p; kresli(); }, () => {
      st.anim = null; st.krok++; st.p = 0; kresli();
      if (st.auto && st.krok < max) setTimeout(() => { if (st.auto) dalej(); }, 450);
    });
    kresli();
  };
  return {
    krok() { st.auto = false; dalej(); },
    vsetko() { st.auto = true; dalej(); },
    reset() { if (st.anim) st.anim.stop(); st.anim = null; st.auto = false; st.krok = 0; st.p = 0; kresli(); }
  };
}
// izometria: bod (x, y, z) → obrazovka; x doprava-dolu, y doľava-dolu, z hore
const izo = (cx, cy, u) => (x, y, z) => [cx + (x - y) * 0.866 * u, cy + (x + y) * 0.5 * u - z * u];
function mnohouholnik(c, body, vypln, ciara, hrubka = 1.5) {
  c.beginPath(); body.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath();
  if (vypln) { c.fillStyle = vypln; c.fill(); }
  if (ciara) { c.strokeStyle = ciara; c.lineWidth = hrubka; c.stroke(); }
}
// kváder od (x0, y0, z0) po (x1, y1, z1): viditeľné sú steny hore, x = x1 a y = y1
function kvader(c, P, [x0, y0, z0], [x1, y1, z1], f) {
  mnohouholnik(c, [P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)], f.lavy, f.ciara);
  mnohouholnik(c, [P(x1, y0, z0), P(x1, y1, z0), P(x1, y1, z1), P(x1, y0, z1)], f.pravy, f.ciara);
  mnohouholnik(c, [P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)], f.hore, f.ciara);
}
const ciaraC = (c, [a, b], [x, y]) => { c.beginPath(); c.moveTo(a, b); c.lineTo(x, y); c.stroke(); };

/* =====================================================================
   KARTA: PLOCHA (časť 2)
   ===================================================================== */
const PLO = { jed: ['m', 'dm', 'cm', 'mm'] };
let PLO_PZ = null;
function initPlocha() {
  $('#ploKrok').textContent = T.plo.btnKrok; $('#ploVsetko').textContent = T.plo.btnVsetko; $('#ploReset').textContent = T.plo.btnReset;

  $('#ploKrok').onclick = K.krok; $('#ploVsetko').onclick = K.vsetko; $('#ploReset').onclick = K.reset;
  PRI_ZOBRAZENI.push(ploKresli);
  const f = (a, b) => fmtText(prevod(Q.JEDNA, a, b).vysl);
  $('#ploPrepojenie').innerHTML = sub(T.plo.prepojenie, { kmha: f('km²', 'ha'), haa: f('ha', 'a'), am2: f('a', 'm²') });
  PLO_PZ = vytvorPrevodnik($('#pzPlocha'), { skupiny: [[T.pz2.plocha, R.zoznamy.plocha]], z: 'm²', na: 'cm²', h: '2,5', koren: $('#plocha') });
  let nest = false;   // ár a hektár: samostatný stĺpec, ktorý sa dá vsunúť a vysunúť
  const rebrik = () => {
    postavZarovnane($('#rbPlocha'), [{ nazov: T.plo.zakladne, ids: R.rebriky.plocha, ref: 'm²' }]
      .concat(nest ? [{ nazov: T.plo.nestandardne, ids: R.rebriky.plochaNest, ref: 'm²' }] : []), { klik: id => PLO_PZ.klik(id), rovne: true });
    $('#ploNest').textContent = nest ? T.plo.nestVyp : T.plo.nestZap; $('#ploNest').setAttribute('aria-expanded', nest);
    PLO_PZ.pocitaj();
  };
  $('#ploNest').onclick = () => { nest = !nest; rebrik(); };
  rebrik();
  PLO_PZ.pocitaj();
  // omyl: 1 m² nie je 100 cm²
  const v = fmtText(prevod(Q.JEDNA, 'm²', 'cm²').vysl);
  $('#ploOmyl').innerHTML = sub(T.plo.omyl, { v });
  $('#ploOmylViz').innerHTML = svgMriezka(10, { zvyrazni: 1, popis: T.plo.omylPopis, nadpis: sub(T.plo.omylCely, { v }) });

function ploKresli() {
  const cv = $('#ploCv'), { c, W } = pripravCanvas(cv, Math.min(cv.clientWidth - 40, 320) + 90);
  if (!W) return;
  const S = Math.min(W - 40, 320), x0 = (W - S) / 2, y0 = 40;
  const k = PLO.krok, p = hladko(PLO.p), L = Math.floor(k / 2), mriezka = k % 2 === 1;
  const u = PLO.jed[L], v = PLO.jed[L + 1];
  // pri priblížení (mriežka → ďalšia úroveň) sa ľavý horný štvorček zväčší na celý štvorec
  const mierka = mriezka ? Math.pow(10, p) : 1;
  const mriezkaA = mriezka ? 1 : p;   // mriežka sa objavuje pri prechode z celého štvorca
  c.save(); c.beginPath(); c.rect(x0, y0, S, S); c.clip();
  c.fillStyle = 'rgba(127,220,143,.16)'; c.fillRect(x0, y0, S, S);
  c.fillStyle = `rgba(243,180,83,${.45 * mriezkaA * (mriezka ? 1 - p : 1)})`; c.fillRect(x0, y0, S * mierka / 10, S * mierka / 10);
  c.strokeStyle = `rgba(127,220,143,${mriezkaA})`; c.lineWidth = 1.5;
  for (let i = 1; i < 10 * mierka + 1 && i <= 10; i++) {
    const t = S * mierka * i / 10;
    if (t > S) break;
    ciaraC(c, [x0 + t, y0], [x0 + t, y0 + S]); ciaraC(c, [x0, y0 + t], [x0 + S, y0 + t]);
  }
  c.restore();
  c.strokeStyle = '#e2e8f5'; c.lineWidth = 2.5; c.strokeRect(x0, y0, S, S);
  // popisy
  c.font = '700 18px system-ui,sans-serif'; c.textAlign = 'center'; c.fillStyle = '#e2e8f5';
  const hore = mriezka ? (p < .5 ? `1 ${u}² = 100 ${v}²` : `1 ${v} × 1 ${v} = 1 ${v}²`) : `1 ${u} × 1 ${u} = 1 ${u}²`;
  c.globalAlpha = mriezka ? Math.abs(1 - 2 * p) : 1; c.fillText(hore, W / 2, y0 - 12); c.globalAlpha = 1;
  c.font = '16px system-ui,sans-serif';
  c.fillStyle = '#a3adc6'; c.fillText(`1 ${u}`, W / 2, y0 + S + 24);
  if (mriezkaA > 0 && !(mriezka && p > 0)) {
    c.fillStyle = '#ffd88a'; c.globalAlpha = mriezkaA;
    c.textAlign = 'left'; c.fillText(`← 1 ${v}²`, x0 + S / 10 + 6, y0 + S / 20 + 6);
    c.textAlign = 'center'; c.fillText(`10 × 1 ${v} = 1 ${u}`, W / 2, y0 + S + 46); c.globalAlpha = 1;
  }
  // text pod obrázkom
  let h = mriezka ? sub(T.plo.krokMriezka, { u, v }) : sub(T.plo.krokCely, { u });
  if (L > 0 || mriezka) {
    const po = mriezka ? L + 1 : L, ids = PLO.jed.slice(0, po + 1).map(x => x + '²');
    h += ' ' + sub(T.plo.krokSpolu, { retaz: ids.map(id => fmtText(prevod(Q.JEDNA, 'm²', id).vysl) + ' ' + jedHTML(id)).join(' = ') });
  }
  $('#ploInfo').innerHTML = h;
  const koniec = PLO.krok >= 2 * (PLO.jed.length - 1) - 1;
  $('#ploKrok').disabled = koniec || !!PLO.anim; $('#ploVsetko').disabled = koniec || !!PLO.anim;
}
// SVG: štvorec n × n so zvýrazneným ľavým horným políčkom (omyl, ár, hektár)
function svgMriezka(n, o = {}) {
  const S = 240, x0 = 40, y0 = o.nadpis ? 34 : 10, b = S / n;
  let s = `<svg class="viz" viewBox="0 0 ${S + 60} ${S + y0 + 40}" role="img" aria-label="${esc(o.popis || '')}">`;
  if (o.nadpis) s += `<text x="${x0 + S / 2}" y="22" text-anchor="middle" class="g">${esc(o.nadpis)}</text>`;
  s += `<rect x="${x0}" y="${y0}" width="${S}" height="${S}" fill="rgba(127,220,143,.14)" stroke="#e2e8f5" stroke-width="2"/>`;
  for (let i = 1; i < n; i++) s += `<path d="M${x0 + i * b} ${y0}v${S}M${x0} ${y0 + i * b}h${S}" stroke="rgba(127,220,143,.6)" stroke-width="1"/>`;
  if (o.zvyrazni) s += `<rect x="${x0}" y="${y0}" width="${b * o.zvyrazni}" height="${b * o.zvyrazni}" fill="rgba(243,180,83,.6)" stroke="#ffd88a" stroke-width="2"/>`;
  if (o.strana) s += `<text x="${x0 + S / 2}" y="${y0 + S + 26}" text-anchor="middle" class="m">${esc(o.strana)}</text><text x="${x0 - 10}" y="${y0 + S / 2}" text-anchor="middle" class="m" transform="rotate(-90 ${x0 - 10} ${y0 + S / 2})">${esc(o.strana)}</text>`;
  if (o.popis) s += `<text x="${x0 + b * (o.zvyrazni || 1) + 6}" y="${y0 + b * (o.zvyrazni || 1) / 2 + 6}" class="g">← ${esc(o.popis)}</text>`;
  return s + '</svg>';
}

const OBJ = {};
const LIT = { f: 0, anim: null };
let OBJ_PZ = null;
function initObjem() {
  $('#objKrok').textContent = T.obj.btnKrok; $('#objVsetko').textContent = T.obj.btnVsetko; $('#objReset').textContent = T.obj.btnReset;

    const f0 = LIT.f;
    LIT.anim = animuj(2200 * (1 - f0), p => { LIT.f = f0 + (1 - f0) * p; litKresli(); }, () => { LIT.anim = null; litKresli(); });
  };
  $('#litVylej').onclick = () => { if (LIT.anim) LIT.anim.stop(); LIT.anim = null; LIT.f = 0; litKresli(); };
  PRI_ZOBRAZENI.push(objKresli, litKresli);

    { klik: id => OBJ_PZ.klik(id), rovne: true });

function objKresli() {
  const cv = $('#objCv'), W0 = cv.clientWidth; if (!W0) return;
  const GAP = 0.9, u = Math.min((W0 - 40) / (20 * 0.866), 13), cy = 26 + (10 + 9 * GAP) * u;
  const H = cy + 10 * u + 26;
  const { c, W } = pripravCanvas(cv, H);
  const P = izo(W / 2, cy, u);
  const k = OBJ.krok, p = hladko(OBJ.p);
  const mriezkaA = k >= 1 ? 1 : p;
  const g = k >= 2 ? GAP : k === 1 ? GAP * p : 0;
  const svieti = k >= 3 ? 10 : k === 2 ? Math.ceil(OBJ.p * 10 - 1e-9) : 0;
  const f = { hore: '#3d6fa8', lavy: '#24497a', pravy: '#1b3a63', ciara: null };
  const fz = { hore: '#d9a24a', lavy: '#a8742c', pravy: '#8a5d22', ciara: null };
  for (let i = 0; i < 10; i++) {
    const z0 = i * (1 + g), z1 = z0 + 1, lit = i < svieti;
    kvader(c, P, [0, 0, z0], [10, 10, z1], lit ? fz : f);
    // mriežka 1 cm na stenách vrstvy
    c.strokeStyle = `rgba(226,232,245,${.55 * mriezkaA})`; c.lineWidth = 1;
    for (let t = 1; t < 10; t++) {
      ciaraC(c, P(t, 10, z0), P(t, 10, z1)); ciaraC(c, P(10, t, z0), P(10, t, z1));
      if (g > 0 || i === 9) { ciaraC(c, P(t, 0, z1), P(t, 10, z1)); ciaraC(c, P(0, t, z1), P(10, t, z1)); }
    }
    // obrys vrstvy: pri rozložení plný, inak len naznačený mriežkou
    c.strokeStyle = `rgba(226,232,245,${g > 0 ? .9 : .55 * mriezkaA})`; c.lineWidth = 1.2;
    ciaraC(c, P(0, 10, z0), P(10, 10, z0)); ciaraC(c, P(10, 10, z0), P(10, 0, z0));
  }
  // obrys celej kocky (kým nie je rozložená)
  if (g === 0) {
    c.strokeStyle = '#e2e8f5'; c.lineWidth = 2;
    [[[0, 10, 0], [10, 10, 0]], [[10, 10, 0], [10, 0, 0]], [[0, 10, 0], [0, 10, 10]], [[10, 10, 0], [10, 10, 10]], [[10, 0, 0], [10, 0, 10]],
     [[0, 0, 10], [10, 0, 10]], [[10, 0, 10], [10, 10, 10]], [[10, 10, 10], [0, 10, 10]], [[0, 10, 10], [0, 0, 10]]].forEach(([a, b]) => ciaraC(c, P(...a), P(...b)));
  }
  c.font = '16px system-ui,sans-serif'; c.fillStyle = '#a3adc6'; c.textAlign = 'center';
  const [ax, ay] = P(5, 10, 0); c.fillText(k >= 1 || p > .5 ? '10 cm' : '1 dm', ax - 22, ay + 24);
  // text
  let h;
  if (k === 0) h = OBJ.anim ? T.obj.k1 : T.obj.k0;
  else if (k === 1) h = OBJ.anim ? T.obj.k2 : T.obj.k1;
  else if (k === 2) h = OBJ.anim ? sub(T.obj.k3, { k: Math.max(1, svieti), n: fmtText(Q.z(BigInt(100 * Math.max(1, svieti)))) }) : T.obj.k2;
  else h = T.obj.k3Koniec;
  $('#objInfo').innerHTML = h;
  $('#objKrok').disabled = k >= 3 || !!OBJ.anim; $('#objVsetko').disabled = k >= 3 || !!OBJ.anim;
}
// kocka 1 dm³ ako nádoba: voda stúpa do výšky 10 · f cm
function litKresli() {
  const cv = $('#litCv'), W0 = cv.clientWidth; if (!W0) return;
  const u = Math.min((W0 - 60) / (20 * 0.866), 11), cy = 30 + 10 * u, H = cy + 10 * u + 34;
  const { c, W } = pripravCanvas(cv, H);
  const P = izo(W / 2, cy, u), f = LIT.f;
  // zadné steny nádoby
  mnohouholnik(c, [P(0, 0, 0), P(10, 0, 0), P(10, 0, 10), P(0, 0, 10)], 'rgba(255,255,255,.04)', 'rgba(226,232,245,.35)');
  mnohouholnik(c, [P(0, 0, 0), P(0, 10, 0), P(0, 10, 10), P(0, 0, 10)], 'rgba(255,255,255,.04)', 'rgba(226,232,245,.35)');
  mnohouholnik(c, [P(0, 0, 0), P(10, 0, 0), P(10, 10, 0), P(0, 10, 0)], 'rgba(255,255,255,.06)', 'rgba(226,232,245,.35)');
  if (f > 0) kvader(c, P, [0, 0, 0], [10, 10, 10 * f], { hore: 'rgba(111,180,255,.75)', lavy: 'rgba(60,130,220,.7)', pravy: 'rgba(45,105,190,.7)', ciara: 'rgba(160,210,255,.8)' });
  // predné hrany nádoby
  c.strokeStyle = '#e2e8f5'; c.lineWidth = 2;
  [[[0, 10, 0], [10, 10, 0]], [[10, 10, 0], [10, 0, 0]], [[0, 10, 0], [0, 10, 10]], [[10, 10, 0], [10, 10, 10]], [[10, 0, 0], [10, 0, 10]],
   [[0, 0, 10], [10, 0, 10]], [[10, 0, 10], [10, 10, 10]], [[10, 10, 10], [0, 10, 10]], [[0, 10, 10], [0, 0, 10]]].forEach(([a, b]) => ciaraC(c, P(...a), P(...b)));
  c.font = '16px system-ui,sans-serif'; c.fillStyle = '#a3adc6'; c.textAlign = 'center';
  const [ax, ay] = P(5, 10, 0); c.fillText(T.obj.hrana, ax - 22, ay + 24);
  const [bx, by] = P(10, 5, 0); c.fillText(T.obj.hrana, bx + 24, by + 24);
  const [hx, hy] = P(10, 10, 5); c.textAlign = 'left'; c.fillText(T.obj.hrana, hx + 8, hy);
  $('#litInfo').innerHTML = f >= 1 ? T.obj.plna : '';
}

// odmerka 1 l s ryskami po 1 dl, naplnená do dl decilitrov

const VODA_KG_NA_L = () => q(R.voda.kgNaLiter);   // približne – vždy sa zobrazuje s „≈“
const PRAX = {
  ihrisko(d, s) { const m2 = Q.mul(d, s); return { m2, a: prevod(m2, 'm²', 'a').vysl, ha: prevod(m2, 'm²', 'ha').vysl }; },
  bazen(d, s, h) { const m3 = Q.mul(Q.mul(d, s), h), l = prevod(m3, 'm³', 'l').vysl; return { m3, l, t: prevod(Q.mul(l, VODA_KG_NA_L()), 'kg', 't').vysl }; },
  vana(l) { return { dm3: prevod(l, 'l', 'dm³').vysl, m3: prevod(l, 'l', 'm³').vysl }; },
  dazd(mm, plochaM2) { const h = prevod(mm, 'mm', 'm').vysl, m3 = Q.mul(h, plochaM2); return { h, m3, l: prevod(m3, 'm³', 'l').vysl }; },
  pozemok(ha) { return { m2: prevod(ha, 'ha', 'm²').vysl, a: prevod(ha, 'ha', 'a').vysl }; },
  kocka(a) { const cm3 = mocninaQ(a, 3); return { cm3, ml: prevod(cm3, 'cm³', 'ml').vysl, l: prevod(cm3, 'cm³', 'l').vysl }; }

const Nn = (a, j) => `${fmtHTML(a)}&nbsp;${jedHTML(j)}`;

/* =====================================================================
   ČASŤ 3 – ZLOŽENÉ JEDNOTKY (km/h, g/cm³, N·m …), TEPLOTA, REŤAZ ZLOMKOV
   ===================================================================== */
// jeden činiteľ zloženej jednotky: 'cm³' (je v registri), 's²' (s na druhú), 'm^2'
function cinitel(f) {
  const u = JED.get(f);
  if (u) return { u, e: 1 };
  const m = f.match(/^(.+?)([²³])$/) || f.match(/^(.+?)\^(\d+)$/);
  if (!m || !JED.get(m[1])) return null;
  return { u: JED.get(m[1]), e: m[2] === '²' ? 2 : m[2] === '³' ? 3 : parseInt(m[2], 10) };
}
/* Parser zložených jednotiek: "km/h", "g/cm³", "kg·m/s²", "N·m", "1/s".
   Rozmer aj faktor sa odvodia zo zložiek. Teplota (posun) a obchodné zápisy (dkg) do zložených nepatria. */
function zlozenaJednotka(sym) {
  if (typeof sym !== 'string') return null;
  const s = sym.replace(/\s+/g, '').replace(/[*⋅]/g, '·');
  if (!/[/·]/.test(s)) return null;
  if (ZLOZENE.has(s)) return ZLOZENE.get(s);
  const casti = s.split('/'), zlozky = [];
  const spracuj = (txt, zn) => {
    if (txt === '1' && zn > 0) return true;
    for (const f of txt.split('·')) {
      const c = f && cinitel(f);
      if (!c || c.u.posun || c.u.alias) return false;
      zlozky.push({ u: c.u, e: c.e * zn });
    }
    return true;
  };
  if (casti.length > 2 || !spracuj(casti[0], 1) || (casti.length === 2 && !spracuj(casti[1], -1)) || !zlozky.length) { ZLOZENE.set(s, null); return null; }
  const rozmer = {}; let faktor = Q.JEDNA;
  zlozky.forEach(({ u, e }) => {
    for (const k in u.rozmer) rozmer[k] = (rozmer[k] || 0) + u.rozmer[k] * e;
    const m = mocninaQ(u.faktor, Math.abs(e));
    faktor = e > 0 ? Q.mul(faktor, m) : Q.div(faktor, m);
  });
  // názov: „kilometer za hodinu“ (pri čase „za“), „gram na kubický centimeter“
  const H = zlozky.filter(z => z.e > 0), D = zlozky.filter(z => z.e < 0);
  const meno = (arr, aku) => arr.map(({ u, e }) => (aku ? u.nazovAku || u.nazov : u.nazov) + (Math.abs(e) === 2 ? ' na druhú' : Math.abs(e) === 3 ? ' na tretiu' : '')).join(' ' + T.pz3.krat + ' ');
  const zaCas = D.length === 1 && velicina(D[0].u.rozmer).id === 'cas';
  const nazov = (H.length ? meno(H) : '1') + (D.length ? ` ${zaCas ? T.pz3.za : T.pz3.na} ${meno(D, true)}` : '');
  const u = { id: s, zn: s, nazov, rozmer, faktor, posun: null, zaklad: s, predpona: null, zlozky };
  ZLOZENE.set(s, u);
  return u;
}

/* Teplota: °C ↔ K je POSUN, nie násobenie. K = °C + 273,15 (273,15 je presný zlomok 5463/20). */
function prevodTeploty(hodnota, z, na) {
  let K = Q.mul(hodnota, z.faktor);
  if (z.posun) K = Q.add(K, z.posun);
  const v = Q.div(na.posun ? Q.sub(K, na.posun) : K, na.faktor);
  return { vysl: v, z, na, hodnota, pomer: null, teplota: true };
}
// „20 °C = 20 + 273,15 K = 293,15 K“
function retazecTeploty(P, html) {
  const J = html ? jedHTML : x => x, F = html ? (a => `<b>${fmtHTML(a)}</b>`) : fmtText;
  const v = fmtText(P.hodnota), zz = J(P.z.zn), nz = J(P.na.zn);
  if (P.z.id === P.na.id) return `${v} ${zz} = ${F(P.vysl)} ${nz}`;
  return `${v} ${zz} = ${v} ${P.z.posun ? '+' : '−'} ${fmtText(P.z.posun || P.na.posun)} ${nz} = ${F(P.vysl)} ${nz}`;
}

// zaokrúhlenie na k desatinných miest (polovica nahor) – len na zobrazenie
function zaokruhli(a, k) {
  const m = 10n ** BigInt(k), n = (a.n < 0n ? -a.n : a.n) * m, r = (2n * n + a.d) / (2n * a.d);
  return Q.z(a.n < 0n ? -r : r, m);
}
const fmtZaokr = (a, k) => { const r = zaokruhli(a, k); return (Q.eq(r, a) ? '' : '≈ ') + Q.presneDesatinne(r); };

/* Reťaz zlomkov: 72 km/h · (1000 m / 1 km) · (1 h / 3600 s) = 20 m/s.
   Zložky pôvodnej a novej jednotky sa spárujú podľa rozmeru a exponentu. */
const zlozkyJednotky = u => u.zlozky || [{ u, e: 1 }];
function retazZlomkov(P) {
  if (!P || !P.pomer) return null;
  const A = zlozkyJednotky(P.z), B = zlozkyJednotky(P.na);
  if (A.length !== B.length) return null;
  const volne = B.map(() => true), pary = [];
  for (const a of A) {
    const j = B.findIndex((b, i) => volne[i] && b.e === a.e && rozmerKluc(b.u.rozmer) === rozmerKluc(a.u.rozmer));
    if (j < 0) return null;
    volne[j] = false; pary.push({ a: a.u, b: B[j].u, e: a.e });
  }
  return pary;
}
const zlomokSpan = (a, b) => (b ? `<span class="zlomok"><span>${a}</span><span>${b}</span></span>` : a);
function retazZlomkovHTML(P) {
  const pary = retazZlomkov(P);
  if (!pary) return null;
  const zmeny = pary.filter(p => p.a.id !== p.b.id);
  if (!zmeny.length) return { html: '', n: 0, zmeny };
  const RU = (u, i) => `<span class="ru" data-p="${i}">${esc(u.zn)}</span>`;
  const mocn = e => (Math.abs(e) > 1 ? `<sup>${Math.abs(e)}</sup>` : '');
  // prvý člen: pôvodná hodnota, jej jednotky hore a dole
  const hore = [fmtText(P.hodnota)], dole = [];
  pary.forEach(p => { const i = zmeny.indexOf(p); (p.e > 0 ? hore : dole).push((i >= 0 ? RU(p.a, i) : jedHTML(p.a.zn)) + mocn(p.e)); });
  let h = zlomokSpan(hore.join(' '), dole.join(' · '));
  const cit = [fmtText(P.hodnota)], men = [];
  zmeny.forEach((p, i) => {
    const k = Q.div(p.a.faktor, p.b.faktor), kt = fmtText(k);
    const vel = `${kt} ${jedHTML(p.b.zn)}`, mal = `1 ${RU(p.a, i)}`;
    h += ' · ' + (p.e > 0 ? zlomokSpan(vel, mal) : zlomokSpan(mal, vel)) + mocn(p.e);
    if (!Q.eq(k, Q.JEDNA)) (p.e > 0 ? cit : men).push(Math.abs(p.e) > 1 ? `${kt}${sup(Math.abs(p.e))}` : kt);
  });
  const cisla = cit.join(' · ') + (men.length ? ' : ' + men.join(' : ') : '');
  h += `<span class="rkon"> = ${cisla} ${jedHTML(P.na.zn)} = <b>${fmtHTML(P.vysl)}</b> ${jedHTML(P.na.zn)}</span>`;
  return { html: h, n: zmeny.length, zmeny };
}
// zobraz reťaz a postupne vyškrtávaj rovnaké jednotky (animácia podľa skutočného času)
function ukazRetaz(el, P) {
  if (el._anim) el._anim.stop();
  el._posledny = P;
  if (!P || P.zlyRozmer || P.chyba) { el.innerHTML = ''; return; }
  const RZ = retazZlomkovHTML(P);
  if (!RZ) { el.innerHTML = `<p class="mini">${T.pz3.retazNejde}</p>`; return; }
  if (!RZ.n) { el.innerHTML = `<p class="mini">${T.pz3.retazNic}</p>`; return; }
  el.innerHTML = `<div class="retazZl">${RZ.html}</div><p class="mini vyskrt"></p>`;
  const kon = $('.rkon', el), pozn = $('.vyskrt', el), n = RZ.n;
  el._anim = animuj(900 * n + 1100, p => {
    const t = p * (n + 1);
    for (let i = 0; i < n; i++) $$(`.ru[data-p="${i}"]`, el).forEach(s => s.classList.toggle('skrt', t >= i + .5));
    kon.style.opacity = Math.max(0, Math.min(1, (t - n) * 1.5));
    pozn.innerHTML = t >= n ? sub(T.pz3.vyskrtnute, { zoz: RZ.zmeny.map(z => `<b class="jed">${esc(z.a.zn)}</b>`).join(', '), na: esc(P.na.zn) }) : '';
  });
}

// h min s → sekundy (presne)
const hmsNaSekundy = (h, m, s) => Q.add(Q.add(prevod(h, 'h', 's').vysl, prevod(m, 'min', 's').vysl), s);
// sekundy → celé hodiny, celé minúty a zvyšok sekúnd
function rozlozCas(sek) {
  const h = sek.n / (sek.d * 3600n);
  let zv = Q.sub(sek, Q.z(h * 3600n));
  const m = zv.n / (zv.d * 60n);
  zv = Q.sub(zv, Q.z(m * 60n));
  return { h, m, s: zv };
}
function casText(r) {
  const c = [];
  if (r.h) c.push(`${r.h} h`);
  if (r.m) c.push(`${r.m} min`);
  if (r.s.n !== 0n || !c.length) c.push(`${fmtText(r.s)} s`);
  return c.join(' ');
}

// zoznam príkladov: ťuknutie nastaví prevodník

function initHustota() {
  const P = (h, z, na) => prevod(q(h), z, na).vysl;
  const cm3 = P('1', 'm³', 'cm³');
  $('#husKocka').innerHTML = sub(T.hus.kocka, { cm3: fmtText(cm3), g: fmtText(cm3), kg: fmtText(prevod(cm3, 'g', 'kg').vysl), gm3: fmtText(P('1', 'g/cm³', 'g/m³')), kgm3: fmtText(P('1', 'g/cm³', 'kg/m³')) });
  $('#husRovnake').innerHTML = sub(T.hus.rovnake, { a: fmtText(P('1', 'g/cm³', 'kg/dm³')), b: fmtText(P('1', 'g/cm³', 't/m³')) });
  const max = Math.max(...T.hus.latky.map(([, v]) => Number(q(v).n) / Number(q(v).d)));
  $('#husTab').innerHTML = `<thead><tr>${T.hus.tabHlav.map(h => `<th>${h}</th>`).join('')}<th></th></tr></thead><tbody>` +
    T.hus.latky.map(([l, v]) => {

// E = P · t: výkon v hocijakej jednotke výkonu, čas v hocijakej jednotke času
function energia(P, Pu, t, tu) {

  const Wh = Q.mul(W, h), J = Q.mul(W, s);
  return { W, h, s, Wh, kWh: prevod(Wh, 'Wh', 'kWh').vysl, J, kJ: prevod(J, 'J', 'kJ').vysl, MJ: prevod(J, 'J', 'MJ').vysl };
}

const TEPL = { c: q('20') };   // aktuálna teplota v °C (presný zlomok)
const NULA_K_C = () => prevod(Q.NULA, 'K', '°C').vysl;   // −273,15
function nastavTeplotu(c, zdroj) {
  const min = NULA_K_C();
  $('#tepPozn').textContent = Q.compare(c, min) < 0 ? T.tep.podNulou : '';
  if (Q.compare(c, min) < 0) c = min;
  TEPL.c = c;
  const K = prevod(c, '°C', 'K').vysl;
  if (zdroj !== 'C') $('#tepC').value = bezNbsp(fmtText(c));
  if (zdroj !== 'K') $('#tepK').value = bezNbsp(fmtText(K));
  if (zdroj !== 'sl') { const r = zaokruhli(c, 0); $('#tepSl').value = Number(r.n); }
  $$('#tepC, #tepK').forEach(el => el.classList.remove('zle'));
  $('#tepRetaz').innerHTML = retazecTeploty(prevod(c, '°C', 'K'), true);
  $('#tepViz').innerHTML = svgTeplomer(Number(c.n) / Number(c.d), fmtText(c), fmtText(K));
}
function svgTeplomer(c, cT, kT) {
  const y = t => 330 - (t + 273.15) * (300 / 473.15);   // °C → poloha (len na kreslenie)
  let s = `<svg class="viz tepl" viewBox="0 0 320 380" role="img" aria-label="teplomer so stupnicou °C a K">`;
  s += `<rect x="146" y="20" width="28" height="320" rx="14" fill="rgba(255,255,255,.06)" stroke="#e2e8f5" stroke-width="2"/>`;
  s += `<rect x="152" y="${y(c).toFixed(1)}" width="16" height="${(345 - y(c)).toFixed(1)}" fill="#ff7a6b"/><circle cx="160" cy="352" r="20" fill="#ff7a6b" stroke="#e2e8f5" stroke-width="2"/>`;
  for (let t = -250; t <= 200; t += 50) s += `<path d="M132 ${y(t).toFixed(1)}h14" stroke="#e2e8f5" stroke-width="2"/><text x="126" y="${(y(t) + 6).toFixed(1)}" text-anchor="end" class="m">${String(t).replace('-', '−')} °C</text>`;
  for (let k = 0; k <= 450; k += 50) s += `<path d="M174 ${y(k - 273.15).toFixed(1)}h14" stroke="#e2e8f5" stroke-width="2"/><text x="194" y="${(y(k - 273.15) + 6).toFixed(1)}" class="m">${k} K</text>`;
  s += `<path d="M96 ${y(c).toFixed(1)}h128" stroke="#ffd88a" stroke-width="2.5" stroke-dasharray="5 4"/>`;
  s += `<text x="8" y="${(y(c) - 8).toFixed(1)}" class="g">${esc(cT)} °C</text><text x="312" y="${(y(c) - 8).toFixed(1)}" text-anchor="end" class="g">${esc(kT)} K</text>`;
  return s + '</svg>';
}
