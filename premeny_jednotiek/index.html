/* ----- KARTA: KVÍZ – otázky sa generujú, správna odpoveď sa počíta z registra ----- */
// odpoveď: desatinná čiarka aj bodka, medzery po tisícoch, zlomok 250/9
function citajOdpoved(t) {
  const s = String(t == null ? '' : t).replace(/[\s   ]+/g, '').replace(/−/g, '-');
  const m = s.match(/^([+-]?\d+)\/(\d+)$/);
  if (m) return BigInt(m[2]) === 0n ? { chyba: T.chyby.zle } : { q: Q.z(BigInt(m[1]), BigInt(m[2])) };
  return Q.parse(t);
}
const overKviz = (o, t) => { const r = citajOdpoved(t); return !!r.q && Q.eq(r.q, o.hodnota); };
// „pekné“ číslo do kvízu: presný konečný desatinný zápis, nanajvýš maxSig platných číslic
const pekne = (a, maxSig = 9) => a.n !== 0n && Q.konecne(a) && fmt(a).presne && Q.roundSig(a, maxSig).presne && Q.exp10(a) >= -6 && Q.exp10(a) <= 12;
function kvCislo(u) {
  if (u === 1) return Q.z(BigInt(nahoda(1, 50)));
  return Math.random() < .4 ? Q.z(BigInt(nahoda(2, 900))) : nahodneDesatinne(u === 2 ? 99 : 50, 2);
}
const kvCislene = (typ, text, hodnota, jed, vysv, nezavisle) => ({ typ, text, vstup: true, hodnota, jed, vysv, nezavisle });
const kvVolba = (typ, text, moznosti, spravna, vysv, jeSpravna) => ({ typ, text, vstup: false, moznosti, spravna, vysv, jeSpravna });
const kompatibilne = (a, b) => rozmerKluc(jednotka(a).rozmer) === rozmerKluc(jednotka(b).rozmer);
const naZaklad = (v, id) => Q.mul(v, jednotka(id).faktor);   // nezávislý výpočet priamo z faktorov registra

const GEN_KVIZ = {
  prevod(u) {
    for (let p = 0; p < 400; p++) {
      let z, na;
      if (u === 1) [z, na] = zamiesaj(vyber(R.kviz.prevod1));
      else {
        const zoz = R.zoznamy[vyber(R.kviz['prevod' + u])];
        z = vyber(zoz); na = vyber(zoz.filter(x => x !== z && kompatibilne(x, z)) || []);
        if (!na) continue;
      }
      let v = kvCislo(u);
      if (u === 1) { const r = Q.div(jednotka(z).faktor, jednotka(na).faktor); if (r.d !== 1n) v = Q.div(v, r); }
      const P = prevod(v, z, na);
      if (!pekne(v) || !pekne(P.vysl)) continue;
      return kvCislene('prevod', sub(T.kviz.otazky.prevod, { v: fmtText(v), z: jedHTML(z), na: jedHTML(na) }), P.vysl, na, retazec(P, true),
        () => Q.div(naZaklad(v, z), jednotka(na).faktor));
    }
    return GEN_KVIZ.prevod(1);
  },
  vacsie(u) {
    const zoznamy = R.kviz.vacsie[u - 1];
    for (let p = 0; p < 400; p++) {
      const zoz = R.zoznamy[vyber(zoznamy)], a = vyber(zoz), b = vyber(zoz.filter(x => x !== a && kompatibilne(x, a)));
      if (!b) continue;
      const A = kvCislo(Math.min(u, 2)), B = Q.mul(prevod(A, a, b).vysl, q(vyber(R.kviz.vacsieKrat)));
      if (!pekne(A, 6) || !pekne(B, 6)) continue;
      const cmp = Q.compare(A, prevod(B, b, a).vysl);
      const moz = [`${fmtText(A)} ${jedHTML(a)}`, `${fmtText(B)} ${jedHTML(b)}`, T.kviz.otazky.rovnako];
      return kvVolba('vacsie', T.kviz.otazky.vacsie, moz, cmp > 0 ? 0 : cmp < 0 ? 1 : 2,
        sub(T.kviz.vysvVacsie, { a: moz[0], b: `${fmtText(prevod(A, a, b).vysl)} ${jedHTML(b)}` }),
        i => { const x = Q.compare(naZaklad(A, a), naZaklad(B, b)); return i === (x > 0 ? 0 : x < 0 ? 1 : 2); });
    }
    return GEN_KVIZ.prevod(u);
  },
  predpona() {
    const o = generujOtazkyPredpon(1)[0], p = o.p;
    const kluc = { slovo: x => x.slovo, mocnina: x => x.e, znacka: x => x.zn, zMocniny: x => x.e }[o.typ];
    return kvVolba('predpona', textOtazky(o), o.moz.map(x => textMoznosti(o, x)), o.moz.indexOf(p),
      sub(T.pred.hraVysv, { nazov: p.nazov, zn: esc(p.zn), slovo: p.slovo, e: sup(p.e) }), i => kluc(o.moz[i]) === kluc(p));
  },
  symbol() {
    const id = vyber(R.kviz.symboly), u = jednotka(id);
    // všetky kombinácie veľkých a malých písmen; najprv tie, ktoré sú tiež jednotkami (mm pri Mm)
    let var_ = [''];
    for (const ch of id) { const lo = ch.toLowerCase(), up = ch.toUpperCase(); var_ = var_.flatMap(x => (lo === up ? [x + ch] : [x + lo, x + up])); }
    var_ = zamiesaj([...new Set(var_)].filter(x => x !== id));
    var_.sort((x, y) => (JED.has(y) ? 1 : 0) - (JED.has(x) ? 1 : 0));
    const moz = zamiesaj([id, ...var_.slice(0, 3)]);
    return kvVolba('symbol', sub(T.kviz.otazky.symbol, { nazov: u.nazov }), moz.map(x => `<span class="jed">${esc(x)}</span>`), moz.indexOf(id),
      sub(T.kviz.vysvSymbol, { nazov: u.nazov, zn: esc(id) }), i => { const j = JED.get(moz[i]); return !!j && j.nazov === u.nazov; });
  },
  rychlost(u) {
    const kmh = Math.random() < .5;
    const v = kmh ? Q.z(BigInt(18 * nahoda(1, 10))) : (u === 3 ? Q.z(BigInt(nahoda(1, 80)), 2n) : Q.z(BigInt(nahoda(1, 40))));
    const z = kmh ? 'km/h' : 'm/s', na = kmh ? 'm/s' : 'km/h', P = prevod(v, z, na);
    return kvCislene('rychlost', sub(T.kviz.otazky.prevod, { v: fmtText(v), z: jedHTML(z), na: jedHTML(na) }), P.vysl, na, retazec(P, true),
      () => (kmh ? Q.div(Q.mul(v, Q.z(1000n)), Q.z(3600n)) : Q.div(Q.mul(v, Q.z(3600n)), Q.z(1000n))));
  },
  energia() {
    for (let p = 0; p < 400; p++) {
      const [Ph, Pu] = vyber(R.kviz.vykony), [th, tu] = vyber(R.kviz.casy), Pv = q(Ph), tv = q(th), E = energia(Pv, Pu, tv, tu);
      if (!pekne(E.kWh, 6)) continue;
      return kvCislene('energia', sub(T.kviz.otazky.energia, { P: `${fmtText(Pv)} ${jedHTML(Pu)}`, t: `${fmtText(tv)} ${jedHTML(tu)}` }), E.kWh, 'kWh',
        sub(T.kviz.vysvEnergia, { P: Nn(E.W, 'W'), t: Nn(E.h, 'h'), Wh: fmtHTML(E.Wh), kWh: fmtHTML(E.kWh) }),
        () => Q.div(Q.mul(naZaklad(Pv, Pu), naZaklad(tv, tu)), q('3600000')));
    }
    return GEN_KVIZ.prevod(2);
  },
  chyba(u) {
    for (let p = 0; p < 400; p++) {
      const ret = vyber(R.kviz.chybaRetaze), i0 = nahoda(0, ret.length - 4);
      let units = ret.slice(i0, i0 + 4);
      if (Math.random() < .4) units = units.reverse();
      const a = kvCislo(Math.min(u, 2)), c = nahoda(0, 2), kroky = [];
      let x = a, ok = pekne(a, 8);
      for (let k = 0; k < 3 && ok; k++) {
        const z = units[k], na = units[k + 1], spr = prevod(x, z, na).vysl;
        let y = spr;
        if (k === c) {
          const r = Q.div(jednotka(z).faktor, jednotka(na).faktor);
          y = vyber([Q.div(x, r), Q.mul(spr, Q.z(10n)), Q.div(spr, Q.z(10n))]);   // opačný smer alebo zlý počet núl
          if (Q.eq(y, spr)) y = Q.mul(spr, Q.z(10n));
        }
        kroky.push({ z, na, x, y, spr });
        ok = pekne(y, 8) && pekne(spr, 8);
        x = y;
      }
      if (!ok) continue;
      const moz = kroky.map((s, i) => `${sub(T.kviz.krok, { i: i + 1 })}: ${fmtText(s.x)} ${jedHTML(s.z)} = ${fmtText(s.y)} ${jedHTML(s.na)}`);
      const zly = kroky[c];
      return kvVolba('chyba', sub(T.kviz.otazky.chyba, { v: `${fmtText(a)} ${jedHTML(units[0])}`, na: jedHTML(units[3]) }), moz, c,
        sub(T.kviz.vysvChyba, { i: c + 1, spr: `${fmtText(zly.x)} ${jedHTML(zly.z)} = <b>${fmtText(zly.spr)}</b> ${jedHTML(zly.na)}` }),
        i => !Q.eq(kroky[i].y, Q.div(naZaklad(kroky[i].x, kroky[i].z), jednotka(kroky[i].na).faktor)));
    }
    return GEN_KVIZ.prevod(u);
  }
};
// kvíz: n otázok, typy sa striedajú podľa úrovne (0 = zmiešaný)
function vytvorKviz(u, n = 12) {
  const typy = u ? R.kviz.typy[u - 1] : [...new Set(R.kviz.typy.flat())];
  const out = [];
  let rad = [], poistka = 0;
  while (out.length < n && poistka++ < 500) {
    if (!rad.length) rad = zamiesaj(typy);
    const ur = u || nahoda(1, 3), o = GEN_KVIZ[rad.pop()](ur);
    if (o && !out.some(x => x.text === o.text && String(x.moznosti) === String(o.moznosti))) { o.uroven = ur; out.push(o); }
  }
  return out;
}
const KV = { u: 1, ot: [], i: 0, s: 0, hotovo: false };
function initKviz() {
  $('#kvUrovne').innerHTML = T.kviz.urovne.map((t, i) => `<button data-u="${(i + 1) % 4}">${t}</button>`).join('');
  $$('#kvUrovne button').forEach(b => b.onclick = () => { KV.u = +b.dataset.u; novyKviz(); });
  $('#kvNova').textContent = T.kviz.nova;
  $('#kvNova').onclick = novyKviz;
  novyKviz();
}
function novyKviz() {
  $$('#kvUrovne button').forEach(b => b.classList.toggle('on', +b.dataset.u === KV.u));
  KV.ot = vytvorKviz(KV.u); KV.i = 0; KV.s = 0;
  ukazKviz();
}
const spravnaKviz = o => (o.vstup ? `${fmtHTML(o.hodnota)} ${jedHTML(o.jed)}` : o.moznosti[o.spravna]);
function ukazKviz() {
  const el = $('#kvOtazka'), n = KV.ot.length;
  $('#kvPokrok').style.width = (100 * KV.i / n) + '%';
  if (KV.i >= n) { el.innerHTML = `<div class="q">${sub(T.kviz.koniec, { s: KV.s, n })}${KV.s === n ? T.kviz.koniecVsetko : ''}</div>`; return; }
  const o = KV.ot[KV.i];
  KV.hotovo = false;
  el.innerHTML = `<div class="por">${sub(T.kviz.poradie, { i: KV.i + 1, n, u: o.uroven })}</div><div class="q">${o.text}</div>` +
    (o.vstup
      ? `<div class="kvVstup"><input class="txt" id="kvIn" autocomplete="off" spellcheck="false" enterkeyhint="done" aria-label="odpoveď"> ${jedHTML(o.jed)} <button class="primary" id="kvOver">${T.kviz.over}</button></div><p class="mini">${T.kviz.formaty}</p>`
      : `<div class="moznosti${o.typ === 'chyba' ? ' stlp' : ''}">${o.moznosti.map((m, j) => `<button data-j="${j}">${m}</button>`).join('')}</div>`) +
    `<div class="fb" aria-live="polite"></div><p class="skore">${sub(T.ui.skore, { s: KV.s, n })}</p>`;
  if (o.vstup) {
    const over = () => {
      if (KV.hotovo) return;
      const r = citajOdpoved($('#kvIn').value), fb = $('.fb', el);
      if (r.prazdne) { fb.className = 'fb'; fb.textContent = T.kviz.prazdne; return; }
      if (r.chyba) { fb.className = 'fb zle'; fb.textContent = r.chyba; $('#kvIn').classList.add('zle'); return; }
      $('#kvIn').classList.remove('zle'); $('#kvOver').disabled = true;
      vyhodnotKviz(o, Q.eq(r.q, o.hodnota));
    };
    $('#kvOver').onclick = over;
    $('#kvIn').addEventListener('keydown', e => { if (e.key === 'Enter') { if (KV.hotovo) { KV.i++; ukazKviz(); } else over(); } });
  } else {
    $$('.moznosti button', el).forEach(b => b.onclick = () => {
      if (KV.hotovo) return;
      $$('.moznosti button', el).forEach(x => { x.disabled = true; if (+x.dataset.j === o.spravna) x.classList.add('ok'); });
      const ok = +b.dataset.j === o.spravna;
      if (!ok) b.classList.add('zle');
      vyhodnotKviz(o, ok);
    });
  }
}
function vyhodnotKviz(o, ok) {
  KV.hotovo = true;
  if (ok) KV.s++;
  const el = $('#kvOtazka'), fb = $('.fb', el), n = KV.ot.length;
  fb.className = 'fb ' + (ok ? 'ok' : 'zle');
  fb.innerHTML = `<b>${ok ? T.kviz.ok : sub(T.kviz.zle, { v: spravnaKviz(o) })}</b><span class="post">${o.vysv}</span>`;
  $('.skore', el).innerHTML = sub(T.ui.skore, { s: KV.s, n });
  const d = document.createElement('button'); d.className = 'primary'; d.textContent = KV.i + 1 < n ? T.kviz.dalsia : '✓';
  d.style.marginTop = '10px'; d.onclick = () => { KV.i++; ukazKviz(); };
  fb.appendChild(document.createElement('br')); fb.appendChild(d); d.focus({ preventScroll: true });
}

  [['250', 'mA', 'A', '0,25'], ['0,02', 'A', 'mA', '20'], ['3,3', 'kΩ', 'Ω', '3300'], ['4,7', 'MΩ', 'Ω', '4 700 000'], ['230', 'V', 'kV', '0,23'],
   ['15', 'mV', 'V', '0,015'], ['2,4', 'GHz', 'MHz', '2400'], ['50', 'Hz', 'kHz', '0,05'], ['100', 'MHz', 'Hz', '100 000 000']]
    .forEach(([h, z, na, c]) => over(`${h} ${z} → ${na}`, prevT(h, z, na), c));
  // 6. teplota (presne, zlomkami)
  [['0', '°C', 'K', '273,15'], ['100', '°C', 'K', '373,15'], ['20', '°C', 'K', '293,15'], ['0', 'K', '°C', '−273,15']]
    .forEach(([h, z, na, c]) => over(`${h} ${z} → ${na}`, prevT(h, z, na), c));
  over('posun 273,15 je presný zlomok', `${jednotka('°C').posun.n}/${jednotka('°C').posun.d}`, '5463/20');
  over('reťazec 20 °C → K', bezNbsp(retazec(prevod(q('20'), '°C', 'K'))), '20 °C = 20 + 273,15 K = 293,15 K');
  over('pomer 20 °C a 10 °C v kelvinoch', fmtZaokr(Q.div(prevod(q('20'), '°C', 'K').vysl, prevod(q('10'), '°C', 'K').vysl), 3), '≈ 1,035');
  // 7. rozmery
  over('1 kWh → J povolené, 1 Wh → J', `${!prevod(q('1'), 'kWh', 'J').chyba}, ${prevT('1', 'Wh', 'J')}`, 'true, 3600');
  over('kW → kWh zamietnuté', prevod(q('1'), 'kW', 'kWh').chyba, 'Výkon nemožno premeniť na energiu, sú to rôzne veličiny.');
  over('km/h → km zamietnuté', prevod(q('1'), 'km/h', 'km').chyba, 'Rýchlosť nemožno premeniť na dĺžku, sú to rôzne veličiny.');
  [['N', 'kg·m/s²'], ['Pa', 'N/m²'], ['J', 'N·m'], ['W', 'J/s'], ['V', 'W/A'], ['Ω', 'V/A'], ['Hz', '1/s'], ['kWh', 'kW·h']].forEach(([a, b]) => {
    const A = jednotka(a), B = jednotka(b);
    over(`${a} = ${b} (rozmer aj faktor z registra)`, !!A && !!B && Q.eq(A.faktor, B.faktor) && rozmerKluc(A.rozmer) === rozmerKluc(B.rozmer), true);
  });
  over('parser: názvy zložených jednotiek', ['km/h', 'g/cm³', 'kg·m/s²'].map(u => jednotka(u).nazov).join(' | '), 'kilometer za hodinu | gram na kubický centimeter | kilogram krát meter za sekundu na druhú');
  over('parser odmietne km/xyz, °C/s, dkg/l, m/s/s, kmin/h', ['km/xyz', '°C/s', 'dkg/l', 'm/s/s', 'kmin/h'].filter(u => jednotka(u)).join(', ') || 'všetky', 'všetky');
  // 8. tam a späť v každej skupine
  ['cas', 'rychlost', 'hustota', 'sila', 'energia', 'vykon', 'prud', 'napatie', 'odpor', 'frekvencia', 'teplota'].forEach(id => {
    const ids = [...new Set([...[...JED.values()].filter(u => !u.alias && velicina(u.rozmer).id === id).map(u => u.id), ...(R.zoznamy[id] || [])])];
    over(`tam a späť: ${id} (${ids.join(', ')})`, sada(ids), `${ids.length ** 2 * 7}/${ids.length ** 2 * 7}`);
  });
  // ===== ČASŤ 4 =====
  // kalkulačka: tam a späť pre všetky dvojice kompatibilných jednotiek, nenulové faktory, jedinečné značky
  const zleK = [], idsK = [];
  for (const k in R.kalkulacka) {
    const ids = kalkSkupiny(k).flatMap(([, i]) => i);
    idsK.push(...ids);
    ids.forEach(id => { const u = jednotka(id); if (!u) zleK.push('chýba ' + id); else if (u.faktor.n === 0n) zleK.push('nulový faktor ' + id); });
    for (const a of ids) for (const b of ids) if (jednotka(a) && jednotka(b) && kompatibilne(a, b)) for (const h of hodnoty) if (!Q.eq(prevod(prevod(h, a, b).vysl, b, a).vysl, h)) zleK.push(`${a} → ${b}`);
  }
  over(`kalkulačka: ${Object.keys(R.kalkulacka).length} skupín, tam a späť, nenulové faktory`, zleK.length ? zleK.slice(0, 5).join(', ') : 'prešlo', 'prešlo');
  over('značky v kalkulačke sú jedinečné', idsK.length === new Set(idsK).size, true);
  const vsetkyZn = [...JED.values()].map(u => u.zn);
  over(`značky v registri sú jedinečné (${vsetkyZn.length})`, vsetkyZn.length === new Set(vsetkyZn).size, true);
  // 7. kvíz: 1000 otázok – odpoveď súhlasí s nezávislým výpočtom, možnosti sa neopakujú, práve jedna je správna
  const zleQ = [], druhy = {};
  for (let i = 0; i < 1000; i++) {
    const u = 1 + (i % 3), typy = R.kviz.typy[u - 1], o = GEN_KVIZ[typy[Math.floor(i / 3) % typy.length]](u);
    druhy[o.typ] = (druhy[o.typ] || 0) + 1;
    if (o.vstup) {
      if (!Q.eq(o.hodnota, o.nezavisle())) zleQ.push(`${o.typ}: nesúhlasí`);
      if (!fmt(o.hodnota).presne) zleQ.push(`${o.typ}: nepresná odpoveď`);
      if (!overKviz(o, fmt(o.hodnota).text) || overKviz(o, fmtText(Q.add(o.hodnota, Q.JEDNA)))) zleQ.push(`${o.typ}: kontrola odpovede`);
    } else {
      if (new Set(o.moznosti).size !== o.moznosti.length) zleQ.push(`${o.typ}: opakujú sa možnosti`);
      const spr = o.moznosti.map((_, j) => o.jeSpravna(j));
      if (spr.filter(Boolean).length !== 1 || !spr[o.spravna]) zleQ.push(`${o.typ}: nie je práve jedna správna`);
    }
  }
  over(`1000 kvízových otázok (${Object.entries(druhy).map(([k, n]) => k + ' ' + n).join(', ')})`, zleQ.length ? zleQ.slice(0, 4).join(' | ') + ` (${zleQ.length})` : 'prešlo', 'prešlo');
  over('kvíz: čítanie odpovede „250/9“, „27.5“, „1 000“, „abc“', ['250/9', '27.5', '1 000', 'abc'].map(t => { const r = citajOdpoved(t); return r.q ? `${r.q.n}/${r.q.d}` : 'chyba'; }).join(', '), '250/9, 55/2, 1000/1, chyba');
  over('kvíz: kolo má 12 otázok (úrovne 1, 2, 3, zmiešaný)', [1, 2, 3, 0].map(u => vytvorKviz(u).length).join(','), '12,12,12,12');
  over('v súbore nie sú zvyšky „TODO“', /TODO\s+časť/.test(document.documentElement.outerHTML.replace(/TODO\\s\+časť/g, '')) ? 'sú' : 'nie', 'nie');
  // 6. externé skripty a vzhľad
  const adresy = (document.documentElement.outerHTML.match(/(https?:)?\/\/[a-z0-9.-]+\.[a-z]{2,}/gi) || []).filter(a => !/goatcounter\.com|gc\.zgo\.at/.test(a));
  over('externé adresy okrem GoatCounter', adresy.length ? adresy.join(', ') : 'žiadne', 'žiadne');
  const ext = [...document.scripts].filter(s => s.src);
  over('externé skripty', `${ext.length}, GoatCounter: ${!!ext[0] && ext[0].src.includes('gc.zgo.at')}, posledný v <body>: ${document.body.lastElementChild === ext[0]}`, '1, GoatCounter: true, posledný v <body>: true');
  over('vodorovné pretečenie stránky', document.documentElement.scrollWidth > window.innerWidth + 1 ? `áno (${document.documentElement.scrollWidth} > ${window.innerWidth})` : 'nie', 'nie');
  const el = $('#testy'); el.hidden = false;
  el.innerHTML = `<div class="card"><h2>Testy: ${v.filter(x => x.ok).length} / ${v.length} prešlo</h2><table>${v.map(x => `<tr><td class="${x.ok ? 'ok' : 'zle'}">${x.ok ? '✓' : '✗'}</td><td>${esc(x.test)}</td><td>${esc(x.dostal)}</td><td>${x.ok ? '' : 'čakal: ' + esc(x.cakal)}</td></tr>`).join('')}</table></div>`;
  console.table(v);
  return v;
}

/* =====================================================================
   ŠTART
   ===================================================================== */
function init() {
  $$('[data-t]').forEach(el => { const t = cesta(TEXTY, el.dataset.t); if (typeof t === 'string') el.innerHTML = t; });
  initMenu();
  initPredpony();
  initDlzka();
  initPlocha(); initObjem(); initNestandardne(); initPrax();   // časť 2
  initCas(); initHustota(); initEnergia(); initElektrina(); initTeplota();   // časť 3
  initKalkulacka(); initOmyly(); initKviz();   // časť 4
  let caka = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(caka); caka = requestAnimationFrame(() => PRI_ZOBRAZENI.forEach(f => f())); });
  const h = (location.hash || '').slice(1);
  ukazKartu(PORADIE_KARIET.some(x => x.k === h) ? h : PORADIE_KARIET[0].k);
  if (/[?&]test\b/.test(location.search)) spustiTesty();
}
init();
