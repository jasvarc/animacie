.hraRad{background:rgba(243,180,83,.05);border:1px solid rgba(243,180,83,.3)}
.slot,.miesto{width:62px;height:62px;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative}
.slot{border:2px dashed rgba(243,180,83,.45)}
.slot .poz{position:absolute;top:1px;left:5px;font-size:16px;color:var(--muted);line-height:1}
.slot.nad,.hraPonuka.nad{outline:3px solid var(--gold2);outline-offset:2px}
.tah{width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:rgba(255,255,255,.05)}
.tah:hover{background:rgba(255,255,255,.12)}
.tah.zdroj{opacity:.25}
.tah.duch{position:fixed;z-index:50;pointer-events:none;cursor:grabbing;background:rgba(30,40,70,.9);box-shadow:0 8px 24px rgba(0,0,0,.6);transform:scale(1.12)}
.pokrok{height:12px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0}
.pokrok>div{height:100%;background:linear-gradient(90deg,#f3b453,#ffd88a);width:0;transition:width .4s}
.hraStav{font-size:17px;min-height:3em;margin-top:8px}
.hraStav b{color:var(--gold2)}

/* ===== Okrúhly stôl ===== */
.stolObal{max-width:340px;margin:0 auto}
.otocenia{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;font-size:18px;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.otocenia span{padding:2px 10px;border-radius:8px;border:1px solid var(--line)}
.otocenia span.akt{border-color:var(--gold);color:var(--gold2);background:rgba(243,180,83,.12)}

/* ===== Časť 2: variácie a kombinácie ===== */
.skrat{font-size:21px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.skrat .radV{margin-bottom:8px}
.zlomok{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:middle;margin:0 .2em;max-width:100%}
.zlomok>.zc{border-bottom:2px solid currentColor;padding:0 .3em 4px}
.zlomok>.zm{padding:4px .3em 0}
.zlomok.velky>.zc,.zlomok.velky>.zm{display:flex;flex-wrap:wrap;justify-content:center;gap:0 .35em}
.skrat .f{transition:opacity .3s,color .3s;white-space:nowrap}
.skrat .f.pre{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--red);opacity:.4}
.skrat .f.ost.zv{color:var(--gold2)}
.skrat .vys{margin-top:10px;color:var(--gold2);font-size:23px}
.binom{display:inline-flex;align-items:center;vertical-align:middle;gap:1px;font-weight:700}
.binom .bz{font-size:2.3em;font-weight:300;line-height:1}
.binom .bs{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.box.akt{outline:3px solid var(--gold);outline-offset:1px}
.sl{display:block;margin-top:8px}
.sl .lbl{display:flex;justify-content:space-between;gap:10px;font-size:18px}
.sl .lbl b{color:var(--gold2);font-variant-numeric:tabular-nums;font-size:20px}
.slRiadok{display:flex;align-items:center;gap:8px}
.slRiadok button{min-width:48px;font-size:20px;font-weight:700;padding:4px 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:rgba(255,255,255,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--gold);border:3px solid #1a0e02;box-shadow:0 0 0 2px var(--gold)}
input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--gold);border:3px solid #1a0e02}
.chk{display:flex;gap:10px;align-items:center;margin:4px 0;cursor:pointer;min-height:44px}
.chk input{width:24px;height:24px;accent-color:var(--gold);flex:none}
.chk .poc{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.zch{display:inline-flex;gap:1px;padding:3px 5px;border-radius:7px;background:rgba(255,255,255,.05);border:2px solid rgba(140,160,215,.18);cursor:pointer;will-change:transform}
.zch.rovn{border:2px solid var(--gold);background:rgba(243,180,83,.2)}
.skupiny{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:8px;margin-top:8px}
.skupina{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:rgba(255,255,255,.02)}
.skupina b{display:block;font-size:16px;color:var(--gold2);margin-bottom:4px}
.skupina .zoznam{margin-top:0;gap:4px}
.sym{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sym button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px 4px;min-width:56px}
.sym button .zn{font-size:18px;font-weight:800;line-height:1}
.sym button.ano{border:2px solid var(--gold);background:rgba(243,180,83,.18)}
.sym button.ano .zn{color:var(--gold2)}
.sym button.nie{border:2px dashed var(--line);opacity:.65}
.pasObal{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;padding-bottom:4px}
.pascal{min-width:530px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}
.pr{display:flex;gap:3px;align-items:center}
.pc{min-width:37px;min-height:37px;padding:0 3px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;border-radius:8px;border:2px solid transparent;background:rgba(111,180,255,.1)}
.pc.riad{background:rgba(243,180,83,.18)}
.pc.bin{box-shadow:inset 0 -4px 0 var(--violet)}
.pc.rod{border:2px dashed var(--blue);background:rgba(111,180,255,.3)}
.pc.zrk{border:2px dotted var(--violet);background:rgba(185,163,255,.28)}
.pc.diag{border:2px solid var(--green);background:rgba(127,220,143,.22)}
.pc.vyb{border:2px solid var(--gold);background:rgba(243,180,83,.38);color:#fff}

/* ===== Časť 3: s opakovaním, ako rozhodnúť ===== */
.rozsir{display:inline-block;font-size:16px;font-weight:700;color:#160d2c;background:var(--violet);border-radius:999px;padding:3px 12px;margin-bottom:10px}
.pis{font-weight:800;padding:0 1px;font-size:18px}
.pis sub{font-size:.68em;font-weight:700}
.pis.c1{color:#ffd88a}.pis.c2{color:#6fb4ff}.pis.c3{color:#7fdc8f}.pis.c4{color:#ff9ad5}.pis.c5{color:#b9a3ff}
.zch.slovo{padding:3px 7px}
table.rozpis{border-collapse:collapse;font-size:17px;font-variant-numeric:tabular-nums;margin:4px 0 8px}
table.rozpis th,table.rozpis td{padding:4px 12px;border-bottom:1px solid rgba(140,160,215,.15);text-align:center}
table.rozpis th{color:var(--muted);font-weight:600;font-size:16px}
input.txt{height:48px;font:inherit;font-size:20px;font-weight:700;letter-spacing:.06em;padding:0 12px;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;width:100%;max-width:300px}
input.txt.zle,input.num.zle{border-color:var(--red)}
.vlajka{display:inline-flex;width:26px;height:30px;border-radius:3px;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#0b0f1a}
.gp{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.gp button{min-width:50px;min-height:58px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.gp button.pr{background:transparent;border:2px dashed var(--line)}
.gp button.pr i{display:block;width:7px;height:42px;border-radius:3px;background:var(--text)}
.gp button.ko{border:2px solid var(--gold);background:rgba(243,180,83,.12)}
.pohar{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;min-height:58px;padding:8px 14px;border:3px solid var(--muted);border-top:none;border-radius:0 0 26px 26px;max-width:300px;margin:6px 0 10px}
.kocky{display:grid;grid-template-columns:auto repeat(6,minmax(0,1fr));gap:4px;max-width:440px;font-variant-numeric:tabular-nums;margin:8px 0}
.kocky .h{color:var(--muted);text-align:center;font-weight:700;align-self:center;padding:0 4px}
.kocky .b{min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:16px;font-weight:700}
.kocky .b.ok{border:2px solid var(--gold);background:rgba(243,180,83,.16)}
.kocky .b.dup{border:2px dashed var(--line);color:var(--muted)}
ul.cesta{list-style:none;padding:0;margin:8px 0}
ul.cesta li{padding:6px 10px;border-left:4px solid var(--gold);background:rgba(243,180,83,.07);margin:4px 0;border-radius:0 8px 8px 0;font-size:16px}
ul.cesta li b{color:var(--gold2)}
.spOt{padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);animation:prechod .28s ease-out}
.spOt .q{font-size:20px;font-weight:700;margin-bottom:6px}
.spOt .moznosti button{flex:1 1 200px}
.kaRiadok{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.kaRiadok>span{min-width:2.4em;font-size:20px;font-weight:700}
.kaRiadok.opak{flex-direction:column;align-items:flex-start}
.kaRiadok.opak>span{font-size:16px;font-weight:400;color:var(--muted)}
.kaNazov{color:var(--gold2);font-weight:700;margin:4px 0}
table.typy{border-collapse:collapse;width:100%;font-size:16px}
table.typy th{color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.typy td{padding:8px;border-bottom:1px solid rgba(140,160,215,.12);vertical-align:top}
table.typy td:first-child b{color:var(--gold2)}
table.typy tbody tr{cursor:pointer}
table.typy tbody tr:hover td,table.typy tbody tr:focus-visible td{background:rgba(255,255,255,.06)}
.moznosti.typyBtn button{min-width:0;flex:1 1 150px;font-size:16px}

/* ===== Časť 4: pravdepodobnosť, omyly, kvíz ===== */
.steny{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.stena{border-radius:12px;padding:3px;border:3px dashed transparent;position:relative}
.stena.ok{border:3px solid var(--gold);background:rgba(243,180,83,.14)}
.stena.ok::after,.k36 .b.ok::after{content:'✓';position:absolute;top:-2px;right:3px;font-size:14px;font-weight:800;color:var(--gold2)}
.k36{display:grid;grid-template-columns:auto repeat(6,minmax(0,1fr));gap:4px;max-width:460px;margin:8px 0;font-variant-numeric:tabular-nums}
.k36 .h{color:var(--muted);text-align:center;font-weight:700;align-self:center;font-size:16px}
.k36 .b{position:relative;min-height:44px;padding:0;font-size:16px;font-weight:700;border:2px dashed var(--line);background:rgba(255,255,255,.03)}
.k36 .b.ok{border:2px solid var(--gold);background:rgba(243,180,83,.22);color:var(--gold2)}
.k36 .roh{font-size:16px;color:var(--muted);text-align:center}
.stupnica{position:relative;height:16px;border-radius:8px;background:linear-gradient(90deg,rgba(255,122,107,.35),rgba(243,180,83,.35),rgba(127,220,143,.35));margin:18px 0 6px}
.stupnica b{position:absolute;top:-7px;width:6px;height:30px;margin-left:-3px;border-radius:3px;background:var(--gold2);box-shadow:0 0 0 2px #1a0e02;transition:left .35s}
.stupLbl{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:16px}
.pravd{font-variant-numeric:tabular-nums}
.pravd .pr{white-space:nowrap}
table.distr{border-collapse:collapse;width:100%;max-width:440px;font-size:16px;font-variant-numeric:tabular-nums;margin:6px 0}
table.distr td,table.distr th{padding:4px 8px;border-bottom:1px solid rgba(140,160,215,.12);text-align:right}
table.distr th{color:var(--muted);font-weight:600}
table.distr td:first-child,table.distr th:first-child{text-align:left}
table.distr tr.vyb td{background:rgba(243,180,83,.16);color:var(--gold2);font-weight:700}
.typBox{margin-top:10px;padding:8px 12px;border-radius:10px;background:rgba(185,163,255,.1);border:1px solid rgba(185,163,255,.4);font-size:16px}
.typBox b{color:var(--violet)}
.dvojice{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.dvojice span{padding:4px 10px;border-radius:8px;border:2px dashed var(--line);font-weight:700}
.dvojice span.ok{border:2px solid var(--gold);background:rgba(243,180,83,.2);color:var(--gold2)}
.omylKarta .zleC{transition:opacity .3s}
.omylKarta .zleC.pre{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--red);opacity:.55}
.omylKarta .oprava .r{opacity:0}
.kvizUr{display:inline-block;font-size:16px;color:var(--muted);margin-left:6px}
.kvVstup{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.kvVstup input{max-width:240px}
.otazka ol.krokyCh{margin:6px 0 10px;padding-left:28px;font-size:17px;font-variant-numeric:tabular-nums}
.otazka ol.krokyCh li{margin:4px 0}
@media (max-width:760px){
  table.typy thead{display:none}
  table.typy tr{display:block;border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:6px 10px}
  table.typy td{display:block;border:none;padding:2px 0}
  table.typy td:not(:first-child)::before{content:attr(data-l) ': ';color:var(--muted)}
}
footer{color:var(--muted);text-align:center;font-size:16px;padding:20px 0 10px}
#testy{margin-top:16px;font-size:16px}
#testy table{border-collapse:collapse;width:100%}
#testy td{border-bottom:1px solid var(--line);padding:4px 8px;vertical-align:top;overflow-wrap:anywhere}
#testy .ok{color:var(--green)}#testy .zle{color:var(--red);font-weight:700}
@media (max-width:600px){
  .wrap{padding:10px}
  .card{padding:12px}
  h2{font-size:21px}
  .vzorec{font-size:24px}
  .rozvin{font-size:26px}
  .slot,.miesto{width:56px;height:56px}
  .tah{width:50px;height:50px}
  .stage.strom{padding:0}
}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><h1 data-t="titul"></h1><p class="sub" data-t="podtitul"></p></header>
<nav class="karty" id="karty" role="tablist"></nav>

<!-- =================== 1. ZÁKLADY (časť 1) =================== -->
<section id="zaklady" data-karta hidden>
  <div class="podkarty" role="tablist"></div>

  <!-- 1a. Pravidlo súčinu a súčtu -->
  <div data-pod="sucin" class="mriezka">
    <div class="dva">
      <div class="card">
        <h2 data-t="sucin.nadpis"></h2>
        <p data-t="sucin.uvod"></p>
        <div class="krokovace" id="su_kr"></div>
        <div class="vzorec" id="su_vzorec" aria-live="polite"></div>
        <p class="mini" data-t="sucin.strom"></p>
        <div class="stage posuv strom"><canvas id="su_strom" aria-label="Stromový diagram obedov"></canvas></div>
        <div class="info" id="su_info" aria-live="polite"></div>
        <div class="tlac"><button id="su_anim" data-t="sucin.animuj"></button><button id="su_vypisBtn"></button></div>
        <div id="su_vypis" hidden></div>
      </div>
      <div class="stlpec">
        <div class="card">
          <h2 data-t="sucin.oblNadpis"></h2>
          <p data-t="sucin.oblUvod"></p>
          <div id="ob_mriezka"></div>
          <div class="vzorec druhy" id="ob_vzorec"></div>
          <p class="mini" id="ob_pozn"></p>
          <div class="tlac"><button id="ob_btn" class="primary"></button></div>
        </div>
        <div class="card">
          <h2 data-t="sucin.sucetNadpis"></h2>
          <p data-t="sucin.sucetUvod"></p>
          <div class="seg" id="sc_mod"></div>
          <div class="stage"><svg id="sc_svg" viewBox="0 0 360 240" role="img" aria-label="Cesty do mesta"></svg></div>
          <p class="info" id="sc_text" aria-live="polite"></p>
          <div id="sc_zoznam"></div>
        </div>
      </div>
    </div>
    <div class="dva">
      <div class="card box zlty" style="margin:0">
        <b class="h" data-t="sucin.rozdielNadpis"></b>
        <p data-t="sucin.rozdiel"></p>
      </div>
      <div class="card">
        <h2 data-t="sucin.hraNadpis"></h2>
        <p data-t="sucin.hraUvod"></p>
        <div id="sh_otazky"></div>
        <p class="skore" id="sh_skore" aria-live="polite"></p>
        <div class="tlac"><button id="sh_znova" data-t="ui.znova"></button></div>
      </div>
    </div>
  </div>

  <!-- 1b. Faktoriál -->
  <div data-pod="faktorial" class="mriezka">
    <div class="dva">
      <div class="card">
        <h2 data-t="fakt.nadpis"></h2>
        <p data-t="fakt.uvod"></p>
        <div class="vzorec" data-t="fakt.vzorec"></div>
        <p class="mini" data-t="fakt.citaj"></p>
        <h3 data-t="fakt.animNadpis" style="margin-top:14px"></h3>
        <div class="seg" id="fa_animN"></div>
        <div class="rozvin" id="fa_rozvin" aria-live="polite"></div>
        <p class="mini" data-t="fakt.animPozn"></p>
        <div class="tlac"><button class="primary" id="fa_animBtn" data-t="fakt.animuj"></button></div>
        <div class="box omyl"><p data-t="fakt.nedef"></p></div>
      </div>
      <div class="card">
        <h2 data-t="fakt.nulaNadpis"></h2>
        <p data-t="fakt.nulaZmysel"></p>
        <p data-t="fakt.nulaPravidlo"></p>
        <div class="kroky" id="fa_rebrik"></div>
        <div class="box pravda"><p data-t="fakt.nulaZaver"></p></div>
        <p class="mini" data-t="fakt.nulaDelenie"></p>
        <div class="kroky" id="fa_delenie"></div>
      </div>
    </div>
    <div class="dva">
      <div class="card">
        <h2 data-t="fakt.vypNadpis"></h2>
        <p data-t="fakt.vypUvod"></p>
        <div class="vstupRiadok">
          <span class="lbl" data-t="fakt.vypLbl"></span>
          <button type="button" id="fa_minus" aria-label="n o jedna menej">−</button>
          <input class="num" id="fa_n" type="text" inputmode="numeric" autocomplete="off" value="7" aria-label="Číslo n">
          <button type="button" id="fa_plus" aria-label="n o jedna viac">+</button>
        </div>
        <p class="hlaska" id="fa_chyba" aria-live="polite"></p>
        <div id="fa_vysl" aria-live="polite"></div>
      </div>
      <div class="stlpec">
        <div class="card">
          <h2 data-t="fakt.grafNadpis"></h2>
          <div class="stage"><canvas id="fa_graf" aria-label="Stĺpcový graf faktoriálov v logaritmickej mierke"></canvas></div>
          <p class="info" id="fa_grafInfo" aria-live="polite"></p>
          <div class="box info"><p data-t="fakt.grafMierka"></p><p id="fa_linear"></p></div>
          <div class="box zlty"><b class="h" data-t="fakt.sekNadpis"></b><p id="fa_sek"></p><p id="fa_sek20"></p></div>
        </div>
        <div class="card">
          <h2 data-t="fakt.tabNadpis"></h2>
          <p class="mini" data-t="fakt.tabPozn"></p>
          <table class="fakt"><thead><tr><th>n</th><th>n!</th></tr></thead><tbody id="fa_tab"></tbody></table>
        </div>
      </div>
    </div>
  </div>

  <!-- 1c. Permutácie bez opakovania -->
  <div data-pod="perm" class="mriezka">
    <div class="card">
      <h2 data-t="perm.nadpis"></h2>
      <p data-t="perm.uvod"></p>
      <div class="seg" id="pe_n"></div>
      <div class="seg" id="pe_tema"></div>
      <p class="mini" id="pe_legenda"></p>
    </div>
    <div class="dva">
      <div class="card">
        <h3 data-t="ui.zdravyRozum"></h3>
        <h2 data-t="perm.rozumNadpis"></h2>
        <p id="pe_rozumText"></p>
        <div id="pe_pm"></div>
      </div>
      <div class="card">
        <h3 data-t="ui.vzorcom"></h3>
        <h2>P(n) = n!</h2>
        <p data-t="perm.vzorecTxt"></p>
        <div class="vzorec" id="pe_vzorec"></div>
        <div class="box pravda" id="pe_porov"></div>
      </div>
    </div>
    <div class="card">
      <h2 data-t="perm.zoznamNadpis"></h2>
      <p class="mini" id="pe_zoznamInfo"></p>
      <div id="pe_zoznam"></div>

function animuj(trvanie, krok, hotovo) {
  if (MALO_POHYBU || trvanie <= 0) { krok(1); if (hotovo) hotovo(); return () => {}; }
  const t0 = performance.now(); let id = 0, zrus = false;

}

/* =====================================================================
   MODUL KOMB – všetky počty výhradne cez BigInt (19! už presahuje
   Number.MAX_SAFE_INTEGER = 9 007 199 254 740 991).
   Časť 1: factorial, P. Časť 2: V, K, Vp. Časť 3: Kp, Pp.
   ===================================================================== */
const KOMB = (() => {
  // prevod na BigInt; povolené sú len celé čísla
  function big(x) {
    if (typeof x === 'bigint') return x;
    if (typeof x === 'number' && Number.isInteger(x)) return BigInt(x);
    throw new RangeError('Očakávam celé číslo, dostal som: ' + x);
  }
  const pamat = [1n];                                   // pamat[i] = i!  (počíta sa len raz)
  function factorial(n) {
    n = big(n);
    if (n < 0n) throw new RangeError('n! nie je definovaný pre záporné n');
    if (n > 10000n) throw new RangeError('n je príliš veľké');
    const k = Number(n);
    for (let i = pamat.length; i <= k; i++) pamat[i] = pamat[i - 1] * BigInt(i);
    return pamat[k];
  }
  // permutácie bez opakovania: P(n) = n!
  const P = n => factorial(n);
  // kontrola parametrov k, n (celé čísla, n ≥ 0)
  function kn(k, n) {
    k = big(k); n = big(n);
    if (n < 0n) throw new RangeError('n musí byť aspoň 0');
    return [k, n];
  }

  function V(k, n) {

    if (k < 0n || k > n) return 0n;
    return factorial(n) / factorial(n - k);
  }
  // kombinácie k-tej triedy z n prvkov bez opakovania: K(k, n) = n! / (k! · (n − k)!)   („n nad k“)
  function K(k, n) {
    [k, n] = kn(k, n);
    if (k < 0n || k > n) return 0n;
    return factorial(n) / (factorial(k) * factorial(n - k));
  }
  // variácie s opakovaním: V′(k, n) = nᵏ   (v kóde Vp; presunuté z časti 3 do časti 2)
  function Vp(k, n) {
    [k, n] = kn(k, n);
    if (k < 0n) throw new RangeError('k musí byť aspoň 0');
    return n ** k;
  }
  // kombinácie s opakovaním: K′(k, n) = K(k, n + k − 1)   (k prvkov z n druhov, druhy sa môžu opakovať)
  function Kp(k, n) {
    [k, n] = kn(k, n);
    if (k < 0n) throw new RangeError('k musí byť aspoň 0');
    if (k === 0n) return 1n;                              // nevybrať nič – jediná možnosť
    if (n === 0n) return 0n;                              // z nijakého druhu sa nedá vybrať nič
    return K(k, n + k - 1n);
  }

  function Pp(opakovania) {
    const p = opakovania.map(big);
    if (p.some(x => x < 0n)) throw new RangeError('počty musia byť aspoň 0');
    const n = p.reduce((a, b) => a + b, 0n);
    return factorial(n) / p.reduce((a, b) => a * factorial(b), 1n);
  }

  const sucin = pole => pole.reduce((a, b) => a * big(b), 1n);
  const sucet = pole => pole.reduce((a, b) => a + big(b), 0n);
  return { big, factorial, P, V, K, Vp, Kp, Pp, sucin, sucet };
})();

/* =====================================================================
   GENERÁTORY VŠETKÝCH MOŽNOSTÍ (pre malé prípady, výpis zoznamu).
   Sú lenivé (function*) – pri výpise sa vytvorí len toľko, koľko treba.

const GEN = {
  // všetky usporiadania čísel 0 … n−1 v abecednom (lexikografickom) poradí
  *permutacie(n) {
    const a = [...Array(n).keys()];

      yield a.slice();
      let i = n - 2; while (i >= 0 && a[i] > a[i + 1]) i--;
      if (i < 0) return;

  // pravidlo súčinu: všetky n-tice [i0, i1, …], kde 0 ≤ ij < pocty[j]
  *kartezsky(pocty) {

  *variacie(k, n) {

    function* dalej() {

      for (let p = 0; p < n; p++) if (!pouzity[p]) {

        yield* dalej();
        a.pop(); pouzity[p] = false;

  },
  // neusporiadané k-tice (kombinácie) – zapísané vzostupne, abecedne
  *kombinacie(k, n) {
    if (k < 0 || k > n) return;

    while (true) {
      yield a.slice();

  // k-tice s opakovaním (variácie s opakovaním) – na každom mieste ktorýkoľvek z n prvkov
  *variacieOpak(k, n) { yield* GEN.kartezsky(Array(k).fill(n)); },
  // neusporiadané k-tice s opakovaním (kombinácie s opakovaním) – neklesajúce, abecedne
  *kombinacieOpak(k, n) {
    if (k < 0 || (n <= 0 && k > 0)) return;

    while (true) {
      yield a.slice();
      let i = k - 1; while (i >= 0 && a[i] === n - 1) i--;

    }
  },
  // jedinečné usporiadania multimnožiny: opakovania [n₁, n₂, …] → prvok 0 je n₁-krát, prvok 1 n₂-krát, …
  // (ďalšie poradie v abecede; rovnaké prvky sa nevymieňajú, preto sa nič neopakuje)
  *permutacieOpak(opakovania) {
    const a = [];
    opakovania.forEach((c, i) => { for (let j = 0; j < c; j++) a.push(i); });
    const n = a.length;
    while (true) {
      yield a.slice();
      let i = n - 2; while (i >= 0 && a[i] >= a[i + 1]) i--;
      if (i < 0) return;
      let j = n - 1; while (a[j] <= a[i]) j--;
      [a[i], a[j]] = [a[j], a[i]];
      for (let l = i + 1, r = n - 1; l < r; l++, r--) [a[l], a[r]] = [a[r], a[l]];
    }
  }
};

function poradiePerm(a) {
  let r = 0n; const zost = a.slice().sort((x, y) => x - y);
  a.forEach((x, i) => { const m = zost.indexOf(x); r += BigInt(m) * KOMB.factorial(a.length - 1 - i); zost.splice(m, 1); });

/* =====================================================================
   FORMÁTOVANIE ČÍSEL – pevná medzera po tisícoch, desatinná čiarka,
   pri viac ako 15 číslicach aj zápis ≈ 2,43 · 10¹⁸
   ===================================================================== */
const NBSP = ' ';
const HORNE = '⁰¹²³⁴⁵⁶⁷⁸⁹⁻';
const hornyIndex = n => String(n).split('').map(z => z === '-' ? HORNE[10] : HORNE[+z]).join('');
function skupiny(s) { const g = []; for (let i = s.length; i > 0; i -= 3) g.unshift(s.slice(Math.max(0, i - 3), i)); return g; }

function fmt(b) { b = KOMB.big(b); return (b < 0n ? '−' : '') + skupiny(cifry(b)).join(NBSP); }
// vedecký zápis s 3 platnými číslicami: 2,43 · 10¹⁸
function vedecky(b) {
  b = KOMB.big(b); const s = cifry(b); let e = s.length - 1;

  const ms = String(m);

const fmtText = b => fmt(b) + (pocetCifier(b) > 15 ? ' ≈ ' + vedecky(b) : '');

function fmtHTML(b, pribl = true) {

  return t + (pribl && pocetCifier(b) > 15 ? ` <span class="pribl">≈ ${vedecky(b)}</span>` : '');

function krokovac(el, { nazov, min, max, hodnota, zmena }) {
  const d = document.createElement('div'); d.className = 'kr';
  d.innerHTML = `<span class="krN">${nazov}</span><span class="krR"><button type="button" aria-label="${nazov}: ${T.ui.menej}">−</button><b aria-live="polite"></b><button type="button" aria-label="${nazov}: ${T.ui.viac}">+</button></span>`;
  el.appendChild(d);
  const [bm, bp] = $$('button', d), out = $('b', d);
  const K = { v: hodnota, min, max };
  K.ukaz = () => { out.textContent = K.v; bm.disabled = K.v <= K.min; bp.disabled = K.v >= K.max; };
  K.set = v => { K.v = clamp(v, K.min, K.max); K.ukaz(); zmena(K.v); };
  // zmena hornej hranice (napr. k ≤ n); hodnota sa prípadne zmenší, zmena() sa nevolá
  K.nastavMax = m => { K.max = m; K.v = clamp(K.v, K.min, m); K.ukaz(); };
  bm.onclick = () => K.set(K.v - 1); bp.onclick = () => K.set(K.v + 1);
  K.ukaz();
  return K;
}

/* =====================================================================
   POLÍČKOVÝ MODEL – spoločný komponent (používajú ho aj časti 2 – 4)
   polickovyModel(el, { n, k, opakovanie, prvok: p => html, nazov: p => text, zmena: M => {} })
   Časť 2 pridala (nepovinné): znak: p => krátky text (v políčku „zostali“, predvolene písmeno),
     delitel: BigInt (súčin sa na konci vydelí, napr. k! pri kombináciách),
     neusporiadane: true (výsledok sa píše ako skupina {A, B, C}).
   – rad k políčok, v každom je počet možností pre danú pozíciu,
   – pod radom súčin (BigInt),
   – klik na prvok: bez opakovania prvok zmizne z ponuky, s opakovaním ostáva.
   API: M.nastav({n, k, opakovanie}), M.vyber(p), M.spat(), M.vymaz(), M.nahodne(),
        M.pocet() → BigInt (súčin políčok), M.vysledok() → súčin : delitel,
        M.moznosti(i), M.zostava(i), M.vybrane (pole indexov)
   ===================================================================== */
function polickovyModel(el, cfg) {
  const M = Object.assign({ n: 4, k: 4, opakovanie: false, vybrane: [], prvok: p => prvokSVG(p, 40), nazov: p => pismeno(p), znak: p => pismeno(p),
    delitel: null, neusporiadane: false, zmena: () => {} }, cfg);
  const TP = T.pm;
  el.innerHTML = `<p class="mini">${TP.ponuka}</p><div class="pmPonuka" role="group" aria-label="${TP.ponuka}"></div>
    <p class="mini">${TP.rad}</p><div class="pmRad"></div>
    <div class="pmSucin" aria-live="polite"></div>
    <p class="pmStav" aria-live="polite"></p>
    <div class="tlac"><button type="button" data-a="spat">${TP.spat}</button><button type="button" data-a="vymaz">${TP.vymaz}</button><button type="button" data-a="nahodne">${TP.nahodne}</button></div>
    <p class="mini pmPravidlo"></p>`;
  const pon = $('.pmPonuka', el), rad = $('.pmRad', el), suc = $('.pmSucin', el), stav = $('.pmStav', el);
  let zrusAnim = () => {};
  // počet možností na i-tej pozícii (i od 0)
  M.moznosti = i => M.opakovanie ? M.n : Math.max(0, M.n - i);
  // ktoré prvky sú k dispozícii pre i-tu pozíciu (ak sú známe prvé i voľby)
  M.zostava = i => [...Array(M.n).keys()].filter(p => M.opakovanie || !M.vybrane.slice(0, i).includes(p));
  M.pocet = () => KOMB.sucin(Array.from({ length: M.k }, (_, i) => M.moznosti(i)));
  M.vysledok = () => M.delitel ? M.pocet() / M.delitel : M.pocet();
  M.plne = () => M.vybrane.length >= M.k;
  M.vyber = p => {
    if (M.plne() || (!M.opakovanie && M.vybrane.includes(p))) return false;
    M.vybrane.push(p); M.kresli(M.vybrane.length - 1); M.zmena(M); return true;
  };
  M.spat = () => { zrusAnim(); if (M.vybrane.length) { M.vybrane.pop(); M.kresli(); M.zmena(M); } };
  M.vymaz = () => { zrusAnim(); M.vybrane = []; M.kresli(); M.zmena(M); };
  // doplní zvyšné políčka náhodne, po jednom (animácia podľa skutočného času)
  M.nahodne = () => {
    zrusAnim();
    const zostava = M.k - M.vybrane.length; if (zostava <= 0) return;
    let hotove = 0;
    zrusAnim = animuj(280 * zostava, u => {
      const chcem = Math.ceil(u * zostava);
      while (hotove < chcem) { const z = M.zostava(M.vybrane.length); M.vyber(z[nahoda(0, z.length - 1)]); hotove++; }
    });
  };
  M.nastav = c => {
    zrusAnim(); Object.assign(M, c); M.vybrane = [];
    pon.innerHTML = [...Array(M.n).keys()].map(p => `<button type="button" class="prvB" data-p="${p}" aria-label="${M.nazov(p)}" title="${M.nazov(p)}">${M.prvok(p)}</button>`).join('');
    $('.pmPravidlo', el).innerHTML = M.opakovanie ? TP.sOpak : TP.bezOpak;
    M.kresli();
  };
  // nove = index práve vyplneného políčka (dostane krátku animáciu)
  M.kresli = (nove = -1) => {
    const d = M.vybrane.length, zost = M.zostava(d), plne = M.plne();
    $$('.prvB', pon).forEach(b => {
      const p = +b.dataset.p, je = zost.includes(p);
      b.classList.toggle('prec', !je);                  // bez opakovania prvok „zmizne“
      b.disabled = !je || plne;
    });
    let h = '';
    for (let i = 0; i < M.k; i++) {
      const zn = M.opakovanie ? T.pm.vsetky : i <= d ? M.zostava(i).map(M.znak).join('') : '…';
      h += `<div class="pol${i < d ? ' pln' : ''}${i === d ? ' akt' : ''}"><span class="poz">${i + 1}.</span><span class="poc">${M.moznosti(i)}</span>` +
        `<span class="obs">${i < d ? `<span class="${i === nove ? 'nove' : ''}">${M.prvok(M.vybrane[i])}</span>` : '?'}</span>` +
        `<span class="zost" title="${TP.zostali}">${zn}</span></div>`;
    }
    rad.innerHTML = h;
    const cinitele = Array.from({ length: M.k }, (_, i) => `<span class="f${i === d ? ' akt' : ''}">${M.moznosti(i)}</span>`).join(' · ');
    suc.innerHTML = M.delitel
      ? `(${cinitele}) : ${M.k}! = ${fmtHTML(M.pocet())} : ${fmtHTML(M.delitel)} = ${fmtHTML(M.vysledok())}`
      : cinitele + ' = ' + fmtHTML(M.pocet());
    if (plne && M.neusporiadane) stav.innerHTML = vypln(TP.hotovoSkupina, { vyber: '{' + M.vybrane.slice().sort((x, y) => x - y).map(M.znak).join(', ') + '}', kf: fmt(M.delitel || 1n), N: fmtHTML(M.vysledok()) });
    else if (plne) stav.innerHTML = vypln(TP.hotovo, { vyber: M.vybrane.map(M.znak).join(' '), N: fmtHTML(M.vysledok()) });
    else if (d === 0) stav.innerHTML = TP.zaciatok;
    else stav.innerHTML = vypln(TP.dalej, { i: d + 1, m: M.moznosti(d), mz: tvar(M.moznosti(d), ['možnosť', 'možnosti', 'možností']) });
    $('[data-a=spat]', el).disabled = d === 0;
    $('[data-a=vymaz]', el).disabled = d === 0;
    $('[data-a=nahodne]', el).disabled = plne;
  };
  pon.addEventListener('click', e => { const b = e.target.closest('.prvB'); if (b) M.vyber(+b.dataset.p); });
  el.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) M[b.dataset.a](); });
  M.nastav({});
  return M;
}

/* =====================================================================
   PODKARTY (rovnako ako v predošlých animáciách, adresa #karta/podkarta)
   ===================================================================== */
const PODKARTA = {};
const PODKARTY_STAV = {};                                 // časť 3: stav podkariet (aby sa dala otvoriť konkrétna podkarta z tabuľky typov)
const PRI_ZOBRAZENI = [];                                 // funkcie, ktoré sa zavolajú po zobrazení karty (prekreslenie canvasu)
function vytvorPodkarty(id, texty, stav) {
  const nav = $(`#${id} .podkarty`);
  for (const [k, t] of Object.entries(texty)) {
    const b = document.createElement('button'); b.dataset.p = k; b.setAttribute('role', 'tab'); b.textContent = t;
    b.onclick = () => stav.ukaz(k); nav.appendChild(b);
  }
  stav.ukaz = (p, ticho) => {
    stav.pod = p;
    $$(`#${id} [data-pod]`).forEach(e => { e.hidden = e.dataset.pod !== p; });
    $$('button', nav).forEach(b => { const on = b.dataset.p === p; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    if (!ticho && AKT === id) { try { history.replaceState(null, '', '#' + id + '/' + p); } catch (e) { /* nič */ } }
    PRI_ZOBRAZENI.forEach(f => f());
  };
  const m = new RegExp('^#' + id + '/([a-z]+)').exec(location.hash);
  stav.ukaz(m && texty[m[1]] ? m[1] : Object.keys(texty)[0], true);
  PODKARTA[id] = () => stav.pod;
  PODKARTY_STAV[id] = stav;
}
const viditelne = el => !!el && el.offsetParent !== null;

/* =====================================================================
   KARTA 1a: PRAVIDLO SÚČINU A SÚČTU
   ===================================================================== */
const OBED = { a: 3, b: 4, c: 2, t: 0, zrus: () => {}, sel: -1, roz: null, vypis: false, sirka: 0 };
const OBED_MAX = [4, 4, 3];
function initSucin() {
  const S = T.sucin, kr = $('#su_kr');
  krokovac(kr, { nazov: S.polievka, min: 1, max: OBED_MAX[0], hodnota: OBED.a, zmena: v => { OBED.a = v; obnovObed(true); } });
  krokovac(kr, { nazov: S.hlavne, min: 1, max: OBED_MAX[1], hodnota: OBED.b, zmena: v => { OBED.b = v; obnovObed(true); } });
  krokovac(kr, { nazov: S.dezert, min: 1, max: OBED_MAX[2], hodnota: OBED.c, zmena: v => { OBED.c = v; obnovObed(true); } });
  $('#su_anim').onclick = () => obnovObed(true);
  $('#su_vypisBtn').onclick = () => { OBED.vypis = !OBED.vypis; obnovObedVypis(); };
  const cv = $('#su_strom');
  cv.addEventListener('click', e => {
    const R = OBED.roz; if (!R) return;
    const y = e.clientY - cv.getBoundingClientRect().top;
    const j = Math.floor((y - R.top) / R.rowH);
    OBED.sel = j >= 0 && j < R.L ? j : -1;
    kresliStrom(); obnovObedInfo();
  });
  PRI_ZOBRAZENI.push(() => { if (viditelne(cv) && cv.clientWidth !== OBED.sirka) kresliStrom(); });
  initOblecenie(); initSucet(); initSucinHra();
  obnovObed(true);
}
function obnovObed(anim) {
  const S = T.sucin, N = KOMB.sucin([OBED.a, OBED.b, OBED.c]);
  $('#su_vzorec').innerHTML = vypln(S.vzorecText, { a: OBED.a, b: OBED.b, c: OBED.c, N: fmtHTML(N) });
  OBED.sel = -1; obnovObedInfo(); obnovObedVypis();
  OBED.zrus();
  if (anim) OBED.zrus = animuj(2600, u => { OBED.t = u * 3.4; kresliStrom(); });
  else { OBED.t = 3.4; kresliStrom(); }

function obnovObedInfo() {

  const c = OBED.c, b = OBED.b, d = j % c, h = Math.floor(j / c) % b, p = Math.floor(j / (b * c));
  $('#su_info').innerHTML = vypln(S.stromKlik, { i: j + 1, p: S.polievky[p], h: S.hlavneJedla[h], d: S.dezerty[d] });
}
function obnovObedVypis() {
  const S = T.sucin, el = $('#su_vypis');
  $('#su_vypisBtn').textContent = OBED.vypis ? S.skry : S.vypis;

    ([p, h, d], i) => `<span class="pz"><span class="c">${i + 1}.</span>${S.polievky[p]} + ${S.hlavneJedla[h]} + ${S.dezerty[d]}</span>`, 'text');
}
// rozloženie stromu podľa šírky plátna (písmo vždy 16 px, nezmenšuje sa)
function rozlozStrom(ctx, W) {
  const S = T.sucin, { a, b, c } = OBED, L = a * b * c;
  const rowH = L > 24 ? 24 : 30, top = 34, H = top + L * rowH + 8;
  ctx.font = PISMO;
  const sir = arr => Math.max(...arr.map(s => ctx.measureText(s).width)) + 14;
  const w1 = sir(S.polievky.slice(0, a)), w2 = sir(S.hlavneJedla.slice(0, b)), w3 = sir(S.dezerty.slice(0, c));
  const wN = ctx.measureText(String(L)).width + 4, x0 = 8;
  const gap = clamp((W - x0 - 6 - w1 - w2 - w3 - wN - 22) / 3, 10, 120);
  const x1 = x0 + 6 + gap, x2 = x1 + w1 + gap, x3 = x2 + w2 + gap, xN = x3 + w3 + 10;
  const yL = j => top + rowH * (j + .5);
  const uzly = [];                                       // {ur, x, w, y, text, rodic, j0, j1}
  const koren = { ur: 0, x: x0, w: 6, y: (yL(0) + yL(L - 1)) / 2, j0: 0, j1: L };
  for (let p = 0; p < a; p++) {
    const u1 = { ur: 1, x: x1, w: w1, text: S.polievky[p], rodic: koren, j0: p * b * c, j1: (p + 1) * b * c }; uzly.push(u1);
    for (let h = 0; h < b; h++) {
      const u2 = { ur: 2, x: x2, w: w2, text: S.hlavneJedla[h], rodic: u1, j0: u1.j0 + h * c, j1: u1.j0 + (h + 1) * c }; uzly.push(u2);
      for (let d = 0; d < c; d++) uzly.push({ ur: 3, x: x3, w: w3, text: S.dezerty[d], rodic: u2, j0: u2.j0 + d, j1: u2.j0 + d + 1 });
    }
  }
  uzly.forEach(u => { u.y = (yL(u.j0) + yL(u.j1 - 1)) / 2; });
  return { L, rowH, top, H, uzly, koren, xs: [x1, x2, x3, xN], xN, yL, boxH: Math.min(rowH - 4, 24) };
}
function kresliStrom() {
  const cv = $('#su_strom'); if (!viditelne(cv)) return;
  const W = cv.clientWidth; OBED.sirka = W;
  let ctx = cv.getContext('2d');
  const R = rozlozStrom(ctx, W); OBED.roz = R;
  ctx = pripravPlatno(cv, W, R.H);
  ctx.clearRect(0, 0, W, R.H);
  const t = OBED.t, S = T.sucin, sel = OBED.sel;
  const FARBY_UR = ['#a3adc6', '#f3b453', '#6fb4ff', '#7fdc8f'];
  const naCeste = u => sel >= 0 && sel >= u.j0 && sel < u.j1;
  // hlavička stĺpcov
  ctx.font = PISMO_B; ctx.textBaseline = 'middle'; ctx.fillStyle = '#a3adc6';
  S.hlavicky.forEach((h, i) => ctx.fillText(h, R.xs[i], 16));
  // zvýraznený riadok
  if (sel >= 0) { ctx.fillStyle = 'rgba(243,180,83,.12)'; ctx.fillRect(0, R.top + sel * R.rowH, W, R.rowH); }
  // vetvy: úroveň ur rastie v čase t ∈ [ur−1, ur]
  ctx.lineCap = 'round';
  R.uzly.forEach(u => {
    const f = clamp((t - (u.ur - 1)) * 1.4, 0, 1); if (f <= 0) return;
    const r = u.rodic, sx = r.x + r.w, sy = r.y, ex = u.x, ey = u.y;
    ctx.strokeStyle = naCeste(u) ? '#ffd88a' : 'rgba(163,173,198,.55)'; ctx.lineWidth = naCeste(u) ? 3 : 1.6;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + (ex - sx) * f, sy + (ey - sy) * f); ctx.stroke();
  });
  // koreň
  ctx.fillStyle = '#e2e8f5'; ctx.beginPath(); ctx.arc(R.koren.x + 3, R.koren.y, 5, 0, Math.PI * 2); ctx.fill();
  // uzly (rámčeky s názvom jedla)
  ctx.font = PISMO;
  R.uzly.forEach(u => {
    const a = clamp((t - (u.ur - 1)) * 1.4 - .55, 0, 1); if (a <= 0) return;
    ctx.globalAlpha = a;
    const h = R.boxH, y = u.y - h / 2;
    zaoblenyObd(ctx, u.x, y, u.w, h, 6);
    ctx.fillStyle = naCeste(u) ? 'rgba(243,180,83,.3)' : '#101a2e'; ctx.fill();
    ctx.strokeStyle = naCeste(u) ? '#ffd88a' : FARBY_UR[u.ur]; ctx.lineWidth = naCeste(u) ? 2.5 : 1.3; ctx.stroke();
    ctx.fillStyle = '#e2e8f5'; ctx.fillText(u.text, u.x + 7, u.y + 1);
    ctx.globalAlpha = 1;
  });
  // čísla obedov – objavia sa nakoniec
  const aN = clamp((t - 3) / .4, 0, 1);
  if (aN > 0) {
    ctx.globalAlpha = aN; ctx.font = PISMO_B;
    for (let j = 0; j < R.L; j++) { ctx.fillStyle = j === sel ? '#ffd88a' : '#a3adc6'; ctx.fillText(String(j + 1), R.xN, R.yL(j) + 1); }
    ctx.globalAlpha = 1;
  }
}

/* --- pravidlo súčtu: cesta do mesta (autobus ALEBO vlak) vs. prestup (A ZÁROVEŇ) --- */
const SUCET = { mod: 'alebo', zrus: () => {} };
function initSucet() {
  const S = T.sucin, seg = $('#sc_mod');
  [['alebo', S.modAlebo], ['zaroven', S.modZaroven]].forEach(([k, t]) => {
    const b = document.createElement('button'); b.dataset.m = k; b.textContent = t;
    b.onclick = () => { SUCET.mod = k; obnovSucet(); }; seg.appendChild(b);
  });
  obnovSucet();
}
function obnovSucet() {
  const S = T.sucin, M = SUCET.mod;
  $$('#sc_mod button').forEach(b => b.classList.toggle('on', b.dataset.m === M));
  // trasa: kvadratická krivka z (x1,y) do (x2,y), vrchol posunutý o h
  const trasa = (x1, x2, y, h) => { const cy = y - 2 * h; return { d: `M${x1} ${y} Q${(x1 + x2) / 2} ${cy} ${x2} ${y}`, mx: (x1 + x2) / 2, my: y - h }; };
  const Y = 120, cesty = [];
  let uzly;
  if (M === 'alebo') {
    uzly = [[40, S.domov], [320, S.mesto]];
    [32, 64, 96].forEach((h, i) => cesty.push({ ...trasa(40, 320, Y, h), typ: 'bus', l: 'A' + (i + 1) }));
    [-40, -80].forEach((h, i) => cesty.push({ ...trasa(40, 320, Y, h), typ: 'vlak', l: 'V' + (i + 1) }));
  } else {
    uzly = [[28, S.domov], [180, S.prestup], [332, S.mesto]];
    [60, 0, -60].forEach((h, i) => cesty.push({ ...trasa(28, 180, Y, h), typ: 'bus', l: 'A' + (i + 1) }));
    [40, -40].forEach((h, i) => cesty.push({ ...trasa(180, 332, Y, h), typ: 'vlak', l: 'V' + (i + 1) }));
  }
  // autobus = plná čiara + štvorček, vlak = čiarkovaná čiara + krúžok (nielen farba)
  let h = '';
  cesty.forEach((c, i) => {
    const bus = c.typ === 'bus', f = bus ? '#f3b453' : '#6fb4ff';
    h += `<g class="cesta" data-i="${i}" opacity="0"><path d="${c.d}" fill="none" stroke="${f}" stroke-width="3.5" ${bus ? '' : 'stroke-dasharray="10 7"'}/>` +
      (bus ? `<rect x="${c.mx - 19}" y="${c.my - 13}" width="38" height="26" rx="4" fill="#101a2e" stroke="${f}" stroke-width="2"/>`
           : `<circle cx="${c.mx}" cy="${c.my}" r="16" fill="#101a2e" stroke="${f}" stroke-width="2"/>`) +
      `<text x="${c.mx}" y="${c.my + 6}" text-anchor="middle" font-size="17" font-weight="700" fill="${f}">${c.l}</text></g>`;
  });

/* =====================================================================
   KARTA 1b: FAKTORIÁL
   ===================================================================== */
const FA = { animN: 5, zrus: () => {}, sel: 7, graf: 1, grafZrus: () => {}, grafVid: false, sirka: 0, nMax: 60 };
function initFakt() {
  const seg = $('#fa_animN');

  }
  $('#fa_animBtn').onclick = rozvinFakt;

  const r = [];
  for (let n = 4; n >= 1; n--) r.push(`<div class="r${n === 1 ? ' vys' : ''}">${n}! = ${n} · ${n - 1}! &nbsp;→&nbsp; ${fmt(KOMB.factorial(n))} = ${n} · ${fmt(KOMB.factorial(n - 1))}${n === 1 ? '&nbsp; → &nbsp;0! = 1' : ''}</div>`);
  $('#fa_rebrik').innerHTML = r.join('');
  const d = [];
  for (let n = 4; n >= 1; n--) d.push(`<div class="r${n === 1 ? ' vys' : ''}">${n - 1}! = ${n}! : ${n} = ${fmt(KOMB.factorial(n))} : ${n} = ${fmt(KOMB.factorial(n - 1))}</div>`);
  $('#fa_delenie').innerHTML = d.join('');
  // vstup n
  const inp = $('#fa_n');
  inp.addEventListener('input', vypocitajFakt);
  $('#fa_minus').onclick = () => posunN(-1); $('#fa_plus').onclick = () => posunN(1);
  // tabuľka 0! – 20!
  let h = '';
  for (let n = 0; n <= 20; n++) h += `<tr data-n="${n}"><td>${n}!</td><td>${fmtHTML(KOMB.factorial(n))}</td></tr>`;
  $('#fa_tab').innerHTML = h;
  $('#fa_tab').addEventListener('click', e => { const tr = e.target.closest('tr'); if (tr) vyberN(+tr.dataset.n, true); });
  // graf
  const cv = $('#fa_graf');
  cv.addEventListener('click', e => {
    const G = FA.grafRoz; if (!G) return;
    const x = e.clientX - cv.getBoundingClientRect().left, n = Math.floor((x - G.l) / G.cw);

  });
  PRI_ZOBRAZENI.push(() => {
    if (!viditelne(cv)) return;
    if (!FA.grafVid) { FA.grafVid = true; FA.grafZrus(); FA.grafZrus = animuj(1100, u => { FA.graf = ease(u); kresliGrafFakt(); }); rozvinFakt(); }
    else if (cv.clientWidth !== FA.sirka) kresliGrafFakt();

function posunN(d) { const n = parseInt($('#fa_n').value, 10); vyberN(clamp(isNaN(n) ? 0 : n + d, 0, FA.nMax), false); }
function vyberN(n, posun) { $('#fa_n').value = n; vypocitajFakt(); if (posun) $('#fa_n').scrollIntoView({ block: 'nearest', behavior: MALO_POHYBU ? 'auto' : 'smooth' }); }

/* animácia 5! = 5 · 4 · 3 · 2 · 1 = 120 – čísla prilietajú postupne, pod nimi priebežný súčin */
function rozvinFakt() {
  const n = FA.animN;
  $$('#fa_animN button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  const tok = [], cas = [];                               // tokeny a časy ich objavenia (v sekundách)
  tok.push(`<span class="tok">${n}!<small>&nbsp;</small></span>`); cas.push(0);
  tok.push(`<span class="tok op">=<small>&nbsp;</small></span>`); cas.push(.35);
  let p = 1n;
  for (let k = n; k >= 1; k--) {
    p *= BigInt(k);
    const t = .7 + (n - k) * .55;
    if (k < n) { tok.push(`<span class="tok op">·<small>&nbsp;</small></span>`); cas.push(t - .2); }
    tok.push(`<span class="tok">${k}<small>${fmt(p)}</small></span>`); cas.push(t);
  }
  const tk = .7 + n * .55;
  tok.push(`<span class="tok op">=<small>&nbsp;</small></span>`); cas.push(tk);
  tok.push(`<span class="tok vys">${fmt(p)}<small>&nbsp;</small></span>`); cas.push(tk + .3);
  const el = $('#fa_rozvin'); el.innerHTML = tok.join('');
  el.setAttribute('aria-label', `${n}! = ${[...Array(n)].map((_, i) => n - i).join(' · ')} = ${fmt(p)}`);
  const spans = $$('.tok', el), spolu = tk + .9;
  FA.zrus();
  FA.zrus = animuj(spolu * 1000, u => {
    const t = u * spolu;
    spans.forEach((s, i) => {
      const a = clamp((t - cas[i]) / .3, 0, 1);
      s.style.opacity = a; s.style.transform = `translateY(${(1 - ease(a)) * 14}px)` + (i === spans.length - 1 ? ` scale(${1 + .25 * Math.sin(Math.PI * a)})` : '');
    });
  });
}

/* výpočet n! zo vstupu – validácia, kroky, výsledok */
function vypocitajFakt() {
  const F = T.fakt, inp = $('#fa_n'), chyba = $('#fa_chyba'), out = $('#fa_vysl');
  const s = inp.value.trim().replace(/\s/g, '').replace(/[−–]/g, '-');
  let msg = '';
  if (s === '') msg = F.chybaPrazdne;
  else if (!/^-?(\d+([.,]\d*)?|[.,]\d+)$/.test(s)) msg = F.chybaNecislo;
  else {
    const x = parseFloat(s.replace(',', '.'));
    if (x < 0) msg = F.chybaZaporne;
    else if (!Number.isInteger(x)) msg = F.chybaDesatinne;
    else if (x > FA.nMax) msg = F.chybaVelke;
  }
  inp.classList.toggle('zle', !!msg); chyba.textContent = msg;
  if (msg) { out.innerHTML = ''; return; }
  const n = parseInt(s, 10), f = KOMB.factorial(n), d = pocetCifier(f);
  FA.sel = n;
  // hlavný riadok: pri malom n celý súčin, pri veľkom skrátene
  const cleny = n === 0 ? '' : n <= 12 ? [...Array(n)].map((_, i) => n - i).join(' · ') : `${n} · ${n - 1} · ${n - 2} · … · 2 · 1`;
  let h = `<div class="vysledok">${n}! = ${cleny ? cleny + ' = ' : ''}${fmtHTML(f)}</div>`;
  h += `<p class="mini">${vypln(F.vypCifry, { n, d, cif: cifTvar(d) })}</p><p class="mini">${F.kroky}</p>`;
  // kroky k! = k · (k − 1)!
  const r = [`<div class="r">0! = 1 <span class="op">${F.dohoda}</span></div>`];
  for (let k = 1; k <= n; k++) {
    const pred = KOMB.factorial(k - 1), v = KOMB.factorial(k);
    const stred = pocetCifier(pred) <= 15 ? ` = ${k} · ${fmt(pred)}` : '';
    r.push(`<div class="r${k === n ? ' vys' : ''}">${k}! = ${k} · ${k - 1}!${stred} = ${fmtHTML(v)}</div>`);
  }
  h += `<div class="kroky${n > 10 ? ' posuv' : ''}">${r.join('')}</div>`;
  out.innerHTML = h;
  const kr = $('.kroky.posuv', out); if (kr) kr.scrollTop = kr.scrollHeight;
  $$('#fa_tab tr').forEach(tr => tr.classList.toggle('vyb', +tr.dataset.n === n));
  $('#fa_grafInfo').innerHTML = n <= 20 ? vypln(F.grafInfo, { n, v: fmtHTML(f), d, cif: cifTvar(d) }) : '&nbsp;';
  kresliGrafFakt();
}

/* stĺpcový graf 0! – 20! v logaritmickej mierke */
function kresliGrafFakt() {
  const cv = $('#fa_graf'); if (!viditelne(cv)) return;
  const W = cv.clientWidth, H = Math.round(clamp(W * .62, 250, 380)); FA.sirka = W;
  const ctx = pripravPlatno(cv, W, H);
  const l = 52, r = 8, tp = 14, bt = 30, pw = W - l - r, ph = H - tp - bt, cw = pw / 21, EMAX = 19;
  FA.grafRoz = { l, cw };
  const yE = e => tp + ph - e / EMAX * ph;
  ctx.font = PISMO; ctx.textBaseline = 'middle';
  // vodorovné čiary 10⁰, 10³, … 10¹⁸
  for (let e = 0; e <= 18; e += 3) {
    ctx.strokeStyle = 'rgba(140,160,215,.2)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(l, yE(e)); ctx.lineTo(W - r, yE(e)); ctx.stroke();
    ctx.fillStyle = '#a3adc6'; ctx.textAlign = 'right'; ctx.fillText('10' + hornyIndex(e), l - 6, yE(e));
  }
  const krok = cw >= 22 ? 1 : cw >= 12 ? 2 : 5;
  ctx.textAlign = 'center';
  for (let n = 0; n <= 20; n++) {
    const lg = Math.log10(Number(KOMB.factorial(n))), h = lg / EMAX * ph * FA.graf;
    const x = l + n * cw + cw * .15, w = cw * .7, vyb = n === FA.sel;
    ctx.fillStyle = vyb ? '#f3b453' : 'rgba(111,180,255,.75)';
    ctx.fillRect(x, tp + ph - h, w, Math.max(h, 2));
    if (vyb) { ctx.strokeStyle = '#ffd88a'; ctx.lineWidth = 2; ctx.strokeRect(x, tp + ph - h, w, Math.max(h, 2)); }
    if (n % krok === 0 || vyb) { ctx.fillStyle = vyb ? '#ffd88a' : '#a3adc6'; ctx.font = vyb ? PISMO_B : PISMO; ctx.fillText(String(n), x + w / 2, H - bt / 2); }
  }
  ctx.textAlign = 'left';
}

/* --- hra: postav rad (ťahanie myšou aj prstom, ťuknutie, klávesnica) --- */
const PH = { rad: [], najdene: new Set(), posl: '', tah: null, sprava: '' };
function resetPermHra() { PH.rad = Array(PERM.n).fill(null); PH.najdene = new Set(); PH.posl = ''; PH.sprava = ''; kresliPermHru(); }
function initPermHra() {
  const root = $('#pg');
  $('#pg_vyprazdni').onclick = () => { PH.rad = Array(PERM.n).fill(null); PH.posl = ''; PH.sprava = ''; kresliPermHru(); };
  $('#pg_reset').onclick = resetPermHra;
  const zdroj = el => el.dataset.kde === 'slot' ? { kde: 'slot', i: +el.dataset.i } : { kde: 'ponuka', p: +el.dataset.p };
  const cielPod = (x, y) => {
    const e = document.elementFromPoint(x, y); if (!e) return null;
    const s = e.closest('#pg .slot'); if (s) return { kde: 'slot', i: +s.dataset.i, el: s };
    const p = e.closest('#pg_ponuka'); if (p) return { kde: 'ponuka', el: p };
    return null;
  };
  const zvyrazni = c => { $$('#pg .nad').forEach(e => e.classList.remove('nad')); if (c) c.el.classList.add('nad'); };
  const koniec = () => { const H = PH.tah; if (!H) return; if (H.duch) H.duch.remove(); H.el.classList.remove('zdroj'); zvyrazni(null); PH.tah = null; };
  root.addEventListener('pointerdown', e => {
    const el = e.target.closest('.tah'); if (!el || e.button > 0) return;
    e.preventDefault();
    PH.tah = { el, z: zdroj(el), x0: e.clientX, y0: e.clientY, duch: null };
    try { el.setPointerCapture(e.pointerId); } catch (er) { /* nič */ }
  });
  root.addEventListener('pointermove', e => {
    const H = PH.tah; if (!H) return;
    if (!H.duch) {
      if (Math.hypot(e.clientX - H.x0, e.clientY - H.y0) < 6) return;
      H.duch = H.el.cloneNode(true); H.duch.classList.add('duch'); document.body.appendChild(H.duch);
      H.el.classList.add('zdroj');
    }
    const w = H.duch.offsetWidth;
    H.duch.style.left = (e.clientX - w / 2) + 'px'; H.duch.style.top = (e.clientY - w / 2) + 'px';
    zvyrazni(cielPod(e.clientX, e.clientY));
  });
  root.addEventListener('pointerup', e => {
    const H = PH.tah; if (!H) return;
    const c = H.duch ? cielPod(e.clientX, e.clientY) : null, tap = !H.duch;
    koniec();
    if (tap) tukni(H.z); else if (c) presun(H.z, c); else return;
  });
  root.addEventListener('pointercancel', koniec);
  root.addEventListener('keydown', e => {
    const el = e.target.closest('.tah'); if (!el || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault(); tukni(zdroj(el));
  });
}
// ťuknutie: z ponuky na prvé voľné miesto, z radu späť do ponuky
function tukni(z) {
  if (z.kde === 'ponuka') { const i = PH.rad.indexOf(null); if (i < 0) return; PH.rad[i] = z.p; }
  else PH.rad[z.i] = null;
  poTahu();
}
// presun ťahaním: na miesto (obsadené sa vymení), alebo späť do ponuky
function presun(z, c) {
  if (c.kde === 'ponuka') { if (z.kde === 'slot') PH.rad[z.i] = null; }
  else if (z.kde === 'ponuka') PH.rad[c.i] = z.p;          // pôvodný prvok (ak bol) sa vráti do ponuky sám
  else if (z.i !== c.i) [PH.rad[z.i], PH.rad[c.i]] = [PH.rad[c.i], PH.rad[z.i]];
  poTahu();
}
function poTahu() {
  const P = T.perm, N = KOMB.P(PERM.n);
  if (!PH.rad.includes(null)) {
    const kluc = PH.rad.join(',');
    if (kluc !== PH.posl) {
      PH.posl = kluc;
      const nove = !PH.najdene.has(kluc);
      if (nove) PH.najdene.add(kluc);
      PH.sprava = (nove ? vypln(P.hraNove, { k: PH.najdene.size, N: fmt(N) }) : P.hraUz) + ' ' + vypln(P.hraPoradie, { r: fmt(poradiePerm(PH.rad)) }) +
        (BigInt(PH.najdene.size) === N ? '<br>' + vypln(P.hraVsetky, { N: fmt(N) }) : '');
    }
  } else { PH.posl = ''; PH.sprava = ''; }
  kresliPermHru();
}
function kresliPermHru() {
  const P = T.perm, n = PERM.n, N = KOMB.P(n), tema = PERM.tema;
  if (PH.rad.length !== n) PH.rad = Array(n).fill(null);
  const tah = (p, attr) => `<div class="tah" ${attr} role="button" tabindex="0" aria-label="${nazovPrvku(p)}">${prvokSVG(p, 44, tema)}</div>`;
  $('#pg_rad').innerHTML = PH.rad.map((p, i) => `<div class="slot" data-i="${i}"><span class="poz">${i + 1}.</span>${p == null ? '' : tah(p, `data-kde="slot" data-i="${i}"`)}</div>`).join('');
  $('#pg_ponuka').innerHTML = [...Array(n).keys()].map(p => `<div class="miesto">${PH.rad.includes(p) ? '' : tah(p, `data-kde="ponuka" data-p="${p}"`)}</div>`).join('');
  const chyba = PH.rad.filter(x => x == null).length;
  $('#pg_stav').innerHTML = PH.sprava || (chyba === n ? P.hraZaciatok : vypln(P.hraDopln, { z: chyba }));

/* --- pre zvedavých: okrúhly stôl, (n − 1)! --- */
const STOL = { n: 5, poradie: [0, 1, 2, 3, 4], otoc: 0, uhol: 0, pripnute: false, idx: 0, zrus: () => {}, beh: false };
function initStol() {
  const seg = $('#st_n');
  seg.innerHTML = `<span class="lbl">${T.perm.stolNLbl}</span>`;
  for (let n = 3; n <= 7; n++) {
    const b = document.createElement('button'); b.textContent = n; b.dataset.n = n;
    b.onclick = () => { STOL.n = n; STOL.poradie = [...Array(n).keys()]; STOL.otoc = 0; STOL.uhol = 0; STOL.idx = 0; obnovStol(); }; seg.appendChild(b);
  }
  $('#st_otoc').onclick = () => otocStol(1);
  $('#st_pripni').onclick = () => {
    STOL.pripnute = !STOL.pripnute;
    if (STOL.pripnute) {                                    // otoč tak, aby A bola hore, a začni od 1. sedenia
      const iA = STOL.poradie.indexOf(0), ciel = (STOL.n - iA) % STOL.n;
      let d = (ciel - STOL.otoc) % STOL.n; if (d < 0) d += STOL.n;
      if (d) otocStol(d); else obnovStol();
    } else obnovStol();
  };
  $('#st_dalsie').onclick = () => {
    const n = STOL.n, pocet = KOMB.factorial(n - 1);
    STOL.idx = (STOL.idx + 1) % Number(pocet);
    const ost = permPodlaPoradia([...Array(n - 1).keys()].map(x => x + 1), STOL.idx);
    // A ostáva na mieste, kde práve sedí; ostatní sa presadnú
    const iA = STOL.poradie.indexOf(0), nove = Array(n);
    for (let m = 0; m < n; m++) nove[(iA + m) % n] = m === 0 ? 0 : ost[m - 1];
    STOL.poradie = nove; obnovStol();
  };
  obnovStol();
}
function otocStol(kroky) {
  if (STOL.beh) return;
  STOL.beh = true; const z = STOL.otoc, k = z + kroky;
  STOL.zrus = animuj(650 * Math.min(kroky, 2), u => { STOL.uhol = z + (k - z) * ease(u); kresliStol(); },
    () => { STOL.otoc = k % STOL.n; STOL.uhol = STOL.otoc; STOL.beh = false; obnovStol(); });
}
// kto sedí na hornom mieste a ako znie zápis čítaný v smere hodín
function stolZapis(otoc) { const n = STOL.n, j0 = ((-otoc) % n + n) % n; return [...Array(n)].map((_, m) => STOL.poradie[(j0 + m) % n]); }
function kresliStol() {
  const n = STOL.n, C = 160, R = 118, krokU = 2 * Math.PI / n;
  let h = `<circle cx="${C}" cy="${C}" r="78" fill="#3a2a1c" stroke="#8a6a44" stroke-width="4"/><circle cx="${C}" cy="${C}" r="62" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="2"/>`;
  h += `<path d="M${C} 10 l-8 -8 h16z" fill="#a3adc6" transform="translate(0 4)"/>`;   // značka hornej pozície
  for (let j = 0; j < n; j++) {
    const a = -Math.PI / 2 + (j + STOL.uhol) * krokU, x = C + R * Math.cos(a), y = C + R * Math.sin(a), p = STOL.poradie[j];
    h += `<g transform="translate(${(x - 24).toFixed(1)} ${(y - 24).toFixed(1)}) scale(1.2)">${prvokTvar(p, 'ziaci')}</g>`;
    if (p === 0 && STOL.pripnute) h += `<g transform="translate(${(x + 14).toFixed(1)} ${(y - 30).toFixed(1)})"><line x1="0" y1="0" x2="-7" y2="14" stroke="#e2e8f5" stroke-width="2.5"/><circle cx="0" cy="0" r="7" fill="#ff7a6b" stroke="#fff" stroke-width="1.5"/></g>`;
  }
  $('#st_svg').innerHTML = h;
}
function obnovStol() {
  const P = T.perm, n = STOL.n, f = KOMB.factorial(n), v = KOMB.factorial(n - 1);
  $$('#st_n button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  $('#st_pripni').textContent = STOL.pripnute ? P.stolOdopni : P.stolPripni;
  $('#st_otoc').disabled = STOL.pripnute;
  $('#st_dalsie').disabled = !STOL.pripnute;
  kresliStol();
  // všetky otočenia toho istého sedenia
  const akt = ((-STOL.otoc) % n + n) % n;
  const zapisy = [...Array(n)].map((_, r) => [...Array(n)].map((_, m) => pismeno(STOL.poradie[(r + m) % n])).join(''));
  $('#st_otocenia').innerHTML = zapisy.map((z, r) => `<span class="${r === akt ? 'akt' : ''}">${z}</span>`).join('');
  $('#st_text').innerHTML = STOL.pripnute ? vypln(P.stolPribodnute, { n1: n - 1, v: fmt(v), i: STOL.idx + 1 }) : vypln(P.stolOtocenia, { n });
  $('#st_vzorec').innerHTML = vypln(P.stolVzorec, { n, f: fmt(f), v: fmt(v) });
}
// počet sedení okolo okrúhleho stola – vzorec aj hrubou silou (pre test)
const okruhlyStol = n => n <= 0 ? 0n : KOMB.factorial(n - 1);
function okruhlyStolHrubo(n) {
  const s = new Set();
  for (const a of GEN.permutacie(n)) { const i = a.indexOf(0); s.add(a.slice(i).concat(a.slice(0, i)).join(',')); }
  return BigInt(s.size);
}

// desiatkový logaritmus veľkého čísla (BigInt) – pre grafy v logaritmickej mierke
function log10Big(b) { const s = cifry(b); return s.length - 1 + Math.log10(Number(s[0] + '.' + (s.slice(1, 15) || '0'))); }
// klesajúce činitele n, n − 1, …, n − k + 1
const klesajuce = (n, k) => Array.from({ length: k }, (_, i) => n - i);
const sucinText = arr => arr.length ? arr.join(' · ') : '1';
// zápis „n nad k“
const binomHTML = (n, k) => `<span class="binom" aria-label="${n} nad ${k}"><span class="bz">(</span><span class="bs"><span>${n}</span><span>${k}</span></span><span class="bz">)</span></span>`;
// skupina v množinovom zápise {A, C, D}
const skupinaText = a => a.length ? '{' + a.slice().sort((x, y) => x - y).map(pismeno).join(', ') + '}' : '∅';
// číslica ako ikona (PIN, kódy) – rozlíšená samotnou číslicou
const cifraSVG = (c, vel = 40) => `<svg class="ikon" viewBox="0 0 40 40" width="${vel}" height="${vel}" aria-hidden="true" focusable="false"><rect x="3" y="3" width="34" height="34" rx="8" fill="#1b2a48" stroke="#6fb4ff" stroke-width="2"/><text x="20" y="28.5" text-anchor="middle" font-size="22" font-weight="800" fill="#e2e8f5" font-family="system-ui,Segoe UI,sans-serif">${c}</text></svg>`;
// porovnanie oboch ciest (zdravý rozum × vzorec)
const porovnanieHTML = (a, b, rovnake) => `<p>${vypln(T.perm.porovnanie, { a, b })}</p><p><b>${rovnake ? T.ui.rovnake : '✗'}</b></p>`;
// popis zoznamu: všetky / len prvých 30

/* --- posuvník s tlačidlami − / + (dĺžka hesla) --- */
function posuvnik(el, { nazov, min, max, hodnota, zmena }) {
  el.innerHTML = `<div class="sl"><span class="lbl"><span>${nazov}</span><b></b></span>
    <span class="slRiadok"><button type="button" aria-label="${nazov}: ${T.ui.menej}">−</button>
    <input type="range" min="${min}" max="${max}" step="1" value="${hodnota}" aria-label="${nazov}">
    <button type="button" aria-label="${nazov}: ${T.ui.viac}">+</button></span></div>`;
  const inp = $('input', el), out = $('b', el), [bm, bp] = $$('button', el);
  const P = { get: () => +inp.value };
  P.ukaz = () => { out.textContent = inp.value; bm.disabled = +inp.value <= min; bp.disabled = +inp.value >= max; };
  inp.addEventListener('input', () => { P.ukaz(); zmena(+inp.value); });
  const pridaj = d => { inp.value = clamp(+inp.value + d, min, max); P.ukaz(); zmena(+inp.value); };
  bm.onclick = () => pridaj(-1); bp.onclick = () => pridaj(1);
  P.ukaz();
  return P;
}

/* --- stĺpcový graf v logaritmickej mierke pre ľubovoľné BigInt hodnoty --- */
function logGraf(cv, { hodnoty, popisky, vyb }) {
  if (!viditelne(cv)) return null;
  const W = cv.clientWidth, H = Math.round(clamp(W * .55, 230, 340));
  const ctx = pripravPlatno(cv, W, H);
  const l = 56, r = 8, tp = 14, bt = 30, pw = W - l - r, ph = H - tp - bt, N = hodnoty.length, cw = pw / N;
  const logy = hodnoty.map(log10Big), maxL = Math.max(3, ...logy);
  const krokE = Math.max(1, Math.ceil(maxL / 18)) * 3;    // najviac asi 6 vodorovných čiar
  const EMAX = Math.ceil(maxL / krokE) * krokE;
  const yE = e => tp + ph - e / EMAX * ph;
  ctx.font = PISMO; ctx.textBaseline = 'middle';
  for (let e = 0; e <= EMAX; e += krokE) {
    ctx.strokeStyle = 'rgba(140,160,215,.2)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(l, yE(e)); ctx.lineTo(W - r, yE(e)); ctx.stroke();
    ctx.fillStyle = '#a3adc6'; ctx.textAlign = 'right'; ctx.fillText('10' + hornyIndex(e), l - 6, yE(e));
  }
  const krok = cw >= 22 ? 1 : 2;
  ctx.textAlign = 'center';
  logy.forEach((lg, i) => {
    const h = lg / EMAX * ph, x = l + i * cw + cw * .15, w = cw * .7, v = i === vyb;
    ctx.fillStyle = v ? '#f3b453' : 'rgba(111,180,255,.75)';
    ctx.fillRect(x, tp + ph - h, w, Math.max(h, 2));
    if (v) { ctx.strokeStyle = '#ffd88a'; ctx.lineWidth = 2; ctx.strokeRect(x, tp + ph - h, w, Math.max(h, 2)); }
    if (i % krok === (krok - 1) % krok || v) { ctx.fillStyle = v ? '#ffd88a' : '#a3adc6'; ctx.font = v ? PISMO_B : PISMO; ctx.fillText(popisky[i], x + w / 2, H - bt / 2); }
  });
  ctx.textAlign = 'left';
  return { l, cw, N, W };
}

  $('#kb_zoskBtn').onclick = () => { KB.mod = KB.mod === 'usp' ? 'neusp' : 'usp'; rozlozZosk(true); };
  // ťuknutie na výber zvýrazní všetky výbery s tými istými prvkami
  const zvyrazni = c => { const sk = c.dataset.sk, uz = c.classList.contains('rovn'); KB.chips.forEach(x => x.classList.toggle('rovn', !uz && x.dataset.sk === sk)); };
  $('#kb_zosk').addEventListener('click', e => { const c = e.target.closest('.zch'); if (c) zvyrazni(c); });
  $('#kb_zosk').addEventListener('keydown', e => { const c = e.target.closest('.zch'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); zvyrazni(c); } });
  // symetria
  $('#sy_prvky').addEventListener('click', e => { const b = e.target.closest('button[data-p]'); if (!b) return; const p = +b.dataset.p; if (KB.sym.has(p)) KB.sym.delete(p); else KB.sym.add(p); obnovSym(); });
  $('#sy_prehod').onclick = () => { KB.sym = new Set([...Array(KB.n).keys()].filter(p => !KB.sym.has(p))); obnovSym(); };
  // príklady z praxe a veľké čísla
  const riadok = p => `<div class="r">${vypln(K.praxRiadok, { t: p.t, k: p.k, n: p.n, sucin: sucinText(klesajuce(p.n, p.k)), Vv: fmtHTML(KOMB.V(p.k, p.n)), kf: fmt(KOMB.factorial(p.k)), K: fmtHTML(KOMB.K(p.k, p.n)) })}</div>`;
  $('#kb_prax').innerHTML = K.prax.map(riadok).join('');
  $('#kb_velke').innerHTML = K.velke.map(riadok).join('');
  initRuka();
  obnovKombBez();
}
function obnovKombBez() {
  const K = T.komb, { n, k } = KB, V = KOMB.V(k, n), kf = KOMB.factorial(k), C = KOMB.K(k, n);
  KB.M.nastav({ n, k, delitel: kf });
  // zdravý rozum: V(k, n), potom : k!
  const prva = [...Array(k).keys()], por = [];
  for (const pp of GEN.permutacie(k)) { if (por.length >= 6) { por.push('…'); break; } por.push(pp.map(i => pismeno(prva[i])).join('')); }
  $('#kb_kroky').innerHTML = [
    vypln(K.krok1, { k, n, sucin: sucinText(klesajuce(n, k)), V: fmtHTML(V) }),
    vypln(K.krok2, { skup: skupinaText(prva), poradia: por.join(', '), k, kf: fmt(kf) }),
    vypln(K.krok3, { V: fmtHTML(V), kf: fmt(kf), K: fmtHTML(C) })
  ].map(t => `<div class="r">${t}</div>`).join('');
  // vzorec
  $('#kb_vzorec').innerHTML = `<div class="kroky"><div class="r">${K.vz1}</div><div class="r">${K.vz2}</div>` +
    `<div class="r vys">K(${k}, ${n}) = ${n}! / (${k}! · ${n - k}!) = ${fmtHTML(KOMB.factorial(n))} / (${fmt(kf)} · ${fmt(KOMB.factorial(n - k))}) = ${fmtHTML(C)}</div></div>`;
  $('#kb_binom').innerHTML = vypln(K.binomText, { binom: binomHTML(n, k) + ' = ' + fmt(C), n, k });
  const rozum = KB.M.vysledok();
  $('#kb_porov').innerHTML = porovnanieHTML(`${fmt(V)} : ${fmt(kf)} = ${fmt(rozum)}`, `${n}! / (${k}! · ${n - k}!) = ${fmt(C)}`, rozum === C);
  zostavZosk();
  $('#kb_zozInfo').innerHTML = zoznamInfo(C);
  vypisZoznam($('#kb_zoz'), GEN.kombinacie(k, n), C, (a, i) => `<span class="pz"><span class="c">${i + 1}.</span>${skupinaText(a)}</span>`, 'text');
  KB.sym = new Set(prva); obnovSym();
}

/* --- animácia: usporiadané výbery sa zoskupia do skupín po k! (FLIP: zapamätaj → presuň → dobehni) --- */
function zostavZosk() {
  const K = T.komb, { n, k } = KB, V = KOMB.V(k, n), kf = KOMB.factorial(k);
  $('#kb_zoskNadpis').innerHTML = vypln(K.zoskNadpis, { V: fmt(V), K: fmt(KOMB.K(k, n)) });
  KB.zrus(); KB.chips = [];
  const vela = V > BigInt(VYPIS_MAX);
  $('#kb_zoskBtn').disabled = vela; $$('#kb_mod button').forEach(b => { b.disabled = vela; });
  if (vela) { $('#kb_zoskText').innerHTML = ''; $('#kb_zosk').innerHTML = `<p class="mini">${vypln(K.zoskVela, { V: fmtHTML(V) })}</p>`; return; }
  $('#kb_zoskText').innerHTML = vypln(K.zoskText, { kf: fmt(kf) });
  for (const a of GEN.variacie(k, n)) {
    const c = document.createElement('span');
    c.className = 'zch'; c.tabIndex = 0; c.setAttribute('role', 'button'); c.setAttribute('aria-label', a.map(pismeno).join(''));
    c.dataset.sk = a.slice().sort((x, y) => x - y).join(',');
    c.innerHTML = a.map(p => prvokSVG(p, 22)).join('');
    KB.chips.push(c);
  }
  rozlozZosk(false);
}
function rozlozZosk(anim) {
  const K = T.komb, box = $('#kb_zosk');
  $$('#kb_mod button').forEach(b => b.classList.toggle('on', b.dataset.m === KB.mod));
  $('#kb_zoskBtn').textContent = KB.mod === 'usp' ? K.zoskBtn : K.rozskBtn;
  if (!KB.chips.length) return;
  const animovat = anim && viditelne(box) && !MALO_POHYBU;
  const stare = animovat ? KB.chips.map(c => c.getBoundingClientRect()) : null;
  if (KB.mod === 'usp') {
    const z = document.createElement('div'); z.className = 'zoznam';
    KB.chips.forEach(c => z.appendChild(c)); box.replaceChildren(z);
  } else {
    const g = document.createElement('div'), mapa = new Map(), kf = fmt(KOMB.factorial(KB.k));
    g.className = 'skupiny';
    for (const a of GEN.kombinacie(KB.k, KB.n)) {
      const s = document.createElement('div'); s.className = 'skupina';
      s.innerHTML = `<b>${vypln(K.skupinaHlav, { skup: skupinaText(a), kf })}</b><div class="zoznam"></div>`;
      mapa.set(a.join(','), $('.zoznam', s)); g.appendChild(s);
    }
    KB.chips.forEach(c => mapa.get(c.dataset.sk).appendChild(c));
    box.replaceChildren(g);
  }
  KB.zrus();
  if (!animovat) { KB.chips.forEach(c => { c.style.transform = ''; }); return; }
  const nove = KB.chips.map(c => c.getBoundingClientRect()), N = KB.chips.length;
  const d = KB.chips.map((c, i) => [stare[i].left - nove[i].left, stare[i].top - nove[i].top]);
  const krok = u => KB.chips.forEach((c, i) => {
    const e = ease(clamp(u * 1.5 - .5 * i / N, 0, 1));    // výbery štartujú postupne
    c.style.transform = e < 1 ? `translate(${(d[i][0] * (1 - e)).toFixed(1)}px,${(d[i][1] * (1 - e)).toFixed(1)}px)` : '';
  });
  krok(0);
  KB.zrus = animuj(1500, krok);
}

/* --- symetria: vybraní ✓ / vynechaní ✗ --- */
function obnovSym() {
  const K = T.komb, n = KB.n, a = KB.sym.size, b = n - a, v = KOMB.K(a, n);
  $('#sy_prvky').innerHTML = [...Array(n).keys()].map(p => {
    const ano = KB.sym.has(p);
    return `<button type="button" data-p="${p}" class="${ano ? 'ano' : 'nie'}" aria-pressed="${ano}" aria-label="${pismeno(p)}: ${ano ? K.symVyb : K.symVyn}">${prvokSVG(p, 34)}<span class="zn">${ano ? '✓' : '✗'}</span></button>`;
  }).join('');
  $('#sy_text').innerHTML = vypln(K.symText, { a, b, n, v: fmtHTML(v) });
  const kluc = [...KB.sym].sort((x, y) => x - y).join(',');
  vypisZoznam($('#sy_pary'), GEN.kombinacie(a, n), v, c => {
    const s = new Set(c), zv = [...Array(n).keys()].filter(p => !s.has(p));
    const akt = c.join(',') === kluc ? ' style="border-color:var(--gold);color:var(--gold2)"' : '';
    return `<span class="pz"${akt}>${c.map(pismeno).join('') || '∅'} ↔ ${zv.map(pismeno).join('') || '∅'}</span>`;
  }, 'text');
}

/* --- podanie ruky: všetky dvojice z n ľudí, K(2, n) --- */
const RU = { n: 6, zrus: () => {} };
function initRuka() {
  krokovac($('#ru_kr'), { nazov: T.komb.rukaLbl, min: 2, max: 12, hodnota: RU.n, zmena: v => { RU.n = v; kresliRuku(); } });

}
function kresliRuku() {
  const n = RU.n, C = 160, R = 122;
  const bod = i => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [C + R * Math.cos(a), C + R * Math.sin(a)]; };
  let h = '';
  for (const [i, j] of GEN.kombinacie(2, n)) { const [x1, y1] = bod(i), [x2, y2] = bod(j); h += `<line class="ruka" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#f3b453" stroke-width="2" opacity="0"/>`; }
  for (let i = 0; i < n; i++) { const [x, y] = bod(i); h += `<g transform="translate(${(x - 19).toFixed(1)} ${(y - 19).toFixed(1)}) scale(.95)">${prvokTvar(i, 'ziaci')}</g>`; }
  $('#ru_svg').innerHTML = h;
  const ciary = $$('#ru_svg .ruka'), x = n * (n - 1);
  $('#ru_text').innerHTML = vypln(T.komb.rukaText, { n, n1: n - 1, x, K: fmt(KOMB.K(2, n)) });
  RU.zrus();
  RU.zrus = animuj(1600, u => { const t = u * (ciary.length + 2); ciary.forEach((c, i) => c.setAttribute('opacity', (clamp(t - i, 0, 1) * .8).toFixed(2))); });
}

/* =====================================================================
   ZÁLOŽKA 3b: PASCALOV TROJUHOLNÍK (riadky 0 – 12)
   ===================================================================== */
const PA = { n: 4, k: 2, mod: 'zaklad', preco: false, vid: false, binR: -1, MAX: 12 };
const BI = { n: 4 };
function initPascal() {
  const P = T.pas;
  let h = '';
  for (let n = 0; n <= PA.MAX; n++) {
    h += `<div class="pr" data-n="${n}">`;
    for (let k = 0; k <= n; k++) { const v = KOMB.K(k, n); h += `<button type="button" class="pc" data-n="${n}" data-k="${k}" aria-label="K(${k}, ${n}) = ${v}">${fmt(v)}</button>`; }
    h += '</div>';
  }
  $('#pa_tr').innerHTML = h;
  $('#pa_tr').addEventListener('click', e => { const c = e.target.closest('.pc'); if (c) { PA.n = +c.dataset.n; PA.k = +c.dataset.k; obnovPascal(); } });
  for (const [m, t] of Object.entries(P.mody)) {
    const b = document.createElement('button'); b.dataset.m = m; b.textContent = t;
    b.onclick = () => { PA.mod = m; obnovPascal(); }; $('#pa_mod').appendChild(b);
  }
  $('#pa_preco').onclick = () => { PA.preco = !PA.preco; obnovPascal(); };
  // binomická veta
  const seg = $('#bi_n'); seg.innerHTML = `<span class="lbl">${P.binomLbl}</span>`;
  for (let n = 1; n <= 8; n++) { const b = document.createElement('button'); b.textContent = n; b.dataset.n = n; b.onclick = () => { BI.n = n; obnovBinom(); }; seg.appendChild(b); }
  $('#pa_binom').addEventListener('toggle', obnovBinom);
  // pri prvom zobrazení sa trojuholník postaví riadok po riadku
  PRI_ZOBRAZENI.push(() => {
    const tr = $('#pa_tr'); if (PA.vid || !viditelne(tr)) return;
    PA.vid = true;
    const ob = $('#pa_obal'); ob.scrollLeft = (ob.scrollWidth - ob.clientWidth) / 2;
    const riadky = $$('.pr', tr);
    animuj(1400, u => riadky.forEach((r, i) => { const a = clamp(u * 1.6 - i / riadky.length * .6, 0, 1); r.style.opacity = a; r.style.transform = a < 1 ? `translateY(${(1 - ease(a)) * -10}px)` : ''; }));
  });
  obnovPascal(); obnovBinom();
}
function obnovPascal() {
  const P = T.pas, { n, k, mod } = PA, v = KOMB.K(k, n), okraj = k === 0 || k === n;
  $$('#pa_mod button').forEach(b => b.classList.toggle('on', b.dataset.m === mod));
  $$('#pa_tr .pc').forEach(c => {
    const cn = +c.dataset.n, ck = +c.dataset.k, l = c.classList;
    l.remove('vyb', 'rod', 'zrk', 'diag', 'riad', 'bin');
    if (cn === PA.binR) l.add('bin');
    if (cn === n && ck === k) { l.add('vyb'); return; }
    if (mod === 'zaklad' && !okraj && cn === n - 1 && (ck === k - 1 || ck === k)) l.add('rod');
    if (mod === 'sym' && cn === n && ck === n - k) l.add('zrk');
    if (mod === 'sucet' && cn === n) l.add('riad');
    if (mod === 'diag' && cn >= 1 && (ck === 1 || ck === cn - 1)) l.add('diag');
  });
  $('#pa_info').innerHTML = vypln(P.info, { n, k, v: fmt(v) }) +
    (okraj ? P.infoOkraj : vypln(P.infoRod, { k, k1: k - 1, n1: n - 1, a: fmt(KOMB.K(k - 1, n - 1)), b: fmt(KOMB.K(k, n - 1)) }));
  // text podľa vybranej vlastnosti
  const riadok = [...Array(n + 1).keys()].map(j => KOMB.K(j, n));
  const texty = {
    zaklad: P.modZaklad,
    sym: vypln(P.modSym, { k, n, nk: n - k, v: fmt(v) }),
    sucet: vypln(P.modSucet, { n, scit: riadok.map(fmt).join(' + '), s: fmt(KOMB.sucet(riadok)), exp: hornyIndex(n) }) + '<br>' +
      vypln(P.modSucetVsetky, { zoz: [...Array(PA.MAX + 1).keys()].map(j => fmt(2n ** BigInt(j))).join(', ') }),
    diag: P.modDiag
  };
  $('#pa_modText').innerHTML = `<p>${texty[mod]}</p>`;
  // prečo súčet dvoch nad ním – rozdelíme skupiny podľa posledného prvku
  $('#pa_preco').textContent = PA.preco ? P.precoSkry : P.precoBtn;
  const box = $('#pa_precoBox'); box.hidden = !PA.preco;
  if (PA.preco) {
    if (okraj || n === 0) box.innerHTML = `<p>${P.precoOkraj}</p>`;
    else {
      const X = pismeno(n - 1), a = KOMB.K(k - 1, n - 1), b = KOMB.K(k, n - 1), vsetky = [...GEN.kombinacie(k, n)];
      box.innerHTML = `<p>${vypln(P.preco, { k, n, X, k1: k - 1, n1: n - 1, a: fmt(a), b: fmt(b), v: fmt(v) })}</p>` +
        `<p class="mini">${vypln(P.sX, { X, a: fmt(a) })}</p><div class="pa_s"></div><p class="mini">${vypln(P.bezX, { X, b: fmt(b) })}</p><div class="pa_bez"></div>`;
      const s = vsetky.filter(c => c.includes(n - 1)), bez = vsetky.filter(c => !c.includes(n - 1));
      vypisZoznam($('.pa_s', box), s, BigInt(s.length), c => `<span class="pz">${skupinaText(c)}</span>`, 'text');
      vypisZoznam($('.pa_bez', box), bez, BigInt(bez.length), c => `<span class="pz">${skupinaText(c)}</span>`, 'text');
    }
  }
  // zoznam skupín pre vybrané číslo
  $('#pa_skupInfo').innerHTML = vypln(P.skupiny, { k, n }) + ' ' + zoznamInfo(v);
  vypisZoznam($('#pa_zoz'), GEN.kombinacie(k, n), v, c => `<span class="pz">${skupinaText(c)}</span>`, 'text');
}
function obnovBinom() {
  const P = T.pas, n = BI.n;
  $$('#bi_n button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  const cast = (z, e) => e === 0 ? '' : e === 1 ? z : z + hornyIndex(e);
  const cleny = [...Array(n + 1).keys()].map(k => { const c = KOMB.K(k, n); return (c === 1n ? '' : fmt(c)) + cast('a', n - k) + cast('b', k); });
  $('#bi_vzorec').innerHTML = `(a + b)${hornyIndex(n)} = ${cleny.join(' + ')}`;
  $('#bi_riadok').innerHTML = vypln(P.binomRiadok, { n, zoz: [...Array(n + 1).keys()].map(k => fmt(KOMB.K(k, n))).join(', ') });
  PA.binR = $('#pa_binom').open ? n : -1;
  obnovPascal();
}

/* =====================================================================
   ČASŤ 3 – SPOLOČNÉ POMÔCKY
   ===================================================================== */
const DOLNE = '₀₁₂₃₄₅₆₇₈₉';
const dolnyIndex = n => String(n).split('').map(z => DOLNE[+z]).join('');
// rozbor slova: písmená v poradí prvého výskytu a ich počty (MAMA → M×2, A×2)
const PISMENA_SK = /^[A-ZÁÄČĎÉÍĹĽŇÓÔŔŠŤÚÝŽ]+$/;
function rozborSlova(vstup, { min = 3, max = 10 } = {}) {
  const O = T.opak, s = String(vstup == null ? '' : vstup).normalize('NFC').replace(/\s/g, '').toLocaleUpperCase('sk');
  if (!s) return { chyba: O.chybaPrazdne };
  if (!PISMENA_SK.test(s)) return { chyba: O.chybaZnaky };
  const pis = [...s];
  if (pis.length < min) return { chyba: vypln(O.chybaKratke, { min }) };
  if (pis.length > max) return { chyba: vypln(O.chybaDlhe, { max }) };
  const pismena = [], pocty = [];
  pis.forEach(c => { const i = pismena.indexOf(c); if (i < 0) { pismena.push(c); pocty.push(1); } else pocty[i]++; });
  return { slovo: s, pismena, pocty, n: pis.length };
}
const rozpisText = r => r.pismena.map((p, i) => `${p}×${r.pocty[i]}`).join(', ');
// n! / (n₁! · n₂! · …) – zápis a čísla
const ppZapis = pocty => `${pocty.reduce((a, b) => a + b, 0)}! / (${pocty.map(c => c + '!').join(' · ')})`;
const ppMenovatel = pocty => KOMB.sucin(pocty.map(c => KOMB.factorial(c)));
// otvorí kartu a podkartu (z tabuľky typov alebo zo sprievodcu)
function otvorKartu(ciel) {
  const [id, pod] = ciel.split('/');
  ukazKartu(id);
  if (pod && PODKARTY_STAV[id]) PODKARTY_STAV[id].ukaz(pod);
  window.scrollTo({ top: 0, behavior: MALO_POHYBU ? 'auto' : 'smooth' });
}
/* --- zoskupenie čipov do skupín s animáciou FLIP (všeobecná verzia; KB v časti 2 má vlastnú) ---
   st = { box, chips, mod: 'usp' | 'skup', kluce: [kľúč skupiny…], nadpis: kľúč => html, zrus } */
function flipRozloz(st, anim) {
  if (!st.chips.length) return;
  const animovat = anim && viditelne(st.box) && !MALO_POHYBU;
  const stare = animovat ? st.chips.map(c => c.getBoundingClientRect()) : null;
  if (st.mod === 'usp') {
    const z = document.createElement('div'); z.className = 'zoznam';
    st.chips.forEach(c => z.appendChild(c)); st.box.replaceChildren(z);
  } else {
    const g = document.createElement('div'), mapa = new Map(); g.className = 'skupiny';
    st.kluce.forEach(k => {
      const s = document.createElement('div'); s.className = 'skupina';
      s.innerHTML = `<b>${st.nadpis(k)}</b><div class="zoznam"></div>`;
      mapa.set(k, $('.zoznam', s)); g.appendChild(s);
    });
    st.chips.forEach(c => mapa.get(c.dataset.sk).appendChild(c));
    st.box.replaceChildren(g);
  }
  st.zrus();
  if (!animovat) { st.chips.forEach(c => { c.style.transform = ''; }); return; }
  const nove = st.chips.map(c => c.getBoundingClientRect()), N = st.chips.length;
  const d = st.chips.map((c, i) => [stare[i].left - nove[i].left, stare[i].top - nove[i].top]);
  const krok = u => st.chips.forEach((c, i) => {
    const e = ease(clamp(u * 1.5 - .5 * i / N, 0, 1));
    c.style.transform = e < 1 ? `translate(${(d[i][0] * (1 - e)).toFixed(1)}px,${(d[i][1] * (1 - e)).toFixed(1)}px)` : '';
  });
  krok(0);
  st.zrus = animuj(1500, krok);
}
// ťuknutie na čip zvýrazní všetky čipy s tým istým kľúčom
function zvyraznovanieCipov(box, dajCipy) {
  const f = c => { const sk = c.dataset.sk, uz = c.classList.contains('rovn'); dajCipy().forEach(x => x.classList.toggle('rovn', !uz && x.dataset.sk === sk)); };
  box.addEventListener('click', e => { const c = e.target.closest('.zch'); if (c) f(c); });
  box.addEventListener('keydown', e => { const c = e.target.closest('.zch'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); f(c); } });
}

/* =====================================================================
   ZÁLOŽKA 4a: PERMUTÁCIE S OPAKOVANÍM  P′(n₁, …, nₘ) = n! / (n₁! · … · nₘ!)
   ===================================================================== */
const PO = { slovo: 'MAMA', roz: null, zosk: { box: null, chips: [], mod: 'usp', kluce: [], nadpis: k => k, zrus: () => {} } };
function initPermOpak() {
  const O = T.opak, inp = $('#po_slovo');
  inp.value = PO.slovo;
  inp.addEventListener('input', obnovPermOpak);
  PO.zosk.box = $('#po_zosk');
  [['usp', O.modUsp], ['skup', O.modSlova]].forEach(([m, t]) => {
    const b = document.createElement('button'); b.dataset.m = m; b.textContent = t;
    b.onclick = () => { if (PO.zosk.mod !== m) { PO.zosk.mod = m; rozlozPermOpak(true); } }; $('#po_mod').appendChild(b);
  });

const KP = { n: 5, k: 3, rad: [] };                       // rad: true = kopček, false = priečka
// rad z rozdelenia kopčekov medzi príchute [r₀, r₁, …]
function radZRozdelenia(r) { const a = []; r.forEach((c, i) => { for (let j = 0; j < c; j++) a.push(true); if (i < r.length - 1) a.push(false); }); return a; }
// rozdelenie z radu: koľko kopčekov je medzi priečkami
function rozdelenieZRadu(rad, n) { const r = Array(n).fill(0); let f = 0; rad.forEach(x => { if (x) r[Math.min(f, n - 1)]++; else f++; }); return r; }
function zaciatocnyRad() { const { n, k } = KP, r = Array(n).fill(0); if (n >= 2 && k >= 2) { r[0] = k - 1; r[1] = 1; } else r[0] = k; return radZRozdelenia(r); }

  krokovac(kr, { nazov: O.kLbl, min: 1, max: 6, hodnota: KP.k, zmena: v => { KP.k = v; KP.rad = zaciatocnyRad(); obnovKombOpak(); } });
  $('#kp_rad').addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (!b) return; KP.rad[+b.dataset.i] = !KP.rad[+b.dataset.i]; obnovGP(); });
