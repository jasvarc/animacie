    if (i < 0) a.splice(0, a.length, ...[...Array(KP.k).keys()]);
    else { a[i]++; for (let j = i + 1; j < KP.k; j++) a[j] = a[j - 1] + 1; }
    KP.rad = Array(m).fill(false); a.forEach(j => { KP.rad[j] = true; }); obnovGP();
  };
  $('#kp_nahodne').onclick = () => {

  $('#kp_kocky').innerHTML = h;
  $('#kp_kockyText').innerHTML = vypln(O.kockyText, { U: fmt(KOMB.Vp(2, 6)), N: fmt(KOMB.Kp(2, 6)) });
  KP.rad = zaciatocnyRad();

}

/* =====================================================================
   ZÁLOŽKA 5: AKO ROZHODNÚŤ – sprievodca, kalkulačka, tabuľka typov, hra
   ===================================================================== */
const KALK_MAX = 60;
// celé číslo zo vstupu; pri chybe zrozumiteľné vysvetlenie (nič nevyhodí výnimku)
function citajCele(s, co, max = KALK_MAX) {
  const C = T.roz.chyby;
  s = String(s == null ? '' : s).trim().replace(/\s/g, '').replace(/[−–]/g, '-');
  if (s === '') return { chyba: vypln(C.prazdne, { co }) };
  if (!/^-?(\d+([.,]\d*)?|[.,]\d+)$/.test(s)) return { chyba: vypln(C.nieCislo, { co }) };
  const x = parseFloat(s.replace(',', '.'));
  if (!Number.isInteger(x)) return { chyba: vypln(C.necele, { co }) };
  if (x < 0) return { chyba: vypln(C.zaporne, { co }) };
  if (x > max) return { chyba: vypln(C.velke, { co, max }) };
  return { v: x };
}
const clenyText = (n, k) => k === 0 ? '1' : k <= 12 ? klesajuce(n, k).join(' · ') : `${n} · ${n - 1} · … · ${n - k + 1}`;
/* výpočet pre ľubovoľný typ: vstup = { n, k, opak } (texty alebo čísla)
   → { ok: true, N, kroky: [html…], kratko } alebo { ok: false, chyba } */
function vypocet(typ, vstup = {}) {
  const R = T.roz, C = R.chyby, ty = R.typy[typ];
  if (!ty) return { ok: false, chyba: '?' };
  try {
    if (typ === 'Pp') {
      const s = String(vstup.opak == null ? '' : vstup.opak).trim();
      if (!s) return { ok: false, chyba: C.opakPrazdne };
      let pocty, popis = '';
      if (/\p{L}/u.test(s)) {                              // zadané slovo
        const r = rozborSlova(s, { min: 1, max: KALK_MAX });
        if (r.chyba) return { ok: false, chyba: r.chyba };
        pocty = r.pocty; popis = vypln(R.slovoRozpis, { slovo: r.slovo, rozpis: rozpisText(r) });
      } else {                                             // zadané počty
        const casti = s.split(/[\s,;]+/).filter(Boolean);
        if (!casti.length || !casti.every(c => /^\d+$/.test(c))) return { ok: false, chyba: C.opakZle };
        pocty = casti.map(Number);
        if (pocty.some(c => c < 1)) return { ok: false, chyba: C.opakZle };
      }
      const n = pocty.reduce((a, b) => a + b, 0);
      if (n > KALK_MAX || pocty.length > 20) return { ok: false, chyba: vypln(C.opakVela, { max: KALK_MAX }) };
      const nf = KOMB.factorial(n), d = ppMenovatel(pocty), N = KOMB.Pp(pocty);
      const kroky = [`P′(${pocty.join(', ')}) = ${ppZapis(pocty)}`, `= ${fmtHTML(nf)} : (${pocty.map(c => fmt(KOMB.factorial(c))).join(' · ')}) = ${fmtHTML(nf)} : ${fmtHTML(d)}`, `= ${fmtHTML(N)}`];
      if (popis) kroky.unshift(popis);
      return { ok: true, N, kroky, kratko: `${ppZapis(pocty)} = ${fmt(N)}` };
    }
    const nn = citajCele(vstup.n, 'n'); if (nn.chyba) return { ok: false, chyba: nn.chyba, pole: 'n' };
    const n = nn.v;
    if (typ === 'P') {
      const N = KOMB.P(n);
      return { ok: true, N, kroky: [`P(${n}) = ${n}!`, `= ${clenyText(n, n)}`, `= ${fmtHTML(N)}`], kratko: `${n}! = ${fmt(N)}` };
    }
    const kk = citajCele(vstup.k, 'k'); if (kk.chyba) return { ok: false, chyba: kk.chyba, pole: 'k' };
    const k = kk.v;
    if ((typ === 'V' || typ === 'K') && k > n) return { ok: false, chyba: vypln(C.kVacsie, { typ: ty.zn, k, n }), pole: 'k' };
    if (typ === 'V') {
      const N = KOMB.V(k, n);
      return { ok: true, N, kroky: [`V(${k}, ${n}) = ${n}! / ${n - k}!`, `= ${clenyText(n, k)}`, `= ${fmtHTML(N)}`], kratko: `${clenyText(n, k)} = ${fmt(N)}` };
    }
    if (typ === 'Vp') {
      const N = KOMB.Vp(k, n), c = k === 0 ? '1' : k <= 12 ? Array(k).fill(n).join(' · ') : `${n} · ${n} · … · ${n} (${k}-krát)`;
      return { ok: true, N, kroky: [`V′(${k}, ${n}) = ${n}${hornyIndex(k)}`, `= ${c}`, `= ${fmtHTML(N)}`], kratko: `${n}${hornyIndex(k)} = ${fmt(N)}` };
    }
    if (typ === 'K') {
      const N = KOMB.K(k, n), V = KOMB.V(k, n), kf = KOMB.factorial(k);
      return { ok: true, N, kroky: [`K(${k}, ${n}) = ${n}! / (${k}! · ${n - k}!)`, `= V(${k}, ${n}) : ${k}! = ${fmtHTML(V)} : ${fmt(kf)}`, `= ${fmtHTML(N)}`], kratko: `${fmt(V)} : ${fmt(kf)} = ${fmt(N)}` };
    }
    if (typ === 'Kp') {
      if (n < 1) return { ok: false, chyba: C.nulaDruhov, pole: 'n' };
      const m = n + k - 1, N = KOMB.Kp(k, n), V = KOMB.V(k, m), kf = KOMB.factorial(k);
      return { ok: true, N, kroky: [`K′(${k}, ${n}) = K(${k}, ${n} + ${k} − 1) = K(${k}, ${m})`, `= ${m}! / (${k}! · ${m - k}!) = V(${k}, ${m}) : ${k}! = ${fmtHTML(V)} : ${fmt(kf)}`, `= ${fmtHTML(N)}`], kratko: `K(${k}, ${m}) = ${fmt(N)}` };
    }
  } catch (e) { return { ok: false, chyba: String(e && e.message || e) }; }
  return { ok: false, chyba: '?' };
}
// sprievodca: odpovede { vsetky, poradie, opak } → typ, cez ten istý strom otázok ako na obrazovke
function sprievodcaTyp(odp) {
  const Q = T.roz.otazky; let q = 'q1';
  for (let i = 0; i < 6 && Q[q]; i++) q = (odp[Q[q].kluc] ? Q[q].ano : Q[q].nie).dalej;
  return q;
}

  }
  $('#sp_spat').disabled = !SP.cesta.length;
  $('#sp_znova').disabled = !SP.cesta.length;

const KA = { typ: 'K' };
function initKalk() {
  const R = T.roz, seg = $('#ka_typ');
  for (const [t, ty] of Object.entries(R.typy)) {
    const b = document.createElement('button'); b.dataset.t = t; b.textContent = ty.zn; b.title = ty.nazov;

// hodnota rovnakej úlohy tak, ako ju počíta samostatná karta (pre test sprievodcu)
function hodnotaKarty(typ, par) {
  const pm = hodnotaKarty.pm || (hodnotaKarty.pm = polickovyModel(document.createElement('div'), {}));
  const n = +par.n, k = +par.k;
  if (typ === 'P') { pm.nastav({ n, k: n, opakovanie: false, delitel: null }); return pm.pocet(); }
  if (typ === 'V') { pm.nastav({ n, k, opakovanie: false, delitel: null }); return pm.pocet(); }
  if (typ === 'Vp') { pm.nastav({ n, k, opakovanie: true, delitel: null }); return pm.pocet(); }
  if (typ === 'K') { pm.nastav({ n, k, opakovanie: false, delitel: KOMB.factorial(k) }); return pm.vysledok(); }
  let c = 0n;

/* =====================================================================
   ČASŤ 4 – POMÔCKY PRE PRAVDEPODOBNOSŤ (zlomky počítame presne cez BigInt)
   ===================================================================== */
function nsdBig(a, b) { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) [a, b] = [b, a % b]; return a || 1n; }
const zlomokRed = (m, n) => { const g = nsdBig(m, n); return [m / g, n / g]; };
// m / n ako bežné desatinné číslo – aj keď sú m a n obrovské (narodeniny: 365⁷⁰)
function pomer(m, n) { m = KOMB.big(m); n = KOMB.big(n); if (n === 0n) return NaN; const S = 10n ** 18n; return Number(m * S / n) / 1e18; }
// počet desatinných miest pre percentá: aspoň 2, pri malých číslach toľko, aby boli vidieť 3 platné číslice
const percentMiest = x => x <= 0 ? 2 : Math.min(12, Math.max(2, 2 - Math.floor(Math.log10(x))));
const percentText = p => cisN(p * 100, percentMiest(p * 100)) + NBSP + '%';
const desatinneText = p => p === 0 || p === 1 ? String(p) : p >= 0.001 ? cisN(p, 4) : vedeckyN(p, 2);
// časti zápisu pravdepodobnosti: zlomok (aj krátený), desatinné číslo, percentá; „=“ ak je zápis presný, inak „≈“
function pravCasti(m, n) {
  m = KOMB.big(m); n = KOMB.big(n);
  const [a, b] = zlomokRed(m, n), p = pomer(m, n);
  const presne = d => (a * 10n ** BigInt(d)) % b === 0n;
  const dD = p >= 0.001 || p === 0 ? 4 : 99, dP = percentMiest(p * 100) + 2;
  return {
    p, a, b,
    zl: `${fmt(m)}/${fmt(n)}` + (b !== n ? ` = ${fmt(a)}/${fmt(b)}` : ''),
    dec: (presne(dD) ? '= ' : '≈ ') + desatinneText(p),
    per: (presne(dP) ? '= ' : '≈ ') + percentText(p)
  };
}
const pravHTML = (m, n) => { const q = pravCasti(m, n); return `<span class="pr">${q.zl}</span> <span class="pr">${q.dec}</span> <span class="pr">${q.per}</span>`; };
const pravBezZlomku = (m, n) => { const q = pravCasti(m, n); return `<span class="pr">${q.dec}</span> <span class="pr">${q.per}</span>`; };
const nastavStupnicu = (el, p) => { $('b', el).style.left = (clamp(p, 0, 1) * 100).toFixed(2) + '%'; };
// stena kocky s bodkami
const BODKY = { 1: [[20, 20]], 2: [[11, 11], [29, 29]], 3: [[11, 11], [20, 20], [29, 29]], 4: [[11, 11], [29, 11], [11, 29], [29, 29]], 5: [[11, 11], [29, 11], [20, 20], [11, 29], [29, 29]], 6: [[11, 10], [29, 10], [11, 20], [29, 20], [11, 30], [29, 30]] };
const kockaSVG = (v, vel = 44) => `<svg class="ikon" viewBox="0 0 40 40" width="${vel}" height="${vel}" aria-hidden="true" focusable="false"><rect x="2" y="2" width="36" height="36" rx="7" fill="#e2e8f5"/>${BODKY[v].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.7" fill="#0b0f1a"/>`).join('')}</svg>`;
const hodKockou = (rnd = Math.random) => 1 + Math.floor(rnd() * 6);
// simulácia: koľkokrát padla každá stena pri `pocet` hodoch
function simulujKocku(pocet, rnd = Math.random) { const c = [0, 0, 0, 0, 0, 0]; for (let i = 0; i < pocet; i++) c[hodKockou(rnd) - 1]++; return c; }
// narodeniny: P(aspoň dvaja z n majú ten istý deň) = 1 − V(n, 365) / V′(n, 365)
function narodeniny(n) { const V = KOMB.V(n, 365), Vp = KOMB.Vp(n, 365); return { V, Vp, p: 1 - pomer(V, Vp) }; }
// riadky postupu m, n, P a typ kombinatoriky
function praxPostup(el, typEl, { nZ, nV, mZ, mV, typ }) {
  const P = T.prav;
  el.innerHTML = [vypln(P.radN, { z: nZ, v: fmtHTML(nV) }), vypln(P.radM, { z: mZ, v: fmtHTML(mV) }), vypln(P.radP, { p: pravHTML(mV, nV) })]
    .map((t, i) => `<div class="r${i === 2 ? ' vys' : ''}">${t}</div>`).join('');
  typEl.innerHTML = `<b>${P.typLbl}</b> ${typ}`;

// tabuľka rozdelenia: riadky [popis, m], spoločné n, zvýraznený riadok

const JAVY2 = { sucet7: (a, b) => a + b === 7, sestka: (a, b) => a === 6 || b === 6, rovnake: (a, b) => a === b, sucet10: (a, b) => a + b >= 10, nic: () => false };

/* --- simulácia hodov dvoma kockami --- */
function resetSim() { const S = KL.sim; S.zrus(); S.h = 0; S.m = 0; S.body = []; S.kresleneDo = 0; kresliSim(0); textSim(); }
function textSim() {
  const P = T.prav, S = KL.sim;
  if (!KL.vyb.size) { $('#si_vys').innerHTML = P.simPrazdne; return; }
  if (!S.h) { $('#si_vys').innerHTML = P.simZaciatok; return; }
  const r = S.m / S.h, p = KL.vyb.size / 36;
  $('#si_vys').innerHTML = vypln(P.simStav, { h: fmt(S.h), m: fmt(S.m), r: `${cisN(r, 4)} (${percentText(r)})`, p: `${cisN(p, 4)} (${percentText(p)})`, d: cisN(Math.abs(r - p), 4) });
}
function simHod() {
  const S = KL.sim;
  if (!KL.vyb.size) { textSim(); return; }
  const od = S.h;
  for (let i = 0; i < 1000; i++) {
    const a = hodKockou(), b = hodKockou(); S.h++;
    if (KL.vyb.has(a + ',' + b)) S.m++;
    if (S.h % 10 === 0) S.body.push([S.h, S.m / S.h]);
  }
  textSim();
  S.zrus();                                                // graf sa dokreslí plynule (rAF, skutočný čas)
  S.zrus = animuj(1200, u => kresliSim(od + (S.h - od) * u));
}
function kresliSim(doH) {
  const cv = $('#si_graf'), S = KL.sim; if (!viditelne(cv)) return;
  S.kresleneDo = doH;
  const W = cv.clientWidth, H = Math.round(clamp(W * .5, 200, 300)); S.sirka = W;
  const ctx = pripravPlatno(cv, W, H), l = 56, r = 10, tp = 12, bt = 28, pw = W - l - r, ph = H - tp - bt;
  const p = KL.vyb.size / 36, xMax = Math.max(1000, S.h);
  const vid = S.body.filter(b => b[0] <= doH);
  const yMax = Math.min(1, Math.max(.1, p * 2, ...vid.map(b => b[1])) * 1.1);
  const X = h => l + h / xMax * pw, Y = v => tp + ph - v / yMax * ph;
  ctx.font = PISMO; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const v = yMax * i / 4; ctx.strokeStyle = 'rgba(140,160,215,.2)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(l, Y(v)); ctx.lineTo(W - r, Y(v)); ctx.stroke();
    ctx.fillStyle = '#a3adc6'; ctx.textAlign = 'right'; ctx.fillText(cisN(v * 100, 0) + ' %', l - 6, Y(v));
  }
  ctx.textAlign = 'center'; ctx.fillText('0', l, H - bt / 2); ctx.fillText(fmt(xMax), W - r - 30, H - bt / 2);
  if (KL.vyb.size) { ctx.setLineDash([8, 6]); ctx.strokeStyle = '#7fdc8f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(l, Y(p)); ctx.lineTo(W - r, Y(p)); ctx.stroke(); ctx.setLineDash([]); }
  if (vid.length) { ctx.strokeStyle = '#f3b453'; ctx.lineWidth = 2.5; ctx.beginPath(); vid.forEach(([h, v], i) => i ? ctx.lineTo(X(h), Y(v)) : ctx.moveTo(X(h), Y(v))); ctx.stroke(); }
  ctx.textAlign = 'left';
}
