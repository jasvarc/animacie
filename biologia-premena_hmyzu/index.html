/* Ďalšie sekcie */

ul.priklady{margin:6px 0 0;padding-left:22px}

.box.pravda{background:rgba(127,220,143,.08);border-color:rgba(127,220,143,.4)}.box.pravda b.h{color:var(--green)}

/* Kvíz */

ul.poznList li{margin:6px 0}
footer{color:var(--muted);text-align:center;font-size:16px;padding:20px 0 10px}

<script>
/* =====================================================================
   POMOCNÉ FUNKCIE
   ===================================================================== */
const $ = s => document.querySelector(s);
const PI = Math.PI;
const cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;      // orezanie do intervalu
const lerp = (a, b, t) => a + (b - a) * t;                      // lineárny prechod
const ez = t => t * t * (3 - 2 * t);                            // plynulý nábeh a dobeh
const seg = (p, a, b) => ez(cl((p - a) / (b - a)));             // časť fázy medzi a a b → 0..1
const r1 = v => Math.round(v * 10) / 10;                        // zaokrúhlenie (kratšie SVG)
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }; // pevná „náhoda“
let UID = 0; const uid = p => p + (UID = (UID + 1) % 1e6);       // jedinečné id pre clipPath
const sablona = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);

/* transformácia: posun, otočenie (stupne), mierka (sy = zvislá mierka) */
function tf(x, y, rot, sx, sy) {
  let s = 'translate(' + r1(x) + ' ' + r1(y) + ')';
  if (rot) s += ' rotate(' + r1(rot) + ')';
  if (sx != null) s += ' scale(' + sx.toFixed(3) + ' ' + (sy != null ? sy : sx).toFixed(3) + ')';
  return s;
}
/* skupina; op = priehľadnosť */
const G = (t, inner, op) => (op != null && op <= 0.005) ? '' :
  '<g transform="' + t + '"' + (op != null && op < 1 ? ' opacity="' + op.toFixed(2) + '"' : '') + '>' + inner + '</g>';
/* skupina s hlavným živočíchom – dá sa na ňu kliknúť */
const O = (t, inner, op) => (op != null && op <= 0.005) ? '' :
  '<g class="org" transform="' + t + '"' + (op != null && op < 1 ? ' opacity="' + op.toFixed(2) + '"' : '') + '>' + inner + '</g>';
/* miešanie dvoch farieb #rrggbb */
function mix(a, b, t) {
  t = cl(t); const A = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16)), B = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const rotPt = (x, y, deg) => { const a = deg * PI / 180, c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; };
const bez2 = (a, b, c, t) => [(1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * b[0] + t * t * c[0], (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * b[1] + t * t * c[1]];

/* =====================================================================
   KRESLENIE ŽIVOČÍCHOV (SVG). Každá funkcia kreslí v lokálnych súradniciach,
   umiestnenie a veľkosť sa nastavujú cez tf().
   ===================================================================== */

/* --- Húsenica (zhora/zboku): hlava v bode (0,0), telo smeruje do -x, dĺžka 150 ---
   o.cas = čas, o.pohyb = 0..1 (vlna lezenia), o.kon = stiahnutie tela (1 = normálne),
   o.kozka = zvlečená koža, o.bled = zblednutie, o.zvyraz = zvýrazniť nohy */
function housenica(o) {
  const n = 12, d = 12.5 * (o.kon ?? 1), r = 8.6, kz = o.kozka, T = o.cas || 0, poh = o.pohyb || 0;
  const tel = kz ? '#dfe3c4' : mix('#9cc443', '#d3dea0', o.bled || 0), tm = kz ? '#b9bd9a' : '#5f7f2a';
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const w = Math.sin(T * 5 + i * 0.55);                   // vlna beží od chvosta k hlave
    let y = -poh * Math.pow(Math.max(0, w), 3) * r * 0.9;
    if (kz) y += (rnd(i + 7) - 0.5) * 5;
    pts.push([-i * d, y]);
  }
  let s = '';
  // pravé nohy na hrudi (3 páry – zboku vidno jednu stranu)
  for (const i of [1, 2, 3]) {
    const [x, y] = pts[i]; const c = o.zvyraz ? '#ffd88a' : (kz ? '#b9bd9a' : '#2b2a18');
    s += `<path d="M${r1(x)},${r1(y + r * .5)} l2,${r1(r * .55)} l3,${r1(r * .3)}" stroke="${c}" stroke-width="${o.zvyraz ? 3.6 : 2.4}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  // panôžky na bruchu
  for (const i of [6, 7, 8, 9, 12]) {
    const [x, y] = pts[i];
    s += `<rect x="${r1(x - r * .38)}" y="${r1(y + r * .55)}" width="${r1(r * .76)}" height="${r1(r * .75)}" rx="${r1(r * .3)}" fill="${o.zvyraz ? '#6fb4ff' : tm}"/>`;
  }
  // články tela od chvosta k hlave
  for (let i = n; i >= 1; i--) {
    const [x, y] = pts[i], rr = r * (i > 10 ? 1 - (i - 10) * 0.12 : 1);
    s += `<circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(rr)}" fill="${tel}" stroke="${tm}" stroke-width="1"/>`;
  }
  if (!kz) {
    s += `<polyline points="${pts.slice(1).map(p => r1(p[0]) + ',' + r1(p[1] - 1)).join(' ')}" fill="none" stroke="#f2e05a" stroke-width="2.2" opacity=".85"/>`;
    for (let i = 1; i <= n; i++) { const [x, y] = pts[i]; s += `<circle cx="${r1(x - 2)}" cy="${r1(y - r * .5)}" r="1.3" fill="#1f2410"/><circle cx="${r1(x + 2.5)}" cy="${r1(y + r * .25)}" r="1.1" fill="#1f2410"/>`; }
  }
  // hlava
  const [hx, hy] = pts[0];
  s += `<circle cx="${r1(hx + 2)}" cy="${r1(hy)}" r="${r1(r * 1.02)}" fill="${kz ? '#c8cca8' : '#4d5a26'}" stroke="${kz ? '#a9ad88' : '#2f3815'}"/>`;
  if (!kz) s += `<circle cx="${r1(hx + 5)}" cy="${r1(hy - 3)}" r="1.5" fill="#111"/><path d="M${r1(hx + r + 1)},${r1(hy + 2)} l3,2" stroke="#222" stroke-width="2"/>`;
  else s += `<path d="M${r1(hx - 6)},${r1(hy - 7)} l4,6 l-3,6" stroke="#8d9070" stroke-width="1.4" fill="none"/>`;
  return s;
}

/* --- Vajíčko mlynárika (fľaštička), spodok v (0,0) --- */
function vajMotyl(c, otvor) {
  let s = `<path d="M0,0 C-4.5,0 -4.8,-8 -2.6,-13 L0,-15 L2.6,-13 C4.8,-8 4.5,0 0,0Z" fill="${c}" stroke="#a8841c" stroke-width=".6"/>`
    + `<path d="M-2,-1 L-1.4,-12 M0,-.5 L0,-13.5 M2,-1 L1.4,-12" stroke="#a8841c" stroke-width=".4" opacity=".7"/>`;
  if (otvor > 0) s += `<ellipse cx="0" cy="-13" rx="2.3" ry="1" fill="#3a3010"/><ellipse cx="${r1(5 * otvor)}" cy="${r1(-15 - 3 * otvor)}" rx="2.4" ry="1.1" fill="${c}" transform="rotate(${r1(60 * otvor)} ${r1(5 * otvor)} ${r1(-15 - 3 * otvor)})"/>`;
  return s;
}

/* --- Kukla mlynárika: miesto prichytenia (0,0), kukla smeruje hore --- */
function kuklaMotyl(o) {
  const pr = o.prazdna, c = pr ? '#e2e5cc' : (o.farba || '#8db35a');
  let s = `<path d="M0,0 C-9,-8 -15,-26 -14,-40 L-21,-52 C-19,-66 -11,-80 -2,-96 L2,-96 C8,-84 14,-70 15,-58 L21,-50 C17,-30 9,-9 0,0Z" fill="${c}" stroke="${pr ? '#b9bc9f' : '#5d7a35'}" stroke-width="1.2"${pr ? ' opacity=".8"' : ''}/>`;
  if (!pr) {
    s += `<path d="M0,-4 C3,-30 6,-60 0,-94" stroke="#e7e48a" stroke-width="1.6" fill="none" opacity=".8"/>`;
    [[-8, -30], [6, -36], [-12, -50], [10, -54], [-4, -70]].forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="1.4" fill="#2a3a18"/>`);
    if (o.krid) s += `<path d="M-17,-52 C-16,-64 -10,-76 -3,-86 C-6,-74 -8,-62 -11,-50Z" fill="#222" opacity="${(o.krid * .8).toFixed(2)}"/><path d="M-15,-46 C-10,-60 -4,-70 0,-74 C2,-60 -2,-50 -8,-40Z" fill="#fff" opacity="${(o.krid * .5).toFixed(2)}"/>`;
  } else s += `<path d="M-4,-94 L0,-80 L4,-94" stroke="#9a9d80" stroke-width="1.5" fill="none"/>`;
  if (o.trhlina) s += `<path d="M-3,-95 L0,-84 L3,-95" stroke="#2d3a18" stroke-width="1.6" fill="none" opacity="${o.trhlina.toFixed(2)}"/>`;
  if (o.pas) s += `<path d="M-15,-44 Q0,-38 15,-44" stroke="#fff" stroke-width="1" fill="none" opacity=".8"/><path d="M-4,2 L4,2" stroke="#fff" stroke-width="2"/>`;
  return s;
}

/* --- Motýľ (mlynárik) zhora, hlava hore. o.k = rozvinutie krídel 0.25..1,
       o.mav = otvorenie krídel pri mávaní 0..1, o.vr = pokrčenie, o.prob = vysunutá cicavka --- */
function motyl(o) {
  const k = o.k ?? 1, mav = o.mav ?? 1, vr = o.vr || 0;
  const sx = (0.25 + 0.75 * k) * (0.12 + 0.88 * mav), sy = 0.35 + 0.65 * k;
  const wc = mix('#a7ab92', '#f6f3e6', k * k), cier = (0.3 + 0.7 * k).toFixed(2);
  const kr = `<path d="M4,2 C36,0 52,16 46,30 C38,44 14,38 3,10Z" fill="${wc}" stroke="#8a8a7a" stroke-width=".8"/>`
    + `<path d="M14,4 C20,2 26,3 28,6 C22,8 18,7 14,4Z" fill="#2a2a2a" opacity=".6"/>`
    + `<path d="M2,-6 C20,-38 52,-50 64,-42 C70,-30 54,-8 6,2Z" fill="${wc}" stroke="#8a8a7a" stroke-width=".8"/>`
    + `<path d="M44,-47 C56,-50 66,-44 64,-34 C58,-36 50,-40 44,-47Z" fill="#2a2a2a" opacity="${cier}"/>`
    + `<circle cx="38" cy="-24" r="4" fill="#2a2a2a" opacity="${cier}"/><circle cx="30" cy="-12" r="3.4" fill="#2a2a2a" opacity="${cier}"/>`
    + (vr > 0 ? `<path d="M8,-6 L20,-18 L26,-10 L36,-24 L40,-14 L50,-30 M8,6 L18,14 L24,8 L32,20 L38,16" stroke="#555" stroke-width="1.4" fill="none" opacity="${vr.toFixed(2)}"/>` : '');
  let s = `<g transform="scale(${sx.toFixed(3)} ${sy.toFixed(3)})">${kr}</g><g transform="scale(${(-sx).toFixed(3)} ${sy.toFixed(3)})">${kr}</g>`;
  s += `<ellipse cx="0" cy="14" rx="3.6" ry="15" fill="#3a3a3a"/><ellipse cx="0" cy="-5" rx="5" ry="7.5" fill="#2e2e2e"/><circle cx="0" cy="-15" r="4.2" fill="#2a2a2a"/>`;
  s += `<path d="M-1.5,-18 Q-6,-30 -10,-38 M1.5,-18 Q6,-30 10,-38" stroke="#333" stroke-width="1.3" fill="none"/><circle cx="-10" cy="-38" r="2" fill="#333"/><circle cx="10" cy="-38" r="2" fill="#333"/>`;
  const pr = o.prob || 0;
  s += pr > 0.05 ? `<path d="M0,-19 L0,${r1(-19 - 18 * pr)}" stroke="#7a6a3a" stroke-width="1.4"/>` : `<circle cx="0" cy="-21" r="2" fill="none" stroke="#7a6a3a" stroke-width="1"/>`;
  return s;
}

/* --- Larva lienky zhora: hlava v (0,0), telo do -x (dĺžka ~105) --- */
function larvaLienka(o) {
  const k = o.kon ?? 1, T = o.cas || 0, kz = o.kozka;
  const tel = kz ? '#cbc9bf' : '#30354a', sv = kz ? '#b0aea3' : '#1a1d2a', or = '#f08a2c';
  let s = '';
  const hrud = [[-9, 9], [-17, 10], [-25, 10]];
  hrud.forEach(([x, w], i) => {
    x *= k; const ph = Math.sin(T * 9 + i * 2.1) * (o.pohyb || 0) * 4;
    for (const sg of [1, -1]) {
      const q = ph * sg;
      s += `<path d="M${r1(x)},${r1(sg * w * .6)} L${r1(x + 3 + q)},${r1(sg * (w + 7))} L${r1(x + 8 + q)},${r1(sg * (w + 13))}" stroke="${kz ? '#bdbab0' : '#232634'}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
  });
  for (let i = 7; i >= 0; i--) {
    const x = (-33 - i * 8.5) * k, w = 10 - i * 0.95;
    s += `<ellipse cx="${r1(x)}" cy="0" rx="${r1(5.5 * k + 1)}" ry="${r1(w)}" fill="${tel}" stroke="${sv}" stroke-width=".8"/>`;
    if (!kz) s += `<circle cx="${r1(x)}" cy="${r1(w * .6)}" r="1.4" fill="${sv}"/><circle cx="${r1(x)}" cy="${r1(-w * .6)}" r="1.4" fill="${sv}"/>`;
  }
  hrud.slice().reverse().forEach(([x, w]) => s += `<ellipse cx="${r1(x * k)}" cy="0" rx="${r1(5 * k + 1)}" ry="${w}" fill="${tel}" stroke="${sv}" stroke-width=".8"/>`);
  if (!kz) {
    const x1 = -33 * k, x4 = (-33 - 3 * 8.5) * k;
    s += `<circle cx="${r1(x1)}" cy="6.5" r="2.6" fill="${or}"/><circle cx="${r1(x1)}" cy="-6.5" r="2.6" fill="${or}"/>`
      + `<circle cx="${r1(x4)}" cy="5.5" r="2.3" fill="${or}"/><circle cx="${r1(x4)}" cy="-5.5" r="2.3" fill="${or}"/><circle cx="${r1(x4)}" cy="1.8" r="1.8" fill="${or}"/><circle cx="${r1(x4)}" cy="-1.8" r="1.8" fill="${or}"/>`;
  }
  s += `<ellipse cx="0" cy="0" rx="5" ry="6" fill="${kz ? '#bdbab0' : '#15171f'}"/><path d="M3,-3 L9,-7 M3,3 L9,7" stroke="${sv}" stroke-width="1.2"/>`;
  return s;
}

/* --- Kukla lienky zhora: stred (0,0), vzadu (-x) zhrnutá koža larvy --- */
function kuklaLienka(o) {
  const pr = o.prazdna, c = pr ? '#ebe0c4' : (o.farba || '#e98a30');
  let s = `<path d="M-36,0 C-37,-7 -30,-10 -22,-8 L-19,8 C-28,10 -36,7 -36,0Z" fill="#3a3c44"/><path d="M-33,-4 L-25,-2 M-33,3 L-24,2" stroke="#585a66" stroke-width="1.2"/>`;
  s += `<ellipse cx="0" cy="0" rx="22" ry="17" fill="${c}" stroke="${pr ? '#c8b894' : '#7a3c10'}" stroke-width="1"${pr ? ' opacity=".8"' : ''}/>`;
  if (!pr) {
    s += `<path d="M-13,-15 Q-11,0 -13,15 M-4,-17 Q-2,0 -4,17 M6,-16 Q8,0 6,16" stroke="#9a4a14" stroke-width="1" fill="none" opacity=".7"/>`;
    [[-9, -8], [-9, 8], [1, -10], [1, 10], [11, -6], [11, 6], [-1, 0]].forEach(([x, y]) => s += `<ellipse cx="${x}" cy="${y}" rx="2.6" ry="2" fill="#1d1d1d" opacity=".85"/>`);
  } else s += `<path d="M20,-7 L13,0 L20,7" stroke="#a8946a" stroke-width="1.5" fill="none"/>`;
  return s;
}

/* --- Lienka zhora, hlava smeruje do +x. o.farba 0 = bledá, 1 = červená; o.bodky; o.kr = blanité krídla vonku;
       o.let = otvorené krovky; o.mav = mávanie --- */
function lienka(o) {
  const f = o.farba ?? 1, b = (o.bodky ?? 1).toFixed(2), kr = o.kr || 0, lt = o.let || 0, mav = o.mav ?? 1;
  const ec = mix('#f2e3a0', '#d42a1c', f), es = mix('#c8b070', '#7a1a10', f);
  let s = '';
  for (const x of [10, 2, -6]) for (const sg of [1, -1]) s += `<path d="M${x},${sg * 12} L${x + 2},${sg * 24} L${x + 6},${sg * 27}" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  const wk = Math.max(kr, lt * (0.3 + 0.7 * mav));
  if (wk > 0.02) for (const sg of [1, -1]) s += `<ellipse cx="${r1(-8 - 6 * wk)}" cy="${r1(sg * (10 + 20 * wk))}" rx="${r1(10 + 10 * wk)}" ry="${r1(6 + 18 * wk)}" transform="rotate(${sg * -20} -8 ${sg * 10})" fill="rgba(220,230,255,.45)" stroke="rgba(200,210,240,.85)"/>`;
  const ang = lt * 40;
  for (const sg of [1, -1]) {
    const half = `<path d="M16,0 A22,22 0 0 ${sg > 0 ? 1 : 0} -28,0Z" fill="${ec}" stroke="${es}" stroke-width="1"/>`
      + [[6, 13, 3.6], [-6, 11, 5], [-18, 8, 3.6]].map(([x, y, r]) => `<circle cx="${x}" cy="${sg * y}" r="${r}" fill="#151515" opacity="${b}"/>`).join('');
    s += `<g transform="rotate(${r1(-sg * ang)} 14 ${sg * 2})">${half}</g>`;
  }
  s += `<circle cx="13" cy="0" r="4.4" fill="#151515" opacity="${b}"/>`;
  s += `<path d="M12,-13 Q24,-12 24,0 Q24,12 12,13Z" fill="#151515"/><ellipse cx="18" cy="-8.5" rx="3" ry="2.6" fill="#f4f0e6"/><ellipse cx="18" cy="8.5" rx="3" ry="2.6" fill="#f4f0e6"/>`;
  s += `<ellipse cx="26" cy="0" rx="4.6" ry="7" fill="#151515"/><circle cx="27" cy="-4" r="1.3" fill="#eee"/><circle cx="27" cy="4" r="1.3" fill="#eee"/>`;
  return s;
}

/* --- body pozdĺž oblúka (pre larvu včely): začiatok (0,0), smer a0, zakrivenie k --- */
function krivka(n, L, k, a0) {
  const pts = []; let x = 0, y = 0, a = a0; const ds = L / (n - 1);
  for (let i = 0; i < n; i++) { pts.push([x, y]); x += Math.cos(a) * ds; y += Math.sin(a) * ds; a += k * ds; }
  return pts;
}
/* --- Larva včely zboku: tvar C (o.ohyb = 1) alebo rovná (o.ohyb = 0), hlava na konci --- */
function larvaVcela(o) {
  const L = 150, b = o.ohyb ?? 1, k = b * (1.5 * PI) / L, pts = krivka(13, L, k, 0);
  let mx = 0, my = 0; pts.forEach(p => { mx += p[0]; my += p[1]; }); mx /= pts.length; my /= pts.length;
  const kz = o.kozka, tel = kz ? 'rgba(245,240,225,.45)' : '#f7f2e4', st = kz ? 'rgba(210,200,175,.6)' : '#d4c7a8';
  let s = '';
  pts.forEach((p, i) => { const r = 13 * (i < 2 ? 0.7 + i * 0.15 : 1); s += `<circle cx="${r1(p[0] - mx)}" cy="${r1(p[1] - my)}" r="${r1(r)}" fill="${tel}" stroke="${st}" stroke-width="1"/>`; });
  const h = pts[12];
  if (!kz) s += `<circle cx="${r1(h[0] - mx)}" cy="${r1(h[1] - my)}" r="10" fill="#efe5cc" stroke="#c9b993"/>`;
  return s;
}

/* --- Včela zboku, hlava do +x. o.kukla = kukla (o.oci, o.tma = sfarbenie 0..1), o.mav = krídla --- */
function vcela(o) {
  const id = uid('vc'), kuk = o.kukla, tm = o.tma ?? 1, oc = o.oci ?? 1;

    s += `<path d="M10,9 L16,14 L24,12 M4,10 L10,17 L20,18 M-2,10 L4,19 L14,21" stroke="${nc}" stroke-width="2" fill="none"/>`;
  } else if (!kuk) {

    s += `<g transform="rotate(${r1(-35 * (1 - fl))} 4 -10)"><ellipse cx="-16" cy="-17" rx="24" ry="7.5" transform="rotate(-10 -16 -17)" fill="rgba(220,235,255,.45)" stroke="rgba(190,210,240,.85)"/><ellipse cx="-10" cy="-12" rx="16" ry="5" transform="rotate(-4 -10 -12)" fill="rgba(220,235,255,.35)" stroke="rgba(190,210,240,.7)"/></g>`;
    s += `<path d="M8,9 L10,21 L6,31 M1,10 L-3,23 L-9,31 M-5,9 L-15,22 L-21,33" stroke="${nc}" stroke-width="2" fill="none" stroke-linejoin="round"/>`;
    if (o.pel) s += `<ellipse cx="-14" cy="22" rx="${r1(4 * o.pel)}" ry="${r1(3 * o.pel)}" fill="#f2c230"/>`;
  } else s += `<path d="M10,9 L18,13 L24,11 M4,10 L12,16 L20,16 M-2,10 L6,18 L16,19" stroke="${nc}" stroke-width="2" fill="none"/>`;
  s += `<defs><clipPath id="${id}"><ellipse cx="-24" cy="2" rx="24" ry="13"/></clipPath></defs><ellipse cx="-24" cy="2" rx="24" ry="13" fill="${bAbd}"/>`
    + `<g clip-path="url(#${id})">` + [-14, -26, -38].map(x => `<rect x="${x - 3}" y="-14" width="5.5" height="32" fill="${band}" transform="rotate(10 ${x} 2)"/>`).join('') + `</g>`;
  if (!kuk) s += `<path d="M-47,3 L-54,4" stroke="#2a2016" stroke-width="1.6"/>`;
  s += `<ellipse cx="4" cy="0" rx="12" ry="11" fill="${thor}"/>`;
  if (!kuk) s += `<ellipse cx="4" cy="-2" rx="11" ry="9" fill="none" stroke="#b08850" stroke-width="2" stroke-dasharray="1.5 2" opacity=".7"/>`;
  s += `<ellipse cx="20" cy="2" rx="8" ry="9.5" fill="${head}"/><ellipse cx="20" cy="-1" rx="4" ry="6.5" fill="${eye}"/>`;
  s += kuk ? `<path d="M24,-5 Q28,4 25,13" stroke="${nc}" stroke-width="1.6" fill="none"/>` : `<path d="M23,-6 L28,-16 L36,-13" stroke="#2a2016" stroke-width="1.6" fill="none"/>`;
  if (kuk) s += `<path d="M8,-6 C0,-4 -6,2 -4,8 C2,6 8,2 8,-6Z" fill="${mix('#e9e0c8', '#806a4a', tm)}"/>`;
  return s;
}

/* --- Kobylka zboku, hlava do +x. o.nymfa (väčšia hlava, bez krídel), o.kw = dĺžka krídel,
       o.zakl = základy krídel, o.vr = pokrčenie, o.klad = kladielko, o.farba 0..1 --- */
function kobylka(o) {
  const kz = o.kozka, f = o.farba ?? 1;
  const c = kz ? '#d8dbc0' : mix('#d5e6b6', '#5aa83c', f), d = kz ? '#b2b598' : mix('#a3ba8a', '#386f26', f), w = kz ? '#d0d3b6' : mix('#e2efcc', '#6cbd4a', f);
  const ph = Math.sin((o.cas || 0) * 9) * (o.pohyb || 0), hs = o.nymfa ? 1.25 : 1;
  const leg = (dd, sw) => `<path d="${dd}" stroke="${d}" stroke-width="${sw}" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
  let s = '';
  s += `<g opacity=".65">${leg(`M26,7 L${r1(32 - ph * 3)},21 L${r1(40 - ph * 3)},31`, 2)}${leg(`M14,8 L${r1(12 + ph * 3)},22 L${r1(4 + ph * 3)},31`, 2)}</g>`;
  s += `<path d="M4,-10 C-25,-14 -60,-10 -74,-2 C-76,2 -72,8 -66,9 C-40,12 -10,12 4,10Z" fill="${c}" stroke="${d}" stroke-width="1.2"/>`;
  for (const x of [-12, -24, -36, -48, -60]) s += `<path d="M${x},${r1(-11 - x * .1)} Q${x - 3},0 ${x},${r1(10 + x * .03)}" stroke="${d}" stroke-width=".9" fill="none" opacity=".7"/>`;
  if (o.klad) s += `<path d="M-66,3 Q-95,4 -122,-8 Q-96,10 -66,8Z" fill="${kz ? '#cfc9ae' : mix('#ddd6b4', '#8a7a40', f)}" stroke="${d}" stroke-width=".8"/>`;
  if (o.kw > 0) {
    const kw = o.kw;
    s += `<g transform="translate(24 -6) scale(${kw.toFixed(3)} ${(0.55 + 0.45 * kw).toFixed(3)}) translate(-24 6)"><path d="M24,-11 C-20,-21 -70,-17 -100,-6 C-70,0 -20,-1 24,-2Z" fill="${w}" stroke="${d}" stroke-width="1"/><path d="M20,-6 C-20,-11 -60,-9 -94,-5" stroke="${d}" stroke-width=".8" fill="none"/>`
      + (o.vr ? `<path d="M10,-9 L0,-3 L-12,-12 L-24,-3 L-36,-12 L-50,-4 L-64,-11" stroke="#7a8a6a" stroke-width="1.4" fill="none" opacity="${o.vr.toFixed(2)}"/>` : '') + `</g>`;
  }
  if (o.zakl > 0) s += `<path d="M22,-11 L${r1(20 - 26 * o.zakl)},-8 L${r1(22 - 22 * o.zakl)},-1 L22,-1Z" fill="${w}" stroke="${d}" stroke-width=".8"/>`;
  s += `<path d="M2,-12 Q16,-17 30,-12 L30,9 Q16,13 2,9Z" fill="${c}" stroke="${d}" stroke-width="1.2"/>`;
  if (kz) s += `<path d="M4,-13 L29,-13" stroke="#7e8066" stroke-width="2.2"/>`;
  const ant = `<path d="M45,-11 C34,-70 -50,-74 -125,-46" stroke="${d}" stroke-width="1.3" fill="none"/><path d="M43,-11 C26,-60 -55,-60 -115,-30" stroke="${d}" stroke-width="1.1" fill="none" opacity=".75"/>`;
  s += `<g transform="translate(30 0) scale(${hs}) translate(-30 0)">${ant}<ellipse cx="40" cy="1" rx="11" ry="13" fill="${c}" stroke="${d}" stroke-width="1.2"/><circle cx="43" cy="-5" r="3.4" fill="${kz ? '#bdb8a0' : '#6a4a2a'}"/><path d="M46,11 l3,6" stroke="${d}" stroke-width="2"/></g>`;
  s += leg(`M30,8 L${r1(38 + ph * 3)},21 L${r1(46 + ph * 3)},31`, 2.3) + leg(`M18,9 L${r1(15 - ph * 3)},22 L${r1(7 - ph * 3)},32`, 2.3);
  s += `<path d="M4,3 C-15,-4 -36,-18 -54,-17 C-50,-9 -22,6 4,9Z" fill="${c}" stroke="${d}" stroke-width="1.2"/>` + leg(`M-53,-15 L${r1(-42 + ph * 2)},31 l9,2`, 2.3);
  return s;
}

/* --- Nymfa vážky zboku, hlava do +x. o.zakl = základy krídel, o.maska = vysunutá lapacia maska --- */
function nymfaVazka(o) {
  const kz = o.kozka, c = kz ? '#d2cdb2' : '#6e6b3a', d = kz ? '#b0aa8e' : '#46431f', ph = Math.sin((o.cas || 0) * 7) * (o.pohyb || 0) * 3;
  const leg = (a, b, e, w) => `<path d="M${a} L${b} L${e}" stroke="${d}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  let s = leg('36,8', `${r1(44 + ph)},24`, `${r1(52 + ph)},35`, 2) + leg('28,9', `${r1(24 - ph)},26`, `${r1(18 - ph)},36`, 2) + leg('20,8', `${r1(6 + ph)},24`, `${r1(-6 + ph)},35`, 2);
  s += `<path d="M18,-9 C-20,-14 -70,-11 -88,-3 L-97,0 L-88,3 C-70,10 -20,12 18,9Z" fill="${c}" stroke="${d}" stroke-width="1.2"/>`;
  for (let x = -2; x > -85; x -= 13) s += `<path d="M${x},${r1(-12 - x * .08)} Q${x - 3},0 ${x},${r1(11 + x * .07)}" stroke="${d}" fill="none" stroke-width="1"/>`;
  s += `<ellipse cx="30" cy="0" rx="15" ry="11" fill="${c}" stroke="${d}" stroke-width="1.2"/>`;
  if (o.zakl > 0) s += `<path d="M38,-9 L${r1(36 - 44 * o.zakl)},${r1(-7 + o.zakl)} L${r1(36 - 40 * o.zakl)},-2 L30,-3Z" fill="${kz ? '#c4bfa3' : '#8a8650'}" stroke="${d}" stroke-width=".8"/>`;
  s += `<ellipse cx="51" cy="0" rx="11" ry="10" fill="${c}" stroke="${d}" stroke-width="1.2"/><ellipse cx="54" cy="-4" rx="6.5" ry="6" fill="${kz ? '#c8c3a8' : '#2e3a1e'}"/>`;
  const m = o.maska || 0;
  if (m > 0.02) { const ex = 48 + 62 * m; s += `<path d="M46,9 L${r1(ex - 8)},12 L${r1(ex)},10" stroke="${d}" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M${r1(ex)},10 l5,-5 M${r1(ex)},10 l5,5" stroke="${d}" stroke-width="2"/>`; }
  else s += `<path d="M58,10 L40,13 L52,15" stroke="${d}" stroke-width="3" fill="none" stroke-linejoin="round"/>`;
  s += leg('38,9', `${r1(48 - ph)},25`, `${r1(58 - ph)},36`, 2.6) + leg('30,10', `${r1(28 + ph)},27`, `${r1(22 + ph)},37`, 2.6) + leg('22,9', `${r1(8 - ph)},25`, `${r1(-4 - ph)},36`, 2.6);
  if (kz) s += `<path d="M42,-10 L30,-12 L18,-9" stroke="#8a8468" stroke-width="1.8" fill="none"/>`;
  return s;
}

/* --- Dospelá vážka zboku, hlava do +x. o.kw = krídla, o.br = dĺžka brucha, o.farba, o.mav --- */
function vazka(o) {
  const f = o.farba ?? 1, kw = o.kw ?? 1, br = o.br ?? 1, mv = o.mav ?? 1, vr = o.vr || 0;
  const tc = mix('#d8d4b6', '#5b7f3a', f), bc = mix('#dcd9c6', '#2f86b8', f), ec = mix('#cfd6c8', '#2b9fca', f), dk = mix('#aaa68e', '#1d2a20', f);
  const kr = (p, ang, pt) => `<g transform="rotate(${r1(ang)} 42 -9) translate(42 -9) scale(${kw.toFixed(3)} ${(0.45 + 0.55 * kw).toFixed(3)}) translate(-42 9)"><path d="${p}" fill="rgba(215,232,255,.36)" stroke="rgba(200,220,245,.9)" stroke-width="1"/><path d="${pt}" stroke="#3a3a30" stroke-width="3"/>`
    + (vr > 0 ? `<path d="M30,-14 L18,-22 L6,-16 L-8,-26 L-22,-20 L-36,-30" stroke="#8a90a0" stroke-width="1.4" fill="none" opacity="${vr.toFixed(2)}"/>` : '') + `</g>`;
  const fl = (1 - mv) * 45;
  let s = kr('M40,-9 C22,-28 -32,-36 -72,-30 C-70,-22 -18,-14 40,-5Z', fl * .8 + 5, 'M-58,-31 l8,-1');
  s += `<path d="M38,9 L44,18 L50,24 M44,10 L52,18 L60,22 M32,9 L34,19 L38,26" stroke="${dk}" stroke-width="1.6" fill="none"/>`;
  const L = -124 * br;
  s += `<path d="M32,-6 C16,-6 8,-4 -6,-3.6 L${r1(L + 4)},-2.6 L${r1(L)},0 L${r1(L + 4)},2.6 L-6,3.6 C8,4 16,6 32,6Z" fill="${bc}" stroke="${dk}" stroke-width=".8"/>`;
  for (let i = 1; i < 9; i++) { const x = -6 + (L + 6) * i / 9; s += `<line x1="${r1(x)}" y1="-3.4" x2="${r1(x)}" y2="3.4" stroke="${dk}" stroke-width="1.8"/>`; }
  s += `<ellipse cx="42" cy="0" rx="15" ry="11" fill="${tc}" stroke="${dk}" stroke-width="1"/><path d="M36,-9 L44,8 M44,-10 L50,6" stroke="${dk}" stroke-width="2" opacity=".6"/>`;
  s += `<circle cx="61" cy="-1" r="10" fill="${ec}" stroke="${dk}" stroke-width="1"/><circle cx="66" cy="5" r="4" fill="${tc}"/>`;
  s += kr('M44,-9 C30,-34 -14,-48 -58,-46 C-58,-38 -8,-22 44,-6Z', -fl, 'M-46,-45 l8,0');
  return s;
}

/* --- Lupa: pohľad dovnútra kukly. p = priebeh 0..1, druh = 'motyl' | 'lienka' --- */
function vnutroKukly(cx, cy, R, p, druh) {
  let s = '';
  const a = 1 - seg(p, .12, .42);                          // 1. tkanivá larvy
  if (a > 0) {
    let in1 = '';
    for (let i = 0; i < 9; i++) {
      const x = (i - 4) * R * 0.17, jx = (rnd(i) - .5) * R * .5 * (1 - a), jy = (rnd(i + 20) - .5) * R * .5 * (1 - a);
      in1 += `<circle cx="${r1(cx + x + jx)}" cy="${r1(cy + jy)}" r="${r1(R * .12 * (0.5 + 0.5 * a))}" fill="${druh === 'lienka' ? '#4a5068' : '#86b04a'}"/>`;
    }
    s += `<g opacity="${a.toFixed(2)}">${in1}</g>`;
  }
  const b = seg(p, .12, .32) * (1 - seg(p, .72, .95));      // 2. rozložené tkanivá
  if (b > 0) {
    let in2 = ''; const cols = druh === 'lienka' ? ['#e8b070', '#f2d29a', '#c88a4a'] : ['#a7c35d', '#cfd88a', '#7c9a3c'];
    for (let i = 0; i < 46; i++) {
      const ang = rnd(i) * 6.283 + p * 4 * (rnd(i + 3) - .5), rr = Math.sqrt(rnd(i + 9)) * R * .82;
      in2 += `<circle cx="${r1(cx + Math.cos(ang) * rr)}" cy="${r1(cy + Math.sin(ang) * rr)}" r="${r1(2 + rnd(i + 5) * 3)}" fill="${cols[i % 3]}"/>`;
    }

/* --- Ďalšie drobnosti: kvet, voška, tráva, dážďovka, komár, pulec, mušica --- */
function kvet(x, y, sc = 1) {
  let s = `<path d="M${x},${y + 14} C${x - 6},${y + 120} ${x - 30},${y + 220} ${x - 40},460" stroke="#4f8a3a" stroke-width="${6 * sc}" fill="none"/>`

  for (let i = 0; i < 8; i++) s += `<ellipse cx="${x}" cy="${y - 24 * sc}" rx="${12 * sc}" ry="${24 * sc}" fill="${i % 2 ? '#b56cc8' : '#c77dd8'}" transform="rotate(${i * 45} ${x} ${y})"/>`;
  return s + `<circle cx="${x}" cy="${y}" r="${14 * sc}" fill="#f2c94c"/><circle cx="${x}" cy="${y}" r="${7 * sc}" fill="#e0a53a"/>`;

}
const TRAVA = Array.from({ length: 46 }, (_, i) => [rnd(i + 100) * 800, 30 + rnd(i + 200) * 60, (rnd(i + 300) - .5) * 34]);

  return `<g stroke="${col}" stroke-width="3" fill="none" stroke-linecap="round">` + TRAVA.map(([x, h, b]) => `<path d="M${r1(x)},362 Q${r1(x + b * .3)},${r1(362 - h * .6)} ${r1(x + b)},${r1(362 - h)}"/>`).join('') + `</g>`;
}
function dazdovka(x0, x1, y, c) {
  let s = ''; const n = 30;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), x = lerp(x0, x1, t) + Math.sin(c * 3 - t * 9) * 4, kl = i > 5 && i < 10;

  return `<path d="M${x},${y - 14} Q${r1(x + w)},${y} ${x},${y + 14}" stroke="#c8c2a0" stroke-width="3" fill="none"/><circle cx="${x}" cy="${y + 15}" r="3.4" fill="#a8a080"/>`;
}
function pulec(x, y, c) {

  return `<path d="M${x - 6},${y} Q${x - 16},${r1(y + w)} ${x - 26},${r1(y - w)}" stroke="#3a3a30" stroke-width="3" fill="none"/><ellipse cx="${x}" cy="${y}" rx="8" ry="6.5" fill="#3a3a30"/>`;

function musica(x, y, c) {
  const m = Math.abs(Math.sin(c * 30));

        else if (p < .68) { const k = seg(p, .5, .68); x = lerp(170, CX, k); y = lerp(130, CY, k); r = 40 * k; }
        else { x = CX; y = CY; r = 40; }
        if (x - 70 > 262) s += musica(262 + Math.sin(c * 5) * 10, 128 + Math.cos(c * 7) * 6, c);
        s += O(tf(x, y, r, -1, 1), vazka({ farba: fa, mav }), 1 - seg(p, .95, 1));
      }
      return s;
    }
  }
};

/* =====================================================================
   ČASOVÁ OS A STAV ANIMÁCIE
   ===================================================================== */
const KLUCE = ['vajicko', 'liahnutie', 'rast', 'zvliekanie', 'rast2', 'zakuklenie', 'kukla', 'vylahnutie', 'kridla', 'dospelec'];
const FARBY_ROL = { vaj: '#f3d27a', mlad: '#7fdc8f', kuk: '#b9a3ff', dosp: '#6fb4ff' };
const TYPY = ['uplna', 'neuplna'];
/* ktoré štádium patrí k fáze */
function stadiumFazy(id, typ) {
  const i = KLUCE.indexOf(id);
  if (i === 0) return 0;
  if (i <= 4) return 1;
  if (typ === 'uplna') return i <= 6 ? 2 : 3;
  return 2;
}

const S = {
  typ: 'uplna', druh: { uplna: 'motyl', neuplna: 'kobylka' }, porovnat: false,
  beh: !matchMedia('(prefers-reduced-motion: reduce)').matches, rychl: 1, t: 0, ciel: null,
  infoTyp: 'uplna', spina: true
};
let OSA = [], TOT = 1;

/* zostaví časovú os: jeden druh, alebo pri porovnaní spoločnú os podľa kľúčov */
function zostavOsu() {
  OSA = []; let st = 0;
  if (!S.porovnat) {
    DATA.druhy[S.druh[S.typ]].fazy.forEach(f => { OSA.push({ id: f.id, dur: f.dur, start: st, f: { [S.typ]: f } }); st += f.dur; });
  } else {
    const U = DATA.druhy[S.druh.uplna], N = DATA.druhy[S.druh.neuplna];
    for (const k of KLUCE) {
      const fu = U.fazy.find(f => f.id === k), fn = N.fazy.find(f => f.id === k);
      if (!fu && !fn) continue;
      const dur = Math.max(fu ? fu.dur : 0, fn ? fn.dur : 0);
      OSA.push({ id: k, dur, start: st, f: { uplna: fu, neuplna: fn } }); st += dur;
    }
  }
  TOT = st;
}
function indexOsy(t) { for (let i = OSA.length - 1; i >= 0; i--) if (t >= OSA[i].start) return i; return 0; }
/* stav pre daný typ: fáza, priebeh p; ak fáza chýba (napr. kukla pri neúplnej), drží sa posledná predchádzajúca */
function stavPre(typ, i) {
  const o = OSA[i], p = cl((S.t - o.start) / o.dur);
  if (o.f[typ]) return { f: o.f[typ], p, chyba: false };
  for (let j = i - 1; j >= 0; j--) if (OSA[j].f[typ]) return { f: OSA[j].f[typ], p: 1, chyba: true };
  return { f: DATA.druhy[S.druh[typ]].fazy[0], p: 0, chyba: true };
}

/* =====================================================================
   UŽÍVATEĽSKÉ ROZHRANIE
   ===================================================================== */
const KARTY = {};
TYPY.forEach(typ => {
  const root = $('#karta-' + typ);
  KARTY[typ] = { root, svg: root.querySelector('svg'), bg: root.querySelector('.bg'), dyn: root.querySelector('.dyn'),
    st: root.querySelector('.st'), fz: root.querySelector('.fz'), tag: root.querySelector('.tag'), sez: root.querySelector('.sez'), chyba: root.querySelector('.chybaBox'), last: '' };
  // klik (dotyk) na živočícha → popis štádia
  KARTY[typ].svg.addEventListener('pointerdown', e => {
    if (e.target.closest && e.target.closest('.org')) { S.infoTyp = typ; vykresliInfo(true); }
  });
});

function vyplnTexty() {
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = el.dataset.t.split('.').reduce((o, k) => o && o[k], DATA);
    if (typeof v === 'string') el.innerHTML = v;
  });
  $('#tab-uplna').textContent = DATA.typy.uplna.nazov;
  $('#tab-neuplna').textContent = DATA.typy.neuplna.nazov;
  $('#poznList').innerHTML = DATA.pozn.body.map(b => `<li>${b}</li>`).join('');
  $('#precoPr').innerHTML = DATA.preco.a.pr.map(b => `<li>${b}</li>`).join('');
}

/* prepínače typu a druhu */
function vykresliVyber() {
  TYPY.forEach(typ => {
    const t = $('#tab-' + typ); t.classList.toggle('on', !S.porovnat && S.typ === typ); t.setAttribute('aria-selected', !S.porovnat && S.typ === typ);
    const box = $('#druhy-' + typ);
    box.hidden = !S.porovnat && S.typ !== typ;
    box.innerHTML = `<span>${S.porovnat ? DATA.ui[typ] + ':' : DATA.ui.druh}</span>` + DATA.typy[typ].druhy.map(id => {
      const d = DATA.druhy[id];
      return `<button data-typ="${typ}" data-druh="${id}" class="${S.druh[typ] === id ? 'on' : ''}">${d.nazov} <small>(${d.priklad})</small></button>`;
    }).join('');
  });
  $('#btnPorovnat').textContent = S.porovnat ? DATA.ui.porovnatVyp : DATA.ui.porovnat;
  $('#btnPorovnat').classList.toggle('on', S.porovnat);
  $('#schema').innerHTML = S.porovnat
    ? `<b>${DATA.typy.uplna.nazov}:</b> ${DATA.typy.uplna.schema}<br><b>${DATA.typy.neuplna.nazov}:</b> ${DATA.typy.neuplna.schema}`
    : DATA.typy[S.typ].schema;
  $('#sceny').classList.toggle('dve', S.porovnat);
  TYPY.forEach(typ => { KARTY[typ].root.hidden = !S.porovnat && S.typ !== typ; });
  $('#porovCard').hidden = !S.porovnat;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.druhy button');
  if (b) { S.druh[b.dataset.typ] = b.dataset.druh; S.typ = S.porovnat ? S.typ : b.dataset.typ; S.infoTyp = b.dataset.typ; zmenaDruhu(); }
});
TYPY.forEach(typ => $('#tab-' + typ).addEventListener('click', () => { S.typ = typ; S.porovnat = false; S.infoTyp = typ; zmenaDruhu(); }));
$('#btnPorovnat').addEventListener('click', () => { S.porovnat = !S.porovnat; if (!S.porovnat) S.infoTyp = S.typ; zmenaDruhu(); });

function zmenaDruhu() {
  S.t = 0; S.ciel = null;
  zostavOsu(); vykresliVyber(); vykresliOsu();
  TYPY.forEach(typ => { KARTY[typ].bg.innerHTML = SCENY[S.druh[typ]].bg(); KARTY[typ].last = ''; });
  POSL = {}; S.spina = true;
}

/* časová os: čipy štádií + pás s úsekmi fáz */
function vykresliOsu() {
  TYPY.forEach(typ => {
    const row = $('#stRow-' + typ), d = DATA.druhy[S.druh[typ]];
    row.hidden = !S.porovnat && S.typ !== typ;
    let h = S.porovnat ? `<span class="lab">${DATA.ui[typ]}:</span>` : '';
    d.stadia.forEach((st, i) => {
      if (i) h += '<span class="sip">→</span>';
      if (S.porovnat && typ === 'neuplna' && st.rola === 'dosp') h += `<span class="duch">${DATA.ui.chybaKukla.toLowerCase().replace('toto štádium', 'kukla')}</span><span class="sip">→</span>`;
      h += `<button data-typ="${typ}" data-st="${i}" class="${S.porovnat && st.rola === 'kuk' ? 'navyse' : ''}"><i style="background:${FARBY_ROL[st.rola]}"></i>${st.nazov}</button>`;
    });
    row.innerHTML = h;
  });
  const osa = $('#osa');
  osa.querySelectorAll('button').forEach(b => b.remove());
  OSA.forEach((o, i) => {
    const b = document.createElement('button');
    const typ = S.porovnat ? 'uplna' : S.typ, fz = o.f[typ] || o.f.neuplna;
    const rola = DATA.druhy[S.druh[typ]].stadia[stadiumFazy(o.id, typ)].rola;
    b.style.flexGrow = o.dur; b.style.background = FARBY_ROL[rola];
    if (S.porovnat && (o.id === 'zakuklenie' || o.id === 'kukla')) b.classList.add('navyse');
    b.title = fz.nazov; b.setAttribute('aria-label', (i + 1) + '. ' + fz.nazov);
    b.addEventListener('click', () => skok(o.start));
    osa.insertBefore(b, $('#ukaz'));
  });
}
document.addEventListener('click', e => {
  const b = e.target.closest('.stRow button'); if (!b) return;
  const typ = b.dataset.typ, st = +b.dataset.st;
  const i = OSA.findIndex(o => o.f[typ] && stadiumFazy(o.id, typ) === st);
  S.infoTyp = typ;
  if (i >= 0) skok(OSA[i].start);
  vykresliInfo(true);
  if (innerWidth < 1100) $('#stadiumCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});
function skok(t) { S.t = t + 0.001; S.ciel = null; S.spina = true; }

/* ovládanie */
function nastavPlay() { $('#btnPlay').textContent = S.beh ? DATA.ui.pauza : DATA.ui.spustit; }
$('#btnPlay').addEventListener('click', () => { S.beh = !S.beh; S.ciel = null; nastavPlay(); });
function krok() {
  const i = indexOsy(S.t), o = OSA[i];
  let ciel = o.start + o.dur;
  if (ciel - S.t < 0.05) {
    if (i + 1 < OSA.length) ciel = OSA[i + 1].start + OSA[i + 1].dur;
    else { S.t = 0; ciel = OSA[0].dur; }
  }
  S.ciel = ciel - 1e-4; S.beh = true; nastavPlay();
}
$('#btnKrok').addEventListener('click', krok);
$('#rychl').addEventListener('input', e => { S.rychl = +e.target.value; $('#rychlVal').textContent = String(S.rychl).replace('.', ',') + '×'; });
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space' && !e.target.closest('button')) { e.preventDefault(); $('#btnPlay').click(); }
  if (e.code === 'ArrowRight' && !e.target.closest('input')) krok();
});

/* „Čo sa práve deje“ */
let POSL = {};
function vykresliDeje(i) {
  const o = OSA[i];
  let h = `<div id="dejeKrok">${sablona(DATA.ui.krokX, { i: i + 1, n: OSA.length })}</div>`;
  if (!S.porovnat) {
    const f = o.f[S.typ];
    h += `<div id="dejeNazov">${f.nazov}</div><p>${f.text}</p>`;
  } else {
    TYPY.forEach(typ => {
      const d = DATA.druhy[S.druh[typ]], f = o.f[typ];
      h += `<div class="dejeBlok"><h4>${DATA.typy[typ].nazov} – ${d.nazov}</h4>`
        + (f ? `<div id="dejeNazov" style="font-size:18px">${f.nazov}</div><p>${f.text}</p>` : `<p>${typ === 'neuplna' && (o.id === 'zakuklenie' || o.id === 'kukla') ? DATA.ui.chyba : '…'}</p>`) + '</div>';
    });
  }
  $('#dejeObsah').innerHTML = h;
  // porovnávacia tabuľka – zvýraznenie riadku
  if (S.porovnat) document.querySelectorAll('#porovTab tr[data-k]').forEach(tr => tr.classList.toggle('on', tr.dataset.k.split(',').includes(o.id)));
}
function vykresliPorovnanie() {
  const P = DATA.porovnanie;
  $('#porovTab').innerHTML = `<tr>${P.hlavicka.map(x => `<th>${x}</th>`).join('')}</tr>` + P.riadky.map(r => `<tr data-k="${r.kluce.join(',')}" class="${r.spol ? 'spol' : 'nav'}"><td>${r.nazov}</td><td>${r.u}</td><td>${r.n}</td></tr>`).join('');
}

/* karta Štádium */
function vykresliInfo(flash) {
  const typ = S.porovnat ? S.infoTyp : S.typ, d = DATA.druhy[S.druh[typ]];
  const st = stavPre(typ, indexOsy(S.t)), si = stadiumFazy(st.f.id, typ), x = d.stadia[si];
  const key = typ + d.nazov + si;
  if (POSL.info !== key) {
    POSL.info = key;
    $('#stNazov').innerHTML = `<i style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${FARBY_ROL[x.rola]};margin-right:8px"></i>${x.nazov}${x.odb ? ` <small>(${x.odb})</small>` : ''}`;
    $('#stPriklad').innerHTML = `${DATA.typy[typ].nazov} · ${DATA.ui.zivocich ? '' : ''}príklad: <b>${d.priklad}</b>`;
    const P = DATA.ui.polia;
    $('#stInfo').innerHTML = Object.keys(P).map(k => `<dt>${P[k]}</dt><dd>${x[k]}</dd>`).join('');
  }
  if (flash) { const c = $('#stadiumCard'); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); }
}

/* vykreslenie jedného snímku hlavnej animácie */
function vykresli() {
  const i = indexOsy(S.t), o = OSA[i];
  const typy = S.porovnat ? TYPY : [S.typ];
  typy.forEach(typ => {
    const k = KARTY[typ], st = stavPre(typ, i), d = DATA.druhy[S.druh[typ]];
    k.dyn.innerHTML = SCENY[S.druh[typ]].dyn(st.f.id, st.p, S.t);
    const kuk = S.porovnat && (o.id === 'zakuklenie' || o.id === 'kukla');
    const key = typ + S.druh[typ] + st.f.id + S.porovnat + o.id;
    if (k.last !== key) {
      k.last = key;
      const sx = d.stadia[stadiumFazy(st.f.id, typ)];
      k.st.textContent = `${d.nazov}: ${sx.rola === 'dosp' ? 'dospelec (imágo)' : sx.nazov + (sx.odb ? ' (' + sx.odb + ')' : '')}`;
      k.fz.textContent = st.f.nazov;
      k.sez.textContent = st.f.sezona || '';
      const chyba = kuk && typ === 'neuplna';
      k.root.classList.toggle('chyba', chyba);
      k.root.classList.toggle('navyse', kuk && typ === 'uplna');
      k.root.classList.toggle('spol', S.porovnat && !kuk);
      k.chyba.hidden = !chyba; k.chyba.innerHTML = DATA.ui.chyba;
      k.tag.className = 'tag' + (S.porovnat ? (kuk ? (typ === 'uplna' ? ' navyse' : ' chyba') : ' spol') : '');
      k.tag.textContent = S.porovnat ? (kuk ? (typ === 'uplna' ? DATA.ui.navyse : DATA.ui.chybaKukla) : DATA.ui.spolocne) : '';
    }
  });
  $('#ukaz').style.left = (S.t / TOT * 100) + '%';
  if (POSL.i !== i || POSL.osa !== OSA) {
    POSL.i = i; POSL.osa = OSA;
    $('#osa').querySelectorAll('button').forEach((b, j) => b.classList.toggle('on', j === i));
    TYPY.forEach(typ => {
      const st = stavPre(typ, i), si = stadiumFazy(st.f.id, typ);
      document.querySelectorAll('#stRow-' + typ + ' button').forEach(b => b.classList.toggle('on', +b.dataset.st === si));
    });
    vykresliDeje(i);
  }
  vykresliInfo(false);
}

/* =====================================================================
   MALÉ ANIMÁCIE (Prečo, Omyly) – bežia stále, len keď sú na obrazovke
   ===================================================================== */
const MINI = {
  mPreco1(c) {
    let s = '<rect width="400" height="230" fill="#0b1626"/>';
    s += `<path d="M10,205 C40,120 150,112 192,140 C200,182 120,220 10,205Z" fill="#4b9650" stroke="#3b7a40" stroke-width="2"/>`;
    const k = (c * .12) % 1;
    for (let i = 0; i < 4; i++) { const v = cl(k * 5 - i); if (v > 0) s += `<ellipse cx="${60 + i * 26}" cy="${183}" rx="${r1(9 * v)}" ry="${r1(6 * v)}" fill="#0b1626" stroke="#2f6b37" stroke-width="1.5"/>`; }
    s += G(tf(70 + 105 * k, 168, 0, .55), housenica({ cas: c, pohyb: 1 }), Math.min(1, k * 8, (1 - k) * 8));
    s += `<line x1="200" y1="44" x2="200" y2="222" stroke="#3a4a6a" stroke-width="2" stroke-dasharray="6 6"/>`;
    s += `<path d="M300,150 C296,180 290,200 285,230" stroke="#4f8a3a" stroke-width="5" fill="none"/>`;
    for (let i = 0; i < 8; i++) s += `<ellipse cx="300" cy="${150 - 17}" rx="9" ry="17" fill="${i % 2 ? '#b56cc8' : '#c77dd8'}" transform="rotate(${i * 45} 300 150)"/>`;
    s += `<circle cx="300" cy="150" r="10" fill="#f2c94c"/>` + G(tf(300, 138, 0, .8), motyl({ k: 1, mav: .62 + .35 * Math.sin(c * 2.5), prob: 1 }));
    s += `<text x="100" y="30" text-anchor="middle" font-size="20" fill="#7fdc8f" font-weight="700">Larva: listy</text><text x="300" y="30" text-anchor="middle" font-size="20" fill="#6fb4ff" font-weight="700">Dospelec: nektár</text>`;
    return s;
  },
  mPreco2(c) {
    const T = DATA.preco.b.os, X0 = 46, Y0 = 200, XS = [90, 130, 172, 216, 262], YS = [182, 164, 142, 116, 86, 52];
    let s = '<rect width="400" height="240" fill="#0b1626"/>';
    s += `<path d="M${X0},20 L${X0},${Y0} L300,${Y0}" stroke="#a3adc6" stroke-width="2" fill="none"/><path d="M${X0 - 5},28 L${X0},18 L${X0 + 5},28 M292,${Y0 - 5} L302,${Y0} L292,${Y0 + 5}" stroke="#a3adc6" stroke-width="2" fill="none"/>`;
    s += `<text x="${X0 + 8}" y="22" font-size="17" fill="#a3adc6">${T.y}</text><text x="296" y="${Y0 + 26}" font-size="17" fill="#a3adc6" text-anchor="end">${T.x}</text>`;
    const u = (c * .1) % 1, xe = X0 + u * 250;
    let d = `M${X0},${YS[0]}`; let akt = 0;
    for (let i = 0; i < XS.length; i++) {
      if (xe < XS[i]) { d += ` L${r1(xe)},${YS[i]}`; break; }
      d += ` L${XS[i]},${YS[i]} L${XS[i]},${YS[i + 1]}`; akt = i + 1;
      if (i === XS.length - 1) d += ` L${r1(xe)},${YS[i + 1]}`;
    }
    XS.forEach((x, i) => s += `<line x1="${x}" y1="${Y0}" x2="${x}" y2="${YS[i + 1]}" stroke="#ffd88a" stroke-width="1" stroke-dasharray="3 4" opacity=".5"/>`);
    s += `<path d="${d}" stroke="#7fdc8f" stroke-width="4" fill="none" stroke-linejoin="round"/>`;
    s += `<circle cx="${r1(xe)}" cy="${YS[akt]}" r="6" fill="#ffd88a"/>`;
    s += `<text x="${XS[0] + 4}" y="${Y0 - 6}" font-size="16" fill="#ffd88a">↑ ${T.z}</text><text x="${XS[4] + 6}" y="${YS[5] - 10}" font-size="16" fill="#6fb4ff">${T.d}</text>`;
    // vpravo kobylka – veľkosť podľa aktuálneho stupňa, pri zvlečení blysne
    const blik = XS.some(x => Math.abs(xe - x) < 6);
    const sc = .32 + akt * .1;
    s += G(tf(352, 150, 0, sc), kobylka({ nymfa: akt < 5, kw: akt >= 5 ? 1 : 0, zakl: akt >= 3 && akt < 5 ? .3 * (akt - 2) : 0, klad: akt >= 5 }));
    if (blik) s += `<circle cx="352" cy="150" r="46" fill="none" stroke="#ffd88a" stroke-width="3" opacity=".8"/>`;
    return s;
  },
  mKukla(c) {
    const p = (c * .09) % 1;
    let s = '<rect width="400" height="230" fill="#0b1626"/><rect x="62" y="0" width="12" height="230" fill="#6b7d3a"/>';
    s += G(tf(68, 205, 0, 1.6), kuklaMotyl({ farba: '#8db35a', pas: 1 })) + lupa(265, 112, 92, p, 'motyl', 80, 120);

  },

    let s = '<rect width="400" height="250" fill="#0b1626"/>';
    s += G(tf(340, 72, 0, 1.45), housenica({ cas: c, pohyb: .6, zvyraz: 1 }));

    s += `<path d="M300,110 L300,96 M170,110 L170,100 M120,110 L120,100" stroke="#a3adc6" stroke-width="1.5"/>`;
    s += dazdovka(60, 340, 190, c) + `<text x="200" y="236" text-anchor="middle" font-size="18" fill="#e3a3a0" font-weight="700">${T.dazdovka}</text>`;
    return s;
  },
  mZamotok(c) {

    let s = '<rect width="400" height="260" fill="#0b1626"/><rect x="94" y="0" width="12" height="190" fill="#6b7d3a"/>';

    s += `<path d="M220,48 L390,40" stroke="#6b5a3a" stroke-width="8" stroke-linecap="round"/>`;
    let nit = ''; for (let i = 0; i < 18; i++) { const a = rnd(i) * PI, b = a + 1.2 + rnd(i + 3); nit += `<path d="M${r1(300 + 34 * Math.cos(a))},${r1(120 + 54 * Math.sin(a))} Q300,${r1(120 + (rnd(i + 5) - .5) * 60)} ${r1(300 + 34 * Math.cos(b))},${r1(120 + 54 * Math.sin(b))}" stroke="#d8cfa8" stroke-width="1" fill="none" opacity=".7"/>`; }
    s += `<path d="M296,46 L300,68 M306,45 L302,68" stroke="#e8e0c0" stroke-width="1.5"/><ellipse cx="300" cy="120" rx="36" ry="56" fill="#f1ead2" stroke="#cfc49c" stroke-width="2"/>${nit}`;
    s += `<path d="M300,64 A36,56 0 0 1 300,176 Z" fill="#20180c" opacity=".85"/><ellipse cx="304" cy="122" rx="14" ry="30" fill="#8a5a2a"/>` + [-14, -4, 6, 16].map(y => `<path d="M291,${122 + y} Q304,${126 + y} 317,${122 + y}" stroke="#5a3a1a" stroke-width="1.2" fill="none"/>`).join('');
    s += `<path d="M300,64 A36,56 0 0 1 300,176" stroke="#ffd88a" stroke-width="1.5" fill="none" stroke-dasharray="4 4" opacity="${(.5 + .4 * Math.sin(c * 3)).toFixed(2)}"/>`;
    s += `<text x="300" y="214" text-anchor="middle" font-size="18" fill="#ffd88a" font-weight="700">${T.zamotok}</text><text x="300" y="238" text-anchor="middle" font-size="17" fill="#a3adc6">${T.zamotok2}</text>`;
    return s;
  }
};
const VIDNO = {};
function vykresliOmyly() {
  const box = $('#omylyGrid'), ids = { kukla: ['mKukla', '0 0 400 230'], nohy: ['mNohy', '0 0 400 250'], zamotok: ['mZamotok', '0 0 400 260'] };
  box.innerHTML = DATA.omyly.polozky.map(o => {
    const [id, vb] = ids[o.anim];
    return `<div><figure><svg id="${id}" viewBox="${vb}"></svg>${o.anim === 'kukla' ? '<figcaption id="capKukla"></figcaption>' : ''}</figure>`
      + `<div class="box omyl"><b class="h">Omyl</b>${o.omyl}</div><div class="box pravda"><b class="h">Ako je to naozaj</b>${o.pravda}</div></div>`;
  }).join('');
}

/* =====================================================================
   KVÍZ
   ===================================================================== */
function kviz() {
  const box = $('#kvizBox'), K = DATA.kviz, n = K.otazky.length;
  box.innerHTML = ''; $('#kvizVysl').textContent = '';
  let skore = 0, hotovo = 0;
  K.otazky.forEach((q, i) => {
    const div = document.createElement('div'); div.className = 'otazka';
    div.innerHTML = `<p class="q"><b>${i + 1}.</b> ${q.otazka}</p>`;
    const opts = document.createElement('div'); opts.className = 'moznosti';
    const fb = document.createElement('div'); fb.className = 'fb';
    // možnosti zamiešame, aby správna nebola vždy prvá
    const poradie = q.moznosti.map((_, j) => j).sort(() => Math.random() - .5);
    const tlac = [];
    poradie.forEach(j => {
      const b = document.createElement('button'); b.textContent = q.moznosti[j]; tlac[j] = b;
      b.addEventListener('click', () => {
        if (div.dataset.hotovo) return;
        div.dataset.hotovo = 1; hotovo++;
        const ok = j === q.spravna; if (ok) skore++;
        b.classList.add(ok ? 'ok' : 'zle'); tlac[q.spravna].classList.add('ok');
        [...opts.children].forEach(x => x.disabled = true);
        fb.className = 'fb ' + (ok ? 'ok' : 'zle');
        fb.innerHTML = `<b>${ok ? K.spravne : K.nespravne}</b> ${q.vysvetlenie}`;
        if (hotovo === n) $('#kvizVysl').textContent = sablona(K.vysledok, { s: skore, n });
      });
      opts.appendChild(b);
    });
    div.appendChild(opts); div.appendChild(fb); box.appendChild(div);
  });
}
$('#kvizZnova').addEventListener('click', kviz);

/* =====================================================================
   ŠTART A HLAVNÁ SLUČKA (requestAnimationFrame, časovanie podľa skutočného času)
   ===================================================================== */
vyplnTexty();
vykresliOmyly();
vykresliPorovnanie();
kviz();
zmenaDruhu();
nastavPlay();
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(e => VIDNO[e.target.id] = e.isIntersecting));
  Object.keys(MINI).forEach(id => { const el = document.getElementById(id); if (el) io.observe(el); });
} else Object.keys(MINI).forEach(id => VIDNO[id] = true);

let posledny = performance.now(), realny = 0;
function snimka(now) {
  const dt = Math.min(0.1, (now - posledny) / 1000); posledny = now; realny += dt;
  if (S.beh) {
    S.t += dt * S.rychl;
    if (S.ciel != null && S.t >= S.ciel) { S.t = S.ciel; S.ciel = null; S.beh = false; nastavPlay(); }
    if (S.t >= TOT) S.t -= TOT;
    S.spina = true;
  }
  if (S.spina) { S.spina = false; vykresli(); }
  for (const id in MINI) if (VIDNO[id]) { const el = document.getElementById(id); if (el) el.innerHTML = MINI[id](realny); }
  requestAnimationFrame(snimka);
}
requestAnimationFrame(snimka);
</script>
